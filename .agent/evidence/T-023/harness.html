<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../../public/boutique/css/dist/base.css">
<link rel="stylesheet" href="../../../public/boutique/css/dist/components.css">
<link rel="stylesheet" href="../../../public/boutique/css/dist/desktop.css">
<style>body{margin:0;background:#f4f4f4;padding:40px;}</style>
</head>
<body>
  <div class="k-modal k-modal--open" id="k-modal" style="position:static;max-width:960px;margin:0 auto;">
    <div class="k-modal-scroll">
      <div class="k-modal-product-zone">
        <div class="k-modal-img-wrap">
          <div class="k-modal-carousel" id="k-modal-carousel">
            <div class="k-modal-carousel-track" id="k-modal-carousel-track">
              <img id="k-modal-img" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MDAiIGhlaWdodD0iODAwIj48cmVjdCB3aWR0aD0iODAwIiBoZWlnaHQ9IjgwMCIgZmlsbD0iI2VlZTVkOCIvPjwvc3ZnPg==" alt="" class="k-modal-slide">
            </div>
          </div>
        </div>
        <div class="k-modal-details" id="k-modal-details">
          <div class="k-modal-info">
            <div class="k-modal-name-row">
              <h2 id="k-modal-name">Robe Dubaï — Golden Performance</h2>
            </div>
            <span class="k-modal-sku" id="k-modal-sku">REF ROB-001</span>
            <div class="k-modal-price-row">
              <span class="k-modal-price" id="k-modal-price">249,00 €</span>
            </div>
            <p class="k-modal-desc" id="k-modal-desc">Robe fluide, coupe ample, tissu technique respirant.</p>
            <div class="k-modal-meta">
              <span id="k-modal-cat">Golden Performance Series</span>
              <span id="k-modal-stock">En stock</span>
            </div>
          </div>
        </div>
        <div class="k-modal-actions" id="k-modal-actions">
          <div class="k-qty">
            <button class="k-qty-btn" id="k-qty-minus">−</button>
            <span class="k-qty-val" id="k-qty-val">1</span>
            <button class="k-qty-btn" id="k-qty-plus">+</button>
          </div>
          <button class="k-add-cart-btn" id="k-add-cart-btn">
            <img src="../../../public/images/panier_tresse_vert.png" width="20" height="20" alt="" aria-hidden="true">
            Ajouter au panier
          </button>
          <button class="k-buy-now-btn" id="k-buy-now-btn"><span aria-hidden="true">⚡</span> Acheter maintenant</button>
        </div>
        <div class="k-modal-subtotal" id="k-modal-subtotal">Sous-total : 249,00 €</div>
      </div>
    </div>
  </div>
</body>
</html>
