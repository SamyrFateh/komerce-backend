# ============================================================
# KOMERCE — Configuration Railway
# Filtre les déploiements pour éviter les builds inutiles
# sur commits docs-only ou auto-cartography
# ============================================================

[build]
installCommand = "npm ci --omit=dev"

# Railway ne déploiera QUE si un fichier matchant ces patterns change.
# Les commits qui ne touchent que docs/, .github/ ou autres surfaces hors
# runtime peuvent ainsi être ignorés. `watchPatterns` appartient au bloc
# build dans le schéma Railway actuel.
watchPatterns = [
  "routes/**",
  "services/**",
  "middleware/**",
  "utils/**",
  "validators/**",
  "db/**",
  "boutique/**",
  "public/boutique/**",
  "dashboard-app/**",
  "public/dashboards/**",
  "bootstrap/**",
  "migrations/**",
  "scripts/**",
  "server.js",
  "db.js",
  "package.json",
  "package-lock.json",
  "railway.toml"
]

[deploy]
# Explicit one-shot repair: migrations first, then restore the canonical
# category/subcategory mapping for the already-published 63-product CJ lot.
# This is restored to migrations-only immediately after production audit.
preDeployCommand = ["node scripts/migrate.js && node scripts/cj-real-showcase-taxonomy-repair.js"]
startCommand = "node server.js"
