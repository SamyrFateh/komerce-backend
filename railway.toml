# ============================================================
# KOMERCE — Configuration Railway
# Filtre les déploiements pour éviter les builds inutiles
# sur commits docs-only ou auto-cartography
# ============================================================

[build]
installCommand = "npm ci --omit=dev"

[deploy]
releaseCommand = "node scripts/migrate.js"
startCommand = "node server.js"

# Railway ne déploiera QUE si un fichier matchant ces patterns change.
# Les commits qui ne touchent que docs/, .github/, scripts/ seront ignorés.
watchPatterns = [
  "routes/**",
  "middleware/**",
  "utils/**",
  "validators/**",
  "db/**",
  "boutique/**",
  "public/boutique/**",
  "dashboard-app/**",
  "public/dashboards/**",
  "bootstrap/**",
  "migrations/**",
  "scripts/**",
  "server.js",
  "db.js",
  "package.json",
  "package-lock.json",
  "railway.toml"
]
