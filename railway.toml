# ============================================================
# KOMERCE — Configuration Railway
# Filtre les déploiements pour éviter les builds inutiles
# sur commits docs-only ou auto-cartography
# ============================================================

[build]
installCommand = "npm ci --omit=dev"

# Railway ne déploiera QUE si un fichier matchant ces patterns change.
# Les commits qui ne touchent que docs/, .github/ ou autres surfaces hors
# runtime peuvent ainsi être ignorés. `watchPatterns` appartient au bloc
# build dans le schéma Railway actuel.
watchPatterns = [
  "routes/**",
  "services/**",
  "middleware/**",
  "utils/**",
  "validators/**",
  "db/**",
  "boutique/**",
  "public/boutique/**",
  "dashboard-app/**",
  "public/dashboards/**",
  "bootstrap/**",
  "migrations/**",
  "scripts/**",
  "server.js",
  "db.js",
  "package.json",
  "package-lock.json",
  "railway.toml"
]

[deploy]
# One-shot operator run: migrate first, then populate only the guarded CJ
# sourcing pool. Railway accepts a single preDeploy array item, so the two
# commands are chained. The worker is resumable, requires
# KOMERCE_ALLOW_CJ_FULL_SYNC=1, and is hard-capped by code at 1000 clean
# candidates. This config is reverted immediately after the verified run.
preDeployCommand = ["node scripts/migrate.js && node scripts/cj-full-catalog-sync.js"]
startCommand = "node server.js"
