# ============================================================
# KOMERCE — Configuration Railway
# Filtre les déploiements pour éviter les builds inutiles
# sur commits docs-only ou auto-cartography
# ============================================================

[build]
installCommand = "npm ci --omit=dev"

# Railway ne déploiera QUE si un fichier matchant ces patterns change.
# Les commits qui ne touchent que docs/, .github/ ou autres surfaces hors
# runtime peuvent ainsi être ignorés. `watchPatterns` appartient au bloc
# build dans le schéma Railway actuel.
watchPatterns = [
  "routes/**",
  "services/**",
  "middleware/**",
  "utils/**",
  "validators/**",
  "db/**",
  "boutique/**",
  "public/boutique/**",
  "dashboard-app/**",
  "public/dashboards/**",
  "bootstrap/**",
  "migrations/**",
  "scripts/**",
  "server.js",
  "db.js",
  "package.json",
  "package-lock.json",
  "railway.toml"
]

[deploy]
# Read-only one-shot audit of the remote image health for every product
# currently active + available in Boutique. Restored to migrations-only
# immediately after the production result is captured.
preDeployCommand = ["node scripts/migrate.js && node scripts/catalog-image-health-audit.js"]
startCommand = "node server.js"
