<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0d">
  <title>Relais · Komerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0d0d0d; --bg2:#161616; --bg3:#1f1f1f;
      --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.15);
      --text:#f0f0f0; --text2:#999; --text3:#555;
      --green:#00e676; --green-dim:rgba(0,230,118,0.12);
      --amber:#ffab40; --amber-dim:rgba(255,171,64,0.12);
      --red:#ff5252; --red-dim:rgba(255,82,82,0.12);
      --blue:#40c4ff; --blue-dim:rgba(64,196,255,0.10);
      --purple:#ce93d8; --purple-dim:rgba(206,147,216,0.12);
      --mono:'IBM Plex Mono',monospace; --sans:'DM Sans',sans-serif;
      --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overscroll-behavior:none}
    #app{display:flex;flex-direction:column;height:100dvh}

    /* Header */
    #header{padding:calc(var(--safe-top) + 12px) 16px 12px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    #header-left{display:flex;flex-direction:column;gap:1px}
    #header-title{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.12em;text-transform:uppercase}
    #header-user{font-size:13px;color:var(--text3)}
    #alert-chip{padding:3px 8px;border-radius:4px;font-family:var(--mono);font-size:13px;display:none}
    #alert-chip.on{display:flex;align-items:center;gap:4px;border:1px solid rgba(255,82,82,.4);color:var(--red);background:var(--red-dim)}
    #alert-chip.cash{border-color:rgba(255,171,64,.4);color:var(--amber);background:var(--amber-dim)}

    /* Tabs */
    #tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
    .tab{flex:1;padding:10px 4px;font-size:13px;font-weight:500;color:var(--text3);text-align:center;cursor:pointer;border:none;background:none;position:relative;transition:color .2s;letter-spacing:.03em;user-select:none}
    .tab.active{color:var(--text)}
    .tab.active::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:2px;background:var(--green);border-radius:1px 1px 0 0}
    .tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-family:var(--mono);font-size:13px;font-weight:600;margin-left:4px}
    .tab-badge.on{background:var(--red);color:#fff}
    .tab-badge.off{background:var(--bg3);color:var(--text2)}

    /* Panels */
    #panels{flex:1;overflow:hidden;position:relative}
    .panel{position:absolute;inset:0;overflow-y:auto;display:none}
    .panel.active{display:block}

    /* KPI bar */
    .kpi-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 10px 0}
    .kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 10px;text-align:center}
    .kpi-val{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1;margin-bottom:3px}
    .kpi-lbl{font-size:13px;color:var(--text3);letter-spacing:.04em;text-transform:uppercase}
    .kpi.hl-green{border-color:rgba(0,230,118,.25)} .kpi.hl-green .kpi-val{color:var(--green)}
    .kpi.hl-blue{border-color:rgba(64,196,255,.25)} .kpi.hl-blue .kpi-val{color:var(--blue)}
    .kpi.hl-red{border-color:rgba(255,82,82,.25)} .kpi.hl-red .kpi-val{color:var(--red)}
    .kpi.hl-amber{border-color:rgba(255,171,64,.25)} .kpi.hl-amber .kpi-val{color:var(--amber)}

    /* Action buttons */
    .action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
    .action-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);transition:border-color .15s,color .15s,background .15s;-webkit-user-select:none;user-select:none}
    .action-btn:active{background:var(--bg3);border-color:var(--border-strong)}
    .action-btn.receive{border-color:rgba(64,196,255,.3);color:var(--blue)}
    .action-btn.remise{border-color:rgba(0,230,118,.3);color:var(--green)}
    .action-icon{font-size:28px}

    /* Sub-tabs (filter) */
    .filter-bar{display:flex;gap:6px;padding:10px 10px 8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
    .filter-bar::-webkit-scrollbar{display:none}
    .filter-btn{padding:7px 14px;border-radius:16px;border:1px solid var(--border);background:var(--bg2);font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
    .filter-btn.active{background:var(--bg3);border-color:var(--border-strong);color:var(--text)}

    /* Order cards */
    .order-list{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
    .order-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 14px 12px;cursor:pointer;transition:border-color .15s,background .15s;-webkit-user-select:none;user-select:none}
    .order-card:active{background:var(--bg3);border-color:var(--border-strong)}
    .order-card.urgent{border-color:rgba(255,82,82,.35)}
    .order-card.cash-pending{border-color:rgba(255,171,64,.35)}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
    .card-ref{font-family:var(--mono);font-size:13px;font-weight:600}
    .card-age{font-family:var(--mono);font-size:13px;color:var(--text3)}
    .card-client{font-size:13px;color:var(--text2);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-meta{display:flex;gap:5px;flex-wrap:wrap}
    .badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:13px;font-weight:500;letter-spacing:.02em;border:1px solid transparent}
    .badge.green{background:var(--green-dim);color:var(--green);border-color:rgba(0,230,118,.2)}
    .badge.amber{background:var(--amber-dim);color:var(--amber);border-color:rgba(255,171,64,.2)}
    .badge.red{background:var(--red-dim);color:var(--red);border-color:rgba(255,82,82,.2)}
    .badge.blue{background:var(--blue-dim);color:var(--blue);border-color:rgba(64,196,255,.2)}
    .badge.purple{background:var(--purple-dim);color:var(--purple);border-color:rgba(206,147,216,.2)}
    .badge.gray{background:var(--bg3);color:var(--text2)}

    /* Alerts strip */
    .alert-strip{margin:8px 10px 0;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px}
    .alert-strip.warning{background:var(--amber-dim);border:1px solid rgba(255,171,64,.25);color:var(--amber)}
    .alert-strip.danger{background:var(--red-dim);border:1px solid rgba(255,82,82,.25);color:var(--red)}
    .alert-strip.info{background:var(--blue-dim);border:1px solid rgba(64,196,255,.2);color:var(--blue)}

    /* Scan panel */
    .scan-wrap{padding:10px}
    .scan-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:8px}
    .scan-title{font-family:var(--mono);font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .field-label{font-size:13px;color:var(--text3);margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase}
    .field-input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;outline:none;transition:border-color .2s;text-align:center}
    .field-input:focus{border-color:var(--border-strong)}
    .field-input::placeholder{text-transform:none;letter-spacing:.01em;font-weight:400;color:var(--text3)}
    .field-input.pin{font-size:22px;letter-spacing:.18em}
    .field-group{margin-bottom:12px}
    .scan-result{margin-top:10px;border-radius:8px;padding:12px;font-size:13px;display:none}
    .scan-result.ok{display:block;background:var(--green-dim);border:1px solid rgba(0,230,118,.2);color:var(--green)}
    .scan-result.err{display:block;background:var(--red-dim);border:1px solid rgba(255,82,82,.2);color:var(--red)}

    /* Detail panel */
    #detail-panel{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
    #detail-panel.open{display:flex;transform:translateY(0)}
    #detail-header{padding:calc(var(--safe-top) + 10px) 16px 10px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
    #btn-back{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:18px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
    #detail-title{font-family:var(--mono);font-size:14px;font-weight:600;flex:1}
    #detail-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
    #detail-actions{padding:12px 12px calc(12px + var(--safe-bot));background:var(--bg2);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;flex-shrink:0}
    .section{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .section-head{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
    .section-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
    .info-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
    .info-label{color:var(--text3);flex-shrink:0}
    .info-val{color:var(--text);text-align:right;font-family:var(--mono);font-size:13px;word-break:break-all}
    .item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
    .item-row:last-child{border-bottom:none}
    .item-qty{font-family:var(--mono);font-size:13px;color:var(--amber);min-width:28px}
    .item-name{font-size:13px;flex:1}
    .timeline-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
    .timeline-row:last-child{border-bottom:none}
    .timeline-dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex-shrink:0;margin-top:3px}
    .timeline-dot.active{background:var(--green)}
    .timeline-content{flex:1}
    .timeline-status{font-weight:600;color:var(--text2);text-transform:uppercase;font-size:13px;letter-spacing:.06em}
    .timeline-date{color:var(--text3);font-size:13px;font-family:var(--mono)}

    /* Buttons */
    .btn{width:100%;padding:16px;border-radius:10px;border:none;cursor:pointer;font-family:var(--sans);font-size:16px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,transform .1s;-webkit-user-select:none;user-select:none}
    .btn:active{opacity:.85;transform:scale(.98)}
    .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
    .btn-primary{background:var(--green);color:#000}
    .btn-blue{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(64,196,255,.25)}
    .btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
    .btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,82,82,.25)}
    .btn-amber{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(255,171,64,.25)}
    .btn-row{display:flex;gap:8px}
    .btn-row .btn{flex:1;padding:13px 8px;font-size:13px}

    /* Modals */
    .modal-backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.8);display:none;align-items:flex-end;justify-content:center}
    .modal-backdrop.open{display:flex}
    .modal-sheet{background:var(--bg2);border-radius:18px 18px 0 0;border:1px solid var(--border);border-bottom:none;width:100%;max-width:480px;padding:20px 16px calc(16px + var(--safe-bot));display:flex;flex-direction:column;gap:14px}
    .sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 4px}
    .sheet-title{font-family:var(--mono);font-size:14px;font-weight:600}
    textarea.field-input{min-height:70px;resize:none;font-size:14px;text-transform:none;letter-spacing:.01em;font-weight:400;text-align:left}
    .inc-types{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .inc-type-btn{padding:10px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
    .inc-type-btn.selected{border-color:rgba(255,82,82,.5);background:var(--red-dim);color:var(--red)}

    /* Toast */
    #toast{position:fixed;bottom:calc(20px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:14px;font-weight:500;color:var(--text);z-index:100;white-space:nowrap;transition:transform .25s cubic-bezier(.4,0,.2,1),opacity .25s;opacity:0;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.5)}
    #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    #toast.success{border-color:rgba(0,230,118,.4);color:var(--green)}
    #toast.error{border-color:rgba(255,82,82,.4);color:var(--red)}

    /* Misc */
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-wrap{display:flex;align-items:center;justify-content:center;padding:40px}
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:10px;color:var(--text3);font-size:13px;text-align:center}
    .empty-icon{font-size:36px;opacity:.4}
    .pin-display{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--green);letter-spacing:.12em;text-align:center;padding:12px;background:var(--green-dim);border:1px solid rgba(0,230,118,.2);border-radius:8px}
  </style>
</head>

<div id="app">
  <header id="header">
    <div id="header-left">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" aria-label="Komerce" style="width:90px;height:auto;display:block;margin-bottom:2px">

      </svg>
      <div id="header-user">—</div>
    </div>
    <div id="alert-chip"></div>
  </header>
  <nav id="tabs">
    <button class="tab active" data-tab="accueil" >Accueil</button>
    <button class="tab" data-tab="disponibles" >Disponibles <span class="tab-badge off" id="bdispo"></span></button>
    <button class="tab" data-tab="approche" >En approche <span class="tab-badge off" id="bapproche"></span></button>
    <button class="tab" data-tab="collectes" >Collectés</button>
  </nav>
  <div id="panels">
    <!-- ACCUEIL -->
    <div class="panel active" id="panel-accueil">
      <div id="kpis-wrap" class="kpi-bar">
        <div class="kpi hl-blue"><div class="kpi-val" id="kpi-transit">—</div><div class="kpi-lbl">En approche</div></div>
        <div class="kpi hl-green"><div class="kpi-val" id="kpi-dispo">—</div><div class="kpi-lbl">Disponibles</div></div>
        <div class="kpi hl-amber"><div class="kpi-val" id="kpi-cash">—</div><div class="kpi-lbl">Cash à encaisser</div></div>
      </div>
      <div id="alertes-wrap"></div>
      <div class="action-row">
        <button class="action-btn receive" id="btn-receive">
          <span class="action-icon">📥</span>Réception colis
        </button>
        <button class="action-btn remise" id="btn-remise">
          <span class="action-icon">🤝</span>Remise client
        </button>
      </div>
    </div>
    <!-- SCAN (panel overlay in accueil, shown dynamically) -->

    <!-- DISPONIBLES -->
    <div class="panel" id="panel-disponibles">
      <div class="order-list" id="list-disponibles"><div class="loading-wrap"><div class="spinner"></div></div></div>
    </div>

    <!-- EN APPROCHE -->
    <div class="panel" id="panel-approche">
      <div class="order-list" id="list-approche"><div class="loading-wrap"><div class="spinner"></div></div></div>
    </div>

    <!-- COLLECTÉS -->
    <div class="panel" id="panel-collectes">
      <div class="order-list" id="list-collectes"><div class="loading-wrap"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>

<!-- SCAN PANEL (slide-up) -->
<div id="scan-panel" style="position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)">
  <div id="scan-panel-header" style="padding:calc(var(--safe-top) + 10px) 16px 10px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0">
    <button id="btn-scan-back" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:18px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0" >←</button>
    <div id="scan-title" style="font-family:var(--mono);font-size:14px;font-weight:600">Scanner</div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:12px">
    <div class="scan-card">
      <div id="scan-desc" style="font-size:13px;color:var(--text2);margin-bottom:14px"></div>
      <div class="field-group">
        <div class="field-label" id="scan-ref-label">Référence commande</div>
        <input class="field-input" type="text" id="scan-ref" placeholder="KOM-2026-XXXXX" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field-group" id="pin-group" style="display:none">
        <div class="field-label">Code PIN client (6 chiffres)</div>
        <input class="field-input pin" type="tel" id="scan-pin" placeholder="• • • • • •" maxlength="6" inputmode="numeric" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="btn-scan-confirm" >✅ Confirmer</button>
      <div class="scan-result" id="scan-result"></div>
    </div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div id="detail-panel">
  <div id="detail-header">
    <button id="btn-back" >←</button>
    <div id="detail-title">—</div>
    <div style="flex:1"></div>
    <div id="detail-status-badge"></div>
  </div>
  <div id="detail-body"></div>
  <div id="detail-actions"></div>
</div>

<!-- INCIDENT MODAL -->
<div class="modal-backdrop" id="inc-modal" >
  <div class="modal-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">🚨 Signaler un incident</div>
    <div>
      <div class="field-label">Type</div>
      <div class="inc-types">
        <div class="inc-type-btn" data-type="retard" >Retard livraison</div>
        <div class="inc-type-btn" data-type="colis_endommage" >Colis endommagé</div>
        <div class="inc-type-btn" data-type="colis_perdu" >Colis perdu</div>
        <div class="inc-type-btn" data-type="paiement" >Problème paiement</div>
        <div class="inc-type-btn" data-type="client_absent" >Client absent</div>
        <div class="inc-type-btn" data-type="autre" >Autre</div>
      </div>
    </div>
    <div>
      <div class="field-label">Description</div>
      <textarea class="field-input" id="inc-desc" placeholder="Décrivez la situation…"></textarea>
    </div>
    <button class="btn btn-danger" id="btn-inc-confirm">🚨 Envoyer</button>
    <button class="btn btn-secondary" id="btn-inc-cancel">Annuler</button>
  </div>
</div>

<!-- CASH MODAL -->
<div class="modal-backdrop" id="cash-modal" >
  <div class="modal-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">💰 Encaissement cash</div>
    <div id="cash-detail" style="font-size:14px;color:var(--text2);padding:8px 0"></div>
    <button class="btn btn-primary" id="btn-cash-confirm">✅ Confirmer encaissement</button>
    <button class="btn btn-secondary" id="btn-cash-cancel">Annuler</button>
  </div>
</div>

<div id="toast"></div>

<script src="js/relais.js"></script>
</body>
</html>
