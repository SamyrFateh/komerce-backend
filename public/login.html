<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Komerce — Connexion admin</title>
  <style>
    /* tokens inline — pas de dépendance externe */
    :root {
      --kmc-navy:    #0F1A2E;
      --kmc-navy-2:  #1A2540;
      --kmc-amber:   #F4B860;
      --kmc-green:   #16A34A;
      --kmc-red:     #DC2626;
      --kmc-red-bg:  #FEE2E2;
      --bg-page:     #F8FAFC;
      --bg-card:     #FFFFFF;
      --text-primary:   #0F172A;
      --text-secondary: #475569;
      --text-tertiary:  #94A3B8;
      --text-on-dark:   #F1F5F9;
      --border-color:   #E2E8F0;
      --border-radius:  8px;
      --shadow:     0 1px 3px 0 rgba(0,0,0,.10), 0 1px 2px 0 rgba(0,0,0,.06);
      --shadow-lg:  0 10px 15px -3px rgba(0,0,0,.10);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--kmc-navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 400px;
      padding: 40px 36px 36px;
    }

    /* Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand-logo {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .brand-logo svg { width: 44px; height: 44px; }
    /* tokens logo (repris depuis boutique) */
    .brand-logo { --cta-green: #82C478; --coral: #E8835A; --ocean: #82C478; }
    .brand-text { line-height: 1.2; }
    .brand-name {
      font-size: 1.125rem; font-weight: 700;
      color: var(--text-primary);
    }
    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      margin-top: 1px;
    }

    /* Form */
    h1 {
      font-size: 1.25rem; font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 0.8125rem; font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--border-radius);
      font-size: 0.9375rem;
      font-family: inherit;
      color: var(--text-primary);
      background: #fff;
      transition: border-color .15s;
      outline: none;
      -webkit-appearance: none;
    }
    input:focus {
      border-color: var(--kmc-navy-2, #1A2540);
      box-shadow: 0 0 0 3px rgba(15,26,46,.10);
    }
    input.is-error { border-color: var(--kmc-red); }

    .error-banner {
      display: none;
      background: var(--kmc-red-bg);
      color: var(--kmc-red);
      font-size: 0.8125rem;
      border-radius: var(--border-radius);
      padding: 10px 14px;
      margin-bottom: 18px;
    }
    .error-banner.is-visible { display: block; }

    .btn-submit {
      width: 100%;
      padding: 11px 0;
      background: var(--kmc-navy);
      color: var(--kmc-amber);
      border: none;
      border-radius: var(--border-radius);
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, opacity .15s;
      margin-top: 4px;
    }
    .btn-submit:hover  { background: #1A2540; }
    .btn-submit:active { opacity: .85; }
    .btn-submit:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* Spinner inline dans le bouton */
    .btn-submit .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(244,184,96,.35);
      border-top-color: var(--kmc-amber);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    .btn-submit.is-loading .spinner { display: inline-block; }
    .btn-submit.is-loading .btn-label { opacity: .7; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

      <div class="brand-sub">Espace administration</div>
    </div>

    <h1>Connexion</h1>
    <p class="subtitle">Accès réservé aux administrateurs.</p>

    <div class="error-banner" id="error-banner" role="alert"></div>

    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email"
             placeholder="admin@komerce.km"
             autocomplete="email" autocapitalize="none"
             autofocus />
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password"
             placeholder="••••••••"
             autocomplete="current-password" />
    </div>

    <button class="btn-submit" id="btn-submit" type="button">
      <span class="spinner" aria-hidden="true"></span>
      <span class="btn-label">Se connecter</span>
    </button>
  </div>

  <script src="js/login.js"></script>

</html>
