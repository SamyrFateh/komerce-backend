<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gBeaute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFAF5"/>
      <stop offset="100%" stop-color="#F5DFD0"/>
    </linearGradient>
    <filter id="grainBeaute" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0.06 0"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#gBeaute)"/>
  <rect width="200" height="200" filter="url(#grainBeaute)" opacity="0.5"/>
  <g stroke="#2A3E2C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
    <!-- Bouchon -->
    <rect x="88" y="50" width="24" height="16" rx="2"/>
    <!-- Col -->
    <rect x="92" y="66" width="16" height="10"/>
    <!-- Corps -->
    <path d="M 72 76 Q 72 72 76 72 L 124 72 Q 128 72 128 76 L 128 152 Q 128 160 120 160 L 80 160 Q 72 160 72 152 Z"/>
    <!-- Étiquette -->
    <rect x="84" y="102" width="32" height="22" opacity="0.55"/>
    <line x1="90" y1="112" x2="110" y2="112" stroke="#4A9040" stroke-width="1.4"/>
    <line x1="92" y1="118" x2="108" y2="118" stroke="#4A9040" stroke-width="1.1"/>
  </g>
  <!-- Accents décoratifs -->
  <circle cx="148" cy="90" r="4" fill="#C85C2D" opacity="0.65"/>
  <circle cx="148" cy="90" r="1.5" fill="#FDFAF5" opacity="0.9"/>
  <circle cx="58" cy="120" r="3" fill="#4A9040" opacity="0.6"/>
  <!-- Petite étoile scintillante (diffuseur de parfum) -->
  <g transform="translate(156 148)" fill="#E8A070" opacity="0.7">
    <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z"/>
  </g>
</svg>
