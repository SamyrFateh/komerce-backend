<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gBeaute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFAF5"/>
      <stop offset="100%" stop-color="#E8A070" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="grainBeaute" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.08 0"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#gBeaute)"/>
  <rect width="200" height="200" filter="url(#grainBeaute)" opacity="0.6"/>
  <!-- Flacon parfum style Ylang-Ylang -->
  <g stroke="#2D1F14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Bouchon -->
    <rect x="88" y="50" width="24" height="16" rx="2"/>
    <!-- Col -->
    <rect x="92" y="66" width="16" height="10"/>
    <!-- Corps rectangulaire arrondi -->
    <path d="M 72 76 Q 72 72 76 72 L 124 72 Q 128 72 128 76 L 128 152 Q 128 160 120 160 L 80 160 Q 72 160 72 152 Z"/>
    <!-- Étiquette minimaliste -->
    <rect x="84" y="102" width="32" height="22" opacity="0.6"/>
    <line x1="90" y1="112" x2="110" y2="112" stroke-width="1.2"/>
    <line x1="92" y1="118" x2="108" y2="118" stroke-width="1"/>
    <!-- Petite goutte décorative -->
    <circle cx="148" cy="90" r="3" fill="#C85C2D" stroke="none" opacity="0.7"/>
    <circle cx="58" cy="120" r="2" fill="#64AF5A" stroke="none" opacity="0.7"/>
  </g>
</svg>
