<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gCouture" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0E8DD"/>
      <stop offset="100%" stop-color="#E8A070" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="grainCouture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.08 0"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#gCouture)"/>
  <rect width="200" height="200" filter="url(#grainCouture)" opacity="0.6"/>
  <!-- Ciseaux + aiguille + fil -->
  <g stroke="#2D1F14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Ciseaux - Lames croisées -->
    <g transform="translate(100 100) rotate(-35)">
      <!-- Anneau gauche -->
      <circle cx="-34" cy="-18" r="10"/>
      <!-- Anneau droit -->
      <circle cx="-34" cy="18" r="10"/>
      <!-- Pivot -->
      <circle cx="-6" cy="0" r="2.5" fill="#C85C2D" stroke="none"/>
      <!-- Lame haute -->
      <path d="M -24 -12 L 36 -2 L 36 2 L -24 12 Z"/>
      <!-- Lame basse mirror -->
      <path d="M -24 12 L 36 2 L 36 -2 L -24 -12 Z" opacity="0"/>
    </g>
    <!-- Bobine de fil (arrière plan haut gauche) -->
    <g transform="translate(54 52)" opacity="0.75">
      <ellipse cx="0" cy="0" rx="14" ry="4"/>
      <line x1="-14" y1="0" x2="-14" y2="20"/>
      <line x1="14" y1="0" x2="14" y2="20"/>
      <ellipse cx="0" cy="20" rx="14" ry="4"/>
      <!-- traits fil -->
      <line x1="-10" y1="6" x2="10" y2="6" stroke-width="1.2"/>
      <line x1="-10" y1="10" x2="10" y2="10" stroke-width="1.2"/>
      <line x1="-10" y1="14" x2="10" y2="14" stroke-width="1.2"/>
    </g>
    <!-- Aiguille avec fil qui tombe (droite) -->
    <g transform="translate(150 140)">
      <!-- Aiguille -->
      <line x1="0" y1="0" x2="-8" y2="-24" stroke-width="1.8"/>
      <!-- Chas -->
      <ellipse cx="-8" cy="-26" rx="2" ry="3" stroke-width="1.2"/>
      <!-- Fil qui descend -->
      <path d="M -8 -28 Q -20 -16 -14 -2 Q -8 10 -18 18" stroke="#C85C2D" stroke-width="1.5" opacity="0.75"/>
    </g>
  </g>
</svg>
