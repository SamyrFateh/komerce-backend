<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gMode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0E8DD"/>
      <stop offset="100%" stop-color="#C85C2D" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="grainMode" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.08 0"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#gMode)"/>
  <rect width="200" height="200" filter="url(#grainMode)" opacity="0.6"/>
  <!-- Silhouette de robe / salouva fluide -->
  <g stroke="#2D1F14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
    <!-- Épaules + encolure -->
    <path d="M 78 62 Q 100 54 122 62"/>
    <!-- Corps évasé -->
    <path d="M 78 62 L 68 100 L 58 158 Q 100 168 142 158 L 132 100 L 122 62"/>
    <!-- Drapé / pli central -->
    <path d="M 100 70 Q 96 110 94 158" stroke-dasharray="2 3" opacity="0.5"/>
    <!-- Motif bordure bas -->
    <path d="M 62 152 Q 100 162 138 152" stroke-width="1.5"/>
  </g>
</svg>
