<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gTech" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F5E6"/>
      <stop offset="100%" stop-color="#C5DDC0"/>
    </linearGradient>
    <filter id="grainTech" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0.06 0"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#gTech)"/>
  <rect width="200" height="200" filter="url(#grainTech)" opacity="0.5"/>
  <g stroke="#2A3E2C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Corps téléphone -->
    <rect x="68" y="42" width="64" height="116" rx="10"/>
    <!-- Écran -->
    <rect x="74" y="56" width="52" height="92" rx="3" stroke="#4A9040" opacity="0.5"/>
    <!-- Encoche -->
    <circle cx="100" cy="50" r="1.5" fill="#2A3E2C" stroke="none"/>
    <!-- Bouton home -->
    <rect x="90" y="152" width="20" height="1.5" fill="#2A3E2C" stroke="none" opacity="0.4"/>
    <!-- Wi-fi waves -->
    <g transform="translate(100 100)" opacity="0.75">
      <path d="M -18 0 Q 0 -10 18 0" stroke="#4A9040" stroke-width="1.6"/>
      <path d="M -10 6 Q 0 0 10 6" stroke="#4A9040" stroke-width="1.6"/>
      <circle r="2" fill="#4A9040" stroke="none"/>
    </g>
  </g>
  <!-- Accents coral -->
  <circle cx="150" cy="70" r="3" fill="#C85C2D" opacity="0.7"/>
  <circle cx="52" cy="140" r="2" fill="#E8A070" opacity="0.65"/>
</svg>
