<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gAll" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFAF5"/>
      <stop offset="100%" stop-color="#E3E8D5"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0.06 0"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#gAll)"/>
  <rect width="200" height="200" filter="url(#grain)" opacity="0.5"/>
  <g transform="translate(100 100)" stroke="#4A9040" stroke-width="2" fill="none" opacity="0.88">
    <circle r="46"/>
    <circle r="30" stroke-dasharray="3 3" opacity="0.7"/>
    <g>
      <line x1="-56" y1="0" x2="56" y2="0"/>
      <line x1="0" y1="-56" x2="0" y2="56"/>
      <line x1="-40" y1="-40" x2="40" y2="40"/>
      <line x1="-40" y1="40" x2="40" y2="-40"/>
    </g>
    <circle r="7" fill="#C85C2D" stroke="none"/>
    <circle r="3" fill="#FDFAF5" stroke="none"/>
  </g>
</svg>
