<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komerce — Control Tower</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: #f3f4f6;
      color: #111827;
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ────────────────────────────── */
    .ct-sidebar {
      width: 240px;
      background: #111827;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 16px 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      overflow-y: auto;
      transition: transform 0.3s ease;
    }
    .ct-sidebar-brand {
      padding: 8px 20px 20px;
      font-size: 18px;
      font-weight: 800;
      border-bottom: 1px solid #1f2937;
      margin-bottom: 8px;
    }
    .ct-sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 14px;
      color: #9ca3af;
    }
    .ct-sidebar-item:hover {
      background: #1f2937;
      color: #fff;
    }
    .ct-sidebar-item.active {
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
    }
    .ct-sidebar-emoji {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }
    .ct-sidebar-divider {
      height: 1px;
      background: #1f2937;
      margin: 8px 16px;
    }

    /* ── Main Content ───────────────────────── */
    .ct-main {
      margin-left: 240px;
      flex: 1;
      padding: 24px;
      min-height: 100vh;
    }

    /* ── Mobile toggle ──────────────────────── */
    .ct-mobile-toggle {
      display: none;
      position: fixed;
      top: 10px; left: 10px;
      z-index: 200;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 20px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .ct-sidebar {
        transform: translateX(-100%);
      }
      .ct-sidebar.open {
        transform: translateX(0);
      }
      .ct-main {
        margin-left: 0;
        padding: 60px 12px 12px;
      }
      .ct-mobile-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Mobile sidebar toggle -->
  <button class="ct-mobile-toggle" onclick="document.querySelector('.ct-sidebar').classList.toggle('open')">☰</button>

  <!-- Sidebar -->
  <nav class="ct-sidebar" id="ct-sidebar" onclick="if(window.innerWidth<=768)this.classList.remove('open')">
    <div class="ct-sidebar-brand">🗼 Control Tower</div>
    <!-- Filled by ct-app-v6.js -->
  </nav>

  <!-- Main content area -->
  <main class="ct-main" id="ct-main">
    <div style="text-align:center;padding:80px;color:#6b7280;font-size:16px">
      ⏳ Chargement de la Control Tower...
    </div>
  </main>

  <!-- Scripts — order matters -->
  <script src="/js/ct-api.js"></script>
  <script src="/js/parcel-components.js"></script>
  <script src="/js/ct-views-v6.js"></script>
  <script src="/js/ct-app-v6.js"></script>

</body>
</html>
