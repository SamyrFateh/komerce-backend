<script>
// IntersectionObserver: bar becomes fixed ONLY when scrolled past
(function(){
  var sentinel = document.getElementById('k-bar-sentinel');
  var bar = document.getElementById('k-sticky-bar');
  var spacer = document.getElementById('k-bar-spacer');
  if(!sentinel || !bar || !spacer) return;

  // Pre-calculate spacer height
  spacer.style.height = bar.offsetHeight + 'px';

  var observer = new IntersectionObserver(function(entries){
    if(entries[0].isIntersecting){
      // Sentinel visible → bar in normal document flow
      bar.classList.remove('is-stuck');
      spacer.style.display = 'none';
    } else {
      // Sentinel scrolled out → bar becomes fixed
      bar.classList.add('is-stuck');
      spacer.style.display = 'block';
    }
  }, {
    rootMargin: '-44px 0px 0px 0px' // offset = header height
  });

  observer.observe(sentinel);

  // Update spacer on resize
  window.addEventListener('resize', function(){
    spacer.style.height = bar.offsetHeight + 'px';
  });
})();
</script>
