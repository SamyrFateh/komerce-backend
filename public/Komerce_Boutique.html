<script>
/* Nuclear SW reset v100 — runs ONCE to clear all old caches */
(function(){
  if(localStorage.getItem('sw_reset_v177'))return;
  localStorage.setItem('sw_reset_v177','1');
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.getRegistrations().then(function(regs){
    if(!regs.length){location.reload(true);return;}
    Promise.all(regs.map(function(r){return r.unregister();})).then(function(){
      return caches.keys();
    }).then(function(keys){
      return Promise.all(keys.map(function(k){return caches.delete(k);}));
    }).then(function(){
      console.log('[RESET] All SWs unregistered, all caches cleared. Reloading...');
      location.reload(true);
    });
  });
})();
</script>
<script>
// Force SW update + cache purge (one-time)
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){r.update()});
  });
  // Listener pour reload auto quand le SW se met à jour
  navigator.serviceWorker.addEventListener('message', function(e){
    if(e.data && e.data.type === 'sw-updated'){
      console.log('[SW] Nouvelle version', e.data.version, '→ reload auto');
      location.reload();
    }
  });
  // Also clear all caches
  if(window.caches){
    caches.keys().then(function(names){
      names.forEach(function(n){
        if(n.indexOf('komerce-v215')===-1) caches.delete(n);
      });
    });
  }
}
</script>

<script>
// Hero sticky logic: fixed wrap on mobile, IntersectionObserver on desktop
(function(){
  var spacer = document.getElementById('k-bar-spacer');
  if (!spacer) return;

  function isMobile(){ return window.innerWidth <= 899; }

  // ── MOBILE : tout le wrap est fixe, on mesure sa hauteur ──────────────────
  function setupMobile(){
    var wrap = document.getElementById('k-hero-fixed-wrap');
    if (!wrap) return;
    function update(){
      var h = wrap.offsetHeight;
      spacer.style.display = 'none'; // spacer not needed with fixed scroll
      var scroll = document.getElementById('k-page-scroll');
      if (scroll) scroll.style.top = (h + 44) + 'px'; // 44px = header height
    }
    update();
    // Re-mesure après chargement de l'image hero
    var img = wrap.querySelector('.k-hero-img');
    if (img && !img.complete) img.addEventListener('load', update);
    window.addEventListener('resize', update);
  }

  // ── DESKTOP : IntersectionObserver sticky bar ─────────────────────────────
  function setupDesktop(){
    var sentinel = document.getElementById('k-bar-sentinel');
    var bar = document.getElementById('k-sticky-bar');
    if(!sentinel || !bar) return;
    spacer.style.height = bar.offsetHeight + 'px';
    var observer = new IntersectionObserver(function(entries){
      if(entries[0].isIntersecting){
        bar.classList.remove('is-stuck');
        spacer.style.display = 'none';
      } else {
        bar.classList.add('is-stuck');
        spacer.style.display = 'block';
      }
    }, { rootMargin: '-44px 0px 0px 0px' });
    observer.observe(sentinel);
    window.addEventListener('resize', function(){
      spacer.style.height = bar.offsetHeight + 'px';
    });
  }

  if (isMobile()) {
    setupMobile();
    // Proxy window.scrollY and window.scrollTo → #k-page-scroll
    try {
      Object.defineProperty(window, 'scrollY', {
        get: function(){ var s=document.getElementById('k-page-scroll'); return s?s.scrollTop:0; },
        configurable: true
      });
      window.scrollTo = function(x, y){
        var s = document.getElementById('k-page-scroll');
        if (!s) return;
        if (x !== null && typeof x === 'object') {
          s.scrollTo({ top: x.top||0, behavior: x.behavior||'auto' });
        } else {
          s.scrollTop = (typeof y === 'number') ? y : 0;
        }
      };
    } catch(e) {}
  } else { setupDesktop(); }
})();

  /* ══ Proverbe africain rotatif ══ */
  (function() {
    var proverbes = [
