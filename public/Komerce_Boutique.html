<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Komerce Boutique — E-commerce des Comores</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#b45309">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Komerce">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="description" content="Komerce : le e-commerce qui rapproche la diaspora des Comores. Livraison rapide, paiement sécurisé.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════
   KOMERCE BOUTIQUE — CSS CLEAN REBUILD
   Z-INDEX SCALE:
     card-overlay: 5
     scroll-top: 900
     nav: 1000
     search-dropdown: 1010
     product-modal: 2000
     cart: 3000
     checkout-modal: 4000
     toast: 5000
   ═══════════════════════════════════════════════ */

/* ── 1. VARIABLES ── */
:root {
  --primary: #b45309;
  --primary-dark: #92400e;
  --primary-light: #fef3c7;
  --accent: #ea580c;
  --accent-dark: #c2410c;
  --accent-light: #fff7ed;
  --red: #ef4444;
  --bg: #fffaf5;
  --text: #2c2c2a;
  --muted: #94a3b8;
  --border: #e5e7eb;
  --white: #ffffff;
  --dark: #2c2c2a;
  --radius: 10px;
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-gold: 0 4px 20px rgba(242,202,0,0.2);
  --z-card-overlay: 5;
  --z-scroll-top: 900;
  --z-nav: 1000;
  --z-search-dropdown: 1010;
  --z-product-modal: 2000;
  --z-cart: 3000;
  --z-checkout: 4000;
  --z-toast: 5000;
}

/* ── 2. RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
button { cursor: pointer; font-family: inherit; }
a { text-decoration: none; color: inherit; }
.hidden { display: none !important; }

/* ── 3. PROMO BAR ── */
#promo-bar {
  text-align: center; padding: 8px 16px; min-height: 32px;
  background: linear-gradient(90deg, #fffbeb, #fef3c7, #fffbeb);
  color: var(--dark); font-size: 0.82rem; font-weight: 600;
  overflow: hidden; position: relative;
}
#promo-bar .promo-text {
  animation: promoSlide 0.5s ease;
}
@keyframes promoSlide {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── 4. NAV ── */
#main-nav {
  position: sticky; top: 0;
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  z-index: var(--z-nav);
}
.nav-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  height: 58px; padding: 0 16px;
}
.nav-logo {
  font-weight: 800; font-size: 1.35rem;
  color: var(--primary); white-space: nowrap;
}
.nav-logo small {
  font-size: 0.55rem; font-weight: 400;
  color: var(--muted); display: block; margin-top: -4px;
}
.nav-search-wrap {
  flex: 1; max-width: 480px; position: relative;
  display: flex; align-items: center;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 24px; margin: 0 8px;
}
.nav-search-wrap input {
  flex: 1; border: none; background: transparent;
  padding: 8px 12px; font-size: 0.88rem; outline: none;
  border-radius: 24px 0 0 24px;
}
.nav-search-wrap button {
  background: none; border: none; padding: 8px 14px;
  font-size: 1rem; color: var(--muted);
}
.nav-search-wrap:focus-within { border-color: var(--primary); }

/* Search dropdown */
#search-dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius); max-height: 360px; overflow-y: auto;
  box-shadow: var(--shadow); z-index: var(--z-search-dropdown);
  display: none;
}
#search-dropdown.open { display: block; }
.search-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: pointer; transition: background 0.15s;
}
.search-item:hover { background: var(--primary-light); }
.search-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
.search-item-info { flex: 1; }
.search-item-name { font-size: 0.85rem; font-weight: 600; }
.search-item-price { font-size: 0.78rem; color: var(--primary); }

/* Nav buttons */
.nav-actions { display: flex; align-items: center; gap: 6px; }
.nav-btn {
  position: relative; background: none; border: none;
  font-size: 1.3rem; padding: 6px; border-radius: 50%;
  transition: background 0.2s;
}
.nav-btn:hover { background: var(--primary-light); }
.cart-badge {
  position: absolute; top: -2px; right: -4px;
  background: var(--accent); color: white;
  font-size: 0.65rem; font-weight: 700;
  min-width: 18px; height: 18px; line-height: 18px;
  border-radius: 50%; text-align: center;
}

/* ── 5. HERO (compact) ── */
#hero {
  text-align: center; padding: 18px 16px 10px;
  background: linear-gradient(135deg, var(--primary-light), #fff7ed);
}
#hero h1 {
  font-size: 1.3rem; font-weight: 800;
  color: var(--primary-dark);
  margin-bottom: 4px;
}
#hero p {
  font-size: 0.85rem; color: var(--muted);
}

/* ── 6. CATEGORY TABS ── */
#category-tabs {
  display: flex; gap: 8px; padding: 12px 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; justify-content: center;
  flex-wrap: wrap;
}
#category-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  flex-shrink: 0; padding: 7px 18px;
  border-radius: 20px; font-size: 0.82rem; font-weight: 600;
  border: 1.5px solid var(--border); background: var(--white);
  color: var(--text); transition: all 0.2s; white-space: nowrap;
}
.cat-tab.active {
  background: var(--primary); color: white;
  border-color: var(--primary); box-shadow: var(--shadow-gold);
}
.cat-tab:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

/* ── 7. PRODUCT GRID ── */
#products-container {
  max-width: 1200px; margin: 0 auto; padding: 0 12px 80px;
}
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

/* ── 8. PRODUCT CARD ── */
.product-card {
  position: relative;
  background: var(--white);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: pointer;
}
.product-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}
.card-img-wrap {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--primary-light);
}
.card-img-wrap img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.3s;
}
.product-card:hover .card-img-wrap img {
  transform: scale(1.05);
}

/* Card overlays — NO superposition: fav=top-right, cart=bottom-right */
.card-fav-btn {
  position: absolute; top: 8px; right: 8px;
  z-index: var(--z-card-overlay);
  width: 34px; height: 34px;
  border-radius: 50%; border: 1.5px solid var(--accent);
  background: rgba(255,255,255,0.92);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; color: var(--accent);
  transition: all 0.2s;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.card-fav-btn.active { background: var(--accent); color: white; }
.card-fav-btn:hover { transform: scale(1.1); }

.card-cart-btn {
  position: absolute; bottom: 8px; right: 8px;
  z-index: var(--z-card-overlay);
  width: 38px; height: 38px;
  border-radius: 50%; border: 2px solid #d4a017;
  background: rgba(255,255,255,0.95);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  transition: all 0.2s;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  -webkit-tap-highlight-color: transparent;
}
.card-cart-btn img {
  width: 24px; height: 24px; object-fit: contain;
  pointer-events: none;
}
.card-cart-btn:hover { transform: scale(1.12); box-shadow: 0 3px 12px rgba(212,160,23,0.35); }
.card-cart-btn.added {
  background: var(--primary); border-color: var(--primary);
}
.card-cart-btn.added::after {
  content: '✓'; position: absolute;
  font-size: 1.1rem; color: white; font-weight: 700;
}
.card-cart-btn.added img { opacity: 0; }

/* Out of stock badge */
.card-out-of-stock {
  position: absolute; top: 8px; left: 8px;
  z-index: var(--z-card-overlay);
  background: var(--red); color: white;
  font-size: 0.7rem; font-weight: 700;
  padding: 3px 8px; border-radius: 6px;
}

/* Card info */
.card-info { padding: 10px 12px 12px; }
.card-name {
  font-size: 0.85rem; font-weight: 600;
  color: var(--dark); line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
  min-height: 2.2em;
}
.card-price {
  margin-top: 6px; font-size: 0.95rem;
  font-weight: 700; color: var(--primary);
}
.card-price-eur {
  font-size: 0.75rem; color: var(--muted);
  font-weight: 400; margin-left: 4px;
}

/* ── 9. PRODUCT MODAL ── */
#product-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: var(--z-product-modal);
  display: none; align-items: center; justify-content: center;
}
#product-modal-overlay.open { display: flex; }

#product-modal {
  background: var(--white);
  border-radius: 16px;
  width: 92%; max-width: 820px;
  max-height: 90vh;
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: modalIn 0.25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(30px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-close-btn {
  position: absolute; top: 12px; right: 12px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(0,0,0,0.06); border: none;
  font-size: 1.3rem; color: var(--text);
  display: flex; align-items: center; justify-content: center;
  z-index: 10; transition: background 0.2s;
}
.modal-close-btn:hover { background: rgba(0,0,0,0.12); }

.modal-content {
  display: flex; flex: 1; overflow: hidden;
  position: relative;
}

/* Desktop: image left, info right */
.modal-image-col {
  flex: 0 0 380px; background: var(--primary-light);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.modal-image-col img {
  width: 100%; height: 100%; object-fit: cover;
}

.modal-info-col {
  flex: 1; display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
  padding: 24px;
}

.modal-product-name {
  font-size: 1.25rem; font-weight: 700;
  color: var(--dark); margin-bottom: 8px;
}
.modal-product-price {
  font-size: 1.4rem; font-weight: 800;
  color: var(--primary); margin-bottom: 4px;
}
.modal-product-price-eur {
  font-size: 0.85rem; color: var(--muted);
  margin-bottom: 12px;
}
.modal-product-desc {
  font-size: 0.88rem; color: #555;
  line-height: 1.6; margin-bottom: 16px;
  display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
.modal-delivery-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary-light); color: var(--primary-dark);
  padding: 6px 12px; border-radius: 8px;
  font-size: 0.8rem; font-weight: 600; margin-bottom: 16px;
}

/* Reco section inside modal */
.modal-reco-section { margin-top: 16px; }
.modal-reco-title {
  font-size: 0.9rem; font-weight: 700;
  color: var(--dark); margin-bottom: 10px;
}
.modal-reco-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; max-width: 100%; overflow: hidden;
}
.reco-card {
  border-radius: 8px; overflow: hidden;
  border: 1.5px solid var(--border); background: var(--white);
  cursor: pointer; transition: border-color 0.2s;
}
.reco-card:hover { border-color: var(--primary); }
.reco-card.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
.reco-card img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.reco-card-info { padding: 6px 8px; }
.reco-card-name { font-size: 0.72rem; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.reco-card-price { font-size: 0.72rem; color: var(--primary); font-weight: 700; margin-top: 2px; }

/* Sticky CTA — stays inside modal, never escapes */
.modal-sticky-cta {
  position: sticky; bottom: 0;
  background: var(--white);
  border-top: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
}
.qty-control {
  display: flex; align-items: center; gap: 0;
  border: 1.5px solid var(--border); border-radius: 8px;
  overflow: hidden;
}
.qty-btn {
  width: 36px; height: 36px; border: none;
  background: var(--bg); font-size: 1.1rem; font-weight: 700;
  color: var(--text); display: flex; align-items: center; justify-content: center;
}
.qty-btn:hover { background: var(--primary-light); }
.qty-val {
  width: 36px; text-align: center; font-size: 0.95rem;
  font-weight: 700; border: none; background: var(--white);
}
.cta-add-btn {
  flex: 1; height: 44px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white; border: none; border-radius: 10px;
  font-size: 0.95rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity 0.2s;
}
.cta-add-btn:hover { opacity: 0.9; }

/* ── 10. CART DRAWER (African theme) ── */
#cart-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: var(--z-cart);
  display: none;
}
#cart-overlay.open { display: block; }

#cart-drawer {
  position: fixed; top: 0; right: -100%; bottom: 0;
  width: 380px; max-width: 92vw;
  display: flex; flex-direction: column;
  z-index: calc(var(--z-cart) + 1);
  background: linear-gradient(180deg, #fffdf7 0%, #fff 40%);
  transition: right 0.3s ease;
  box-shadow: -4px 0 24px rgba(0,0,0,0.15);
}
#cart-drawer.open { right: 0; }

.cart-header {
  background: linear-gradient(135deg, #5D4037, #795548);
  color: #fef3c7; padding: 18px 20px;
  position: relative; overflow: hidden;
}
.cart-header::before {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(
    45deg, transparent, transparent 8px,
    rgba(212,160,23,0.08) 8px, rgba(212,160,23,0.08) 16px
  );
}
.cart-header-title {
  font-size: 1.1rem; font-weight: 700;
  position: relative; z-index: 1;
}
.cart-header-close {
  position: absolute; top: 14px; right: 14px;
  background: rgba(255,255,255,0.15); border: none;
  color: #fef3c7; width: 32px; height: 32px;
  border-radius: 50%; font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  z-index: 1;
}

.cart-body {
  flex: 1; overflow-y: auto; padding: 16px;
}
.cart-item {
  display: flex; gap: 12px; padding: 14px;
  background: var(--white); border-radius: 10px;
  border-left: 3px solid #d4a017;
  margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.cart-item img {
  width: 60px; height: 60px; border-radius: 8px;
  object-fit: cover; flex-shrink: 0;
}
.cart-item-info { flex: 1; }
.cart-item-name { font-size: 0.85rem; font-weight: 600; }
.cart-item-price { font-size: 0.82rem; color: var(--primary); font-weight: 700; margin-top: 2px; }
.cart-item-qty {
  display: flex; align-items: center; gap: 8px; margin-top: 6px;
}
.cart-qty-btn {
  width: 28px; height: 28px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg);
  font-size: 0.9rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.cart-item-remove {
  background: none; border: none; color: var(--red);
  font-size: 0.78rem; font-weight: 600; margin-top: 4px;
  padding: 0;
}

.cart-footer {
  padding: 16px 20px;
  background: linear-gradient(180deg, #fff, #fffdf7);
  border-top: 3px solid;
  border-image: linear-gradient(90deg, #d4a017, #ea580c, #5D4037) 1;
}
.cart-total {
  display: flex; justify-content: space-between;
  font-size: 1rem; font-weight: 700;
  margin-bottom: 12px;
}
.cart-checkout-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #5D4037, #795548);
  color: #fef3c7; border: none; border-radius: 10px;
  font-size: 0.95rem; font-weight: 700;
  letter-spacing: 0.5px;
}
.cart-whatsapp-btn {
  width: 100%; padding: 10px; margin-top: 8px;
  background: #25D366; color: white; border: none;
  border-radius: 10px; font-size: 0.85rem; font-weight: 600;
}
.cart-clear-btn {
  width: 100%; padding: 8px; margin-top: 6px;
  background: none; border: 1px solid var(--border);
  border-radius: 8px; font-size: 0.8rem; color: var(--muted);
}
.cart-empty {
  text-align: center; padding: 40px 20px; color: var(--muted);
}
.cart-empty-icon { font-size: 3rem; margin-bottom: 12px; }

/* ── 11. CHECKOUT MODAL ── */
#checkout-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: var(--z-checkout);
  display: none; align-items: center; justify-content: center;
}
#checkout-overlay.open { display: flex; }

#checkout-modal {
  background: var(--white);
  border-radius: 16px;
  width: 92%; max-width: 460px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  animation: modalIn 0.25s ease;
}
.checkout-title {
  font-size: 1.15rem; font-weight: 700;
  margin-bottom: 16px; text-align: center;
}
.checkout-summary {
  background: var(--bg); border-radius: 10px;
  padding: 14px; margin-bottom: 16px;
}
.checkout-summary-item {
  display: flex; justify-content: space-between;
  font-size: 0.85rem; padding: 4px 0;
}
.checkout-summary-total {
  display: flex; justify-content: space-between;
  font-weight: 700; font-size: 1rem;
  border-top: 1px solid var(--border);
  padding-top: 8px; margin-top: 8px;
}

.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 0.82rem; font-weight: 600;
  margin-bottom: 4px; color: var(--dark);
}
.form-input, .form-select {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 0.9rem; font-family: inherit;
  background: var(--white); outline: none;
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus { border-color: var(--primary); }

.checkout-radio-group { display: flex; gap: 10px; margin-bottom: 14px; }
.checkout-radio {
  flex: 1; padding: 10px; border: 1.5px solid var(--border);
  border-radius: 8px; text-align: center; font-size: 0.82rem;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.checkout-radio.active {
  border-color: var(--primary); background: var(--primary-light);
  color: var(--primary);
}

.checkout-submit-btn {
  width: 100%; padding: 14px; margin-top: 8px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white; border: none; border-radius: 10px;
  font-size: 1rem; font-weight: 700;
}
.checkout-submit-btn:disabled {
  opacity: 0.5; cursor: not-allowed;
}
.checkout-close-btn {
  width: 100%; padding: 10px; margin-top: 8px;
  background: none; border: 1px solid var(--border);
  border-radius: 8px; font-size: 0.85rem; color: var(--muted);
}

/* ── 12. TOAST ── */
#toast-container {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%);
  z-index: var(--z-toast);
  display: flex; flex-direction: column; gap: 8px;
  align-items: center; pointer-events: none;
}
.toast {
  background: var(--dark); color: white;
  padding: 10px 20px; border-radius: 10px;
  font-size: 0.85rem; font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
  pointer-events: auto;
}
.toast.success { background: #16a34a; }
.toast.error { background: var(--red); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes toastOut {
  from { opacity: 1; }
  to { opacity: 0; transform: translateY(-10px); }
}

/* ── 13. SCROLL TO TOP ── */
#scroll-top-btn {
  position: fixed; bottom: 24px; right: 20px;
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--primary); color: white; border: none;
  font-size: 1.2rem; box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  z-index: var(--z-scroll-top);
  display: none; align-items: center; justify-content: center;
  transition: opacity 0.2s;
}
#scroll-top-btn.show { display: flex; }

/* ── 14. LOADING SPINNER ── */
#loading-spinner {
  text-align: center; padding: 40px;
  color: var(--muted); font-size: 0.9rem;
}
.spinner {
  width: 32px; height: 32px; margin: 0 auto 10px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 15. EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--muted);
}
.empty-state-icon { font-size: 3rem; margin-bottom: 12px; }

/* ═══════════════════════════════════════════════
   RESPONSIVE — MOBILE (≤ 768px)

<!-- ════════════════════════════════════════════════
     JAVASCRIPT — CLEAN REBUILD
     ════════════════════════════════════════════════ -->
<script>
/* ═══ HELPER ═══ */
function $(id) { return document.getElementById(id); }

/* ═══ CONFIG ═══ */
var CART_VERSION = 3;
var PRODUCTS_PER_BATCH = 20;
var CATEGORIES = [
  { key: 'all', label: 'Tout', emoji: '🛍️' },
  { key: 'Mode', label: 'Mode', emoji: '👗' },
  { key: 'Beauté', label: 'Beauté', emoji: '💄' },
  { key: 'Sur-mesure', label: 'Sur-mesure', emoji: '✂️' },
  { key: 'Tech', label: 'Tech', emoji: '📱' },
  { key: 'Enfant', label: 'Enfant', emoji: '🧸' }
];
var SUGGESTION_MAP = {
  'mode':       { title: '👜 Complétez votre look',         emoji: '👗' },
  'beauté':     { title: '✨ Vous aimerez aussi',            emoji: '💄' },
  'tech':       { title: '🔌 Accessoires compatibles',       emoji: '📱' },
  'sur-mesure': { title: '🧵 Complétez votre commande',      emoji: '✂️' },
  'enfant':     { title: '🧸 Complétez votre achat',         emoji: '🎀' }
};
var DEFAULT_RECO_TITLE = '💡 Souvent acheté avec';
var PROVERBES = [
  '🌴 "Mwana huzaliwa na mwili, lakini akili huipata" — L\'enfant naît avec un corps, mais acquiert la sagesse',
  '🐚 "Bahari haikaliki" — La mer ne se met pas en colère sans raison',
  '☀️ "Jua halipiti bila mwanga" — Le soleil ne passe pas sans lumière',
  '🌙 "Mwezi huja na hali yake" — Chaque mois vient avec ses surprises',
  '🌺 "Ua zuri halikawii" — La belle fleur ne tarde pas à éclore',
  '🏝️ Livraison rapide vers les Comores 🇰🇲',
  '💰 Paiement cash au relais — simple et sécurisé',
  '🧺 Des produits sélectionnés avec soin pour la diaspora'
];

/* ═══ STATE ═══ */
var _products = [];
var _filtered = [];
var _shown = 0;
var _loading = false;
var _activeCategory = 'all';
var _searchQuery = '';
var _cart = [];
var _favs = [];
var _relais = [];
var _orderData = {};
var _currentModalProduct = null;
var _productHistory = [];
var _modalQty = 1;
var _promoIdx = 0;

/* ═══ API ═══ */
async function apiGet(path) {
  var ctrl = new AbortController();
  var t = setTimeout(function() { ctrl.abort(); }, 10000);
  try {
    var res = await fetch(path, { credentials: 'include', signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}

async function apiPost(path, body) {
  var ctrl = new AbortController();
  var t = setTimeout(function() { ctrl.abort(); }, 15000);
  try {
    var res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      signal: ctrl.signal,
      body: JSON.stringify(body)
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || data.message || 'Erreur');
    return data;
  } finally { clearTimeout(t); }
}

/* ═══ UTILS ═══ */
function formatPrice(amount, currency) {
  if (!amount && amount !== 0) return '—';
  var formatted = Number(amount).toLocaleString('fr-FR');
  return formatted + (currency === 'EUR' ? ' €' : ' KMF');
}

function productEmoji(cat) {
  var c = CATEGORIES.find(function(x) { return x.key === cat; });
  return c ? c.emoji : '📦';
}

function categoryLabel(cat) {
  var c = CATEGORIES.find(function(x) { return x.key === cat; });
  return c ? c.label : cat;
}

function debounce(fn, ms) {
  var timer;
  return function() {
    var args = arguments, ctx = this;
    clearTimeout(timer);
    timer = setTimeout(function() { fn.apply(ctx, args); }, ms);
  };
}

/* ═══ TOAST ═══ */
function toast(msg, type) {
  type = type || 'info';
  var c = $('toast-container');
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  var icons = { success: '✅', error: '❌', info: 'ℹ️' };
  t.textContent = (icons[type] || '') + ' ' + msg;
  c.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

/* ═══ PROMO BAR ═══ */
function rotatePromo() {
  var el = $('promo-text');
  if (!el) return;
  el.textContent = PROVERBES[_promoIdx % PROVERBES.length];
  _promoIdx++;
}

/* ═══ LOAD PRODUCTS ═══ */
async function loadProducts() {
  try {
    $('loading-spinner').classList.remove('hidden');
    var data = await apiGet('/api/products');
    _products = data.products || data || [];
    applyFilters();
  } catch (e) {
    console.error('loadProducts:', e);
    toast('Erreur de chargement des produits', 'error');
  } finally {
    $('loading-spinner').classList.add('hidden');
  }
}

async function loadRelais() {
  try {
    var data = await apiGet('/api/relais/public');
    _relais = data.relais || data || [];
  } catch (e) {
    console.error('loadRelais:', e);
    _relais = [];
  }
}

/* ═══ FILTER + SORT ═══ */
function applyFilters() {
  var q = _searchQuery.toLowerCase().trim();
  _filtered = _products.filter(function(p) {
    // Category filter
    if (_activeCategory !== 'all' && p.category !== _activeCategory) return false;
    // Search filter
    if (q) {
      var haystack = (p.name + ' ' + (p.description || '') + ' ' + (p.category || '') + ' ' + (p.sku || '')).toLowerCase();
      return haystack.indexOf(q) >= 0;
    }
    return true;
  });
  // Sort: available first, then by name
  _filtered.sort(function(a, b) {
    if (a.stock > 0 && b.stock <= 0) return -1;
    if (a.stock <= 0 && b.stock > 0) return 1;
    return (a.name || '').localeCompare(b.name || '');
  });
  _shown = 0;
  $('products-grid').innerHTML = '';
  renderNextBatch();
}

/* ═══ RENDER BATCH (infinite scroll) ═══ */
function renderNextBatch() {
  if (_loading || _shown >= _filtered.length) return;
  _loading = true;

  var end = Math.min(_shown + PRODUCTS_PER_BATCH, _filtered.length);
  var grid = $('products-grid');
  var fragment = document.createDocumentFragment();

  for (var i = _shown; i < end; i++) {
    fragment.appendChild(createProductCard(_filtered[i]));
  }
  grid.appendChild(fragment);
  _shown = end;
  _loading = false;

  // Show empty state if no products
  if (_filtered.length === 0 && $('products-grid').children.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<div class="empty-state-icon">🔍</div><p>Aucun produit trouvé</p>';
    grid.appendChild(empty);
  }
}

/* ═══ CREATE PRODUCT CARD ═══ */
function createProductCard(p) {
  var card = document.createElement('div');
  card.className = 'product-card';
  card.setAttribute('data-product-id', p.id);

  // Click opens modal (but not on overlay buttons)
  card.addEventListener('click', function(e) {
    if (e.target.closest('.card-fav-btn') || e.target.closest('.card-cart-btn')) return;
    openProductModal(p);
  });

  // Image wrapper
  var imgWrap = document.createElement('div');
  imgWrap.className = 'card-img-wrap';

  var img = document.createElement('img');
  img.loading = 'lazy';
  img.alt = p.name;
  img.src = p.image_url || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="%23fef3c7" width="200" height="200"/><text x="100" y="110" text-anchor="middle" font-size="48">' + encodeURIComponent(productEmoji(p.category)) + '</text></svg>';
  img.onerror = function() {
    this.onerror = null;
    this.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="%23fef3c7" width="200" height="200"/><text x="100" y="110" text-anchor="middle" font-size="48">' + encodeURIComponent(productEmoji(p.category)) + '</text></svg>';
  };
  imgWrap.appendChild(img);

  // Out of stock badge (only shown if stock <= 0)
  if (p.stock <= 0) {
    var badge = document.createElement('div');
    badge.className = 'card-out-of-stock';
    badge.textContent = '❌ Rupture';
    imgWrap.appendChild(badge);
  }

  // ♥ Fav button — TOP RIGHT
  var favBtn = document.createElement('button');
  favBtn.className = 'card-fav-btn' + (isFav(p.id) ? ' active' : '');
  favBtn.innerHTML = '♥';
  favBtn.setAttribute('data-fav-pid', p.id);
  favBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    e.preventDefault();
    toggleFav(p.id);
    this.classList.toggle('active');
  });
  imgWrap.appendChild(favBtn);

  // 🧺 Cart button — BOTTOM RIGHT (avatar_panier.png, always visible)
  var cartBtn = document.createElement('button');
  cartBtn.className = 'card-cart-btn';
  cartBtn.setAttribute('data-cart-pid', p.id);
  var cartImg = document.createElement('img');
  cartImg.src = '/images/avatar_panier.png';
  cartImg.alt = 'Ajouter';
  cartBtn.appendChild(cartImg);
  cartBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    e.preventDefault();
    addToCart(p, 1);
    // Visual feedback
    this.classList.add('added');
    var btn = this;
    setTimeout(function() { btn.classList.remove('added'); }, 1200);
    toast(p.name + ' ajouté !', 'success');
    flyToCart(this, p);
  });
  imgWrap.appendChild(cartBtn);

  card.appendChild(imgWrap);

  // Info section
  var info = document.createElement('div');
  info.className = 'card-info';

  var name = document.createElement('div');
  name.className = 'card-name';
  name.textContent = (p.emoji || productEmoji(p.category)) + ' ' + p.name;
  info.appendChild(name);

  var price = document.createElement('div');
  price.className = 'card-price';
  price.innerHTML = formatPrice(p.price_kmf, 'KMF');
  if (p.price_eur) {
    price.innerHTML += '<span class="card-price-eur">(' + formatPrice(p.price_eur, 'EUR') + ')</span>';
  }
  info.appendChild(price);

  card.appendChild(info);
  return card;
}

/* ═══ FLY TO CART ANIMATION ═══ */
function flyToCart(sourceEl, product) {
  var cartIcon = document.querySelector('.nav-btn img[alt="Panier"]');
  if (!cartIcon || !sourceEl) return;
  var srcRect = sourceEl.getBoundingClientRect();
  var dstRect = cartIcon.getBoundingClientRect();

  var flyer = document.createElement('div');
  flyer.style.cssText = 'position:fixed;z-index:9999;width:30px;height:30px;border-radius:50%;background:var(--primary);opacity:0.8;pointer-events:none;transition:all 0.6s cubic-bezier(0.2,1,0.3,1);';
  flyer.style.left = srcRect.left + 'px';
  flyer.style.top = srcRect.top + 'px';
  document.body.appendChild(flyer);

  requestAnimationFrame(function() {
    flyer.style.left = dstRect.left + 'px';
    flyer.style.top = dstRect.top + 'px';
    flyer.style.opacity = '0';
    flyer.style.transform = 'scale(0.3)';
  });
  setTimeout(function() { flyer.remove(); }, 700);
}

/* ═══ CATEGORY TABS ═══ */
function renderCategoryTabs() {
  var container = $('category-tabs');
  container.innerHTML = '';
  CATEGORIES.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'cat-tab' + (cat.key === _activeCategory ? ' active' : '');
    btn.textContent = cat.emoji + ' ' + cat.label;
    btn.addEventListener('click', function() {
      _activeCategory = cat.key;
      // Update active class
      container.querySelectorAll('.cat-tab').forEach(function(t) { t.classList.remove('active'); });
      btn.classList.add('active');
      _searchQuery = '';
      $('nav-search').value = '';
      applyFilters();
    });
    container.appendChild(btn);
  });
}

/* ═══ PRODUCT MODAL ═══ */
function openProductModal(p, fromSuggestion) {
  // Navigation history
  if (!window._productHistory) window._productHistory = [];
  if (fromSuggestion && _currentModalProduct) {
    window._productHistory.push(_currentModalProduct);
  } else {
    window._productHistory = [];
  }

  _currentModalProduct = p;
  _modalQty = 1;

  // Image column
  var imgCol = $('modal-image-col');
  imgCol.innerHTML = '';
  var img = document.createElement('img');
  img.src = p.image_url || '';
  img.alt = p.name;
  img.onerror = function() {
    this.onerror = null;
    this.style.display = 'none';
    imgCol.innerHTML = '<div style="font-size:4rem;text-align:center;padding:40px;">' + (p.emoji || productEmoji(p.category)) + '</div>';
  };
  imgCol.appendChild(img);

  // Info column
  var infoCol = $('modal-info-col');
  infoCol.innerHTML = '';

  // Back button (for suggestion navigation)
  if (window._productHistory.length > 0) {
    var backBtn = document.createElement('button');
    backBtn.style.cssText = 'background:none;border:none;color:var(--primary);font-size:0.85rem;font-weight:600;padding:0 0 10px;cursor:pointer;';
    backBtn.textContent = '← Retour';
    backBtn.addEventListener('click', function() {
      var prev = window._productHistory.pop();
      if (prev) openProductModal(prev);
    });
    infoCol.appendChild(backBtn);
  }

  // Product name
  var nameEl = document.createElement('h2');
  nameEl.className = 'modal-product-name';
  nameEl.textContent = (p.emoji || productEmoji(p.category)) + ' ' + p.name;
  infoCol.appendChild(nameEl);

  // Price KMF
  var priceEl = document.createElement('div');
  priceEl.className = 'modal-product-price';
  priceEl.textContent = formatPrice(p.price_kmf, 'KMF');
  infoCol.appendChild(priceEl);

  // Price EUR
  if (p.price_eur) {
    var priceEur = document.createElement('div');
    priceEur.className = 'modal-product-price-eur';
    priceEur.textContent = '≈ ' + formatPrice(p.price_eur, 'EUR');
    infoCol.appendChild(priceEur);
  }

  // Description
  if (p.description) {
    var desc = document.createElement('p');
    desc.className = 'modal-product-desc';
    desc.textContent = p.description;
    infoCol.appendChild(desc);
  }

  // Delivery badge
  var badge = document.createElement('div');
  badge.className = 'modal-delivery-badge';
  badge.textContent = '🇰🇲 Livré aux Comores';
  infoCol.appendChild(badge);

  // Stock status
  if (p.stock <= 0) {
    var outStock = document.createElement('div');
    outStock.style.cssText = 'color:var(--red);font-size:0.85rem;font-weight:600;margin-bottom:12px;';
    outStock.textContent = '❌ Rupture de stock';
    infoCol.appendChild(outStock);
  }

  // Recommendations
  renderRecommendations(p, infoCol);

  // Sticky CTA
  renderModalCTA(p);

  // Open modal
  $('product-modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeProductModal() {
  $('product-modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  _currentModalProduct = null;
  window._productHistory = [];
}

/* ═══ RECOMMENDATIONS ═══ */
function renderRecommendations(product, container) {
  var cat = (product.category || '').toLowerCase();
  var suggestion = SUGGESTION_MAP[cat] || { title: DEFAULT_RECO_TITLE, emoji: '💡' };

  // Find related products (same category, different product, in stock)
  var related = _products.filter(function(p) {
    return p.id !== product.id &&
           (p.category || '').toLowerCase() === cat &&
           p.stock > 0;
  });

  // If not enough in same category, add from other categories
  if (related.length < 3) {
    var others = _products.filter(function(p) {
      return p.id !== product.id &&
             (p.category || '').toLowerCase() !== cat &&
             p.stock > 0;
    });
    related = related.concat(others.slice(0, 4 - related.length));
  }

  related = related.slice(0, 4);
  if (related.length === 0) return;

  var section = document.createElement('div');
  section.className = 'modal-reco-section';

  var title = document.createElement('div');
  title.className = 'modal-reco-title';
  title.textContent = suggestion.title;
  section.appendChild(title);

  var grid = document.createElement('div');
  grid.className = 'modal-reco-grid';

  related.forEach(function(rp) {
    var card = document.createElement('div');
    card.className = 'reco-card';
    card.addEventListener('click', function() {
      openProductModal(rp, true);
    });

    var img = document.createElement('img');
    img.loading = 'lazy';
    img.src = rp.image_url || '';
    img.alt = rp.name;
    img.onerror = function() {
      this.style.display = 'none';
    };
    card.appendChild(img);

    var info = document.createElement('div');
    info.className = 'reco-card-info';
    var name = document.createElement('div');
    name.className = 'reco-card-name';
    name.textContent = rp.name;
    info.appendChild(name);
    var price = document.createElement('div');
    price.className = 'reco-card-price';
    price.textContent = formatPrice(rp.price_kmf, 'KMF');
    info.appendChild(price);
    card.appendChild(info);

    grid.appendChild(card);
  });

  section.appendChild(grid);

  // "Voir plus" button for progressive discovery
  if (_products.filter(function(p) { return p.id !== product.id && p.stock > 0; }).length > 4) {
    var moreBtn = document.createElement('button');
    moreBtn.style.cssText = 'background:none;border:none;color:var(--primary);font-size:0.82rem;font-weight:600;padding:10px 0;cursor:pointer;width:100%;text-align:center;';
    var moreCount = _products.filter(function(p) { return p.id !== product.id && p.stock > 0; }).length;
    moreBtn.textContent = 'Voir plus (' + moreCount + ')';
    moreBtn.addEventListener('click', function() {
      closeProductModal();
      _activeCategory = 'all';
      _searchQuery = '';
      $('nav-search').value = '';
      renderCategoryTabs();
      applyFilters();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    section.appendChild(moreBtn);
  }

  container.appendChild(section);
}

/* ═══ CART — localStorage persistence ═══ */
function loadCart() {
  try {
    var saved = localStorage.getItem('kmrc_cart');
    var ver = localStorage.getItem('kmrc_cart_v');
    if (saved && Number(ver) === CART_VERSION) {
      _cart = JSON.parse(saved);
    } else {
      _cart = [];
    }
  } catch (e) { _cart = []; }
  refreshCartBadge();
}

function saveCart() {
  try {
    localStorage.setItem('kmrc_cart', JSON.stringify(_cart));
    localStorage.setItem('kmrc_cart_v', String(CART_VERSION));
  } catch (e) { console.warn('saveCart:', e); }
}

function cartQty() { return _cart.reduce(function(s, i) { return s + i.qty; }, 0); }
function cartTotal() { return _cart.reduce(function(s, i) { return s + (i.product.price_kmf || 0) * i.qty; }, 0); }

function refreshCartBadge() {
  var badge = $('cart-count');
  if (!badge) return;
  var count = cartQty();
  badge.textContent = count;
  if (count > 0) {
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function addToCart(product, qty) {
  qty = qty || 1;
  var existing = _cart.find(function(i) { return String(i.product.id) === String(product.id); });
  if (existing) {
    existing.qty += qty;
  } else {
    _cart.push({ product: product, qty: qty });
  }
  saveCart();
  refreshCartBadge();
}

function removeFromCart(productId) {
  var pid = String(productId);
  _cart = _cart.filter(function(i) { return String(i.product.id) !== pid; });
  saveCart();
  renderCartBody();
}

function setCartItemQty(productId, qty) {
  var pid = String(productId);
  var item = _cart.find(function(i) { return String(i.product.id) === pid; });
  if (!item) return;
  if (qty <= 0) {
    removeFromCart(productId);
    return;
  }
  item.qty = qty;
  saveCart();
  renderCartBody();
}

/* ═══ SUBMIT ORDER ═══ */
async function submitOrder(btn) {
  var recipName, recipPhone, clientName, clientPhone, clientEmail;

  if (_orderData.is_self_pickup) {
    recipName = ($('of-my-name').value || '').trim();
    recipPhone = ($('of-my-phone').value || '').trim();
    clientName = recipName;
    clientPhone = '+269' + recipPhone.replace(/\s/g, '');
    var emailEl = $('of-my-email');
    clientEmail = emailEl ? emailEl.value.trim() : '';
  } else {
    recipName = ($('of-recip-name').value || '').trim();
    recipPhone = '+269' + ($('of-recip-phone').value || '').trim().replace(/\s/g, '');
    clientName = ($('of-client-name').value || '').trim();
    clientPhone = ($('of-client-phone').value || '').trim();
    var emailEl2 = $('of-client-email');
    clientEmail = emailEl2 ? emailEl2.value.trim() : '';
  }

  var relaisId = ($('of-relais').value || '').trim();

  // Validation
  if (!recipName) { toast('Nom requis', 'error'); return; }
  if (!recipPhone || recipPhone.length < 6) { toast('Téléphone requis', 'error'); return; }
  if (!relaisId) { toast('Choisissez un point relais', 'error'); return; }

  // Build items
  var items = _cart.map(function(i) {
    return { product_id: i.product.id, quantity: i.qty };
  });

  var body = {
    items: items,
    relais_id: relaisId,
    recipient_name: recipName,
    recipient_phone: recipPhone,
    is_self_pickup: _orderData.is_self_pickup,
    payment_mode: 'cash_relais'
  };
  if (clientName) body.client_name = clientName;
  if (clientPhone) body.client_phone = clientPhone;
  if (clientEmail) body.client_email = clientEmail;

  btn.disabled = true;
  btn.textContent = '⏳ Envoi en cours...';

  try {
    // Guest checkout first
    try {
      await apiPost('/api/auth/guest-checkout', {
        name: clientName || recipName,
        phone: clientPhone || recipPhone,
        email: clientEmail || undefined
      });
    } catch (e) {
      // Might already be logged in, continue
    }

    var result = await apiPost('/api/orders', body);
    toast('Commande confirmée ! 🎉', 'success');
    _cart = [];
    saveCart();
    refreshCartBadge();
    closeCheckout();

    // Show success message
    showOrderSuccess(result);
  } catch (e) {
    toast(e.message || 'Erreur lors de la commande', 'error');
    btn.disabled = false;
    btn.textContent = '✅ Confirmer la commande';
  }
}

function showOrderSuccess(result) {
  var overlay = $('checkout-overlay');
  var modal = $('checkout-modal');
  modal.innerHTML = '<div style="text-align:center;padding:40px 20px;">'
    + '<div style="font-size:3rem;margin-bottom:16px;">🎉</div>'
    + '<h2 style="font-size:1.2rem;margin-bottom:8px;">Commande confirmée !</h2>'
    + '<p style="font-size:0.88rem;color:var(--muted);margin-bottom:20px;">Votre commande a bien été enregistrée.<br>Paiement au retrait en KMF.</p>'
    + (result && result.order && result.order.id ? '<p style="font-size:0.8rem;color:var(--muted);">Réf: ' + result.order.id.slice(0, 8) + '</p>' : '')
    + '<button class="checkout-submit-btn" onclick="closeCheckout()" style="margin-top:20px;">Continuer mes achats</button>'
    + '</div>';
  overlay.classList.add('open');
}

function liveSearch() {

    closeSearchDropdown();
    return;
  }
  var results = _products.filter(function(p) {
    var hay = (p.name + ' ' + (p.description || '') + ' ' + (p.category || '')).toLowerCase();
    return hay.indexOf(q) >= 0;
  }).slice(0, 8);

  var dd = $('search-dropdown');
  dd.innerHTML = '';

  if (results.length === 0) {
    dd.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:0.85rem;">Aucun résultat</div>';
    dd.classList.add('open');
    return;
  }

  results.forEach(function(p) {
    var item = document.createElement('div');
    item.className = 'search-item';
    item.addEventListener('click', function() {
      closeSearchDropdown();
      openProductModal(p);
    });

    var img = document.createElement('img');
    img.src = p.image_url || '';
    img.alt = p.name;
    img.onerror = function() { this.style.display = 'none'; };
    item.appendChild(img);

    var info = document.createElement('div');
    info.className = 'search-item-info';
    var name = document.createElement('div');
    name.className = 'search-item-name';
    name.textContent = (p.emoji || '') + ' ' + p.name;
    info.appendChild(name);
    var price = document.createElement('div');
    price.className = 'search-item-price';
    price.textContent = formatPrice(p.price_kmf, 'KMF');
    info.appendChild(price);
    item.appendChild(info);

    dd.appendChild(item);
  });

  dd.classList.add('open');
}

function closeSearchDropdown() {

  $('search-dropdown').innerHTML = '';
}

/* ═══ FAVORITES ═══ */
function loadFavs() {
  try {
    var saved = localStorage.getItem('komerce_favs');
    _favs = saved ? JSON.parse(saved) : [];
  } catch (e) { _favs = []; }
}

function saveFavs() {
  localStorage.setItem('komerce_favs', JSON.stringify(_favs));
}

function isFav(id) {
  return _favs.indexOf(String(id)) >= 0;
}

function toggleFav(id) {
  var sid = String(id);
  var idx = _favs.indexOf(sid);
  if (idx >= 0) {
    _favs.splice(idx, 1);
    toast('Retiré des favoris', 'info');
  } else {
    _favs.push(sid);
    toast('Ajouté aux favoris ♥', 'success');
  }
  saveFavs();
  updateFavBadge();
}

function updateFavBadge() {
  var btn = $('fav-nav-btn');
  if (!btn) return;
  btn.style.color = _favs.length > 0 ? 'var(--accent)' : '';
}

function showFavoritesFilter() {
  if (_favs.length === 0) {
    toast('Aucun favori', 'info');
    return;
  }
  // Filter to show only favorites
  _searchQuery = '';
  $('nav-search').value = '';
  _activeCategory = 'all';
  renderCategoryTabs();

  _filtered = _products.filter(function(p) { return isFav(p.id); });
  _shown = 0;
  $('products-grid').innerHTML = '';
  renderNextBatch();

  toast(_favs.length + ' favori(s)', 'info');
}

/* ═══ INFINITE SCROLL (IntersectionObserver) ═══ */
function initInfiniteScroll() {
  var sentinel = $('scroll-sentinel');
  if (!sentinel || !('IntersectionObserver' in window)) return;

  var observer = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting && _shown < _filtered.length) {
      renderNextBatch();
    }
  }, { rootMargin: '200px' });

  observer.observe(sentinel);
}

/* ═══ SCROLL TO TOP ═══ */
function initScrollToTop() {
  var btn = $('scroll-top-btn');
  window.addEventListener('scroll', debounce(function() {
    if (window.scrollY > 400) {
      btn.classList.add('show');
    } else {
      btn.classList.remove('show');
    }
  }, 100));
}

/* ═══ PWA ═══ */
function initPWA() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then(function(reg) {
      console.log('SW registered:', reg.scope);
    }).catch(function(e) {
      console.warn('SW registration failed:', e);
    });
  }
}

/* ═══ KEYBOARD SHORTCUTS ═══ */
function initKeyboard() {
  document.addEventListener('keydown', function(e) {
    // Escape closes modals
    if (e.key === 'Escape') {
      if ($('product-modal-overlay').classList.contains('open')) {
        closeProductModal();
      } else if ($('checkout-overlay').classList.contains('open')) {
        closeCheckout();
      } else if ($('cart-drawer').classList.contains('open')) {
        closeCart();
      }
    }
    // Ctrl+K = focus search
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      $('nav-search').focus();
    }
  });
}

/* ═══ INIT ═══ */
async function init() {
  console.log('🛍️ Komerce Boutique — Clean Rebuild');

  // Load saved data
  loadFavs();
  loadCart();
  updateFavBadge();

  // Render category tabs
  renderCategoryTabs();

  // Start promo rotation
  rotatePromo();
  setInterval(rotatePromo, 6000);

  // Load products + relais
  await Promise.all([loadProducts(), loadRelais()]);

  // Init features
  initInfiniteScroll();
  initScrollToTop();
  initKeyboard();
  initPWA();

  // Search input
  $('nav-search').addEventListener('input', debounce(liveSearch, 250));
  $('nav-search').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
  });

  // Close search dropdown on outside click
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.nav-search-wrap')) {
      closeSearchDropdown();
    }
  });

  console.log('✅ Boutique initialized — ' + _products.length + ' products loaded');
}

// Start
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
