<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier collectif — Komerce</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/boutique/css/dist/event.css?v=4">
</head>
<body data-event-page="public">

<div class="ev-wrap">

  <header class="ev-header">
    <a href="/" class="ev-header-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Boutique
    </a>
    <span class="ev-step-pill"><span class="ev-step-dot"></span> Participer</span>
  </header>

  <div id="ev-loading" class="ev-empty">⏳ Chargement du panier collectif…</div>
  <div id="ev-content" style="display:none;"></div>
  <div id="ev-error-block" class="ev-alert ev-alert-warn" style="display:none;"></div>

  <p class="ev-doctrine">
    Vous pouvez proposer un montant ou un message.<br>
    La commande sera lancée quand le panier sera couvert à 100&nbsp;%.<br>
    <strong>Paiement en cash au retrait du panier.</strong>
  </p>

</div>

<script src="/boutique/js/event-public.js"></script>
</body>
</html>
