<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Redirection — Panier groupe Komerce</title>
  <meta name="robots" content="noindex"/>
  <script>
    (function(){
      var pathMatch = location.pathname.match(/\/cart\/shared\/([^/?#]+)/);
      var qs = new URLSearchParams(location.search);
      var token = qs.get('p') || qs.get('token') || qs.get('share') || (pathMatch && pathMatch[1]) || '';
      var target = new URL('/boutique/', location.origin);
      target.searchParams.set('tab', 'group');
      if (token) target.searchParams.set('p', token);
      location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p>Redirection vers la boutique…</p>
</body>
</html>
