<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Redirection — Paiement Komerce</title>
  <meta name="robots" content="noindex"/>
  <script>
    (function(){
      var qs = new URLSearchParams(location.search);
      var token = qs.get('p') || qs.get('token') || qs.get('share') || '';
      var target = new URL('/boutique/', location.origin);
      target.searchParams.set('tab', 'group');
      target.searchParams.set('shared_payment', 'success');
      if (token) target.searchParams.set('p', token);
      location.replace(target.toString());
    })();
  </script>
</head>
<body><p>Retour vers la boutique…</p></body>
</html>
