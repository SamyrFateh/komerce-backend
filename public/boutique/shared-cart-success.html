<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Contribution enregistrée — Komerce</title>
  <link rel="icon" href="/images/logo_komerce.png"/>
  <style>
    :root { --green:#2e7d32; --red:#e53935; --bg:#f5f5f5; --border:#e0e0e0; --muted:#757575; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
           background:var(--bg); color:#1a1a1a; min-height:100vh;
           display:flex; flex-direction:column; align-items:center; justify-content:center;
           padding:24px; }
    .card {
      background:#fff; border-radius:20px; padding:36px 28px;
      box-shadow:0 4px 24px rgba(0,0,0,.09); max-width:400px; width:100%; text-align:center;
    }
    .icon { font-size:64px; margin-bottom:16px; }
    h1 { font-size:22px; font-weight:800; margin-bottom:8px; }
    .sub { font-size:15px; color:var(--muted); margin-bottom:6px; }
    .amount { font-size:18px; font-weight:700; color:var(--green); margin-bottom:24px; }
    .btn {
      display:block; width:100%; padding:15px;
      background:var(--red); color:#fff; border:none; border-radius:12px;
      font-size:16px; font-weight:800; text-decoration:none; cursor:pointer;
      box-shadow:0 4px 16px rgba(229,57,53,.3);
    }
    .countdown { font-size:12px; color:var(--muted); margin-top:12px; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Merci !</h1>
  <div class="sub" id="msg">Votre contribution a été enregistrée.</div>
  <div class="amount" id="amount-line" hidden></div>
  <a href="/boutique" class="btn">🛍️ Voir la boutique</a>
  <div class="countdown" id="countdown"></div>
</div>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const token  = params.get('token');
  const amount = params.get('amount');
  const cart   = params.get('cart');

  if (cart) {
    document.getElementById('msg').textContent =
      'Votre contribution au panier "' + decodeURIComponent(cart) + '" a été enregistrée.';
  }
  if (amount) {
    const el = document.getElementById('amount-line');
    el.textContent = new Intl.NumberFormat('fr-FR').format(+amount) + ' KMF';
    el.hidden = false;
  }

  // Countdown retour boutique (5 s)
  let s = 5;
  const cd = document.getElementById('countdown');
  cd.textContent = 'Retour à la boutique dans ' + s + ' s…';
  const t = setInterval(() => {
    s--;
    if (s <= 0) { clearInterval(t); window.location.href = '/boutique'; return; }
    cd.textContent = 'Retour à la boutique dans ' + s + ' s…';
  }, 1000);
})();
</script>
</body>
</html>
