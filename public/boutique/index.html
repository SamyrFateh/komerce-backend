/* Nuclear SW reset v302 â€” runs ONCE to clear all old caches */
(function(){
  if(localStorage.getItem('sw_reset_v312'))return;
  localStorage.setItem('sw_reset_v312','1');
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.getRegistrations().then(function(regs){
    Promise.all(regs.map(function(r){return r.unregister();})).then(function(){
      return caches.keys();
    }).then(function(keys){
      return Promise.all(keys.map(function(k){return caches.delete(k);}));
    }).then(function(){
      console.log('[RESET v312] All SWs unregistered, all caches cleared. Reloading...');
      location.reload();
    });
  });
})();
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){r.update();});
  });

  navigator.serviceWorker.addEventListener('message', function(e){
    if(e.data && e.data.type === 'sw-updated'){
      console.log('[SW] Nouvelle version', e.data.version, 'â†’ reload auto');
      location.reload();
    }
  });

  if(window.caches){
    caches.keys().then(function(names){
      names.forEach(function(n){
        if(n.indexOf('komerce-v312') === -1) caches.delete(n);
      });
    });
  }
}
</script>

  var spacer = document.getElementById('k-bar-spacer');
  if (!spacer) return;

  function isMobile(){ return window.innerWidth <= 899; }

  // â”€â”€ MOBILE : tout le wrap est fixe, on mesure sa hauteur â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function setupMobile(){
    if (!isMobile()) return;   // desktop : ne pas poser style.top
    var wrap = document.getElementById('k-hero-fixed-wrap');
    if (!wrap) return;
    function update(){
      if (!isMobile()) {
        // Desktop : remettre Ã  zÃ©ro les styles inline posÃ©s par mobile
        var scroll = document.getElementById('k-page-scroll');
        if (scroll) { scroll.style.top = ''; scroll.style.position = ''; }
        return;
      }
      var h = wrap.offsetHeight;
      spacer.style.display = 'none'; // spacer not needed with fixed scroll
      var scroll = document.getElementById('k-page-scroll');
      if (scroll && !scroll.classList.contains('k-pager-active')) {
        scroll.style.top = (h + 44) + 'px'; // 44px = header height
      }
    }
    update();
    // Re-mesure aprÃ¨s chargement de l'image hero
    var img = wrap.querySelector('.k-hero-img');
    if (img && !img.complete) img.addEventListener('load', update);
    window.addEventListener('resize', update);
  }

  // â”€â”€ DESKTOP : IntersectionObserver sticky bar â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function setupDesktop(){
    var sentinel = document.getElementById('k-bar-sentinel');
    var bar = document.getElementById('k-sticky-bar');
    if(!sentinel || !bar) return;
    spacer.style.height = bar.offsetHeight + 'px';
    var observer = new IntersectionObserver(function(entries){
      if(entries[0].isIntersecting){
        bar.classList.remove('is-stuck');
        spacer.style.display = 'none';
      } else {
        bar.classList.add('is-stuck');
        spacer.style.display = 'block';
      }
    }, { rootMargin: '-44px 0px 0px 0px' });
    observer.observe(sentinel);
    window.addEventListener('resize', function(){
      spacer.style.height = bar.offsetHeight + 'px';
    });
  }

  if (isMobile()) {
    setupMobile();
  } else {
    setupDesktop();
    // Desktop : brancher les boutons hero CTA
    var ctaPrimary = document.querySelector('.k-hero-cta-primary');
    if (ctaPrimary) {
      ctaPrimary.addEventListener('click', function() {
        var catalog = document.getElementById('k-catalog-section');
        if (catalog) catalog.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
    var ctaGhost = document.querySelector('.k-hero-cta-ghost');
    if (ctaGhost) {
      ctaGhost.addEventListener('click', function() {
        // "Suivre ma commande" â†’ tab track
        var trackBtn = document.querySelector('.k-bnav-item[data-tab="track"]');
        if (trackBtn) trackBtn.click();
        else {
          var trackNav = document.querySelector('[data-tab="track"]');
          if (trackNav) trackNav.click();
        }
      });
    }
  }

  // â”€â”€ Proxy window.scrollY / window.scrollTo â€” resize-safe â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  // InstallÃ© une fois ; rÃ©Ã©value isMobile() Ã  chaque appel (pas au load).
  // Mobile  â†’ redirige vers #k-page-scroll (scroll container fixe)
  // Desktop â†’ dÃ©lÃ¨gue Ã  la fonction native sauvegardÃ©e (_nativeScrollTo)
  try {
    var _nativeScrollTo = window.scrollTo.bind(window);
    Object.defineProperty(window, 'scrollY', {
      get: function(){
        if (isMobile()) { var s=document.getElementById('k-page-scroll'); return s?s.scrollTop:0; }
        return window.pageYOffset;
      },
      configurable: true
    });
    window.scrollTo = function(x, y){
      if (isMobile()) {
        var s = document.getElementById('k-page-scroll');
        if (!s) return;
        if (x !== null && typeof x === 'object') {
          s.scrollTo({ top: x.top||0, behavior: x.behavior||'auto' });
        } else {
          s.scrollTop = (typeof y === 'number') ? y : 0;
        }
      } else {
        if (x !== null && typeof x === 'object') { _nativeScrollTo(x); }
        else { _nativeScrollTo(x, y); }
      }
    };
  } catch(e) {}
})();
