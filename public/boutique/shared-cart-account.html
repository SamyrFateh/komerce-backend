<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes paniers partagés — Komerce</title>
<link rel="icon" href="/icons/favicon.ico">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #f8fafc; color: #1e293b; min-height: 100vh;
  }
  .sa-app { max-width: 800px; margin: 0 auto; padding: 16px; }

  .sa-header {
    background: linear-gradient(135deg, #16a34a, #15803d);
    color: white; padding: 18px; border-radius: 12px;
    margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  }
  .sa-header h1 { margin: 0; font-size: 1.25rem; font-weight: 800; }
  .sa-header a { color: white; text-decoration: none; }

  .sa-back {
    background: rgba(255,255,255,0.2); padding: 6px 12px;
    border-radius: 6px; font-size: 0.85rem; margin-right: auto;
  }

  .sa-card {
    background: white; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
  }

  .sa-empty {
    background: white; border: 2px dashed #cbd5e1; border-radius: 12px;
    padding: 40px 20px; text-align: center; color: #64748b;
  }

  .sa-cart-card {
    background: white; border: 1px solid #e2e8f0; border-radius: 12px;
    margin-bottom: 12px; overflow: hidden;
  }
  .sa-cart-head {
    padding: 14px 16px; border-bottom: 1px solid #e2e8f0;
    display: flex; align-items: center; gap: 10px;
  }
  .sa-cart-title { font-size: 1rem; font-weight: 700; flex: 1; }
  .sa-status {
    padding: 3px 10px; border-radius: 12px;
    font-size: 0.7rem; font-weight: 700;
  }
  .sa-status-active { background: #dbeafe; color: #1e40af; }
  .sa-status-partial { background: #fef9c3; color: #854d0e; }
  .sa-status-funded { background: #dcfce7; color: #14532d; }
  .sa-status-converted { background: #f1f5f9; color: #475569; }
  .sa-status-expired { background: #fee2e2; color: #b91c1c; }
  .sa-status-cancelled { background: #f1f5f9; color: #64748b; }

  .sa-cart-body { padding: 14px 16px; }

  .sa-progress {
    height: 8px; background: #f1f5f9; border-radius: 4px;
    overflow: hidden; margin: 8px 0;
  }
  .sa-progress-fill {
    height: 100%; background: #16a34a; transition: width 0.3s;
  }

  .sa-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin: 10px 0;
  }
  .sa-stat {
    background: #f8fafc; padding: 8px; border-radius: 6px;
    text-align: center;
  }
  .sa-stat-label {
    font-size: 0.65rem; color: #94a3b8;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .sa-stat-value {
    font-size: 0.92rem; font-weight: 700; font-family: ui-monospace,monospace;
    margin-top: 2px;
  }

  .sa-actions {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
  }
  .sa-btn {
    flex: 1; min-width: 100px; padding: 9px 12px;
    font-size: 0.85rem; font-weight: 600; border-radius: 6px;
    border: 1px solid #cbd5e1; background: white; color: #1e293b;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
    text-align: center;
  }
  .sa-btn:hover { background: #f1f5f9; }
  .sa-btn-primary { background: #16a34a; color: white; border-color: #15803d; }
  .sa-btn-primary:hover { background: #15803d; }
  .sa-btn-whatsapp { background: #25d366; color: white; border-color: #128c7e; }
  .sa-btn-whatsapp:hover { background: #128c7e; }
  .sa-btn-danger { color: #dc2626; border-color: #fecaca; }
  .sa-btn-danger:hover { background: #fef2f2; }

  .sa-meta {
    font-size: 0.78rem; color: #64748b; margin-top: 6px;
    display: flex; justify-content: space-between;
  }

  .sa-share-url {
    background: #f1f5f9; padding: 8px 10px; border-radius: 6px;
    font-family: ui-monospace, monospace; font-size: 0.78rem;
    color: #475569; word-break: break-all; margin: 8px 0;
    border: 1px solid #e2e8f0;
  }

  .sa-tip {
    background: #ecfdf5; padding: 10px 14px; border-radius: 8px;
    border-left: 3px solid #16a34a; margin: 12px 0;
    font-size: 0.85rem; color: #065f46;
  }

  .sa-loading, .sa-error {
    text-align: center; padding: 40px 20px;
  }
  .sa-error { color: #b91c1c; }

  /* Modal partage */
  .sa-modal-bg {
    position: fixed; inset: 0; background: rgba(15,23,42,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .sa-modal-bg.open { display: flex; }
  .sa-modal {
    background: white; border-radius: 12px; max-width: 480px;
    width: 100%;
  }
  .sa-modal-head {
    padding: 14px 16px; border-bottom: 1px solid #e2e8f0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sa-modal-head h2 { margin: 0; font-size: 1rem; }
  .sa-modal-close {
    background: none; border: none; font-size: 1.4rem;
    color: #94a3b8; cursor: pointer; padding: 0; width: 28px;
  }
  .sa-modal-body { padding: 16px; }
</style>
</head>
<body>

<div class="sa-app">
  <div class="sa-header">
    <a href="/mon-compte" class="sa-back">← Mon compte</a>
    <h1>🤝 Mes paniers partagés</h1>
  </div>

  <div class="sa-tip">
    💡 Composez un panier sur la boutique, puis revenez ici pour le partager avec votre famille.
  </div>

  <div id="sa-content">
    <div class="sa-loading">⏳ Chargement de vos paniers...</div>
  </div>
</div>

<!-- Modal partage -->
<div class="sa-modal-bg" id="sa-modal">
  <div class="sa-modal">
    <div class="sa-modal-head">
      <h2>📤 Partager le panier</h2>
      <button class="sa-modal-close" id="sa-modal-close">×</button>
    </div>
    <div class="sa-modal-body" id="sa-modal-body"></div>
  </div>
</div>

<script>
'use strict';

const API = '/api/shared-carts';
const NF = new Intl.NumberFormat('fr-FR');
function fmtKmf(n) { return NF.format(Math.round(n || 0)) + ' KMF'; }
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function api(method, path, body) {
  const opts = { method, credentials: 'include', headers: { 'Content-Type': 'application/json' } };
  if (body != null) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (!res.ok) {
    if (res.status === 401) {
      window.location.href = '/mon-compte?return=/account/shared-carts';
      return;
    }
    const err = await res.json().catch(() => ({ error: 'HTTP ' + res.status }));
    throw new Error(err.error || ('HTTP ' + res.status));
  }
  return res.json();
}

const STATUS_LABELS = {
  draft:               { cls: 'sa-status-active',    label: '📝 Brouillon' },
  active:              { cls: 'sa-status-active',    label: '🌱 Actif' },
  partially_funded:    { cls: 'sa-status-partial',   label: '⏳ En cours' },
  fully_funded:        { cls: 'sa-status-funded',    label: '✅ Financé' },
  converted_to_order:  { cls: 'sa-status-converted', label: '📦 Commandé' },
  expired:             { cls: 'sa-status-expired',   label: '⌛ Expiré' },
  cancelled:           { cls: 'sa-status-cancelled', label: '❌ Annulé' },
  refunded:            { cls: 'sa-status-cancelled', label: '↩️ Remboursé' },
};

async function loadAndRender() {
  try {
    const data = await api('GET', API + '/mine');
    if (!data.carts || !data.carts.length) {
      document.getElementById('sa-content').innerHTML =
        '<div class="sa-empty">' +
        '<h3 style="margin:0 0 8px;color:#1e293b;">Aucun panier partagé</h3>' +
        '<p>Composez d\'abord un panier sur la boutique, puis revenez ici pour le partager.</p>' +
        '<a href="/" class="sa-btn sa-btn-primary" style="display:inline-block;margin-top:14px;text-decoration:none;">→ Aller à la boutique</a>' +
        '</div>';
      return;
    }
    let html = '';
    data.carts.forEach(c => { html += renderCart(c); });
    document.getElementById('sa-content').innerHTML = html;
    bindEvents();
  } catch (err) {
    document.getElementById('sa-content').innerHTML =
      '<div class="sa-error">Erreur : ' + esc(err.message) + '</div>';
  }
}

function renderCart(c) {
  const status = STATUS_LABELS[c.status] || { cls: 'sa-status-cancelled', label: c.status };
  const total = c.total_kmf_snapshot;
  const pct = total > 0 ? Math.min(100, Math.round((c.contributed_kmf / total) * 100)) : 0;
  const expired = new Date(c.expires_at) < new Date();
  const isOpen = ['active', 'partially_funded', 'fully_funded'].includes(c.status) && !expired;
  const canFinalize = isOpen;
  const canCancel = ['active', 'partially_funded'].includes(c.status);

  let html = '<div class="sa-cart-card">';
  html += '<div class="sa-cart-head">';
  html += '<div class="sa-cart-title">' + esc(c.title || 'Panier partagé') + '</div>';
  html += '<span class="sa-status ' + status.cls + '">' + status.label + '</span>';
  html += '</div>';

  html += '<div class="sa-cart-body">';

  // Progression
  html += '<div class="sa-progress"><div class="sa-progress-fill" style="width:' + pct + '%"></div></div>';

  // 3 montants
  html += '<div class="sa-stats">';
  html += '<div class="sa-stat"><div class="sa-stat-label">Total</div><div class="sa-stat-value">' + fmtKmf(total) + '</div></div>';
  html += '<div class="sa-stat"><div class="sa-stat-label">Contribué</div><div class="sa-stat-value" style="color:#16a34a;">' + fmtKmf(c.contributed_kmf) + '</div></div>';
  html += '<div class="sa-stat"><div class="sa-stat-label">Reste</div><div class="sa-stat-value" style="color:#d97706;">' + fmtKmf(c.remaining_kmf) + '</div></div>';
  html += '</div>';

  // Meta
  const date = new Date(c.created_at).toLocaleDateString('fr-FR');
  const exp = new Date(c.expires_at).toLocaleDateString('fr-FR');
  html += '<div class="sa-meta">';
  html += '<span>Créé le ' + date + '</span>';
  html += '<span>' + (c.contributors_count || 0) + ' contributeur(s)</span>';
  html += '<span>Expire le ' + exp + '</span>';
  html += '</div>';

  // Hint si partiellement financé
  if (c.status === 'partially_funded' && canFinalize) {
    html += '<div class="sa-tip" style="margin-top:10px;">';
    html += '💡 Vous pouvez finaliser maintenant et payer le reste (<strong>' + fmtKmf(c.remaining_kmf) + '</strong>) au point relais.';
    html += '</div>';
  }
  if (c.status === 'fully_funded') {
    html += '<div class="sa-tip" style="margin-top:10px;">';
    html += '✅ Panier entièrement financé ! Vous pouvez le finaliser maintenant.';
    html += '</div>';
  }

  // Actions
  html += '<div class="sa-actions">';

  if (isOpen) {
    html += '<button class="sa-btn sa-btn-primary" data-act="share" data-id="' + c.id + '">📤 Partager</button>';
  }
  if (canFinalize) {
    html += '<button class="sa-btn" data-act="finalize" data-id="' + c.id + '">✅ Finaliser commande</button>';
  }
  if (c.finalized_order_id) {
    html += '<a href="/mon-compte#order=' + c.finalized_order_id + '" class="sa-btn" style="text-decoration:none;line-height:1.4;">📦 Voir la commande</a>';
  }
  if (canCancel) {
    html += '<button class="sa-btn sa-btn-danger" data-act="cancel" data-id="' + c.id + '">❌ Annuler</button>';
  }
  html += '</div>';

  html += '</div></div>';

  // Stocker l'URL de partage en attribut data sur le card pour le bouton share
  return html.replace(
    '<div class="sa-cart-card">',
    '<div class="sa-cart-card" data-share-url="' + esc(c.share_url || '') + '" data-token="' + esc(c.token) + '" data-title="' + esc(c.title || '') + '">'
  );
}

function bindEvents() {
  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const act = btn.dataset.act;
      const id = btn.dataset.id;
      const card = btn.closest('.sa-cart-card');

      if (act === 'share') {
        openShareModal(card.dataset.shareUrl, card.dataset.title);
        return;
      }
      if (act === 'finalize') {
        if (!confirm('Finaliser ce panier en commande ?\n\nLe stock et les prix seront re-vérifiés.')) return;
        btn.disabled = true;
        btn.textContent = '⏳ Finalisation...';
        try {
          const r = await api('POST', API + '/' + id + '/finalize', {});
          alert('✅ Commande créée : ' + r.order_reference + '\n\nReste à payer en cash : ' + fmtKmf(r.remaining_cash_kmf));
          await loadAndRender();
        } catch (err) {
          alert('Erreur : ' + err.message);
          btn.disabled = false;
          btn.textContent = '✅ Finaliser commande';
        }
        return;
      }
      if (act === 'cancel') {
        const reason = prompt('Raison de l\'annulation (optionnel) :') || '';
        if (!confirm('Annuler ce panier partagé ?\n\nLes contributions déjà reçues devront être remboursées par l\'admin Komerce.')) return;
        btn.disabled = true;
        btn.textContent = '⏳ Annulation...';
        try {
          await api('POST', API + '/' + id + '/cancel', { reason });
          await loadAndRender();
        } catch (err) {
          alert('Erreur : ' + err.message);
          btn.disabled = false;
          btn.textContent = '❌ Annuler';
        }
        return;
      }
    });
  });
}

function openShareModal(shareUrl, title) {
  const waMsg = encodeURIComponent(
    '🤝 Aidez-moi à financer ce panier Komerce !\n\n' +
    (title ? '« ' + title + ' »\n\n' : '') +
    'Voici le lien :\n' + shareUrl
  );
  let html = '';
  html += '<p style="font-size:0.88rem;color:#475569;margin:0 0 10px;">';
  html += 'Envoyez ce lien à vos proches pour qu\'ils contribuent au panier :';
  html += '</p>';
  html += '<div class="sa-share-url" id="sa-share-url-text">' + esc(shareUrl) + '</div>';
  html += '<div class="sa-actions">';
  html += '<button class="sa-btn sa-btn-primary" id="sa-copy-btn">📋 Copier le lien</button>';
  html += '<a class="sa-btn sa-btn-whatsapp" href="https://wa.me/?text=' + waMsg + '" target="_blank" rel="noopener" style="text-decoration:none;line-height:1.4;">💬 WhatsApp</a>';
  html += '</div>';
  html += '<p style="font-size:0.78rem;color:#94a3b8;margin-top:14px;">';
  html += '💡 Partagez aussi sur Messenger, par SMS ou par email — toute personne ayant ce lien peut contribuer.';
  html += '</p>';

  document.getElementById('sa-modal-body').innerHTML = html;
  document.getElementById('sa-modal').classList.add('open');

  document.getElementById('sa-copy-btn').addEventListener('click', () => {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(shareUrl).then(() => {
        document.getElementById('sa-copy-btn').textContent = '✅ Copié !';
        setTimeout(() => {
          const b = document.getElementById('sa-copy-btn');
          if (b) b.textContent = '📋 Copier le lien';
        }, 1500);
      });
    } else {
      // Fallback : sélectionner le texte
      const range = document.createRange();
      range.selectNode(document.getElementById('sa-share-url-text'));
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      document.getElementById('sa-copy-btn').textContent = '✅ Copié !';
    }
  });
}

document.getElementById('sa-modal-close').addEventListener('click', () => {
  document.getElementById('sa-modal').classList.remove('open');
});
document.getElementById('sa-modal').addEventListener('click', (e) => {
  if (e.target.id === 'sa-modal') {
    document.getElementById('sa-modal').classList.remove('open');
  }
});

loadAndRender();
</script>
</body>
</html>
