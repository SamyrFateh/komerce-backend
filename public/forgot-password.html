<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Mot de passe oublié — Komerce</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fa;font:16px system-ui,sans-serif;color:#1b2a40}
main{background:#fff;border-radius:18px;box-shadow:0 12px 36px #1a355b15;max-width:460px;width:calc(100% - 36px);padding:34px}
h1{font-size:1.6rem;margin:.3rem 0 1rem}p{line-height:1.5;color:#55657a}
label{display:block;font-weight:600;margin-top:18px}input{margin-top:8px;width:100%;padding:12px;border:1px solid #bac6d6;border-radius:9px;font:inherit}
button{width:100%;background:#154b87;color:#fff;border:0;border-radius:9px;padding:13px;font:inherit;font-weight:600;margin-top:24px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}#message{min-height:24px}.eyebrow{color:#285d91;font-weight:700;letter-spacing:.05em}
</style>
</head>
<body>
<main>
<div class="eyebrow">KOMERCE</div>
<h1>Mot de passe oublié ?</h1>
<p>Indiquez votre adresse email. Si un compte y est associé, vous recevrez un lien de réinitialisation valable 30 minutes.</p>
<form id="forgot-form">
<label for="email">Email du compte</label>
<input id="email" type="email" autocomplete="email" maxlength="254" required>
<button id="send-button" type="submit">Recevoir un lien</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script src="/js/forgot-password.js" defer></script>
</body>
</html>
