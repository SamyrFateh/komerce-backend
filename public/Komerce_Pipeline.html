<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komerce — Pipeline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b45309">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Komerce">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<text y='.9em' font-size='90'>🔄</text></svg>">
<link rel="stylesheet" href="komerce-ui.css">
<style>
.pipeline-top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:0 0 1rem}
.pipeline-total{font-family:var(--display);font-size:1.25rem;color:var(--text);white-space:nowrap}
.filter-group{display:flex;gap:.35rem;flex-wrap:wrap}
.filter-btn{padding:.35rem .75rem;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .15s}
.filter-btn:hover{border-color:var(--gold);color:var(--gold)}
.filter-btn.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
.pipeline-search{width:180px}
.kanban{overflow-x:auto;padding-bottom:1rem;display:flex;gap:.75rem;align-items:flex-start;min-height:60vh}
.kanban-col{min-width:220px;max-width:260px;flex:1 0 220px;background:var(--bg2);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 180px)}
.kanban-col-hdr{padding:.75rem;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);border-radius:10px 10px 0 0;z-index:1}
.kanban-col-hdr .col-count{font-family:var(--mono);font-size:.85rem;color:var(--text3)}
.kanban-col-hdr .col-count.has-stagnant{color:var(--red);font-weight:700}
.kanban-col-body{padding:.5rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:.5rem}
.kanban-card{background:var(--bg);border-radius:8px;padding:.65rem .75rem;box-shadow:var(--shadow);border-left:3px solid transparent;cursor:default;transition:border-color .2s}
.kanban-card.stagnant{border-left-color:var(--red);animation:pulse-border 2s infinite}
@keyframes pulse-border{0%,100%{border-left-color:var(--red)}50%{border-left-color:transparent}}
.kc-ref{font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--text)}
.kc-row{display:flex;align-items:center;justify-content:space-between;margin-top:.3rem}
.kc-age{font-size:.65rem;padding:.15rem .45rem;border-radius:4px;font-weight:600}
.kc-age.age-ok{background:rgba(16,185,129,.15);color:var(--green)}
.kc-age.age-warn{background:rgba(245,158,11,.15);color:var(--gold)}
.kc-age.age-crit{background:rgba(239,68,68,.15);color:var(--red)}
.kc-island{font-size:.75rem;color:var(--text3);margin-top:.25rem;display:flex;align-items:center;gap:.35rem}
.kc-pay{font-size:.8rem}
.kc-amount{font-family:var(--mono);font-size:.8rem;color:var(--text2);margin-top:.2rem}
.secondary-section{margin-top:1.5rem}
.secondary-toggle{display:flex;align-items:center;gap:.5rem;cursor:pointer;color:var(--text3);font-size:.85rem;padding:.5rem 0;user-select:none}
.secondary-toggle:hover{color:var(--text2)}
.secondary-toggle .arrow{transition:transform .2s;display:inline-block}
.secondary-toggle .arrow.open{transform:rotate(90deg)}
.secondary-kanban{display:none;gap:.75rem;overflow-x:auto;padding:.75rem 0}
.secondary-kanban.open{display:flex}
.secondary-kanban .kanban-col{min-width:200px;max-width:240px;max-height:300px}
.back-link{font-size:.85rem;color:var(--text3);text-decoration:none;display:flex;align-items:center;gap:.3rem}
.back-link:hover{color:var(--gold)}
.hdr-right{display:flex;align-items:center;gap:1rem}
.empty-col{color:var(--text3);font-size:.8rem;text-align:center;padding:2rem .5rem;opacity:.6}
.refresh-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:.35rem .65rem;cursor:pointer;color:var(--text2);font-size:.85rem;display:flex;align-items:center;gap:.3rem;transition:all .15s}
.refresh-btn:hover{border-color:var(--gold);color:var(--gold)}
.refresh-btn.spinning .r-icon{animation:spin .6s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.stagnant-dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse-dot 1.5s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
</style>
<style>
@media(max-width:768px){
  .hdr{flex-wrap:wrap;gap:6px;height:auto !important;min-height:48px;padding:8px 12px !important}
  .kanban{flex-direction:column !important;gap:12px !important}
  .kanban-col{min-width:auto !important;width:100% !important;max-height:400px}
  .filters{flex-wrap:wrap;gap:6px}
  .filter-input{min-width:150px}
}
.pwa-standalone .hdr{padding-top:calc(8px + env(safe-area-inset-top,0px)) !important}
</style>
</head>
<body>
  <div class="hdr">
    <div class="logo">K<em>OMERCE</em> · PIPELINE</div>
    <div class="hdr-right">
      <a href="portal.html" class="back-link">← Retour portail</a>
      <span class="conn-pill ok" id="connStatus"><span class="conn-dot pulse"></span> En ligne</span>
      <span id="userInfo" style="font-size:0.875rem;color:var(--text3)"></span>
      <span id="userRole" style="font-size:0.7rem;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(217,119,6,.12);color:var(--gold);text-transform:uppercase;letter-spacing:.5px"></span>
      <button class="btn btn-ghost btn-sm" id="btnLogout" style="font-size:0.8rem;padding:6px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text2);background:var(--bg2)" onclick="K.auth.logout().then(()=>location.href='portal.html')">Déconnexion</button>
    </div>
  </div>

  <div style="padding:1rem 1.25rem;max-width:100%;overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 52px)">

    <!-- Top bar: total, filters, search, refresh -->
    <div class="pipeline-top">
      <div class="pipeline-total" id="totalCount">— commandes</div>
      <div class="filter-group" id="islandFilters">
        <button class="filter-btn active" data-island="">Toutes</button>
        <button class="filter-btn" data-island="Anjouan">Anjouan</button>
        <button class="filter-btn" data-island="Grande Comore">Grande Comore</button>
        <button class="filter-btn" data-island="Mohéli">Mohéli</button>
        <button class="filter-btn" data-island="Mayotte">Mayotte</button>
      </div>
      <input type="text" class="inp pipeline-search" id="searchRef" placeholder="🔍 Rechercher réf…">
      <button class="refresh-btn" id="refreshBtn"><span class="r-icon">↻</span> Rafraîchir</button>
    </div>

    <!-- Main kanban -->
    <div class="kanban" id="kanbanBoard"></div>

    <!-- Secondary collapsed section -->
    <div class="secondary-section">
      <div class="secondary-toggle" id="secToggle">
        <span class="arrow" id="secArrow">▶</span>
        <span id="secLabel">Annulés / Remboursés (0)</span>
      </div>
      <div class="secondary-kanban" id="secKanban"></div>
    </div>
  </div>

  <div id="k-toast" class="toast"></div>
  <script src="komerce-api.js"></script>
  <script>
  /* ── Column Definitions ── */
  const MAIN_COLS = [
    { key: 'confirmed',   label: 'Confirmé',    badge: 'b-gray'   },
    { key: 'ordered',     label: 'Payé',        badge: 'b-blue'   },
    { key: 'preparation', label: 'Préparation', badge: 'b-purple' },
    { key: 'shipped',     label: 'Expédié',     badge: 'b-teal'   },
    { key: 'in_transit',  label: 'En transit',  badge: 'b-blue'   },
    { key: 'available',   label: 'Disponible',  badge: 'b-gold'   },
    { key: 'collected',   label: 'Récupéré',    badge: 'b-green'  }
  ];
  const SEC_COLS = [
    { key: 'cancelled', label: 'Annulé',     badge: 'b-red'  },
    { key: 'refunded',  label: 'Remboursé',  badge: 'b-gray' }
  ];

  let allOrders = [];
  let activeIsland = '';
  let searchTerm = '';
  let refreshTimer = null;

  /* ── Helpers ── */
  function ageHours(dateStr) {
    return (Date.now() - new Date(dateStr).getTime()) / 3600000;
  }

  function ageClass(h) {
    if (h < 24) return 'age-ok';
    if (h < 48) return 'age-warn';
    return 'age-crit';
  }

  function ageLabel(h) {
    if (h < 1) return Math.round(h * 60) + 'min';
    if (h < 24) return Math.round(h) + 'h';
    return Math.round(h / 24) + 'j';
  }

  function payIcon(method) {
    if (!method) return '';
    const m = method.toLowerCase();
    if (m.includes('stripe') || m.includes('card')) return '💳';
    if (m.includes('cash')) return '💵';
    if (m.includes('wallet')) return '👛';
    return '💳';
  }

  function fmtAmount(v) {
    if (v == null) return '—';
    return Number(v).toLocaleString('fr-FR') + ' €';
  }

  /* ── Filter Orders ── */
  function filtered() {
    return allOrders.filter(o => {
      if (activeIsland && o.destination_island !== activeIsland) return false;
      if (searchTerm && !(o.reference || '').toLowerCase().includes(searchTerm)) return false;
      return true;
    });
  }

  /* ── Render Card ── */
  function renderCard(order) {
    const h = ageHours(order.created_at);
    const ac = ageClass(h);
    const stagnant = h >= 48 && !['collected','cancelled','refunded'].includes(order.status);
    const card = document.createElement('div');
    card.className = 'kanban-card' + (stagnant ? ' stagnant' : '');
    card.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span class="kc-ref">${order.reference || '—'}</span>
        <span class="kc-age ${ac}">${stagnant ? '<span class="stagnant-dot"></span> ' : ''}${ageLabel(h)}</span>
      </div>
      <div class="kc-island">${order.destination_island || '—'} <span class="kc-pay">${payIcon(order.payment_method)}</span></div>
      <div class="kc-amount">${fmtAmount(order.total_amount)}</div>
    `;
    return card;
  }

  /* ── Render Kanban ── */
  function renderKanban() {
    const orders = filtered();

    // Group by status
    const groups = {};
    [...MAIN_COLS, ...SEC_COLS].forEach(c => groups[c.key] = []);
    orders.forEach(o => {
      const s = o.status || 'confirmed';
      if (groups[s]) groups[s].push(o);
    });

    // Sort each group: most stagnant first
    Object.values(groups).forEach(arr =>
      arr.sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
    );

    // Main kanban
    const board = document.getElementById('kanbanBoard');
    board.innerHTML = '';
    MAIN_COLS.forEach(col => {
      const items = groups[col.key];
      const stagnantCount = items.filter(o => ageHours(o.created_at) >= 48).length;
      const colEl = document.createElement('div');
      colEl.className = 'kanban-col';
      colEl.innerHTML = `
        <div class="kanban-col-hdr">
          <span>${col.label}</span>
          <span class="col-count ${stagnantCount > 0 ? 'has-stagnant' : ''}">${items.length}</span>
        </div>
      `;
      const body = document.createElement('div');
      body.className = 'kanban-col-body';
      if (items.length === 0) {
        body.innerHTML = '<div class="empty-col">Aucune commande</div>';
      } else {
        items.forEach(o => body.appendChild(renderCard(o)));
      }
      colEl.appendChild(body);
      board.appendChild(colEl);
    });

    // Total count (main statuses only)
    const mainCount = MAIN_COLS.reduce((s, c) => s + groups[c.key].length, 0);
    const totalAll = orders.length;
    document.getElementById('totalCount').textContent = totalAll + ' commande' + (totalAll !== 1 ? 's' : '');

    // Secondary section
    const secKanban = document.getElementById('secKanban');
    secKanban.innerHTML = '';
    let secTotal = 0;
    SEC_COLS.forEach(col => {
      const items = groups[col.key];
      secTotal += items.length;
      const colEl = document.createElement('div');
      colEl.className = 'kanban-col';
      colEl.innerHTML = `
        <div class="kanban-col-hdr">
          <span>${col.label}</span>
          <span class="col-count">${items.length}</span>
        </div>
      `;
      const body = document.createElement('div');
      body.className = 'kanban-col-body';
      if (items.length === 0) {
        body.innerHTML = '<div class="empty-col">Aucune</div>';
      } else {
        items.forEach(o => body.appendChild(renderCard(o)));
      }
      colEl.appendChild(body);
      secKanban.appendChild(colEl);
    });
    document.getElementById('secLabel').textContent = `Annulés / Remboursés (${secTotal})`;
  }

  /* ── Load Data ── */
  async function loadData() {
    try {
      allOrders = await K.orders.list() || [];
      renderKanban();
    } catch (e) {
      console.error('Pipeline load error:', e);
      K.ui.toast('Erreur chargement commandes', 'err');
    }
  }

  /* ── Island Filters ── */
  document.getElementById('islandFilters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('#islandFilters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeIsland = btn.dataset.island || '';
    renderKanban();
  });

  /* ── Search ── */
  document.getElementById('searchRef').addEventListener('input', e => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderKanban();
  });

  /* ── Refresh ── */
  document.getElementById('refreshBtn').addEventListener('click', async () => {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    await loadData();
    setTimeout(() => btn.classList.remove('spinning'), 600);
  });

  /* ── Secondary toggle ── */
  document.getElementById('secToggle').addEventListener('click', () => {
    const kanban = document.getElementById('secKanban');
    const arrow = document.getElementById('secArrow');
    const isOpen = kanban.classList.toggle('open');
    arrow.classList.toggle('open', isOpen);
  });

  /* ── Auto-refresh ── */
  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadData, 30000);
  }

  /* ── Init ── */
  (async function init() {
    try {
      const user = await K.auth.restore();
      if (!user || user.role !== 'admin') {
        window.location.href = 'portal.html';
        return;
      }
      document.getElementById('userInfo').textContent = user.email || user.name;
      document.getElementById('userRole').textContent = user.role || 'admin';
      await loadData();
      startAutoRefresh();
    } catch (e) {
      console.error('Init error:', e);
      window.location.href = 'portal.html';
    }
  })();
  </script>
<script>
/* PWA: Service Worker + offline/online indicator */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
if(window.matchMedia('(display-mode:standalone)').matches||window.navigator.standalone){document.body.classList.add('pwa-standalone');}
function _pwaUpdateConn(online){
  document.querySelectorAll('.conn-pill,[id$="-conn-status"]').forEach(function(p){
    if(online){p.textContent='\u{1F7E2} En ligne';p.style.background='rgba(34,197,94,0.15)';p.style.color='#16a34a';}
    else{p.textContent='\u{1F534} Hors ligne';p.style.background='rgba(239,68,68,0.15)';p.style.color='#dc2626';}
  });
}
window.addEventListener('online',function(){_pwaUpdateConn(true);});
window.addEventListener('offline',function(){_pwaUpdateConn(false);});
</script>
</body>
</html>
