<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a3a5c">
<title>Komerce — Suivi commande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ocean:#1a3a5c;--ocean-light:#2a5a8c;--sand:#f4e8d1;--sand-light:#faf5ed;
  --coral:#e07a5f;--coral-light:#f4a889;--white:#fff;--gray:#94a3b8;
  --green:#10b981;--green-bg:#ecfdf5;--orange:#f59e0b;--orange-bg:#fffbeb;
  --red:#ef4444;--red-bg:#fef2f2;--blue:#3b82f6;--blue-bg:#eff6ff;
}
html{font-family:'DM Sans',system-ui,sans-serif;background:var(--sand-light);color:var(--ocean)}
body{min-height:100dvh;display:flex;flex-direction:column}

.header{background:var(--ocean);color:var(--sand);padding:16px 20px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:1.1rem;font-weight:700;letter-spacing:1px}
.header p{font-size:.78rem;opacity:.7;margin-top:2px}

.search-section{padding:20px;background:var(--white);border-bottom:1px solid rgba(26,58,92,.08)}
.search-box{display:flex;gap:8px;max-width:480px;margin:0 auto}
.search-box input{flex:1;padding:12px 16px;border:2px solid rgba(26,58,92,.15);border-radius:12px;font-size:1rem;font-family:inherit;background:var(--sand-light);transition:border .2s}
.search-box input:focus{outline:none;border-color:var(--coral)}
.search-box input::placeholder{color:var(--gray)}
.search-box button{padding:12px 20px;background:var(--coral);color:var(--white);border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s}
.search-box button:hover{background:#c96a4f}
.search-box button:disabled{opacity:.5;cursor:not-allowed}

.container{max-width:520px;margin:0 auto;width:100%;padding:16px;flex:1}

.empty-state{text-align:center;padding:60px 20px;color:var(--gray)}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.empty-state p{font-size:.9rem;line-height:1.5}

.loading{text-align:center;padding:40px}
.spinner{width:32px;height:32px;border:3px solid rgba(26,58,92,.1);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.error-card{background:var(--red-bg);border:1px solid #fecaca;border-radius:14px;padding:20px;text-align:center;margin:20px 0}
.error-card .icon{font-size:2rem;margin-bottom:8px}
.error-card p{color:var(--red);font-weight:500}

.alerts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;font-size:.88rem;line-height:1.4}
.alert .a-icon{font-size:1.3rem;flex-shrink:0;margin-top:1px}
.alert .a-body{flex:1}
.alert .a-body strong{display:block;margin-bottom:2px}
.alert-success{background:var(--green-bg);border:1px solid #a7f3d0}
.alert-success .a-body{color:#065f46}
.alert-warning{background:var(--orange-bg);border:1px solid #fde68a}
.alert-warning .a-body{color:#92400e}
.alert-info{background:var(--blue-bg);border:1px solid #bfdbfe}
.alert-info .a-body{color:#1e40af}
.alert-action{background:linear-gradient(135deg,var(--ocean),var(--ocean-light));color:var(--sand);border:none;cursor:pointer;transition:transform .15s}
.alert-action:hover{transform:scale(1.01)}
.alert-action .a-body{color:var(--sand)}
.alert-action .a-body a{color:var(--sand);text-decoration:underline;font-weight:600}

.order-header{background:var(--white);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(26,58,92,.06)}
.order-ref{font-family:monospace;font-size:1.3rem;font-weight:700;color:var(--ocean);letter-spacing:1px}
.order-meta{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.order-meta .badge{padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-status{background:var(--coral);color:var(--white)}
.badge-payment{background:var(--green-bg);color:#065f46}
.badge-payment.pending{background:var(--orange-bg);color:#92400e}
.order-date{font-size:.8rem;color:var(--gray);margin-top:6px}

.timeline-card{background:var(--white);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(26,58,92,.06)}
.timeline-card h3{font-size:.9rem;font-weight:600;color:var(--gray);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:rgba(26,58,92,.1)}
.tl-step{position:relative;padding-bottom:20px;display:flex;align-items:flex-start;gap:10px}
.tl-step:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-28px;top:2px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;z-index:1}
.tl-dot.done{background:var(--green);color:var(--white)}
.tl-dot.current{background:var(--coral);color:var(--white);box-shadow:0 0 0 4px rgba(224,122,95,.25);animation:pulse-dot 2s infinite}
.tl-dot.pending{background:rgba(26,58,92,.1);color:var(--gray)}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 4px rgba(224,122,95,.25)}50%{box-shadow:0 0 0 8px rgba(224,122,95,.1)}}
.tl-info{flex:1}
.tl-label{font-weight:600;font-size:.88rem;color:var(--ocean)}
.tl-label.pending-label{color:var(--gray);font-weight:400}
.tl-date{font-size:.75rem;color:var(--gray);margin-top:1px}
.tl-sublabel{font-size:.75rem;color:var(--gray);font-style:italic}

.items-card{background:var(--white);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(26,58,92,.06)}
.items-card h3{font-size:.9rem;font-weight:600;color:var(--gray);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(26,58,92,.05)}
.item-row:last-child{border-bottom:none}
.item-img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--sand)}
.item-emoji{width:40px;height:40px;border-radius:8px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.item-name{flex:1;font-size:.88rem;font-weight:500}
.item-qty{font-size:.8rem;color:var(--gray);font-weight:600}

.relais-card{background:var(--white);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(26,58,92,.06)}
.relais-card h3{font-size:.9rem;font-weight:600;color:var(--gray);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.relais-info{display:flex;gap:12px;align-items:flex-start}
.relais-icon{font-size:1.8rem}
.relais-details{flex:1}
.relais-name{font-weight:600;font-size:1rem}
.relais-addr{font-size:.82rem;color:var(--gray);margin-top:2px}
.relais-hours{font-size:.78rem;color:var(--ocean-light);margin-top:4px;font-style:italic}
.relais-phone{display:inline-block;margin-top:6px;padding:4px 12px;background:var(--green-bg);color:#065f46;border-radius:20px;font-size:.78rem;font-weight:600;text-decoration:none}

.qr-button{display:block;width:100%;padding:14px;background:linear-gradient(135deg,var(--coral),#d06a4f);color:var(--white);border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-bottom:14px;transition:transform .15s,box-shadow .15s}
.qr-button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(224,122,95,.3)}
.qr-button .qr-icon{font-size:1.2rem;margin-right:6px}

.refresh-bar{text-align:center;padding:8px;font-size:.72rem;color:var(--gray)}
.refresh-bar span{cursor:pointer;text-decoration:underline}

.footer{text-align:center;padding:16px;font-size:.75rem;color:var(--gray);background:var(--white);border-top:1px solid rgba(26,58,92,.06)}
.footer a{color:var(--coral);text-decoration:none;font-weight:600}

@media(min-width:600px){
  .search-section{padding:24px}
  .container{padding:20px}
}
</style>
</head>
<body>

<div class="header">
  <h1>🏝️ KOMERCE</h1>
  <p>Suivez votre commande</p>
</div>

<div class="search-section">
  <div class="search-box">
    <input type="text" id="refInput" placeholder="Votre référence (ex: KYRH5XM)" maxlength="12" autocomplete="off" spellcheck="false">
    <button id="searchBtn" onclick="trackOrder()">Suivre</button>
  </div>
</div>

<div class="container" id="content">
  <div class="empty-state">
    <div class="icon">📦</div>
    <p>Entrez votre référence de commande<br>pour suivre votre colis en temps réel</p>
  </div>
</div>

<div class="footer">
  <a href="/Komerce_Boutique.html">← Retour à la boutique</a>
</div>

<script>
const API = window.location.origin;
const STEPS = [
  { key: 'confirmed',   label: 'Commande confirmée', icon: '✓', sub: 'Reçue et validée' },
  { key: 'ordered',     label: 'Approvisionnement',  icon: '📋', sub: 'Commande fournisseur passée' },
  { key: 'preparation', label: 'En préparation',     icon: '🛍️', sub: 'Préparation à Dubai' },
  { key: 'shipped',     label: 'Expédiée',           icon: '📦', sub: 'Remise au transitaire' },
  { key: 'in_transit',  label: 'En transit maritime', icon: '🚢', sub: 'En route vers les Comores' },
  { key: 'available',   label: 'Disponible',         icon: '📍', sub: 'Prêt au point relais' },
  { key: 'collected',   label: 'Récupéré',           icon: '✅', sub: 'Colis remis' },
];

let refreshTimer = null;
let currentRef = null;

// Check URL param
const urlRef = new URLSearchParams(location.search).get('ref');
if (urlRef) {
  document.getElementById('refInput').value = urlRef.toUpperCase();
  trackOrder();
}

// Enter key
document.getElementById('refInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') trackOrder();
});

async function trackOrder() {
  var input = document.getElementById('refInput');
  var ref = input.value.trim().toUpperCase();
  if (!ref) { input.focus(); return; }

  currentRef = ref;
  input.value = ref;

  // Update URL
  history.replaceState(null, '', '?ref=' + ref);

  var content = document.getElementById('content');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Recherche en cours...</p></div>';

  try {
    var res = await fetch(API + '/api/orders/' + ref);
    if (!res.ok) {
      if (res.status === 404) {
        content.innerHTML = '<div class="error-card"><div class="icon">🔍</div><p>Aucune commande trouvée pour <strong>' + ref + '</strong></p><p style="color:var(--gray);font-weight:400;margin-top:6px;font-size:.82rem">Vérifiez votre référence et réessayez</p></div>';
        return;
      }
      throw new Error('Erreur ' + res.status);
    }

    var data = await res.json();
    renderTracking(data);

    // Auto-refresh pour commandes actives
    clearInterval(refreshTimer);
    if (['collected','cancelled','refunded'].indexOf(data.status) === -1) {
      refreshTimer = setInterval(function() { silentRefresh(ref); }, 60000);
    }

  } catch(err) {
    content.innerHTML = '<div class="error-card"><div class="icon">⚠️</div><p>Erreur de connexion</p><p style="color:var(--gray);font-weight:400;margin-top:6px;font-size:.82rem">Veuillez réessayer dans quelques instants</p></div>';
  }
}

async function silentRefresh(ref) {
  try {
    var res = await fetch(API + '/api/orders/' + ref);
    if (res.ok) {
      var data = await res.json();
      renderTracking(data);
    }
  } catch(e) {}
}

function renderTracking(data) {
  var content = document.getElementById('content');
  var html = '';

  // Alerts
  if (data.alerts && data.alerts.length) {
    html += '<div class="alerts">';
    for (var a of data.alerts) {
      if (a.type === 'action' && a.qr_link) {
        html += '<a href="' + a.qr_link + '" class="alert alert-action" style="text-decoration:none"><span class="a-icon">' + a.icon + '</span><span class="a-body"><strong>' + a.message + '</strong>Appuyez pour afficher votre QR de retrait →</span></a>';
      } else {
        html += '<div class="alert alert-' + a.type + '"><span class="a-icon">' + a.icon + '</span><span class="a-body">' + a.message + '</span></div>';
      }
    }
    html += '</div>';
  }

  // QR Button
  if (data.has_qr && data.qr_link) {
    html += '<a href="' + data.qr_link + '" class="qr-button"><span class="qr-icon">📱</span> Afficher mon QR de retrait</a>';
  }

  // Order header
  var statusStep = STEPS.find(function(s) { return s.key === data.status; });
  var statusLabel = statusStep ? statusStep.label : data.status;
  var payLabel = data.payment_status === 'paid' ? 'Payé ✓' : data.payment_status === 'pending' ? 'En attente' : (data.payment_status || '');
  var payClass = data.payment_status === 'paid' ? '' : 'pending';
  var dateStr = data.created_at ? new Date(data.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' }) : '';

  html += '<div class="order-header"><div class="order-ref">' + data.reference + '</div><div class="order-meta"><span class="badge badge-status">' + statusLabel + '</span>';
  if (payLabel) html += '<span class="badge badge-payment ' + payClass + '">' + payLabel + '</span>';
  html += '</div><div class="order-date">Commandé le ' + dateStr + '</div></div>';

  // Timeline
  var currentIdx = STEPS.findIndex(function(s) { return s.key === data.status; });
  var timelineMap = {};
  if (data.timeline) {
    for (var t of data.timeline) {
      timelineMap[t.status] = t.date;
    }
  }

  html += '<div class="timeline-card"><h3>📍 Suivi</h3><div class="timeline">';
  for (var i = 0; i < STEPS.length; i++) {
    var step = STEPS[i];
    var isDone = i < currentIdx;
    var isCurrent = i === currentIdx;
    var dotClass = isDone ? 'done' : isCurrent ? 'current' : 'pending';
    var labelClass = (!isDone && !isCurrent) ? 'pending-label' : '';

    var stepDate = timelineMap[step.key];
    var dateDisplay = stepDate ? new Date(stepDate).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';

    html += '<div class="tl-step"><div class="tl-dot ' + dotClass + '">' + (isDone ? '✓' : isCurrent ? step.icon : '') + '</div><div class="tl-info"><div class="tl-label ' + labelClass + '">' + step.label + '</div>';
    if (dateDisplay) html += '<div class="tl-date">' + dateDisplay + '</div>';
    if (isDone || isCurrent) html += '<div class="tl-sublabel">' + step.sub + '</div>';
    html += '</div></div>';
  }
  html += '</div></div>';

  // Items
  if (data.items && data.items.length) {
    html += '<div class="items-card"><h3>🛍️ Articles</h3>';
    for (var item of data.items) {
      var imgHtml = item.image ? '<img class="item-img" src="' + item.image + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '<div class="item-emoji">' + (item.emoji || '📦') + '</div>';
      html += '<div class="item-row">' + imgHtml + '<span class="item-name">' + item.name + '</span><span class="item-qty">×' + item.qty + '</span></div>';
    }
    html += '</div>';
  }

  // Relais
  if (data.relais) {
    html += '<div class="relais-card"><h3>🏪 Point relais</h3><div class="relais-info"><div class="relais-icon">🏝️</div><div class="relais-details"><div class="relais-name">' + data.relais.name + '</div>';
    if (data.relais.address) html += '<div class="relais-addr">' + data.relais.address + '</div>';
    if (data.relais.hours) html += '<div class="relais-hours">🕐 ' + data.relais.hours + '</div>';
    if (data.relais.phone) html += '<a href="tel:' + data.relais.phone + '" class="relais-phone">📞 ' + data.relais.phone + '</a>';
    html += '</div></div></div>';
  }

  // Auto-refresh
  if (['collected','cancelled','refunded'].indexOf(data.status) === -1) {
    html += '<div class="refresh-bar">Actualisation automatique • <span onclick="trackOrder()">Rafraîchir maintenant</span></div>';
  }

  content.innerHTML = html;
}
</script>
</body>
</html>
