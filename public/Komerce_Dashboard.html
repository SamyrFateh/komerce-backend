<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komerce — Pilotage</title>
<link rel="stylesheet" href="komerce-ui.css">
<script src="komerce-api.js"></script>
<script src="/chart.umd.min.js"></script>
<style>
/* ═══ PILOTAGE-SPECIFIC STYLES ═══ */

/* Login */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:40px 32px;width:400px;max-width:95vw;box-shadow:var(--shadow-md)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{font-family:var(--mono);font-weight:700;font-size:1.3rem;letter-spacing:3px;color:var(--gold)}
.login-logo p{color:var(--text3);font-size:.875rem;margin-top:4px}
.login-err{background:var(--red-bg);color:var(--red);border:1px solid rgba(220,38,38,.2);border-radius:var(--radius-sm);padding:10px 14px;font-size:.875rem;margin-bottom:16px;display:none}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card-e{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow)}
.kpi-card-e .kpi-icon{font-size:1.5rem;opacity:.6;margin-bottom:8px}
.kpi-card-e .kpi-v{font-family:var(--mono);font-size:1.6rem;font-weight:700}
.kpi-card-e .kpi-l{font-size:.82rem;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:1px}

/* Status distribution */
.status-bar{display:flex;height:32px;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg4)}
.status-bar-seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.75rem;font-weight:700;color:#fff;min-width:24px;transition:width .3s}
.status-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.status-legend-item{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text3)}
.status-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* Chain */
.chain{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 0}
.chain-step{display:flex;flex-direction:column;align-items:center;flex:1}
.chain-step-icon{font-size:1.5rem}
.chain-step-val{font-family:var(--mono);font-size:1.5rem;font-weight:700;margin-top:4px}
.chain-step-label{font-size:.78rem;color:var(--text3);text-align:center;margin-top:4px}
.chain-arrow{color:var(--text3);opacity:.4;flex-shrink:0;font-size:1.2rem}

/* Alert cards */
.alert-card{padding:14px 16px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:12px}
.alert-card.warn{background:var(--amber-bg);border:1px solid rgba(217,119,6,.2)}
.alert-card.danger{background:var(--red-bg);border:1px solid rgba(220,38,38,.2)}
.alert-card.info{background:var(--blue-bg);border:1px solid rgba(37,99,235,.2)}
.alert-card-icon{font-size:1.3rem}
.alert-card-title{font-weight:700;font-size:.875rem}
.alert-card-sub{font-size:.82rem;color:var(--text2)}

/* Payment bar */
.payment-bar{display:flex;height:28px;border-radius:var(--radius-sm);overflow:hidden}
.payment-bar>div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.75rem;font-weight:700;color:#fff}

/* Category bars */
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cat-bar{flex:1;height:12px;background:var(--bg4);border-radius:6px;overflow:hidden}
.cat-fill{height:100%;background:var(--gold);border-radius:6px;transition:width .3s}
.cat-label{font-size:.82rem;color:var(--text3);min-width:100px;text-transform:capitalize}
.cat-pct{font-family:var(--mono);font-size:.82rem;font-weight:600;min-width:50px;text-align:right}

/* SLA grid */
.sla-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.sla-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow)}
.sla-card-icon{font-size:1.5rem;opacity:.6;margin-bottom:8px}
.sla-card-val{font-family:var(--mono);font-size:2rem;font-weight:700}
.sla-card-label{font-weight:600;font-size:.875rem;margin-top:4px}

/* Forecast */
.forecast-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.forecast-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow)}
.forecast-card.expected{border-color:var(--gold)}

/* Chart */
.chart-container{position:relative;height:280px}

/* Refresh indicator */
.refresh-ind{font-family:var(--mono);font-size:.75rem;color:var(--text3);display:flex;align-items:center;gap:6px}

/* Responsive */
@media(max-width:1100px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .sla-grid{grid-template-columns:repeat(2,1fr)}
  .forecast-grid{grid-template-columns:1fr}
}
@media(max-width:750px){
  .kpi-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     LOGIN
     ═══════════════════════════════════════════════════════════════ -->
<div id="loginScreen" class="login-bg">
  <div class="login-box">
    <div class="login-logo">
      <h1>KOMERCE</h1>
      <p>Pilotage — Supervision globale</p>
    </div>
    <div id="loginErr" class="login-err"></div>
    <div class="form-group">
      <div class="inp-label">URL DE L'API</div>
      <input id="inpApi" class="inp" placeholder="https://votre-api.com" />
    </div>
    <div class="form-group">
      <div class="inp-label">EMAIL</div>
      <input id="inpEmail" class="inp" type="email" placeholder="admin@komerce.com" />
    </div>
    <div class="form-group">
      <div class="inp-label">MOT DE PASSE</div>
      <input id="inpPass" class="inp" type="password" placeholder="••••••" />
    </div>
    <button id="btnLogin" class="btn btn-gold btn-full btn-lg" onclick="doLogin()">Connexion</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     DASHBOARD
     ═══════════════════════════════════════════════════════════════ -->
<div id="dashApp" style="display:none">

  <!-- Header -->
  <div class="hdr">
    <a href="portal.html" class="logo" style="text-decoration:none">KOMERCE <em>PILOTAGE</em></a>
    <div class="hdr-right">
      <div class="refresh-ind">
        <span class="conn-dot pulse" style="background:var(--green)"></span>
        <span id="lastRefresh">—</span>
      </div>
      <div class="conn-pill ok">
        <span class="conn-dot pulse"></span>
        <span id="userLabel">—</span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">↩ Déconnexion</button>
    </div>
  </div>

  <!-- Main layout: sidebar + content -->
  <div class="main">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">NAVIGATION</div>
        <div id="navContainer"></div>
      </div>
    </div>
    <div class="content">
      <div id="scrOverview" class="screen active"></div>
      <div id="scrFinance" class="screen"></div>
      <div id="scrSla" class="screen"></div>
      <div id="scrTendances" class="screen"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="k-toast" class="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   KOMERCE PILOTAGE — Dashboard Dirigeant
   Mission : Vue de supervision globale, zéro action opérationnelle
   Persona : CEO / COO / Directeur logistique
   Device  : Desktop (tablette OK)
   ═══════════════════════════════════════════════════════════════ */

// ── STATE ─────────────────────────────────────────────────────
let activeSection = 'overview';
let refreshTimer = null;
const REFRESH_MS = 45000;
const cache = {};
const CACHE_TTL = 30000;
const charts = {};
let smsOpen = null;

const NAV = [
  { id:'overview',  icon:'📊', label:"Vue d'ensemble" },
  { id:'finance',   icon:'💰', label:'Finance' },
  { id:'sla',       icon:'⚠️', label:'SLA & Alertes' },
  { id:'tendances', icon:'📈', label:'Tendances' },
];

// ── FORMATTERS ────────────────────────────────────────────────
const fKMF = a => a==null?'—':Math.round(a).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' KMF';
const fEUR = a => a==null?'—':Math.round(a).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' €';
const fPct = v => v==null?'—':(v>0?'+':'')+v.toFixed(1)+'%';
const fDate = d => {if(!d)return'—';const p=d.split('T')[0].split('-');return p.length>=3?p[2]+'/'+p[1]+'/'+p[0]:d;};
const esc = s => s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shortMo = m => {const map={'01':'Jan','02':'Fév','03':'Mar','04':'Avr','05':'Mai','06':'Juin','07':'Juil','08':'Aoû','09':'Sep','10':'Oct','11':'Nov','12':'Déc'};const p=m.split('-');return(map[p[1]]||p[1])+' '+p[0].slice(2);};
const eom = () => {const n=new Date(),e=new Date(n.getFullYear(),n.getMonth()+1,0);return e.toISOString().split('T')[0];};

// Parcel status config
const P_STATUSES = ['draft','preparation','shipped','in_transit','arrived','available','collected','cancelled'];
const P_LABELS = {draft:'Brouillon',preparation:'Préparation',shipped:'Expédié',in_transit:'En transit',arrived:'Arrivé',available:'Disponible',collected:'Remis',cancelled:'Annulé'};
const P_COLORS = {draft:'#9ca3af',preparation:'#7c3aed',shipped:'#0d9488',in_transit:'#2563eb',arrived:'#d97706',available:'#16a34a',collected:'#22c55e',cancelled:'#dc2626'};

// Compensation config
const COMP_L = {contact_preventif:'Contact préventif',avoir_5pct:'Avoir 5%',remise_10pct_prochaine_cmd:'Remise −10%',remboursement_possible:'Remboursement'};
const COMP_B = {contact_preventif:'b-blue',avoir_5pct:'b-gold',remise_10pct_prochaine_cmd:'b-red',remboursement_possible:'b-red'};

// ── CACHED API ────────────────────────────────────────────────
async function dApi(ep){
  const e=cache[ep];
  if(e&&Date.now()-e.ts<CACHE_TTL)return e.data;
  const d=await K.request('/api/dashboard/'+ep);
  cache[ep]={data:d,ts:Date.now()};
  return d;
}
function clearCache(){Object.keys(cache).forEach(k=>delete cache[k]);}

// ── LOGIN / LOGOUT ────────────────────────────────────────────
function prefill(){
  const url=localStorage.getItem('komerce_api_url')||'';
  if(url)document.getElementById('inpApi').value=url;
}

async function doLogin(){
  const btn=document.getElementById('btnLogin'),err=document.getElementById('loginErr');
  const api=document.getElementById('inpApi').value.trim();
  const email=document.getElementById('inpEmail').value.trim();
  const pass=document.getElementById('inpPass').value.trim();
  if(!api||!email||!pass){err.textContent='Tous les champs sont requis';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Connexion...';err.style.display='none';
  try{
    const r=await K.auth.login(email,pass,api);
    boot(r.user);
  }catch(e){err.textContent=e.message||'Erreur de connexion';err.style.display='block';}
  finally{btn.disabled=false;btn.textContent='Connexion';}
}

function doLogout(){
  K.auth.logout();clearCache();
  if(refreshTimer)clearInterval(refreshTimer);
  document.getElementById('dashApp').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}

function boot(user){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('dashApp').style.display='';
  document.getElementById('userLabel').textContent=user?(user.email||user.name||'—'):'Connecté';
  buildNav();
  renderActive();
  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(()=>{clearCache();renderActive();},REFRESH_MS);
}

// ── NAVIGATION ────────────────────────────────────────────────
function buildNav(){
  const c=document.getElementById('navContainer');c.innerHTML='';
  NAV.forEach(n=>{
    const d=document.createElement('div');
    d.className='nav-item'+(activeSection===n.id?' active':'');
    d.innerHTML='<span class="nav-icon">'+n.icon+'</span>'+esc(n.label);
    d.onclick=()=>switchTo(n.id);
    c.appendChild(d);
  });
}

function switchTo(id){
  activeSection=id;buildNav();
  document.querySelectorAll('#dashApp .screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('scr'+id.charAt(0).toUpperCase()+id.slice(1));
  if(el)el.classList.add('active');
  renderActive();
}

// ── RENDER DISPATCHER ─────────────────────────────────────────
async function renderActive(){
  const id='scr'+activeSection.charAt(0).toUpperCase()+activeSection.slice(1);
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML='<div style="display:flex;justify-content:center;padding:80px 0"><div class="spin" style="font-size:2rem">⏳</div></div>';
  try{
    switch(activeSection){
      case'overview':await rOverview(el);break;
      case'finance':await rFinance(el);break;
      case'sla':await rSla(el);break;
      case'tendances':await rTendances(el);break;
    }
    document.getElementById('lastRefresh').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    el.innerHTML='<div class="card" style="max-width:500px;margin:40px auto;text-align:center"><div style="font-size:2rem;margin-bottom:12px">❌</div><div style="font-weight:700;margin-bottom:8px">'+esc(e.message)+'</div><button class="btn btn-gold btn-sm" onclick="renderActive()">🔄 Réessayer</button></div>';
  }
}

// ── HELPERS ────────────────────────────────────────────────────
function kpi(icon,label,value){
  return'<div class="kpi-card-e"><div class="kpi-icon">'+icon+'</div><div class="kpi-v">'+esc(String(value!=null?value:'—'))+'</div><div class="kpi-l">'+esc(label)+'</div></div>';
}

function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

// ═══════════════════════════════════════════════════════════════
// 1. VUE D'ENSEMBLE
// ═══════════════════════════════════════════════════════════════
async function rOverview(el){
  const [ops,pilotage,ap,pStats]=await Promise.all([
    dApi('ops'),
    dApi('pilotage'),
    dApi('annulations-parcels').catch(()=>null),
    K.parcels.stats().catch(()=>null),
  ]);

  const a=ops.activite,sla=ops.sla,al=ops.alertes;
  const slaT=sla.on_time+sla.warning+sla.late+sla.blocked;
  const health=slaT>0?Math.round(sla.on_time/slaT*100):0;
  const hC=health>=80?'var(--green)':health>=60?'var(--gold)':'var(--red)';

  let h='';

  /* ── Header ── */
  h+='<div class="screen-hdr"><div><div class="screen-title">Vue d\'ensemble</div><div class="screen-sub">Supervision en temps réel</div></div>';
  h+='<div style="text-align:right"><div style="font-family:var(--mono);font-size:2rem;font-weight:700;color:'+hC+'">'+health+'%</div><div style="font-size:.82rem;color:var(--text3)">Score santé</div></div></div>';

  /* ── KPIs ── */
  h+='<div class="kpi-row">';
  h+=kpi('📦',"Commandes aujourd'hui",a.commandes_aujourd_hui);
  h+=kpi('✅',"Livrées aujourd'hui",a.livrees_aujourd_hui);
  h+=kpi('⚠️','Bloquées',a.commandes_bloquees);
  const parcelsMoving=pStats?(pStats.in_transit||pStats.active||'—'):'—';
  h+=kpi('🚚','Parcels en mouvement',parcelsMoving);
  h+='</div>';

  /* ── Vue Parcels — répartition par statut colis ── */
  h+='<div class="card"><div class="card-label">📦 RÉPARTITION COLIS PAR STATUT</div>';

  let pC={},pT=0;
  if(pStats&&pStats.by_status){
    pC=pStats.by_status;
    pT=Object.values(pC).reduce((s,v)=>s+v,0);
  }else if(pilotage.pipeline){
    pilotage.pipeline.forEach(p=>{pC[p.statut]=p.nb;});
    pT=pilotage.pipeline.reduce((s,p)=>s+p.nb,0);
  }

  if(pT>0){
    h+='<div style="margin:16px 0"><div class="status-bar">';
    P_STATUSES.forEach(s=>{
      const c=pC[s]||0;if(!c)return;
      const pct=c/pT*100;
      h+='<div class="status-bar-seg" style="width:'+pct+'%;background:'+P_COLORS[s]+'">'+(pct>6?c:'')+'</div>';
    });
    h+='</div>';
    h+='<div class="status-legend">';
    P_STATUSES.forEach(s=>{
      const c=pC[s]||0;if(!c)return;
      h+='<div class="status-legend-item"><div class="status-dot" style="background:'+P_COLORS[s]+'"></div>'+P_LABELS[s]+': <strong>'+c+'</strong></div>';
    });
    h+='</div></div>';
  }else{
    h+='<div style="text-align:center;color:var(--text3);padding:16px">Aucune donnée colis</div>';
  }
  h+='</div>';

  /* ── Chaîne logistique ── */
  const STEPS=[
    {key:'dubai_reception',icon:'📥',fb:'Réception Dubai'},
    {key:'dubai_expedition',icon:'📦',fb:'Expédition Dubai'},
    {key:'transitaire',icon:'🏢',fb:'Transitaire'},
    {key:'bateau',icon:'🚢',fb:'En mer'},
    {key:'anjouan',icon:'📍',fb:'Anjouan'},
  ];
  h+='<div class="card"><div class="card-label">🔗 CHAÎNE LOGISTIQUE</div><div class="chain">';
  STEPS.forEach((st,i)=>{
    const step=ops.logistique?ops.logistique[st.key]:null;
    const cnt=step?step.count:0;
    const lbl=step?step.label.replace(/^[^\s]+\s/,''):st.fb;
    h+='<div class="chain-step"><div class="chain-step-icon">'+st.icon+'</div><div class="chain-step-val">'+cnt+'</div><div class="chain-step-label">'+esc(lbl)+'</div></div>';
    if(i<STEPS.length-1)h+='<span class="chain-arrow">→</span>';
  });
  h+='</div></div>';

  /* ── SLA + Alertes (side by side) ── */
  h+='<div class="g2">';

  // SLA compact
  h+='<div class="card"><div class="card-label">🛡️ SLA</div><div class="g4">';
  [{l:'À temps',v:sla.on_time,c:'b-green'},{l:'Attention',v:sla.warning,c:'b-gold'},{l:'En retard',v:sla.late,c:'b-red'},{l:'Bloquées',v:sla.blocked,c:'b-red'}].forEach(x=>{
    h+='<div style="text-align:center"><div class="badge '+x.c+'" style="margin-bottom:6px">'+x.l+'</div><div style="font-family:var(--mono);font-size:1.3rem;font-weight:700">'+x.v+'</div></div>';
  });
  h+='</div></div>';

  // Alertes compact
  h+='<div class="card"><div class="card-label">🔔 ALERTES</div><div style="display:flex;flex-direction:column;gap:10px">';
  h+='<div class="alert-card warn"><span class="alert-card-icon">💵</span><div><div class="alert-card-title">Cash en attente</div><div class="alert-card-sub">'+al.cash_pending+' paiement(s)</div></div></div>';
  h+='<div class="alert-card danger"><span class="alert-card-icon">🐛</span><div><div class="alert-card-title">Anomalies</div><div class="alert-card-sub">'+al.anomalies+' détectée(s)</div></div></div>';
  h+='<div class="alert-card warn"><span class="alert-card-icon">📦</span><div><div class="alert-card-title">Stock bas</div><div class="alert-card-sub">'+al.low_stock+' produit(s)</div></div></div>';
  h+='</div></div>';

  h+='</div>'; // end g2

  /* ── Commandes agrégées — expéditions partielles ── */
  if(ap&&ap.parcels){
    const pc=ap.parcels;
    h+='<div class="card"><div class="card-label">📦 COMMANDES AGRÉGÉES — EXPÉDITIONS PARTIELLES</div>';
    if(pc.total>0){
      h+='<div class="g4">';
      h+='<div style="text-align:center"><div style="font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--blue)">'+pc.en_cours+'</div><div style="font-size:.82rem;color:var(--text3)">Colis en cours</div></div>';
      h+='<div style="text-align:center"><div style="font-family:var(--mono);font-size:1.5rem;font-weight:700;color:'+(pc.backorder_actifs>0?'var(--gold)':'var(--green)')+'">'+pc.backorder_actifs+'</div><div style="font-size:.82rem;color:var(--text3)">Backorders actifs</div></div>';
      h+='<div style="text-align:center"><div style="font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--green)">'+pc.taux_completion_pct+'%</div><div style="font-size:.82rem;color:var(--text3)">Taux complétion</div></div>';
      h+='<div style="text-align:center"><div style="font-family:var(--mono);font-size:1.5rem;font-weight:700">'+pc.nb_orders_with_parcels+'</div><div style="font-size:.82rem;color:var(--text3)">Cmd fractionnées</div></div>';
      h+='</div>';
    }else{
      h+='<div style="text-align:center;color:var(--text3);padding:16px">Aucune expédition partielle</div>';
    }
    h+='</div>';
  }

  el.innerHTML=h;
}

// ═══════════════════════════════════════════════════════════════
// 2. FINANCE
// ═══════════════════════════════════════════════════════════════
async function rFinance(el){
  const [d,ap]=await Promise.all([
    dApi('finance'),
    dApi('annulations-parcels').catch(()=>null),
  ]);

  const{kpi:k,paiements:pay,marges:m,par_categorie:cats,top_produits:top,taux:tx}=d;
  const totalPay=pay.cash.count+pay.stripe.count;
  const cashPct=totalPay>0?(pay.cash.count/totalPay*100):50;
  const stripePct=100-cashPct;
  const maxCA=cats.length?Math.max(...cats.map(c=>c.ca_kmf)):1;

  let h='';

  /* ── Header ── */
  h+='<div class="screen-hdr"><div><div class="screen-title">Finance</div><div class="screen-sub">Revenus, marges & paiements</div></div></div>';

  /* ── KPIs ── */
  h+='<div class="kpi-row">';
  h+=kpi('💰','CA KMF',fKMF(k.ca_kmf));
  h+=kpi('💳','CA EUR',fEUR(k.ca_eur));
  h+=kpi('🛒','Panier moyen',fKMF(k.panier_moyen_kmf));
  h+=kpi('📈','Taux marge',m.taux_marge_pct!=null?m.taux_marge_pct+'%':'—');
  h+='</div>';

  /* ── Payment split ── */
  h+='<div class="card"><div class="card-label">💳 RÉPARTITION PAIEMENTS</div>';
  h+='<div class="payment-bar">';
  h+='<div style="width:'+cashPct.toFixed(0)+'%;background:var(--gold)">'+cashPct.toFixed(0)+'% Cash</div>';
  h+='<div style="width:'+stripePct.toFixed(0)+'%;background:var(--blue)">'+stripePct.toFixed(0)+'% Stripe</div>';
  h+='</div>';
  h+='<div class="g2" style="margin-top:16px">';
  h+='<div><div style="display:flex;align-items:center;gap:8px"><div style="width:12px;height:12px;border-radius:3px;background:var(--gold)"></div><strong>Cash</strong></div><div style="font-size:.82rem;color:var(--text3);margin-top:4px">'+pay.cash.count+' paiements · '+fKMF(pay.cash.total_kmf)+'</div></div>';
  h+='<div><div style="display:flex;align-items:center;gap:8px"><div style="width:12px;height:12px;border-radius:3px;background:var(--blue)"></div><strong>Stripe</strong></div><div style="font-size:.82rem;color:var(--text3);margin-top:4px">'+pay.stripe.count+' paiements · '+fEUR(pay.stripe.total_eur)+'</div></div>';
  h+='</div>';
  if(tx){
    h+='<hr class="sep"><div style="display:flex;gap:24px;font-size:.875rem;color:var(--text3)"><span>Taux EUR/KMF: <strong style="color:var(--text)">'+tx.eur_kmf+'</strong></span><span>Taux AED/KMF: <strong style="color:var(--text)">'+tx.aed_kmf+'</strong></span></div>';
  }
  h+='</div>';

  /* ── Marges + Par catégorie ── */
  h+='<div class="g2">';

  // Marges
  h+='<div class="card"><div class="card-label">📈 MARGES</div>';
  h+='<div style="display:flex;justify-content:space-between;margin-bottom:12px"><span style="color:var(--text3)">Marge réelle</span><strong style="color:'+(m.marge_reelle_kmf>=0?'var(--green)':'var(--red)')+'">'+fKMF(m.marge_reelle_kmf)+'</strong></div>';
  h+='<div style="display:flex;justify-content:space-between;margin-bottom:12px"><span style="color:var(--text3)">Coûts logistique</span><strong>'+fKMF(m.cout_logistique_kmf)+'</strong></div>';
  const costT=m.nb_avec_cost+m.nb_sans_cost;
  h+='<div style="font-size:.82rem;color:var(--text3);margin-bottom:4px">Avec coût renseigné : '+m.nb_avec_cost+' / '+costT+'</div>';
  h+='<div class="prog-wrap"><div class="prog-bar gold" style="width:'+(costT>0?m.nb_avec_cost/costT*100:0)+'%"></div></div>';
  if(m.alertes_perte&&m.alertes_perte.count>0){
    h+='<div class="alert-card danger" style="margin-top:14px"><span>⚠️</span><div><div class="alert-card-title">'+m.alertes_perte.count+' alerte(s) perte</div><div class="alert-card-sub">'+esc(m.alertes_perte.refs.join(', '))+'</div></div></div>';
  }
  h+='</div>';

  // Par catégorie
  h+='<div class="card"><div class="card-label">📊 PAR CATÉGORIE</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Catégorie</th><th>Cmd</th><th>CA</th><th>Marge</th></tr></thead><tbody>';
  cats.forEach(cat=>{
    const tm=cat.taux_marge||0;
    const bc=tm>=30?'b-green':tm>=20?'b-gold':'b-red';
    h+='<tr><td><span class="badge b-gray" style="text-transform:capitalize">'+esc(cat.categorie)+'</span></td><td>'+cat.nb_commandes+'</td><td class="mono">'+fKMF(cat.ca_kmf)+'</td><td><span class="badge '+bc+'">'+tm+'%</span></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div style="margin-top:16px">';
  cats.forEach(cat=>{
    const pct=maxCA>0?(cat.ca_kmf/maxCA*100):0;
    h+='<div class="cat-row"><span class="cat-label">'+esc(cat.categorie)+'</span><div class="cat-bar"><div class="cat-fill" style="width:'+pct+'%"></div></div><span class="cat-pct">'+fKMF(cat.ca_kmf)+'</span></div>';
  });
  h+='</div></div>';

  h+='</div>'; // end g2

  /* ── Top 5 produits ── */
  h+='<div class="card"><div class="card-label">🏆 TOP 5 PRODUITS</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Produit</th><th>Catégorie</th><th>Qté</th><th>CA</th></tr></thead><tbody>';
  top.slice(0,5).forEach((p,i)=>{
    h+='<tr><td><span class="badge '+(i===0?'b-gold':'b-gray')+'">'+(i+1)+'</span></td><td><strong>'+esc(p.nom)+'</strong></td><td><span class="badge b-gray" style="text-transform:capitalize">'+esc(p.categorie)+'</span></td><td class="mono">'+p.qty+'</td><td class="mono"><strong>'+fKMF(p.ca_kmf)+'</strong></td></tr>';
  });
  h+='</tbody></table></div></div>';

  /* ── Annulations & Remboursements ── */
  if(ap){
    const an=ap.annulations;
    h+='<div class="card"><div class="card-label">❌ ANNULATIONS & REMBOURSEMENTS</div>';

    // KPIs row
    const tC=an.taux_pct<=5?'var(--green)':an.taux_pct<=10?'var(--gold)':'var(--red)';
    h+='<div class="g4" style="margin-bottom:16px">';
    h+='<div style="text-align:center"><div style="font-family:var(--mono);font-size:1.5rem;font-weight:700;color:'+tC+'">'+an.taux_pct+'%</div><div style="font-size:.82rem;color:var(--text3)">Taux annulation</div></div>';
    h+='<div style="text-align:center"><div style="font-family:var(--mono);font-size:1.5rem;font-weight:700">'+an.total+'</div><div style="font-size:.82rem;color:var(--text3)">Annulées ('+ap.period+'j)</div></div>';
    h+='<div style="text-align:center"><div style="font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--red)">'+fKMF(an.remboursements.total_kmf)+'</div><div style="font-size:.82rem;color:var(--text3)">Remboursés</div></div>';
    h+='<div style="text-align:center"><div style="font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--gold)">'+fKMF(an.credits_actifs.total_kmf)+'</div><div style="font-size:.82rem;color:var(--text3)">Crédits boutique</div></div>';
    h+='</div>';

    // Refund split bar
    const rT=an.remboursements.stripe.count+an.remboursements.credit_boutique.count;
    if(rT>0){
      const sP=(an.remboursements.stripe.count/rT*100).toFixed(0);
      const cP=(100-sP).toFixed(0);
      h+='<div class="payment-bar" style="margin-bottom:8px">';
      if(an.remboursements.stripe.count>0)h+='<div style="width:'+sP+'%;background:var(--blue)">Stripe '+sP+'%</div>';
      if(an.remboursements.credit_boutique.count>0)h+='<div style="width:'+cP+'%;background:var(--gold)">Crédits '+cP+'%</div>';
      h+='</div>';
      h+='<div style="display:flex;gap:16px;font-size:.82rem;color:var(--text3)">';
      h+='<span>Stripe: '+an.remboursements.stripe.count+' ('+fEUR(an.remboursements.stripe.eur)+')</span>';
      h+='<span>Crédits: '+an.remboursements.credit_boutique.count+' ('+fKMF(an.remboursements.credit_boutique.kmf)+')</span>';
      h+='</div>';
    }

    // Top raisons
    if(an.raisons&&an.raisons.length>0){
      h+='<div style="margin-top:14px"><div style="font-size:.82rem;color:var(--text3);margin-bottom:6px">Principales raisons</div><div style="display:flex;flex-wrap:wrap;gap:8px">';
      an.raisons.forEach(r=>{
        h+='<span class="badge b-gray">'+esc(r.raison)+' <span class="badge b-red" style="margin-left:4px;padding:1px 5px;font-size:.75rem">'+r.count+'</span></span>';
      });
      h+='</div></div>';
    }

    // Récentes
    if(an.recentes&&an.recentes.length>0){
      h+='<div style="margin-top:14px"><div class="tbl-wrap"><table><thead><tr><th>Réf</th><th>Montant</th><th>Date</th><th>Raison</th><th>Remboursement</th></tr></thead><tbody>';
      an.recentes.slice(0,5).forEach(o=>{
        const rb=o.refund_method==='stripe'?'<span class="badge b-blue">Stripe '+fKMF(o.refund_kmf||0)+'</span>':o.refund_method==='store_credit'?'<span class="badge b-gold">Crédit '+fKMF(o.refund_kmf||0)+'</span>':'<span class="badge b-gray">—</span>';
        h+='<tr><td class="mono"><strong>'+esc(o.reference)+'</strong></td><td class="mono">'+fKMF(o.total_kmf)+'</td><td>'+fDate(o.cancelled_at)+'</td><td style="font-size:.82rem">'+esc(o.reason||'—')+'</td><td>'+rb+'</td></tr>';
      });
      h+='</tbody></table></div></div>';
    }

    h+='</div>';
  }

  el.innerHTML=h;
}

// 3. SLA & ALERTES
// ═══════════════════════════════════════════════════════════════
async function rSla(el){
  const d=await dApi('retards');

  const levels=[
    {key:'contact_preventif',icon:'📞',name:'Contact préventif',thr:'28j+',cls:'b-blue'},
    {key:'avoir_5pct',icon:'🛡️',name:'Avoir 5%',thr:'35j+',cls:'b-gold'},
    {key:'remise_10pct_prochaine_cmd',icon:'⚠️',name:'Remise −10%',thr:'42j+',cls:'b-red'},
    {key:'remboursement_possible',icon:'🕐',name:'Remboursement',thr:'56j+',cls:'b-red'},
  ];

  let h='';

  /* ── Header ── */
  h+='<div class="screen-hdr"><div><div class="screen-title">SLA & Alertes</div><div class="screen-sub">Retards et compensations clients</div></div>';
  h+='<div style="text-align:right"><div style="font-family:var(--mono);font-size:2.5rem;font-weight:700;color:var(--red)">'+d.total+'</div><div style="font-size:.82rem;color:var(--text3)">commandes en retard</div></div></div>';

  /* ── Level cards ── */
  h+='<div class="sla-grid">';
  levels.forEach(lv=>{
    const info=d.par_niveau[lv.key]||{count:0,label:''};
    h+='<div class="sla-card"><div class="sla-card-icon">'+lv.icon+'</div><div class="sla-card-val">'+info.count+'</div><div class="sla-card-label">'+lv.name+'</div><div style="margin-top:6px"><span class="badge '+lv.cls+'">'+lv.thr+'</span></div><div style="font-size:.78rem;color:var(--text3);margin-top:6px">'+esc(info.label)+'</div></div>';
  });
  h+='</div>';

  /* ── Clients table ── */
  h+='<div class="card" style="margin-top:24px"><div class="card-label">💬 CLIENTS À TRAITER</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Référence</th><th>Client</th><th>Jours</th><th>Compensation</th><th>Actions</th></tr></thead><tbody>';
  d.clients.forEach(c=>{
    const dB=c.jours_retard>=56?'b-red':c.jours_retard>=42?'b-red':c.jours_retard>=35?'b-gold':'b-blue';
    const compB=COMP_B[c.compensation]||'b-gray';
    const compL=COMP_L[c.compensation]||c.compensation;
    const ref=esc(c.reference);

    h+='<tr><td class="mono"><strong>'+ref+'</strong></td>';
    h+='<td><div><strong>'+esc(c.client_nom)+'</strong></div><div style="font-size:.82rem;color:var(--text3)">'+esc(c.client_phone)+'</div></td>';
    h+='<td><span class="badge '+dB+'">'+c.jours_retard+'j</span></td>';
    h+='<td><span class="badge '+compB+'">'+compL+'</span></td>';
    h+='<td><div style="display:flex;gap:6px;flex-wrap:wrap">';
    h+='<button class="btn btn-blue btn-sm" onclick="toggleSms(\''+ref+'\')">📱 SMS</button>';
    h+='<a href="tel:'+esc(c.client_phone)+'" class="btn btn-ghost btn-sm">📞</a>';
    h+='</div></td></tr>';

    // SMS row
    h+='<tr id="sms_'+ref+'" style="display:none"><td colspan="5"><div style="background:var(--bg3);padding:12px;border-radius:var(--radius-sm);font-size:.875rem"><div style="font-family:var(--mono);font-size:.78rem;color:var(--text3);margin-bottom:6px">SMS SUGGÉRÉ</div>'+esc(c.sms_suggere)+'</div></td></tr>';
  });
  h+='</tbody></table></div></div>';

  /* ── Seuils info ── */
  h+='<div class="card" style="padding:14px 22px"><div style="display:flex;align-items:center;gap:10px;font-size:.875rem;color:var(--text3)"><span>🛡️</span><strong>Seuils SLA :</strong><span>Préventif 28j → Avoir 35j → Remise 42j → Remboursement 56j</span></div></div>';

  el.innerHTML=h;
}

function toggleSms(ref){
  const row=document.getElementById('sms_'+ref);
  if(!row)return;
  if(smsOpen===ref){row.style.display='none';smsOpen=null;}
  else{
    if(smsOpen){const prev=document.getElementById('sms_'+smsOpen);if(prev)prev.style.display='none';}
    row.style.display='table-row';smsOpen=ref;
  }
}

// 4. TENDANCES
// ═══════════════════════════════════════════════════════════════
async function rTendances(el){
  const [hist,fc]=await Promise.all([
    dApi('history'),
    dApi('forecast?target_date='+eom()),
  ]);

  const history=hist.history||[];
  const progPct=fc.projection.attendu>0?Math.min(100,fc.realise_kmf/fc.projection.attendu*100):0;

  let h='';

  /* ── Header ── */
  h+='<div class="screen-hdr"><div><div class="screen-title">Tendances</div><div class="screen-sub">Projections & historique</div></div></div>';

  /* ── Forecast cards ── */
  h+='<div class="forecast-grid">';
  h+='<div class="forecast-card"><span class="badge b-red" style="margin-bottom:8px">Pessimiste</span><div style="font-size:1.5rem;margin:6px 0">📉</div><div style="font-family:var(--mono);font-size:1.4rem;font-weight:700">'+fKMF(fc.projection.pessimiste)+'</div><div style="font-size:.82rem;color:var(--text3);margin-top:4px">Projection fin de mois</div></div>';
  h+='<div class="forecast-card expected"><span class="badge b-gold" style="margin-bottom:8px">Attendu</span><div style="font-size:1.5rem;margin:6px 0">🎯</div><div style="font-family:var(--mono);font-size:1.8rem;font-weight:700">'+fKMF(fc.projection.attendu)+'</div><div style="font-size:.82rem;color:var(--text3);margin-top:4px">Projection fin de mois</div></div>';
  h+='<div class="forecast-card"><span class="badge b-green" style="margin-bottom:8px">Optimiste</span><div style="font-size:1.5rem;margin:6px 0">📈</div><div style="font-family:var(--mono);font-size:1.4rem;font-weight:700">'+fKMF(fc.projection.optimiste)+'</div><div style="font-size:.82rem;color:var(--text3);margin-top:4px">Projection fin de mois</div></div>';
  h+='</div>';

  /* ── Progress bar ── */
  h+='<div class="card" style="margin-top:24px"><div class="card-label">📊 RÉALISÉ CE MOIS</div>';
  h+='<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px"><span style="font-family:var(--mono);font-size:1.5rem;font-weight:700">'+fKMF(fc.realise_kmf)+'</span><span style="color:var(--text3)">→</span><span style="color:var(--text3)">'+fKMF(fc.projection.attendu)+'</span></div>';
  h+='<div class="prog-wrap" style="height:8px"><div class="prog-bar gold" style="width:'+progPct+'%"></div></div>';
  h+='<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:.875rem"><span style="color:var(--text3)">'+progPct.toFixed(1)+'% atteint</span><span class="badge b-blue">📅 '+fc.days_remaining+' jours restants</span></div>';
  h+='<div style="display:flex;gap:24px;margin-top:14px;font-size:.875rem;color:var(--text3)"><div>Moy. CA/jour : <strong style="color:var(--text)">'+fKMF(fc.modele.avg_ca_jour)+'</strong></div><div>Écart-type : <strong style="color:var(--text)">'+fKMF(fc.modele.stddev)+'</strong></div></div>';
  h+='</div>';

  /* ── Chart ── */
  h+='<div class="card" style="margin-top:24px"><div class="card-label">📊 ÉVOLUTION SUR 6 MOIS</div>';
  h+='<div class="chart-container"><canvas id="chartTendances"></canvas></div>';
  h+='<div style="display:flex;gap:16px;justify-content:center;margin-top:12px"><div style="display:flex;align-items:center;gap:6px;font-size:.82rem"><div style="width:12px;height:12px;background:var(--gold);border-radius:3px"></div><span style="color:var(--text3)">Commandes</span></div><div style="display:flex;align-items:center;gap:6px;font-size:.82rem"><div style="width:12px;height:12px;background:var(--green);border-radius:3px"></div><span style="color:var(--text3)">Livrées</span></div></div>';
  h+='</div>';

  /* ── Comparison table ── */
  h+='<div class="card" style="margin-top:24px"><div class="card-label">📅 COMPARAISON MENSUELLE</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Mois</th><th>Commandes</th><th>Livrées</th><th>Taux</th><th>CA KMF</th><th>CA EUR</th></tr></thead><tbody>';
  history.forEach(m=>{
    const t=m.total_commandes>0?(m.livrees/m.total_commandes*100):0;
    const tb=t>=80?'b-green':t>=60?'b-gold':'b-red';
    h+='<tr><td><strong>'+shortMo(m.mois)+'</strong></td><td class="mono">'+m.total_commandes+'</td><td class="mono">'+m.livrees+'</td><td><span class="badge '+tb+'">'+t.toFixed(0)+'%</span></td><td class="mono"><strong>'+fKMF(m.ca_kmf)+'</strong></td><td class="mono" style="color:var(--text3)">'+fEUR(m.ca_eur)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  el.innerHTML=h;

  // Init chart after DOM is ready
  initChart(history);
}

function initChart(history){
  destroyChart('chartTendances');
  const canvas=document.getElementById('chartTendances');
  if(!canvas||typeof Chart==='undefined')return;
  const labels=history.map(h=>shortMo(h.mois));
  charts['chartTendances']=new Chart(canvas,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Commandes',data:history.map(h=>h.total_commandes),backgroundColor:'#d97706',borderRadius:4},
        {label:'Livrées',data:history.map(h=>h.livrees),backgroundColor:'#16a34a',borderRadius:4},
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            afterBody:function(ctx){
              const i=ctx[0].dataIndex;
              return'CA: '+fKMF(history[i].ca_kmf);
            }
          }
        }
      },
      scales:{
        x:{ticks:{color:'#8a9ab5'},grid:{color:'#e2e6ec'}},
        y:{ticks:{color:'#8a9ab5'},grid:{color:'#e2e6ec'}},
      }
    }
  });
}

prefill();
if(K.auth.isConnected()){
  // Token exists — try to boot directly
  K.request('/api/health').then(()=>boot(K.auth.getUser())).catch(()=>{K.auth.logout();});

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('loginScreen').style.display!=='none')doLogin();
});
