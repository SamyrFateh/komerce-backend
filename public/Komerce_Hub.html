<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komerce Hub — Gestion Colis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
    }

    .hub-header {
      background: #111827;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .hub-header h1 { font-size: 18px; font-weight: 800; }
    .hub-header .hub-user { font-size: 13px; color: #9ca3af; }

    .hub-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ── Actions ────────────────────────────── */
    .hub-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .hub-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 16px 8px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }
    .hub-action-btn:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .hub-action-btn .emoji { font-size: 28px; }

    /* ── Tabs ──────────────────────────────── */
    .hub-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
    }
    .hub-tab {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .hub-tab.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    /* ── Scanner ───────────────────────────── */
    .scan-section {
      background: #fff;
      border: 2px solid #3b82f6;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .scan-input {
      width: 100%;
      padding: 14px;
      border: 2px solid #d1d5db;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      text-transform: uppercase;
    }
    .scan-input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .scan-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .scan-btn:hover { background: #2563eb; }
    .scan-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    /* ── Misc ──────────────────────────────── */
    .hub-empty {
      text-align: center;
      padding: 40px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header class="hub-header">
    <h1>📦 Hub Dubai</h1>
    <div class="hub-user" id="hub-user">Agent Hub</div>
  </header>

  <div class="hub-content">
    <!-- Action buttons -->
    <div class="hub-actions">
      <button class="hub-action-btn" onclick="Hub.showScan('preparation')">
        <span class="emoji">📋</span>
        Préparer
      </button>
      <button class="hub-action-btn" onclick="Hub.showScan('shipped')">
        <span class="emoji">🚀</span>
        Expédier
      </button>
      <button class="hub-action-btn" onclick="Hub.showScan('in_transit')">
        <span class="emoji">🚢</span>
        En transit
      </button>
    </div>

    <!-- Scanner (hidden by default) -->
    <div class="scan-section" id="scan-section" style="display:none">
      <h3 id="scan-title" style="margin-bottom:12px;font-size:16px">📷 Scanner un colis</h3>
      <input type="text" class="scan-input" id="scan-input" placeholder="PCL-2026-XXXXX" autofocus>
      <button class="scan-btn" id="scan-btn" onclick="Hub.doScan()">✅ Confirmer le scan</button>
      <div id="scan-result" style="margin-top:12px"></div>
    </div>

    <!-- Parcels tabs -->
    <div class="hub-tabs" id="hub-tabs">
      <button class="hub-tab active" data-filter="active" onclick="Hub.filterTab('active')">🔄 Actifs</button>
      <button class="hub-tab" data-filter="preparation" onclick="Hub.filterTab('preparation')">📋 Préparation</button>
      <button class="hub-tab" data-filter="shipped" onclick="Hub.filterTab('shipped')">🚀 Expédiés</button>
      <button class="hub-tab" data-filter="in_transit" onclick="Hub.filterTab('in_transit')">🚢 Transit</button>
      <button class="hub-tab" data-filter="anomalies" onclick="Hub.filterTab('anomalies')">⚠️ Anomalies</button>
    </div>

    <!-- Parcels list -->
    <div id="hub-parcels">
      <div class="hub-empty">⏳ Chargement des colis...</div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/ct-api.js"></script>
  <script src="/js/parcel-components.js"></script>
  <script>
    window.Hub = {};
    Hub.parcels = [];
    Hub.scanType = null;

    Hub.init = async function() {
      try {
        const { parcels } = await CT.api.get('/api/v2/parcels');
        Hub.parcels = parcels;
        Hub.filterTab('active');
      } catch (err) {
        document.getElementById('hub-parcels').innerHTML = 
          `<div class="hub-empty" style="color:#dc2626">❌ Erreur: ${err.message}</div>`;
      }
    };

    Hub.filterTab = function(filter) {
      // Update tabs
      document.querySelectorAll('.hub-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.filter === filter);
      });

      let filtered;
      switch(filter) {
        case 'active':
          filtered = Hub.parcels.filter(p => !['collected','cancelled'].includes(p.status));
          break;
        case 'anomalies':
          filtered = Hub.parcels.filter(p => p.open_incidents > 0 || (p.alerts && p.alerts.length > 0));
          break;
        default:
          filtered = Hub.parcels.filter(p => p.status === filter);
      }

      ParcelUI.renderParcelList('hub-parcels', filtered, {
        onClick: 'ParcelUI.openDetail',
        showActions: true,
        emptyMessage: '📦 Aucun colis dans cette catégorie',
      });
    };

    Hub.showScan = function(type) {
      Hub.scanType = type;
      const labels = {
        preparation: '📋 Préparer un colis',
        shipped: '🚀 Expédier un colis',
        in_transit: '🚢 Marquer en transit',
      };
      document.getElementById('scan-section').style.display = '';
      document.getElementById('scan-title').textContent = labels[type] || '📷 Scanner';
      document.getElementById('scan-input').value = '';
      document.getElementById('scan-result').innerHTML = '';
      document.getElementById('scan-input').focus();
    };

    Hub.doScan = async function() {
      const ref = document.getElementById('scan-input').value.trim();
      if (!ref) return;

      const btn = document.getElementById('scan-btn');
      const result = document.getElementById('scan-result');
      btn.disabled = true;
      result.innerHTML = '⏳ Scan en cours...';

      try {
        const res = await CT.api.post(`/api/v2/parcels/${ref}/scan`, {
          event_type: Hub.scanType,
          location: 'Hub Dubai',
          actor_name: 'Agent Hub',
          actor_role: 'hub_agent',
        });

        result.innerHTML = `
          <div style="background:#d1fae5;padding:12px;border-radius:8px;margin-top:8px">
            ✅ <strong>${res.parcel.reference}</strong> — ${res.parcel.old_status} → <strong>${res.parcel.new_status}</strong>
            ${res.synced_orders > 0 ? `<br>📋 ${res.synced_orders} commande(s) synchronisée(s)` : ''}
          </div>
        `;

        // Refresh list
        Hub.init();
      } catch (err) {
        result.innerHTML = `<div style="background:#fee2e2;padding:12px;border-radius:8px;color:#dc2626">❌ ${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    };

    // Enter key to scan
    document.getElementById('scan-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') Hub.doScan();
    });

    // Init on load
    Hub.init();
  </script>

</body>
</html>
