<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Panier partagé Komerce — contribuez à un achat familial">
<title>Panier partagé Komerce</title>
<link rel="icon" href="/icons/favicon.ico">
<style>
  /* Design léger, robuste, mobile-first */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #f8fafc; color: #1e293b; min-height: 100vh;
  }
  .sc-app { max-width: 720px; margin: 0 auto; padding: 16px; }

  /* Header Komerce */
  .sc-header {
    background: linear-gradient(135deg, #16a34a, #15803d);
    color: white; padding: 18px 16px; border-radius: 12px;
    margin-bottom: 16px; text-align: center;
  }
  .sc-header h1 { margin: 0 0 4px; font-size: 1.4rem; font-weight: 800; }
  .sc-header p { margin: 0; font-size: 0.88rem; opacity: 0.95; }

  /* Card commune */
  .sc-card {
    background: white; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
  }

  /* État + jauge */
  .sc-progress-wrap { margin: 12px 0; }
  .sc-progress-bar {
    height: 12px; background: #f1f5f9; border-radius: 6px; overflow: hidden;
  }
  .sc-progress-fill {
    height: 100%; background: linear-gradient(90deg, #16a34a, #22c55e);
    transition: width 0.5s ease;
  }
  .sc-progress-stats {
    display: flex; justify-content: space-between; margin-top: 6px;
    font-size: 0.82rem; color: #64748b;
  }
  .sc-progress-stats strong { color: #1e293b; font-family: ui-monospace, monospace; }

  /* Total et reste */
  .sc-amounts {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 14px 0;
  }
  .sc-amount {
    background: #f8fafc; border: 1px solid #e2e8f0;
    border-radius: 8px; padding: 10px; text-align: center;
  }
  .sc-amount-label {
    font-size: 0.7rem; color: #64748b; text-transform: uppercase;
    letter-spacing: 0.4px; font-weight: 600;
  }
  .sc-amount-value {
    font-size: 1.05rem; font-weight: 800; color: #1e293b;
    font-family: ui-monospace, monospace; margin-top: 4px;
  }
  .sc-amount-remaining .sc-amount-value { color: #d97706; }
  .sc-amount-funded .sc-amount-value { color: #16a34a; }

  /* Items */
  .sc-items-title {
    font-size: 0.95rem; font-weight: 700; margin: 4px 0 10px; color: #1e293b;
  }
  .sc-item {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 10px;
    align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9;
  }
  .sc-item:last-child { border-bottom: none; }
  .sc-item-img {
    width: 56px; height: 56px; border-radius: 6px; background: #f1f5f9;
    object-fit: cover; flex-shrink: 0;
  }
  .sc-item-info { min-width: 0; }
  .sc-item-name { font-size: 0.88rem; font-weight: 600; color: #1e293b; }
  .sc-item-cat { font-size: 0.74rem; color: #94a3b8; }
  .sc-item-qty { font-size: 0.74rem; color: #475569; margin-top: 2px; }
  .sc-item-price {
    font-family: ui-monospace, monospace; font-weight: 700; font-size: 0.92rem;
    color: #1e293b; white-space: nowrap;
  }

  /* Phrase UX clé */
  .sc-trust {
    background: #ecfdf5; border-left: 4px solid #16a34a;
    padding: 12px 14px; border-radius: 6px;
    font-size: 0.82rem; color: #065f46; margin: 12px 0; line-height: 1.5;
  }
  .sc-trust strong { display: block; color: #064e3b; margin-bottom: 4px; }

  /* Bouton principal */
  .sc-btn {
    width: 100%; padding: 14px; font-size: 1rem; font-weight: 700;
    border: none; border-radius: 8px; cursor: pointer;
    background: #16a34a; color: white;
    font-family: inherit; transition: all 0.15s;
  }
  .sc-btn:hover { background: #15803d; }
  .sc-btn:disabled { background: #94a3b8; cursor: not-allowed; }

  /* Liste contributeurs */
  .sc-contribs-title {
    font-size: 0.95rem; font-weight: 700; margin: 16px 0 8px;
  }
  .sc-contrib {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid #f1f5f9;
  }
  .sc-contrib:last-child { border-bottom: none; }
  .sc-contrib-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #dbeafe; color: #1e40af; display: flex;
    align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
  }
  .sc-contrib-info { flex: 1; min-width: 0; }
  .sc-contrib-name { font-size: 0.85rem; font-weight: 600; color: #1e293b; }
  .sc-contrib-msg {
    font-size: 0.8rem; color: #475569; margin-top: 2px;
    font-style: italic;
  }
  .sc-contrib-amount {
    font-family: ui-monospace, monospace; font-weight: 700;
    font-size: 0.88rem; color: #16a34a; white-space: nowrap;
  }

  /* Status badges */
  .sc-status {
    display: inline-block; padding: 3px 10px; border-radius: 12px;
    font-size: 0.72rem; font-weight: 700; margin-bottom: 8px;
  }
  .sc-status-active { background: #dbeafe; color: #1e40af; }
  .sc-status-partial { background: #fef9c3; color: #854d0e; }
  .sc-status-funded { background: #dcfce7; color: #14532d; }
  .sc-status-closed { background: #f1f5f9; color: #64748b; }
  .sc-status-expired { background: #fee2e2; color: #b91c1c; }

  .sc-expires {
    font-size: 0.78rem; color: #64748b; margin-top: 6px;
  }

  /* États : empty / error / loading */
  .sc-state {
    text-align: center; padding: 60px 20px; color: #64748b;
  }
  .sc-state h2 { color: #1e293b; margin-bottom: 8px; }

  /* Modal contribution */
  .sc-modal-bg {
    position: fixed; inset: 0; background: rgba(15,23,42,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .sc-modal-bg.open { display: flex; }
  .sc-modal {
    background: white; border-radius: 12px; max-width: 480px;
    width: 100%; max-height: 90vh; overflow-y: auto;
  }
  .sc-modal-head {
    padding: 16px; border-bottom: 1px solid #e2e8f0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sc-modal-head h2 { margin: 0; font-size: 1.05rem; }
  .sc-modal-close {
    background: none; border: none; font-size: 1.5rem;
    color: #94a3b8; cursor: pointer; padding: 0; width: 28px;
  }
  .sc-modal-body { padding: 16px; }

  .sc-suggested {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 8px; margin: 12px 0;
  }
  .sc-suggest-btn {
    padding: 14px 8px; border: 2px solid #e2e8f0; background: white;
    border-radius: 8px; font-size: 0.92rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .sc-suggest-btn:hover { border-color: #16a34a; }
  .sc-suggest-btn.selected { border-color: #16a34a; background: #ecfdf5; color: #065f46; }
  .sc-suggest-btn small { display: block; font-weight: 500; color: #64748b; font-size: 0.7rem; margin-top: 2px; }

  .sc-form-row { margin: 12px 0; }
  .sc-form-row label {
    display: block; font-size: 0.78rem; color: #475569;
    font-weight: 600; margin-bottom: 4px;
  }
  .sc-form-row input, .sc-form-row textarea {
    width: 100%; padding: 10px; border: 1px solid #cbd5e1;
    border-radius: 6px; font-size: 0.92rem; font-family: inherit;
    background: white; color: #1e293b;
  }
  .sc-form-row input:focus, .sc-form-row textarea:focus {
    outline: 2px solid #16a34a; outline-offset: -1px; border-color: #16a34a;
  }

  .sc-error {
    background: #fef2f2; color: #b91c1c; border-left: 4px solid #dc2626;
    padding: 10px 14px; border-radius: 6px; margin: 10px 0;
    font-size: 0.85rem;
  }
  .sc-success {
    background: #ecfdf5; color: #065f46; border-left: 4px solid #16a34a;
    padding: 12px 14px; border-radius: 6px;
    font-size: 0.88rem;
  }

  .sc-footer {
    text-align: center; margin-top: 24px; padding: 16px;
    color: #94a3b8; font-size: 0.78rem;
  }
  .sc-footer a { color: #16a34a; text-decoration: none; }
</style>
</head>
<body>

<div class="sc-app">
  <div class="sc-header">
    <h1>🤝 Panier partagé Komerce</h1>
    <p>Aidez un proche à finaliser son achat</p>
  </div>

  <div id="sc-content">
    <div class="sc-state">
      <p>⏳ Chargement du panier...</p>
    </div>
  </div>

  <div class="sc-footer">
    Komerce — votre famille, vos achats, livrés au relais.<br>
    <a href="/">Retour à la boutique</a>
  </div>
</div>

<!-- Modal contribution -->
<div class="sc-modal-bg" id="sc-modal">
  <div class="sc-modal">
    <div class="sc-modal-head">
      <h2>💳 Je contribue</h2>
      <button class="sc-modal-close" id="sc-modal-close">×</button>
    </div>
    <div class="sc-modal-body" id="sc-modal-body"></div>
  </div>
</div>

<script>
'use strict';

// ─── Configuration ─────────────────────────────────────────────────────
const TOKEN = window.location.pathname.split('/').pop();
const API = '/api/shared-carts';

// Taux de change indicatif (le backend fait le vrai calcul)
const FX_KMF_PER_EUR = 491.97;

// Suggestions
const SUGGESTED_AMOUNTS_EUR = [25, 50, 100, 200];

// ─── État ──────────────────────────────────────────────────────────────
const state = {
  cart: null,
  items: [],
  contributions: [],
  selectedAmountEur: null,
  customAmount: false,
};

// ─── Helpers ───────────────────────────────────────────────────────────
const NF = new Intl.NumberFormat('fr-FR');
function fmtKmf(n) { return NF.format(Math.round(n || 0)) + ' KMF'; }
function fmtEur(n) { return Math.round(n) + ' €'; }
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function eurToKmf(eur) { return Math.round(eur * FX_KMF_PER_EUR); }
function kmfToEur(kmf) { return Math.round((kmf / FX_KMF_PER_EUR) * 100) / 100; }

function timeUntil(dateStr) {
  const target = new Date(dateStr).getTime();
  const now = Date.now();
  const diffDays = Math.floor((target - now) / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return 'expiré';
  if (diffDays === 0) return 'expire aujourd\'hui';
  if (diffDays === 1) return 'expire demain';
  return 'expire dans ' + diffDays + ' jours';
}

// ─── API ───────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body != null) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'HTTP ' + res.status }));
    throw new Error(err.error || ('HTTP ' + res.status));
  }
  return res.json();
}

// ─── Chargement ────────────────────────────────────────────────────────
async function loadCart() {
  try {
    const data = await api('GET', API + '/public/' + TOKEN);
    state.cart = data.cart;
    state.items = data.items || [];
    state.contributions = data.contributions || [];
    renderCart();
  } catch (err) {
    document.getElementById('sc-content').innerHTML =
      '<div class="sc-state"><h2>😕 Panier introuvable</h2>' +
      '<p>Ce lien de partage n\'est pas valide ou a expiré.</p></div>';
  }
}

// ─── Rendu principal ───────────────────────────────────────────────────
function renderCart() {
  const c = state.cart;
  const items = state.items;
  const contribs = state.contributions;

  const total = c.total_kmf_snapshot;
  const contributed = c.contributed_kmf;
  const remaining = c.remaining_kmf;
  const pct = total > 0 ? Math.min(100, Math.round((contributed / total) * 100)) : 0;
  const isOpen = (c.status === 'active' || c.status === 'partially_funded');
  const isExpired = new Date(c.expires_at) < new Date();
  const canContribute = isOpen && !isExpired && remaining > 0;

  let html = '';

  // Status badge
  const statusMap = {
    'active':              { cls: 'sc-status-active', label: '🌱 Actif' },
    'partially_funded':    { cls: 'sc-status-partial', label: '⏳ Financement en cours' },
    'fully_funded':        { cls: 'sc-status-funded', label: '✅ Entièrement financé' },
    'converted_to_order':  { cls: 'sc-status-closed', label: '📦 Commande finalisée' },
    'expired':             { cls: 'sc-status-expired', label: '⌛ Expiré' },
    'cancelled':           { cls: 'sc-status-closed', label: '❌ Annulé' },
  };
  const status = statusMap[c.status] || { cls: 'sc-status-closed', label: c.status };

  // Card principale
  html += '<div class="sc-card">';
  html += '<span class="sc-status ' + status.cls + '">' + status.label + '</span>';
  if (c.beneficiary_name_snapshot) {
    html += '<h2 style="margin:6px 0 4px;font-size:1.15rem;">Panier de ' + esc(c.beneficiary_name_snapshot) + '</h2>';
  }
  if (c.title) {
    html += '<p style="margin:2px 0;font-size:0.92rem;color:#475569;">' + esc(c.title) + '</p>';
  }
  if (c.message) {
    html += '<div style="background:#fef9c3;padding:10px 12px;border-radius:6px;margin:10px 0;font-size:0.85rem;color:#713f12;font-style:italic;">';
    html += '« ' + esc(c.message) + ' »';
    html += '</div>';
  }
  if (isOpen && !isExpired) {
    html += '<div class="sc-expires">⏰ ' + timeUntil(c.expires_at) + '</div>';
  }
  html += '</div>';

  // Jauge progression
  html += '<div class="sc-card">';
  html += '<div class="sc-progress-wrap">';
  html += '<div class="sc-progress-bar"><div class="sc-progress-fill" style="width:' + pct + '%"></div></div>';
  html += '<div class="sc-progress-stats">';
  html += '<span>Financé : <strong>' + fmtKmf(contributed) + '</strong></span>';
  html += '<span>' + pct + ' %</span>';
  html += '</div>';
  html += '</div>';

  // 3 montants
  html += '<div class="sc-amounts">';
  html += '<div class="sc-amount"><div class="sc-amount-label">Total</div><div class="sc-amount-value">' + fmtKmf(total) + '</div></div>';
  html += '<div class="sc-amount sc-amount-funded"><div class="sc-amount-label">Contribué</div><div class="sc-amount-value">' + fmtKmf(contributed) + '</div></div>';
  html += '<div class="sc-amount sc-amount-remaining"><div class="sc-amount-label">Reste</div><div class="sc-amount-value">' + fmtKmf(remaining) + '</div></div>';
  html += '</div>';
  html += '</div>';

  // Phrase confiance
  if (canContribute) {
    html += '<div class="sc-trust">';
    html += '<strong>🤝 Aide responsable</strong>';
    html += 'Votre contribution finance ce panier Komerce précis. Elle n\'est pas retirable en cash. ';
    html += 'Le bénéficiaire pourra compléter le reste au point relais si nécessaire.';
    html += '</div>';

    // Bouton principal
    html += '<button class="sc-btn" id="sc-contribute-btn">💳 Contribuer par carte bancaire</button>';
  } else if (c.status === 'fully_funded') {
    html += '<div class="sc-success">✅ Ce panier est entièrement financé. Le bénéficiaire peut le finaliser.</div>';
  } else if (c.status === 'converted_to_order') {
    html += '<div class="sc-success">📦 Ce panier a été finalisé en commande. Merci pour votre contribution !</div>';
  } else if (isExpired || c.status === 'expired') {
    html += '<div class="sc-error">⌛ Ce panier partagé a expiré et n\'accepte plus de contributions.</div>';
  } else if (c.status === 'cancelled') {
    html += '<div class="sc-error">❌ Ce panier a été annulé par le bénéficiaire.</div>';
  }

  // Items du panier
  html += '<div class="sc-card" style="margin-top:14px;">';
  html += '<div class="sc-items-title">📋 Le panier (' + items.length + ' article' + (items.length > 1 ? 's' : '') + ')</div>';
  items.forEach(it => {
    html += '<div class="sc-item">';
    if (it.image) {
      html += '<img class="sc-item-img" src="' + esc(it.image) + '" alt="" onerror="this.style.display=\'none\'">';
    } else {
      html += '<div class="sc-item-img"></div>';
    }
    html += '<div class="sc-item-info">';
    html += '<div class="sc-item-name">' + esc(it.name) + '</div>';
    if (it.category) html += '<div class="sc-item-cat">' + esc(it.category) + '</div>';
    html += '<div class="sc-item-qty">Quantité : ' + it.quantity + ' × ' + fmtKmf(it.unit_price_kmf) + '</div>';
    html += '</div>';
    html += '<div class="sc-item-price">' + fmtKmf(it.line_total_kmf) + '</div>';
    html += '</div>';
  });
  html += '</div>';

  // Contributeurs
  if (contribs.length) {
    html += '<div class="sc-card">';
    html += '<div class="sc-contribs-title">💚 Déjà ' + contribs.length + ' contributeur' + (contribs.length > 1 ? 's' : '') + '</div>';
    contribs.forEach(c => {
      const initial = (c.first_name || '?').charAt(0).toUpperCase();
      html += '<div class="sc-contrib">';
      html += '<div class="sc-contrib-avatar">' + esc(initial) + '</div>';
      html += '<div class="sc-contrib-info">';
      html += '<div class="sc-contrib-name">' + esc(c.first_name || 'Anonyme') + '</div>';
      if (c.message) html += '<div class="sc-contrib-msg">« ' + esc(c.message) + ' »</div>';
      html += '</div>';
      html += '<div class="sc-contrib-amount">+' + fmtKmf(c.amount_kmf) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  document.getElementById('sc-content').innerHTML = html;

  // Bind event
  const btn = document.getElementById('sc-contribute-btn');
  if (btn) btn.addEventListener('click', openContributeModal);
}

// ─── Modal contribution ────────────────────────────────────────────────
function openContributeModal() {
  const remaining = state.cart.remaining_kmf;
  const remainingEur = kmfToEur(remaining);

  let html = '';
  html += '<p style="font-size:0.88rem;color:#475569;margin:0 0 12px;">';
  html += 'Reste à financer : <strong>' + fmtKmf(remaining) + '</strong> (~' + fmtEur(remainingEur) + ')';
  html += '</p>';

  // Suggestions
  html += '<div style="font-size:0.78rem;color:#475569;font-weight:600;margin-bottom:6px;">Choisissez un montant :</div>';
  html += '<div class="sc-suggested">';
  SUGGESTED_AMOUNTS_EUR.forEach(eur => {
    const kmf = eurToKmf(eur);
    if (kmf > remaining) return; // ne pas suggérer un montant qui dépasse
    html += '<button class="sc-suggest-btn" data-eur="' + eur + '">' + fmtEur(eur) + '<small>≈ ' + fmtKmf(kmf) + '</small></button>';
  });
  html += '</div>';

  // Montant libre
  html += '<div class="sc-form-row">';
  html += '<label>Ou montant libre (€) :</label>';
  html += '<input type="number" id="sc-custom-amount" min="5" max="' + Math.floor(remainingEur) + '" step="1" placeholder="Ex: 75">';
  html += '<div style="font-size:0.7rem;color:#64748b;margin-top:4px;">Min 5 €, max ' + Math.floor(remainingEur) + ' €</div>';
  html += '</div>';

  // Champs contributeur
  html += '<div class="sc-form-row">';
  html += '<label>Votre prénom *</label>';
  html += '<input type="text" id="sc-name" placeholder="Ex: Ana" required maxlength="80">';
  html += '</div>';

  html += '<div class="sc-form-row">';
  html += '<label>Votre email *</label>';
  html += '<input type="email" id="sc-email" placeholder="ana@example.com" required maxlength="120">';
  html += '<div style="font-size:0.7rem;color:#64748b;margin-top:4px;">Pour recevoir le reçu Stripe</div>';
  html += '</div>';

  html += '<div class="sc-form-row">';
  html += '<label>Message (optionnel)</label>';
  html += '<textarea id="sc-message" rows="2" maxlength="200" placeholder="Bon mariage Mariama !"></textarea>';
  html += '</div>';

  // Erreur placeholder
  html += '<div id="sc-modal-error"></div>';

  // Bouton submit
  html += '<button class="sc-btn" id="sc-submit-btn" style="margin-top:8px;">→ Payer par carte bancaire</button>';

  document.getElementById('sc-modal-body').innerHTML = html;
  document.getElementById('sc-modal').classList.add('open');

  // Bind suggestions
  document.querySelectorAll('.sc-suggest-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.sc-suggest-btn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      state.selectedAmountEur = Number(b.dataset.eur);
      document.getElementById('sc-custom-amount').value = '';
    });
  });

  // Reset selection si custom
  document.getElementById('sc-custom-amount').addEventListener('input', () => {
    document.querySelectorAll('.sc-suggest-btn').forEach(x => x.classList.remove('selected'));
    state.selectedAmountEur = null;
  });

  // Submit
  document.getElementById('sc-submit-btn').addEventListener('click', submitContribution);
}

function closeModal() {
  document.getElementById('sc-modal').classList.remove('open');
  state.selectedAmountEur = null;
}

async function submitContribution() {
  const errBox = document.getElementById('sc-modal-error');
  errBox.innerHTML = '';

  const name = document.getElementById('sc-name').value.trim();
  const email = document.getElementById('sc-email').value.trim();
  const message = document.getElementById('sc-message').value.trim();
  const customStr = document.getElementById('sc-custom-amount').value;

  let amountEur = state.selectedAmountEur;
  if (!amountEur && customStr) amountEur = Number(customStr);

  if (!amountEur || amountEur < 5) {
    errBox.innerHTML = '<div class="sc-error">Choisissez un montant (min 5 €)</div>';
    return;
  }
  if (!name) {
    errBox.innerHTML = '<div class="sc-error">Votre prénom est requis</div>';
    return;
  }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errBox.innerHTML = '<div class="sc-error">Email invalide</div>';
    return;
  }

  const amountKmf = eurToKmf(amountEur);
  if (amountKmf > state.cart.remaining_kmf) {
    errBox.innerHTML = '<div class="sc-error">Le panier ne nécessite plus que ' + fmtKmf(state.cart.remaining_kmf) + '</div>';
    return;
  }

  const btn = document.getElementById('sc-submit-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Création de la session de paiement...';

  try {
    const r = await api('POST', API + '/public/' + TOKEN + '/contributions', {
      amount_kmf: amountKmf,
      contributor_name: name,
      contributor_email: email,
      message: message || null,
    });
    // Redirection vers Stripe Checkout
    window.location.href = r.checkout_url;
  } catch (err) {
    errBox.innerHTML = '<div class="sc-error">' + esc(err.message) + '</div>';
    btn.disabled = false;
    btn.textContent = '→ Payer par carte bancaire';
  }
}

// ─── Init ──────────────────────────────────────────────────────────────
document.getElementById('sc-modal-close').addEventListener('click', closeModal);
document.getElementById('sc-modal').addEventListener('click', (e) => {
  if (e.target.id === 'sc-modal') closeModal();
});

// Gérer les pages success/cancel
const urlParams = new URLSearchParams(window.location.search);
if (window.location.pathname.includes('/success') || urlParams.get('session_id')) {
  document.getElementById('sc-content').innerHTML =
    '<div class="sc-state">' +
    '<h2>🎉 Merci pour votre contribution !</h2>' +
    '<p style="margin:12px 0;">Votre paiement est en cours de confirmation.</p>' +
    '<p style="font-size:0.85rem;color:#64748b;">Vous recevrez un email de confirmation Stripe sous peu.</p>' +
    '<a href="/cart/shared/' + TOKEN + '" style="display:inline-block;margin-top:18px;padding:10px 20px;background:#16a34a;color:white;text-decoration:none;border-radius:6px;">Voir le panier mis à jour</a>' +
    '</div>';
} else if (window.location.pathname.includes('/cancel')) {
  document.getElementById('sc-content').innerHTML =
    '<div class="sc-state">' +
    '<h2>❌ Paiement annulé</h2>' +
    '<p style="margin:12px 0;">Aucun montant n\'a été débité.</p>' +
    '<a href="/cart/shared/' + TOKEN + '" style="display:inline-block;margin-top:18px;padding:10px 20px;background:#16a34a;color:white;text-decoration:none;border-radius:6px;">Retour au panier</a>' +
    '</div>';
} else {
  loadCart();
}
</script>
</body>
</html>
