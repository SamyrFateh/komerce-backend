<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" preserveAspectRatio="xMaxYMid meet" role="img" aria-label="Pilotage : tour de contrôle, radar et réseau">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A3BCE7" stop-opacity=".75"/>
      <stop offset="1" stop-color="#A3BCE7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B3C6E"/>
      <stop offset="1" stop-color="#071A3D"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8CDF1"/>
      <stop offset="1" stop-color="#3F77D8"/>
    </linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F9FBFE"/>
      <stop offset="1" stop-color="#C8D4E9"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#2762C9" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2762C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#2762C9"/>
    </pattern>
    <clipPath id="land">
      <path d="M470 70c30-18 70-20 100-8s48 26 40 44-40 26-78 22-80-20-62-58z"/>
      <path d="M640 52c26-12 62-10 84 6s18 40-8 52-62 6-82-10-18-34 6-48z"/>
      <path d="M780 96c22-10 52-6 68 10s6 38-18 46-52-2-62-22 0-26 12-34z"/>
      <path d="M860 40c18-8 44-4 56 10s0 32-22 36-42-8-44-24 2-16 10-22z"/>
    </clipPath>
  </defs>

  <!-- backdrop -->
  <circle cx="700" cy="140" r="190" fill="url(#glow)"/>
  <rect x="440" y="30" width="520" height="140" fill="url(#dots)" opacity=".34" clip-path="url(#land)"/>

  <!-- radar rings + sweep -->
  <g fill="none" stroke="#2762C9" stroke-opacity=".5" stroke-width="1.6">
    <circle cx="700" cy="112" r="46"/>
    <circle cx="700" cy="112" r="86" stroke-dasharray="3 7"/>
    <circle cx="700" cy="112" r="126" stroke-dasharray="2 10" stroke-opacity=".38"/>
  </g>
  <path d="M700 112L820 66A130 130 0 0 1 824 150z" fill="url(#sweep)"/>

  <!-- network links + nodes -->
  <g fill="none" stroke="#2762C9" stroke-width="2.2" stroke-dasharray="2 8" stroke-linecap="round">
    <path d="M700 112C640 70 580 62 520 84"/>
    <path d="M700 112C760 60 840 50 900 74"/>
    <path d="M700 112C770 130 840 140 930 128"/>
    <path d="M700 112C640 140 560 150 478 138"/>
  </g>
  <g>
    <g transform="translate(520 84)"><circle r="9" fill="#F2F6FD" stroke="#174AA1" stroke-width="2"/><circle r="3.5" fill="#071A3D"/></g>
    <g transform="translate(900 74)"><circle r="9" fill="#F2F6FD" stroke="#174AA1" stroke-width="2"/><circle r="3.5" fill="#071A3D"/></g>
    <g transform="translate(930 128)"><circle r="9" fill="#F2F6FD" stroke="#174AA1" stroke-width="2"/><circle r="3.5" fill="#071A3D"/></g>
    <g transform="translate(478 138)"><circle r="9" fill="#F2F6FD" stroke="#174AA1" stroke-width="2"/><circle r="3.5" fill="#071A3D"/></g>
    <rect x="532" y="56" width="52" height="18" rx="9" fill="#FFFFFF" stroke="#8BAAE0"/>
    <rect x="542" y="63" width="32" height="4" rx="2" fill="#2762C9"/>
    <rect x="852" y="40" width="52" height="18" rx="9" fill="#FFFFFF" stroke="#8BAAE0"/>
    <rect x="862" y="47" width="32" height="4" rx="2" fill="#0D2A52"/>
  </g>

  <!-- ground -->
  <ellipse cx="700" cy="236" rx="330" ry="9" fill="#071A3D" opacity=".07"/>
  <path d="M400 232h580" stroke="#2762C9" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>

  <!-- city blocks -->
  <g>
    <rect x="552" y="176" width="46" height="56" rx="2" fill="url(#bld)" stroke="#8BAAE0" stroke-width="1.3"/>
    <rect x="602" y="192" width="38" height="40" rx="2" fill="url(#bld)" stroke="#8BAAE0" stroke-width="1.3"/>
    <rect x="762" y="184" width="44" height="48" rx="2" fill="url(#bld)" stroke="#8BAAE0" stroke-width="1.3"/>
    <rect x="810" y="198" width="50" height="34" rx="2" fill="url(#bld)" stroke="#8BAAE0" stroke-width="1.3"/>
    <g fill="#2762C9" fill-opacity=".8">
      <rect x="560" y="186" width="8" height="6"/><rect x="574" y="186" width="8" height="6"/><rect x="560" y="200" width="8" height="6"/><rect x="574" y="200" width="8" height="6"/><rect x="560" y="214" width="8" height="6"/><rect x="574" y="214" width="8" height="6"/>
      <rect x="770" y="194" width="8" height="6"/><rect x="784" y="194" width="8" height="6"/><rect x="770" y="208" width="8" height="6"/><rect x="784" y="208" width="8" height="6"/>
    </g>
  </g>

  <!-- control tower -->
  <g>
    <path d="M684 232L690 134h20l6 98z" fill="url(#shaft)"/>
    <path d="M692 150h16M691 168h18M689 186h22M687 204h26" stroke="#2762C9" stroke-opacity=".55" stroke-width="1.6"/>
    <path d="M668 134h64l-8 14h-48z" fill="#0D2A52"/>
    <path d="M674 106h52l8 28h-68z" fill="url(#cab)" stroke="#174AA1" stroke-width="1.8"/>
    <path d="M684 114h8v14h-8zM696 114h8v14h-8zM708 114h8v14h-8z" fill="#071A3D" fill-opacity=".72"/>
    <rect x="668" y="98" width="64" height="9" rx="3" fill="#071A3D"/>
    <path d="M700 98V76" stroke="#071A3D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="700" cy="72" r="6" fill="#2762C9" stroke="#F2F6FD" stroke-width="2"/>
    <circle cx="700" cy="72" r="14" fill="none" stroke="#2762C9" stroke-opacity=".5" stroke-width="1.5"/>
    <rect x="668" y="226" width="64" height="8" rx="3" fill="#0D2A52"/>
  </g>

  <!-- left extension: shared territory, route and ground so the scene fills the lane -->
  <circle cx="300" cy="150" r="150" fill="url(#glow)" opacity=".8"/>
  <defs><clipPath id="landL">
    <path d="M60 110c26-20 66-24 96-10s44 30 30 48-52 24-92 14-52-30-34-52z"/>
    <path d="M220 56c26-14 62-12 84 4s16 40-10 52-60 6-80-10-16-34 6-46z"/>
    <path d="M300 150c24-10 56-6 72 10s4 36-20 44-52-2-60-22 0-24 8-32z"/>
  </clipPath></defs>
  <rect x="40" y="40" width="360" height="170" fill="url(#dots)" opacity=".34" clip-path="url(#landL)"/>
  <path d="M60 232h340" stroke="#2762C9" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 190C170 96 260 70 390 112" fill="none" stroke="#2762C9" stroke-width="2.2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g transform="translate(110 190)"><circle r="9" fill="#F2F6FD" stroke="#174AA1" stroke-width="2"/><circle r="3.5" fill="#071A3D"/></g>
  <g transform="translate(250 84)"><circle r="8" fill="#F2F6FD" stroke="#174AA1" stroke-width="2"/><circle r="3" fill="#071A3D"/></g>
  <g transform="translate(150 214)"><rect x="0" y="-40" width="40" height="54" rx="2" fill="#F9FBFE" stroke="#8BAAE0" stroke-width="1.3"/><rect x="46" y="-24" width="34" height="38" rx="2" fill="#F9FBFE" stroke="#8BAAE0" stroke-width="1.3"/><g fill="#2762C9" fill-opacity=".8"><rect x="8" y="-30" width="8" height="6"/><rect x="22" y="-30" width="8" height="6"/><rect x="8" y="-16" width="8" height="6"/><rect x="22" y="-16" width="8" height="6"/></g></g>
</svg>
