<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" role="img" aria-labelledby="title desc">
  <title id="title">Réseau logistique Komerce</title>
  <desc id="desc">Illustration légère d'une route logistique mondiale reliant bateau, avion et camion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset=".58" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="1">
      <stop offset="0" stop-color="#8db9e8"/>
      <stop offset="1" stop-color="#5f8fc9"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7c18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="260" fill="url(#bg)"/>

  <!-- abstract world map -->
  <g fill="#dfeaf6" opacity=".78">
    <path d="M532 36c54-18 118-13 154 5l25 22-28 18-42-5-19 16-44-3-34-18-42 2-12-21z"/>
    <path d="M720 60l65-15 75 12 20 22-29 19-5 26-36 13-38-19-42-9-17-27z"/>
    <path d="M910 39l81 5 57 28-23 21-51 2-12 20-49-4-29-29z"/>
    <path d="M1057 79l57-6 42 15-7 20-34 8-12 28-39-4-20-27z"/>
    <path d="M641 126l53 8 26 27-8 44-31 21-29-18-8-39-24-22z"/>
    <path d="M958 135l42 6 24 22-7 32-34 16-27-20-10-31z"/>
  </g>

  <!-- route -->
  <path d="M520 89 C650 8 797 18 908 92 S1136 155 1264 76" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="9 10" opacity=".8"/>
  <g fill="url(#orange)" stroke="#fff" stroke-width="4">
    <circle cx="590" cy="58" r="10"/>
    <circle cx="822" cy="48" r="10"/>
    <circle cx="1006" cy="113" r="10"/>
    <circle cx="1210" cy="87" r="10"/>
  </g>

  <!-- ship -->
  <g transform="translate(540 132)">
    <path d="M0 39h240l-25 30H37L0 39z" fill="#5e88b8"/>
    <rect x="54" y="8" width="34" height="30" rx="2" fill="#f59e0b"/>
    <rect x="92" y="8" width="34" height="30" rx="2" fill="#fbbf24"/>
    <rect x="130" y="8" width="34" height="30" rx="2" fill="#ef8354"/>
    <rect x="168" y="8" width="34" height="30" rx="2" fill="#8bb8dc"/>
    <rect x="19" y="19" width="31" height="20" rx="2" fill="#88add2"/>
    <path d="M35 18V1h14v17" fill="#7da5cf"/>
    <ellipse cx="122" cy="76" rx="140" ry="10" fill="#9fc3e7" opacity=".25" filter="url(#soft)"/>
  </g>

  <!-- plane -->
  <g transform="translate(1162 30) rotate(-8)">
    <path d="M0 28l88-20 45 5-37 20 28 17-12 4-40-12-34 19-12-2 22-23-50-2z" fill="#7eb0e1"/>
  </g>

  <!-- truck -->
  <g transform="translate(1160 150)">
    <rect x="0" y="0" width="105" height="49" rx="5" fill="#76a2d0"/>
    <path d="M105 15h42l24 20v14h-66z" fill="#5f8fc9"/>
    <rect x="119" y="21" width="23" height="14" rx="2" fill="#d9efff"/>
    <circle cx="31" cy="54" r="11" fill="#415d7d"/>
    <circle cx="137" cy="54" r="11" fill="#415d7d"/>
    <circle cx="31" cy="54" r="5" fill="#c9d6e4"/>
    <circle cx="137" cy="54" r="5" fill="#c9d6e4"/>
  </g>

  <!-- pins -->
  <g fill="#f58220">
    <path d="M500 48c0-13 10-23 23-23s23 10 23 23c0 17-23 40-23 40s-23-23-23-40zm23 8a9 9 0 100-18 9 9 0 000 18z"/>
    <path d="M1280 58c0-11 9-20 20-20s20 9 20 20c0 15-20 35-20 35s-20-20-20-35zm20 7a8 8 0 100-16 8 8 0 000 16z"/>
  </g>
</svg>