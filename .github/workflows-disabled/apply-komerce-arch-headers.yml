name: Apply Komerce Architecture Headers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-headers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply architecture headers
        run: node scripts/apply-komerce-arch-headers.js

      - name: Show changed files
        run: git status --short

      - name: Commit architecture headers
        run: |
          if git diff --quiet; then
            echo "No architecture header changes to commit."
            exit 0
          fi
          git config user.name "komerce-arch-bot"
          git config user.email "komerce-arch-bot@users.noreply.github.com"
          git add \
            server.js \
            bootstrap/api-routes.js \
            bootstrap/crons.js \
            services/shared-cart-engine.js \
            routes/shared-cart.js \
            routes/payments.js \
            services/order-payment-confirmation.js \
            routes/otp.js \
            routes/economic-engine.js \
            services/economic-engine-queries.js \
            public/boutique/js/boutique.js \
            public/boutique/js/b-cart.js \
            public/boutique/js/b-checkout.js \
            public/boutique/js/b-group-view.js \
            public/boutique/js/b-catalog.js \
            public/boutique/js/b-subcat.js \
            public/boutique/js/b-share-cart.js \
            public/boutique/js/b-nav.js
          git commit -m "Apply Komerce architecture headers"
          git push
