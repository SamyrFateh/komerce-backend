name: governance

# Enforcement actif (base 0, recale le 2026-06-16 contre le dump live Railway).
# - Hygiene headers (sans header, lite sans owner, mots-clefs SQL) => bloquant.
# - Drift SCHEMA.md/headers <-> DB live (docs/db/railway-live-schema.sql) => bloquant :
#   fiction hors liste blanche, fantome SCHEMA.md, ou cliquet tables non-doc depasse.
# - Le bruit n'est plus budgete : il est elimine a la source (parsers). Le residuel
#   reel est nomme dans scripts/arch-debt-budget.json (liste blanche + cliquet 0).
# - Le drift de graphe (graphe non regenere) bloque aussi.
# Rafraichir le dump live : pg_dump --schema-only > docs/db/railway-live-schema.sql
# Repasser en observation : `npm run arch:report` et arch-schema-drift-check.js --report.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  arch-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Regenere le graphe a partir des headers (sans dependances applicatives).
      - name: Generate architecture graph
        run: npm run arch:gen

      # BLOQUANT : interdit une PR qui modifie des headers sans regenerer le graphe.
      - name: Graph regenerated in PR (drift)
        run: |
          git diff --exit-code -- \
            docs/komerce-arch-header-graph.json \
            docs/KOMERCE_ARCH_HEADER_GRAPH.md \
          || (echo "::error::Graphe non regenere. Lance 'npm run arch:gen' et commit les fichiers docs/komerce-arch-header-graph.*" && exit 1)

      # Enforcement : tier BLOQUANT fait echouer la CI. Observe = non bloquant.
      - name: Architecture / DB check (bloquant)
        run: npm run arch:check

      # BLOQUANT : le budget doit etre reconcilie. Si un correctif a resolu une fiction
      # (DB corrigee ou header re-tagge) sans elaguer l'allowlist, echoue avec le remede
      # exact (npm run arch:reconcile -- --write) au lieu d'un blocage generique.
      - name: Budget reconcilie ? (bloquant)
        run: node scripts/arch-reconcile.js --check

      # BLOQUANT : drift SCHEMA.md / headers <-> DB live (docs/db/railway-live-schema.sql).
      # Echoue sur fiction hors liste blanche, fantome SCHEMA.md, ou cliquet depasse.
      - name: Schema drift vs live DB (bloquant)
        run: node scripts/arch-schema-drift-check.js

      # BLOQUANT : headers <-> SQL reel du fichier (sous-declaration, §2.2).
      # Une table live touchee par le code doit etre declaree dans @db-read/@db-write.
      # Cliquet : ne bloque qu'au-dela du plafond fige (observation tant que non baseline).
      - name: Headers vs SQL reel (bloquant)
        run: node scripts/arch-header-sql-check.js

      # BLOQUANT : doctrine sanitize_before_render. Bloque si une source externe
      # (req/params/query/body, location, URL…) est rendue sans echappement dans un
      # sink HTML, sur le diff de la PR. Backstop d'un --no-verify local.
      - name: Doctrine sanitize_before_render (bloquant)
        run: node scripts/arch-doctrine-sanitize-check.js --diff=origin/${{ github.base_ref || 'main' }}
