name: Sourcing real desktop guided screens — 2026-10-29
on:
  push:
    branches: [audit/sourcing-refinery-catalog-visual-20261029]
    paths:
      - '.github/workflows/sourcing-real-screens-20261029.yml'
      - 'tests/journey-sourcing-20261029/**'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  screenshot:
    name: Real Sourcing — 4 views / Chromium desktop 1440 / no writes
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 14
    env:
      CI: 'true'
      NODE_ENV: test
      E2E_SOURCING_EMAIL: ${{ secrets.E2E_SOURCING_EMAIL }}
      E2E_SOURCING_PASSWORD: ${{ secrets.E2E_SOURCING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20',cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: node --check tests/journey-sourcing-20261029/sourcing-real.spec.js
      - name: Capture authenticated real Sourcing pages — writes forbidden
        run: npx playwright test -c playwright.sourcing-real-20261029.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sourcing-real-desktop-20261029
          path: test-results/journey-sourcing-20261029/
          if-no-files-found: warn
          retention-days: 14
