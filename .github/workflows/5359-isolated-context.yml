name: ECO canonical group scope technical preflight
on:
  push:
    branches: [test/eco-group-canonical-preflight]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18d3da9580aef5e711e340e9c3205bcb837e1941
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check public/dashboards/canonical/js/app.js
      - run: node --check public/dashboards/canonical/js/navigation-policy-v4.js
      - run: npx jest --config jest.unit.config.js --runInBand tests/unit/canonical-admin-app.test.js tests/unit/canonical-navigation.test.js tests/unit/canonical-pricing-economic-cockpit.test.js tests/unit/canonical-client-router-v4.test.js tests/unit/admin-pricing-workspace-capability-mapping.test.js
