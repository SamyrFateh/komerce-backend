name: 5356 integrated On Demand preflight
on:
  push:
    branches: [test/5359-market-context-preflight]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c24a68e70d475392c2c099900a2de25f66b003b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix public/boutique --ignore-scripts --no-audit --no-fund
      - name: Direct dashboard mounting tests
        run: npx jest --config jest.unit.config.js --runInBand tests/unit/canonical-on-demand-app.test.js
      - name: Canonical preflight on exact candidate
        run: npm run pr:preflight -- --base 65bcc304359e078d12de268b2134120f9d885ce9
