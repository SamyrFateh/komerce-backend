name: Staging-only governance preflight
on:
  push:
    branches: [test/5359-market-context-preflight]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5b346d42e48fdad1b2201ff09742a354b0171db8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate governance change
        run: npm run pr:preflight -- --base 65bcc304359e078d12de268b2134120f9d885ce9
