name: 5359 staging Chromium service worker cache isolation
on:
  push:
    branches: [test/5359-market-context-preflight]
permissions:
  contents: read
concurrency:
  group: komerce-staging-storefront-e2e-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_ORIGIN: https://komerce-backend-production.up.railway.app
      EXPECTED_SHA: c06f4779dcf1de6c214e6827d538fedc38dacc60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c06f4779dcf1de6c214e6827d538fedc38dacc60
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm exact deployed staging revision before opening browser
        run: |
          mkdir -p test-results/5359
          node <<'JS'
          const fs=require('node:fs');
          (async()=>{
            const get=async p=>{const r=await fetch(process.env.STAGING_ORIGIN+p,{redirect:'error'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()};
            const h=await get('/health'),v=await get('/health/version');
            const out={environment:h.komerce_env,db:h.db,sha:v.commit,fingerprint:h.target?.db_fingerprint,expected:process.env.EXPECTED_SHA};
            console.log(JSON.stringify(out));fs.writeFileSync('test-results/5359/target.json',JSON.stringify(out,null,2));
            if(h.komerce_env!=='staging'||h.db!=='connected'||!out.fingerprint||v.commit!==out.expected)throw Error('NOT_PROVEN_TARGET_PIN');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
      - run: npm ci --prefix public/boutique --ignore-scripts --no-audit --no-fund
      - run: cd public/boutique && npx playwright install --with-deps chromium
      - name: Real Chromium service worker registry cache isolation
        run: |
          node <<'JS'
          const {chromium}=require('./public/boutique/node_modules/@playwright/test');
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const base=process.env.STAGING_ORIGIN,out='test-results/5359',target=JSON.parse(fs.readFileSync(out+'/target.json'));
          const report={target,scope:'public read-only; synthetic stale entry in isolated browser cache only',verdict:'NOT_PROVEN',checks:{}};
          const registry='/boutique/js/market-registry.js';
          (async()=>{
            const browser=await chromium.launch();
            try{
              const ctx=await browser.newContext({viewport:{width:1440,height:900},serviceWorkers:'allow'});
              const page=await ctx.newPage();
              await page.goto(base+'/CM',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.body.dataset.marketCode==='CM');
              await page.evaluate(async()=>{await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready});
              await page.waitForFunction(()=>navigator.serviceWorker.controller?.scriptURL.endsWith('/sw.js'));
              report.checks.controller=true;
              const live=await page.evaluate(async p=>{const r=await fetch(p,{cache:'no-store'});return {ok:r.ok,cacheControl:r.headers.get('cache-control'),body:await r.text()}},registry);
              assert.ok(live.ok);assert.match(live.cacheControl,/no-store/i);
              report.checks.registryNoStore=true;
              const cachedBefore=await page.evaluate(async p=>Boolean(await caches.match(p)),registry);
              assert.equal(cachedBefore,false);
              report.checks.registryNotCached=true;
              await page.evaluate(async p=>{const c=await caches.open('komerce-v341');await c.put(p,new Response('/* STALE_REGISTRY_TEST_SENTINEL */',{headers:{'Content-Type':'application/javascript'}}))},registry);
              const fresh=await page.evaluate(async p=>{const r=await fetch(p,{cache:'no-store'});return {ok:r.ok,body:await r.text()}},registry);
              assert.ok(fresh.ok);assert.equal(fresh.body,live.body);assert.ok(!fresh.body.includes('STALE_REGISTRY_TEST_SENTINEL'));
              report.checks.onlineBypassesStale=true;
              await ctx.setOffline(true);
              const offline=await page.evaluate(async p=>{try{const r=await fetch(p,{cache:'no-store'});return {ok:r.ok,body:await r.text()}}catch(e){return {ok:false,rejected:true}}},registry);
              assert.equal(offline.ok,false);assert.ok(!offline.body?.includes('STALE_REGISTRY_TEST_SENTINEL'));
              report.checks.offlineDoesNotReplayStale=true;
              await ctx.setOffline(false);
              for(const code of ['CG','KM','CM']){
                await page.goto(base+'/'+code,{waitUntil:'domcontentloaded'});
                await page.waitForFunction(c=>document.body.dataset.marketCode===c,code,{timeout:15000});
                assert.equal(await page.evaluate(()=>window.KomerceMarket.get().code),code);
                report.checks['navigation_'+code]=true;
              }
              await page.evaluate(async p=>{for(const key of await caches.keys())await (await caches.open(key)).delete(p)},registry);
              await ctx.close();
            }finally{await browser.close()}
            const v=await(await fetch(base+'/health/version')).json(),h=await(await fetch(base+'/health')).json();
            assert.equal(v.commit,target.sha);assert.equal(h.komerce_env,'staging');assert.equal(h.target?.db_fingerprint,target.fingerprint);
            report.verdict='PASS_SW_REGISTRY_ISOLATION';
          })().catch(e=>{report.failure=e.message;process.exitCode=1}).finally(()=>{fs.writeFileSync(out+'/cache-report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report))});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 5359-staging-country-proof
          path: test-results/5359/
          if-no-files-found: error
          retention-days: 14
