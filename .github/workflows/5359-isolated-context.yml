name: G6 V5.4 test realignment targeted technical checks
on:
  push:
    branches: [test/g6-v54-realignment-preflight]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4fd580f138d4640f697d8cbaa61a3b8668a7dee1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check scripts/recette/g6-negative-n30-chromium.js
      - run: node --check scripts/recette/canonical/negative-scenarios.js
      - run: node --check scripts/recette/canonical/negative-runner.js
      - run: npx jest --config jest.unit.config.js --runInBand tests/unit/g6-negative-scenarios.test.js tests/unit/g6-46-stage-routing-preflight.test.js tests/unit/g6-46-workflow-dispatch-readiness.test.js
