name: 5359 isolated context and impact
on:
  push:
    branches: [test/5359-market-context-preflight]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62e4acee1c95da7f76b0c6464a8ecf7ace3c44fc
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix public/boutique --ignore-scripts --no-audit --no-fund
      - name: Targeted unit regression tests
        run: |
          npx jest --config jest.unit.config.js --runInBand tests/unit/sw.test.js
          npm --prefix public/boutique run test:unit -- market-country-path.test.js
      - name: Canonical preflight before PR
        run: npm run pr:preflight -- --base 80e7c8c3496468a26e6b268d8ee9b27d0192ccb2
