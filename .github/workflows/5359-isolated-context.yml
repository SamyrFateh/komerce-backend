name: 5356 On Demand real staging read-only preflight
on:
  push:
    branches: [test/5359-market-context-preflight]
permissions:
  contents: read
concurrency:
  group: komerce-g6-canonical-real-transaction
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_SHA: c06f4779dcf1de6c214e6827d538fedc38dacc60
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      PGOPTIONS: '-c default_transaction_read_only=on'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c06f4779dcf1de6c214e6827d538fedc38dacc60
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm deployed target, migration, capability registry and marked identities
        run: |
          mkdir -p test-results/on-demand
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const report={verdict:'NOT_PROVEN',checks:{}};
          const db=require('./db');
          const base=process.env.STAGING_BASE_URL;
          async function get(p){const r=await fetch(base+p,{redirect:'error'});assert.equal(r.status,200);return r.json()}
          (async()=>{
            const version=await get('/health/version'),health=await get('/health');
            assert.equal(version.commit,process.env.EXPECTED_SHA);assert.equal(health.komerce_env,'staging');
            const target=await require('./scripts/recette/target-guard').confirmTarget({db});
            assert.equal(target.confirmed,true);report.target={sha:version.commit,fingerprint:target.fingerprint};
            const q=await db.getClient();
            try{
              await q.query('BEGIN READ ONLY');
              assert.equal((await q.query('SHOW transaction_read_only')).rows[0].transaction_read_only,'on');
              const schema=(await q.query("SELECT to_regclass('public.client_requests') IS NOT NULL AS requests,to_regclass('public.conversation_messages') IS NOT NULL AS messages,to_regclass('public.conversation_attachments') IS NOT NULL AS attachments")).rows[0];
              report.checks.schema=schema;
              assert.ok(Object.values(schema).every(Boolean),'MIGRATION_457_MISSING');
              report.checks.capabilities=(await q.query("SELECT capability,status,effect FROM capability_registry WHERE capability IN ('client.read','client.case.handle') ORDER BY capability")).rows;
              assert.equal(report.checks.capabilities.length,2,'CAPABILITY_REGISTRY_INCOMPLETE');
              assert.ok(report.checks.capabilities.every(x=>x.status==='LIVE'),'CAPABILITY_NOT_LIVE');
              report.checks.markedRoles=(await q.query("SELECT u.role::text AS role,count(*)::int AS n FROM e2e_test_accounts e JOIN users u ON u.id=e.user_id GROUP BY u.role ORDER BY u.role")).rows;
              report.checks.marketActors=(await q.query("SELECT m.code, count(DISTINCT CASE WHEN mc.capability='client.read' THEN am.user_id END)::int AS readers,count(DISTINCT CASE WHEN mc.capability='client.case.handle' THEN am.user_id END)::int AS handlers FROM markets m JOIN market_operating_assignments a ON a.market_id=m.id AND a.status='ACTIVE' JOIN assignment_memberships am ON am.assignment_id=a.id AND am.status='ACTIVE' JOIN e2e_test_accounts e ON e.user_id=am.user_id JOIN membership_capabilities mc ON mc.membership_id=am.id AND mc.revoked_at IS NULL JOIN assignment_capability_ceiling acc ON acc.assignment_id=a.id AND acc.capability=mc.capability AND acc.revoked_at IS NULL WHERE m.is_active AND m.lifecycle_status='ACTIVE' GROUP BY m.code ORDER BY m.code")).rows;
              report.checks.requestCount=(await q.query('SELECT count(*)::int AS n FROM client_requests')).rows[0].n;
              await q.query('ROLLBACK');
            }finally{q.release()}
            report.checks.anonymous={};
            for(const p of ['/api/client-requests','/api/markets/KM/client-requests','/api/hub/client-requests']){
              const r=await fetch(base+p,{redirect:'error'});report.checks.anonymous[p]=r.status;assert.ok([401,403].includes(r.status),'ANONYMOUS_NOT_DENIED');
            }
            const end=await get('/health/version'),after=await get('/health');
            assert.equal(end.commit,report.target.sha);assert.equal(after.target.db_fingerprint,report.target.fingerprint);
            report.verdict='PASS_STAGING_PREFLIGHT_NOT_TRANSACTION_CERTIFICATION';
          })().catch(e=>{report.failure=e.code||e.message?.slice(0,200);process.exitCode=1}).finally(async()=>{fs.writeFileSync('test-results/on-demand/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));await db.pool.end()});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: on-demand-staging-preflight
          path: test-results/on-demand/report.json
          retention-days: 14
