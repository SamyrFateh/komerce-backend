name: On Demand UX targeted architecture context
on:
  push:
    branches: [test/5359-market-context-preflight]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c06f4779dcf1de6c214e6827d538fedc38dacc60
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run agent:context -- --pack ui --files public/boutique/js/b-on-demand.js public/boutique/css/on-demand.css public/boutique/index.html
      - run: npm run arch:impact -- public/boutique/js/b-on-demand.js
      - run: npm run arch:impact -- public/boutique/css/on-demand.css
      - run: npm run arch:impact -- public/boutique/index.html
