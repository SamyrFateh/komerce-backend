name: 5356 responsive On Demand standard preflight
on:
  push:
    branches: [test/5359-market-context-preflight]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7b651c354a52e250b422e12c10533e64b7a9f12
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix public/boutique --ignore-scripts --no-audit --no-fund
      - name: Targeted unit regression
        run: cd public/boutique && npx jest tests/unit/b-on-demand.test.js tests/unit/catalog-empty-states.test.js --runInBand
      - name: Standard preflight
        run: npm run pr:preflight
