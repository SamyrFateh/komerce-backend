name: CI single full preflight — quick publication proof
on:
  push:
    branches: [test/5359-market-context-preflight]
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 78ec64ff5ea557c94615d4cb37252e357d6df11f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix public/boutique ci --ignore-scripts --no-audit --no-fund
      - name: Targeted governance regression
        run: npx jest --config jest.unit.config.js --runInBand tests/unit/agent-guardrails-hooks.test.js tests/unit/pr-preflight-ci-parity.test.js
      - name: Publication preflight (no repeated full unit suites)
        run: npm run pr:preflight -- --quick --base 7ff197e1505dafed532a0e54a49733431079941c
