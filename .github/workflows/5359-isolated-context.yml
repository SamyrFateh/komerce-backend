name: 5356 integrated On Demand preflight
on:
  push:
    branches: [test/5359-market-context-preflight]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 69a60cbfac5763d9a8809e86a472cedbf64252a4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix public/boutique --ignore-scripts --no-audit --no-fund
      - name: Canonical preflight on exact candidate
        run: npm run pr:preflight -- --base 65bcc304359e078d12de268b2134120f9d885ce9
