name: Railway isolated certification HTTP smoke

on:
  push:
    branches: [test/catalog-pricing-railway-cert-20261029]
    paths:
      - '.github/workflows/catalog-railway-cert-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check isolated service identity and deny unauthenticated Catalogue
        env:
          CERT_BASE_URL: https://komerce-catalog-api-cert-certification.up.railway.app
        run: |
          set -euo pipefail
          echo 'Checking standalone certification deployment (GET only)'
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 6 --max-time 20 \
            "$CERT_BASE_URL/health/version" -o /tmp/version.json
          python3 - <<'PY'
          import json
          o=json.load(open('/tmp/version.json'))
          print('HTTP_CERT_HEALTH',json.dumps({k:o.get(k) for k in ('commit','sha','status','environment') if k in o}))
          PY
          code=$(curl --silent --show-error --retry 4 --retry-all-errors --max-time 20 \
            -o /dev/null -w '%{http_code}' "$CERT_BASE_URL/api/admin/workspaces/catalog")
          echo "Unauthenticated Catalogue HTTP status: $code"
          case "$code" in 401|403|302) echo 'HTTP_CERT_AUTH_DENIED PASS' ;; *) echo "HTTP_CERT_AUTH_FAIL"; exit 1;; esac
