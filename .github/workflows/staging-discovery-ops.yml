name: Staging Discovery operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Opération staging autorisée'
        required: true
        type: choice
        default: railway-check
        options:
          - railway-check
          - discovery-check
          - discovery-seed
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: komerce-staging-v2-${{ github.event_name == 'workflow_dispatch' && inputs.operation || github.event.issue.title }}
  cancel-in-progress: false

jobs:
  discovery-ops:
    name: Discovery staging — bounded operation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       (github.event.issue.title == '[staging-op] railway-check' ||
        github.event.issue.title == '[staging-op] discovery-seed' ||
        github.event.issue.title == '[staging-op] discovery-check'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DISCOVERY_STAGING_SEED_ENABLED: 'true'
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '1c5c37ab-557b-41b1-885a-8b3ead573795'
      RAILWAY_SERVICE_ID: '48ee010d-a1c3-4c47-9028-c1aacf90e00f'
      RAILWAY_ENVIRONMENT_ID: '7a0ce7dc-93a0-4bfa-88c9-088f70e8883a'
      RAILWAY_GRAPHQL_URL: 'https://backboard.railway.com/graphql/v2'

    steps:
      - name: Resolve bounded operation
        id: operation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          DISPATCH_OPERATION: ${{ inputs.operation || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            operation="$DISPATCH_OPERATION"
          else
            case "$ISSUE_TITLE" in
              '[staging-op] railway-check') operation='railway-check' ;;
              '[staging-op] discovery-seed') operation='discovery-seed' ;;
              '[staging-op] discovery-check') operation='discovery-check' ;;
              *) echo '::error::Opération non autorisée'; exit 1 ;;
            esac
          fi

          case "$operation" in
            railway-check|discovery-seed|discovery-check) ;;
            *) echo '::error::Opération non autorisée'; exit 1 ;;
          esac

          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "Operation: $operation"

      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        if: steps.operation.outputs.operation != 'railway-check'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify Railway staging project token
        if: steps.operation.outputs.operation == 'railway-check' || steps.operation.outputs.operation == 'discovery-seed'
        id: railway_access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo '::error::RAILWAY_TOKEN manque dans les secrets GitHub'
            exit 1
          fi

          response="$RUNNER_TEMP/railway-project-token.json"
          payload='{"query":"query { projectToken { projectId environmentId } }"}'
          http_code="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --url "$RAILWAY_GRAPHQL_URL" \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "$payload")"

          if [ "$http_code" != '200' ]; then
            echo "::error::Railway API HTTP $http_code"
            exit 1
          fi
          if jq -e '.errors and (.errors | length > 0)' "$response" >/dev/null; then
            echo '::error::Railway API a refusé le project token'
            jq -c '.errors | map({message})' "$response"
            exit 1
          fi

          project_id="$(jq -r '.data.projectToken.projectId // empty' "$response")"
          environment_id="$(jq -r '.data.projectToken.environmentId // empty' "$response")"
          if [ "$project_id" != "$RAILWAY_PROJECT_ID" ] || [ "$environment_id" != "$RAILWAY_ENVIRONMENT_ID" ]; then
            echo '::error::Le token ne cible pas la staging Komerce attendue'
            exit 1
          fi

          echo 'railway_access=ok' >> "$GITHUB_OUTPUT"
          echo 'Railway staging project token authenticated and correctly scoped.'

      - name: Install application dependencies
        if: steps.operation.outputs.operation != 'railway-check'
        run: npm ci

      - name: Require staging database secret
        if: steps.operation.outputs.operation != 'railway-check'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo '::error::RAILWAY_DATABASE_URL manque dans les secrets GitHub'
            exit 1
          fi

      - name: Seed Discovery staging
        if: steps.operation.outputs.operation == 'discovery-seed'
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 90s node scripts/seed-discovery-staging.js)"
          printf '%s\n' "$output"

          candidates="$(printf '%s\n' "$output" | sed -n 's/^DISCOVERY_RAIL_CANDIDATES=//p' | tail -n 1)"
          if [ -z "$candidates" ]; then
            echo '::error::Le seed n’a pas produit DISCOVERY_RAIL_CANDIDATES'
            exit 1
          fi

          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"
          echo "candidate_count=$(printf '%s' "$candidates" | awk -F',' '{print NF}')" >> "$GITHUB_OUTPUT"

      - name: Verify Discovery staging data
        if: steps.operation.outputs.operation != 'railway-check'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node - <<'NODE'
          const db = require('./db');

          const CJ_LOCAL_SORT_ORDERS = [-1063, -1054, -1051, -1039, -1030, -1021, -1012];

          async function main() {
            const { rows: [market] } = await db.query(
              `SELECT id FROM markets WHERE code = 'KM' AND is_active = true LIMIT 1`
            );
            if (!market) throw new Error('market KM actif introuvable');

            const { rows: products } = await db.query(
              `SELECT p.product_ref, p.sourcing_source, p.sort_order, p.image_url,
                      ls.qty_physical, ls.commercial_exposure
                 FROM local_stock ls
                 JOIN products p ON p.id = ls.product_id
                WHERE ls.market_id = $1
                  AND ls.location = 'KM_MAIN'
                  AND ls.commercial_exposure = 'ENABLED'
                  AND (
                    p.product_ref = 'GOLDEN-ELITE-PRO'
                    OR (p.sourcing_source = 'CJdropshipping' AND p.sort_order = ANY($2::int[]))
                  )
                ORDER BY p.sort_order, p.product_ref`,
              [market.id, CJ_LOCAL_SORT_ORDERS]
            );

            const cj = products.filter(row => row.sourcing_source === 'CJdropshipping');
            const invalidCj = cj.filter(row =>
              Number(row.qty_physical) <= 0
              || !/^https:\/\//i.test(String(row.image_url || ''))
              || String(row.product_ref || '').toUpperCase().startsWith('SHOWCASE-V2-')
            );

            const { rows: [thirdParty] } = await db.query(
              `SELECT
                 (SELECT COUNT(*)::int FROM physical_offers WHERE market_id = $1 AND status = 'active' AND commercial_exposure = 'ENABLED') AS physical_offers,
                 (SELECT COUNT(*)::int FROM services WHERE market_id = $1 AND status = 'active' AND commercial_exposure = 'ENABLED') AS services`,
              [market.id]
            );

            const proof = {
              market: 'KM',
              local_products: products.length,
              cj_products: cj.length,
              cj_real_media: cj.filter(row => /^https:\/\//i.test(String(row.image_url || ''))).length,
              invalid_cj: invalidCj.length,
              product_refs: products.map(row => row.product_ref),
              physical_offers: thirdParty.physical_offers,
              services: thirdParty.services,
            };
            console.log(JSON.stringify(proof, null, 2));

            if (proof.local_products !== 8 || proof.cj_products !== 7 || proof.cj_real_media !== 7 || proof.invalid_cj !== 0) {
              throw new Error(`Discovery local CJ audit failed: ${JSON.stringify(proof)}`);
            }

            if (process.env.GITHUB_OUTPUT) {
              require('fs').appendFileSync(process.env.GITHUB_OUTPUT,
                `local_products=${proof.local_products}\ncj_products=${proof.cj_products}\nphysical_offers=${proof.physical_offers}\nservices=${proof.services}\n`);
            }
          }

          main()
            .catch(err => { console.error(err); process.exitCode = 1; })
            .finally(() => db.pool.end());
          NODE

      - name: Sync Discovery rail variables through Railway API
        if: steps.operation.outputs.operation == 'discovery-seed'
        id: railway
        shell: bash
        env:
          CANDIDATES: ${{ steps.seed.outputs.candidates }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/railway-variable-upsert.json"
          payload="$(jq -n \
            --arg projectId "$RAILWAY_PROJECT_ID" \
            --arg environmentId "$RAILWAY_ENVIRONMENT_ID" \
            --arg serviceId "$RAILWAY_SERVICE_ID" \
            --arg candidates "$CANDIDATES" \
            '{
              query: "mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }",
              variables: {
                input: {
                  projectId: $projectId,
                  environmentId: $environmentId,
                  serviceId: $serviceId,
                  variables: {
                    DISCOVERY_RAIL_ENABLED: "true",
                    DISCOVERY_RAIL_CANDIDATES: $candidates
                  }
                }
              }
            }')"

          http_code="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --url "$RAILWAY_GRAPHQL_URL" \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "$payload")"

          if [ "$http_code" != '200' ]; then
            echo "::error::Railway variable API HTTP $http_code"
            exit 1
          fi
          if jq -e '.errors and (.errors | length > 0)' "$response" >/dev/null; then
            echo '::error::Railway variableCollectionUpsert a échoué'
            jq -c '.errors | map({message})' "$response"
            exit 1
          fi

          echo 'runtime_sync=accepted' >> "$GITHUB_OUTPUT"
          echo 'Railway accepted the two Discovery staging variable updates.'

      - name: Write operation summary
        if: always()
        shell: bash
        env:
          OPERATION: ${{ steps.operation.outputs.operation }}
          RAILWAY_ACCESS: ${{ steps.railway_access.outputs.railway_access }}
          LOCAL_PRODUCTS: ${{ steps.verify.outputs.local_products }}
          CJ_PRODUCTS: ${{ steps.verify.outputs.cj_products }}
          PHYSICAL_OFFERS: ${{ steps.verify.outputs.physical_offers }}
          SERVICES: ${{ steps.verify.outputs.services }}
          CANDIDATE_COUNT: ${{ steps.seed.outputs.candidate_count }}
          RUNTIME_SYNC: ${{ steps.railway.outputs.runtime_sync }}
        run: |
          {
            echo '## Komerce staging operations'
            echo
            echo "- operation: ${OPERATION:-unknown}"
            if [ "$OPERATION" = 'railway-check' ] || [ "$OPERATION" = 'discovery-seed' ]; then
              echo "- Railway access: ${RAILWAY_ACCESS:-unknown}"
            fi
            if [ "$OPERATION" != 'railway-check' ]; then
              echo "- local products: ${LOCAL_PRODUCTS:-unknown}"
              echo "- real CJ local products: ${CJ_PRODUCTS:-unknown}"
              echo "- physical offers: ${PHYSICAL_OFFERS:-unknown}"
              echo "- services: ${SERVICES:-unknown}"
            fi
            if [ "$OPERATION" = 'discovery-seed' ]; then
              echo "- candidates: ${CANDIDATE_COUNT:-unknown}"
              echo "- Railway variable update: ${RUNTIME_SYNC:-unknown}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close successful command issue
        if: success() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OPERATION: ${{ steps.operation.outputs.operation }}
          RAILWAY_ACCESS: ${{ steps.railway_access.outputs.railway_access }}
          RUNTIME_SYNC: ${{ steps.railway.outputs.runtime_sync }}
        run: |
          set -euo pipefail
          note="Staging operation \`$OPERATION\` completed successfully."
          if [ "$OPERATION" = 'railway-check' ]; then
            note="$note Railway access: ${RAILWAY_ACCESS:-unknown}."
          fi
          if [ "$OPERATION" = 'discovery-seed' ]; then
            note="$note Railway access: ${RAILWAY_ACCESS:-unknown}. Variable update: ${RUNTIME_SYNC:-unknown}."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$note"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
