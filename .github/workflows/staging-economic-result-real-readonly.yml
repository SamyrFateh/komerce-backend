# Owner-only read-only proof of the merged #5131 economic KPI on real Railway staging.
name: Economic result KM CM CG — actual staging API PG and Chromium READ ONLY

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  certify:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] economic-result-real-readonly'
    concurrency:
      group: komerce-g6-canonical-real-transaction
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      PGOPTIONS: '-c default_transaction_read_only=on'
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pin exact running staging SHA, refuse deployed code drift
        run: node scripts/recette/resolve-staging-deploy-pin.js
      - name: Confirm protected staging PostgreSQL fingerprint (read only)
        run: node scripts/recette/target-guard.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compare actual economic result across API PG and Chromium (NO business writes)
        run: node scripts/recette/economic-result-real-readonly.js
      - name: Preserve evidence even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-result-real-readonly-${{ github.run_id }}
          path: |
            test-results/economic-result-readonly/
            test-results/hub-v1-http/deploy-pin.json
          if-no-files-found: warn
          retention-days: 21
