name: Boutique JS proof bootstrap

on:
  push:
    branches:
      - test/pr-enforcement-boutique-js-proof

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create comment-only JS proof
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'public/boutique/js/b-cart.js';
          const marker = '// CI scope proof: Boutique JS gates (temporary, never merge).';
          let src = fs.readFileSync(file, 'utf8');
          if (!src.includes(marker)) {
            const firstNl = src.indexOf('\n');
            src = src.slice(0, firstNl + 1) + marker + '\n' + src.slice(firstNl + 1);
            fs.writeFileSync(file, src, 'utf8');
          }
          NODE
          git config user.name "Komerce CI Proof"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/boutique-js-proof-bootstrap.yml
          git add public/boutique/js/b-cart.js
          git commit -m "test(ci): prove Boutique JS PR enforcement"
          git push origin HEAD:test/pr-enforcement-boutique-js-proof
