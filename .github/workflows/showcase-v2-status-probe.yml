name: One-shot probe Showcase V2 media realism proof status

on:
  push:
    branches:
      - ops/showcase-v2-run50
    paths:
      - '.github/workflows/showcase-v2-status-probe.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/showcase-v2-run50

      - name: Capture latest media realism and visual proof runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          realism=$(gh run list --workflow showcase-v2-media-realism.yml --branch main --limit 5 --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha 2>/dev/null || echo '[]')
          proof=$(gh run list --workflow showcase-v2-media-realism-proof.yml --branch ops/showcase-v2-run50 --limit 5 --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha 2>/dev/null || echo '[]')
          jq -n --argjson realism "$realism" --argjson proof "$proof" '{captured_at:(now|todate),media_realism_runs:$realism,visual_proof_runs:$proof}' > .showcase-v2-media-realism-proof-status.json

          git config user.name "Komerce Showcase Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .showcase-v2-media-realism-proof-status.json
          git commit -m "ops(showcase): capture media realism visual proof status" || exit 0
          git push origin HEAD:ops/showcase-v2-run50
