name: Audit closure gate matrix

on:
  push:
    branches:
      - agent/proof-audit-closure-20260816

permissions:
  contents: read

jobs:
  gate:
    name: audit · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: feature-check
            command: npm run feature:check
          - name: business-graph-ratchet
            command: npm run business-graph:ratchet-check
          - name: feature-360
            command: npm run feature:360:check
          - name: classification-strict
            command: npm run feature:classification:strict
          - name: registry-doc
            command: npm run feature:registry-doc
          - name: security-360
            command: npm run security:360:check
          - name: invariant-strict
            command: npm run feature:invariant:check:strict
          - name: arch-gate
            command: npm run arch:gate
          - name: map-check
            command: npm run map:check
          - name: tree-clean
            command: git diff --exit-code
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      KOMERCE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-test-jwt-secret
      ADMIN_PASSWORD: ci-test-admin-password
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-test-authkey
      PAYPAL_CLIENT_ID: ci-test-paypal-client
      PAYPAL_CLIENT_SECRET: ci-test-paypal-secret
      PAYPAL_WEBHOOK_ID: ci-test-paypal-webhook
      META_WA_APP_SECRET: ci-test-meta-secret
      KOMERCE_DISABLE_CRONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fad4cdd71bd4853db2a289393002c5e02e297b9c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prove exact SHA
        run: test "$(git rev-parse HEAD)" = "fad4cdd71bd4853db2a289393002c5e02e297b9c"

      - run: npm ci

      - name: Build canonical test database
        run: |
          PGPASSWORD=komerce psql -h localhost -U komerce -d komerce_test -f docs/db/railway-live-schema.sql
          node scripts/ci-migrate.js

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
