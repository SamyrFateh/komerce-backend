name: Hero Mobile Slogan Polish Audit

on:
  push:
    branches:
      - feat/discovery-local-v2
    paths:
      - '.github/workflows/hero-mobile-slogan-polish-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci
      - name: Test hero contract
        working-directory: public/boutique
        run: npx jest tests/unit/hero-ultra-mobile.test.js --runInBand
      - name: Rebuild canonical CSS
        working-directory: public/boutique
        run: npm run deploy:css
      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium
      - name: Capture polished mobile Hero
        working-directory: public/boutique
        shell: bash
        run: |
          mkdir -p hero-slogan-polish-audit
          npx serve .. --listen 3000 --no-clipboard >/tmp/komerce-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://localhost:3000/boutique/ >/dev/null && break; sleep 1; done
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const context = await browser.newContext({ viewport:{width:390,height:844}, locale:'fr-FR', serviceWorkers:'block', deviceScaleFactor:1 });
            const page = await context.newPage();
            await page.route(/\/api\//, r => r.fulfill({status:200, contentType:'application/json', body:'{}'}));
            await page.route(/\/api\/products(\?|$)/, r => r.fulfill({status:200, contentType:'application/json', body:'[]'}));
            await page.goto('http://localhost:3000/boutique/index.html', {waitUntil:'domcontentloaded'});
            await page.waitForTimeout(800);
            const metrics = await page.evaluate(() => {
              const q = s => document.querySelector(s);
              const rr = el => { const r=el?.getBoundingClientRect(); return r ? {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom} : null; };
              const slogan=q('.k-hero-mini-slogan--premium');
              const l1=q('.k-hero-mini-slogan--premium .k-line-1');
              const l2=q('.k-hero-mini-slogan--premium .k-line-2');
              const hero=q('.k-hero-media');
              return { display:getComputedStyle(slogan).display, hero:rr(hero), slogan:rr(slogan), line1:rr(l1), line2:rr(l2), text1:l1?.textContent?.trim(), text2:l2?.textContent?.trim() };
            });
            if (metrics.display === 'none') throw new Error('slogan hidden');
            if (!metrics.hero || !metrics.line2 || metrics.line2.bottom > metrics.hero.bottom + 1) throw new Error('slogan vertical overflow');
            if (metrics.line2.right > metrics.hero.x + metrics.hero.width * 0.43) throw new Error('slogan intrudes into portrait cluster');
            fs.writeFileSync('hero-slogan-polish-audit/metrics.json', JSON.stringify(metrics,null,2));
            console.log('HERO_POLISH_METRICS=' + JSON.stringify(metrics));
            await page.screenshot({path:'hero-slogan-polish-audit/mobile-390-hero.jpg', type:'jpeg', quality:88, fullPage:false});
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-mobile-slogan-polish-audit
          path: public/boutique/hero-slogan-polish-audit/
          if-no-files-found: error
      - name: Commit generated CSS and remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hero-mobile-slogan-polish-audit.yml
          git add public/boutique/css/dist public/boutique/index.html public/boutique/.cache-buster-state.json
          git commit -m 'chore(boutique): rebuild mobile hero slogan css'
          git push origin HEAD:feat/discovery-local-v2
