name: tmp-prod-subcategory-photo-audit

on:
  push:
    branches:
      - tmp/prod-subcategory-photo-audit-20260901
    paths:
      - .github/workflows/tmp-prod-subcategory-photo-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/prod-subcategory-photo-audit-20260901
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Inspect live files and catalog
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://komerce-backend-production.up.railway.app'
          echo '=== LIVE INDEX BUNDLES ==='
          curl -fsSL -H 'Cache-Control: no-cache' "${BASE}/?qa=$(date +%s)" | grep -oE '/boutique/css/dist/(components|desktop)\.css\?v=[0-9]+' | sort -u || true
          echo '=== LIVE PRODUCT PHOTO HELPER ==='
          curl -fsSL -H 'Cache-Control: no-cache' "${BASE}/boutique/js/render/category-shelf-visuals.js?qa=$(date +%s)" -o /tmp/visuals.js
          grep -n 'getShelfSubcategoryProductImage\|renderShelfProductPhoto' /tmp/visuals.js || true
          echo '=== LIVE CATALOG SHAPE ==='
          curl -fsSL -H 'Cache-Control: no-cache' "${BASE}/api/products?limit=1000&qa=$(date +%s)" -o /tmp/products.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/products.json','utf8'));
          const products = Array.isArray(raw) ? raw : (raw.products || []);
          const available = products.filter(p => p.is_available !== false);
          const withImage = available.filter(p => String(p.image_url || '').trim());
          console.log(JSON.stringify({ total: products.length, available: available.length, withImage: withImage.length }, null, 2));
          const groups = {};
          for (const p of available) {
            const k = `${p.category || '(none)'} :: ${p.subcategory || '(none)'}`;
            const g = groups[k] ||= { count: 0, withImage: 0, sample: null };
            g.count++;
            if (p.image_url) { g.withImage++; if (!g.sample) g.sample = p.image_url; }
          }
          Object.entries(groups).sort().forEach(([k,v]) => console.log(k, JSON.stringify(v)));
          NODE

      - name: Chromium audit live navigation
        working-directory: public/boutique
        env:
          BASE: https://komerce-backend-production.up.railway.app
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.on('console', m => { if (m.type() === 'error') console.log('BROWSER_ERROR', m.text()); });
            await page.goto(`${process.env.BASE}/?qa=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(4000);
            const state = await page.evaluate(() => ({
              products: window._kstate?.products?.length ?? null,
              activeCat: window._kstate?.activeCat ?? null,
              cards: document.querySelectorAll('.k-card').length,
            }));
            console.log('BOOT_STATE', JSON.stringify(state));
            const cats = ['Mode & Beauté','Maison','Tech','Bricolage','Créations personnelles','Auto'];
            for (const cat of cats) {
              const chip = page.locator(`.k-chip[data-cat="${cat}"]`).first();
              const exists = await chip.count();
              if (!exists) { console.log('CAT_MISSING', cat); continue; }
              await chip.click();
              await page.waitForTimeout(350);
              const result = await page.locator('#k-subcats-wrap').evaluate((wrap) => {
                const rows = [...wrap.querySelectorAll('.k-subcutout[data-subcat]')].filter(b => b.dataset.subcat);
                return rows.map(b => ({
                  subcat: b.dataset.subcat,
                  media: b.dataset.shelfMedia || 'fallback',
                  visual: b.dataset.shelfVisual || null,
                  src: b.querySelector('img')?.getAttribute('src') || null,
                  tag: b.querySelector('.k-subcutout-icon')?.firstElementChild?.tagName || null,
                }));
              });
              console.log('CAT_RESULT', cat, JSON.stringify(result));
            }
            await page.screenshot({ path: 'test-results/live-subcategory-photo-audit.png', fullPage: true });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tmp-prod-subcategory-photo-audit.yml
          git commit -m 'chore(qa): remove temporary live subcategory audit' || true
          git push origin HEAD:tmp/prod-subcategory-photo-audit-20260901
