name: Materialize transport rail manifest ownership

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transport-rail-doctrine-audit
          fetch-depth: 0
      - name: Materialize logistics manifest blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('features/logistics.feature.js')
          s = p.read_text()
          s = s.replace("      'docs/doctrine/DOCTRINE_NON_CONFORMITE.md',", "      'docs/doctrine/DOCTRINE_NON_CONFORMITE.md',\n      'docs/doctrine/DOCTRINE_TRANSPORT_RAILS.md',")
          s = s.replace("      'services/routing.js',],", "      'services/routing.js',\n      'services/transport-rails.js',],")
          s = s.replace("      'tests/unit/routing.test.js',", "      'tests/unit/routing.test.js',\n      'tests/unit/transport-rails.test.js',")
          p.write_text(s)
          PY
          git rev-parse 'HEAD^{tree}' > base-tree-sha.txt
          python - <<'PY' > blob-payload.json
          import base64, json
          raw = open('features/logistics.feature.js', 'rb').read()
          print(json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input blob-payload.json --jq .sha > manifest-blob-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: transport-rail-manifest-blob
          path: |
            base-tree-sha.txt
            manifest-blob-sha.txt
          if-no-files-found: error
