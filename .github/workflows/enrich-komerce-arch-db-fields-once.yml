name: Enrich Komerce Architecture DB Fields Once

on:
  push:
    paths:
      - .github/workflows/enrich-komerce-arch-db-fields-once.yml
      - scripts/enrich-komerce-arch-db-fields.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich-db-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enrich architecture headers with DB metadata
        run: node scripts/enrich-komerce-arch-db-fields.js

      - name: Commit DB metadata enrichment
        run: |
          if git diff --quiet; then
            echo "No DB metadata changes to commit."
            exit 0
          fi
          git config user.name "komerce-arch-bot"
          git config user.email "komerce-arch-bot@users.noreply.github.com"
          git add \
            services/shared-cart-engine.js \
            routes/shared-cart.js \
            services/shared-cart-v41-transitions.js \
            services/shared-cart-items-service.js \
            services/shared-cart-estimation-service.js \
            services/shared-cart-financial-guard.js \
            services/shared-cart-queries.js \
            routes/payments.js \
            services/payment-stripe.js \
            services/payment-cash-confirm.js \
            services/order-payment-confirmation.js \
            services/order-status-machine.js \
            services/order-service.js \
            routes/orders.js \
            routes/products.js \
            routes/admin-boutique-categories.js \
            routes/boutique-suggestions.js \
            routes/otp.js \
            routes/wallet.js \
            services/notification-service.js \
            services/whatsapp-meta.js \
            routes/economic-engine.js \
            services/economic-engine-queries.js
          git commit -m "Enrich Komerce architecture headers with DB touchpoints"
          git push
