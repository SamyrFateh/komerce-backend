name: Audit close regenerate canonical 360

on:
  push:
    branches:
      - fix/audit-close-regenerate-360

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-close-regenerate-360
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dashboards:canonical:360:save
      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DASHBOARDS_360_CANONICAL.json docs/DASHBOARDS_360_CANONICAL.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "docs(audit): regenerate canonical 360 projection"
          git push origin HEAD:fix/audit-close-regenerate-360
