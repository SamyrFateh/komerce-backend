name: One-shot probe Showcase V2 refinery progress

on:
  push:
    branches:
      - ops/showcase-v2-run50
    paths:
      - '.github/workflows/showcase-v2-run50-trigger.yml'

permissions:
  contents: write

jobs:
  probe-refinery:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/showcase-v2-run50
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture read-only Railway progress
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { Pool } = require('pg');
          (async () => {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const { rows: [products] } = await pool.query(`
              SELECT
                COUNT(*) FILTER (WHERE product_ref LIKE 'SHOWCASE-V2-%')::int AS products,
                COUNT(*) FILTER (WHERE product_ref LIKE 'SHOWCASE-V2-%' AND content_source='ai_enriched')::int AS enriched,
                COUNT(*) FILTER (WHERE product_ref LIKE 'SHOWCASE-V2-%' AND quality_validated=TRUE)::int AS quality_validated,
                COUNT(*) FILTER (WHERE product_ref LIKE 'SHOWCASE-V2-%' AND is_active=TRUE)::int AS active
              FROM products
            `);
            const { rows: candidates } = await pool.query(`
              SELECT state, COUNT(*)::int AS count
                FROM sourcing_candidates
               WHERE supplier_name='Komerce Showcase V2'
               GROUP BY state
               ORDER BY state
            `);
            await pool.end();
            fs.writeFileSync('.showcase-v2-db-progress.json', JSON.stringify({ captured_at: new Date().toISOString(), products, candidates }, null, 2) + '\n');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          git config user.name "Komerce Showcase Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .showcase-v2-db-progress.json
          git commit -m "ops(showcase): capture live refinery progress"
          git push origin HEAD:ops/showcase-v2-run50
