name: One-shot probe Showcase V2 run 50

on:
  push:
    branches:
      - ops/showcase-v2-run50
    paths:
      - '.github/workflows/showcase-v2-run50-trigger.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe-run50:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/showcase-v2-run50

      - name: Capture canonical refinery workflow_dispatch evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          found=''
          for attempt in $(seq 1 18); do
            runs="$(gh api "/repos/${GH_REPO}/actions/workflows/showcase-v2-staging-deploy.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
            found="$(printf '%s' "$runs" | jq -c --arg cutoff "$cutoff" '.workflow_runs | map(select(.event == "workflow_dispatch" and .head_branch == "main" and .created_at >= $cutoff)) | sort_by(.created_at) | reverse | .[0] // empty')"
            if [ -n "$found" ]; then break; fi
            sleep 5
          done

          if [ -z "$found" ]; then
            jq -n --arg cutoff "$cutoff" '{found:false, cutoff:$cutoff, note:"No recent main workflow_dispatch found"}' > .showcase-run50-status.json
          else
            run_id="$(printf '%s' "$found" | jq -r '.id')"
            jobs="$(gh api "/repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100")"
            printf '%s' "$found" | jq --argjson jobs "$jobs" '{found:true, run:{id:.id, run_number:.run_number, status:.status, conclusion:.conclusion, created_at:.created_at, updated_at:.updated_at, html_url:.html_url, head_branch:.head_branch, head_sha:.head_sha, event:.event}, jobs:($jobs.jobs | map({id,name,status,conclusion,started_at,completed_at}))}' > .showcase-run50-status.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .showcase-run50-status.json
          git commit -m "ops(showcase): capture run 50 dispatch evidence" || exit 0
          git push origin HEAD:ops/showcase-v2-run50
