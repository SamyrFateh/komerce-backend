name: One-shot repair Showcase V2 taxonomy and resume

on:
  push:
    branches:
      - ops/showcase-v2-run50
    paths:
      - '.github/workflows/showcase-v2-run50-trigger.yml'

permissions:
  actions: write
  contents: write

jobs:
  repair-and-resume:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      NODE_ENV: test
      KOMERCE_ALLOW_SHOWCASE_SEED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Restore and verify canonical Showcase V2 taxonomy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const db = require('./db');
          const { buildSlots } = require('./scripts/showcase-v2-plan');

          (async () => {
            if (!process.env.DATABASE_URL) throw new Error('DATABASE_URL requis');
            const slots = buildSlots();
            if (slots.length !== 500) throw new Error(`Plan V2 invalide: ${slots.length}/500`);
            const expected = new Map();
            for (const s of slots) {
              const k = `${s.category}|||${s.subcategory}`;
              expected.set(k, (expected.get(k) || 0) + 1);
            }

            const client = await db.getClient();
            try {
              await client.query('BEGIN');
              let repaired = 0;
              for (const slot of slots) {
                const { rows: [product] } = await client.query(
                  `UPDATE products
                      SET category=$2, subcategory=$3, updated_at=NOW()
                    WHERE product_ref=$1
                    RETURNING id, product_ref`,
                  [slot.product_ref, slot.category, slot.subcategory]
                );
                if (!product) throw new Error(`Produit V2 absent: ${slot.product_ref}`);
                await client.query(
                  `INSERT INTO catalog_field_overrides
                     (product_id, field_name, field_value, reason)
                   VALUES ($1, 'category', $2, $3)
                   ON CONFLICT (product_id, field_name) DO UPDATE SET
                     field_value=EXCLUDED.field_value,
                     reason=EXCLUDED.reason,
                     updated_at=NOW()`,
                  [product.id, slot.category,
                   'Showcase V2: taxonomie hiérarchique canonique imposée par le plan; la proposition éditoriale IA ne remplace pas le parent normalisé.']
                );
                repaired += 1;
              }

              const { rows } = await client.query(
                `SELECT category, subcategory, COUNT(*)::int AS count
                   FROM products
                  WHERE is_active=TRUE AND product_ref LIKE 'SHOWCASE-V2-%'
                  GROUP BY category, subcategory`
              );
              if (rows.length !== expected.size) {
                throw new Error(`Couverture taxonomie: ${rows.length}/${expected.size} paires`);
              }
              for (const row of rows) {
                const key = `${row.category}|||${row.subcategory}`;
                const want = expected.get(key);
                if (want !== row.count) {
                  throw new Error(`Quota ${row.category}/${row.subcategory}: attendu ${want ?? 0}, obtenu ${row.count}`);
                }
                expected.delete(key);
              }
              if (expected.size) throw new Error(`Paires taxonomie manquantes: ${[...expected.keys()].join(', ')}`);

              await client.query('COMMIT');
              console.log(`[showcase-v2-taxonomy-repair] repaired=${repaired}, taxonomy_pairs=${rows.length}, status=OK`);
            } catch (error) {
              await client.query('ROLLBACK').catch(() => {});
              throw error;
            } finally {
              client.release();
              await db.pool.end();
            }
          })().catch((error) => {
            console.error('[showcase-v2-taxonomy-repair] échec:', error.message);
            process.exit(1);
          });
          NODE

      - name: Dispatch one canonical resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run showcase-v2-staging-deploy.yml --ref main -f mode=resume
          run=''
          for attempt in $(seq 1 30); do
            runs=$(gh run list \
              --workflow showcase-v2-staging-deploy.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 20 \
              --json databaseId,headSha,status,conclusion,createdAt,updatedAt,url)
            run=$(echo "$runs" | jq -c --arg started "$started_at" '[.[] | select(.createdAt >= $started)][0] // empty')
            if [ -n "$run" ]; then break; fi
            sleep 2
          done
          if [ -z "$run" ]; then
            echo '::error::Run resume non retrouvé après dispatch'
            exit 1
          fi
          printf '%s\n' "$run" > /tmp/showcase-v2-run66.json
          printf '%s\n' "$started_at" > /tmp/showcase-v2-run66-started-at.txt

      - uses: actions/checkout@v4
        with:
          ref: ops/showcase-v2-run50

      - name: Persist exact resume run id
        shell: bash
        run: |
          set -euo pipefail
          run=$(cat /tmp/showcase-v2-run66.json)
          started_at=$(cat /tmp/showcase-v2-run66-started-at.txt)
          jq -n --arg started_at "$started_at" --argjson run "$run" \
            '{found:true,mode:"resume",taxonomy_repair:true,started_at:$started_at,run:$run}' \
            > .showcase-v2-run66-status.json
          git config user.name "Komerce Showcase Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .showcase-v2-run66-status.json
          git commit -m "ops(showcase): capture taxonomy-repaired resume run66"
          git push origin HEAD:ops/showcase-v2-run50
