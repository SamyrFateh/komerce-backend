name: One-shot capture Showcase V2 post-repair status

on:
  push:
    branches:
      - ops/showcase-v2-run50
    paths:
      - '.github/workflows/showcase-v2-run50-trigger.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/showcase-v2-run50

      - name: Capture latest repair and canonical deploy runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          repair=$(gh run list \
            --workflow showcase-v2-taxonomy-repair.yml \
            --branch ops/showcase-v2-run50 \
            --limit 5 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha 2>/dev/null || echo '[]')
          deploy=$(gh run list \
            --workflow showcase-v2-staging-deploy.yml \
            --event workflow_dispatch \
            --branch main \
            --limit 10 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha 2>/dev/null || echo '[]')
          jq -n --argjson repair "$repair" --argjson deploy "$deploy" \
            '{captured_at:(now|todate),repair_runs:$repair,deploy_runs:$deploy}' \
            > .showcase-v2-post-repair-status.json

          git config user.name "Komerce Showcase Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .showcase-v2-post-repair-status.json
          git commit -m "ops(showcase): capture post-repair status"
          git push origin HEAD:ops/showcase-v2-run50
