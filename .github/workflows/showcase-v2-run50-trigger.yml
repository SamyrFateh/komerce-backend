name: One-shot probe Showcase V2 deterministic fixtures

on:
  push:
    branches:
      - ops/showcase-v2-run50
    paths:
      - '.github/workflows/showcase-v2-run50-trigger.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe-showcase-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/showcase-v2-run50

      - name: Capture latest canonical campaign on merged fixture SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: e97b110f06532b76021078cb4cd89a2e9f3e62d8
        run: |
          set -euo pipefail
          runs=$(gh run list \
            --workflow showcase-v2-staging-deploy.yml \
            --event workflow_dispatch \
            --branch main \
            --limit 10 \
            --json databaseId,headSha,status,conclusion,createdAt,updatedAt,url)
          run_id=$(echo "$runs" | jq -r --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo '{"found":false,"target_sha":"'"$TARGET_SHA"'"}' > .showcase-v2-deterministic-status.json
          else
            run=$(echo "$runs" | jq --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha)][0]')
            jobs=$(gh api "/repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100" --jq '.jobs | map({id,name,status,conclusion,started_at,completed_at})')
            jq -n --argjson run "$run" --argjson jobs "$jobs" '{found:true,run:$run,jobs:$jobs}' > .showcase-v2-deterministic-status.json
          fi
          git config user.name "Komerce Showcase Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .showcase-v2-deterministic-status.json
          if ! git diff --cached --quiet; then
            git commit -m "ops(showcase): capture deterministic campaign status"
            git push origin HEAD:ops/showcase-v2-run50
          fi
