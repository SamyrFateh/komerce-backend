name: One-shot Showcase V2 media realism pilot

on:
  push:
    branches:
      - ops/showcase-v2-run50
    paths:
      - '.github/workflows/showcase-v2-run50-trigger.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch-media-realism-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/showcase-v2-run50

      - name: Dispatch exactly one 21-image pilot on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: 351ff4c1f687c4ddfe742d64a981903990cb48c0
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run showcase-v2-media-realism.yml --ref main \
            -f scope=pilot \
            -f quality=medium \
            -f confirm_all=''

          run=''
          for attempt in $(seq 1 30); do
            runs=$(gh run list \
              --workflow showcase-v2-media-realism.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 20 \
              --json databaseId,headSha,status,conclusion,createdAt,updatedAt,url)
            run=$(echo "$runs" | jq -c --arg sha "$TARGET_SHA" --arg started "$started_at" \
              '[.[] | select(.headSha == $sha and .createdAt >= $started)][0] // empty')
            if [ -n "$run" ]; then break; fi
            sleep 2
          done

          if [ -z "$run" ]; then
            echo '::error::Run media realism pilot non retrouvé après dispatch'
            exit 1
          fi

          jq -n \
            --arg started_at "$started_at" \
            --argjson run "$run" \
            '{found:true,scope:"pilot",quality:"medium",expected_count:21,started_at:$started_at,run:$run}' \
            > .showcase-v2-media-realism-pilot-status.json

          git config user.name "Komerce Showcase Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .showcase-v2-media-realism-pilot-status.json
          git commit -m "ops(showcase): capture media realism pilot"
          git push origin HEAD:ops/showcase-v2-run50
