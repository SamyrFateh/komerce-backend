name: One-shot trigger Showcase V2 run 50

on:
  push:
    branches:
      - ops/showcase-v2-run50
    paths:
      - '.github/workflows/showcase-v2-run50-trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-run50:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Showcase V2 refinery on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GH_REPO}/actions/workflows/showcase-v2-staging-deploy.yml/dispatches" \
            -f ref=main
          echo "Showcase V2 run 50 dispatched on main."
