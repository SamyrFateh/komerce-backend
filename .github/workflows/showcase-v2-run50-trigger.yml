name: One-shot dispatch Showcase V2 fragility schema

on:
  push:
    branches:
      - ops/showcase-v2-run50
    paths:
      - '.github/workflows/showcase-v2-run50-trigger.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch-showcase-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/showcase-v2-run50

      - name: Dispatch canonical V2 campaign on main and capture proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: 033bc31f07a776729cbce5526a93c04bfad94649
        run: |
          set -euo pipefail
          gh workflow run showcase-v2-staging-deploy.yml --ref main

          run_id=""
          for attempt in $(seq 1 20); do
            runs=$(gh run list \
              --workflow showcase-v2-staging-deploy.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 10 \
              --json databaseId,headSha,status,conclusion,createdAt,updatedAt,url)
            run_id=$(echo "$runs" | jq -r --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo '{"found":false,"target_sha":"'"$TARGET_SHA"'"}' > .showcase-v2-run62-status.json
            exit 1
          fi

          run=$(echo "$runs" | jq --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha)][0]')
          jq -n --argjson run "$run" '{found:true,run:$run}' > .showcase-v2-run62-status.json

          git config user.name "Komerce Showcase Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .showcase-v2-run62-status.json
          git commit -m "ops(showcase): capture fragility-schema campaign"
          git push origin HEAD:ops/showcase-v2-run50
