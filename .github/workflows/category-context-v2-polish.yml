name: Category Context V2 Polish

on:
  push:
    branches:
      - feat/desktop-category-context-v2

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-category-context-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Patch desktop category context owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          legacy_path = Path('public/boutique/css/boutique-desktop.css')
          canonical_path = Path('public/boutique/css/category-cutout-navigation-desktop.css')
          test_path = Path('public/boutique/tests/unit/category-cutout-navigation.test.js')

          legacy = legacy_path.read_text()
          canonical = canonical_path.read_text()
          tests = test_path.read_text()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          # Legacy wrapper owner: remove the capsule grammar that can win by ID specificity.
          legacy = replace_once(
              legacy,
              """  #k-subcats-wrap .k-subcats-back {\n    display: inline-flex;\n    align-items: center;\n    gap: 5px;\n    padding: 0;\n    border: 1.5px solid var(--border);\n    border-radius: 999px;\n    background: transparent;\n    color: var(--text-muted);\n    font-family: var(--font);\n    font-size: 12.5px;\n    font-weight: 600;\n    cursor: pointer;\n    transition: background .15s, border-color .15s, color .15s, transform .15s;\n    flex-shrink: 0;\n  }""",
              """  #k-subcats-wrap .k-subcats-back {\n    display: inline-flex;\n    align-items: center;\n    gap: 5px;\n    padding: 0;\n    border: 0;\n    border-radius: 0;\n    background: transparent;\n    color: var(--text-muted);\n    font-family: var(--font);\n    font-size: 12px;\n    font-weight: 650;\n    cursor: pointer;\n    transition: color .15s, transform .15s;\n    flex-shrink: 0;\n  }""",
              'legacy back capsule'
          )

          legacy = replace_once(
              legacy,
              """  #k-subcats-wrap .k-subcats-back:hover {\n    background: var(--white);\n    border-color: var(--text-muted);\n    color: var(--text);\n    transform: translateX(-1px);\n  }""",
              """  #k-subcats-wrap .k-subcats-back:hover {\n    background: transparent;\n    color: var(--ocean-dark);\n    transform: translateX(-1px);\n  }""",
              'legacy back hover'
          )

          legacy = replace_once(
              legacy,
              """  html.k-home-premium-v1 #k-subcats-wrap {\n    grid-template-columns: auto minmax(0, 1fr);\n    align-items: center;\n    gap: 10px;\n    max-width: 1680px;\n    margin: 0 auto;\n    border-top: 1px solid var(--border-text-06);\n  }""",
              """  html.k-home-premium-v1 #k-subcats-wrap {\n    grid-template-columns: minmax(0, 1fr);\n    align-items: start;\n    gap: 3px;\n    max-width: 1680px;\n    margin: 0 auto;\n    border-top: 0;\n  }""",
              'premium wrapper grid'
          )

          legacy = replace_once(
              legacy,
              """  html.k-home-premium-v1 #k-subcats-wrap .k-subcats-back {\n    width: 30px;\n    height: 30px;\n    justify-content: center;\n    border-width: 1px;\n  }""",
              """  html.k-home-premium-v1 #k-subcats-wrap .k-subcats-back {\n    width: auto;\n    height: auto;\n    justify-content: flex-start;\n    border-width: 0;\n  }""",
              'premium back geometry'
          )

          legacy = replace_once(
              legacy,
              """  html.k-home-premium-v1 #k-subcats-wrap .k-subcats-back span {\n    display: none;\n  }""",
              """  html.k-home-premium-v1 #k-subcats-wrap .k-subcats-back span {\n    display: inline;\n  }""",
              'premium back label'
          )

          legacy = replace_once(
              legacy,
              """  html.k-home-premium-v1 #k-subcats-wrap .k-subcats-count {\n    border: 1px solid var(--border-text-06);\n  }""",
              """  html.k-home-premium-v1 #k-subcats-wrap .k-subcats-count {\n    border: 0;\n  }""",
              'premium count border'
          )

          # Canonical owner: strengthen hierarchy and let the cutouts carry the navigation.
          canonical = replace_once(canonical, '    gap: 7px;\n    flex-wrap: nowrap;\n    width: auto;', '    gap: 10px;\n    flex-wrap: nowrap;\n    width: auto;', 'context gap')
          canonical = replace_once(canonical, '    padding: 4px 0 0;\n    box-sizing: border-box;', '    padding: 2px 0 0;\n    box-sizing: border-box;', 'context padding')
          canonical = replace_once(canonical, '    color: var(--text-muted);\n    font-family: var(--font);\n    font-size: 11px;\n    font-weight: 600;', '    color: var(--catalog-nav-sage);\n    font-family: var(--font);\n    font-size: 11.5px;\n    font-weight: 650;', 'back typography')
          canonical = replace_once(canonical, '    font-size: 12px;\n    font-weight: 750;\n    line-height: 1.2;', '    font-size: 14px;\n    font-weight: 780;\n    line-height: 1.15;', 'context title')
          canonical = replace_once(canonical, '    font-size: 10px;\n    font-weight: 600;', '    font-size: 10.5px;\n    font-weight: 600;', 'context count')
          canonical = replace_once(canonical, '    gap: 10px;\n    width: auto;\n    max-width: none;\n    margin: 0;\n    padding: 0 0 5px;', '    gap: 14px;\n    width: auto;\n    max-width: none;\n    margin: 0;\n    padding: 1px 0 4px;', 'rail spacing')
          canonical = replace_once(canonical, '    min-width: 66px;\n    min-height: 58px;', '    min-width: 72px;\n    min-height: 60px;', 'subcutout geometry')
          canonical = replace_once(canonical, '    width: 46px;\n    height: 40px;\n    font-size: 22px;', '    width: 48px;\n    height: 42px;\n    font-size: 22px;', 'subcutout icon geometry')
          canonical = replace_once(canonical, '    font-size: 10.5px;\n    font-weight: 620;', '    font-size: 11px;\n    font-weight: 630;', 'subcutout labels')
          canonical = replace_once(canonical, '    width: 18px;\n  }\n}', '    width: 22px;\n  }\n}', 'active underline')

          # Premium class-level overrides must not collapse the breadcrumb back to icon-only.
          canonical = replace_once(
              canonical,
              """  html.k-home-premium-v1 .k-subcutout-back {\n    width: 28px;\n    height: 32px;\n    justify-content: center;\n  }""",
              """  html.k-home-premium-v1 .k-subcutout-back {\n    width: auto;\n    height: auto;\n    justify-content: flex-start;\n  }""",
              'canonical premium back geometry'
          )
          canonical = replace_once(
              canonical,
              """  html.k-home-premium-v1 .k-subcutout-back span {\n    display: none;\n  }""",
              """  html.k-home-premium-v1 .k-subcutout-back span {\n    display: inline;\n  }""",
              'canonical premium back label'
          )
          canonical = replace_once(
              canonical,
              """  html.k-home-premium-v1 .k-subcutout-rail {\n    min-width: 0;\n    gap: 10px;\n  }""",
              """  html.k-home-premium-v1 .k-subcutout-rail {\n    min-width: 0;\n    gap: 14px;\n  }""",
              'canonical premium rail gap'
          )

          # Update the pre-existing geometry guard to the new intentional dimensions.
          tests = replace_once(
              tests,
              "expect(desktop).toMatch(/\\.k-subcutout-icon\\s*\\{[^}]*width:\\s*40px[^}]*height:\\s*35px/s);",
              "expect(desktop).toMatch(/\\.k-subcutout-icon\\s*\\{[^}]*width:\\s*48px[^}]*height:\\s*42px/s);",
              'stale icon geometry assertion'
          )
          tests = replace_once(
              tests,
              "expect(desktop).toMatch(/\\.k-subcutout-label\\s*\\{[^}]*font-size:\\s*10\\.5px/s);",
              "expect(desktop).toMatch(/\\.k-subcutout-label\\s*\\{[^}]*font-size:\\s*11px/s);",
              'stale label geometry assertion'
          )

          # Regression contract: wrapper stays open; canonical skin stays ownership-clean.
          if "const desktopLegacy =" not in tests:
              tests = tests.replace(
                  "const desktop = fs.readFileSync(path.join(ROOT, 'css/category-cutout-navigation-desktop.css'), 'utf8');",
                  "const desktop = fs.readFileSync(path.join(ROOT, 'css/category-cutout-navigation-desktop.css'), 'utf8');\nconst desktopLegacy = fs.readFileSync(path.join(ROOT, 'css/boutique-desktop.css'), 'utf8');"
              )

          marker = "  it('garde les nouveaux skins hors des selectors ownership historiques', () => {"
          if "garde le contexte desktop ouvert" not in tests:
              test_block = """  it('garde le contexte desktop ouvert et les sous-catégories portées par leurs objets', () => {\n    expect(desktopLegacy).toMatch(/html\\.k-home-premium-v1 #k-subcats-wrap\\s*\\{[^}]*grid-template-columns:\\s*minmax\\(0, 1fr\\)[^}]*border-top:\\s*0/s);\n    expect(desktopLegacy).toMatch(/#k-subcats-wrap \\.k-subcats-back\\s*\\{[^}]*border:\\s*0[^}]*border-radius:\\s*0/s);\n    expect(desktopLegacy).toMatch(/#k-subcats-wrap \\.k-subcats-back span\\s*\\{[^}]*display:\\s*inline/s);\n    expect(desktopLegacy).toMatch(/#k-subcats-wrap \\.k-subcats-count\\s*\\{[^}]*border:\\s*0/s);\n    expect(desktop).toMatch(/\\.k-subcutout-title\\s*\\{[^}]*font-size:\\s*14px/s);\n    expect(desktop).toMatch(/html\\.k-home-premium-v1 \\.k-subcutout-back span\\s*\\{[^}]*display:\\s*inline/s);\n    expect(desktop).toMatch(/\\.k-subcutout\\s*\\{[^}]*min-width:\\s*72px[^}]*min-height:\\s*60px/s);\n    expect(desktop).toMatch(/\\.k-subcutout-icon\\s*\\{[^}]*width:\\s*48px[^}]*height:\\s*42px/s);\n    expect(desktop).toMatch(/\\.k-subcutout-label\\s*\\{[^}]*font-size:\\s*11px/s);\n  });\n\n"""
              if marker not in tests:
                  raise SystemExit('missing test insertion anchor')
              tests = tests.replace(marker, test_block + marker, 1)

          legacy_path.write_text(legacy)
          canonical_path.write_text(canonical)
          test_path.write_text(tests)
          PY

      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci

      - name: Rebuild canonical CSS bundle
        working-directory: public/boutique
        run: npm run bundle:css

      - name: Targeted navigation contract
        working-directory: public/boutique
        run: npx jest tests/unit/category-cutout-navigation.test.js --runInBand

      - name: CSS and ownership gates
        working-directory: public/boutique
        run: |
          npm run lint:css
          npm run check:important
          npm run check:css-guard
          npm run check:css-specificity-guard
          npm run check:cache
          npm run audit:ownership
          npm run audit:arch

      - name: Remove temporary workflow
        run: rm -f .github/workflows/category-context-v2-polish.yml

      - name: Commit polished context
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/boutique-desktop.css \
                  public/boutique/css/category-cutout-navigation-desktop.css \
                  public/boutique/tests/unit/category-cutout-navigation.test.js \
                  public/boutique/css/dist \
                  public/boutique/index.html \
                  public/boutique/.cache-buster-state.json \
                  .github/workflows/category-context-v2-polish.yml
          git commit -m "feat(boutique): open desktop category context"
          git push origin HEAD:feat/desktop-category-context-v2
