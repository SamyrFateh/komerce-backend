name: Discovery artifact generation

on:
  push:
    branches:
      - feat/discovery-local-v2

permissions:
  contents: write

jobs:
  generate-and-commit:
    if: ${{ !contains(github.event.head_commit.message, 'chore(generated):') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discovery-local-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate canonical governance artifacts
        run: node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
      - name: Generate canonical CSS bundle artifacts
        run: node public/boutique/scripts/deploy-css.js
      - name: Commit exact generated outputs and remove temporary workflow
        run: |
          rm .github/workflows/discovery-artifact-gen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md
          git add public/boutique/css/dist/base.css public/boutique/css/dist/components.css public/boutique/css/dist/desktop.css
          git add public/boutique/index.html public/boutique/.cache-buster-state.json
          git add -u .github/workflows/discovery-artifact-gen.yml
          git commit -m "chore(generated): refresh discovery governance and CSS artifacts"
          git push origin HEAD:feat/discovery-local-v2
