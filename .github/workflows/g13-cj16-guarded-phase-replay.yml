# G13 staging-only bounded replay of 16 CJ with verified active native supplier SKUs.
# Never certify all G13 from this partial subset.
name: G13 CJ16 guarded Catalogue phase replay (staging)
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-g13-catalogue-seed
  cancel-in-progress: false
jobs:
  phase:
    if: >-
      github.actor == github.repository_owner &&
      (github.event.issue.title == '[staging-op] g13-cj16-dry-run' ||
       github.event.issue.title == '[staging-op] g13-cj16-curate' ||
       github.event.issue.title == '[staging-op] g13-cj16-supplier-link' ||
       github.event.issue.title == '[staging-op] g13-cj16-publish')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GITHUB_ACTIONS: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      PGOPTIONS: '-c default_transaction_read_only=on'
      G13_SCOPE: cj-ready-16
      G13_MODE: ${{ github.event.issue.title == '[staging-op] g13-cj16-dry-run' && 'dry-run' || 'execute' }}
      G13_PHASE: ${{ github.event.issue.title == '[staging-op] g13-cj16-curate' && 'curate' || github.event.issue.title == '[staging-op] g13-cj16-supplier-link' && 'supplier-link' || github.event.issue.title == '[staging-op] g13-cj16-publish' && 'publish' || 'all' }}
      G13_CONFIRMATION: SEED-G13-CATALOGUE
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_MARKET_OPERATOR_EMAIL: ${{ secrets.E2E_MARKET_OPERATOR_EMAIL }}
      E2E_MARKET_OPERATOR_PASSWORD: ${{ secrets.E2E_MARKET_OPERATOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply bounded canonical CJ phase or read-only plan
        run: node scripts/recette/g13-catalogue-seed.js
      - name: Preserve exact per-product phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-cj16-phase-${{ github.run_id }}
          path: test-results/g13-catalogue-seed/report.json
          retention-days: 21
          if-no-files-found: warn
