name: Feature proof final zero

on:
  push:
    branches:
      - fix/feature-proof-final-zero-warnings

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/feature-proof-final-zero-warnings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Attach direct proofs to canonical feature owners
        shell: python
        run: |
          from pathlib import Path

          def insert_after(path, anchor, additions):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              assert anchor in text, f'anchor missing in {path}'
              for addition in additions:
                  assert addition not in text, f'already registered: {addition}'
              block = anchor + ''.join(f"      '{x}',\n" for x in additions)
              p.write_text(text.replace(anchor, block, 1), encoding='utf-8')

          insert_after(
              'features/orders.feature.js',
              "      'tests/unit/order-payment-confirmation.test.js',\n",
              [
                  'tests/unit/order-checkout-service-relay-boundary.test.js',
                  'tests/unit/order-checkout-item-resolution.test.js',
                  'tests/unit/order-checkout-persistence.test.js',
                  'tests/unit/order-post-commit-hooks.test.js',
              ],
          )
          insert_after(
              'features/loyalty.feature.js',
              "      'tests/unit/loyalty-service.test.js',\n",
              ['tests/unit/admin-loyalty-route.test.js'],
          )
          insert_after(
              'features/providers-services.feature.js',
              "      'tests/unit/providers-service.test.js',\n",
              ['tests/unit/providers-inquiry-service.test.js'],
          )
          insert_after(
              'features/shared-cart.feature.js',
              "      'tests/unit/cart-share-service.test.js',\n",
              ['tests/unit/shared-cart-user-cleanup.test.js'],
          )
      - name: Run all seven direct proof suites
        run: >-
          npx jest
          tests/unit/order-checkout-service-relay-boundary.test.js
          tests/unit/order-checkout-item-resolution.test.js
          tests/unit/order-checkout-persistence.test.js
          tests/unit/order-post-commit-hooks.test.js
          tests/unit/admin-loyalty-route.test.js
          tests/unit/providers-inquiry-service.test.js
          tests/unit/shared-cart-user-cleanup.test.js
          --runInBand --no-coverage
      - name: Require zero Feature First warnings repo-wide
        run: |
          node scripts/feature-guard.js --strict | tee /tmp/feature-guard.txt
          grep -q 'Avertissements  : 0' /tmp/feature-guard.txt
          grep -q '✅ Tous les slices sont cohérents.' /tmp/feature-guard.txt
      - name: Commit canonical manifests and remove temporary workflow
        run: |
          rm .github/workflows/feature-proof-final-zero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/orders.feature.js features/loyalty.feature.js features/providers-services.feature.js features/shared-cart.feature.js tests/unit/order-checkout-item-resolution.test.js tests/unit/order-checkout-persistence.test.js tests/unit/order-post-commit-hooks.test.js tests/unit/admin-loyalty-route.test.js tests/unit/shared-cart-user-cleanup.test.js .github/workflows/feature-proof-final-zero.yml
          git commit -m "test(feature-first): close final service proof warnings"
          git push origin HEAD:fix/feature-proof-final-zero-warnings
