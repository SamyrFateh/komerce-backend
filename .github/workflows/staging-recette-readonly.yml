name: Staging recette — vérification de cible et inventaire (lecture seule)

# Aucune écriture. Déclenchement : workflow_dispatch, ou issue ouverte par le propriétaire
# avec le titre exact "[staging-op] recette-inventory".
# La cible est confirmée par empreinte de base (DATABASE_URL vs service déployé), pas par le nom de base.

on:
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: komerce-staging-recette-readonly
  cancel-in-progress: false

jobs:
  readonly:
    name: Cible confirmée + inventaire historique (lecture seule)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       github.event.issue.title == '[staging-op] recette-inventory')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Secret présent
        shell: bash
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo '::error::RAILWAY_DATABASE_URL manque dans les secrets GitHub'
            exit 1
          fi
      - name: Confirmer la cible (empreinte base = service staging déployé)
        run: node scripts/recette/target-guard.js
      - name: Inventaire historique (READ ONLY)
        run: node scripts/recette/inventaire-historique.js
