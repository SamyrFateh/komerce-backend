name: Apply Komerce Architecture Total Coverage Once

on:
  push:
    paths:
      - .github/workflows/apply-komerce-arch-total-coverage-once.yml
      - scripts/apply-komerce-arch-total-coverage.js
      - scripts/generate-komerce-arch-graph.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  total-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply total architecture coverage
        run: node scripts/apply-komerce-arch-total-coverage.js

      - name: Generate architecture graph
        run: node scripts/generate-komerce-arch-graph.js

      - name: Commit total architecture coverage
        run: |
          if git diff --quiet; then
            echo "No architecture coverage changes to commit."
            exit 0
          fi
          git config user.name "komerce-arch-bot"
          git config user.email "komerce-arch-bot@users.noreply.github.com"
          git add bootstrap routes services middleware utils public/boutique/js docs/KOMERCE_ARCH_HEADER_GRAPH.md docs/komerce-arch-header-graph.json
          git commit -m "Apply Komerce architecture total coverage"
          git push
