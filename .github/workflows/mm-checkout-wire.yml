name: Mobile Money checkout wire

on:
  push:
    branches:
      - feat/mobile-money-cm-cg
    paths:
      - '.github/workflows/mm-checkout-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      KOMERCE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_test
      JWT_SECRET: ci-test-jwt-secret-mobile-money-32chars
      QR_SECRET: ci-test-qr-secret-mobile-money-32chars
      ADMIN_PASSWORD: ci-test-admin-password
      STRIPE_SECRET_KEY: sk_test_ci_mobile_money_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_mobile_money_placeholder
      PAYPAL_CLIENT_ID: ci-test-paypal-client
      PAYPAL_CLIENT_SECRET: ci-test-paypal-secret
      PAYPAL_WEBHOOK_ID: ci-test-paypal-webhook
      META_WA_APP_SECRET: ci-test-meta-secret
      AUTHKEY_API_KEY: ci-test-authkey
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-money-cm-cg
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Recover checkout patch from previous helper
        shell: bash
        run: |
          git show HEAD^:.github/workflows/mm-checkout-wire.yml > /tmp/mm-old.yml
          python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/mm-old.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('previous checkout patch marker not found')
          start += len(marker)
          end = text.find('\n          PY', start)
          if end < 0:
              raise SystemExit('previous checkout patch terminator not found')

          raw = text[start:end]
          lines = []
          for line in raw.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/mm-wire.py').write_text('\n'.join(lines) + '\n')
          PY

      - name: Normalize availability handler for recovered patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('routes/payments-mobile-money.js')
          s = p.read_text()
          current = """router.get('/availability', async (req, res, next) => {
            const marketCode = String(req.query.market_code || '').trim().toUpperCase();
            if (!MARKET_CODE_RE.test(marketCode)) {
              return res.status(400).json({ error: 'market_code invalide', code: 'invalid_market_code' });
            }
            try {
              return res.json(await getAvailability(marketCode));
            } catch (err) { return handleError(res, next, err); }
          });"""
          expected = """router.get('/availability', async (req, res, next) => {
            try {
              const marketCode = String(req.query.market_code || '').trim().toUpperCase();
              if (!/^[A-Z]{2}$/.test(marketCode)) {
                return res.status(400).json({ error: 'market_code invalide' });
              }
              res.json(await getAvailability(marketCode));
            } catch (err) { next(err); }
          });"""
          if current in s:
              s = s.replace(current, expected, 1)
          elif expected not in s:
              raise SystemExit('availability pre-normalization anchor not found')
          p.write_text(s)
          PY

      - name: Apply relay-scoped Mobile Money checkout patch
        run: python3 /tmp/mm-wire.py

      - name: Close governance and CSS ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path('routes/payments-mobile-money.js')
          s = route.read_text()
          lines = s.splitlines()
          for i, line in enumerate(lines):
              if line.strip().startswith('* @db-read'):
                  lines[i] = ' * @db-read       orders, markets, mobile_money_transactions, relais'
                  break
          route.write_text('\n'.join(lines) + '\n')

          css = Path('public/boutique/css/mobile-money.css')
          s = css.read_text().replace('background: #fff;', 'background: var(--white);')
          css.write_text(s)

          bundles = Path('public/boutique/scripts/css-bundles.js')
          s = bundles.read_text()
          if "'mobile-money'" not in s:
              anchor = "            'identity', 'paypal', 'wallet', 'komerce', 'notifications', 'checkout-vertical-rail',"
              replacement = "            'identity', 'paypal', 'mobile-money', 'wallet', 'komerce', 'notifications', 'checkout-vertical-rail',"
              if anchor not in s:
                  raise SystemExit('css bundle anchor not found')
              s = s.replace(anchor, replacement, 1)
          bundles.write_text(s)

          root = Path('features/payments.feature.js')
          s = root.read_text()
          if "'js/b-mobile-money.js'" not in s:
              s = s.replace("      'js/b-paypal.js',\n      'css/paypal.css',", "      'js/b-paypal.js',\n      'js/b-mobile-money.js',\n      'css/paypal.css',\n      'css/mobile-money.css',", 1)
          if "'public/boutique/tests/unit/b-mobile-money.test.js'" not in s:
              anchor = "      'tests/unit/mobile-money-reconciliation.test.js',"
              if anchor in s:
                  s = s.replace(anchor, anchor + "\n      'public/boutique/tests/unit/b-mobile-money.test.js',", 1)
          s = s.replace("boutique: 'js/b-paypal.js + css/paypal.css", "boutique: 'js/b-paypal.js + js/b-mobile-money.js + css/paypal.css + css/mobile-money.css")
          root.write_text(s)
          PY

      - name: Rebuild CSS and run focused tests
        run: |
          npm --prefix public/boutique run bundle:css
          npm --prefix public/boutique test -- --runInBand tests/unit/b-mobile-money.test.js tests/unit/b-checkout.test.js
          npm --prefix public/boutique run audit:arch

      - name: Refresh governance projections
        run: |
          npm run contract:generate
          npm run security:360
          node scripts/generate-komerce-arch-graph.js
          node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
          node scripts/gen-feature-360.js
          node scripts/gen-agent-remediation-index.js
          npm --prefix public/boutique run audit:arch:live
          npm run business-graph:ratchet-check

      - name: Commit wired checkout and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/mm-checkout-wire.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(checkout): wire relay-scoped Mobile Money payments'
          git push origin HEAD:feat/mobile-money-cm-cg
