name: Mobile Money checkout wire

on:
  push:
    branches:
      - feat/mobile-money-cm-cg
    paths:
      - '.github/workflows/mm-checkout-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      KOMERCE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_test
      JWT_SECRET: ci-test-jwt-secret-mobile-money-32chars
      QR_SECRET: ci-test-qr-secret-mobile-money-32chars
      ADMIN_PASSWORD: ci-test-admin-password
      STRIPE_SECRET_KEY: sk_test_ci_mobile_money_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_mobile_money_placeholder
      PAYPAL_CLIENT_ID: ci-test-paypal-client
      PAYPAL_CLIENT_SECRET: ci-test-paypal-secret
      PAYPAL_WEBHOOK_ID: ci-test-paypal-webhook
      META_WA_APP_SECRET: ci-test-meta-secret
      AUTHKEY_API_KEY: ci-test-authkey
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-money-cm-cg
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm --prefix public/boutique ci
      - name: Wire authoritative relay-scoped Mobile Money checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          # Backend availability: relay is the server-side market anchor.
          path = 'routes/payments-mobile-money.js'
          p = Path(path)
          s = p.read_text()
          s = s.replace('@db-read       markets, market_payment_providers, mobile_money_transactions, orders',
                        '@db-read       markets, market_payment_providers, mobile_money_transactions, orders, relais')
          old = """router.get('/availability', async (req, res, next) => {
  try {
    const marketCode = String(req.query.market_code || '').trim().toUpperCase();
    if (!/^[A-Z]{2}$/.test(marketCode)) {
      return res.status(400).json({ error: 'market_code invalide' });
    }
    res.json(await getAvailability(marketCode));
  } catch (err) { next(err); }
});"""
          new = """router.get('/availability', async (req, res, next) => {
  try {
    const relayId = String(req.query.relais_id || '').trim();
    let marketCode = String(req.query.market_code || '').trim().toUpperCase();

    if (relayId) {
      if (relayId.length > 80) {
        return res.status(400).json({ error: 'relais_id invalide' });
      }
      const { rows } = await db.query(
        `SELECT m.code AS market_code
           FROM relais r
           JOIN markets m ON m.id = r.market_id
          WHERE r.id = $1
            AND r.is_active = TRUE
            AND m.is_active = TRUE
          LIMIT 1`,
        [relayId]
      );
      if (!rows.length) {
        return res.json({ available: false, reason: 'relay_not_found' });
      }
      marketCode = rows[0].market_code;
    }

    if (!/^[A-Z]{2}$/.test(marketCode)) {
      return res.status(400).json({ error: 'market_code ou relais_id requis' });
    }
    res.json(await getAvailability(marketCode));
  } catch (err) { next(err); }
});"""
          if old not in s:
              raise SystemExit('availability handler anchor not found')
          p.write_text(s.replace(old, new, 1))

          # Shared boutique state: dedicated Mobile Money attempt identity.
          replace_once(
              'public/boutique/js/b-store.js',
              "  checkoutAttemptKey: null,\n  pendingStripeOrderRef: null,",
              "  checkoutAttemptKey: null,\n  pendingStripeOrderRef: null,\n  mobileMoneyAttemptKey: null,\n  pendingMobileMoneyOrderRef: null,"
          )

