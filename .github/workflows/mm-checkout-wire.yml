          node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
          node scripts/gen-feature-360.js
          node scripts/gen-agent-remediation-index.js
          npm --prefix public/boutique run audit:arch:live
      - name: Commit wired checkout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routes/payments-mobile-money.js features/payments.feature.js docs public/boutique
          if git diff --cached --quiet; then
            echo 'No checkout wiring changes.'
          else
            git commit -m 'feat(checkout): wire relay-scoped Mobile Money payments'
            git push origin HEAD:feat/mobile-money-cm-cg
          fi