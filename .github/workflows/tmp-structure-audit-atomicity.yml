name: tmp structure audit atomicity

on:
  push:
    branches:
      - fix/structure-audit-atomicity

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-test-jwt-secret
      ADMIN_PASSWORD: ci-test-admin-password
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-test-authkey
      PAYPAL_CLIENT_ID: ci-test-paypal-client
      PAYPAL_CLIENT_SECRET: ci-test-paypal-secret
      PAYPAL_WEBHOOK_ID: ci-test-paypal-webhook
      META_WA_APP_SECRET: ci-test-meta-secret
      KOMERCE_DISABLE_CRONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structure-audit-atomicity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python3 scripts/tmp-patch-structure-atomicity.py
      - run: npm ci
      - name: Unit regression
        run: npx jest tests/unit/pricing-period-structure.test.js tests/unit/market-delegation-structure-event-service.test.js tests/unit/market-delegation-structure-event-routes.test.js tests/unit/admin-pricing-workspace-structure-events-route.test.js --runInBand
      - name: Load canonical schema and migrations
        run: |
          PGPASSWORD=komerce psql -h localhost -U komerce -d komerce_test -f docs/db/railway-live-schema.sql
          node scripts/ci-migrate.js
      - name: E2E atomic rollback proof
        run: npx jest tests/e2e-api/market-delegation.structure.e2e.test.js --runInBand
      - name: Commit qualified patch
        run: |
          git config user.name 'Komerce CI'
          git config user.email 'ci@komerce.test'
          git add -A
          git diff --cached --check
          git commit -m 'fix(structure): make delegated fact and audit atomic'
          git push origin HEAD:fix/structure-audit-atomicity
