name: tmp-realign-subcategory-v8

on:
  push:
    branches:
      - fix/subcategory-canonical-cutouts-v8
    paths:
      - .github/workflows/tmp-realign-subcategory-v8.yml

permissions:
  contents: write

jobs:
  realign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subcategory-canonical-cutouts-v8
          fetch-depth: 0
      - name: Merge current main without changing product intent
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/subcategory-canonical-cutouts-v8
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tmp-realign-subcategory-v8.yml || true
          git commit -m 'chore(qa): remove temporary realign workflow' || true
          git push origin HEAD:fix/subcategory-canonical-cutouts-v8
