name: Discovery Media Governance Refresh

on:
  push:
    branches: [feat/discovery-local-v2]
    paths: ['.github/workflows/discovery-media-refresh.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Refresh canonical projections
        run: |
          npm run business-graph:gen
          npm run security:360
          npm run feature:360:gen
          npm run agent:remediation:gen
      - name: Commit generated outputs and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/discovery-media-refresh.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(discovery): refresh media governance projections'
            git push origin HEAD:feat/discovery-local-v2
          fi
