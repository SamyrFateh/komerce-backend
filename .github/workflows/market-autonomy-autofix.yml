name: Market autonomy one-shot governance fix

on:
  push:
    branches:
      - feat/market-country-autonomy-20260907
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-autonomy-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-country-autonomy-20260907
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Patch canonical governance sources
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(path, anchor, replacement) {
            const src = fs.readFileSync(path, 'utf8');
            if (src.includes(replacement)) return;
            const hits = src.split(anchor).length - 1;
            if (hits !== 1) throw new Error(`${path}: expected exactly one anchor, got ${hits}: ${anchor}`);
            fs.writeFileSync(path, src.replace(anchor, replacement));
          }

          replaceOnce(
            'features/catalog.feature.js',
            "      'economic-engine (prix produit, valorisation commerciale transport et audit price_history propriétaire)',",
            "      'economic-engine (prix produit, valorisation commerciale transport et audit price_history propriétaire)',\n      'market-autonomy (résolution buyer du prix LOCAL_ACTIVE par marché ; le catalogue reste propriétaire du produit global)',"
          );

          replaceOnce(
            'features/economic-engine.feature.js',
            "      'market (autorité serveur des modèles Pricing pays via markets et operator_market_scopes)',",
            "      'market (autorité serveur des modèles Pricing pays via markets et operator_market_scopes)',\n      'market-autonomy (décision de prix local et activation LOCAL_ACTIVE consommées par la projection économique sans transfert d ownership)',"
          );

          replaceOnce(
            'features/orders.feature.js',
            "      'catalog (lecture produit)',",
            "      'catalog (lecture produit)',\n      'market-autonomy (prix LOCAL_ACTIVE résolu depuis le market_id serveur du relais avant snapshot de commande)',"
          );

          replaceOnce(
            'features/shared-cart.feature.js',
            "      'catalog (lecture seule des produits)',",
            "      'catalog (lecture seule des produits)',\n      'market-autonomy (prix LOCAL_ACTIVE du marché serveur lors de la création de liste ; aucune autorité marché navigateur)',"
          );

          replaceOnce(
            'features/market-autonomy.feature.js',
            "      'migrations/168_market_commercial_price_drafts.sql',",
            "      'migrations/170_market_commercial_price_drafts.sql',"
          );

          const schemaPath = 'docs/SCHEMA.md';
          let schema = fs.readFileSync(schemaPath, 'utf8');
          if (!schema.includes('object: product_market_price_drafts')) {
            const marker = '\n\n### 4.9 Douane';
            if (!schema.includes(marker)) throw new Error('docs/SCHEMA.md: Pricing -> Douane insertion marker missing');
            const pending = `\n\n<!-- schema-pending\nobject: product_market_price_drafts\nkind: table\nmigration: 170\nsection: ### 4.8 Pricing et économie (19 tables)\nrole: Décision commerciale de prix locale par market_id + product_id ; devise issue du marché serveur ; états DRAFT_PENDING_GATE, LOCAL_AUTHORIZED_PENDING_CUTOVER et LOCAL_ACTIVE.\n-->\n\n<!-- schema-pending\nobject: product_market_price_draft_events\nkind: table\nmigration: 170\nsection: ### 4.8 Pricing et économie (19 tables)\nrole: Journal append-only des décisions prix pays SET, RESET, AUTHORIZE et ACTIVATE avec acteur, raison et snapshot économique.\n-->`;
            schema = schema.replace(marker, pending + marker);
            fs.writeFileSync(schemaPath, schema);
          }
          NODE

      - name: Regenerate Security 360 from canonical sources
        run: npm run security:360

      - name: Commit candidate before gates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            features/catalog.feature.js \
            features/economic-engine.feature.js \
            features/orders.feature.js \
            features/shared-cart.feature.js \
            features/market-autonomy.feature.js \
            docs/SCHEMA.md \
            docs/SECURITY_360.json \
            docs/SECURITY_360.md
          git commit -m "fix(governance): declare market autonomy boundaries"

      - name: Run canonical gates on candidate commit
        shell: bash
        run: |
          git fetch origin main
          node scripts/feature-guard.js --strict
          node scripts/check-schema-intent-doc.js --base origin/main --head HEAD
          npm run security:360:check
          node scripts/ci-refresh-governance-projections.js
          node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique
          npm run business-graph:ratchet-check
          git restore --source=HEAD -- \
            docs/komerce-arch-header-graph.json \
            docs/KOMERCE_ARCH_HEADER_GRAPH.md \
            docs/BUSINESS_FEATURE_GRAPH.json \
            docs/BUSINESS_FEATURE_GRAPH.md \
            docs/O6_INVENTORY.md \
            docs/FEATURE_360.json \
            docs/FEATURE_360.md \
            docs/AGENT_REMEDIATION_INDEX.json || true
          git diff --exit-code

      - name: Push validated candidate
        run: git push origin HEAD:feat/market-country-autonomy-20260907
