name: PDC4 Coverage After Tests

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coverage-diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique
        run: npm --prefix public/boutique ci --silent
      - name: Measure PDC-4 owners
        run: |
          cd public/boutique
          npx jest \
            tests/unit/b-modal-product-detail-mobile.test.js \
            tests/unit/b-modal-product-detail-mobile-edge.test.js \
            tests/unit/b-cart-selection.test.js \
            tests/unit/b-modal-cart.test.js \
            --runInBand \
            --coverage \
            --collectCoverageFrom=js/b-modal-product-detail-mobile.js \
            --collectCoverageFrom=js/b-cart-selection.js \
            --collectCoverageFrom=js/b-modal-cart.js \
            --coverageReporters=json-summary \
            --coverageDirectory=.diag-coverage
      - name: Run touched-tests strict
        id: touched
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin feat/modal-selection-model-v1 --depth=1 --quiet
          set +e
          node scripts/touched-tests-gate.js --base origin/feat/modal-selection-model-v1 --strict > /tmp/pdc4-touched.log 2>&1
          code=$?
          tail -n 120 /tmp/pdc4-touched.log > /tmp/pdc4-touched-tail.log
          echo "$code" > /tmp/pdc4-touched-exit-code
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Comment measurement
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'public/boutique/.diag-coverage/coverage-summary.json';
            const summary = fs.existsSync(summaryPath)
              ? JSON.stringify(JSON.parse(fs.readFileSync(summaryPath, 'utf8')), null, 2)
              : 'coverage summary absent';
            const tail = fs.existsSync('/tmp/pdc4-touched-tail.log')
              ? fs.readFileSync('/tmp/pdc4-touched-tail.log', 'utf8')
              : 'touched-tests non exécuté';
            const code = fs.existsSync('/tmp/pdc4-touched-exit-code')
              ? fs.readFileSync('/tmp/pdc4-touched-exit-code', 'utf8').trim()
              : '?';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## PDC-4 post-test coverage\n\n\`\`\`json\n${summary}\n\`\`\`\n\n### touched-tests --strict — exit ${code}\n\n\`\`\`text\n${tail}\n\`\`\``
            });
      - name: Preserve strict failure
        if: steps.touched.outputs.code != '0'
        run: exit 1
