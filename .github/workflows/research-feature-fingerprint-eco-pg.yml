name: R&D ECO Feature Fingerprint PostgreSQL A/B
on:
  push:
    branches:
      - research/feature-fingerprint-eco-pg-20261026
    paths:
      - .github/workflows/research-feature-fingerprint-eco-pg.yml
      - scripts/research/feature-fingerprint-hub-pg.js
      - scripts/research/feature-fingerprint-auto-parcel-pg.js
      - scripts/research/feature-fingerprint-unsold-terminal-pg.js
      - scripts/research/feature-fingerprint-authority-pg.js
      - services/parcel-item-mutation-service.js
      - routes/hub-dashboard.js
      - tests/unit/parcel-item-mutation-service.test.js
      - tests/unit/hub-dashboard-route.test.js
permissions:
  contents: write
concurrency:
  group: research-feature-fingerprint-eco-pg
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_test
      KOMERCE_DISABLE_CRONS: 'true'
      FP_OUTPUT: /tmp/feature-fingerprint-pg-proof.json
      FP_AUTOPARCEL_OUTPUT: /tmp/feature-fingerprint-auto-parcel-pg-proof.json
      FP_UNSOLD_OUTPUT: /tmp/feature-fingerprint-unsold-terminal-pg-proof.json
      FP_AUTHORITY_OUTPUT: /tmp/feature-fingerprint-authority-pg-proof.json
      FP_EXPECT_AUTHORITY_GUARD: 'true'
      FP_EXPECT_FAIL_CLOSED: 'true'
      FP_EXPECT_TERMINAL_GUARD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install only production dependencies
        id: deps
        run: |
          set -o pipefail
          npm ci --include=dev --ignore-scripts --no-audit --no-fund 2>&1 | tee /tmp/fp-install.log
      - name: Build disposable canonical database
        id: bootstrap
        run: |
          set -o pipefail
          PGPASSWORD=komerce psql -h 127.0.0.1 -U komerce -d komerce_test -v ON_ERROR_STOP=1 -f docs/db/railway-live-schema.sql > /tmp/fp-schema-load.log
          node scripts/ci-db-bootstrap.js 2>&1 | tee /tmp/fp-bootstrap.log
      - name: Focused Hub output-count regression (four unit cases)
        id: unit
        run: |
          set -o pipefail
          ./node_modules/.bin/jest --config jest.unit.config.js --runInBand --no-coverage --runTestsByPath tests/unit/hub-create-parcel-assigned-count.test.js 2>&1 | tee /tmp/fp-unit.log
      - name: Prove only 2x(A/B) with outer rollback
        id: replay
        run: |
          set -o pipefail
          node scripts/research/feature-fingerprint-hub-pg.js 2>&1 | tee /tmp/fp-replay.log
      - name: Focused auto-parcel regression
        id: unit_auto_parcel
        run: |
          set -o pipefail
          ./node_modules/.bin/jest --config jest.unit.config.js --runInBand --no-coverage --runTestsByPath tests/unit/auto-parcel.test.js 2>&1 | tee /tmp/fp-unit-auto-parcel.log
      - name: R&D second feature — auto-parcel actual persisted count
        id: auto_parcel
        run: |
          set -o pipefail
          node scripts/research/feature-fingerprint-auto-parcel-pg.js 2>&1 | tee /tmp/fp-auto-parcel.log
      - name: Focused unsold-resolution unit cases
        id: unit_unsold
        run: |
          set -o pipefail
          ./node_modules/.bin/jest --config jest.unit.config.js --runInBand --no-coverage --runTestsByPath tests/unit/unsold.test.js 2>&1 | tee /tmp/fp-unit-unsold.log
      - name: R&D new family — unsold terminal irreversibility
        id: unsold_terminal
        run: |
          set -o pipefail
          node scripts/research/feature-fingerprint-unsold-terminal-pg.js 2>&1 | tee /tmp/fp-unsold-terminal.log
      - name: Focused parcel-item mutation authority unit cases
        id: unit_authority
        run: |
          set -o pipefail
          ./node_modules/.bin/jest --config jest.unit.config.js --runInBand --no-coverage --runTestsByPath tests/unit/parcel-item-mutation-service.test.js 2>&1 | tee /tmp/fp-unit-authority.log
      - name: Focused Hub route non-regression
        id: unit_hub_route
        run: |
          set -o pipefail
          ./node_modules/.bin/jest --config jest.unit.config.js --runInBand --no-coverage --runTestsByPath tests/unit/hub-dashboard-route.test.js 2>&1 | tee /tmp/fp-unit-hub-route.log
      - name: R&D authority plus quantity cross-feature proof
        id: authority
        run: |
          set -o pipefail
          node scripts/research/feature-fingerprint-authority-pg.js 2>&1 | tee /tmp/fp-authority.log
      - name: Report
        if: always()
        run: |
          if [ -f /tmp/feature-fingerprint-pg-proof.json ]; then
            echo '## Feature Fingerprint: PostgreSQL experiment' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
            node -e 'const r=require("/tmp/feature-fingerprint-pg-proof.json");console.log(JSON.stringify({verdict:r.verdict,rollbackVerified:r.rollbackVerified,cases:r.cases.map(c=>({label:c.label,response:c.response,after:c.after,contradiction:c.contradiction})),evidenceHash:r.evidenceHash},null,2))' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-feature-fingerprint-pg-${{ github.run_id }}
          path: |
            /tmp/feature-fingerprint-pg-proof.json
            /tmp/feature-fingerprint-auto-parcel-pg-proof.json
            /tmp/feature-fingerprint-unsold-terminal-pg-proof.json
            /tmp/feature-fingerprint-authority-pg-proof.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Persist bounded proof for review via GitHub connector
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          STAGE_DEPS: ${{ steps.deps.outcome }}
          STAGE_BOOTSTRAP: ${{ steps.bootstrap.outcome }}
          STAGE_REPLAY: ${{ steps.replay.outcome }}
          STAGE_UNIT: ${{ steps.unit.outcome }}
          STAGE_AUTO_PARCEL: ${{ steps.auto_parcel.outcome }}
          STAGE_UNIT_AUTO_PARCEL: ${{ steps.unit_auto_parcel.outcome }}
          STAGE_UNSOLD_TERMINAL: ${{ steps.unsold_terminal.outcome }}
          STAGE_UNIT_UNSOLD: ${{ steps.unit_unsold.outcome }}
        run: |
          if [ -f /tmp/feature-fingerprint-pg-proof.json ]; then
            cp /tmp/feature-fingerprint-pg-proof.json scripts/research/feature-fingerprint-pg-proof.json
          else
            node -e 'const fs=require("fs");const logs={auto_parcel:"/tmp/fp-auto-parcel.log",unit:"/tmp/fp-unit.log",install:"/tmp/fp-install.log",schema:"/tmp/fp-schema-load.log",bootstrap:"/tmp/fp-bootstrap.log",replay:"/tmp/fp-replay.log"};const tails=Object.fromEntries(Object.entries(logs).map(([k,p])=>[k,fs.existsSync(p)?fs.readFileSync(p,"utf8").slice(-2200):"NOT_RUN"]));fs.writeFileSync("scripts/research/feature-fingerprint-pg-proof.json",JSON.stringify({status:"REPLAY_FAILED",job_status:process.env.JOB_RESULT,stages:{deps:process.env.STAGE_DEPS,bootstrap:process.env.STAGE_BOOTSTRAP,unit:process.env.STAGE_UNIT,replay:process.env.STAGE_REPLAY,auto_parcel:process.env.STAGE_AUTO_PARCEL},tails},null,2)+"\\n");'
          fi
          if [ -f /tmp/feature-fingerprint-auto-parcel-pg-proof.json ]; then
            cp /tmp/feature-fingerprint-auto-parcel-pg-proof.json scripts/research/feature-fingerprint-auto-parcel-pg-proof.json
          else
            node -e 'const fs=require("fs");const p="/tmp/fp-auto-parcel.log";fs.writeFileSync("scripts/research/feature-fingerprint-auto-parcel-pg-proof.json",JSON.stringify({status:"REPLAY_FAILED",stage:process.env.STAGE_AUTO_PARCEL||"unknown",tail:fs.existsSync(p)?fs.readFileSync(p,"utf8").slice(-2000):"NOT_RUN"},null,2)+"\\n");'
          fi
          if [ -f /tmp/feature-fingerprint-unsold-terminal-pg-proof.json ]; then
            cp /tmp/feature-fingerprint-unsold-terminal-pg-proof.json scripts/research/feature-fingerprint-unsold-terminal-pg-proof.json
          else
            node -e 'const fs=require("fs");const p="/tmp/fp-unsold-terminal.log";fs.writeFileSync("scripts/research/feature-fingerprint-unsold-terminal-pg-proof.json",JSON.stringify({status:"REPLAY_FAILED",stage:process.env.STAGE_UNSOLD_TERMINAL||"unknown",tail:fs.existsSync(p)?fs.readFileSync(p,"utf8").slice(-2200):"NOT_RUN"},null,2)+"\\n");'
          fi
          if [ -f /tmp/feature-fingerprint-authority-pg-proof.json ]; then
            cp /tmp/feature-fingerprint-authority-pg-proof.json scripts/research/feature-fingerprint-authority-pg-proof.json
          else
            node -e 'const fs=require("fs");const p="/tmp/fp-authority.log";fs.writeFileSync("scripts/research/feature-fingerprint-authority-pg-proof.json",JSON.stringify({status:"REPLAY_FAILED",tail:fs.existsSync(p)?fs.readFileSync(p,"utf8").slice(-2000):"NOT_RUN"},null,2)+"\\n");'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/research/feature-fingerprint-pg-proof.json scripts/research/feature-fingerprint-auto-parcel-pg-proof.json scripts/research/feature-fingerprint-unsold-terminal-pg-proof.json scripts/research/feature-fingerprint-authority-pg-proof.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "research: record bounded PostgreSQL proof [skip ci]"
          git push origin HEAD:research/feature-fingerprint-eco-pg-20261026 || {
            echo 'Concurrent Git update: attempt non-force rebase once; artifacts remain authoritative.'
            git fetch origin research/feature-fingerprint-eco-pg-20261026
            git rebase FETCH_HEAD && git push origin HEAD:research/feature-fingerprint-eco-pg-20261026 || echo 'Skipped proof branch publish; see uploaded workflow artifact.'
          }
