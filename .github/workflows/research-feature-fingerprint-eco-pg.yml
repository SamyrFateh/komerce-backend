name: R&D ECO Feature Fingerprint PostgreSQL A/B
on:
  push:
    branches:
      - research/feature-fingerprint-eco-pg-20261026
    paths:
      - .github/workflows/research-feature-fingerprint-eco-pg.yml
      - scripts/research/feature-fingerprint-hub-pg.js
permissions:
  contents: write
concurrency:
  group: research-feature-fingerprint-eco-pg
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_test
      KOMERCE_DISABLE_CRONS: 'true'
      FP_OUTPUT: /tmp/feature-fingerprint-pg-proof.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install only production dependencies
        id: deps
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund 2>&1 | tee /tmp/fp-install.log
      - name: Build disposable canonical database
        id: bootstrap
        run: |
          PGPASSWORD=komerce psql -h 127.0.0.1 -U komerce -d komerce_test -v ON_ERROR_STOP=1 -f docs/db/railway-live-schema.sql > /tmp/fp-schema-load.log
          node scripts/ci-db-bootstrap.js 2>&1 | tee /tmp/fp-bootstrap.log
      - name: Prove only 2x(A/B) with outer rollback
        id: replay
        run: node scripts/research/feature-fingerprint-hub-pg.js 2>&1 | tee /tmp/fp-replay.log
      - name: Report
        if: always()
        run: |
          if [ -f /tmp/feature-fingerprint-pg-proof.json ]; then
            echo '## Feature Fingerprint: PostgreSQL experiment' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
            node -e 'const r=require("/tmp/feature-fingerprint-pg-proof.json");console.log(JSON.stringify({verdict:r.verdict,rollbackVerified:r.rollbackVerified,cases:r.cases.map(c=>({label:c.label,response:c.response,after:c.after,contradiction:c.contradiction})),evidenceHash:r.evidenceHash},null,2))' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-feature-fingerprint-pg-${{ github.run_id }}
          path: /tmp/feature-fingerprint-pg-proof.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Persist bounded proof for review via GitHub connector
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          STAGE_DEPS: ${{ steps.deps.outcome }}
          STAGE_BOOTSTRAP: ${{ steps.bootstrap.outcome }}
          STAGE_REPLAY: ${{ steps.replay.outcome }}
        run: |
          if [ -f /tmp/feature-fingerprint-pg-proof.json ]; then
            cp /tmp/feature-fingerprint-pg-proof.json scripts/research/feature-fingerprint-pg-proof.json
          else
            node -e 'const fs=require("fs");const logs={install:"/tmp/fp-install.log",schema:"/tmp/fp-schema-load.log",bootstrap:"/tmp/fp-bootstrap.log",replay:"/tmp/fp-replay.log"};const tails=Object.fromEntries(Object.entries(logs).map(([k,p])=>[k,fs.existsSync(p)?fs.readFileSync(p,"utf8").slice(-2200):"NOT_RUN"]));fs.writeFileSync("scripts/research/feature-fingerprint-pg-proof.json",JSON.stringify({status:"REPLAY_FAILED",job_status:process.env.JOB_RESULT,stages:{deps:process.env.STAGE_DEPS,bootstrap:process.env.STAGE_BOOTSTRAP,replay:process.env.STAGE_REPLAY},tails},null,2)+"\\n");'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/research/feature-fingerprint-pg-proof.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "research: record bounded PostgreSQL proof [skip ci]"
          git push origin HEAD:research/feature-fingerprint-eco-pg-20261026
