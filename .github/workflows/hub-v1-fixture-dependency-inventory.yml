name: Hub V1 — read-only fixture FK ownership inventory

on:
  workflow_dispatch:
    inputs:
      run8:
        description: '8 caractères alphanumériques de la fixture E2E-HUB-V1'
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: hub-v1-fixture-fk-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Exact fixture ownership and immutable evidence inventory (NO DELETE)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[staging-op] hub-v1-fixture-inventory-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      HUB_V1_E2E_RUN8: ${{ inputs.run8 }}
      INVENTORY_REQUEST_TITLE: ${{ github.event.issue.title }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Pin actual staging deploy SHA; refuse application drift
        run: node scripts/recette/resolve-staging-deploy-pin.js
      - run: npm ci
      - name: Validate exact RUN8 and staging secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'issues' ]]; then
            if [[ ! "$INVENTORY_REQUEST_TITLE" =~ ^\[staging-op\]\ hub-v1-fixture-inventory-([A-F0-9]{8})$ ]]; then
              echo 'INVALID_OWNER_TRIGGER_TITLE'; exit 2
            fi
            echo "HUB_V1_E2E_RUN8=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            [[ "$HUB_V1_E2E_RUN8" =~ ^[A-Z0-9]{8}$ ]]
          fi
          test -n "$DATABASE_URL"
      - name: Snapshot all E2E-HUB-V1 owned roots, FK and immutable triggers (READ ONLY)
        shell: bash
        run: node scripts/recette/hub-v1-fixture-dependency-inventory.js "$HUB_V1_E2E_RUN8"
      - name: Publish safety limit
        if: always()
        shell: bash
        run: |
          {
            echo '## Hub V1 — inventaire sans suppression'
            echo ''
            echo '- Uniquement RUN8 exact, scope/acheteur fictif vérifiés.'
            echo '- Transactions SQL READ ONLY ; aucun DELETE, UPDATE ou INSERT.'
            echo '- Photographie PG REPEATABLE READ READ ONLY : racines indépendantes, FK, triggers immuables, SHA256 du manifeste.'
            echo '- Aucun DELETE autorisé par cet inventaire ; les preuves append-only sont retenues.'
            echo '- Aucune autorisation d’apply staging n’est délivrée.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-v1-fk-inventory-${{ github.run_id }}
          path: test-results/hub-v1-cert/dependency-inventory-*.json
          if-no-files-found: warn
          retention-days: 14
