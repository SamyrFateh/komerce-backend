name: Staging SAV browser — fixture inventory read only
on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: komerce-staging-sav-browser-census
  cancel-in-progress: false

jobs:
  census:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] sav-browser-fixture-census'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      SAV_CENSUS_CONFIRMATION: SAV-READ-ONLY
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      E2E_AGENT_RELAIS_EMAIL: ${{ secrets.E2E_AGENT_RELAIS_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Confirm deployed SHA
        run: node scripts/recette/resolve-staging-deploy-pin.js
      - name: Guard staging target fingerprint
        run: node scripts/recette/target-guard.js
      - name: Count eligible existing E2E cases (READ ONLY)
        run: node scripts/recette/staging-sav-browser-fixture-census.js
      - name: Archive sanitized readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-sav-browser-census-${{ github.run_id }}
          path: test-results/staging-sav-browser/readonly-census.json
          if-no-files-found: warn
          retention-days: 30
