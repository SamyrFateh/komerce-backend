name: tmp mobile Mode optical balance final

on:
  pull_request:
    branches:
      - tmp/mobile-mode-optical-balance-final-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/mobile-mode-optical-balance-final-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Reduce Mode optical weight
        shell: python
        run: |
          from pathlib import Path

          css = Path('public/boutique/css/category-cutout-navigation.css')
          text = css.read_text(encoding='utf-8')
          replacements = {
              'transform: translateY(1px) scale(1.14);': 'transform: translateY(2px) scale(0.92);',
              'transform: translateY(0) scale(1.18);': 'transform: translateY(1px) scale(0.96);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one CSS occurrence for {old!r}, found {text.count(old)}')
              text = text.replace(old, new)
          css.write_text(text, encoding='utf-8')

          test = Path('public/boutique/tests/unit/category-cutout-navigation.test.js')
          t = test.read_text(encoding='utf-8')
          test_replacements = {
              'scale\\(1\\.14\\)': 'scale\\(0\\.92\\)',
              'scale\\(1\\.18\\)': 'scale\\(0\\.96\\)',
          }
          for old, new in test_replacements.items():
              if t.count(old) != 1:
                  raise SystemExit(f'expected one test occurrence for {old!r}, found {t.count(old)}')
              t = t.replace(old, new)
          test.write_text(t, encoding='utf-8')
      - name: Regenerate Boutique CSS bundles
        run: node public/boutique/scripts/deploy-css.js
      - name: Verify focused contract
        run: npm --prefix public/boutique test -- --runInBand tests/unit/category-cutout-navigation.test.js
      - name: Commit generated closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/category-cutout-navigation.css \
                  public/boutique/tests/unit/category-cutout-navigation.test.js \
                  public/boutique/css/dist/components.css \
                  public/boutique/.cache-buster-state.json \
                  public/boutique/index.html
          git diff --cached --quiet && exit 0
          git commit -m "UI: finalize Mode mobile optical balance"
          git push origin HEAD:tmp/mobile-mode-optical-balance-final-build
