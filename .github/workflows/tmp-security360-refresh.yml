name: Temporary Security360 refresh

on:
  push:
    branches:
      - fix/admin-unified-entry

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-unified-entry
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regenerate Security 360 canonical proof
        run: npm run security:360
      - name: Commit generated proof if changed
        shell: bash
        run: |
          if git diff --quiet -- docs/SECURITY_360.json docs/SECURITY_360.md; then
            echo "Security 360 already fresh"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SECURITY_360.json docs/SECURITY_360.md
          git commit -m "docs(security): refresh Security 360 proof"
          git push origin HEAD:fix/admin-unified-entry
