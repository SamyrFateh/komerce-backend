name: Canonical Client Index 4I

on:
  push:
    branches:
      - ci/canonical-client-index-4i

permissions:
  contents: write

jobs:
  build-prove-push:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ci-dummy:ci-dummy@localhost:5432/ci-dummy
      ADMIN_PASSWORD: ci-dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-dummy
      JWT_SECRET: ci-dummy
      SESSION_SECRET: ci-dummy
      INTERNAL_API_KEY: ci-dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      JWT_EXPIRES: 7d
      APP_URL: http://localhost
      PUBLIC_URL: http://localhost
      PUBLIC_BASE_URL: http://localhost
      ADMIN_RESET_KEY: ci-dummy
      INVOICE_PUBLIC_LINK_SECRET: ci-dummy
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_TOKEN: ci-dummy
      META_WA_PHONE_NUMBER_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preserve implementation scripts
        run: |
          cp scripts/ci-client-index-4i.py /tmp/ci-client-index-4i.py
          cp scripts/ci-client-index-4i-fix.py /tmp/ci-client-index-4i-fix.py

      - name: Build product slice from current main
        run: |
          git config user.name "SamyrFateh"
          git config user.email "fatehsamyr@gmail.com"
          git fetch origin main
          git checkout -B feat/canonical-client-index-4i origin/main
          python3 /tmp/ci-client-index-4i.py
          python3 /tmp/ci-client-index-4i-fix.py
          git status --short

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Targeted client index and boundary tests
        run: |
          npx jest \
            tests/unit/client-index-service.test.js \
            tests/unit/admin-client-index-route.test.js \
            tests/unit/canonical-client-index.test.js \
            tests/unit/admin-client-360-route.test.js \
            tests/unit/canonical-client-360-app.test.js \
            tests/unit/canonical-dashboard-boundary.test.js \
            tests/unit/bootstrap-html-routes.test.js \
            tests/unit/providers-service.test.js \
            --runInBand

      - name: Quality and card-first pre-generation gates
        run: |
          npm run quality:gate
          npm run feature:registry
          npm run gate:schema
          npm run gate:docs-lint
          node scripts/feature-classification-check.js --strict

      - name: Regenerate canonical derived artifacts
        run: |
          node scripts/gen-route-registry.js
          npm run contract:generate
          npm run dashboards:360:save
          npm run arch:gen
          npm run business-graph:gen
          npm run gate:findings:gen
          npm run feature:360:gen
          npm run security:360:save

      - name: Stage product slice for touched-file gates
        run: |
          git add \
            bootstrap/api-routes.js \
            bootstrap/html-routes.js \
            features/auth-passkey.feature.js \
            features/dashboard.feature.js \
            features/providers-services.feature.js \
            routes/admin-client-index.js \
            services/client-index.js \
            public/dashboards/canonical/index.html \
            public/dashboards/canonical/js/app.js \
            public/dashboards/canonical/js/client-index.js \
            docs/contract/CLIENT_INDEX_4I.md \
            tests/unit/client-index-service.test.js \
            tests/unit/admin-client-index-route.test.js \
            tests/unit/canonical-client-index.test.js \
            tests/unit/canonical-client-360-app.test.js \
            docs

      - name: Full scoped governance proof
        run: |
          npm run gate:touched-files
          npm run gate:touched-tests
          npm run gate:feature-audit
          npm run dashboards:360:check
          npm run business-graph:check
          npm run business-graph:ratchet-check
          npm run business-graph:disposition-check
          npm run feature:360:check
          npm run security:360:check
          node scripts/arch-db-check.js
          node -e "const g=require('./docs/GATE_FINDINGS.json'); if((g.findings||[]).length) { console.error(JSON.stringify(g.findings,null,2)); process.exit(1); }"

      - name: Ensure no helper files enter product branch
        run: |
          test ! -e scripts/ci-client-index-4i.py
          test ! -e scripts/ci-client-index-4i-fix.py
          test ! -e .github/workflows/canonical-client-index-4i.yml

      - name: Commit and push product branch
        run: |
          git add \
            bootstrap/api-routes.js \
            bootstrap/html-routes.js \
            features/auth-passkey.feature.js \
            features/dashboard.feature.js \
            features/providers-services.feature.js \
            routes/admin-client-index.js \
            services/client-index.js \
            public/dashboards/canonical/index.html \
            public/dashboards/canonical/js/app.js \
            public/dashboards/canonical/js/client-index.js \
            docs/contract/CLIENT_INDEX_4I.md \
            tests/unit/client-index-service.test.js \
            tests/unit/admin-client-index-route.test.js \
            tests/unit/canonical-client-index.test.js \
            tests/unit/canonical-client-360-app.test.js \
            docs
          git commit -m "feat(canonical): add scoped client index"
          git push --force-with-lease origin HEAD:refs/heads/feat/canonical-client-index-4i
