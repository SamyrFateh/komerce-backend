name: HUB-002 security projection refresh

on:
  pull_request:
    branches: [main]
    paths:
      - 'routes/hub.js'
      - 'routes/scans.js'
      - '.github/workflows/hub-002-security-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regenerate Security 360
        run: npm run security:360
      - name: Commit generated projection when changed
        run: |
          if git diff --quiet -- docs/SECURITY_360.json docs/SECURITY_360.md; then
            echo 'Security projection already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SECURITY_360.json docs/SECURITY_360.md
          git commit -m 'docs(security): refresh Security 360 for HUB-002'
          git push origin HEAD:${{ github.head_ref }}
