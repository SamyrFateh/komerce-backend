name: Debt Zero imports audit
on:
  push:
    branches: [ci/debt-zero-imports-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/debt-zero-imports-audit
      - run: node public/boutique/scripts/check-js-imports.js
      - run: node scripts/debt-zero-imports-usage-audit.js
