# ============================================================
# KOMERCE — GitHub Action : Métriques auto cartographie
# v2.0 — 06/04/2026 — paths étendus à TOUT le code
# ============================================================

name: '🗺️ Auto-Cartography'

on:
  push:
    branches: [main]
    paths:
      - 'routes/**'
      - 'middleware/**'
      - 'utils/**'
      - 'validators/**'
      - 'db/**'
      - 'scripts/**'
      - 'public/**'
      - 'dashboard-app/**'
      - 'server.js'
      - 'db.js'
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: auto-cartography
  cancel-in-progress: true

jobs:
  regenerate-cartography:
    name: '🗺️ Mettre à jour les métriques cartographie'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: '🟢 Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: '📊 Exécuter l''analyse complète'
        run: |
          node scripts/impact-check.js --all --json > /tmp/full-analysis.json 2>/dev/null || true

      - name: '🗺️ Mettre à jour les métriques CARTOGRAPHY_360.md'
        run: |
          cat > /tmp/update-carto.js << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          
          let analysis = {};
          try {
            const raw = fs.readFileSync('/tmp/full-analysis.json', 'utf-8');
            const jsonMatch = raw.match(/\{[\s\S]*"score"[\s\S]*\}/);
            if (jsonMatch) analysis = JSON.parse(jsonMatch[0]);
          } catch { console.log('⚠️ Pas d analyse disponible'); }
          
          const cartoPath = 'docs/CARTOGRAPHY_360.md';
          let existingCarto = '';
          try { existingCarto = fs.readFileSync(cartoPath, 'utf-8'); } catch {}
          
          const countFiles = (dir) => {
            try {
              return fs.readdirSync(dir, { recursive: true })
                .filter(f => !fs.statSync(path.join(dir, f)).isDirectory()).length;
            } catch { return 0; }
          };
          
          const now = new Date().toISOString().replace('T', ' ').substring(0, 19);
          
          let updateSection = `\n\n---\n\n## 🤖 Dernière analyse automatique\n\n`;
          updateSection += `> Mise à jour : ${now} UTC\n\n`;
          updateSection += `| Métrique | Valeur |\n|----------|--------|\n`;
          updateSection += `| Routes | ${countFiles('routes')} fichiers |\n`;
          updateSection += `| Middlewares | ${countFiles('middleware')} fichiers |\n`;
          updateSection += `| Utilitaires | ${countFiles('utils')} fichiers |\n`;
          updateSection += `| Frontend (public/) | ${countFiles('public')} fichiers |\n`;
          updateSection += `| Dashboard App | ${countFiles('dashboard-app')} fichiers |\n`;
          
          if (analysis.score !== undefined) {
            updateSection += `| Score de risque | ${analysis.score}/100 |\n`;
          }
          
          updateSection += `\n*Métriques auto-générées — workflow auto-cartography v2.0*\n`;
          updateSection += `*⚠️ Complète la carto mais ne remplace pas la mise à jour DELTA manuelle.*\n`;
          
          const marker = '## 🤖 Dernière analyse automatique';
          if (existingCarto.includes(marker)) {
            const idx = existingCarto.indexOf('---\n\n' + marker);
            if (idx > 0) existingCarto = existingCarto.substring(0, idx).trimEnd();
            else {
              const idx2 = existingCarto.indexOf(marker);
              existingCarto = existingCarto.substring(0, idx2).trimEnd();
            }
          }
          
          fs.writeFileSync(cartoPath, existingCarto + updateSection);
          console.log('✅ Métriques cartographie mises à jour');
          SCRIPT
          
          node /tmp/update-carto.js

      - name: '📝 Commit et push'
        run: |
          git config user.name "Komerce Bot"
          git config user.email "bot@komerce.km"
          
          git add docs/CARTOGRAPHY_360.md
          
          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement"
          else
            git commit -m "🗺️ auto: métriques cartographie [skip ci]"
            git push
            echo "✅ Métriques mises à jour"
          fi

      - name: '📊 Résumé'
        run: |
          echo "🗺️ Mise à jour métriques terminée"
          echo "   Commit : ${{ github.event.head_commit.message }}"
