# ============================================================
# KOMERCE — GitHub Action : Régénération auto de la cartographie
# Se déclenche après chaque merge sur main
# ============================================================

name: '🗺️ Auto-Cartography'

on:
  push:
    branches: [main]
    paths:
      - 'routes/**'
      - 'middleware/**'
      - 'utils/**'
      - 'db/**'
      - 'server.js'
      - 'db.js'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: auto-cartography
  cancel-in-progress: true

jobs:
  regenerate-cartography:
    name: '🗺️ Régénérer la cartographie'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: '🟢 Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: '📊 Exécuter l''analyse complète'
        run: |
          # Analyse complète pour la cartographie
          node scripts/impact-check.js --all --json > /tmp/full-analysis.json 2>/dev/null || true

      - name: '🗺️ Régénérer CARTOGRAPHY_360.md'
        run: |
          cat > /tmp/update-carto.js << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          
          // Charger l'analyse
          let analysis = {};
          try {
            const raw = fs.readFileSync('/tmp/full-analysis.json', 'utf-8');
            const jsonMatch = raw.match(/\{[\s\S]*"score"[\s\S]*\}/);
            if (jsonMatch) analysis = JSON.parse(jsonMatch[0]);
          } catch { console.log('⚠️ Pas d\'analyse disponible, régénération basique'); }
          
          // Charger la config
          const config = JSON.parse(fs.readFileSync('scripts/impact-config.json', 'utf-8'));
          
          // Lire la carto existante
          const cartoPath = 'docs/CARTOGRAPHY_360.md';
          let existingCarto = '';
          try { existingCarto = fs.readFileSync(cartoPath, 'utf-8'); } catch {}
          
          // Ajouter la section "Dernière analyse d'impact" à la fin
          const now = new Date().toISOString().replace('T', ' ').substring(0, 19);
          const routeCount = Object.keys(config.architecture.routes).length;
          const tableCount = Object.values(config.tables).flat().length;
          const serviceCount = Object.keys(config.externalServices).length;
          
          let updateSection = `\n\n---\n\n## 🤖 Dernière analyse automatique\n\n`;
          updateSection += `> Mise à jour : ${now} UTC\n\n`;
          updateSection += `| Métrique | Valeur |\n|----------|--------|\n`;
          updateSection += `| Routes analysées | ${routeCount} |\n`;
          updateSection += `| Tables cartographiées | ${tableCount} |\n`;
          updateSection += `| Services externes | ${serviceCount} |\n`;
          
          if (analysis.score !== undefined) {
            updateSection += `| Score de risque global | ${analysis.score}/100 |\n`;
            updateSection += `| Alertes sécurité | ${analysis.summary?.securityIssues || 0} |\n`;
          }
          
          updateSection += `\n*Régénéré automatiquement par le coffre-fort Komerce v1.0*\n`;
          
          // Remplacer la section existante ou l'ajouter
          const marker = '## 🤖 Dernière analyse automatique';
          if (existingCarto.includes(marker)) {
            const idx = existingCarto.indexOf('---\n\n' + marker);
            if (idx > 0) {
              existingCarto = existingCarto.substring(0, idx).trimEnd();
            } else {
              const idx2 = existingCarto.indexOf(marker);
              existingCarto = existingCarto.substring(0, idx2).trimEnd();
            }
          }
          
          fs.writeFileSync(cartoPath, existingCarto + updateSection);
          console.log('✅ CARTOGRAPHY_360.md mis à jour');
          SCRIPT
          
          node /tmp/update-carto.js

      - name: '📝 Commit et push'
        run: |
          git config user.name "Komerce Bot"
          git config user.email "bot@komerce.km"
          
          git add docs/CARTOGRAPHY_360.md
          
          # Ne committer que s'il y a des changements
          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement dans la cartographie"
          else
            git commit -m "🗺️ auto: régénération cartographie [skip ci]"
            git push
            echo "✅ Cartographie mise à jour et pushée"
          fi

      - name: '📊 Résumé'
        run: |
          echo "🗺️ Régénération de la cartographie terminée"
          echo "   Déclenchée par : ${{ github.event.head_commit.message }}"
          echo "   Auteur : ${{ github.event.head_commit.author.name }}"
