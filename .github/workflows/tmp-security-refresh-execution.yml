name: tmp refresh Security360 execution bridge

on:
  push:
    branches:
      - feat/market-execution-capability-bridge-v2
    paths:
      - .github/workflows/tmp-security-refresh-execution.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-execution-capability-bridge-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regenerate Security360 projection without changing baseline
        run: npm run security:360
      - name: Commit canonical projection
        run: |
          git config user.name "Komerce CI"
          git config user.email "ci@komerce.test"
          git add docs/SECURITY_360.json docs/SECURITY_360.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(security): refresh execution bridge projection"
          git push origin HEAD:feat/market-execution-capability-bridge-v2
