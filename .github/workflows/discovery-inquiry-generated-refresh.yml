name: Discovery inquiry generated refresh

on:
  push:
    branches:
      - feat/discovery-local-v2

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discovery-local-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install backend dependencies
        run: npm ci
      - name: Remove temporary harness before canonical scans
        run: rm .github/workflows/discovery-inquiry-generated-refresh.yml
      - name: Refresh canonical generated artifacts
        run: |
          npm run business-graph:gen
          npm run security:360
          npm run feature:360:gen
          npm run agent:remediation:gen
      - name: Commit exact generated outputs and harness removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git add -u .github/workflows/discovery-inquiry-generated-refresh.yml
          git commit -m "chore(generated): refresh inquiry governance artifacts"
          git push origin HEAD:feat/discovery-local-v2
