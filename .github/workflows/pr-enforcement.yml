name: PR enforcement

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-enforcement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect PR scope
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      provider_proof_only: ${{ steps.scope.outputs.provider_proof_only }}
      cj_pilot_proof_only: ${{ steps.scope.outputs.cj_pilot_proof_only }}
      backend_files: ${{ steps.scope.outputs.backend_files }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      dashboard_files: ${{ steps.scope.outputs.dashboard_files }}
      golden: ${{ steps.scope.outputs.golden }}
      golden_files: ${{ steps.scope.outputs.golden_files }}
      migrations: ${{ steps.scope.outputs.migrations }}
      migration_files: ${{ steps.scope.outputs.migration_files }}
      schema_dump: ${{ steps.scope.outputs.schema_dump }}
      db_rebuild_required: ${{ steps.scope.outputs.db_rebuild_required }}
      integration_required: ${{ steps.scope.outputs.integration_required }}
      e2e_api_required: ${{ steps.scope.outputs.e2e_api_required }}
      boutique: ${{ steps.scope.outputs.boutique }}
      boutique_files: ${{ steps.scope.outputs.boutique_files }}
      boutique_test_files: ${{ steps.scope.outputs.boutique_test_files }}
      boutique_css: ${{ steps.scope.outputs.boutique_css }}
      boutique_js: ${{ steps.scope.outputs.boutique_js }}
      boutique_html: ${{ steps.scope.outputs.boutique_html }}
      boutique_unit: ${{ steps.scope.outputs.boutique_unit }}
      boutique_package: ${{ steps.scope.outputs.boutique_package }}
      governance: ${{ steps.scope.outputs.governance }}
      governance_files: ${{ steps.scope.outputs.governance_files }}
      unit_repair_only: ${{ steps.repair.outputs.unit_repair_only }}
      unit_repair_files: ${{ steps.repair.outputs.unit_repair_files }}
      unit_repair_reason: ${{ steps.repair.outputs.unit_repair_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      # CI FAST-4 : le classifier a besoin des deux arbres, pas de tout l'historique.
      - name: Fetch PR base commit only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - id: scope
        name: Classify changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-enforcement-scope.js --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - id: repair
        name: Detect safe targeted unit-test repair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GOLDEN_SCOPE: ${{ steps.scope.outputs.golden }}
        shell: bash
        run: |
          set -u
          echo "unit_repair_only=false" >> "$GITHUB_OUTPUT"
          echo "unit_repair_files=" >> "$GITHUB_OUTPUT"
          echo "unit_repair_reason=normal-full-run" >> "$GITHUB_OUTPUT"

          RUNS_URL="https://api.github.com/repos/$REPOSITORY/actions/workflows/pr-enforcement.yml/runs?event=pull_request&status=completed&per_page=50"
          if ! curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "$RUNS_URL" > /tmp/previous-runs.json; then
            echo "Previous workflow metadata unavailable; full CI retained."
            exit 0
          fi

          PREVIOUS_META="$(node -e '
            const fs=require("fs");
            const data=JSON.parse(fs.readFileSync("/tmp/previous-runs.json","utf8"));
            const pr=String(process.env.PR_NUMBER||"");
            const head=String(process.env.HEAD_SHA||"");
            const run=(data.workflow_runs||[]).find(r =>
              r.head_sha !== head
              && (r.pull_requests||[]).some(p => String(p.number)===pr)
            );
            process.stdout.write(run ? String(run.id)+" "+String(run.head_sha||"") : "");
          ')"
          PREVIOUS_RUN_ID="${PREVIOUS_META%% *}"
          PREVIOUS_HEAD="${PREVIOUS_META#* }"
          if [ -z "$PREVIOUS_RUN_ID" ] || [ -z "$PREVIOUS_HEAD" ] || [ "$PREVIOUS_HEAD" = "$PREVIOUS_META" ]; then
            echo "No completed prior PR-enforcement run found; full CI retained."
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$PREVIOUS_HEAD"; then
            echo "Previous PR head unavailable; full CI retained."
            exit 0
          fi

          if ! curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPOSITORY/actions/runs/$PREVIOUS_RUN_ID/jobs?per_page=100"             > /tmp/previous-jobs.json; then
            echo "Previous job metadata unavailable; full CI retained."
            exit 0
          fi

          BACKEND_JOB_ID="$(node -e '
            const fs=require("fs");
            const data=JSON.parse(fs.readFileSync("/tmp/previous-jobs.json","utf8"));
            const job=(data.jobs||[]).find(j => j.name==="Backend gates" && j.conclusion==="failure");
            process.stdout.write(job ? String(job.id) : "");
          ')"
          if [ -z "$BACKEND_JOB_ID" ]; then
            echo "Previous backend failure not found; full CI retained."
            exit 0
          fi

          if ! curl -fsSL -L             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPOSITORY/actions/jobs/$BACKEND_JOB_ID/logs"             > /tmp/previous-backend.log; then
            echo "Previous backend log unavailable; full CI retained."
            exit 0
          fi

          node scripts/ci-unit-repair-scope.js             --base "$PREVIOUS_HEAD"             --head "$HEAD_SHA"             --jobs-json /tmp/previous-jobs.json             --failed-log /tmp/previous-backend.log             --golden "$GOLDEN_SCOPE"             --github-output "$GITHUB_OUTPUT"
      - name: CJ pilot report syntax — targeted proof-only check
        if: steps.repair.outputs.unit_repair_only != 'true' && steps.scope.outputs.cj_pilot_proof_only == 'true'
        run: node --check scripts/cj-three-real-staging-pilot.js
      - name: Feature card schema — zero debt
        if: steps.repair.outputs.unit_repair_only != 'true'
        run: node scripts/feature-schema-check.js --strict --full
      - name: Docs history — zero debt
        if: steps.repair.outputs.unit_repair_only != 'true'
        run: node scripts/docs-history-lint.js --strict --full
      - name: Impact suppression hygiene
        if: steps.repair.outputs.unit_repair_only != 'true'
        run: node scripts/impact-suppression-check.js
      # Le registre commité est une projection, jamais une vérité autonome.
      # On le régénère depuis les montages Express du HEAD avant le gate afin
      # qu'une projection stale ne produise ni faux vert ni faux rouge.
      - name: Hydrate route registry for feature audit
        if: steps.repair.outputs.unit_repair_only != 'true'
        run: node scripts/gen-route-registry.js
      - name: Feature audit — strict veto
        if: steps.repair.outputs.unit_repair_only != 'true'
        run: node scripts/feature-audit.js --strict
      - name: Restore ephemeral route registry
        if: always() && steps.repair.outputs.unit_repair_only != 'true'
        run: git restore --source=HEAD -- docs/_generated/route-registry.json

  backend:
    name: Backend gates
    needs: changes
    # CI FAST-2 : le Golden partage ce runner avec Backend. Un changement du
    # harnais Golden seul ouvre ce job sans exécuter les gates backend inutiles.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.golden == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Deepen git history (tests/unit/allegro-golden-preflight-contract.test.js — G-01/G-02 — résout le vrai commit de baseline de docs/db/railway-live-schema.sql via `git log -1 -- <dump>` ; sous shallow, retombe sur HEAD, faux positif de baseline, incident #1594)
        if: needs.changes.outputs.unit_repair_only != 'true'
        run: git fetch --unshallow origin || true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Npm audit gate
        if: (needs.changes.outputs.backend == 'true') && needs.changes.outputs.unit_repair_only != 'true'
        run: npm run audit:gate

      - name: Quality gate
        if: (needs.changes.outputs.backend == 'true') && needs.changes.outputs.unit_repair_only != 'true'
        run: node scripts/code-quality-gate.js --strict
      - name: Feature guard
        if: (needs.changes.outputs.backend == 'true') && needs.changes.outputs.unit_repair_only != 'true'
        run: node scripts/feature-guard.js --strict
      - name: Canonical catalog + sourcing certification invariants
        if: (needs.changes.outputs.backend == 'true') && needs.changes.outputs.unit_repair_only != 'true'
        run: >-
          npx jest
          tests/unit/certification-accounting.test.js
          tests/unit/catalog-certification.test.js
          tests/unit/sourcing-certification.test.js
          --runInBand --silent
      - name: Contract consumer check
        if: (needs.changes.outputs.backend == 'true') && needs.changes.outputs.unit_repair_only != 'true'
        run: node scripts/contract-check.js
      - name: Security 360 freshness and ratchet
        if: (needs.changes.outputs.backend == 'true') && needs.changes.outputs.unit_repair_only != 'true'
        run: npm run security:360:check
      - name: Related unit tests
        if: (needs.changes.outputs.backend == 'true') && needs.changes.outputs.unit_repair_only != 'true'
        env:
          BACKEND_FILES: ${{ needs.changes.outputs.backend_files }}
        run: node scripts/run-staged-related-tests.js --files "$BACKEND_FILES"
      - name: Unit test coverage threshold
        if: (needs.changes.outputs.backend == 'true') && needs.changes.outputs.unit_repair_only != 'true'
        run: npm run test:unit:coverage

      - name: Target only the repaired failing unit tests
        if: needs.changes.outputs.unit_repair_only == 'true'
        env:
          UNIT_REPAIR_FILES: ${{ needs.changes.outputs.unit_repair_files }}
        shell: bash
        run: |
          test -n "$UNIT_REPAIR_FILES"
          TEST_FILES="${UNIT_REPAIR_FILES//,/ }"
          echo "Targeted repair proof: $TEST_FILES"
          npx jest $TEST_FILES --runInBand --silent

      - name: Golden CDR — présence du snapshot réel
        if: needs.changes.outputs.golden == 'true'
        run: |
          if [ ! -f tools/golden-cdr/golden/cdr.golden.json ]; then
            echo "::error::Golden absent (tools/golden-cdr/golden/cdr.golden.json). Lance 'capture' et commite-le."
            exit 1
          fi
      - name: Golden CDR — parité
        if: needs.changes.outputs.golden == 'true'
        run: node tools/golden-cdr/golden-cdr.js verify

      - name: Agent remediation contract — backend
        run: node scripts/check-agent-remediation-contract.js --scope=backend

      - name: Prove gates did not mutate the tree
        run: git diff --exit-code

  provider_contracts:
    name: Isolated provider contract proof gates
    needs: changes
    if: needs.changes.outputs.unit_repair_only != 'true' && needs.changes.outputs.provider_proof_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install isolated test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify collector code and unit contract
        run: |
          node --check scripts/external-provider-batch-proof.js
          npx jest tests/unit/external-provider-batch-proof.test.js --runInBand --silent
      - name: Produce offline inventory without provider API calls
        run: |
          node scripts/external-provider-batch-proof.js --mode=inventory \
            --providers=all --out=artifacts/provider-contract-batch/report.json
      - name: Prove targeted gates did not modify tracked sources
        run: git diff --exit-code

  migrations:
    name: Migration and schema gates
    needs: changes
    if: needs.changes.outputs.unit_repair_only != 'true' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Fetch PR history for migration/schema gates
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --filter=blob:none --unshallow origin \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}" \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Migration immutability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-migration-immutability.js --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Schema freshness
        run: node scripts/check-schema-freshness.js
      - name: Schema intent documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-schema-intent-doc.js --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Schema anti-resurrection
        if: needs.changes.outputs.schema_dump == 'true'
        run: node scripts/check-schema-resurrection.js
      - name: Prove gates did not mutate the tree
        run: git diff --exit-code

  from_scratch:
    name: From-scratch DB + integration + E2E API
    needs: [changes, backend]
    # Preuve lourde pilotée par le risque réel : DB rebuild, intégration DB ou
    # E2E API uniquement quand le diff/headers l'exigent. Un simple changement
    # gouvernance/test/docs/workflow ne doit jamais réveiller ce runner.
    # Si le backend runtime est touché, ses gates rapides doivent être verts avant.
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.unit_repair_only != 'true' &&
      (
        needs.changes.outputs.db_rebuild_required == 'true' ||
        needs.changes.outputs.integration_required == 'true' ||
        needs.changes.outputs.e2e_api_required == 'true'
      ) &&
      (
        needs.changes.outputs.backend != 'true' ||
        needs.backend.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-test-jwt-secret
      ADMIN_PASSWORD: ci-test-admin-password
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-test-authkey
      PAYPAL_CLIENT_ID: ci-test-paypal-client
      PAYPAL_CLIENT_SECRET: ci-test-paypal-secret
      PAYPAL_WEBHOOK_ID: ci-test-paypal-webhook
      META_WA_APP_SECRET: ci-test-meta-secret
      KOMERCE_DISABLE_CRONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Fetch full history for migration baseline resolution
        if: needs.changes.outputs.db_rebuild_required == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --filter=blob:none --unshallow origin \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}" \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - id: e2e_scope
        name: Compute Feature-first E2E blast radius
        if: needs.changes.outputs.e2e_api_required == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/e2e-impact-scope.js \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Rebuild PostgreSQL from canonical schema-only snapshot
        run: |
          PGPASSWORD=komerce psql -h localhost -U komerce -d komerce_test -f docs/db/railway-live-schema.sql
          node scripts/ci-db-bootstrap.js
      - name: Integration DB proofs
        if: needs.changes.outputs.integration_required == 'true'
        run: npm run test:integration
      - name: Feature-first E2E API proofs (targeted)
        if: needs.changes.outputs.e2e_api_required == 'true' && steps.e2e_scope.outputs.mode == 'targeted'
        env:
          E2E_FEATURES: ${{ steps.e2e_scope.outputs.features }}
        run: |
          echo "Targeted E2E features: $E2E_FEATURES"
          node scripts/run-e2e-feature-tests.js --features="$E2E_FEATURES"
      - name: Feature-first E2E API proofs (full)
        if: needs.changes.outputs.e2e_api_required == 'true' && steps.e2e_scope.outputs.mode == 'full'
        run: |
          echo "Full E2E required: ${{ steps.e2e_scope.outputs.reason }}"
          npm run test:e2e:features
      - name: Feature-first E2E API proofs (skip)
        if: needs.changes.outputs.e2e_api_required == 'true' && steps.e2e_scope.outputs.mode == 'skip'
        run: |
          echo "No E2E API runtime impact: ${{ steps.e2e_scope.outputs.reason }}"

  dashboard:
    name: Dashboard canonical gates
    needs: changes
    if: needs.changes.outputs.unit_repair_only != 'true' && needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dashboard 360 structural ratchet
        run: npm run dashboards:360:check
      - name: Agent remediation contract — dashboard
        run: node scripts/check-agent-remediation-contract.js --scope=dashboard
      - name: Prove gates did not mutate the tree
        run: git diff --exit-code

  boutique:
    name: Boutique source gates
    needs: changes
    if: needs.changes.outputs.unit_repair_only != 'true' && needs.changes.outputs.boutique == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Fetch PR base commit for sanitize diff
        if: needs.changes.outputs.boutique_js == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install Boutique test dependencies
        if: needs.changes.outputs.boutique_js == 'true' || needs.changes.outputs.boutique_unit == 'true' || needs.changes.outputs.boutique_package == 'true' || needs.changes.outputs.boutique_css == 'true'
        run: npm --prefix public/boutique ci
      - name: JS quality
        if: needs.changes.outputs.boutique_js == 'true'
        run: node scripts/code-quality-gate.js --strict
      - name: CSS source gates
        if: needs.changes.outputs.boutique_css == 'true'
        run: |
          node public/boutique/scripts/check-important.js --strict
          node public/boutique/scripts/check-breakpoints.js --strict
          node public/boutique/scripts/check-css-vars.js --strict
          node public/boutique/scripts/check-zindex-contract.js --strict
          node public/boutique/scripts/check-sticky-integrity.js --strict
      - name: JS source gates
        if: needs.changes.outputs.boutique_js == 'true'
        run: |
          node public/boutique/scripts/check-js-imports.js
          node public/boutique/scripts/check-no-css-injection.js
      - name: HTML balance
        if: needs.changes.outputs.boutique_html == 'true'
        run: node public/boutique/scripts/check-html-balance.js
      - name: Body-class contract
        if: needs.changes.outputs.boutique_js == 'true' || needs.changes.outputs.boutique_html == 'true'
        run: node public/boutique/scripts/check-body-classes.js
      - name: Boutique architecture
        if: needs.changes.outputs.boutique_css == 'true' || needs.changes.outputs.boutique_js == 'true' || needs.changes.outputs.boutique_html == 'true'
        run: node public/boutique/scripts/audit-boutique-arch.js
      - name: Sanitization on added front lines
        if: needs.changes.outputs.boutique_js == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/arch-doctrine-sanitize-check.js --diff="$BASE_SHA"
      - name: Related Boutique unit tests
        if: needs.changes.outputs.boutique_js == 'true' || needs.changes.outputs.boutique_unit == 'true' || needs.changes.outputs.boutique_css == 'true'
        env:
          BOUTIQUE_TEST_FILES: ${{ needs.changes.outputs.boutique_test_files }}
        run: node scripts/run-staged-related-tests.js --files "$BOUTIQUE_TEST_FILES"
      - name: Full Boutique unit tests after dependency changes
        if: needs.changes.outputs.boutique_package == 'true'
        run: npm --prefix public/boutique run test:unit -- --forceExit
      - name: Boutique global ownership
        run: node scripts/boutique-ownership-full-check.js --strict
      - name: Boutique critical visual ownership
        run: |
          node public/boutique/scripts/check-selector-ownership.js
          node public/boutique/scripts/check-runtime-css-var-ownership.js
      - name: Agent remediation contract — boutique
        run: node scripts/check-agent-remediation-contract.js --scope=boutique
      - name: Prove gates did not mutate the tree
        run: git diff --exit-code

  governance:
    name: Governance and feature-first gates
    needs: changes
    if: needs.changes.outputs.unit_repair_only != 'true' && needs.changes.outputs.governance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Fetch PR base commit for debt-zero comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Debt Zero — forbid baseline and exemption growth
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/debt-zero-gate.js --base "$BASE_SHA" --head "$HEAD_SHA"
      # Les sources canoniques restent bloquantes. Le graphe technique doit être
      # hydraté AVANT les projections métier qui le consomment ; sinon un
      # changement de header rend mécaniquement BUSINESS_FEATURE_GRAPH stale
      # quelques millisecondes après sa génération.
      - name: Hydrate technical architecture projection
        run: node scripts/generate-komerce-arch-graph.js
      - name: Hydrate derived governance projections
        run: node scripts/ci-refresh-governance-projections.js
      - name: Pre-merge architecture coherence
        run: |
          node scripts/arch-db-check.js
          node scripts/arch-header-sql-check.js
      - name: Hub authority gate (F4 — logistics vs upstream authority tables/columns)
        run: node scripts/hub-authority-gate.js
      - name: Feature slice guard
        run: node scripts/feature-guard.js --strict
      - name: Business graph semantic check on fresh projection
        run: node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique
      - name: Business graph debt ratchet
        run: npm run business-graph:ratchet-check
      - name: Business graph dependency disposition
        run: npm run business-graph:disposition-check
      - name: Feature 360 canonical projection check
        run: node scripts/feature-360-check.js
      - name: Agent remediation contract — all scopes
        run: node scripts/check-agent-remediation-contract.js
      - name: Agent remediation index check
        run: node scripts/gen-agent-remediation-index.js --check
      - name: Restore CI-only generated projections
        if: always()
        run: |
          git restore --source=HEAD -- \
            docs/komerce-arch-header-graph.json \
            docs/KOMERCE_ARCH_HEADER_GRAPH.md \
            docs/BUSINESS_FEATURE_GRAPH.json \
            docs/BUSINESS_FEATURE_GRAPH.md \
            docs/O6_INVENTORY.md \
            docs/FEATURE_360.json \
            docs/FEATURE_360.md \
            docs/AGENT_REMEDIATION_INDEX.json
      - name: Prove gates did not mutate canonical sources
        if: always()
        run: git diff --exit-code

  verdict:
    name: Required verdict
    if: always()
    needs: [changes, provider_contracts, backend, migrations, from_scratch, dashboard, boutique, governance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate scoped results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          PROVIDER_CONTRACTS_RESULT: ${{ needs.provider_contracts.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          FROM_SCRATCH_RESULT: ${{ needs.from_scratch.result }}
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          BOUTIQUE_RESULT: ${{ needs.boutique.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
        run: |
          echo "changes=$CHANGES_RESULT"
          echo "backend=$BACKEND_RESULT"
          echo "provider_contracts=$PROVIDER_CONTRACTS_RESULT"
          echo "migrations=$MIGRATIONS_RESULT"
          echo "from_scratch=$FROM_SCRATCH_RESULT"
          echo "dashboard=$DASHBOARD_RESULT"
          echo "boutique=$BOUTIQUE_RESULT"
          echo "governance=$GOVERNANCE_RESULT"
          test "$CHANGES_RESULT" = "success"
          for result in "$PROVIDER_CONTRACTS_RESULT" "$BACKEND_RESULT" "$MIGRATIONS_RESULT" "$FROM_SCRATCH_RESULT" "$DASHBOARD_RESULT" "$BOUTIQUE_RESULT" "$GOVERNANCE_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Scoped enforcement failed: $result"
              exit 1
            fi
          done
