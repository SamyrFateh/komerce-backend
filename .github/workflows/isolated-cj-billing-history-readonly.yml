name: Isolated CJ billingHistory read-only proof

'on':
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: isolated-cj-billing-history-readonly
  cancel-in-progress: false

jobs:
  cj-billing-read:
    name: CJ billingHistory — read-only sandbox observation
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && github.event.issue.title == '[isolated-op] cj-billing-history-readonly')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: '1'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      CJ_ACCESS_TOKEN: ${{ secrets.KOMERCE_CJ_PROOF_ACCESS_TOKEN }}
      KOMERCE_ALLOW_CJ_BILLING_HISTORY_READ: '1'
      KOMERCE_CJ_SANDBOX: '1'
      KOMERCE_CJ_BILLING_ORDER_IDS: 'SD2610050652020648900,SD2610050652080659300'

    steps:
      - name: Checkout protected main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Assert read-only sandbox runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$KOMERCE_ENV" = 'staging'
          test "$NODE_ENV" = 'test'
          test "$KOMERCE_CJ_SANDBOX" = '1'
          test "$KOMERCE_ALLOW_CJ_BILLING_HISTORY_READ" = '1'
          test -n "${CJ_ACCESS_TOKEN:-}"

      - name: Run billingHistory read-only proof
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 300s node scripts/cj-billing-history-readonly-proof.js)"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-12000)"
          {
            echo 'summary<<EOF'
            echo "$compact"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Write proof summary
        if: always()
        env:
          PROOF_SUMMARY: ${{ steps.proof.outputs.summary }}
        run: |
          {
            echo '## CJ billingHistory read-only sandbox proof'
            echo
            echo '- source: existing sandbox orders from grouped payBalanceV2 run #6'
            echo '- provider mutations: none'
            echo '- real_debit_verified: always false in this proof'
            if [ -n "${PROOF_SUMMARY:-}" ]; then echo "- result: $PROOF_SUMMARY"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close successful command issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROOF_SUMMARY: ${{ steps.proof.outputs.summary }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "CJ billingHistory read-only proof completed. No provider mutation. Result: $PROOF_SUMMARY"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
