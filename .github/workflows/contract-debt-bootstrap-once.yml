name: One-off contract debt bootstrap

on:
  push:
    branches:
      - fix/contract-unknown-zero

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contract-unknown-zero
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Print canonical contract debt ledger
        run: |
          node scripts/contract-debt-sync.js --write
          node scripts/contract-debt-sync.js --check
          cat docs/contract/DEBT.md
