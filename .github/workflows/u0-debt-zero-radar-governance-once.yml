name: U0 debt-zero radar governance once

on:
  push:
    branches:
      - fix/u0-debt-zero-radar-governance

permissions:
  contents: write

concurrency:
  group: u0-debt-zero-radar-governance
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: postgres://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: u0-debt-zero-ci-secret
      ADMIN_PASSWORD: u0-ci-admin
      QR_SECRET: u0-ci-qr-secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
      KOMERCE_DISABLE_CRONS: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/u0-debt-zero-radar-governance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Apply U0 source finalizer
        run: |
          node scripts/u0-debt-zero-finalize-once.js
          node scripts/u0-fix-generated-test-once.js
          rm -f scripts/u0-debt-zero-finalize-once.js
          rm -f scripts/u0-fix-generated-test-once.js
          rm -f .github/workflows/u0-debt-zero-radar-governance-once.yml

      - name: Prepare invariant database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/db/railway-live-schema.sql
          node scripts/ci-migrate.js
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/135_markets_foundation.sql

      - name: Rebuild governed projections
        run: |
          npm run feature:registry
          npm run arch:gen
          npm run boutique:360
          npm run business-graph:gen
          npm run meta:graph
          npm run gate:findings:gen
          npm run feature:360:gen

      - name: Prove targeted source fixes
        run: |
          npx jest --testPathPatterns tests/unit/shadow-domains-boundary.test.js --runInBand --no-coverage --forceExit
          npm --prefix public/boutique test -- --runInBand tests/unit/discovery-inquiry.test.js
          npm run feature:invariant:check:strict
          npm run boutique:360:check

      - name: Prove Debt Zero without baseline increase
        run: |
          git diff --exit-code -- governance/business-graph-drift-baseline.json
          git diff --exit-code -- scripts/.boutique-360-baseline.json
          npm run business-graph:ratchet-check
          npm run business-graph:disposition-check
          npm run map:check

      - name: Persist qualified U0 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::U0 produced no governed change'
            exit 1
          fi
          git commit --no-verify -m "fix(governance): restore debt zero radar ownership"
          git push origin HEAD:fix/u0-debt-zero-radar-governance
