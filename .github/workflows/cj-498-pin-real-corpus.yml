name: CJ 498 — pin verified provider corpus into PR branch
on:
  pull_request:
    paths:
      - '.github/workflows/cj-498-pin-real-corpus.yml'
permissions:
  contents: write
  actions: read
jobs:
  pin-exact-provider-corpus:
    if: >-
      github.event.pull_request.number == 3933 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/p0-central-hub-supplier-3918' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Restore exact provider artifact and check integrity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh run download 43226639371 -R "$GITHUB_REPOSITORY" -n cj-real-498-source-43226639371 -D baseline
          echo '966fe7fe392bbdb0a79b9fe6b0653fb55346393999da8b5f5e869cee696c33db  baseline/classification-evidence.json' | sha256sum -c -
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('baseline/classification-evidence.json','utf8'));
          if(d.inspected!==498||d.products.length!==498||d.certification!=='NOT_ASSERTED'
            ||new Set(d.products.map(p=>p.supplier_product_id)).size!==498
            ||d.provenance?.recovered_by!=='CJ_LIVE_PRODUCT_LISTV2'
            ||d.provenance?.recovered_count!==2)
            throw Error('CJ_REAL_498_EVIDENCE_NOT_VALID');
          console.log('CJ_AUTHENTIC_SOURCE_FIXTURE_VERIFIED=498');
          NODE
      - name: Commit immutable proof input, not an invented 500 certification
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p tests/fixtures
          cp baseline/classification-evidence.json tests/fixtures/cj-real-498-20261112.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/cj-real-498-20261112.json
          if git diff --cached --quiet; then
            echo 'CJ_SOURCE_ALREADY_PINNED'
            exit 0
          fi
          git commit -m 'test(cj): freeze 498 genuine provider identities for reproducible PG replay'
          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD" || { echo '::error::Branch moved, abort non-fast-forward push'; exit 1; }
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo 'CJ_REAL_498_COMMITTED_TO_PR_BRANCH'
