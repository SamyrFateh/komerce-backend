name: P3b Finalize One Shot

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  statuses: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[p3b-generated]') }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Remove one-shot workflow from the checked tree
        run: rm .github/workflows/p3b-finalize.yml

      - name: Apply deterministic source reconciliation
        run: |
          node <<'NODE'
          const fs = require('fs');

          function edit(file, fn) {
            const before = fs.readFileSync(file, 'utf8');
            const after = fn(before);
            if (after === before) throw new Error(`No change applied to ${file}`);
            fs.writeFileSync(file, after);
          }

          edit('features/infrastructure.feature.js', src => {
            const needle = "      'PROMPT_AUDIT_PREGOLIVE.md',\n";
            if (!src.includes(needle)) throw new Error('obsolete prompt reference missing');
            return src.replace(needle, '');
          });

          edit('features/platform-ops.feature.js', src => {
            if (src.includes('compositionRoots:')) throw new Error('compositionRoots already present');
            const withoutMain = src.replace("      'js/main.js',\n", '');
            if (withoutMain === src) throw new Error('js/main.js declaration missing');
            return withoutMain.replace('  files: {\n', "  files: {\n    compositionRoots: [\n      'public/boutique/js/main.js',\n      'public/boutique/js/boutique.js',\n      'public/boutique/js/b-nav.js',\n    ],\n");
          });

          edit('scripts/lib/feature-dependency-disposition.js', src => {
            const shapeStart = src.indexOf("  const runtimeFiles = evidenceFiles.filter(f => f.role === 'RUNTIME');");
            const shapeEnd = src.indexOf('  const staticTargets =', shapeStart);
            if (shapeStart < 0 || shapeEnd < 0) throw new Error('analyzePair anchors missing');
            const shape = `  const runtimeFiles = evidenceFiles.filter(f => f.role === 'RUNTIME');\n  const nonWiringRuntimeFiles = runtimeFiles.filter(f => !wiring.has(f.source));\n  const evForShape = nonWiringRuntimeFiles.length\n    ? nonWiringRuntimeFiles\n    : (runtimeFiles.length ? runtimeFiles : evidenceFiles);\n  const shapeChannels = new Set(evForShape.map(f => f.channel));\n  const hasStatic = shapeChannels.has('static-code');\n  const hasIface = shapeChannels.has('interface');\n`;
            let out = src.slice(0, shapeStart) + shape + src.slice(shapeEnd);
            const branchStart = out.indexOf('  } else if (ctx.compRootOwners.has(pair.from)) {');
            const branchEnd = out.indexOf("  } else if (providerKind === 'technical-transversal') {", branchStart);
            if (branchStart < 0 || branchEnd < 0) throw new Error('classifyPair anchors missing');
            const branch = `  } else if (ctx.compRootOwners.has(pair.from) && a.allRuntimeFromWiring) {\n    // Montage applicatif pur. Les preuves hors wiring sont qualifiées normalement.\n    family = 'COMPOSITION_ROOT_WIRING';\n`;
            out = out.slice(0, branchStart) + branch + out.slice(branchEnd);
            return out;
          });

          edit('public/boutique/js/b-utils.js', src => {
            if (src.includes('export function showToast')) throw new Error('showToast already in b-utils');
            let out = src.replace(' * @depends       fetch, Intl', ' * @depends       b-store.js, fetch, Intl');
            out = out.replace("'use strict';\n", "'use strict';\n\nimport { dom } from './b-store.js';\n");
            const marker = '/* ── TAUX DE CHANGE ─────────────────────────────────────── */';
            if (!out.includes(marker)) throw new Error('b-utils insertion marker missing');
            const toast = `/** Affiche une notification UI temporaire — utilitaire transversal. */\nexport function showToast(msg, type, duration) {\n  type = type || '';\n  dom.toast.innerHTML = '<div class="k-toast-simple">' + (msg || '') + '</div>';\n  dom.toast.className = 'k-toast show' + (type ? ' ' + type : '');\n  clearTimeout(dom.toast._t);\n  dom.toast._t = setTimeout(() => dom.toast.classList.remove('show'), duration || 2800);\n}\n\n`;
            return out.replace(marker, toast + marker);
          });

          edit('public/boutique/js/b-cart-core.js', src => {
            let out = src.replace("import { state, dom, CART_VERSION } from './b-store.js';", "import { state, CART_VERSION } from './b-store.js';");
            out = out.replace("import { bus } from './b-bus.js';\n", "import { bus } from './b-bus.js';\nexport { showToast } from './b-utils.js';\n");
            const start = out.indexOf('// ──────────────────────────────────────────────\n// TOAST');
            const end = out.indexOf('// ──────────────────────────────────────────────\n// CART HELPERS', start);
            if (start < 0 || end < 0) throw new Error('b-cart-core toast anchors missing');
            out = out.slice(0, start) + out.slice(end);
            return out.replace('Exports : showToast, cartQty', 'Exports : cartQty');
          });

          edit('public/boutique/js/b-identity.js', src => {
            let out = src.replace("import { showToast } from './b-cart-core.js';\n", '');
            out = out.replace("import { sanitize } from './b-utils.js';", "import { sanitize, showToast } from './b-utils.js';");
            if (out.includes("showToast } from './b-cart-core.js'")) throw new Error('identity cart toast import remains');
            return out;
          });
          NODE

      - name: Add O6 composition regression test
        run: |
          cat > tests/unit/feature-dependency-disposition-composition.test.js <<'EOF'
          'use strict';
          const { classifyPair } = require('../../scripts/lib/feature-dependency-disposition');

          const ctx = {
            kindOf: name => ({ 'platform-ops': 'technical-transversal', catalog: 'business-feature', auth: 'technical-transversal' }[name]),
            compRootOwners: new Set(['platform-ops']),
            wiringFiles: new Set(['public/boutique/js/main.js']),
          };

          test('mixed composition and interface uses non-wiring evidence', () => {
            const pair = { from: 'platform-ops', to: 'catalog', conformanceStatus: 'OBSERVED_UNDECLARED', channels: [
              { channel: 'static-code', evidence: [{ sourceFileId: 'public/boutique/js/main.js', targetFile: 'public/boutique/js/b-catalog.js' }] },
              { channel: 'interface', evidence: [{ consumerFileId: 'public/boutique/js/komerce-api.js', endpoint: '/api/products' }] },
            ] };
            expect(classifyPair(pair, ctx).family).toBe('BUSINESS_FEATURE_INTERFACE');
          });

          test('pure composition remains composition wiring', () => {
            const pair = { from: 'platform-ops', to: 'catalog', conformanceStatus: 'OBSERVED_UNDECLARED', channels: [
              { channel: 'static-code', evidence: [{ sourceFileId: 'public/boutique/js/main.js', targetFile: 'public/boutique/js/b-catalog.js' }] },
            ] };
            expect(classifyPair(pair, ctx).family).toBe('COMPOSITION_ROOT_WIRING');
          });

          test('non-wiring technical dependency remains technical', () => {
            const pair = { from: 'platform-ops', to: 'auth', conformanceStatus: 'OBSERVED_UNDECLARED', channels: [
              { channel: 'static-code', evidence: [{ sourceFileId: 'routes/health.js', targetFile: 'middleware/auth.js' }] },
            ] };
            expect(classifyPair(pair, ctx).family).toBe('TECHNICAL_PRIMITIVE');
          });
          EOF

      - name: Run targeted regression tests
        run: npx jest tests/unit/feature-dependency-disposition-composition.test.js public/boutique/tests/unit/b-cart-core.test.js public/boutique/tests/unit/b-identity.test.js --runInBand

      - name: Regenerate all dependent maps
        run: |
          set -o pipefail
          npm run arch:gen 2>&1 | tee p3b-arch-gen.log
          npm run boutique:360 2>&1 | tee p3b-boutique-gen.log
          npm run business-graph:gen 2>&1 | tee p3b-business-gen.log
          npm run meta:graph 2>&1 | tee p3b-meta-gen.log
          npm run feature:360:gen 2>&1 | tee p3b-feature-gen.log

      - name: Verify closure
        run: |
          set -o pipefail
          npm run feature:360:check 2>&1 | tee p3b-feature-check.log
          npm run map:check 2>&1 | tee p3b-map-check.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p3b-finalize-logs-${{ github.run_id }}
          path: |
            p3b-*.log
            docs/BUSINESS_FEATURE_GRAPH.json
            docs/O6_INVENTORY.md
            docs/FEATURE_360.json
          retention-days: 1

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"p3b-finalize\",\"description\":\"P3b finalization failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Commit verified closure
        if: success()
        run: |
          rm -f p3b-*.log
          git config user.name "Komerce Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(p3b): verified 18-source closure [p3b-generated]"
          git push origin HEAD:main

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"p3b-finalize\",\"description\":\"18/18 sources and map-check passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
