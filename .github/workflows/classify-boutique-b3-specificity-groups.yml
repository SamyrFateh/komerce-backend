name: Classify Boutique B3 Specificity Groups

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b3-specificity

permissions:
  contents: read

jobs:
  classify-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b3-specificity
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - run: npm --prefix public/boutique ci
      - name: Prove all physical pairs per semantic key
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const cp=require('child_process');
          const postcss=require('./public/boutique/node_modules/postcss');
          const root=path.resolve('public/boutique');
          const raw=cp.execFileSync('node',['scripts/css-specificity-guard.js'],{cwd:root,encoding:'utf8',maxBuffer:20*1024*1024});
          const lines=raw.replace(/\x1b\[[0-9;]*m/g,'').split(/\r?\n/);
          const physical=[];
          for(let i=0;i<lines.length;i++){
            const m=lines[i].match(/^🔴 \.([^ ]+) — propriété (.+)$/); if(!m) continue;
            const win=(lines[i+1]||'').match(/^\s*gagnant\s+([^:]+):L(\d+)\s+(.+)$/);
            const wv=(lines[i+2]||'').match(/^\s*→\s+(.+?)\s+\(spécificité/);
            const lose=(lines[i+3]||'').match(/^\s*perdant\s+([^:]+):L(\d+)\s+(.+)$/);
            const lv=(lines[i+4]||'').match(/^\s*→\s+(.+?)\s+\(spécificité/);
            if(!win||!wv||!lose||!lv) throw new Error('parse failure');
            physical.push({gc:m[1],prop:m[2],wf:win[1],wl:+win[2],ws:win[3],wv:wv[1].trim(),lf:lose[1],ll:+lose[2],ls:lose[3],lv:lv[1].trim()});
          }
          const cache=new Map();
          function norm(s){return s.replace(/\s+/g,' ').trim()}
          function members(r){return (r.selectors||[r.selector]).map(norm)}
          function ast(file){if(!cache.has(file))cache.set(file,postcss.parse(fs.readFileSync(path.resolve(file),'utf8'),{from:file}));return cache.get(file)}
          function media(rule){const a=[];let n=rule.parent;while(n&&n.type!=='root'){if(n.type==='atrule'&&n.name==='media')a.unshift(`@media ${n.params}`);n=n.parent}return a.length?a.join(' && '):'global'}
          function meta(file,line,sel){const t=norm(sel);const rs=[];ast(file).walkRules(r=>{if(members(r).includes(t))rs.push(r)});if(!rs.length)throw new Error(`missing ${file} ${sel}`);const exact=rs.filter(r=>r.source?.start?.line===line);const r=exact.length===1?exact[0]:rs.sort((a,b)=>Math.abs((a.source?.start?.line||0)-line)-Math.abs((b.source?.start?.line||0)-line))[0];return {media:media(r),line:r.source.start.line,grouped:members(r).length>1}}
          const groups=new Map();
          for(const f of physical){const key=[f.gc,f.ws,f.ls,f.prop].join('|||');if(!groups.has(key))groups.set(key,[]);const wm=meta(f.wf,f.wl,f.ws),lm=meta(f.lf,f.ll,f.ls);groups.get(key).push({...f,wm,lm})}
          const buckets=new Map();
          for(const [key,rows] of groups){
            if(rows[0].gc==='modal-open'){buckets.set('transient',(buckets.get('transient')||0)+1);continue}
            const same=rows.filter(r=>r.wm.media===r.lm.media);
            const diff=rows.filter(r=>r.wm.media!==r.lm.media);
            let b;
            if(diff.length===0)b='all-pairs-same-media';
            else if(same.length===0)b='all-pairs-different-media';
            else b='mixed-media-pairs';
            buckets.set(b,(buckets.get(b)||0)+1);
            if(b!=='all-pairs-same-media') console.log(`DETAIL ${b} ${key} :: ${rows.map(r=>r.wm.media+' -> '+r.lm.media).join(' | ')}`);
          }
          console.log(`PHYSICAL=${physical.length}`);
          console.log(`SEMANTIC=${groups.size}`);
          console.log('=== GROUP SAFETY ===');
          [...buckets.entries()].sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>console.log(`${v} ${k}`));
          NODE
