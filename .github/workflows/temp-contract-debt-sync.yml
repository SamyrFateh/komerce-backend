name: Temporary contract debt sync

on:
  push:
    branches:
      - feat/economic-workshop-market-contribution-ui

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economic-workshop-market-contribution-ui
          fetch-depth: 0
      - name: Synchronize contract debt projection
        run: node scripts/contract-debt-sync.js --write
      - name: Commit generated debt projection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contract/DEBT.md
          if git diff --cached --quiet; then
            echo "No contract debt projection changes"
            exit 0
          fi
          git commit -m "chore(contract): sync API debt projection"
          git push origin HEAD:feat/economic-workshop-market-contribution-ui
