name: Debt Zero backend final remediation

on:
  push:
    branches: [ci/debt-zero-backend-final]
    paths:
      - '.github/workflows/debt-zero-backend-final.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-zero-backend-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply surgical transitive security overrides
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides = {
            ...(p.overrides || {}),
            'fast-uri': '^3.1.5',
            'minimatch@3.1.5': {
              'brace-expansion': '1.1.18'
            },
            'minimatch@10.2.5': {
              'brace-expansion': '5.0.9'
            },
            '@istanbuljs/load-nyc-config': {
              'js-yaml': '3.15.2'
            }
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Reinstall exact lock and prove audit zero high
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts
          npm ls brace-expansion fast-uri js-yaml --all
          node <<'NODE'
          const { execFileSync } = require('child_process');
          let out;
          try {
            out = execFileSync('npm', ['audit', '--json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
          } catch (err) {
            out = err.stdout;
          }
          const a = JSON.parse(out);
          console.log(JSON.stringify(a.metadata.vulnerabilities, null, 2));
          if ((a.metadata?.vulnerabilities?.high || 0) !== 0 || (a.metadata?.vulnerabilities?.critical || 0) !== 0) {
            console.error(JSON.stringify(a.vulnerabilities, null, 2));
            process.exit(1);
          }
          NODE
      - name: Backend and unit regression proof
        run: |
          npm run backend:audit
          node scripts/debt-audit.js --json
          npm test -- --runInBand
      - name: Commit verified package security closure
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain package.json package-lock.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): close final high severity audit findings"
          git push origin HEAD:fix/debt-zero-backend-final
