name: Verify Production Subcategories Temp

on:
  push:
    branches:
      - tmp/prod-subcat-verify-20260901
    paths:
      - .github/workflows/verify-prod-subcats-temp.yml

permissions:
  contents: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/prod-subcat-verify-20260901
          fetch-depth: 0

      - name: Wait for Railway convergence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://komerce-backend-production.up.railway.app'
          rm -f /tmp/index.html /tmp/desktop.css
          for attempt in $(seq 1 30); do
            echo "Attempt ${attempt}/30"
            curl -fsSL --retry 2 --connect-timeout 10 -H 'Cache-Control: no-cache' "${BASE}/?qa=$(date +%s)" -o /tmp/index.html || true
            if grep -Fq '/boutique/css/dist/desktop.css?v=151' /tmp/index.html; then
              curl -fsSL --retry 2 --connect-timeout 10 -H 'Cache-Control: no-cache' "${BASE}/boutique/css/dist/desktop.css?v=151&qa=$(date +%s)" -o /tmp/desktop.css || true
              if grep -Fq 'min-width: 104px;' /tmp/desktop.css \
                && grep -Fq 'width: 72px;' /tmp/desktop.css \
                && grep -Fq 'saturate(1.02)' /tmp/desktop.css; then
                echo 'RAILWAY_CONVERGED=true'
                echo 'desktop.css?v=151 is live with natural subcategory geometry.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Railway did not converge within 5 minutes.' >&2
          echo 'Live desktop css reference:' >&2
          grep -oE '/boutique/css/dist/desktop\.css\?v=[0-9]+' /tmp/index.html | tail -1 >&2 || true
          exit 1

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/verify-prod-subcats-temp.yml
          git commit -m 'chore(qa): remove temporary production verification workflow'
          git push origin HEAD:tmp/prod-subcat-verify-20260901
