name: temp nodemailer lock refresh

on:
  push:
    branches:
      - feat/admin-navigation-mock-contract

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-navigation-mock-contract
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh safe nodemailer dependency
        run: npm install nodemailer@9.1.1 --save --package-lock-only
      - name: Commit dependency metadata when changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency metadata change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore(deps): bump nodemailer to 9.1.1'
          git push origin HEAD:feat/admin-navigation-mock-contract
