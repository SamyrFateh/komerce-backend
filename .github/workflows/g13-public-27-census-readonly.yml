# G13: census public 9 categories x KM/CM/CG; SQL READ ONLY + HTTP GET only.
# Owner-only issue trigger; no product, pricing, stock, payments or order writes.
name: G13 public 27-cell census — guarded staging read-only
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-g13-catalogue-seed
  cancel-in-progress: false
jobs:
  census:
    if: github.actor == github.repository_owner && github.event.issue.title == '[staging-op] g13-public-27-census-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_ACTIONS: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      PGOPTIONS: '-c default_transaction_read_only=on'
      G13_MODE: dry-run
      G13_PHASE: census
      G13_CONFIRMATION: SEED-G13-CATALOGUE
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_MARKET_OPERATOR_EMAIL: ${{ secrets.E2E_MARKET_OPERATOR_EMAIL }}
      E2E_MARKET_OPERATOR_PASSWORD: ${{ secrets.E2E_MARKET_OPERATOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check 27 public and SQL cells fail-closed
        run: node scripts/recette/g13-catalogue-seed.js
      - name: Preserve full per-cell evidence (including NO GO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-public-27-census-${{ github.run_id }}
          path: test-results/g13-catalogue-seed/report.json
          retention-days: 21
          if-no-files-found: error
