name: Discovery Work Visual Audit

on:
  push:
    branches:
      - feat/discovery-local-v2
    paths:
      - '.github/workflows/discovery-work-visual-audit.yml'
      - 'public/boutique/css/discovery-rail.css'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: public/boutique
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - run: npm ci
      - name: Rebuild canonical CSS bundle
        run: npm run deploy:css
      - run: npx playwright install --with-deps chromium
      - name: Capture desktop/mobile geometry
        shell: bash
        run: |
          mkdir -p work-visual-audit
          npx serve .. --listen 3000 --no-clipboard >/tmp/komerce-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://localhost:3000/boutique/ >/dev/null && break
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('fs');

          const cards = [
            {
              kind: 'physical_offer',
              title: 'Samboussas au boeuf',
              subtitle: 'Disponible aujourd’hui · Mutsamudu',
              cta_label: 'Commander',
              cta_action_ref: '11111111-1111-4111-8111-111111111111',
              image_ref: '/boutique/categories/cat-maison-v3.webp'
            },
            {
              kind: 'service',
              title: 'Maçon à Anjouan',
              subtitle: 'Artisan local · Mutsamudu',
              cta_label: 'Demander',
              cta_action_ref: '22222222-2222-4222-8222-222222222222'
            },
            {
              kind: 'physical_offer',
              title: 'Ciment local 32,5R',
              subtitle: 'Disponible aujourd’hui · Anjouan',
              cta_label: 'Commander',
              cta_action_ref: '33333333-3333-4333-8333-333333333333',
              image_ref: '/boutique/categories/cat-bricolage-v3.webp'
            },
            {
              kind: 'service',
              title: 'Plombier à proximité',
              subtitle: 'Artisan local · Anjouan',
              cta_label: 'Demander',
              cta_action_ref: '44444444-4444-4444-8444-444444444444'
            }
          ];

          const products = [
            { id:'geom-prod-1', name:'Ensemble maison premium', description:'Produit Komerce', price_kmf:12500, image_url:'/boutique/categories/cat-maison-v3.webp', images:['/boutique/categories/cat-maison-v3.webp'], category:'maison', is_available:true, stock:20, inventory_model:'SIMPLE' },
            { id:'geom-prod-2', name:'Accessoire bricolage', description:'Produit Komerce', price_kmf:18000, image_url:'/boutique/categories/cat-bricolage-v3.webp', images:['/boutique/categories/cat-bricolage-v3.webp'], category:'bricolage', is_available:true, stock:20, inventory_model:'SIMPLE' },
            { id:'geom-prod-3', name:'Article mode sélection', description:'Produit Komerce', price_kmf:9000, image_url:'/boutique/categories/cat-mode-v3.webp', images:['/boutique/categories/cat-mode-v3.webp'], category:'mode', is_available:true, stock:20, inventory_model:'SIMPLE' },
            { id:'geom-prod-4', name:'Sélection Komerce', description:'Produit Komerce', price_kmf:22000, image_url:'/boutique/categories/cat-all-v3.webp', images:['/boutique/categories/cat-all-v3.webp'], category:'all', is_available:true, stock:20, inventory_model:'SIMPLE' }
          ];

          async function stub(page) {
            await page.route(/\/api\//, r => r.fulfill({ status:200, contentType:'application/json', body:'{}' }));
            await page.route(/\/api\/products(\?|$)/, r => r.fulfill({ status:200, contentType:'application/json', body:JSON.stringify(products) }));
            await page.route(/\/api\/boutique\/suggestions/, r => r.fulfill({ status:200, contentType:'application/json', body:JSON.stringify({ cards }) }));
          }

          async function capture(browser, name, viewport) {
            const context = await browser.newContext({ viewport, locale:'fr-FR', serviceWorkers:'block', deviceScaleFactor:1 });
            const page = await context.newPage();
            await stub(page);
            await page.goto('http://localhost:3000/boutique/index.html', { waitUntil:'domcontentloaded' });
            await page.waitForSelector('#k-discovery-local:not([hidden])', { timeout:10000 });
            await page.waitForTimeout(1000);

            const metrics = await page.evaluate(() => {
              const q = s => document.querySelector(s);
              const qa = s => Array.from(document.querySelectorAll(s));
              const toRect = el => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { x:r.x, y:r.y, width:r.width, height:r.height, top:r.top, bottom:r.bottom, left:r.left, right:r.right };
              };
              const rail = q('.k-discovery-rail');
              const cards = qa('.k-discovery-card').map(toRect);
              const visibleCards = cards.filter(r => r && r.right > 0 && r.left < innerWidth).length;
              const shell = q('#k-discovery-local');
              const catalog = q('#k-desktop-catalog-wrap');
              const grid = q('.k-grid');
              const hero = q('.k-hero');
              const occupiedRight = cards.reduce((max, r) => Math.max(max, r?.right || 0), 0);
              return {
                viewport:{ width:innerWidth, height:innerHeight },
                shell:toRect(shell),
                catalog:toRect(catalog),
                grid:toRect(grid),
                hero:toRect(hero),
                rail:toRect(rail),
                cards,
                visibleCards,
                railScrollWidth:rail?.scrollWidth || 0,
                railClientWidth:rail?.clientWidth || 0,
                horizontalOverflow:(rail?.scrollWidth || 0) - (rail?.clientWidth || 0),
                emptyRightPx: rail ? Math.max(0, rail.getBoundingClientRect().right - occupiedRight) : null,
                gapToGrid:shell && grid ? grid.getBoundingClientRect().top - shell.getBoundingClientRect().bottom : null
              };
            });

            await page.screenshot({ path:`work-visual-audit/${name}-viewport.jpg`, type:'jpeg', quality:82, fullPage:false });
            await page.screenshot({ path:`work-visual-audit/${name}-full.jpg`, type:'jpeg', quality:72, fullPage:true });
            await context.close();
            return metrics;
          }

          (async () => {
            const browser = await chromium.launch({ headless:true });
            const results = {};
            results.mobile390 = await capture(browser, 'mobile-390', { width:390, height:844 });
            results.mobile412 = await capture(browser, 'mobile-412', { width:412, height:915 });
            results.desktop1280 = await capture(browser, 'desktop-1280', { width:1280, height:720 });
            results.desktop1440 = await capture(browser, 'desktop-1440', { width:1440, height:900 });
            await browser.close();
            fs.writeFileSync('work-visual-audit/metrics.json', JSON.stringify(results, null, 2));
            console.log('WORK_VISUAL_METRICS=' + JSON.stringify(results));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload Work visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-work-visual-audit
          path: public/boutique/work-visual-audit/
          if-no-files-found: error
      - name: Commit canonical generated CSS outputs
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .
          if ! git diff --cached --quiet; then
            git commit -m 'chore(boutique): rebuild discovery rail css bundle'
            git push origin HEAD:feat/discovery-local-v2
          fi
