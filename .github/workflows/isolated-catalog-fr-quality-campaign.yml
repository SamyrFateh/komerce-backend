name: Isolated catalog FR quality campaign

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run carrying the terminology-enriched checkpoint'
        required: false
        default: '36249230661'
      checkpoint_name:
        description: 'Checkpoint artifact name'
        required: false
        default: 'cj-fr-cold-start-memory-checkpoint'
      scope:
        description: 'batch-001 or all'
        required: false
        default: 'all'
      campaign_path:
        description: 'Repository path containing translations/ and reviews/'
        required: false
        default: 'ops/catalog-fr-quality/campaigns/cj-974-2026-09'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: isolated-catalog-fr-quality-campaign
  cancel-in-progress: false

jobs:
  apply-fr-quality:
    name: FR translations + reviews → inactive catalog drafts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       (github.event.issue.title == '[isolated-op] catalog-fr-quality-batch001' ||
        github.event.issue.title == '[isolated-op] catalog-fr-quality-campaign'))
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_real_catalog_stress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_real_catalog_stress"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: '1'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_real_catalog_stress
      PGPASSWORD: komerce

    steps:
      - name: Checkout protected main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download terminology-enriched checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.checkpoint_name || 'cj-fr-cold-start-memory-checkpoint' }}
          path: checkpoint
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '36249230661' }}
          github-token: ${{ github.token }}

      - name: Restore disposable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          dump_file="$(find checkpoint -type f -name '*.dump' | head -1)"
          test -n "$dump_file" || { echo '::error::Checkpoint sans dump PostgreSQL'; exit 1; }
          pg_restore --clean --if-exists --no-owner --no-privileges             -h 127.0.0.1 -U komerce -d komerce_real_catalog_stress "$dump_file"

          # Idempotent: ensure the curated batch-001 glossary exists even when
          # the caller chooses an older terminology checkpoint.
          psql -h 127.0.0.1 -U komerce -d komerce_real_catalog_stress             -v ON_ERROR_STOP=1 -f migrations/244_catalog_glossary_batch001.sql

      - name: Resolve campaign scope
        id: scope
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          INPUT_SCOPE: ${{ inputs.scope || 'all' }}
          INPUT_CAMPAIGN_PATH: ${{ inputs.campaign_path || 'ops/catalog-fr-quality/campaigns/cj-974-2026-09' }}
        run: |
          set -euo pipefail
          campaign="$INPUT_CAMPAIGN_PATH"
          scope="$INPUT_SCOPE"

          if [ "$ISSUE_TITLE" = '[isolated-op] catalog-fr-quality-batch001' ]; then
            scope='batch-001'
          elif [ "$ISSUE_TITLE" = '[isolated-op] catalog-fr-quality-campaign' ]; then
            scope='all'
          fi

          if [ "$scope" = 'all' ]; then
            input_path="$campaign/translations"
            review_path="$campaign/reviews"
            require_complete='1'
          elif [[ "$scope" =~ ^batch-[0-9]{3}$ ]]; then
            input_path="$campaign/translations/$scope.json"
            review_path="$campaign/reviews/$scope.json"
            require_complete='0'
          else
            echo "::error::scope invalide: $scope"
            exit 1
          fi

          test -e "$input_path" || { echo "::error::translations introuvables: $input_path"; exit 1; }
          test -e "$review_path" || { echo "::error::reviews introuvables: $review_path"; exit 1; }

          {
            echo "scope=$scope"
            echo "input_path=$input_path"
            echo "review_path=$review_path"
            echo "require_complete=$require_complete"
          } >> "$GITHUB_OUTPUT"

      - name: Audit campaign coverage
        shell: bash
        env:
          INPUT_PATH: ${{ steps.scope.outputs.input_path }}
          REVIEW_PATH: ${{ steps.scope.outputs.review_path }}
          REQUIRE_COMPLETE: ${{ steps.scope.outputs.require_complete }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/catalog-fr-quality-campaign
          args=(
            --input="$INPUT_PATH"
            --review="$REVIEW_PATH"
            --output=artifacts/catalog-fr-quality-campaign/coverage.json
          )
          if [ "$REQUIRE_COMPLETE" = '1' ]; then
            args+=(--expected=974 --require-complete)
          fi
          node scripts/catalog-fr-quality-campaign-audit.js "${args[@]}"

      - name: Dry-run FR Quality apply
        shell: bash
        env:
          INPUT_PATH: ${{ steps.scope.outputs.input_path }}
          REVIEW_PATH: ${{ steps.scope.outputs.review_path }}
        run: |
          set -euo pipefail
          node scripts/catalog-fr-quality-apply.js             --input="$INPUT_PATH"             --review="$REVIEW_PATH"             --dry-run             --output=artifacts/catalog-fr-quality-campaign/dry-run.json

      - name: Apply FR Quality bundle atomically
        shell: bash
        env:
          INPUT_PATH: ${{ steps.scope.outputs.input_path }}
          REVIEW_PATH: ${{ steps.scope.outputs.review_path }}
        run: |
          set -euo pipefail
          node scripts/catalog-fr-quality-apply.js             --input="$INPUT_PATH"             --review="$REVIEW_PATH"             --execute             --output=artifacts/catalog-fr-quality-campaign/apply.json

      - name: Audit Raffinerie readiness after FR apply
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cj-refinery-commandability-continuation.js             --audit-only             --limit=1000             --output=artifacts/catalog-fr-quality-campaign/readiness.json

      - name: Verify catalog draft state
        shell: bash
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const db = require('./db');
          (async () => {
            const { rows: [r] } = await db.query(`
              SELECT COUNT(*)::int AS total,
                     COUNT(*) FILTER (
                       WHERE p.content_source='manual' AND p.needs_review=FALSE
                     )::int AS manual_reviewed,
                     COUNT(*) FILTER (
                       WHERE p.is_active=TRUE
                     )::int AS active,
                     COUNT(DISTINCT pme.product_id)::int AS exposed,
                     COUNT(*) FILTER (
                       WHERE p.lifecycle_status IS DISTINCT FROM 'candidate'
                     )::int AS wrong_lifecycle
                FROM sourcing_candidates sc
                JOIN products p ON p.id=sc.product_id
                LEFT JOIN product_market_exposure pme ON pme.product_id=p.id
               WHERE sc.supplier_name='CJdropshipping'
                 AND sc.state='imported_to_catalog'
            `);
            console.log(JSON.stringify({ scope: process.env.SCOPE, catalog: r }));
            if (Number(r.active) || Number(r.exposed) || Number(r.wrong_lifecycle)) {
              throw new Error('CATALOG_FR_CAMPAIGN_SAFETY_FAILED:' + JSON.stringify(r));
            }
            if (process.env.SCOPE === 'all' && Number(r.manual_reviewed) !== Number(r.total)) {
              throw new Error('CATALOG_FR_CAMPAIGN_NOT_ALL_MANUAL_REVIEWED:' + JSON.stringify(r));
            }
          })().catch(e => {
            console.error(e);
            process.exitCode=1;
          }).finally(() => db.pool.end());
          NODE

      - name: Save reusable post-FR checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/catalog-fr-quality-checkpoint
          pg_dump -h 127.0.0.1 -U komerce -d komerce_real_catalog_stress -Fc             -f artifacts/catalog-fr-quality-checkpoint/komerce-catalog-fr-quality.dump
          cp artifacts/catalog-fr-quality-campaign/readiness.json              artifacts/catalog-fr-quality-checkpoint/readiness.json

      - name: Upload FR campaign reports
        uses: actions/upload-artifact@v4
        with:
          name: catalog-fr-quality-campaign-report
          path: artifacts/catalog-fr-quality-campaign/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reusable post-FR checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: catalog-fr-quality-checkpoint
          path: artifacts/catalog-fr-quality-checkpoint/
          if-no-files-found: error
          retention-days: 14

      - name: Close successful command issue
        if: success() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "FR Quality scope $SCOPE applied transactionally on disposable checkpoint. Reports + updated checkpoint uploaded. Products remain inactive/unexposed; publication still requires the separate human approval gate."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
