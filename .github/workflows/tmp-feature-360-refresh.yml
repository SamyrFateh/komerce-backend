name: Temporary Feature 360 refresh

on:
  push:
    branches:
      - feat/canonical-costing-cutover

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-costing-cutover
      - name: Generate Feature 360 artifacts
        run: node scripts/gen-feature-360.js
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_360.json docs/FEATURE_360.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(governance): refresh Feature 360"
          git push origin HEAD:feat/canonical-costing-cutover
