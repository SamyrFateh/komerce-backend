name: Auditor V4 physical evidence campaign (local PG)
on:
  pull_request:
    paths:
      - 'tools/business-auditor/**'
      - '.github/workflows/auditor-v4-evidence-campaign.yml'
  push:
    branches: [main]
    paths:
      - 'tools/business-auditor/**'
      - '.github/workflows/auditor-v4-evidence-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUDITOR_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Test semantic census and G4-G5 fail-closed
        run: |
          node --test tools/business-auditor/v35-invariant-census.test.js tools/business-auditor/v40-semantic-ledger.test.js tools/business-auditor/v40-generated-inventory.test.js tools/business-auditor/v41-g2-local-stock-proof.test.js tools/business-auditor/v46-g2-market-relay-proof.test.js tools/business-auditor/v42-release-install-smoke.test.js tools/business-auditor/v43-main-diff-scope.test.js tools/business-auditor/v44-adversarial-mutations.test.js tools/business-auditor/v45-multidomain-physical.test.js tools/business-auditor/v47-bounded-release-evidence.test.js tools/business-auditor/v48-autonomous-discovery.test.js tools/business-auditor/v49-prospective-challenge.test.js tools/business-auditor/v38-benchmark-release.test.js
      - name: Build local test schema
        run: |
          PGPASSWORD=komerce psql -h 127.0.0.1 -U komerce -d komerce_test -v ON_ERROR_STOP=1 -f docs/db/railway-live-schema.sql > /tmp/auditor-v4-schema.log
          node scripts/ci-db-bootstrap.js
      - name: Twelve real owner physical cases on disposable PG clones
        run: npm run audit:logic:unified -- --mode full --out /tmp/komerce-auditor-v4-full
      - name: G2 independently prove local-stock nonnegative DB constraint
        run: node tools/business-auditor/v41-g2-local-stock-proof.js --audit /tmp/komerce-auditor-v4-full/unified-audit.json --out /tmp/komerce-auditor-g2
      - name: G2 prove physical order-to-relay-to-market NOT NULL and FK chain
        run: node tools/business-auditor/v46-g2-market-relay-proof.js --audit /tmp/komerce-auditor-v4-full/unified-audit.json --stock-proof /tmp/komerce-auditor-g2/g2-exact-invariant-proof.json --out /tmp/komerce-auditor-g2-relay
      - name: G3 generated physical inventory cases and evaluator-only mutations
        run: npm run audit:logic:generated:inventory -- --files services/inventory-service.js --budget 6 --evaluate-withheld --out /tmp/komerce-auditor-g3
      - name: G4 adversarial out-of-sample inventory proof (not independent sealed blind)
        run: node tools/business-auditor/v44-inventory-adversarial.js --out /tmp/komerce-auditor-g4-adversarial
      - name: 'G4 three real owners: FX, market, orders source mutants on isolated PG'
        run: npm run audit:logic:adversarial:multidomain -- --out /tmp/komerce-auditor-v45-multi
      - name: G5 smoke real quick targeted full and remote DB safety
        run: node tools/business-auditor/v42-release-install-smoke.js --audit /tmp/komerce-auditor-v4-full/unified-audit.json --impact /tmp/komerce-auditor-g3/g3-generated-experiment.json --out /tmp/komerce-auditor-g5-install
      - name: G5 inspect entire repository diff against frozen pre-auditor baseline
        run: node tools/business-auditor/v43-main-diff-scope.js --out /tmp/komerce-auditor-g5-diff
      - name: G4 known benchmark and honest G5 decision
        run: |
          node tools/business-auditor/v38-benchmark-release-cli.js --audit /tmp/komerce-auditor-v4-full/unified-audit.json --impact /tmp/komerce-auditor-g3/g3-generated-experiment.json --install /tmp/komerce-auditor-g5-install/g5-install-smoke.json --main-diff /tmp/komerce-auditor-g5-diff/g5-main-diff.json --out /tmp/komerce-auditor-v4-release
          node <<'NODE'
          const fs=require('node:fs');
          const audit=require('/tmp/komerce-auditor-v4-full/unified-audit.json');
          const semantic=require('/tmp/komerce-auditor-v4-full/invariant-semantic-ledger.json');
          const g3=require('/tmp/komerce-auditor-g3/g3-generated-experiment.json');
          const diff=require('/tmp/komerce-auditor-g5-diff/g5-main-diff.json');
          const adversarial=require('/tmp/komerce-auditor-g4-adversarial/g4-adversarial-inventory.json');
          const multi=require('/tmp/komerce-auditor-v45-multi/g4-multidomain-adversarial.json');
          const g4=require('/tmp/komerce-auditor-v4-release/g4-calibration.json');
          const g5=require('/tmp/komerce-auditor-v4-release/g5-release-readiness.json');
          if(audit.sha!==process.env.GITHUB_SHA||
             audit.summary.physicalCasesTotal!==12||
             !audit.physicalCaseIndex.every(x=>x.cloneDropped)||
             semantic.summary.declared!==audit.summary.featureInvariantsDeclared||
             semantic.summary.semanticallyVerified!==3||
             audit.summary.featureInvariantsCertified!==3||
             audit.invariantCoverage.featureCardInvariantsCertified!==3||
             !g5.blockers.includes('G2_SEMANTIC_INVARIANT_MAPPING')||
             g5.blockers.includes('G5_OPERATOR_DOCUMENTATION_AND_INSTALL')||
             !diff.automatedScopeVerified||diff.unrelatedRuntimeChanges!==0||
             diff.humanReviewApproved!==false||
             !g5.blockers.includes('G5_SAFE_MAIN_DIFF')||
             adversarial.sha!==audit.sha||
             adversarial.summary.truePositive!==5||
             adversarial.summary.falseNegative!==0||
             adversarial.summary.falsePositive!==0||
             adversarial.classification!=='OPEN_REPRODUCIBLE_NOT_SEALED_INDEPENDENT_BLIND'||
             multi.sha!==audit.sha||
             multi.summary.ownerFamilies!==3||
             multi.summary.faults!==6||
             multi.summary.detected!==6||
             multi.summary.missed!==0||
             multi.summary.falsePositives!==0||
             multi.summary.equivalentControls!==3||
             multi.summary.allClonesDropped!==true||
             multi.classification!=='OPEN_REPRODUCIBLE_NOT_SEALED_BLIND'||
             multi.summary.arbitraryUnknownBugDiscoveryCertified!==false||
             g3.sha!==audit.sha||g3.generatedCases!==6||
             g3.withheldMutationDetected!==true||
             g3.summary.detected!==2||g3.summary.missed!==0||
             !g3.allClonesDropped||
             g5.blockers.includes('G3_AUTONOMOUS_GENERATED_EXPERIMENT')||
             g4.calibrationGate!=='PASS'||g4.g4ReleaseGate!=='NO_GO'||
             g5.decision!=='NO_GO'||g5.mergeMainAuthorized!==false)
            throw Error('Physical evidence or release claims inconsistent');
          fs.writeFileSync('/tmp/komerce-auditor-v4-release/campaign-summary.json',
            JSON.stringify({sha:audit.sha,g4:g4.calibration,g5:g5.decision,
              blockers:g5.blockers,semantic:semantic.summary,g3:g3.summary},null,2));
          console.log('AUDITOR_G5_UNCERTIFIED',JSON.stringify(g5.blockers));
          NODE
      - name: Re-grade bounded technical release candidate from exact G1-G5 artifacts
        run: |
          node tools/business-auditor/v47-bounded-release-evidence.js \
            --audit /tmp/komerce-auditor-v4-full/unified-audit.json \
            --ledger /tmp/komerce-auditor-v4-full/invariant-semantic-ledger.json \
            --stock /tmp/komerce-auditor-g2/g2-exact-invariant-proof.json \
            --relay /tmp/komerce-auditor-g2-relay/g2-market-relay-proof.json \
            --g3 /tmp/komerce-auditor-g3/g3-generated-experiment.json \
            --inventory /tmp/komerce-auditor-g4-adversarial/g4-adversarial-inventory.json \
            --multi /tmp/komerce-auditor-v45-multi/g4-multidomain-adversarial.json \
            --diff /tmp/komerce-auditor-g5-diff/g5-main-diff.json \
            --install /tmp/komerce-auditor-g5-install/g5-install-smoke.json \
            --release /tmp/komerce-auditor-v4-release/g5-release-readiness.json \
            --out /tmp/komerce-auditor-v47-rc
      - name: V48 autonomous owner discovery without source mutation inputs
        run: |
          npm run audit:logic:discover -- --all-reviewed --out /tmp/komerce-auditor-v48-baseline
          node <<'NODE'
          const p=require('/tmp/komerce-auditor-v48-baseline/autonomous-discovery.json');
          if(p.sha!==process.env.GITHUB_SHA||
            p.selection.selected.length!==5||
            p.summary.reviewedOwnersExecuted!==5||
            p.summary.ownerErrors!==0||
            p.observations.some(x=>!x.cloneDropped||
              !x.ownerCodeExecuted||x.sourceMutantIdProvided!==false)||
            p.certifiedAutonomousUnknownBugDiscovery!==false)
            throw Error('V48 baseline physical owner proof or claims inconsistent');
          console.log('AUDITOR_V48_BASELINE',JSON.stringify(p.summary));
          NODE
      - name: V48 open novel code-change challenge; scanner receives no mutant ID
        run: |
          set -euo pipefail
          target=services/market-operation-guard.js
          test -z "$(git status --porcelain -- "$target")"
          trap 'git restore -- "$target"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path=Path('services/market-operation-guard.js')
          source=path.read_text()
          old='catalog_exposure_enable: Object.freeze([ACTIVE]),'
          assert source.count(old)==1, 'Novel unregistered policy defect injection anchor changed'
          path.write_text(source.replace(old,'catalog_exposure_enable: Object.freeze([ACTIVE, SUSPENDED]),'))
          PY
          npm run audit:logic:discover -- --out /tmp/komerce-auditor-v48-novel
          node <<'NODE'
          const p=require('/tmp/komerce-auditor-v48-novel/autonomous-discovery.json');
          if(p.selection.mode!=='GIT_CHANGE_DRIVEN'||
            p.selection.changedPaths.join(',')!=='services/market-operation-guard.js'||
            p.selection.selected.join(',')!=='MARKET'||
            p.summary.ownerErrors!==0||
            p.summary.status!=='BUSINESS_CONTRADICTION_FOUND'||
            !p.summary.observedSignals.includes('MK2_MARKET_OPERATION_POLICY_VIOLATION')||
            p.observations[0].sourceMutantIdProvided!==false||
            p.certifiedAutonomousUnknownBugDiscovery!==false)
            throw Error('V48 failed open unregistered policy regression discovery');
          console.log('AUDITOR_V48_OPEN_NEW_FAULT_DISCOVERED',JSON.stringify(p.summary));
          NODE
          git restore -- "$target"
          trap - EXIT
          test -z "$(git status --porcelain -- "$target")"
      - name: V49 prospective randomized 3-domain owner red-team (open, non-blind)
        run: node tools/business-auditor/v49-prospective-challenge.js --out /tmp/komerce-auditor-v49-prospective
      - name: Archive evidence even on tool failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditor-v4-evidence
          path: |
            /tmp/auditor-v4-schema.log
            /tmp/komerce-auditor-v4-full/*.json
            /tmp/komerce-auditor-v4-full/*.md
            /tmp/komerce-auditor-v4-release/*.json
            /tmp/komerce-auditor-v4-release/*.md
            /tmp/komerce-auditor-g3/*.json
            /tmp/komerce-auditor-g4-adversarial/*.json
            /tmp/komerce-auditor-v45-multi/*.json
            /tmp/komerce-auditor-g2/*.json
            /tmp/komerce-auditor-g2/*.md
            /tmp/komerce-auditor-g2-relay/*.json
            /tmp/komerce-auditor-g2-relay/*.md
            /tmp/komerce-auditor-g5-install/*.json
            /tmp/komerce-auditor-g5-diff/*.json
            /tmp/komerce-auditor-g5-diff/*.md
            /tmp/komerce-auditor-v47-rc/*.json
            /tmp/komerce-auditor-v47-rc/*.md
            /tmp/komerce-auditor-v48-baseline/*.json
            /tmp/komerce-auditor-v48-baseline/*.md
            /tmp/komerce-auditor-v48-novel/*.json
            /tmp/komerce-auditor-v48-novel/*.md
            /tmp/komerce-auditor-v49-prospective/*.json
          if-no-files-found: warn
          retention-days: 14
