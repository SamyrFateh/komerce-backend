name: R&D independent business auditor (offline + local PG)
on:
  push:
    branches:
      - research/golden-continuity-checkpoints-20261026
      - research/business-auditor-v07-writer-qualification-20261028
      - research/business-auditor-v08-sql-calibration-20261028
      - research/business-auditor-v09-sequential-integration-20261028
      - research/business-auditor-v10-executable-bug-hunt-20261028
      - research/business-auditor-v11-multidomain-oracles-20261028
      - research/business-auditor-v12-opus-proof-pivot-20261028
      - research/business-auditor-v13-canonical-parcel-sequences-20261028
      - research/business-auditor-v14-bounded-sequence-explorer-20261028
      - research/business-auditor-v15-physical-concurrency-20261028
      - research/business-auditor-v16-opus-adversarial-repair-20261028
      - research/business-auditor-v17-generated-quantity-matrix-20261028
      - research/business-auditor-v18-serializability-pilot-20261028
      - research/business-auditor-v19-opus-exception-and-determinism-20261028
      - research/business-auditor-v20-negative-stock-control-20261028
      - research/business-auditor-v21-static-pair-selector-20261028
      - research/business-auditor-v22-20261028
      - research/business-auditor-v23-preflight-negative-control-20261028
      - research/business-auditor-v24-durable-intent-counterfactual-20261028
      - research/business-auditor-v25-crash-reconciliation-20261028
      - research/business-auditor-v26-recovery-control-20261028
    paths:
      - .github/workflows/research-independent-business-auditor.yml
      - tools/business-auditor/**
      - tests/unit/auditor-*.test.js
      - tests/e2e-api/**
      - services/**
      - features/**
      - routes/**
      - docs/db/railway-live-schema.sql
      - scripts/audit-logic.js
      - scripts/lib/logic-detectors.js
      - package.json
  pull_request:
    branches:
      - research/business-auditor-v11-multidomain-oracles-20261028
      - research/business-auditor-v12-opus-proof-pivot-20261028
      - research/business-auditor-v13-canonical-parcel-sequences-20261028
      - research/business-auditor-v14-bounded-sequence-explorer-20261028
      - research/business-auditor-v15-physical-concurrency-20261028
      - research/business-auditor-v16-opus-adversarial-repair-20261028
      - research/business-auditor-v17-generated-quantity-matrix-20261028
      - research/business-auditor-v18-serializability-pilot-20261028
      - research/business-auditor-v19-opus-exception-and-determinism-20261028
      - research/business-auditor-v20-negative-stock-control-20261028
      - research/business-auditor-v21-static-pair-selector-20261028
      - research/business-auditor-v22-20261028
      - research/business-auditor-v23-preflight-negative-control-20261028
      - research/business-auditor-v24-durable-intent-counterfactual-20261028
      - research/business-auditor-v25-crash-reconciliation-20261028
      - research/business-auditor-v26-recovery-control-20261028
    paths:
      - .github/workflows/research-independent-business-auditor.yml
      - tools/business-auditor/**
      - tests/unit/auditor-*.test.js
      - tests/e2e-api/**
      - services/**
      - features/**
      - routes/**
      - docs/db/railway-live-schema.sql
      - package.json
permissions:
  contents: read
concurrency:
  group: research-independent-business-auditor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Independent scanner contract + adversarial unit tests (no DB)
        run: node --test tools/business-auditor/engine.test.js tools/business-auditor/cli.test.js tools/business-auditor/static-triage.test.js tools/business-auditor/code-detectors.test.js tools/business-auditor/physical-probes.test.js tools/business-auditor/paypal-refund-boundary.test.js tools/business-auditor/writer-inventory.test.js tools/business-auditor/v07-qualification.test.js tools/business-auditor/v07-import-hints.test.js tools/business-auditor/v08-sql-calibration.test.js tools/business-auditor/v08-owner-proof.test.js tools/business-auditor/evidence-ledger.test.js tools/business-auditor/v09-integration.test.js tools/business-auditor/v10-engine.test.js tools/business-auditor/v12-baseline-gate.test.js tools/business-auditor/v12-physical-parcel-predicate.test.js tools/business-auditor/v13-canonical-parcel-predicate.test.js tools/business-auditor/v13-replay.test.js tools/business-auditor/v14-explorer.test.js tools/business-auditor/v14-baseline-gate.test.js tools/business-auditor/v15-concurrency-predicate.test.js tools/business-auditor/v15-baseline-gate.test.js tools/business-auditor/v16-healing-predicate.test.js tools/business-auditor/v17-quantity-matrix-predicate.test.js tools/business-auditor/v18-serializability-predicate.test.js tools/business-auditor/v19-serializability-predicate.test.js tools/business-auditor/v20-stock-predicate.test.js tools/business-auditor/v21-static-pair-selector.test.js tools/business-auditor/v22-financial-invariants.test.js tools/business-auditor/v23-preflight-mutant.test.js tools/business-auditor/v24-durable-intent-counterfactual.test.js tools/business-auditor/v25-reconciliation-oracle.test.js tools/business-auditor/v26-reconciler.test.js
      - name: V2.1 freeze ranked writer pairs before any physical database experiment
        run: node tools/business-auditor/v21-static-pair-gate.js /tmp/komerce-independent-business-audit/v21-selector
      - name: V2.1 verify source-derived refund pair and dead-code exclusion
        run: |
          node <<'NODE'
          const p=require('/tmp/komerce-independent-business-audit/v21-selector/v21-static-pair-selection.json');
          const x=p.selection;
          const hasRefundCandidate=x.pairs.some(c=>c.table==='refunds'&&
           c.actors.some(a=>a.source==='services/payment-paypal.js')&&
           c.actors.some(a=>a.source==='services/admin-order-refund.js'));
          if(p.contract!=='komerce-frozen-before-DB-pair-selection/v21'||
             p.sha!==process.env.GITHUB_SHA||x.selectionHash.length!==64||
             !x.selectionLockedBeforeDbExecution||!hasRefundCandidate||
             x.pairs.some(c=>c.owner==='utils/refunds.js'))
             throw Error('V2.1 pair-selection reachability/lock review required');
          console.log('BUSINESS_AUDIT_V21_REFUND_PAIR_SELECTED',JSON.stringify({
           hash:x.selectionHash,pairs:x.pairs.length,top:x.pairs.slice(0,5).map(c=>c.id)
          }));
          NODE
      - name: V2.2 pre-DB source-only equivalence classes and economics-weighted rank
        run: node tools/business-auditor/v22-ranking-gate.js /tmp/komerce-independent-business-audit/v22-selector
      - name: V2.2 verify frozen ranking provenance and controlled budgets
        run: |
          node <<'NODE'
          const r=require('/tmp/komerce-independent-business-audit/v22-selector/v22-priority-pairs.json');
          const v=r.ranking;
          if(r.contract!=='komerce-reduction-before-physical-PG/v22'||
             r.sha!==process.env.GITHUB_SHA||
             v.parentSelectionHash!==r.parent.hash||
             v.counts.original!==r.parent.total||
             v.rank.length===0||v.rank.length>v.counts.original||
             v.pr.length>5||v.nightly.length>10||
             v.rank.some(x=>x.policyPreapproved!==false))
            throw Error('V2.2 selector ranking invalid, not frozen or unsafe');
          console.log('BUSINESS_AUDIT_V22_RANK_PROVENANCE',JSON.stringify({
            original:v.counts.original,classes:v.rank.length,
            top:v.rank.slice(0,5).map(x=>x.table+':'+x.score)
          }));
          NODE
      - name: Install existing dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: PayPal ambiguous timeout and replay, mocked HTTP transport only
        run: npx jest --config jest.config.js --runInBand --no-coverage --runTestsByPath tests/unit/auditor-paypal-refund-execution.test.js --json --outputFile=/tmp/komerce-v08-paypal-jest.json
      - name: Bootstrap isolated PostgreSQL test schema
        run: |
          PGPASSWORD=komerce psql -h 127.0.0.1 -U komerce -d komerce_test -v ON_ERROR_STOP=1 -f docs/db/railway-live-schema.sql > /tmp/business-auditor-bootstrap.log
          node scripts/ci-db-bootstrap.js
      - name: Run independent repo + PostgreSQL data audit (read only)
        run: npm run audit:logic:full -- --mode all --out /tmp/komerce-independent-business-audit --sample-limit 20
      - name: V0.6 writer inventory is nonempty and has owner declarations
        run: |
          node -e "const p=require('/tmp/komerce-independent-business-audit/business-audit.json');const w=p.code?.writerInventory;if(!w||w.contract!=='komerce-business-writer-inventory/v1'||w.summary.physicalTableCandidates<50||w.coverage.canonicalSchemaTables<100||w.coverage.featureCardsWithDbDeclarations<15||w.tableSummary.length<10||w.tableSummary.some(t=>t.table==='set'||t.table==='of')||w.summary.confirmedBusinessBugs!==0)process.exit(2);console.log('BUSINESS_AUDIT_WRITER_INVENTORY',JSON.stringify({coverage:w.coverage,summary:w.summary,topTables:w.tableSummary.slice(0,8).map(t=>({table:t.table,writes:t.occurrences,owners:t.explicitOwners,rules:t.primaryGrainRules})),crossDomainExamples:w.crossDomainExamples.slice(0,12),ownerResolutionCounts:w.summary.ownerResolutionCounts}));"
      - name: V0.7 qualify every candidate and refuse unproven authority
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/komerce-independent-business-audit/business-audit.json','utf8'));
          const w=p.code?.writerInventory,q=p.code?.writerQualification;
          if(q?.contract!=='komerce-business-writer-qualification/v1')throw Error('V0.7 missing');
          if(q.summary.occurrences!==w.summary.candidateWrites||
             q.summary.physical!==w.summary.physicalTableCandidates||
             q.summary.unresolved!==w.summary.notProvenTableCandidates)throw Error('V0.7 lost SQL candidates');
          if(q.cases.reduce((n,x)=>n+x.occurrences,0)!==q.summary.occurrences)throw Error('Grouping lost candidates');
          if(q.summary.reviewCases!==q.cases.filter(x=>x.needsReview).length)throw Error('Review accounting mismatch');
          if(q.findings.some(x=>x.authorized||x.runtimeWriteProven||x.confirmedBusinessBug||x.verifiedCallPath))
            throw Error('Static writer mistakenly certified');
          const hints=q.importHints;
          if(hints?.contract!=='komerce-business-route-import-hints/v1'||hints.coverage.writerFiles<40)
           throw Error('Route import scan missing');
          if(hints.coverage.pathsProvenAtRuntime!==0)throw Error('Static route hints mislabeled');
          const paths=hints.pathsByWriter['services/auto-parcel.js']||[];
          if(!paths.some(x=>x.routeFile==='routes/auto-distribute-api.js'&&
             x.files[0]==='routes/auto-distribute-api.js'&&
             x.files.at(-1)==='services/auto-parcel.js'&&!x.runtimePathProven))
           throw Error('Expected real static route import reference missing');
          const md=fs.readFileSync('/tmp/komerce-independent-business-audit/business-audit.md','utf8');
          if(!md.includes('Qualification statique des responsabilités'))throw Error('Markdown summary missing');
          console.log('BUSINESS_AUDIT_V07_QUALIFICATION',JSON.stringify(q.summary));
          NODE
      - name: Fail closed if report lacks explicit seven SQL owner rules
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/komerce-independent-business-audit/business-audit.json'));if(p.contract!=='komerce-independent-business-auditor/v1'||p.data.results.length!==7||p.permissions.dataTarget!=='LOCAL_KOMERCE_TEST_ONLY'||p.code.status!=='STATIC_HEURISTICS_ONLY')process.exit(2);console.log('INDEPENDENT_AUDITOR_PROOF',JSON.stringify({scannedFiles:p.code.scannedFiles,staticSuspicions:p.summary.staticSuspicions,dataRules:p.data.results.length,signals:p.summary.rulesWithEvidence}));"
      - name: Validate code-detector contract without demanding persistence of known bugs
        run: |
          node <<'NODE'
          const r=require('/tmp/komerce-independent-business-audit/business-audit.json');
          const a=r.code?.independentCodeSignals;
          if(!Array.isArray(a)||a.some(x=>!x.file||!x.id||x.verifiedBusinessBug||
             x.productionIncidentConfirmed||x.externalFinancialDuplicateConfirmed))
            throw Error('Static pattern report malformed or self-certified');
          console.log('BUSINESS_AUDIT_CODE_PATTERN_OBSERVED',a.length);
          NODE
      - name: Keep PayPal source-boundary classification conservative
        run: |
          node <<'NODE'
          const r=require('/tmp/komerce-independent-business-audit/business-audit.json');
          const p=r.code?.paypalRefundBoundary;
          if(!p||typeof p.status!=='string'||p.productionDuplicateRefundConfirmed!==false)
            throw Error('PayPal boundary missing or inflated to production incident');
          console.log('BUSINESS_AUDIT_PAYPAL_BOUNDARY',p.status);
          NODE
      - name: Enforce owner-review coverage for known static rule families
        run: |
          node -e "const r=require('/tmp/komerce-independent-business-audit/business-audit.json');if(!r.code?.triage||r.code.triage.length!==r.code.findings.length||!r.code.reviewSummary||r.code.reviewSummary.currentReviewsVerified!==r.code.triage.length||r.code.reviewSummary.staleOrUnknownReviews!==0)process.exit(2);console.log('BUSINESS_AUDIT_TRIAGE',JSON.stringify({total:r.code.triage.length,reviewed:r.code.triage.filter(x=>x.reviewedFromSource).length,unreviewed:r.code.triage.filter(x=>!x.reviewedFromSource).map(x=>({file:x.file,rule:x.rule})),targeted:r.code.reviewSummary.targetedCandidateCount,current:r.code.reviewSummary.currentReviewsVerified,stale:r.code.reviewSummary.staleOrUnknownReviews,groups:r.code.reviewSummary.byReview}));"
      - name: Inventory static findings for owner triage (no source snippets)
        run: |
          node -e "const r=require('/tmp/komerce-independent-business-audit/business-audit.json');for(const f of r.code.findings)console.log('BUSINESS_AUDIT_STATIC '+JSON.stringify({rule:f.rule,priority:f.priority,file:f.file,line:f.line,category:f.category}));"
      - name: V0.8 real PostgreSQL nominal plus adversarial detector calibration
        run: node tools/business-auditor/v08-sql-calibration.js --out /tmp/komerce-independent-business-audit/v08-sql-calibration.json
      - name: V0.8 fail closed unless all seven pairs and rollbacks pass
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/komerce-independent-business-audit/v08-sql-calibration.json','utf8'));
          if(p.contract!=='komerce-business-sql-calibration/v08'||p.results?.length!==7||
             p.summary.rulesCalibrated!==7||p.summary.nominalPassed!==7||
             p.summary.adversarialDetected!==7||p.summary.rollbackPassed!==7||
             p.summary.businessWriterExecutions!==0||p.summary.confirmedBusinessBugs!==0)
           throw Error('V0.8 SQL calibration incomplete or mislabeled');
          if(p.results.some(x=>!x.rollbackRestored||x.actualBusinessPathProven||
             x.productionIncidentConfirmed||x.nominal!=='NO_SIGNAL_IN_TEMP_FIXTURE'||
             x.adversarial!=='INJECTED_COUNTEREXAMPLE_FOUND'))
           throw Error('V0.8 proof classification invalid');
          console.log('BUSINESS_AUDIT_V08_PAIRED_SQL_PROOF',JSON.stringify(p.summary));
          NODE
      - name: V0.8 verify actual owner and client replay tests in same CI run
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const {qualifyPayPalJest}=require('./tools/business-auditor/v08-owner-proof');
          const jestReport=JSON.parse(fs.readFileSync('/tmp/komerce-v08-paypal-jest.json','utf8'));
          const e=qualifyPayPalJest(jestReport,{sha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID});
          fs.writeFileSync('/tmp/komerce-independent-business-audit/v08-owner-replay.json',
           JSON.stringify(e,null,2)+'\n');
          console.log('BUSINESS_AUDIT_V08_OWNER_REPLAY',JSON.stringify({tests:e.testsPassed,provider:e.provider,
           duplicateMoneyMovementProven:e.duplicateMoneyMovementProven,run:e.runId}));
          NODE
      - name: V0.9 integrate same-run qualified write ledger with paired proof artifacts
        run: node tools/business-auditor/v09-integration.js /tmp/komerce-independent-business-audit
      - name: V0.9 fail closed on missing source cases or inflated certification
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const f='/tmp/komerce-independent-business-audit/v09-evidence.json';
          const p=JSON.parse(fs.readFileSync(f,'utf8'));
          const w=JSON.parse(fs.readFileSync('/tmp/komerce-independent-business-audit/business-audit.json','utf8')).code.writerInventory;
          if(p.contract!=='komerce-independent-business-evidence/v09'||
             p.sha!==process.env.GITHUB_SHA||p.runId!==process.env.GITHUB_RUN_ID||
             p.summary.candidateOccurrences!==w.summary.candidateWrites||
             p.summary.physicalOccurrences!==w.summary.physicalTableCandidates||
             p.summary.unresolvedOccurrences!==w.summary.notProvenTableCandidates||
             p.summary.pairedSqlDetectors!==7||
             p.summary.mockedOwnerTests!==3||
             p.summary.productionIncidentsConfirmed!==0||
             p.summary.caseCoverageComplete!==false)
           throw Error('V0.9 same-run technical evidence incomplete');
          if(p.ledger.entries.reduce((n,x)=>n+x.occurrenceCount,0)!==w.summary.physicalTableCandidates||
             p.ledger.unresolvedEntries.reduce((n,x)=>n+x.occurrenceCount,0)!==w.summary.notProvenTableCandidates)
           throw Error('V0.9 candidates disappeared');
          console.log('BUSINESS_AUDIT_V09_FULL_RECONCILIATION',JSON.stringify(p.summary));
          NODE
      - name: V1.0 observe actual PayPal refund owner against independent RC-9 replay oracle (fake HTTP)
        env:
          KOMERCE_V10_OBSERVATION_PATH: /tmp/komerce-independent-business-audit/v10-paypal-observation.json
        run: npx jest --config jest.config.js --runInBand --no-coverage --runTestsByPath tests/unit/auditor-v10-paypal-owner-probe.test.js --json --outputFile=/tmp/komerce-independent-business-audit/v10-owner-jest.json
      - name: V1.1 execute real logistics owner with nominal and simulated conflict SQL rowCounts
        env:
          KOMERCE_V11_OBSERVATION_PATH: /tmp/komerce-independent-business-audit/v11-parcel-observation.json
        run: npx jest --config jest.config.js --runInBand --no-coverage --runTestsByPath tests/unit/auditor-v11-auto-parcel-owner-probe.test.js --json --outputFile=/tmp/komerce-independent-business-audit/v11-parcel-jest.json
      - name: V1.0 certify existing and new same-run proofs and write business triage report
        run: npm run audit:business:v1 -- --mode ci --evidence-dir /tmp/komerce-independent-business-audit
      - name: V1.0 reject fabricated production evidence, preserve all source candidates
        run: |
          node <<'NODE'
          const p=require('/tmp/komerce-independent-business-audit/v10-bug-hunt.json');
          const r=p.summary;
          if(p.contract!=='komerce-business-bug-hunter/v1'||
             p.sha!==process.env.GITHUB_SHA||p.runId!==process.env.GITHUB_RUN_ID||
             r.candidateOccurrences!==p.triageQueue.totalOccurrences||
             r.triageCases!==p.triageQueue.cases.length||
             r.reviewCases!==p.triageQueue.cases.filter(x=>x.reviewRequired).length||
             r.calibratedRuntimeOracles!==require('./tools/business-auditor/v10-oracles').ORACLES.length||r.productionIncidentsConfirmed!==0||
             r.completeBusinessCoverage!==false||p.findings.length!==2||
             p.triageQueue.cases.reduce((n,x)=>n+x.occurrences,0)!==r.candidateOccurrences||
             p.findings.some(x=>x.productionIncidentConfirmed!==false)||
             p.findings.some(x=>!['REPRODUCED_CONTROLLED_TEST_INVARIANT_VIOLATION','CONTROLLED_TEST_INVARIANT_SATISFIED']
               .includes(x.verdict)))
            throw Error('V1.0 misclassified or incomplete');
          console.log('BUSINESS_AUDIT_V10_VERDICT',JSON.stringify({
            sha:p.sha,run:p.runId,summary:r,findings:p.findings.map(x=>({oracle:x.id,verdict:x.verdict,observed:x.observed,expected:x.expected}))
          }));
          NODE
      - name: V1.2 reviewed baseline gate distinguishes business drift from tool error
        run: node tools/business-auditor/v12-baseline-gate.js tools/business-auditor/v12-verdict-baseline.json /tmp/komerce-independent-business-audit/v10-bug-hunt.json /tmp/komerce-independent-business-audit/v12-baseline-result.json
      - name: V1.2 independent physical SQL owner witness and predicate (local PG TEMP)
        run: node tools/business-auditor/v12-physical-parcel-gate.js /tmp/komerce-independent-business-audit
      - name: V1.2 require physical oracle baseline (no self-attested JSON)
        run: |
          node <<'NODE'
          const r=require('/tmp/komerce-independent-business-audit/v12-raw-physical-parcel.json');
          const baseline=require('./tools/business-auditor/v12-physical-baseline.json');
          const want=baseline.expected?.['KBA-V12-PHYSICAL-PARCEL-ROWCOUNT'];
          if(baseline.contract!=='komerce-business-physical-baseline/v12'||!want)throw Error('V1.2 physical baseline unreviewed');
          if(r.contract!=='komerce-physical-business-proof/v12'||
             r.sha!==process.env.GITHUB_SHA||r.runId!==process.env.GITHUB_RUN_ID||
             r.verdict.verdict!==want||
             !Array.isArray(r.verdict.mismatches)||
             r.verdict.productionIncidentConfirmed!==false)
            throw Error('V1.2 PHYSICAL_BASELINE_DRIFT: require explicit review; not production proof');
          console.log('BUSINESS_AUDIT_V12_BASELINE_MATCH',JSON.stringify(r.verdict));
          NODE
      - name: V1.3 execute real distribute cancel redistribute sequence on canonical PostgreSQL
        run: node tools/business-auditor/v13-canonical-parcel-gate.js /tmp/komerce-independent-business-audit
      - name: V1.3 independently compare raw state and provisional reviewed business baseline
        run: |
          node <<'NODE'
          const record=require('/tmp/komerce-independent-business-audit/v13-canonical-parcel-proof.json');
          const base=require('./tools/business-auditor/v13-canonical-sequence-baseline.json');
          const {interpret}=require('./tools/business-auditor/v13-canonical-parcel-predicate');
          const fresh=interpret(record.raw),v=record.verdict;
          if(record.contract!=='komerce-canonical-pg-sequence-proof/v13'||
             record.sha!==process.env.GITHUB_SHA||record.runId!==process.env.GITHUB_RUN_ID||
             record.raw.rollbackVerified!==true||
             JSON.stringify(fresh)!==JSON.stringify(v)||
             base.contract!=='komerce-business-sequence-baseline/v13'||
             base.policy!==v.policyAssumption||
             v.verdict!==base.expectedVerdict||
             JSON.stringify(v.issues.map(i=>i.id))!==JSON.stringify(base.expectedSignals)||
             v.productionIncidentConfirmed!==false)
            throw Error('V1.3_CANONICAL_SEQUENCE_BASELINE_DRIFT: investigate controlled business state and source');
          console.log('BUSINESS_AUDIT_V13_BASELINE_MATCH',JSON.stringify({
           scope:v.evidenceLevel,issues:v.issues.map(i=>i.id),rollback:record.raw.rollbackVerified
          }));
          NODE
