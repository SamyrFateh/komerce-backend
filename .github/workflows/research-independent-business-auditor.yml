name: R&D independent business auditor (offline + local PG)
on:
  push:
    branches:
      - research/golden-continuity-checkpoints-20261026
      - research/business-auditor-v07-writer-qualification-20261028
    paths:
      - .github/workflows/research-independent-business-auditor.yml
      - tools/business-auditor/**
      - tests/unit/auditor-paypal-refund-execution.test.js
      - scripts/audit-logic.js
      - scripts/lib/logic-detectors.js
      - package.json
permissions:
  contents: read
concurrency:
  group: research-independent-business-auditor
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Independent scanner contract + adversarial unit tests (no DB)
        run: node --test tools/business-auditor/engine.test.js tools/business-auditor/cli.test.js tools/business-auditor/static-triage.test.js tools/business-auditor/code-detectors.test.js tools/business-auditor/physical-probes.test.js tools/business-auditor/paypal-refund-boundary.test.js tools/business-auditor/writer-inventory.test.js tools/business-auditor/v07-qualification.test.js tools/business-auditor/v07-import-hints.test.js
      - name: Install existing dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: PayPal ambiguous timeout and replay, mocked HTTP transport only
        run: npx jest --config jest.config.js --runInBand --no-coverage --runTestsByPath tests/unit/auditor-paypal-refund-execution.test.js
      - name: Bootstrap isolated PostgreSQL test schema
        run: |
          PGPASSWORD=komerce psql -h 127.0.0.1 -U komerce -d komerce_test -v ON_ERROR_STOP=1 -f docs/db/railway-live-schema.sql > /tmp/business-auditor-bootstrap.log
          node scripts/ci-db-bootstrap.js
      - name: Run independent repo + PostgreSQL data audit (read only)
        run: npm run audit:logic:full -- --mode all --out /tmp/komerce-independent-business-audit --sample-limit 20
      - name: V0.6 writer inventory is nonempty and has owner declarations
        run: |
          node -e "const p=require('/tmp/komerce-independent-business-audit/business-audit.json');const w=p.code?.writerInventory;if(!w||w.contract!=='komerce-business-writer-inventory/v1'||w.summary.physicalTableCandidates<50||w.coverage.canonicalSchemaTables<100||w.coverage.featureCardsWithDbDeclarations<15||w.tableSummary.length<10||w.tableSummary.some(t=>t.table==='set'||t.table==='of')||w.summary.confirmedBusinessBugs!==0)process.exit(2);console.log('BUSINESS_AUDIT_WRITER_INVENTORY',JSON.stringify({coverage:w.coverage,summary:w.summary,topTables:w.tableSummary.slice(0,8).map(t=>({table:t.table,writes:t.occurrences,owners:t.explicitOwners,rules:t.primaryGrainRules})),crossDomainExamples:w.crossDomainExamples.slice(0,12),ownerResolutionCounts:w.summary.ownerResolutionCounts}));"
      - name: V0.7 qualify every candidate and refuse unproven authority
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/komerce-independent-business-audit/business-audit.json','utf8'));
          const w=p.code?.writerInventory,q=p.code?.writerQualification;
          if(q?.contract!=='komerce-business-writer-qualification/v1')throw Error('V0.7 missing');
          if(q.summary.occurrences!==w.summary.candidateWrites||
             q.summary.physical!==w.summary.physicalTableCandidates||
             q.summary.unresolved!==w.summary.notProvenTableCandidates)throw Error('V0.7 lost SQL candidates');
          if(q.cases.reduce((n,x)=>n+x.occurrences,0)!==q.summary.occurrences)throw Error('Grouping lost candidates');
          if(q.summary.reviewCases!==q.cases.filter(x=>x.needsReview).length)throw Error('Review accounting mismatch');
          if(q.findings.some(x=>x.authorized||x.runtimeWriteProven||x.confirmedBusinessBug||x.verifiedCallPath))
            throw Error('Static writer mistakenly certified');
          const hints=q.importHints;
          if(hints?.contract!=='komerce-business-route-import-hints/v1'||hints.coverage.writerFiles<40)
           throw Error('Route import scan missing');
          if(hints.coverage.pathsProvenAtRuntime!==0)throw Error('Static route hints mislabeled');
          const paths=hints.pathsByWriter['services/auto-parcel.js']||[];
          if(!paths.some(x=>x.routeFile==='routes/auto-distribute-api.js'&&
             x.files[0]==='routes/auto-distribute-api.js'&&
             x.files.at(-1)==='services/auto-parcel.js'&&!x.runtimePathProven))
           throw Error('Expected real static route import reference missing');
          const md=fs.readFileSync('/tmp/komerce-independent-business-audit/business-audit.md','utf8');
          if(!md.includes('Qualification statique des responsabilités'))throw Error('Markdown summary missing');
          console.log('BUSINESS_AUDIT_V07_QUALIFICATION',JSON.stringify(q.summary));
          NODE
      - name: Fail closed if report lacks explicit seven SQL owner rules
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/komerce-independent-business-audit/business-audit.json'));if(p.contract!=='komerce-independent-business-auditor/v1'||p.data.results.length!==7||p.permissions.dataTarget!=='LOCAL_KOMERCE_TEST_ONLY'||p.code.status!=='STATIC_HEURISTICS_ONLY')process.exit(2);console.log('INDEPENDENT_AUDITOR_PROOF',JSON.stringify({scannedFiles:p.code.scannedFiles,staticSuspicions:p.summary.staticSuspicions,dataRules:p.data.results.length,signals:p.summary.rulesWithEvidence}));"
      - name: Assert independent source-control-flow detector observed both live parcel writers
        run: |
          node -e "const r=require('/tmp/komerce-independent-business-audit/business-audit.json');const a=r.code?.independentCodeSignals||[];if(!a.some(x=>x.file==='services/auto-parcel.js')||!a.some(x=>x.file==='services/parcelOptimizationService.js')||!a.some(x=>x.file==='routes/wallet.js'&&x.classification==='TIME_BASED_ADMIN_CREDIT_KEY')||!a.some(x=>x.file==='services/paypal-client.js'&&x.classification==='LEGACY_FALLBACK_WITH_DURABLE_OVERRIDE'))process.exit(2);console.log('BUSINESS_AUDIT_CODE_PATTERN',JSON.stringify(a.map(x=>({file:x.file,line:x.line,id:x.id,counter:x.counter||null,requestKey:x.requestKey||null,class:x.classification||null,priorIssue:x.previousEvidence?.issue||null}))));"
      - name: Fail closed on missing PayPal legacy-refund owner-chain proof
        run: |
          node -e "const p=require('/tmp/komerce-independent-business-audit/business-audit.json');const r=p.code?.paypalRefundBoundary;if(r?.status!=='LIVE_LEGACY_CALL_WITHOUT_DURABLE_REQUEST_KEY'||r.productionDuplicateRefundConfirmed!==false||r.observations.intentLedgerMarkedNotActivated!==true)process.exit(2);console.log('BUSINESS_AUDIT_PAYPAL_REFUND_CHAIN',JSON.stringify(r));"
      - name: Enforce owner-review coverage for known static rule families
        run: |
          node -e "const r=require('/tmp/komerce-independent-business-audit/business-audit.json');if(!r.code?.triage||r.code.triage.length!==r.code.findings.length||!r.code.reviewSummary||r.code.reviewSummary.currentReviewsVerified!==r.code.triage.length||r.code.reviewSummary.staleOrUnknownReviews!==0)process.exit(2);console.log('BUSINESS_AUDIT_TRIAGE',JSON.stringify({total:r.code.triage.length,reviewed:r.code.triage.filter(x=>x.reviewedFromSource).length,unreviewed:r.code.triage.filter(x=>!x.reviewedFromSource).map(x=>({file:x.file,rule:x.rule})),targeted:r.code.reviewSummary.targetedCandidateCount,current:r.code.reviewSummary.currentReviewsVerified,stale:r.code.reviewSummary.staleOrUnknownReviews,groups:r.code.reviewSummary.byReview}));"
      - name: Inventory static findings for owner triage (no source snippets)
        run: |
          node -e "const r=require('/tmp/komerce-independent-business-audit/business-audit.json');for(const f of r.code.findings)console.log('BUSINESS_AUDIT_STATIC '+JSON.stringify({rule:f.rule,priority:f.priority,file:f.file,line:f.line,category:f.category}));"
      - name: Archive independent JSON + Markdown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-auditor-${{ github.run_id }}
          path: /tmp/komerce-independent-business-audit/
          if-no-files-found: ignore
          retention-days: 5
