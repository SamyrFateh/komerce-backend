name: tmp-market-delegation-runtime-bridge

on:
  push:
    branches:
      - fix/market-delegation-runtime-bridge

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-delegation-runtime-bridge
          fetch-depth: 0
      - name: Patch market_operator admission points
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function edit(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) return false;
            fs.writeFileSync(file, after);
            return true;
          }

          function mustReplace(source, from, to, file) {
            if (!source.includes(from)) throw new Error(`${file}: anchor missing: ${from}`);
            return source.replace(from, to);
          }

          edit('routes/admin-dashboard-market.js', source => {
            source = mustReplace(source,
              "const { authenticate, requireAdmin, requireRole } = require('../middleware/auth');",
              "const { authenticate, requireAdmin } = require('../middleware/auth');\nconst { requireRoleWithMarketDelegation } = require('../middleware/require-market-delegated-role');",
              'routes/admin-dashboard-market.js');
            source = mustReplace(source, 'const requireCanonicalContextRole = requireRole(', 'const requireCanonicalContextRole = requireRoleWithMarketDelegation(', 'routes/admin-dashboard-market.js');
            source = mustReplace(source, 'const requireMarketDashboardReadRole = requireRole(', 'const requireMarketDashboardReadRole = requireRoleWithMarketDelegation(', 'routes/admin-dashboard-market.js');
            source = source.replace('middleware/auth, middleware/require-market-scope', 'middleware/auth, middleware/require-market-delegated-role, middleware/require-market-scope');
            return source;
          });

          edit('routes/admin-pricing-workspace.js', source => {
            source = mustReplace(source,
              "const { authenticate, requireRole } = require('../middleware/auth');",
              "const { authenticate } = require('../middleware/auth');\nconst { requireRoleWithMarketDelegation } = require('../middleware/require-market-delegated-role');",
              'routes/admin-pricing-workspace.js');
            source = mustReplace(source, "requireRole(['admin', 'market_operator'])", "requireRoleWithMarketDelegation(['admin', 'market_operator'])", 'routes/admin-pricing-workspace.js');
            source = source.replace('middleware/auth.js, middleware/require-pricing-global-authority.js', 'middleware/auth.js, middleware/require-market-delegated-role.js, middleware/require-pricing-global-authority.js');
            return source;
          });

          edit('routes/admin-operations-workspace.js', source => {
            source = mustReplace(source,
              "const { authenticate, requireRole } = require('../middleware/auth');",
              "const { authenticate, requireRole } = require('../middleware/auth');\nconst { requireRoleWithMarketDelegation } = require('../middleware/require-market-delegated-role');",
              'routes/admin-operations-workspace.js');
            source = mustReplace(source, "const requireWorkspaceReadRole = requireRole(['admin', 'agent_hub', 'agent_relais', 'market_operator']);", "const requireWorkspaceReadRole = requireRoleWithMarketDelegation(['admin', 'agent_hub', 'agent_relais', 'market_operator']);", 'routes/admin-operations-workspace.js');
            source = source.replace('middleware/auth, middleware/require-market-scope', 'middleware/auth, middleware/require-market-delegated-role, middleware/require-market-scope');
            return source;
          });

          edit('routes/admin/partners.js', source => {
            source = mustReplace(source,
              "const { authenticate, requireRole } = require('../../middleware/auth');",
              "const { authenticate } = require('../../middleware/auth');\nconst { requireRoleWithMarketDelegation } = require('../../middleware/require-market-delegated-role');",
              'routes/admin/partners.js');
            source = mustReplace(source, "const guard = [authenticate, requireRole(['admin', 'market_operator']), attachAuthorizedMarketsForOperator];", "const guard = [authenticate, requireRoleWithMarketDelegation(['admin', 'market_operator']), attachAuthorizedMarketsForOperator];", 'routes/admin/partners.js');
            source = source.replace('middleware/auth.js, middleware/require-market-scope.js', 'middleware/auth.js, middleware/require-market-delegated-role.js, middleware/require-market-scope.js');
            return source;
          });

          edit('routes/hub.js', source => {
            source = mustReplace(source,
              "const { authenticate, requireRole } = require('../middleware/auth');",
              "const { authenticate, requireRole } = require('../middleware/auth');\nconst { requireRoleWithMarketDelegation } = require('../middleware/require-market-delegated-role');",
              'routes/hub.js');
            source = mustReplace(source, "const hubRead = [authenticate, requireRole(['admin', 'agent_hub', 'market_operator']), attachAuthorizedMarketsForOperator];", "const hubRead = [authenticate, requireRoleWithMarketDelegation(['admin', 'agent_hub', 'market_operator']), attachAuthorizedMarketsForOperator];", 'routes/hub.js');
            source = source.replace('middleware/auth.js, middleware/require-market-scope.js', 'middleware/auth.js, middleware/require-market-delegated-role.js, middleware/require-market-scope.js');
            return source;
          });

          edit('routes/hub-dashboard.js', source => {
            source = mustReplace(source,
              "const { authenticate, requireRole } = require('../middleware/auth');",
              "const { authenticate, requireRole } = require('../middleware/auth');\nconst { requireRoleWithMarketDelegation } = require('../middleware/require-market-delegated-role');",
              'routes/hub-dashboard.js');
            source = mustReplace(source, "const hubRead      = [authenticate, requireRole(['admin', 'agent_hub', 'market_operator']), attachAuthorizedMarketsForOperator];", "const hubRead      = [authenticate, requireRoleWithMarketDelegation(['admin', 'agent_hub', 'market_operator']), attachAuthorizedMarketsForOperator];", 'routes/hub-dashboard.js');
            source = mustReplace(source, "const hubSupervise = [authenticate, requireRole(['admin', 'agent_hub', 'market_operator']), attachAuthorizedMarketsForOperator];", "const hubSupervise = [authenticate, requireRoleWithMarketDelegation(['admin', 'agent_hub', 'market_operator']), attachAuthorizedMarketsForOperator];", 'routes/hub-dashboard.js');
            source = source.replace('middleware/auth.js, middleware/require-market-scope.js', 'middleware/auth.js, middleware/require-market-delegated-role.js, middleware/require-market-scope.js');
            return source;
          });

          edit('routes/relay-dashboard.js', source => {
            source = mustReplace(source,
              "const { authenticate, requireRole } = require('../middleware/auth');",
              "const { authenticate } = require('../middleware/auth');\nconst { requireRoleWithMarketDelegation } = require('../middleware/require-market-delegated-role');",
              'routes/relay-dashboard.js');
            source = mustReplace(source, "router.use(authenticate, requireRole(['admin', 'agent_relais', 'market_operator']), attachAuthorizedMarketsForOperator);", "router.use(authenticate, requireRoleWithMarketDelegation(['admin', 'agent_relais', 'market_operator']), attachAuthorizedMarketsForOperator);", 'routes/relay-dashboard.js');
            source = source.replace('middleware/auth.js, middleware/require-market-scope.js', 'middleware/auth.js, middleware/require-market-delegated-role.js, middleware/require-market-scope.js');
            return source;
          });
          NODE

          if git diff --quiet; then
            echo "No route patch needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/
          git commit -m "fix(market-delegation): brancher le rôle runtime sur les surfaces marché"
          git push origin HEAD:fix/market-delegation-runtime-bridge
