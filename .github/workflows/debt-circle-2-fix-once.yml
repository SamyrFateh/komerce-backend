name: One-off debt circle 2 payoff

on:
  push:
    branches:
      - audit/debt-circle-2

permissions:
  contents: write

jobs:
  payoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/debt-circle-2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm --prefix public/boutique ci

      - name: Apply permanent second-circle fixes
        run: node scripts/debt-circle-2-fix-once.js

      - name: Prove zero baselines and suppression hygiene
        run: |
          node scripts/feature-schema-check.js --strict --full
          node scripts/docs-history-lint.js --strict --full
          node scripts/impact-suppression-check.js
          node <<'NODE'
          const fs = require('fs');
          const docs = JSON.parse(fs.readFileSync('scripts/.docs-history-lint-baseline.json', 'utf8')).exempt || [];
          const features = JSON.parse(fs.readFileSync('scripts/.feature-schema-tests-baseline.json', 'utf8')).exempt || [];
          const suppressions = JSON.parse(fs.readFileSync('scripts/impact-suppressions.json', 'utf8'));
          if (docs.length !== 0) throw new Error(`docs baseline must be 0, got ${docs.length}`);
          if (features.length !== 0) throw new Error(`feature-schema baseline must be 0, got ${features.length}`);
          if (suppressions.length !== 20) throw new Error(`expected 20 live named suppressions, got ${suppressions.length}`);
          if (!fs.existsSync('docs/_archive/architecture/CHALLENGE_FULFILLMENT_MIXTE_2026-09-04.md')) throw new Error('historical architecture challenge was not archived');
          if (fs.existsSync('docs/architecture/CHALLENGE_FULFILLMENT_MIXTE_2026-09-04.md')) throw new Error('historical architecture challenge still lives in active docs');
          console.log('✅ Baselines 29→0 and 10→0; suppressions 21→20 live; active dated doc debt 1→0.');
          NODE

      - name: Prove Boutique recommendations behavior
        run: |
          cd public/boutique
          npx jest tests/unit/b-modal-suggestions.test.js --runInBand

      - name: Prove core governance remains coherent
        run: |
          npm run feature:registry
          npm run feature:check
          node scripts/map-check.js

      - name: Commit permanent payoff
        run: |
          git config user.name "komerce-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/.docs-history-lint-baseline.json \
            scripts/.feature-schema-tests-baseline.json \
            scripts/docs-history-lint.js \
            scripts/feature-schema-check.js \
            scripts/impact-suppressions.json \
            scripts/impact-suppression-check.js \
            scripts/map-check.js \
            public/boutique/features/recommendations.feature.js \
            public/boutique/features/auth-passkey.feature.js \
            features/infrastructure.feature.js \
            package.json \
            .github/workflows/pr-enforcement.yml \
            docs/architecture/CHALLENGE_FULFILLMENT_MIXTE_2026-09-04.md \
            docs/_archive/architecture/CHALLENGE_FULFILLMENT_MIXTE_2026-09-04.md
          git commit -m "fix(governance): pay down second-circle debt"
          git push origin HEAD:audit/debt-circle-2
