name: One-off debt circle 2 payoff

on:
  push:
    branches:
      - audit/debt-circle-2

permissions:
  contents: write

jobs:
  payoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/debt-circle-2
          fetch-depth: 1
      - name: Fetch main for diff-based gates
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm --prefix public/boutique ci

      - name: Apply permanent second-circle fixes
        run: |
          node scripts/debt-circle-2-fix-once.js
          node scripts/debt-circle-2-fix-2-once.js
          node scripts/debt-circle-2-fix-3-once.js

      - name: Remove one-off tooling and create preliminary clean head
        run: |
          rm -f \
            .github/workflows/debt-circle-2-audit-once.yml \
            .github/workflows/debt-circle-2-fix-once.yml \
            scripts/debt-circle-2-fix-once.js \
            scripts/debt-circle-2-fix-2-once.js \
            scripts/debt-circle-2-fix-3-once.js
          git config user.name "komerce-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): pay down second-circle debt"

      - name: Hydrate canonical projections on clean head
        run: |
          npm run arch:gen
          npm run business-graph:gen
          npm run boutique:360
          npm run gate:findings:gen
          npm run feature:360:gen
          git add -A
          git commit --amend --no-edit

      - name: Prove zero debt inventories on final head
        run: |
          node scripts/feature-schema-check.js --strict --full
          node scripts/docs-history-lint.js --strict --full
          node scripts/impact-suppression-check.js
          npm run boutique:360:check
          node <<'NODE'
          const fs = require('fs');
          const docs = JSON.parse(fs.readFileSync('scripts/.docs-history-lint-baseline.json', 'utf8')).exempt || [];
          const features = JSON.parse(fs.readFileSync('scripts/.feature-schema-tests-baseline.json', 'utf8')).exempt || [];
          const suppressions = JSON.parse(fs.readFileSync('scripts/impact-suppressions.json', 'utf8'));
          const boutique = JSON.parse(fs.readFileSync('scripts/.boutique-360-baseline.json', 'utf8'));
          if (docs.length !== 0) throw new Error(`docs baseline must be 0, got ${docs.length}`);
          if (features.length !== 0) throw new Error(`feature-schema baseline must be 0, got ${features.length}`);
          if (suppressions.length !== 20) throw new Error(`expected 20 live named suppressions, got ${suppressions.length}`);
          for (const key of ['orphanEmit','orphanListen','undeclared','notFoundEndpoints','ownershipRed','ownershipOrange']) {
            if ((boutique[key] || []).length !== 0) throw new Error(`Boutique baseline ${key} must be zero`);
          }
          if (!fs.existsSync('docs/_archive/architecture/CHALLENGE_FULFILLMENT_MIXTE_2026-09-04.md')) throw new Error('historical architecture challenge was not archived');
          if (fs.existsSync('docs/architecture/CHALLENGE_FULFILLMENT_MIXTE_2026-09-04.md')) throw new Error('historical architecture challenge still lives in active docs');
          console.log('✅ Docs 29→0; feature-schema 10→0; impact 21→20 live / 0 stale; Boutique ownership baseline 1→0.');
          NODE

      - name: Prove declared Boutique consumers behavior
        run: |
          cd public/boutique
          npx jest \
            tests/unit/b-modal-suggestions.test.js \
            tests/unit/local-stock-badge-mount.test.js \
            tests/unit/spike-vertical-shell.test.js \
            --runInBand

      - name: Prove feature ownership and full reconstruction on final head
        run: |
          npm run feature:registry
          npm run feature:check
          node scripts/map-check.js
          git diff --exit-code

      - name: Push proven final head
        run: git push origin HEAD:audit/debt-circle-2
