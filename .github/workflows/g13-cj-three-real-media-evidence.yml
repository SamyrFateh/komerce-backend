# Owner-only real image bytes evidence, pinned staging target, NO catalog mutations.
name: G13 CJ3 actual media evidence read-only
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-g13-cj3-real-media
  cancel-in-progress: false
jobs:
  collect:
    if: github.actor == github.repository_owner && github.event.issue.title == '[staging-op] g13-cj-three-real-media-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_ACTIONS: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      PGOPTIONS: '-c default_transaction_read_only=on'
      G13_MEDIA_SCOPE: cj-three-authentic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch CJ media as real immutable image evidence (not approval)
        run: node scripts/recette/g13-cj-three-real-media-evidence.js
      - name: Preserve authentic image bytes and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-cj3-real-media-${{ github.run_id }}
          path: test-results/g13-cj-visual-evidence/
          retention-days: 21
          if-no-files-found: error
