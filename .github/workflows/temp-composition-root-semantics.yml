name: Temporary composition root semantics

on:
  push:
    branches:
      - governance/composition-root-semantics

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/composition-root-semantics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply composition-root semantics fix
        run: node scripts/temp-composition-root-semantics.js
      - name: Remove temporary tooling before canonical generation
        run: rm .github/workflows/temp-composition-root-semantics.yml scripts/temp-composition-root-semantics.js
      - name: Run semantics regressions
        run: npx jest tests/unit/business-graph-warning-semantics.test.js --runInBand
      - name: Refresh canonical governance projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Prove debt semantics and gates
        shell: bash
        run: |
          npm run business-graph:check
          node scripts/business-graph-ratchet-check.js
          npm run feature:360:check
          node scripts/feature-guard.js --strict
          node - <<'NODE'
          const m = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const debt = m.drifts.debt || [];
          const expected = m.drifts.expectedTopology || [];
          const observedDebt = debt.filter(x => x.type === 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY');
          const wiringPairs = (m.o6 && m.o6.pairClassifications || []).filter(p =>
            p.family === 'COMPOSITION_ROOT_WIRING' &&
            p.policy === 'application-wiring-not-consumption' &&
            p.exceptionRequired === false
          );
          const wiringRefs = new Set(wiringPairs.map(p => `${p.from} -> ${p.to}`));
          const wiringDebt = observedDebt.filter(x => wiringRefs.has(String(x.ref)));
          const wiringExpected = expected.filter(x => x.type === 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY' && wiringRefs.has(String(x.ref)));
          console.log({ summary: m.drifts.summary, observedDebt: observedDebt.length, wiringPairs: wiringPairs.length, wiringDebt: wiringDebt.length, wiringExpected: wiringExpected.length });
          if (m.drifts.summary.signals !== 85) throw new Error(`raw signal count changed: ${m.drifts.summary.signals}`);
          if (m.drifts.summary.debt !== 52) throw new Error(`expected debt=52, got ${m.drifts.summary.debt}`);
          if (m.drifts.summary.expectedTopology !== 25) throw new Error(`expected expectedTopology=25, got ${m.drifts.summary.expectedTopology}`);
          if (m.drifts.summary.generatorLimitations !== 8) throw new Error(`expected tool-limit=8, got ${m.drifts.summary.generatorLimitations}`);
          if (observedDebt.length !== 26) throw new Error(`expected observed debt=26, got ${observedDebt.length}`);
          if (wiringDebt.length !== 0) throw new Error(`composition wiring still counted as debt: ${JSON.stringify(wiringDebt)}`);
          if (wiringExpected.length !== 13) throw new Error(`expected 13 wiring signals reclassified, got ${wiringExpected.length}`);
          NODE
          git diff --check
      - name: Commit final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): classify composition wiring outside debt"
          git push origin HEAD:governance/composition-root-semantics
