name: Category Context V2 Visual Audit

on:
  push:
    branches:
      - feat/desktop-category-context-v2

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-category-context-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install Boutique and Chromium
        run: |
          npm --prefix public/boutique ci
          cd public/boutique
          npx playwright install --with-deps chromium

      - name: Create deterministic visual audit spec
        shell: bash
        run: |
          cat > public/boutique/tests/e2e/category-context-v2-audit.spec.js <<'EOF'
          'use strict';
          const { test, expect } = require('@playwright/test');
          const fs = require('fs');
          const path = require('path');

          const VIEWPORTS = [
            { name: 'desktop-1280', width: 1280, height: 800 },
            { name: 'desktop-1440', width: 1440, height: 900 },
          ];

          async function prepare(page, vp) {
            await page.setViewportSize({ width: vp.width, height: vp.height });
            await page.addInitScript(() => {
              window.KOMERCE_FORCE_FALLBACK_CATEGORIES = true;
            });
            await page.route(/\/api\//, async route => {
              const url = route.request().url();
              let body = {};
              if (/\/api\/products/.test(url)) body = [];
              if (/\/api\/boutique\/suggestions/.test(url)) body = { suggestions: [] };
              if (/\/api\/auth\/me/.test(url)) return route.fulfill({ status: 401, contentType: 'application/json', body: '{}' });
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
            });
            await page.goto('/boutique/index.html', { waitUntil: 'domcontentloaded' });
            await page.evaluate(async () => {
              document.documentElement.classList.add('k-home-premium-v1');
              const { renderSubcatRail } = await import('/boutique/js/controllers/home-controller.js');
              renderSubcatRail('Mode & Beauté', { count: 383 });
            });
            await page.waitForSelector('#k-subcats-wrap .k-subcutout-context', { state: 'visible' });
            await page.waitForTimeout(250);
          }

          for (const vp of VIEWPORTS) {
            test(`${vp.name} — contexte catégorie ouvert`, async ({ page }) => {
              await prepare(page, vp);

              const metrics = await page.evaluate(() => {
                const wrap = document.querySelector('#k-subcats-wrap');
                const context = wrap.querySelector('.k-subcutout-context');
                const back = wrap.querySelector('.k-subcutout-back');
                const title = wrap.querySelector('.k-subcutout-title');
                const count = wrap.querySelector('.k-subcutout-count');
                const rail = wrap.querySelector('.k-subcutout-rail');
                const items = [...wrap.querySelectorAll('.k-subcutout')];
                const first = items[0];
                const activeLine = first ? getComputedStyle(first, '::after') : null;
                const cs = el => getComputedStyle(el);
                const rect = el => {
                  const r = el.getBoundingClientRect();
                  return { x:r.x, y:r.y, width:r.width, height:r.height, right:r.right, bottom:r.bottom };
                };
                return {
                  viewport: { width: innerWidth, height: innerHeight },
                  wrap: { ...rect(wrap), borderTopWidth: cs(wrap).borderTopWidth, background: cs(wrap).backgroundColor },
                  context: rect(context),
                  back: {
                    ...rect(back),
                    text: back.textContent.trim(),
                    borderWidth: cs(back).borderWidth,
                    borderRadius: cs(back).borderRadius,
                    background: cs(back).backgroundColor,
                    color: cs(back).color,
                  },
                  title: { ...rect(title), text:title.textContent.trim(), fontSize:cs(title).fontSize, fontWeight:cs(title).fontWeight },
                  count: { ...rect(count), text:count.textContent.trim(), borderWidth:cs(count).borderWidth },
                  rail: { ...rect(rail), clientWidth:rail.clientWidth, scrollWidth:rail.scrollWidth, gap:cs(rail).gap },
                  items: items.map(el => ({ ...rect(el), label:el.textContent.trim(), borderWidth:cs(el).borderWidth, borderRadius:cs(el).borderRadius, background:cs(el).backgroundColor })),
                  activeUnderlineWidth: activeLine?.width || null,
                };
              });

              fs.mkdirSync(path.join(process.cwd(), 'visual-audit'), { recursive: true });
              fs.writeFileSync(
                path.join(process.cwd(), 'visual-audit', `${vp.name}.json`),
                JSON.stringify(metrics, null, 2)
              );

              const wrap = page.locator('#k-subcats-wrap');
              await wrap.screenshot({ path: `visual-audit/${vp.name}-context.png` });
              await page.screenshot({ path: `visual-audit/${vp.name}-viewport.png`, fullPage: false });

              expect(metrics.back.text).toContain('Toutes les catégories');
              expect(metrics.back.borderWidth).toBe('0px');
              expect(metrics.back.borderRadius).toBe('0px');
              expect(metrics.wrap.borderTopWidth).toBe('0px');
              expect(metrics.count.borderWidth).toBe('0px');
              expect(metrics.title.fontSize).toBe('14px');
              expect(metrics.rail.scrollWidth).toBeLessThanOrEqual(metrics.rail.clientWidth + 2);
              expect(metrics.wrap.height).toBeLessThanOrEqual(100);
              expect(metrics.items.length).toBe(5);
              for (const item of metrics.items) {
                expect(item.borderWidth).toBe('0px');
                expect(item.background).toBe('rgba(0, 0, 0, 0)');
                expect(item.height).toBeGreaterThanOrEqual(58);
              }
              expect(parseFloat(metrics.activeUnderlineWidth)).toBeGreaterThanOrEqual(20);
            });
          }
          EOF

      - name: Run Chromium local-only visual audit
        working-directory: public/boutique
        run: npx playwright test tests/e2e/category-context-v2-audit.spec.js --project='Chromium Local-Only' --workers=1

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: category-context-v2-visual
          path: public/boutique/visual-audit/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary visual workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/category-context-v2-visual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/category-context-v2-visual.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(qa): remove category context visual harness"
            git push origin HEAD:feat/desktop-category-context-v2
          fi
