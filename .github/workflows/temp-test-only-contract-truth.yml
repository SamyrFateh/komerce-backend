name: Temporary test-only and contract truth

on:
  push:
    branches:
      - governance/test-only-and-contract-truth

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/test-only-and-contract-truth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply semantic and contract corrections
        run: node scripts/temp-test-only-contract-truth.js
      - name: Remove temporary tooling before canonical generation
        run: rm .github/workflows/temp-test-only-contract-truth.yml scripts/temp-test-only-contract-truth.js
      - name: Run warning semantics regressions
        run: npx jest tests/unit/business-graph-warning-semantics.test.js --runInBand
      - name: Refresh canonical governance projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Prove final dependency truth and gates
        shell: bash
        run: |
          npm run business-graph:check
          node scripts/business-graph-ratchet-check.js
          npm run feature:360:check
          node scripts/feature-guard.js --strict
          node - <<'NODE'
          const m = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const debt = m.drifts.debt || [];
          const expected = m.drifts.expectedTopology || [];
          const observedDebt = debt.filter(x => x.type === 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY');
          const testOnlyExpected = expected.filter(x => {
            if (x.type !== 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY') return false;
            const ref = String(x.ref);
            const [from, to] = ref.split(' -> ');
            const p = (m.o6 && m.o6.pairClassifications || []).find(q => q.from === from && q.to === to);
            return p && p.family === 'NON_RUNTIME_TEST' && p.evidenceRole === 'TEST_ONLY' && p.policy === 'non-runtime-evidence' && p.exceptionRequired === false;
          });
          const refs = observedDebt.map(x => x.ref).sort();
          console.log({ summary: m.drifts.summary, observedDebt: refs, testOnlyExpected: testOnlyExpected.map(x => x.ref).sort() });
          if (m.drifts.summary.signals !== 69) throw new Error(`expected raw signals=69, got ${m.drifts.summary.signals}`);
          if (m.drifts.summary.debt !== 30) throw new Error(`expected debt=30, got ${m.drifts.summary.debt}`);
          if (m.drifts.summary.expectedTopology !== 31) throw new Error(`expected expectedTopology=31, got ${m.drifts.summary.expectedTopology}`);
          if (m.drifts.summary.generatorLimitations !== 8) throw new Error(`expected tool-limit=8, got ${m.drifts.summary.generatorLimitations}`);
          if (observedDebt.length !== 4) throw new Error(`expected 4 observed dependency debts, got ${observedDebt.length}: ${JSON.stringify(refs)}`);
          if (testOnlyExpected.length !== 6) throw new Error(`expected 6 test-only expected-topology signals, got ${testOnlyExpected.length}`);
          const expectedRemaining = [
            'catalog -> orders',
            'decision-signals -> infrastructure',
            'orders -> shared-cart',
            'recommendations -> orders',
          ].sort();
          if (JSON.stringify(refs) !== JSON.stringify(expectedRemaining)) throw new Error(`unexpected remaining observed debts: ${JSON.stringify(refs)}`);
          NODE
          git diff --check
      - name: Commit final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): separate test evidence from runtime contracts"
          git push origin HEAD:governance/test-only-and-contract-truth
