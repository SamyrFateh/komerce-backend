name: Consolidate Boutique B2 Modal Cascade

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b2-modal

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b2-modal
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Remove losing modal and suggestion declarations
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const postcss = require('./public/boutique/node_modules/postcss');

          const root = path.resolve('public/boutique');
          const cssDir = path.join(root, 'css');
          const baseline = JSON.parse(fs.readFileSync(path.join(root, 'scripts/.css-guard-baseline.json'), 'utf8'));
          if (baseline.total !== 43) throw new Error(`Expected cascade baseline 43, got ${baseline.total}`);
          const baselineKeys = new Set(baseline.keys);

          function isModalSelector(selector) {
            return selector.startsWith('#k-modal') || selector.startsWith('#k-modal-suggestions') || selector.startsWith('.k-sug-');
          }
          const modalKeys = baseline.keys.filter(key => isModalSelector(key.split('|||')[0]));
          if (modalKeys.length !== 27) throw new Error(`Expected 27 modal/suggestion keys, got ${modalKeys.length}`);

          function contextOf(rule) {
            let node = rule.parent;
            while (node && node.type !== 'root') {
              if (node.type === 'atrule' && node.name === 'media') return `@media ${node.params} {`;
              node = node.parent;
            }
            return 'global';
          }

          const cache = new Map();
          function load(file) {
            if (!cache.has(file)) {
              const fp = path.join(cssDir, file);
              const raw = fs.readFileSync(fp, 'utf8');
              cache.set(file, { fp, ast: postcss.parse(raw, { from: file }) });
            }
            return cache.get(file);
          }

          const removed = [];
          function removeExact({ file, selector, media = 'global', prop, oldValue }) {
            const { ast } = load(file);
            const matches = [];
            ast.walkRules(rule => {
              if (contextOf(rule) !== media) return;
              const selectors = rule.selectors || [rule.selector];
              if (!selectors.map(s => s.trim()).includes(selector)) return;
              rule.nodes.forEach(node => {
                if (node.type === 'decl' && node.prop === prop && node.value === oldValue) matches.push({ rule, decl: node });
              });
            });
            if (matches.length !== 1) {
              throw new Error(`Expected one losing declaration for ${file} :: ${selector} :: ${media} :: ${prop}:${oldValue}, got ${matches.length}`);
            }
            const key = `${selector}|||${media}|||${prop}`;
            if (!baselineKeys.has(key)) throw new Error(`Refusing non-baseline removal: ${key}`);
            matches[0].decl.remove();
            removed.push({ file, key, oldValue });
          }

          // modal-shell.css -> later modal owners in the same canonical components bundle.
          removeExact({ file:'modal-shell.css', selector:'#k-modal .k-modal-cart-btn', media:'@media (max-width: 899px) {', prop:'height', oldValue:'40px' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal .k-modal-cart-btn', media:'@media (max-width: 899px) {', prop:'width', oldValue:'40px' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal .k-modal-cart-icon', media:'@media (max-width: 899px) {', prop:'height', oldValue:'30px' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal .k-modal-cart-icon', media:'@media (max-width: 899px) {', prop:'width', oldValue:'30px' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal .k-modal-name-row', media:'@media (min-width: 900px) {', prop:'margin-top', oldValue:'14px' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal .k-modal-price-row', media:'@media (min-width: 900px) {', prop:'gap', oldValue:'10px' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal .k-modal-price-row', media:'@media (min-width: 900px) {', prop:'margin-top', oldValue:'12px' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal .k-modal-share-row', media:'@media (min-width: 900px) {', prop:'display', oldValue:'grid' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal .k-modal-suggestions:not(.k-modal-suggestions--desktop-list)', media:'@media (min-width: 900px) {', prop:'padding', oldValue:'28px 36px 48px' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal .k-modal-trust', media:'@media (min-width: 900px) {', prop:'padding', oldValue:'11px 0' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal-suggestions.k-modal-suggestions--desktop-list .k-sug-section + .k-sug-section', media:'@media (min-width: 900px) {', prop:'margin-top', oldValue:'32px' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal-suggestions.k-modal-suggestions--desktop-list .k-sug-title', media:'@media (min-width: 900px) {', prop:'border-bottom', oldValue:'1px solid var(--sand-dark)' });
          removeExact({ file:'modal-shell.css', selector:'#k-modal-suggestions.k-modal-suggestions--desktop-list .k-sug-title', media:'@media (min-width: 900px) {', prop:'margin-bottom', oldValue:'16px' });

          // modal-product.css -> later polish/interactions winners.
          removeExact({ file:'modal-product.css', selector:'#k-modal .k-modal-promo-badge', media:'@media (min-width: 900px) {', prop:'font-size', oldValue:'13px' });
          removeExact({ file:'modal-product.css', selector:'#k-modal .k-modal-promo-badge', media:'@media (min-width: 900px) {', prop:'padding', oldValue:'5px 12px' });
          removeExact({ file:'modal-product.css', selector:'.k-sug-card-actions', prop:'justify-content', oldValue:'flex-end' });
          removeExact({ file:'modal-product.css', selector:'.k-sug-card-bottom', prop:'padding', oldValue:'0 8px 8px' });
          removeExact({ file:'modal-product.css', selector:'.k-sug-promo-badge', prop:'font-size', oldValue:'10px' });
          removeExact({ file:'modal-product.css', selector:'.k-sug-promo-badge', prop:'left', oldValue:'5px' });
          removeExact({ file:'modal-product.css', selector:'.k-sug-promo-badge', prop:'top', oldValue:'5px' });
          removeExact({ file:'modal-product.css', selector:'.k-sug-qty', prop:'color', oldValue:'var(--ocean)' });
          removeExact({ file:'modal-product.css', selector:'.k-sug-qty', prop:'font-size', oldValue:'13px' });

          // Intermediate desktop owner also loses to final polish on margin-bottom.
          removeExact({ file:'modal-product-lot4-hybrid.css', selector:'#k-modal-suggestions.k-modal-suggestions--desktop-list .k-sug-title', media:'@media (min-width: 900px) {', prop:'margin-bottom', oldValue:'12px' });

          // Mobile suggestion owner -> final polish.
          removeExact({ file:'modal-mobile-suggestion-actions.css', selector:'#k-modal .k-sug-card-actions.is-filled .k-sug-qty', media:'@media (max-width: 899px) {', prop:'min-width', oldValue:'22px' });
          removeExact({ file:'modal-mobile-suggestion-actions.css', selector:'#k-modal .k-sug-card-actions.is-filled .k-sug-step', media:'@media (max-width: 899px) {', prop:'width', oldValue:'24px' });
          removeExact({ file:'modal-mobile-suggestion-actions.css', selector:'#k-modal .k-sug-card-actions.is-filled', media:'@media (max-width: 899px) {', prop:'grid-template-columns', oldValue:'24px 22px 24px' });
          removeExact({ file:'modal-mobile-canonical.css', selector:'#k-modal .k-sug-grid', media:'@media (max-width: 899px) {', prop:'gap', oldValue:'10px' });

          // One internal polish conflict uses a grouped rule. Keep the group's max-width
          // for .k-modal-promo-badge, but stop applying that early max-width to .k-sug-promo-badge.
          {
            const file = 'modal-product-polish.css';
            const { ast } = load(file);
            const targetSelectors = ['#k-modal .k-modal-promo-badge', '#k-modal .k-sug-promo-badge'];
            const matches = [];
            ast.walkRules(rule => {
              if (contextOf(rule) !== 'global') return;
              const selectors = (rule.selectors || []).map(s => s.trim());
              if (selectors.length !== 2 || !targetSelectors.every(s => selectors.includes(s))) return;
              const decl = rule.nodes.find(n => n.type === 'decl' && n.prop === 'max-width' && n.value === 'calc(100% - 16px)');
              if (decl) matches.push({ rule, decl });
            });
            if (matches.length !== 1) throw new Error(`Expected one grouped promo max-width, got ${matches.length}`);
            const key = '#k-modal .k-sug-promo-badge|||global|||max-width';
            if (!baselineKeys.has(key)) throw new Error(`Missing expected baseline key ${key}`);
            matches[0].decl.remove();
            const keepModal = postcss.rule({ selector: '#k-modal .k-modal-promo-badge' });
            keepModal.append({ prop:'max-width', value:'calc(100% - 16px)' });
            matches[0].rule.after(keepModal);
            removed.push({ file, key, oldValue:'calc(100% - 16px)', replacement:'modal promo only' });
          }

          if (removed.length !== 28) throw new Error(`Expected 28 physical removals/splits, got ${removed.length}`);
          if (new Set(removed.map(r => r.key)).size !== 27) throw new Error(`Expected 27 unique modal conflict keys`);

          for (const entry of cache.values()) {
            entry.ast.walkRules(rule => {
              if (rule.nodes && rule.nodes.filter(n => n.type !== 'comment').length === 0) rule.remove();
            });
            fs.writeFileSync(entry.fp, entry.ast.toString(), 'utf8');
          }

          function collect(file, selector, media, prop) {
            const parsed = postcss.parse(fs.readFileSync(path.join(cssDir, file), 'utf8'), { from:file });
            const values = [];
            parsed.walkRules(rule => {
              if (contextOf(rule) !== media) return;
              const selectors = rule.selectors || [rule.selector];
              if (!selectors.map(s => s.trim()).includes(selector)) return;
              rule.walkDecls(prop, decl => values.push(decl.value));
            });
            return values;
          }
          function expectValue(file, selector, media, prop, expected) {
            const values = collect(file, selector, media, prop);
            if (!values.includes(expected)) throw new Error(`Expected winner ${file} :: ${selector} :: ${media} :: ${prop}=${expected}; got ${values.join(' <> ')}`);
          }

          expectValue('modal-product-polish.css','#k-modal .k-modal-cart-btn','@media (max-width: 899px) {','width','42px');
          expectValue('modal-product-polish.css','#k-modal .k-modal-cart-btn','@media (max-width: 899px) {','height','42px');
          expectValue('modal-product-polish.css','#k-modal .k-modal-cart-icon','@media (max-width: 899px) {','width','31px');
          expectValue('modal-product-lot4-hybrid.css','#k-modal .k-modal-name-row','@media (min-width: 900px) {','margin-top','10px');
          expectValue('modal-product-lot4-hybrid.css','#k-modal .k-modal-price-row','@media (min-width: 900px) {','gap','12px');
          expectValue('modal-product-lot4-hybrid.css','#k-modal .k-modal-price-row','@media (min-width: 900px) {','margin-top','18px');
          expectValue('modal-product-polish.css','#k-modal .k-modal-promo-badge','@media (min-width: 900px) {','font-size','12px');
          expectValue('modal-product-lot4-hybrid.css','#k-modal .k-modal-share-row','@media (min-width: 900px) {','display','flex');
          expectValue('modal-product-polish.css','#k-modal .k-modal-suggestions:not(.k-modal-suggestions--desktop-list)','@media (min-width: 900px) {','padding','18px 28px 30px');
          expectValue('modal-product-lot4-hybrid.css','#k-modal .k-modal-trust','@media (min-width: 900px) {','padding','0');
          expectValue('modal-product-polish.css','#k-modal .k-sug-card-actions.is-filled','@media (max-width: 899px) {','grid-template-columns','25px 26px 25px');
          expectValue('modal-product-polish.css','#k-modal .k-sug-grid','@media (max-width: 899px) {','gap','8px');
          expectValue('modal-product-polish.css','#k-modal .k-sug-promo-badge','global','max-width','calc(100% - 12px)');
          expectValue('modal-product-polish.css','#k-modal-suggestions.k-modal-suggestions--desktop-list .k-sug-title','@media (min-width: 900px) {','margin-bottom','10px');
          expectValue('interactions.css','.k-sug-card-actions','global','justify-content','space-between');
          expectValue('interactions.css','.k-sug-card-bottom','global','padding','4px 8px 8px');
          expectValue('interactions.css','.k-sug-promo-badge','global','font-size','9px');
          expectValue('interactions.css','.k-sug-promo-badge','global','left','6px');
          expectValue('interactions.css','.k-sug-promo-badge','global','top','6px');
          expectValue('interactions.css','.k-sug-qty','global','color','var(--text-muted)');
          expectValue('interactions.css','.k-sug-qty','global','font-size','11px');

          fs.writeFileSync('/tmp/modal-b2-summary.json', JSON.stringify({
            oldCascade:43,
            modalBefore:27,
            removedConflictKeys:27,
            physicalRemovalsOrSplits:28,
            files:[...cache.keys()].sort(),
          }, null, 2));
          console.log(fs.readFileSync('/tmp/modal-b2-summary.json','utf8'));
          NODE
      - name: Rebuild canonical bundles
        run: npm --prefix public/boutique run deploy:css
      - name: Prove no new CSS debt before lowering ratchet
        run: |
          npm --prefix public/boutique run check:css-guard
          npm --prefix public/boutique run check:css-specificity-guard
      - name: Lower ratchet, prove modal zero, and write report
        run: |
          npm --prefix public/boutique run check:css-guard:save
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('public/boutique');
          const baseline = JSON.parse(fs.readFileSync(path.join(root,'scripts/.css-guard-baseline.json'),'utf8'));
          function isModalSelector(selector) { return selector.startsWith('#k-modal') || selector.startsWith('#k-modal-suggestions') || selector.startsWith('.k-sug-'); }
          const remaining = baseline.keys.filter(k => isModalSelector(k.split('|||')[0]));
          if (baseline.total !== 16) throw new Error(`Expected cascade baseline 16, got ${baseline.total}`);
          if (remaining.length !== 0) throw new Error(`Expected modal/suggestion debt 0, got ${remaining.length}: ${remaining.join('\n')}`);
          const report = [
            '# Boutique CSS Debt — B2-4 modal / PDP ownership',
            '',
            '- Cascade baseline: **43 → 16**',
            '- Modal + suggestion conflicts: **27 → 0**',
            '- Semantic conflict keys removed: **27**',
            '- Physical losing declarations/splits: **28**',
            '- New cascade keys before ratchet save: **0**',
            '- Specificity ratchet: **strict passed; not increased**',
            '',
            'Every touched final winner was verified in its later canonical owner before the ratchet was lowered.',
          ].join('\n') + '\n';
          fs.writeFileSync(path.join(root,'docs/BOUTIQUE_CSS_DEBT_B2_MODAL.md'), report);
          console.log(report);
          NODE
      - name: Commit B2-4 modal consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/modal-shell.css public/boutique/css/modal-product.css public/boutique/css/modal-product-lot4-hybrid.css public/boutique/css/modal-mobile-suggestion-actions.css public/boutique/css/modal-mobile-canonical.css public/boutique/css/modal-product-polish.css public/boutique/css/dist public/boutique/index.html public/boutique/scripts/.css-guard-baseline.json public/boutique/docs/BOUTIQUE_CSS_DEBT_B2_MODAL.md
          git commit -m "refactor(boutique): consolidate modal cascade ownership"
          git push origin HEAD:refactor/boutique-debt-zero-b2-modal
