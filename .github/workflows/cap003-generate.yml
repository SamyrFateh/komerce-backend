name: CAP003 generated artifacts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'feat/cap003-market-signals-v2'
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: cap003-audit-only-jwt-secret
      META_WA_APP_SECRET: cap003-audit-only-app-secret
      META_WA_VERIFY_TOKEN: cap003-audit-only-verify-token
      META_WA_TOKEN: cap003-audit-only-token
      META_WA_PHONE_NUMBER_ID: '000000000000000'
      ADMIN_WHATSAPP: '0000000000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch CAP-003 documentation and contract source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('scripts/contract-generate.js')
          source = contract.read_text()
          route_anchor = """  { prefix: '/api/admin/action-center/signals/{signalRef}/resolve', method: 'post', schema: null },\n"""
          route_add = route_anchor + """  // CAP-003 — Canonical Action Center market-scoped lifecycle\n  { prefix: '/api/admin/action-center/market/{marketCode}', method: 'get', schema: null },\n  { prefix: '/api/admin/action-center/market/{marketCode}/signals/{signalRef}/acknowledge', method: 'post', schema: null },\n  { prefix: '/api/admin/action-center/market/{marketCode}/signals/{signalRef}/snooze', method: 'post', schema: null },\n  { prefix: '/api/admin/action-center/market/{marketCode}/signals/{signalRef}/resolve', method: 'post', schema: null },\n"""
          if route_add not in source:
              assert route_anchor in source
              source = source.replace(route_anchor, route_add, 1)

          response_anchor = """  '/api/admin/action-center/signals/{signalRef}/resolve': { post: { fields: ['ok','action','result'], source: 'test' } },\n"""
          response_add = response_anchor + """  '/api/admin/action-center/market/{marketCode}': { get: { fields: ['scope','summary','signals','pagination'], source: 'test' } },\n  '/api/admin/action-center/market/{marketCode}/signals/{signalRef}/acknowledge': { post: { fields: ['ok','action','result'], source: 'test' } },\n  '/api/admin/action-center/market/{marketCode}/signals/{signalRef}/snooze': { post: { fields: ['ok','action','result'], source: 'test' } },\n  '/api/admin/action-center/market/{marketCode}/signals/{signalRef}/resolve': { post: { fields: ['ok','action','result'], source: 'test' } },\n"""
          if response_add not in source:
              assert response_anchor in source
              source = source.replace(response_anchor, response_add, 1)
          contract.write_text(source)

          schema = Path('docs/SCHEMA.md')
          text = schema.read_text()
          old = "| `signals` | Signaux opérationnels. |"
          new = "| `signals` | Signaux opérationnels et décisionnels. **Migration 222 (2026-09-12, `intended_migration_schema`)** : + `market_id` UUID nullable, FK `markets(id)` ; `NULL` signifie explicitement signal global, une valeur non NULL borne le lifecycle au Market ID canonique résolu côté serveur. L’identité active devient `(signal_type, market_id, entity_type, entity_id)` pour éviter tout écrasement cross-market. |"
          assert old in text or new in text
          if new not in text:
              text = text.replace(old, new, 1)
          schema.write_text(text)
          PY
      - name: Generate contract
        run: node scripts/contract-generate.js
      - name: Generate Security 360
        run: npm run security:360
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cap003-generated
          path: |
            scripts/contract-generate.js
            docs/SCHEMA.md
            docs/contract/openapi.json
            docs/SECURITY_360.json
            docs/SECURITY_360.md
          if-no-files-found: error
