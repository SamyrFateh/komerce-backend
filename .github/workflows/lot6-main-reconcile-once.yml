name: Lot 6 main reconciliation once

on:
  push:
    branches:
      - fix/lot6-schema-reconciliation

permissions:
  contents: write

concurrency:
  group: lot6-main-reconciliation
  cancel-in-progress: true

jobs:
  reconcile-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgres://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: lot6-ci-secret-not-for-prod
      ADMIN_PASSWORD: lot6-ci-admin
      QR_SECRET: lot6-ci-qr-secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
      KOMERCE_DISABLE_CRONS: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lot6-schema-reconciliation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Merge latest main with an explicit schema-dump resolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "docs/db/railway-live-schema.sql" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs docs/db/railway-live-schema.sql
            git add docs/db/railway-live-schema.sql
          fi

      - name: Rebuild the merged post-migration schema target
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/db/railway-live-schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/122_cleanup_realdb_test_schema_residue.sql
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges > docs/db/railway-live-schema.sql
          node scripts/check-schema-resurrection.js

      - name: Rebuild governed artifacts and prove the merged tree
        run: |
          npm ci
          npm --prefix public/boutique ci
          npm run arch:gen
          npm run business-graph:gen
          npm run feature:360:gen
          npm run map:check

      - name: Remove one-shot workflow and commit merge resolution
        run: |
          rm -f .github/workflows/lot6-main-reconcile-once.yml
          git add -A
          git diff --cached --check
          git commit --no-verify -m "merge(main): reconcile Lot 6 with latest schema refresh"
          git push origin HEAD:fix/lot6-schema-reconciliation
