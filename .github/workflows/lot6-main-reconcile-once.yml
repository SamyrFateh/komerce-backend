name: Lot 6 main reconciliation once

on:
  push:
    branches:
      - fix/lot6-schema-reconciliation

permissions:
  contents: write

concurrency:
  group: lot6-main-reconciliation
  cancel-in-progress: true

jobs:
  reconcile-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    env:
      CI: true
      NODE_ENV: test
      JWT_SECRET: lot6-ci-secret-not-for-prod
      ADMIN_PASSWORD: lot6-ci-admin
      QR_SECRET: lot6-ci-qr-secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
      KOMERCE_DISABLE_CRONS: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lot6-schema-reconciliation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Record latest main against the regenerated Lot 6 schema target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -s ours --no-edit origin/main
          rm -f .github/workflows/lot6-main-reconcile-once.yml

      - name: Prove the final merged tree
        run: |
          npm ci
          npm --prefix public/boutique ci
          node scripts/check-schema-resurrection.js
          npm run map:check

      - name: Persist the qualified merge commit
        run: |
          git add -A
          git diff --cached --check
          git commit --amend --no-edit --no-verify
          git push origin HEAD:fix/lot6-schema-reconciliation
