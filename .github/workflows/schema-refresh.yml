name: Refresh docs/db/railway-live-schema.sql

# Déclenché automatiquement quand une migration est mergée sur main,
# ou manuellement depuis l'UI GitHub.
on:
  push:
    branches: [main, master]
    paths:
      - 'migrations/**.sql'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du refresh manuel'
        required: false
        default: 'refresh ponctuel'

# Un seul run à la fois — les pushes rapides successifs annulent le précédent
concurrency:
  group: schema-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Dump schema Railway → docs/db/ → PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install postgresql-client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # db-snapshot.js fait : pg_dump → neutralize PG18 artifacts → write atomiquement
      # Il remplace l'ancien pg_dump manuel du shell — et neutralise \restrict +
      # transaction_timeout que pg_dump PG18/Railway émet et qui cassent psql PG16 en CI.
      - name: Dump + clean schema from Railway prod
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: node scripts/db-snapshot.js

      # Vérifie que le dump fraîchement généré contient bien toutes les colonnes
      # déclarées dans migrations/*.sql — protection contre dump partiel ou connexion coupée.
      - name: Verify dump freshness
        run: node scripts/check-schema-freshness.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet docs/db/railway-live-schema.sql \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create PR if schema changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(schema): refresh docs/db/railway-live-schema.sql depuis Railway prod'
          branch: chore/schema-refresh-auto
          delete-branch: true
          title: '🗄️ Refresh railway-live-schema.sql (post-migration)'
          body: |
            Refresh automatique de `docs/db/railway-live-schema.sql` après merge d'une migration.

            Généré par `node scripts/db-snapshot.js` (pg_dump --schema-only sur Railway prod,
            artefacts PG18 neutralisés — `\restrict`, `transaction_timeout`).

            **À merger sans délai** — la CI d'intégration peut échouer tant que ce PR est ouvert.
          labels: schema,automated

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "ℹ️ railway-live-schema.sql déjà à jour — aucune PR créée."
