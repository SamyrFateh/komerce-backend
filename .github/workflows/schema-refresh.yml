name: Refresh Railway schema → SCHEMA.md

on:
  push:
    branches: [main, master]
    paths:
      - 'migrations/**.sql'
      - 'scripts/schema-promote.js'
      - 'scripts/schema-promote-columns.js'
      - 'scripts/schema-promote-all.js'
      - 'scripts/lib/arch-drift-core.js'
      - 'scripts/arch-schema-drift-check.js'
      - 'scripts/arch-reconcile.js'
      - 'docs/SCHEMA.md'
      - '.github/workflows/schema-refresh.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du refresh manuel'
        required: false
        default: 'refresh ponctuel'

concurrency:
  group: schema-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    name: Railway → dump → SCHEMA.md → architecture → PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pg_dump 18 via Docker
        run: |
          docker pull postgres:18
          printf '#!/bin/sh\nexec docker run --rm --network host postgres:18 pg_dump "$@"\n' | sudo tee /usr/local/bin/pg_dump > /dev/null
          sudo chmod +x /usr/local/bin/pg_dump
          pg_dump --version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Deux vérités distinctes sont mesurées ici :
      #   1. snapshot_ok : Railway est joignable et le dump live est valide ;
      #   2. deploy_lag  : toutes les migrations du repo ne sont pas encore live.
      #
      # Un retard de déploiement reste une alerte rouge, mais ne doit jamais
      # empêcher de versionner la vérité live effectivement observée. Sinon
      # SCHEMA.md reste mécaniquement faux précisément lorsque Railway dérive.
      - name: Dump Railway + wait for deployment convergence
        id: snapshot
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          set +e
          MAX_ATTEMPTS=6
          SLEEP_SECONDS=60
          attempt=1
          snapshot_ok=false
          fully_converged=false

          until [ "$attempt" -gt "$MAX_ATTEMPTS" ]; do
            echo "::group::Tentative ${attempt}/${MAX_ATTEMPTS}"
            node scripts/db-snapshot.js
            snapshot_status=$?

            if [ "$snapshot_status" -eq 0 ]; then
              snapshot_ok=true
              node scripts/check-schema-freshness.js --all
              freshness_status=$?
              if [ "$freshness_status" -eq 0 ]; then
                fully_converged=true
                echo "::endgroup::"
                break
              fi
            else
              echo "Snapshot Railway impossible à cette tentative."
            fi
            echo "::endgroup::"

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "⏳ Railway n'est pas encore convergé — nouvel essai dans ${SLEEP_SECONDS}s."
              sleep "$SLEEP_SECONDS"
            fi
            attempt=$((attempt + 1))
          done

          if [ "$snapshot_ok" != "true" ]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "deploy_lag=false" >> "$GITHUB_OUTPUT"
            echo "::error::Impossible d'extraire un snapshot Railway valide après ${MAX_ATTEMPTS} tentatives."
            exit 1
          fi

          echo "success=true" >> "$GITHUB_OUTPUT"
          if [ "$fully_converged" = "true" ]; then
            echo "deploy_lag=false" >> "$GITHUB_OUTPUT"
            echo "✅ Railway est joignable et toutes les migrations courantes sont live."
          else
            echo "deploy_lag=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Snapshot Railway valide, mais certaines migrations du repo ne sont toujours pas live après ${MAX_ATTEMPTS} tentatives. La vérité live sera synchronisée quand même."
          fi
          exit 0

      # ── A. SCHEMA TRUTH — bloquant ──────────────────────────
      # Ces étapes constituent la frontière fail-closed qui interdit
      # la fiction documentaire. Jamais de continue-on-error ici.
      - name: Promote SCHEMA.md (schema truth)
        if: steps.snapshot.outputs.success == 'true'
        run: |
          node scripts/schema-promote-all.js --write
          node scripts/schema-promote-all.js --check
          git diff --check

      # ── B. ARCHITECTURE VALIDATION — non bloquant pour le snapshot ─
      # Un défaut d'architecture (header manquant, sous-déclaration SQL)
      # ne doit plus empêcher la publication de la vérité Railway.
      # Le step reste visible comme failure/warning dans le run.
      - name: Architecture gate (reconcile + check)
        id: arch_gate
        if: steps.snapshot.outputs.success == 'true'
        continue-on-error: true
        run: |
          npm run arch:reconcile:write
          npm run arch:gate

      - name: Open/update architecture gate alert
        if: steps.arch_gate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'architecture-gate-alert';
            const title = '🏗️ Architecture gate rouge dans schema-refresh';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: 'D93F0B',
                description: 'arch:gate a échoué dans le workflow schema-refresh (snapshot Railway synchronisé quand même)',
              }).catch(() => {});
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const openIssue = existing.find(i => !i.pull_request && i.title === title);
            const body = [
              `\`arch:gate\` a échoué dans le workflow \`schema-refresh\`.`,
              ``,
              `Le snapshot Railway a **quand même été synchronisé** — la vérité DB n'est pas bloquée.`,
              `L'architecture applicative doit être corrigée indépendamment.`,
              ``,
              `Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit : ${context.sha}`,
              ``,
              `Action : corriger les sous-déclarations \`@db-read\`/\`@db-write\` signalées par \`npm run arch:gate\`, puis relancer.`,
            ].join('\n');

            if (openIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: openIssue.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }

      - name: Close resolved architecture gate alert
        if: steps.arch_gate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'architecture-gate-alert';
            const title = '🏗️ Architecture gate rouge dans schema-refresh';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of existing.filter(i => !i.pull_request && i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Résolu automatiquement : \`arch:gate\` est vert dans le run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Open/update Railway deployment lag alert
        if: steps.snapshot.outputs.deploy_lag == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'schema-drift-alert';
            const title = '🔴 Railway: migrations du repo non encore live';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: 'B60205',
                description: 'Le schéma Railway live ne couvre pas encore toutes les migrations du repo',
              }).catch(() => {});
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const openIssue = existing.find(i => !i.pull_request && i.title === title);
            const body = [
              `Le snapshot Railway est **valide**, mais \`check-schema-freshness --all\` reste rouge après les retries.`,
              `La synchronisation du dump et de \`SCHEMA.md\` continue volontairement : elle documente la vérité live observée au lieu de la masquer.`,
              ``,
              `Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit : ${context.sha}`,
              ``,
              `Action : vérifier le déploiement Railway / \`node scripts/migrate.js\`, puis relancer ce workflow.`,
            ].join('\n');

            if (openIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: openIssue.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }

      - name: Open/update hard snapshot failure alert
        if: failure() && steps.snapshot.outputs.success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'schema-drift-alert';
            const title = '🔴 schema-refresh: snapshot Railway impossible';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: 'B60205',
                description: 'Le refresh du schéma Railway nécessite une intervention',
              }).catch(() => {});
            }
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const openIssue = existing.find(i => !i.pull_request && i.title === title);
            const body = [
              `Impossible d'extraire un snapshot Railway valide après tous les retries.`,
              ``,
              `Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit : ${context.sha}`,
              ``,
              `Vérifier \`RAILWAY_DATABASE_URL\`, la disponibilité PostgreSQL et le réseau du runner.`,
            ].join('\n');
            if (openIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Close resolved Railway schema alerts
        if: steps.snapshot.outputs.success == 'true' && steps.snapshot.outputs.deploy_lag == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'schema-drift-alert';
            const resolvedTitles = new Set([
              '🔴 Railway: migrations du repo non encore live',
              '🔴 schema-refresh: snapshot Railway impossible',
            ]);
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of existing.filter(i => !i.pull_request && resolvedTitles.has(i.title))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Résolu automatiquement : snapshot Railway valide et migrations convergées dans le run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Check for changes
        if: steps.snapshot.outputs.success == 'true'
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Fichiers synchronisés :"
            git status --short
          fi

      - name: Verify PR token secret is configured
        if: steps.diff.outputs.changed == 'true'
        run: |
          if [ -z "${{ secrets.SCHEMA_REFRESH_PR_TOKEN }}" ]; then
            echo "::error::secrets.SCHEMA_REFRESH_PR_TOKEN absent — impossible de créer une PR qui déclenche les checks pull_request."
            exit 1
          fi

      - name: Create PR if live truth changed
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SCHEMA_REFRESH_PR_TOKEN }}
          commit-message: 'chore(schema): sync Railway live schema into canonical docs'
          branch: chore/schema-refresh-auto
          delete-branch: true
          title: '🗄️ Sync Railway schema → SCHEMA.md'
          body: |
            Synchronisation automatique depuis la vérité Railway effectivement observée.

            Chaîne :
            `Railway → pg_dump → schema-promote objets+colonnes → arch-reconcile → arch-gate`.

            La promotion est fail-closed :
            - objet : uniquement `schema-pending` confirmé live ;
            - colonne : paire exacte table+colonne prouvée par la migration et le dump live.

            Si des migrations du repo ne sont pas encore déployées, elles restent
            volontairement en `intended_migration_schema` et une issue
            `schema-drift-alert` signale le retard. La documentation ne prétend
            jamais qu'elles sont live avant Railway.

            Auto-merge activé uniquement après les checks obligatoires.
          labels: schema,automated

      - name: Enable auto-merge on the PR
        if: steps.diff.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.SCHEMA_REFRESH_PR_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" \
            --auto --merge --repo "${{ github.repository }}"

      - name: No changes
        if: steps.snapshot.outputs.success == 'true' && steps.diff.outputs.changed == 'false'
        run: echo "ℹ️ Railway, SCHEMA.md et projections d'architecture sont déjà synchronisés."
