name: Refresh db/schema.sql

# Déclenché automatiquement quand une migration est mergée sur main,
# ou manuellement depuis l'UI GitHub.
on:
  push:
    branches: [main, master]
    paths:
      - 'migrations/**.sql'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du refresh manuel'
        required: false
        default: 'refresh ponctuel'

# Un seul run à la fois — les pushes rapides successifs annulent le précédent
concurrency:
  group: schema-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Dump schema Railway → PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Token avec droits push + PR (PAT ou GITHUB_TOKEN si permissions ok)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install postgresql-client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Dump schema from Railway prod
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          pg_dump \
            --schema-only \
            --no-owner \
            --no-acl \
            --no-privileges \
            --encoding=UTF8 \
            "$DATABASE_URL" \
            > db/schema.sql
          echo "✅ Dump terminé — $(wc -l < db/schema.sql) lignes"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify freshness
        run: node scripts/check-schema-freshness.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet db/schema.sql && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create PR if schema changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(schema): refresh db/schema.sql depuis Railway prod'
          branch: chore/schema-refresh-auto
          delete-branch: true
          title: '🗄️ Refresh db/schema.sql (post-migration)'
          body: |
            Refresh automatique de `db/schema.sql` après merge d'une migration.

            Ce dump est généré par `pg_dump --schema-only` sur la base Railway prod.
            Il garantit que la CI d'intégration dispose d'un schéma complet.

            **À merger sans délai** — la CI d'intégration peut échouer tant que ce PR est ouvert.
          labels: schema,automated

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "ℹ️ schema.sql déjà à jour — aucune PR créée."
