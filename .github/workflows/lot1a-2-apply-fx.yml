# Temporary branch-only helper; removed before PR.
name: LOT1A-2 apply FX canonicalization

on:
  push:
    branches:
      - agent/lot1a-2-usd-fx

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot1a-2-usd-fx
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Apply exact structural replacements
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0 and new in text:
                  print(f'{path}: already patched')
                  return
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{path}: patched')

          # CDR: même valeur, source canonique rates.js.
          replace_once('services/pricing-cdr.js', '@depends       db\n', '@depends       db, utils/rates.js\n')
          replace_once('services/pricing-cdr.js', "const db = require('../db');\n", "const db = require('../db');\nconst { resolveFxRates } = require('../utils/rates');\n")
          replace_once('services/pricing-cdr.js', "  const taxAED  = Number(fc.taux_aed_kmf)        || 138;\n  const taxEUR  = Number(fc.taux_change_eur_kmf)  || 492;\n  const fretEUR = Number(fc.fret_eur_per_m3)      || 180;", "  const fx = resolveFxRates(fc);\n  const taxAED  = fx.aed_kmf;\n  const taxEUR  = fx.eur_kmf;\n  const taxUSD  = fx.usd_kmf;\n  const fretEUR = Number(fc.fret_eur_per_m3) || 180;")
          replace_once('services/pricing-cdr.js', "      case 'usd': amount = v * 0.92 * taxEUR; engagedAmount = amount; break;", "      case 'usd': amount = v * taxUSD; engagedAmount = amount; break;")

          # Scanner sourcing: même arrondi et mêmes fallbacks, plus de formule USD locale.
          replace_once('services/supplier-catalog-scanner.js', '@depends       services/pricing-engine.js\n', '@depends       services/pricing-engine.js, utils/rates.js\n')
          replace_once('services/supplier-catalog-scanner.js', "const pricingEngine = require('./pricing-engine');\n", "const pricingEngine = require('./pricing-engine');\nconst { resolveFxRates } = require('../utils/rates');\n")
          replace_once('services/supplier-catalog-scanner.js', "  if (cur === 'KMF') return Math.round(v);\n  if (cur === 'AED') return Math.round(v * (Number(finance?.taux_aed_kmf) || 138));\n  if (cur === 'EUR') return Math.round(v * (Number(finance?.taux_change_eur_kmf) || 492));\n  // USD : approx 0.92 EUR (à raffiner si besoin avec taux dédié)\n  return Math.round(v * 0.92 * (Number(finance?.taux_change_eur_kmf) || 492));", "  if (cur === 'KMF') return Math.round(v);\n  const fx = resolveFxRates(finance);\n  if (cur === 'AED') return Math.round(v * fx.aed_kmf);\n  if (cur === 'EUR') return Math.round(v * fx.eur_kmf);\n  return Math.round(v * fx.usd_kmf);")

          # Finance-config expose les deux projections : DB réelle et compat PricingView CURRENT.
          replace_once('routes/admin-finance-config.js', "const { invalidateConfigCache } = require('../services/loyalty-service');\n", "const { invalidateConfigCache } = require('../services/loyalty-service');\nconst { resolveFxRates, resolvePricingViewCurrentCompatRates } = require('../utils/rates');\n")
          replace_once('routes/admin-finance-config.js', "  const objCommandes = Number(cfg.objectif_commandes_mois || 100);\n  const objCA = Number(cfg.objectif_ca_mensuel_kmf || 1500000);\n\n  return {", "  const objCommandes = Number(cfg.objectif_commandes_mois || 100);\n  const objCA = Number(cfg.objectif_ca_mensuel_kmf || 1500000);\n  const currentFx = resolveFxRates(cfg);\n  const pricingViewCurrentCompatFx = resolvePricingViewCurrentCompatRates();\n\n  return {")
          replace_once('routes/admin-finance-config.js', "    sourcing: {\n      taux_change_eur_kmf:  tauxChange,", "    fx: {\n      current: currentFx,\n      pricing_view_current_compat: pricingViewCurrentCompatFx,\n      usd_nature: 'DERIVED_CURRENT',\n    },\n    sourcing: {\n      taux_change_eur_kmf:  tauxChange,")

          # Active PricingView : source nominale = API finance, fallback old-server identique à CURRENT.
          replace_once('public/dashboards/admin/js/views/PricingView.js', "  const fc = _ps.config?.targets || _ps.config || {};\n  const tauxAed = Number(fc.taux_aed_kmf || 138);\n  const tauxEur = Number(fc.taux_change_eur_kmf || 492);\n  const tauxUsdEur = 0.92;", "  const compatFx = _ps.config?.fx?.pricing_view_current_compat || null;\n  // Fallbacks = comportement exact pré-1A-2, uniquement pour compat old-server\n  // ou indisponibilité config. La source nominale est désormais l'API finance.\n  const tauxAed = Number(compatFx?.aed_kmf) || 138;\n  const tauxEur = Number(compatFx?.eur_kmf) || 492;\n  const tauxUsd = Number(compatFx?.usd_kmf) || 452.64;")
          replace_once('public/dashboards/admin/js/views/PricingView.js', "    if (cur === 'USD') return (v * tauxUsdEur * tauxEur) / tauxAed;", "    if (cur === 'USD') return (v * tauxUsd) / tauxAed;")

          for test_path in ['public/dashboards/tests/unit/PricingView.test.js', 'public/tests/unit/PricingView.test.js']:
              replace_once(test_path, "      config: () => jsonResponse({ targets: { taux_aed_kmf: 138, taux_change_eur_kmf: 492 } }),", "      config: () => jsonResponse({\n        targets: {},\n        fx: { pricing_view_current_compat: { eur_kmf: 492, aed_kmf: 138, usd_kmf: 452.64, usd_eur_ratio: 0.92 } },\n      }),")
              replace_once(test_path, "      expect(body.prix_aed).toBeCloseTo((50 * 0.92 * 492) / 138, 2);\n    });\n\n    it('dim_l/dim_w/dim_h et channel diaspora pris en compte dans le body'", "      expect(body.prix_aed).toBeCloseTo((50 * 452.64) / 138, 2);\n    });\n\n    it('USD consomme la projection backend au lieu d une formule locale', async () => {\n      routes.config = () => jsonResponse({\n        targets: {},\n        fx: { pricing_view_current_compat: { eur_kmf: 500, aed_kmf: 140, usd_kmf: 460, usd_eur_ratio: 0.92 } },\n      });\n      await switchToSimulation();\n      global.fetch.mockClear();\n\n      main.querySelector('[data-input=\"currency\"]').value = 'USD';\n      main.querySelector('[data-input=\"currency\"]').dispatchEvent(new Event('change', { bubbles: true }));\n      main.querySelector('[data-input=\"prix_achat\"]').value = '50';\n      main.querySelector('[data-input=\"prix_achat\"]').dispatchEvent(new Event('input', { bubbles: true }));\n      jest.advanceTimersByTime(300);\n      await flush();\n\n      const call = global.fetch.mock.calls.find(([u]) => String(u).includes('/api/pricing/recommend') && !String(u).includes('batch'));\n      const body = JSON.parse(call[1].body);\n      expect(body.prix_aed).toBeCloseTo((50 * 460) / 140, 2);\n    });\n\n    it('dim_l/dim_w/dim_h et channel diaspora pris en compte dans le body'")

          replace_once('tests/unit/supplier-catalog-scanner.test.js', "      expect(convertToKMF(10, 'AED', config.finance)).toBe(1380);\n    });", "      expect(convertToKMF(10, 'AED', config.finance)).toBe(1380);\n      expect(convertToKMF(10, 'USD', { taux_change_eur_kmf: 495, taux_aed_kmf: 139 })).toBe(4554);\n    });")

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Focused backend tests
        run: npx jest tests/unit/rates.test.js tests/unit/supplier-catalog-scanner.test.js --runInBand
      - name: Golden BEFORE == AFTER
        run: node tools/golden-cdr/golden-cdr.js verify
      - name: Commit patched files
        run: |
          git add utils/rates.js tests/unit/rates.test.js services/pricing-cdr.js services/supplier-catalog-scanner.js routes/admin-finance-config.js public/dashboards/admin/js/views/PricingView.js public/dashboards/tests/unit/PricingView.test.js public/tests/unit/PricingView.test.js tests/unit/supplier-catalog-scanner.test.js
          if git diff --cached --quiet; then echo "FX patch already applied."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "LOT 1A-2 — branche les consommateurs sur la vérité FX CURRENT"
          git push origin HEAD:agent/lot1a-2-usd-fx
