name: One-off Security 360 disposition migration

on:
  push:
    branches:
      - fix/security-360-disposition

permissions:
  contents: write

jobs:
  disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-360-disposition
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply typed disposition support
        run: node scripts/security-360-disposition-migrate-once.js
      - name: Validate exact disposition registry
        run: npx jest tests/unit/security-360-dispositions.test.js --runInBand --no-coverage
      - name: Regenerate and pay down Security 360 baseline
        run: |
          npm run security:360:save
          npm run security:360:check
          node <<'NODE'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync('scripts/.security-360-baseline.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('docs/SECURITY_360.json', 'utf8'));
          if ((baseline.flagged || []).length !== 0) throw new Error('Security baseline is not zero');
          if ((report.flagged || []).length !== 0) throw new Error('Unresolved Security 360 debt is not zero');
          if ((report.dispositions || []).length !== 44) throw new Error(`Expected 44 explicit dispositions, got ${(report.dispositions || []).length}`);
          if (report.summary.admin_no_guard !== 0 || report.summary.unprotected !== 0 || report.summary.unknown !== 0) {
            throw new Error(`Unresolved levels remain: ${JSON.stringify(report.summary)}`);
          }
          console.log(`✅ Security 360: ${report.summary.total} routes, 44 explicit dispositions, 0 unresolved debt.`);
          NODE
      - name: Commit canonical security projection
        run: |
          git config user.name "komerce-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/gen-security-360.js scripts/.security-360-baseline.json docs/SECURITY_360.json docs/SECURITY_360.md
          git commit -m "fix(security): dispose historical Security 360 signals"
          git push origin HEAD:fix/security-360-disposition
