name: Consolidate Boutique B2 Cart Internal Cascade

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b2-checkout-internal

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b2-checkout-internal
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Remove superseded checkout declarations inside cart.css
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const postcss = require('./public/boutique/node_modules/postcss');

          const rootDir = path.resolve('public/boutique');
          const cssDir = path.join(rootDir, 'css');
          const file = 'cart.css';
          const fp = path.join(cssDir, file);
          const original = fs.readFileSync(fp, 'utf8');
          const ast = postcss.parse(original, { from: file });
          const baseline = JSON.parse(fs.readFileSync(path.join(rootDir, 'scripts/.css-guard-baseline.json'), 'utf8'));
          const baselineKeys = new Set(baseline.keys);

          function isCheckoutSelector(selector) {
            return selector.startsWith('.ck-') ||
              selector.startsWith('.k-ck-') ||
              selector.startsWith('.k-order') ||
              selector.startsWith('.k-confirm') ||
              selector.startsWith('.k-modal-subtotal') ||
              selector.startsWith('.k-stripe-wrap');
          }

          function contextOf(rule) {
            let node = rule.parent;
            while (node && node.type !== 'root') {
              if (node.type === 'atrule' && node.name === 'media') return `@media ${node.params} {`;
              node = node.parent;
            }
            return 'global';
          }

          const occurrences = new Map();
          ast.walkRules(rule => {
            if (!isCheckoutSelector(rule.selector)) return;
            const media = contextOf(rule);
            rule.walkDecls(decl => {
              const key = `${rule.selector}|||${media}|||${decl.prop}`;
              if (!baselineKeys.has(key)) return;
              if (!occurrences.has(key)) occurrences.set(key, []);
              occurrences.get(key).push({ rule, decl, value: decl.value });
            });
          });

          const removable = new Map();
          for (const [key, rows] of occurrences) {
            if (rows.length < 2) continue;
            if (new Set(rows.map(r => r.value)).size < 2) continue;
            // Same selector + same media + same property in one source file:
            // normal cascade means the last occurrence already wins.
            removable.set(key, rows.slice(0, -1));
          }
          if (!removable.size) throw new Error('Aucune collision checkout interne cart.css prouvée');

          const removed = [];
          for (const [key, rows] of removable) {
            for (const row of rows) {
              removed.push({ key, value: row.value });
              row.decl.remove();
            }
          }
          ast.walkRules(rule => {
            if (rule.nodes && rule.nodes.filter(n => n.type !== 'comment').length === 0) rule.remove();
          });
          fs.writeFileSync(fp, ast.toString(), 'utf8');

          // Reparse and prove that no targeted key has more than one differing declaration left in cart.css.
          const checkAst = postcss.parse(fs.readFileSync(fp, 'utf8'), { from: file });
          const after = new Map();
          checkAst.walkRules(rule => {
            if (!isCheckoutSelector(rule.selector)) return;
            const media = contextOf(rule);
            rule.walkDecls(decl => {
              const key = `${rule.selector}|||${media}|||${decl.prop}`;
              if (!removable.has(key)) return;
              if (!after.has(key)) after.set(key, []);
              after.get(key).push(decl.value);
            });
          });
          const leftovers = [];
          for (const key of removable.keys()) {
            const values = after.get(key) || [];
            if (new Set(values).size > 1) leftovers.push(`${key}: ${values.join(' <> ')}`);
          }
          if (leftovers.length) throw new Error(`Internal conflicts remain:\n${leftovers.join('\n')}`);

          const summary = {
            oldCascade: baseline.total,
            conflictKeys: [...removable.keys()].sort(),
            removedConflictKeys: removable.size,
            removedDeclarations: removed.length,
          };
          fs.writeFileSync('/tmp/cart-internal-b2-summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Rebuild canonical bundles
        run: npm --prefix public/boutique run deploy:css
      - name: Prove no new CSS debt before lowering ratchet
        run: |
          npm --prefix public/boutique run check:css-guard
          npm --prefix public/boutique run check:css-specificity-guard
      - name: Lower cascade ratchet and write report
        run: |
          npm --prefix public/boutique run check:css-guard:save
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/cart-internal-b2-summary.json').read_text())
          new = json.loads(Path('public/boutique/scripts/.css-guard-baseline.json').read_text())['total']
          lines = [
              '# Boutique CSS Debt — B2-2b cart internal cascade',
              '',
              'For exact same selector + media context + property duplicates inside `cart.css`, only declarations before the last winning occurrence were removed.',
              '',
              f'- Cascade baseline: **{summary["oldCascade"]} → {new}**',
              f'- Internal semantic keys consolidated: **{summary["removedConflictKeys"]}**',
              f'- Superseded declarations removed: **{summary["removedDeclarations"]}**',
              '- New cascade keys before ratchet save: **0**',
              '- Specificity ratchet: **unchanged / strict passed**',
              '',
              'The final value for every touched property is unchanged: the same last declaration in `cart.css` remains in place.',
          ]
          Path('public/boutique/docs/BOUTIQUE_CSS_DEBT_B2_CART_INTERNAL.md').write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit B2 cart internal consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/cart.css public/boutique/css/dist public/boutique/index.html public/boutique/scripts/.css-guard-baseline.json public/boutique/docs/BOUTIQUE_CSS_DEBT_B2_CART_INTERNAL.md
          git commit -m "refactor(boutique): consolidate internal checkout cascade"
          git push origin HEAD:refactor/boutique-debt-zero-b2-checkout-internal
