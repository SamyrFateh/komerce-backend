name: G2 Hub PO — genuine Chromium clicks on isolated in-memory dossiers
on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-hub-po-ephemeral-chromium
  cancel-in-progress: false

jobs:
  chromium:
    name: 7 isolated Hub PO click proofs · no staging/credentials/database
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == '[cert-op] g2-hub-po-chromium-isolated') ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      # Explicitly no DATABASE_URL, STAGING_BASE_URL, E2E tokens or PSP secrets.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install real Chromium
        run: npx playwright install --with-deps chromium
      - name: Seven genuine GUI clicks against canonical Hub PO JavaScript, without HTTP
        run: npx playwright test --config=playwright.g2-hub-po-isolated.config.js
      - name: Archive only synthetic data and screenshots (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-hub-po-offline-chromium-${{ github.run_id }}
          path: test-results/g2-hub-po-chromium-isolated/
          if-no-files-found: warn
          retention-days: 14
      - name: State true proof scope
        if: always()
        shell: bash
        run: |
          echo "G2 Hub PO: browser clicks use the real production UI module in Chromium with *controlled isolated in-memory* dossier states. No network, no authenticated backend, no PG readback, no staging mutation. Not a 13-step transactional certification. G2 staging HOLD and G4 NOT_PROVEN remain unchanged." >> "$GITHUB_STEP_SUMMARY"
