name: MDM9 Feature 360 regeneration

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mdm9-modal-gallery-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regenerate Feature 360
        run: |
          npm run feature:360:gen
          npm run feature:360:check
      - name: Verify complete map
        run: npm run map:check
      - name: Commit Feature 360 and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mdm9-map-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_360.json docs/FEATURE_360.md .github/workflows/mdm9-map-diagnostic.yml
          git status --short
          git commit -m 'docs(governance): refresh Feature 360 for MDM9'
          git push origin HEAD:fix/mdm9-modal-gallery-layout
