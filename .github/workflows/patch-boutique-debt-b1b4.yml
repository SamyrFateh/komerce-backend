name: Patch Boutique Debt B1b4

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b1b-4

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b1b-4
          fetch-depth: 1
      - name: Remove orphan shared-cart desktop CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/boutique/css/boutique-desktop.css')
          s = p.read_text(encoding='utf-8')
          start_marker = '  /* ── Badge panier partagé actif ── */'
          end_marker = '  .k-sc-group-view-btn:hover { background: var(--green-text-strong); transform: translateY(-1px); }'
          if start_marker not in s:
              print('Orphan block already absent')
          else:
              start = s.index(start_marker)
              end = s.index(end_marker, start) + len(end_marker)
              s = s[:start] + s[end:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit CSS patch if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/boutique-desktop.css
          if git diff --cached --quiet; then
            echo "Desktop orphan block already removed"
            exit 0
          fi
          git commit -m "refactor(boutique): remove orphan shared-cart desktop styles"
          git push origin HEAD:refactor/boutique-debt-zero-b1b-4
