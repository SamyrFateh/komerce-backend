name: Temporary pricing no flash
on:
  push:
    branches:
      - fix/pricing-readonly-mutualized-no-flash
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python3 scripts/tmp_fix_pricing_no_flash.py
      - run: python3 scripts/tmp_fix_pricing_test.py
      - run: npx jest tests/unit/canonical-admin-app.test.js tests/unit/canonical-pricing-economic-cockpit.test.js --runInBand
      - run: npx jest tests/unit/canonical-*.test.js tests/unit/admin-*.test.js --runInBand
      - name: Commit result
        run: |
          git rm .github/workflows/tmp-fix-pricing-no-flash.yml scripts/tmp_fix_pricing_no_flash.py scripts/tmp_fix_pricing_test.py
          git add public/dashboards/canonical/js/app.js public/dashboards/canonical/js/pricing-economic-cockpit.js public/dashboards/canonical/css/pricing-economic-cockpit.css public/dashboards/canonical/index.html tests/unit/canonical-admin-app.test.js tests/unit/canonical-pricing-economic-cockpit.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(admin): mutualisations readonly et swap Market sans flash"
          git push origin HEAD:fix/pricing-readonly-mutualized-no-flash
