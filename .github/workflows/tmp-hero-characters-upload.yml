name: TEMP hero characters upload

on:
  push:
    branches:
      - ui-hero-characters-v1-asset
    paths:
      - .github/workflows/tmp-hero-characters-upload.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-hero-characters-v1-asset
          fetch-depth: 0

      - name: Download canonical Canva asset at full size
        shell: bash
        env:
          CANVA_BASE: "https://media.canva.com/v2/image-resize/format:PNG/height:1000/quality:100/uri:ifs%3A%2F%2FM%2F8f5a3b2d-9f43-4bb0-979a-e1f2aac09af1/watermark:F/width:1600?csig=AAAAAAAAAAAAAAAAAAAAAMH5TKWKFNs6qF5p9Db3bA8qb82VZiUBNdaYpIJH3F7t&exp=1787363867&osig=AAAAAAAAAAAAAAAAAAAAAPUy0hnyj7uyMQzyqUz2_Q0WA7KvPDm8FWK8Tmwoc4UX&signer=media-rpc&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl --fail --location --retry 2 "$CANVA_BASE" -o public/images/komerce_hero_characters_v1.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('public/images/komerce_hero_characters_v1.png')
          im = Image.open(p).convert('RGBA')
          assert im.size == (1600, 1000), im.size
          alpha = im.getchannel('A')
          assert alpha.getextrema()[0] == 0, alpha.getextrema()
          bbox = alpha.getbbox()
          assert bbox is not None
          l,t,r,b = bbox
          assert l >= 120 and t >= 75 and 1600-r >= 120 and 1000-b >= 75, bbox
          im.save(p, optimize=True)
          print('validated', im.size, im.mode, bbox, p.stat().st_size)
          PY

      - name: Commit asset and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-hero-characters-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/komerce_hero_characters_v1.png .github/workflows/tmp-hero-characters-upload.yml
          git commit -m "asset(hero): add neutral characters master"
          git push origin HEAD:ui-hero-characters-v1-asset
