name: TEMP regenerate Feature 360

on:
  push:
    branches:
      - fix/shared-list-auto-close-on-complete

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-list-auto-close-on-complete
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate canonical Feature 360 projection
        run: npm run feature:360:gen

      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- docs/FEATURE_360.json docs/FEATURE_360.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_360.json docs/FEATURE_360.md
          git commit -m "chore(governance): regenerate Feature 360 projection"
          git push origin HEAD:fix/shared-list-auto-close-on-complete
