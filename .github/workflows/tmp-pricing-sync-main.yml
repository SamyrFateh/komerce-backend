name: Temporary Pricing Sync Main

on:
  push:
    branches:
      - feat/pricing-market-decision-policy

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pricing-market-decision-policy
          fetch-depth: 0

      - name: Merge current main into pricing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feat/pricing-market-decision-policy
