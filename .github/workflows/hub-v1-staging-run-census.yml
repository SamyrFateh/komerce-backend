name: Hub V1 — live staging RUN8 census (READ ONLY)

on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-hub-v1-run-census
  cancel-in-progress: false
jobs:
  census:
    name: Read-only RUN8 ownership census on official Railway staging
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] hub-v1-run-census'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Pin actual staging deployment SHA
        run: node scripts/recette/resolve-staging-deploy-pin.js
      - run: npm ci
      - name: Refuse missing staging database secret
        run: test -n "$DATABASE_URL"
      - name: Verify exact Railway staging DB fingerprint
        run: node scripts/recette/target-guard.js
      - name: Discover all RUN8 markers and immutable ownership on staging (no writes)
        run: node scripts/recette/hub-v1-staging-run-census.js
      - name: Archive exact private manifest for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-v1-staging-run-census-${{ github.run_id }}
          path: test-results/hub-v1-cert/staging-run-census.json
          if-no-files-found: warn
          retention-days: 30
      - name: Scope of the verdict
        if: always()
        run: |
          echo 'Read only. No INSERT, UPDATE, DELETE or TRUNCATE; no cleanup certified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Orphaned E2E parents without orders remain HOLD until explicit per-run cleanup.' >> "$GITHUB_STEP_SUMMARY"
