name: Temporary audit final observed dependencies

on:
  push:
    branches:
      - governance/audit-final-observed-deps

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Summarize remaining dependency classifications
        run: |
          node - <<'NODE'
          const graph = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const refs = new Set((graph.drifts.debt || [])
            .filter(x => x.type === 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY')
            .map(x => x.ref));
          const classes = (graph.o6 && graph.o6.pairClassifications || [])
            .filter(p => refs.has(`${p.from} -> ${p.to}`));
          const exceptions = new Map((graph.o6 && graph.o6.exceptions || [])
            .map(e => [`${e.from} -> ${e.to}`, e]));
          console.log(`COUNT=${refs.size}`);
          for (const p of classes.sort((a,b) => `${a.from}->${a.to}`.localeCompare(`${b.from}->${b.to}`))) {
            const ref = `${p.from} -> ${p.to}`;
            const ex = exceptions.get(ref);
            console.log([
              ref,
              `family=${p.family}`,
              `evidence=${p.evidenceRole}`,
              `policy=${p.policy}`,
              `exceptionRequired=${p.exceptionRequired}`,
              `decision=${ex ? ex.decision : '-'}`,
            ].join(' | '));
          }
          NODE
