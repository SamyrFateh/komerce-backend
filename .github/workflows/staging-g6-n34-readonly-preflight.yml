# N34a/N34b screen readiness only. Never a certification or a business write.
name: G6 N34 — Chromium supplier screens READ ONLY (staging)
on:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
jobs:
  n34-preflight:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      (github.event.issue.title == '[staging-op] g6-n34-readonly-preflight-KM' ||
       github.event.issue.title == '[staging-op] g6-n34-readonly-preflight-CM' ||
       github.event.issue.title == '[staging-op] g6-n34-readonly-preflight-CG')
    concurrency:
      group: komerce-g6-canonical-real-transaction
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      PGOPTIONS: '-c default_transaction_read_only=on'
      G6_CANONICAL_SCENARIO: N34
      G6_N34_PREFLIGHT_ONLY: '1'
      G6_TARGET_MARKET: ${{ endsWith(github.event.issue.title, '-CM') && 'CM' || endsWith(github.event.issue.title, '-CG') && 'CG' || 'KM' }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pin exact main and actual Railway staging SHA
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          live="$(curl -fsS "$STAGING_BASE_URL/health/version" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).commit||"")))')"
          test "$head" = "$live" || { echo "N34_STAGING_SHA_DRIFT: head=$head live=$live"; exit 1; }
          echo "E2E_EXPECTED_DEPLOY_SHA=$head" >> "$GITHUB_ENV"
      - name: Prove staging and PG read-only target guard
        run: node scripts/recette/target-guard.js
      - name: Install Chromium shell
        run: npx playwright install chromium --only-shell
      - name: Inspect actual protected Hub supplier and explicit real supplier picker
        run: node scripts/recette/g6-n34-readonly-chromium-preflight.js
      - name: Preserve audit report and Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-n34-readonly-preflight-${{ github.run_id }}
          path: test-results/g6-n34-readonly-preflight/
          retention-days: 21
          if-no-files-found: warn
