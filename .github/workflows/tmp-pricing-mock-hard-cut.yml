name: Temporary pricing mock hard cut

on:
  push:
    branches: [fix/pricing-mock-hard-cut]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pricing-mock-hard-cut
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python3 scripts/tmp-pricing-mock-hard-cut.py
      - name: Targeted tests
        run: npx jest tests/unit/canonical-pricing-economic-cockpit.test.js tests/unit/canonical-navigation.test.js --runInBand
      - name: Broad canonical/admin regression
        run: npx jest 'tests/unit/(canonical|admin).*\.test\.js$' --runInBand
      - name: Commit patch and remove temporary files
        run: |
          git rm .github/workflows/tmp-pricing-mock-hard-cut.yml scripts/tmp-pricing-mock-hard-cut.py
          git add public/dashboards/canonical/js/pricing-economic-cockpit.js public/dashboards/canonical/css/pricing-economic-cockpit.css public/dashboards/canonical/index.html tests/unit/canonical-pricing-economic-cockpit.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(admin): make Atelier mock the exclusive pricing UI'
          git push origin HEAD:fix/pricing-mock-hard-cut
