name: Finance contract refresh one-shot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh-finance-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/canonical-finance-2f'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ci-dummy:ci-dummy@localhost:5432/ci-dummy
      ADMIN_PASSWORD: ci-dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-dummy
      JWT_SECRET: ci-dummy
      SESSION_SECRET: ci-dummy
      INTERNAL_API_KEY: ci-dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      JWT_EXPIRES: 7d
      APP_URL: http://localhost
      PUBLIC_URL: http://localhost
      PUBLIC_BASE_URL: http://localhost
      ADMIN_RESET_KEY: ci-dummy
      INVOICE_PUBLIC_LINK_SECRET: ci-dummy
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_TOKEN: ci-dummy
      META_WA_PHONE_NUMBER_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Materialize Finance contract source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/contract-generate.js')
          s = p.read_text()

          route_anchor = "  // LOT 2E — Canonical Operations global + market-scoped\n  { prefix: '/api/admin/dashboard/operations', method: 'get', schema: null },\n  { prefix: '/api/admin/dashboard/operations/market/{marketCode}', method: 'get', schema: null },\n"
          if "{ prefix: '/api/admin/dashboard/finance', method: 'get', schema: null }," not in s:
              if route_anchor not in s:
                  raise SystemExit('Finance route anchor not found')
              s = s.replace(route_anchor, route_anchor + "  // LOT 2F — Canonical Finance global + market-scoped\n  { prefix: '/api/admin/dashboard/finance', method: 'get', schema: null },\n  { prefix: '/api/admin/dashboard/finance/market/{marketCode}', method: 'get', schema: null },\n", 1)

          response_anchor = "const KNOWN_RESPONSES = {\n  // LOT 2E — réponses Operations consommées par Canonical.\n"
          if "// LOT 2F — réponses Finance consommées par Canonical." not in s:
              if response_anchor not in s:
                  raise SystemExit('Finance response anchor not found')
              s = s.replace(response_anchor, "const KNOWN_RESPONSES = {\n  // LOT 2F — réponses Finance consommées par Canonical.\n  '/api/admin/dashboard/finance': {\n    get: { fields: ['scope','period','kpis','payment_mix','refunds','incomplete_cost_orders','data_quality'], source: 'test' }\n  },\n  '/api/admin/dashboard/finance/market/{marketCode}': {\n    get: { fields: ['scope','period','kpis','payment_mix','refunds','incomplete_cost_orders','data_quality'], source: 'test' }\n  },\n  // LOT 2E — réponses Operations consommées par Canonical.\n", 1)

          p.write_text(s)
          PY

      - name: Generate and verify
        run: |
          node scripts/gen-route-registry.js
          npm run contract:generate
          node scripts/contract-check.js
          npx jest --config jest.unit.config.js --runInBand --forceExit --detectOpenHandles \
            tests/unit/admin-dashboard-finance-route.test.js \
            tests/unit/canonical-finance.test.js \
            tests/unit/dashboard-finance-canonical.test.js \
            tests/unit/canonical-dashboard-boundary.test.js

      - name: Commit generated contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/contract-generate.js docs/_generated/route-registry.json docs/contract/openapi.json docs/contract/DEBT.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Finance contract already current"
            exit 0
          fi
          git commit -m "chore(contract): refresh Finance dashboard routes"
          git push origin HEAD:${{ github.head_ref }}
