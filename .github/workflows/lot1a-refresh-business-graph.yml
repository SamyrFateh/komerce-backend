name: LOT1A refresh business graph

on:
  push:
    branches:
      - agent/lot1a-integrity-silent

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot1a-integrity-silent
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate canonical business graph
        run: npm run business-graph:gen
      - name: Commit generated projections only
        run: |
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md
          if git diff --cached --quiet; then
            echo "Business graph already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: régénère le business graph LOT 1A"
          git push origin HEAD:agent/lot1a-integrity-silent
