name: Debt Zero absolute close

on:
  push:
    branches:
      - ci/debt-zero-absolute-close

permissions:
  contents: read

jobs:
  decompose-final-signals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Switch to product branch
        run: git checkout -B chore/debt-zero-absolute origin/chore/debt-zero-absolute
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate specialized 360s
        run: |
          npm run dashboards:360
          npm run boutique:360
      - name: Exact Dashboard residuals
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('docs/DASHBOARDS_360.json','utf8'));
          console.log('DASH_KEYS', Object.keys(d));
          const mods = d.modules || [];
          console.log('DASH_HEADERLESS', JSON.stringify(mods.filter(m => !m.hasHeader).map(m => m.file)));
          for (const key of ['orphanRoutes','deadApiMethods','missingApiMethods','doctrineViolations','unknownContracts','unresolvedUrls']) {
            if (d[key] !== undefined) console.log(`DASH_${key}`, JSON.stringify(d[key]));
          }
          console.log('DASH_SUMMARY', JSON.stringify(d.summary || {}));
          NODE
      - name: Exact Boutique bus residuals
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync('docs/BOUTIQUE_360.json','utf8'));
          console.log('BOUTIQUE_KEYS', Object.keys(b));
          console.log('BOUTIQUE_SUMMARY', JSON.stringify(b.summary || {}));
          for (const key of Object.keys(b)) {
            if (/orphan|undeclared|bus|event/i.test(key)) console.log(`BOUTIQUE_${key}`, JSON.stringify(b[key]));
          }
          NODE
      - name: Exact backend debt JSON
        run: |
          node scripts/debt-audit.js --json > /tmp/debt.json
          node - <<'NODE'
          const d = require('/tmp/debt.json');
          console.log('DEBT_SUMMARY', JSON.stringify({ totalDebtItems:d.totalDebtItems, openDebtsCount:d.openDebtsCount }));
          for (const x of d.debts) {
            if (x.count > 0) console.log('DEBT_ITEM', JSON.stringify(x));
          }
          NODE
      - name: Locate inline quality disables
        run: grep -RIn --include='*.js' 'quality-disable N2-SQL-INJECTION' capabilities core middleware public routes services utils validators || true
      - name: NPM audit classification
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const a = require('/tmp/npm-audit.json');
          console.log('NPM_AUDIT_META', JSON.stringify(a.metadata || {}));
          const vs = a.vulnerabilities || {};
          for (const [name,v] of Object.entries(vs)) {
            if (['high','critical'].includes(v.severity)) console.log('NPM_AUDIT_HIGH', JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,via:v.via,range:v.range,fixAvailable:v.fixAvailable}));
          }
          NODE
      - name: Migration 147 history
        run: |
          echo '=== 147 files ==='
          ls -l migrations/147_*.sql || true
          echo '=== references ==='
          grep -RIn '147_catalog_global_access_grants\|147_relais_visit_identity\|COLLISION.*147' migrations docs scripts .github --exclude-dir=node_modules || true
