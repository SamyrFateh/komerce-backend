name: Debt Zero rebase proof

on:
  push:
    branches:
      - ci/debt-zero-absolute-close

permissions:
  contents: read

jobs:
  rebase-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Rebuild Debt Zero on current main
        run: |
          git config user.name "SamyrFateh"
          git config user.email "fatehsamyr@gmail.com"
          git checkout -B debt-zero-rebase-proof origin/main

          resolve_generated_conflicts() {
            local unsafe=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/FEATURE_360.json|docs/FEATURE_360.md|docs/BUSINESS_FEATURE_GRAPH.json|docs/BUSINESS_FEATURE_GRAPH.md|docs/O6_INVENTORY.md|docs/DASHBOARDS_360.json|docs/DASHBOARDS_360.md|docs/BOUTIQUE_360.json|docs/BOUTIQUE_360.md|docs/KOMERCE_ARCH_HEADER_GRAPH.md|docs/komerce-arch-header-graph.json)
                  echo "Resolving generated artifact from current-main side: $f"
                  git checkout --ours -- "$f"
                  git add "$f"
                  ;;
                *)
                  echo "SOURCE_CONFLICT=$f"
                  unsafe=1
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
            if [ "$unsafe" -ne 0 ]; then
              git status --short
              return 1
            fi
            git cherry-pick --continue
          }

          for sha in \
            48b5de4b66f2aa3829aa827b78d714feba1c97ad \
            75675a5c7a2e54ac73d79aef96d84ba21a31b320 \
            482224bbe6d8affe2a10b1e4b57de64c9b52b692 \
            d0d3b87c72d395380f926172c74a8a5ad95e8209 \
            a02be6c9a7e6497a51787e4ebcbed6caceab3405
          do
            echo "=== cherry-pick $sha ==="
            if ! git cherry-pick "$sha"; then
              echo "CHERRY_PICK_CONFLICT=$sha"
              git diff --name-only --diff-filter=U
              resolve_generated_conflicts
            fi
          done
          echo "DEBT_ZERO_REPLAY_OK"
          git log --oneline --decorate -8
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix public/boutique --ignore-scripts
      - name: Core regression proof
        run: |
          npx --no-install jest --config jest.unit.config.js \
            tests/unit/require-non-production.test.js \
            tests/unit/simulator-route.test.js \
            tests/unit/admin-system.test.js \
            --runInBand --forceExit
          (cd public/boutique && npx --no-install jest tests/unit/b-modal-social-proof.test.js tests/unit/b-modal-core.test.js --runInBand)
      - name: Governance and security proof
        run: |
          npm run quality:gate
          node scripts/debt-audit.js --json > /tmp/debt-zero.json
          node - <<'NODE'
          const r = require('/tmp/debt-zero.json');
          if (r.openDebtsCount !== 0) throw new Error(`openDebtsCount=${r.openDebtsCount}`);
          console.log('BACKEND_ACTIONABLE_DEBT_ZERO');
          NODE
          npm audit --omit=dev --audit-level=high
          node scripts/generate-komerce-arch-graph.js
          npm run dashboards:360
          npm run boutique:360
          npm run business-graph:gen
          npm run business-graph:check
          npm run business-graph:disposition-check
          npm run feature:360:refresh-global
          npm run feature:360:check
          git diff --check
