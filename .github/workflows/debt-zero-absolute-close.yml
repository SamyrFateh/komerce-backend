name: Debt Zero absolute close

on:
  push:
    branches:
      - ci/debt-zero-absolute-close

permissions:
  contents: write

jobs:
  close-pre-golive-residuals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Preserve closure scripts
        run: |
          cp scripts/debt-zero-close-specialized-360.js /tmp/debt-zero-close-specialized-360.js
          cp scripts/debt-zero-close-golive.js /tmp/debt-zero-close-golive.js
      - name: Switch to product branch
        run: git checkout -B chore/debt-zero-absolute origin/chore/debt-zero-absolute
      - name: Install repository dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix public/boutique --ignore-scripts
      - name: Apply specialized and GoLive closure
        run: |
          cp /tmp/debt-zero-close-specialized-360.js scripts/debt-zero-close-specialized-360.js
          cp /tmp/debt-zero-close-golive.js scripts/debt-zero-close-golive.js
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/debt-zero-close-golive.js')
          text = p.read_text()
          text = text.replace('${bypassEnvVar}=true', r'\${bypassEnvVar}=true')
          p.write_text(text)
          PY
          node scripts/debt-zero-close-specialized-360.js
          node scripts/debt-zero-close-golive.js
          rm scripts/debt-zero-close-specialized-360.js scripts/debt-zero-close-golive.js
      - name: Refresh security lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --prefix public/boutique --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm ci --prefix public/boutique --ignore-scripts
      - name: Targeted backend regression
        run: |
          npx --no-install jest --config jest.unit.config.js \
            tests/unit/require-non-production.test.js \
            tests/unit/simulator-route.test.js \
            tests/unit/admin-system.test.js \
            --runInBand --forceExit
      - name: Targeted Boutique regression
        working-directory: public/boutique
        run: |
          npx --no-install jest \
            tests/unit/b-modal-social-proof.test.js \
            tests/unit/b-modal-core.test.js \
            --runInBand
      - name: Backend and quality gates
        run: |
          npm run backend:audit
          npm run quality:gate
          node scripts/debt-audit.js --json > /tmp/debt-zero.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/debt-zero.json', 'utf8'));
          const baseline = (report.debts || []).find(d => d.rule === 'N2 (baseline)');
          if (baseline && baseline.count > 0) throw new Error(`N2 baseline still counted: ${JSON.stringify(baseline)}`);
          const large = (report.debts || []).find(d => d.rule === 'I-BACK-2');
          const entries = (large && large.entries) || [];
          if (entries.length !== 1 || entries[0] !== 'services/scan-engine.js') {
            throw new Error(`Unexpected large-file exceptions: ${JSON.stringify(entries)}`);
          }
          console.log('BACKEND_DEBT_HYGIENE_OK', {
            totalDebtItems: report.totalDebtItems,
            openDebtsCount: report.openDebtsCount,
            remainingLargeFileException: entries[0],
          });
          NODE
      - name: Production dependency security proof
        run: |
          npm ls fast-uri
          npm audit --omit=dev --audit-level=high
      - name: Regenerate specialized 360s
        run: |
          npm run dashboards:360
          npm run boutique:360
      - name: Assert specialized structural zero
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('docs/DASHBOARDS_360.json','utf8'));
          const headerless = (d.modules || []).filter(m => !m.hasHeader).map(m => m.file);
          if (headerless.length) throw new Error(`Dashboard headerless: ${headerless.join(', ')}`);
          for (const key of ['orphanRoutes','deadApiMethods','missingApiMethods','doctrineViolations']) {
            if ((d.summary && d.summary[key]) !== 0) throw new Error(`Dashboard ${key}=${d.summary[key]}`);
          }

          const b = JSON.parse(fs.readFileSync('docs/BOUTIQUE_360.json','utf8'));
          const s = b.summary || {};
          for (const key of ['orphanEmit','orphanListen','undeclared','notFoundEndpoints','ownershipRed','ownershipOrange']) {
            if ((s[key] || 0) !== 0) throw new Error(`Boutique ${key}=${s[key]}`);
          }
          console.log('SPECIALIZED_STRUCTURAL_ZERO', {
            dashboardHeaderless: headerless.length,
            dashboardUnprovenInformational: d.summary.unprovenContracts,
            boutiqueOrphanEmit: s.orphanEmit,
            boutiqueOrphanListen: s.orphanListen,
            boutiqueUndeclared: s.undeclared,
            boutiqueNotFoundEndpoints: s.notFoundEndpoints,
            boutiqueUnprovenInformational: s.unprovenEndpoints,
          });
          NODE
      - name: Lower specialized ratchets to current zero
        run: |
          npm run dashboards:360:save
          npm run boutique:360:save
          npm run dashboards:360:check
          npm run boutique:360:check
      - name: Canonical architecture proof
        run: |
          npm run business-graph:gen
          npm run business-graph:check
          npm run business-graph:ratchet-check
          npm run business-graph:disposition-check
          npm run feature:360:refresh-global
          npm run feature:360:check
          git diff --check
      - name: Commit final pre-GoLive closure
        run: |
          git config user.name "SamyrFateh"
          git config user.email "fatehsamyr@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(governance): close pre-golive debt residuals"
          git push origin HEAD:chore/debt-zero-absolute
