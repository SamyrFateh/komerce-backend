name: Debt Zero absolute close

on:
  push:
    branches:
      - ci/debt-zero-absolute-close

permissions:
  contents: write

jobs:
  close-data-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve closure script
        run: cp scripts/debt-zero-close-data-dependencies.js /tmp/debt-zero-close-data-dependencies.js
      - name: Switch to product branch
        run: git checkout -B chore/debt-zero-absolute origin/chore/debt-zero-absolute
      - name: Close data dependencies at source
        run: |
          cp /tmp/debt-zero-close-data-dependencies.js scripts/debt-zero-close-data-dependencies.js
          node scripts/debt-zero-close-data-dependencies.js
          rm scripts/debt-zero-close-data-dependencies.js
      - name: Refresh technical architecture
        run: npm run arch:gen
      - name: Targeted regression tests
        run: |
          npx jest \
            tests/unit/feature-dependency-data-channel.test.js \
            tests/unit/feature-360-internal-api-projection.test.js \
            tests/unit/loyalty-route.test.js \
            tests/unit/loyalty-service.test.js \
            tests/unit/shared-cart-engine.test.js \
            tests/unit/shared-cart-queries.test.js \
            --runInBand
      - name: Regenerate canonical governance artifacts
        run: |
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Prove data debt is closed
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const g = JSON.parse(fs.readFileSync('docs/BUSINESS_FEATURE_GRAPH.json', 'utf8'));
          const debt = (g.drifts && g.drifts.debt) || [];
          const dataDebt = debt.filter(x => x.type === 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY');
          if (dataDebt.length) throw new Error(`data dependency debt remains: ${dataDebt.map(x => x.ref).join(' | ')}`);
          if (debt.length) throw new Error(`unexpected graph debt remains: ${debt.map(x => `${x.type}:${x.ref}`).join(' | ')}`);
          if ((g.o6 && g.o6.unclassified || []).length) throw new Error('O6 has unclassified dependencies');
          if ((g.o6 && g.o6.missingExceptions || []).length) throw new Error(`O6 missing exceptions: ${g.o6.missingExceptions.join(', ')}`);
          const f = JSON.parse(fs.readFileSync('docs/FEATURE_360.json', 'utf8'));
          console.log('DATA_CLOSURE_GREEN', {
            graphDebt: debt.length,
            feature360Debt: f.summary.debtItemsTotal,
            healthy: f.summary.healthy,
            attention: f.summary.attention,
            blocked: f.summary.blocked,
          });
          NODE
      - name: Governance checks
        run: |
          npm run business-graph:disposition-check
          npm run feature:360:check
          node scripts/feature-guard.js --strict
          git diff --check
      - name: Commit product closure
        run: |
          git config user.name "SamyrFateh"
          git config user.email "fatehsamyr@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(governance): close cross-feature data debt"
          git push origin HEAD:chore/debt-zero-absolute
