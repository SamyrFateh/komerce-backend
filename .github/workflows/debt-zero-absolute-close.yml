name: Debt Zero absolute close

on:
  push:
    branches:
      - ci/debt-zero-absolute-close

permissions:
  contents: read

jobs:
  audit-specialized-surfaces:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Switch to product branch
        run: git checkout -B chore/debt-zero-absolute origin/chore/debt-zero-absolute
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate Dashboard and Boutique 360
        run: |
          npm run dashboards:360
          npm run boutique:360
      - name: Print current specialized summaries
        run: |
          echo '=== DASHBOARD 360 SUMMARY ==='
          sed -n '1,16p' docs/DASHBOARDS_360.md
          echo '=== DASHBOARD RISK ROWS ==='
          grep -E 'orpheline|morte|absente|violation|non prouv|url non résolue|🔴|🟠|🟡' docs/DASHBOARDS_360.md | head -120 || true
          echo '=== BOUTIQUE 360 SUMMARY ==='
          sed -n '1,16p' docs/BOUTIQUE_360.md
          echo '=== BOUTIQUE RISK ROWS ==='
          grep -E 'orphelin|non déclaré|non prouv|hors contrat|🔴|🟠|🟡' docs/BOUTIQUE_360.md | head -120 || true
      - name: Specialized ratchet checks
        run: |
          npm run dashboards:360:check
          npm run boutique:360:check
      - name: Backend debt audit
        run: |
          set +e
          npm run backend:debt
          code=$?
          echo "BACKEND_DEBT_EXIT=$code"
          exit 0
      - name: Backend architecture audit
        run: |
          set +e
          npm run backend:audit
          code=$?
          echo "BACKEND_AUDIT_EXIT=$code"
          exit 0
