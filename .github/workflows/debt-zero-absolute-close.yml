name: Debt Zero absolute close

on:
  push:
    branches:
      - ci/debt-zero-absolute-close

permissions:
  contents: read

jobs:
  classify-feature360-debt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: chore/debt-zero-absolute
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Classify remaining debt against governed table ownership
        run: |
          node - <<'NODE'
          const bfg = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const f360 = require('./docs/FEATURE_360.json');

          const dbPairs = new Map();
          function note(from, to, channel, table) {
            if (!from || !to || from === to) return;
            const key = `${from}=>${to}`;
            const list = dbPairs.get(key) || [];
            list.push({ channel, table });
            dbPairs.set(key, list);
          }

          for (const [table, info] of Object.entries(bfg.tableOwnership || {})) {
            const owner = info.lifecycleOwner;
            if (!owner) continue;
            for (const reader of info.readers || []) note(reader, owner, 'db-read', table);
            for (const writer of info.writers || []) note(writer.feature, owner, 'db-write', table);
          }

          console.log('FEATURE360_DEBT_TOTAL', f360.summary.debtItemsTotal);
          for (const feature of f360.features) {
            if (!feature.architecturalDebt?.debtCount) continue;
            console.log(`FEATURE ${feature.id} debt=${feature.architecturalDebt.debtCount}`);
            for (const item of feature.architecturalDebt.debtItems) {
              let target = null;
              if (item.type === 'DECLARED_NOT_OBSERVED') {
                const match = item.evidence.match(/déclare "([^"]+)"/);
                target = match && match[1];
              }
              const dbEvidence = target ? (dbPairs.get(`${feature.id}=>${target}`) || []) : [];
              console.log('DEBT_ITEM', JSON.stringify({
                feature: feature.id,
                type: item.type,
                target,
                evidence: item.evidence,
                dbEvidence,
              }));
            }
          }

          const debtPairs = new Set();
          for (const feature of f360.features) {
            for (const item of feature.architecturalDebt?.debtItems || []) {
              if (item.type !== 'DECLARED_NOT_OBSERVED') continue;
              const match = item.evidence.match(/déclare "([^"]+)"/);
              if (match) debtPairs.add(`${feature.id}=>${match[1]}`);
            }
          }
          console.log('DB_EVIDENCE_FOR_DEBT_PAIRS');
          for (const key of [...debtPairs].sort()) {
            const evidence = dbPairs.get(key) || [];
            console.log(key, JSON.stringify(evidence));
          }
          NODE
