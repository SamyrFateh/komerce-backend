name: Debt Zero absolute close

on:
  push:
    branches:
      - ci/debt-zero-absolute-close

permissions:
  contents: read

jobs:
  classify-db-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: chore/debt-zero-absolute
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Measure governed DB dependencies
        run: |
          node - <<'NODE'
          const bfg = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const declared = new Set((bfg.edges.consumesFeature || [])
            .filter(e => e.resolved)
            .map(e => `${e.from}=>${e.to}`));

          const pairs = new Map();
          function note(from, to, channel, table) {
            if (!from || !to || from === to) return;
            const key = `${from}=>${to}`;
            const evidence = pairs.get(key) || [];
            const token = `${channel}:${table}`;
            if (!evidence.includes(token)) evidence.push(token);
            pairs.set(key, evidence);
          }

          for (const [table, info] of Object.entries(bfg.tableOwnership || {})) {
            const owner = info.lifecycleOwner;
            if (!owner) continue;
            for (const reader of info.readers || []) note(reader, owner, 'db-read', table);
            for (const writer of info.writers || []) note(writer.feature, owner, 'db-write', table);
          }

          const all = [...pairs.entries()].sort((a,b) => a[0].localeCompare(b[0]));
          const declaredDb = all.filter(([key]) => declared.has(key));
          const undeclaredDb = all.filter(([key]) => !declared.has(key));
          console.log('DB_PAIR_TOTAL', all.length);
          console.log('DB_PAIR_DECLARED', declaredDb.length);
          console.log('DB_PAIR_UNDECLARED', undeclaredDb.length);
          console.log('DB_DECLARED_PAIRS');
          for (const [key, evidence] of declaredDb) console.log('DECLARED_DB', key, JSON.stringify(evidence));
          console.log('DB_UNDECLARED_PAIRS');
          for (const [key, evidence] of undeclaredDb) console.log('UNDECLARED_DB', key, JSON.stringify(evidence));
          NODE
