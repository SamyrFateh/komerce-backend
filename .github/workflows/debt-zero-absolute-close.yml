name: Debt Zero Boutique test truth closure

on:
  push:
    branches:
      - ci/debt-zero-absolute-close

permissions:
  contents: write

jobs:
  boutique-test-truth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Checkout certified PR head
        run: |
          git config user.name "SamyrFateh"
          git config user.email "fatehsamyr@gmail.com"
          git checkout -B chore/debt-zero-absolute origin/chore/debt-zero-absolute
          test "$(git rev-parse HEAD)" = "af14c27edf0379ceecda8680b931c9f4700b7df8"

      - name: Align stale tests with canonical current sources
        run: |
          python - <<'PY'
          from pathlib import Path

          # Header: final desktop polish deliberately removed the permanent rule/shadow.
          p = Path('public/boutique/tests/unit/visual-geometry-css-invariants.test.js')
          s = p.read_text()
          old = """      expect(desktop).toMatch(\n        /border-bottom\\s*:\\s*1px solid rgba\\(42,33,23,\\.08\\)/\n      );\n      expect(desktop).toMatch(\n        /box-shadow\\s*:\\s*0 4px 16px rgba\\(42,33,23,\\.06\\)/\n      );"""
          new = """      expect(desktop).toMatch(/border-bottom\\s*:\\s*0/);\n      expect(desktop).toMatch(/box-shadow\\s*:\\s*none/);"""
          if old not in s:
              raise SystemExit('visual header invariant target not found')
          p.write_text(s.replace(old, new, 1))

          # Taxonomy schema: Tech rail asset has moved to the v2 WebP campaign.
          p = Path('public/boutique/tests/unit/shop-schema-active-flows.test.js')
          s = p.read_text()
          old = "expect(schema.getCategoryImage('Tech')).toContain('/boutique/categories/tech.jpg');"
          new = "expect(schema.getCategoryImage('Tech')).toContain('/boutique/categories/tech-v2.webp');"
          if old not in s:
              raise SystemExit('Tech category image expectation not found')
          p.write_text(s.replace(old, new, 1))

          # PDP geometry: 900px fallback lives in the hybrid sheet; >=1200px final
          # geometry is owned by modal-desktop-density.css. Assert both owners.
          p = Path('public/boutique/tests/unit/modal-desktop-premium-polish.test.js')
          s = p.read_text()
          old_decl = "const hybrid = source('css/modal-product-lot4-hybrid.css');"
          new_decl = old_decl + "\nconst density = source('css/modal-desktop-density.css');"
          if "const density = source('css/modal-desktop-density.css');" not in s:
              if old_decl not in s:
                  raise SystemExit('hybrid source declaration not found')
              s = s.replace(old_decl, new_decl, 1)
          old_expect = "expect(hybrid).toMatch(/grid-template-columns:\\s*minmax\\(0,\\s*1fr\\)\\s*minmax\\(390px,\\s*420px\\)/);"
          new_expect = """expect(hybrid).toMatch(/grid-template-columns:\\s*minmax\\(0,\\s*48%\\)\\s*minmax\\(0,\\s*52%\\)/);\n    expect(density).toMatch(/grid-template-columns:\\s*minmax\\(0,\\s*1fr\\)\\s*minmax\\(460px,\\s*520px\\)/);"""
          if old_expect not in s:
              raise SystemExit('old hybrid geometry expectation not found')
          p.write_text(s.replace(old_expect, new_expect, 1))
          PY
          git diff --check
          git diff -- public/boutique/tests/unit/visual-geometry-css-invariants.test.js \
            public/boutique/tests/unit/shop-schema-active-flows.test.js \
            public/boutique/tests/unit/modal-desktop-premium-polish.test.js

      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci

      - name: Prove the three corrected invariants
        run: |
          cd public/boutique
          npx --no-install jest \
            tests/unit/visual-geometry-css-invariants.test.js \
            tests/unit/shop-schema-active-flows.test.js \
            tests/unit/modal-desktop-premium-polish.test.js \
            --runInBand

      - name: Full Boutique unit suite
        run: npm --prefix public/boutique run test:unit -- --forceExit

      - name: Commit and push tests only with lease
        run: |
          changed="$(git status --short)"
          echo "$changed"
          test -n "$changed"
          non_tests="$(git status --short | awk '{print $2}' | grep -v '^public/boutique/tests/unit/' || true)"
          if [ -n "$non_tests" ]; then
            echo "Unexpected non-test changes:"
            echo "$non_tests"
            exit 1
          fi
          git add public/boutique/tests/unit/visual-geometry-css-invariants.test.js \
            public/boutique/tests/unit/shop-schema-active-flows.test.js \
            public/boutique/tests/unit/modal-desktop-premium-polish.test.js
          git diff --cached --check
          git commit -m "test(boutique): align invariants with canonical CSS and assets"
          git push \
            --force-with-lease=refs/heads/chore/debt-zero-absolute:af14c27edf0379ceecda8680b931c9f4700b7df8 \
            origin HEAD:chore/debt-zero-absolute
