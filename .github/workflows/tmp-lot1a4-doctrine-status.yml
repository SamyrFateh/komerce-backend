name: TMP LOT 1A doctrine status

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-status:
    if: github.head_ref == 'agent/lot1a-4-economic-variables'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace exact canonical status sentence
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/doctrine/DOCTRINE_ADMIN_DASHBOARDS.md')
          s = p.read_text(encoding='utf-8')
          old = "**Prochain : LOT 1A — intégrité silencieuse sous Golden `BEFORE == AFTER`. LOT 2 UI reste hors séquence jusqu’à la sécurisation des vérités prévue avant lui.**"
          new = "**LOT 1A fermé à 4/4 sous Golden `BEFORE == AFTER`. Prochain : LOT 1B — corrections économiques explicites sous `DELTA TOTAL == DELTA EXPLIQUÉ`. LOT 2 UI reste hors séquence jusqu’à la sécurisation des vérités prévue avant lui.**"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one status sentence, got {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit doctrine status only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/doctrine/DOCTRINE_ADMIN_DASHBOARDS.md
          git diff --cached --check
          git commit -m "docs: mark LOT 1A closed in dashboard doctrine"
          git push origin HEAD:${GITHUB_HEAD_REF}
