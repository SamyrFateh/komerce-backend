name: Concept gate diagnostics

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize manifest fix as remote git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i "/'railway.json',/d" features/infrastructure.feature.js
          git rev-parse 'HEAD^{tree}' > base-tree-sha.txt
          python - <<'PY' > blob-payload.json
          import base64, json
          raw = open('features/infrastructure.feature.js', 'rb').read()
          print(json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input blob-payload.json --jq .sha > manifest-blob-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: concept-gate-diagnostics
          path: |
            base-tree-sha.txt
            manifest-blob-sha.txt
          if-no-files-found: error
