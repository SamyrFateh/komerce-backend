name: Concept gate diagnostics

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture governance outputs
        run: |
          npm run gate:docs-lint > docs-lint.txt 2>&1 || true
          npm run gate:concept-impact > concept-impact.txt 2>&1 || true
          npm test -- --runTestsByPath tests/unit/concept-impact-gate.test.js --no-coverage > concept-test.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: concept-gate-diagnostics
          path: |
            docs-lint.txt
            concept-impact.txt
            concept-test.txt
          if-no-files-found: error
