name: Isolated CJ Golden trigger-purchasing

'on':
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: isolated-cj-golden-trigger-purchasing
  cancel-in-progress: false

jobs:
  cj-golden:
    name: CJ Golden — B2C paid to sandbox supplier order
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && github.event.issue.title == '[isolated-op] cj-golden-trigger-purchasing')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_golden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_golden"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: '1'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_golden
      CJ_ACCESS_TOKEN: ${{ secrets.KOMERCE_CJ_PROOF_ACCESS_TOKEN }}
      KOMERCE_ALLOW_CJ_GOLDEN_TRIGGER: '1'
      KOMERCE_CJ_SANDBOX: '1'
      KOMERCE_CJ_AUTO_ORDER_ENABLED: '1'
      KOMERCE_PROCUREMENT_HUB_REF: 'CJ-SANDBOX'
      KOMERCE_PROCUREMENT_HUB_DESTINATION_JSON: '{"postal_code":"10001","country_code":"US","country":"United States","province":"New York","city":"New York","customer_name":"Komerce Sandbox","address1":"350 5th Ave","phone":"2127363100"}'
      KOMERCE_CJ_LOGISTIC_NAME: 'CJPacket'
      KOMERCE_CJ_FROM_COUNTRY_CODE: 'CN'

    steps:
      - name: Checkout protected main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Assert isolated sandbox runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$KOMERCE_ENV" = 'staging'
          test "$NODE_ENV" = 'test'
          test "$KOMERCE_CJ_SANDBOX" = '1'
          test "$KOMERCE_CJ_AUTO_ORDER_ENABLED" = '1'
          test -n "${CJ_ACCESS_TOKEN:-}"

      - name: Rebuild ephemeral PostgreSQL
        run: |
          PGPASSWORD=komerce psql -h localhost -U komerce -d komerce_golden -f docs/db/railway-live-schema.sql
          node scripts/ci-db-bootstrap.js

      - name: Run Golden through real triggerPurchasing
        id: golden
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 900s node scripts/cj-golden-trigger-purchasing-proof.js)"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-12000)"
          {
            echo 'summary<<EOF'
            echo "$compact"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Write Golden summary
        if: always()
        env:
          GOLDEN_SUMMARY: ${{ steps.golden.outputs.summary }}
        run: |
          {
            echo '## CJ Golden triggerPurchasing'
            echo
            echo '- DB: ephemeral PostgreSQL'
            echo '- provider: CJ sandbox'
            echo '- payment: forbidden'
            echo '- confirmOrder: forbidden'
            echo '- path: paid B2C -> purchase_line -> purchase_order -> CJ sandbox -> supplier_order_id'
            echo '- replay: same Komerce PO, no duplicate PO'
            if [ -n "${GOLDEN_SUMMARY:-}" ]; then echo "- result: $GOLDEN_SUMMARY"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close successful command issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GOLDEN_SUMMARY: ${{ steps.golden.outputs.summary }}
        run: |
          body="$(printf 'CJ Golden triggerPurchasing completed successfully. Sandbox only; no payment or confirmOrder.\n\nResult: %s' "$GOLDEN_SUMMARY")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
