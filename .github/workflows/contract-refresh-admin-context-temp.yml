name: Contract refresh AdminContext one-shot

on:
  push:
    branches:
      - feat/canonical-admin-context-server-2c
    paths:
      - .github/workflows/contract-refresh-admin-context-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-admin-context-server-2c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Register AdminContext dashboard routes in generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/contract-generate.js')
          s = p.read_text()

          route_marker = "  // ADMIN — surfaces dashboards\n"
          route_block = """  // LOT 2C — Canonical AdminContext + Pilotage market-scoped\n  { prefix: '/api/admin/dashboard/context', method: 'get', schema: null },\n  { prefix: '/api/admin/dashboard/unified/market/{marketCode}', method: 'get', schema: null },\n"""
          if route_block not in s:
              if route_marker not in s:
                  raise SystemExit('ROUTE_SCHEMA_MAP marker not found')
              s = s.replace(route_marker, route_marker + route_block, 1)

          response_marker = "const KNOWN_RESPONSES = {\n"
          response_block = """  // LOT 2C — réponses consommées par Canonical et couvertes par tests.\n  '/api/admin/dashboard/context': {\n    get: { fields: ['actor','access'], source: 'test' }\n  },\n  '/api/admin/dashboard/unified/market/{marketCode}': {\n    get: { fields: ['scope','kpis_global','view_blocks','economic_flow','principles','system_alerts','data_quality'], source: 'test' }\n  },\n"""
          if response_block not in s:
              if response_marker not in s:
                  raise SystemExit('KNOWN_RESPONSES marker not found')
              s = s.replace(response_marker, response_marker + response_block, 1)

          p.write_text(s)

          debt = Path('docs/contract/DEBT.md')
          d = debt.read_text()
          note = """\n\n## Dérives intentionnelles résolues — 2026-08-24 / LOT 2C\n\n- `GET /api/admin/dashboard/context` — projection AdminContext serveur consommée par Canonical.\n- `GET /api/admin/dashboard/unified/market/{marketCode}` — agrégat Pilotage market-scoped consommé par Canonical.\n\nCes deux routes sont intentionnelles, protégées par les frontières d'autorité dashboard et couvertes par les tests LOT 2C ; elles ne constituent pas de dette UNKNOWN.\n"""
          if 'Dérives intentionnelles résolues — 2026-08-24 / LOT 2C' not in d:
              debt.write_text(d.rstrip() + note + '\n')
          PY

      - name: Generate canonical OpenAPI contract
        run: npm run contract:generate

      - name: Verify generated contract covers Canonical consumers
        run: node scripts/contract-check.js

      - name: Commit refreshed contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/contract-generate.js docs/contract/openapi.json docs/contract/DEBT.md
          if git diff --cached --quiet; then
            echo "No contract refresh needed"
            exit 0
          fi
          git commit -m "chore(contract): refresh AdminContext dashboard routes"
          git push origin HEAD:feat/canonical-admin-context-server-2c
