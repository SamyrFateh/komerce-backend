# Read-only gate for exact CJ KIR-000014 after the four-item real supplier intake.
name: CJ four catalogue draft readiness — staging readonly
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-cj-four-readonly-readiness
  cancel-in-progress: false
jobs:
  readiness:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] cj-four-catalogue-readiness-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GITHUB_ACTIONS: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      CJ_FOUR_READONLY_APPROVED: '1'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      PGOPTIONS: '-c default_transaction_read_only=on'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate staging identity
        run: node scripts/recette/target-guard.js
      - name: Inspect exact four authentic candidates and canonical handoff prerequisites
        run: node scripts/recette/cj-four-catalogue-readiness-readonly.js
      - name: Preserve full typed blocker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-four-readiness-${{ github.run_id }}
          path: test-results/cj-four-catalogue-readiness/report.json
          retention-days: 21
          if-no-files-found: warn
