name: T030 Final PDP Closeout

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: t030-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'agent/lane-final'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout final lane head
        uses: actions/checkout@v4
        with:
          ref: agent/lane-final
          fetch-depth: 0
          persist-credentials: true

      - name: Execute reproducible T030 closeout
        shell: bash
        run: bash .agent/generated/t030-final-runner.sh
