name: T030 Final PDP Closeout

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: t030-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'agent/lane-final'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout final lane head
        uses: actions/checkout@v4
        with:
          ref: agent/lane-final
          fetch-depth: 0
          persist-credentials: true

      - name: Execute reproducible T030 closeout
        shell: bash
        run: |
          set -uo pipefail
          test -f .agent/evidence/T-030/t029-integration-complete.txt
          sed -i 's/^  apply_t029_source_patch$/  echo "T-029 already integrated and verified"/' .agent/generated/t030-final-runner.sh
          bash .agent/generated/t030-final-runner.sh 2>&1 | tee /tmp/t030-run.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git config user.name 'komerce-t030-bot'
            git config user.email 'komerce-t030-bot@users.noreply.github.com'
            mkdir -p .agent/evidence/T-030
            {
              echo "RUNNER_EXIT=$status"
              echo
              echo 'LAST_240_LINES'
              tail -n 240 /tmp/t030-run.log
            } > .agent/evidence/T-030/runner-last-error.txt
            git add .agent/evidence/T-030/runner-last-error.txt
            git commit -m 'chore(t030): record closeout runner failure'
            git push origin HEAD:agent/lane-final
            exit "$status"
          fi
