name: T030 Final PDP Closeout

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: t030-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'agent/lane-final'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout final lane head
        uses: actions/checkout@v4
        with:
          ref: agent/lane-final
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare semantic verifier
        shell: bash
        run: |
          mkdir -p .agent/evidence/T-030
          rm -f .agent/evidence/T-030/workflow-patch-error.txt
          if ! python3 <<'PY'
          from pathlib import Path
          import traceback

          try:
              path = Path('.agent/generated/t030-final-runner.sh')
              text = path.read_text(encoding='utf-8')
              marker = "checks = []\ndef check(name, condition):"
              helper = (
                  "def strip_css_comments(css):\n"
                  "    import re\n"
                  "    return re.sub(r'/\\*.*?\\*/', '', css, flags=re.S)\n"
                  "\n"
                  "def has_transform_css(css):\n"
                  "    import re\n"
                  "    clean = strip_css_comments(css)\n"
                  "    return bool(re.search(r'(^|[;{}])\\s*transform\\s*:', clean)) or bool(\n"
                  "        re.search(r'transition(?:-property)?\\s*:[^;]*\\btransform\\b', clean)\n"
                  "    )\n"
                  "\n"
                  "def has_fav_pop_css(css):\n"
                  "    clean = strip_css_comments(css)\n"
                  "    return '.k-modal-fav-btn.k-pop' in clean or '@keyframes k-modal-fav-pop' in clean\n"
                  "\n"
                  "checks = []\n"
                  "def check(name, condition):"
              )
              if marker not in text:
                  raise RuntimeError('semantic verifier marker missing')
              text = text.replace(marker, helper, 1)
              replacements = {
                  "'k-modal-fav-pop' not in files['media']": "not has_fav_pop_css(files['media'])",
                  "'transform' not in block(files['media'], '.k-modal-fav-btn {')": "not has_transform_css(block(files['media'], '.k-modal-fav-btn {'))",
                  "'transform' not in block(files['media'], '.k-modal-recent-card:hover')": "not has_transform_css(block(files['media'], '.k-modal-recent-card:hover'))",
                  "'display: none' in block(files['shell'], '.k-modal-keyboard-hint')": "'.k-modal-keyboard-hint' not in files['shell'] or 'display: none' in block(files['shell'], '.k-modal-keyboard-hint')",
                  "'transform' not in block(files['product'], '.k-sku {')": "not has_transform_css(block(files['product'], '.k-sku {'))",
                  "'transform' not in block(files['product'], '.k-sku:hover:not(.k-sku--out)')": "not has_transform_css(block(files['product'], '.k-sku:hover:not(.k-sku--out)'))",
                  "'transform' not in block(files['lot4'], '#k-modal .k-buybox-payment-tab {')": "not has_transform_css(block(files['lot4'], '#k-modal .k-buybox-payment-tab {'))",
                  "'transform' not in block(files['lot4'], '#k-modal .k-buybox-payment-tab:hover')": "not has_transform_css(block(files['lot4'], '#k-modal .k-buybox-payment-tab:hover'))",
                  "'transform' not in block(files['shell'], '#k-modal .k-modal-thumb:hover')": "not has_transform_css(block(files['shell'], '#k-modal .k-modal-thumb:hover'))",
              }
              for old, new in replacements.items():
                  if old not in text:
                      raise RuntimeError(f'semantic verifier expression missing: {old}')
                  text = text.replace(old, new, 1)

              old_main = "  verify_t028_already_integrated\n  apply_t029_source_patch"
              new_main = """  if ! verify_t028_already_integrated; then
            if [ -f .agent/evidence/T-030/t028-integration-check.txt ]; then
              git add .agent/evidence/T-030/t028-integration-check.txt
              if ! git diff --cached --quiet; then
                git commit -m 'chore(t030): record T-028 semantic integration check'
                git push origin HEAD:agent/lane-final
              fi
            fi
            exit 4
          fi
          apply_t029_source_patch"""
              if old_main not in text:
                  raise RuntimeError('runner main verification block missing')
              text = text.replace(old_main, new_main, 1)
              path.write_text(text, encoding='utf-8')
          except Exception:
              Path('.agent/evidence/T-030/workflow-patch-error.txt').write_text(traceback.format_exc(), encoding='utf-8')
              raise
          PY
          then
            git config user.name 'komerce-t030-bot'
            git config user.email 'komerce-t030-bot@users.noreply.github.com'
            git add .agent/evidence/T-030/workflow-patch-error.txt
            if ! git diff --cached --quiet; then
              git commit -m 'chore(t030): record workflow preparation error'
              git push origin HEAD:agent/lane-final
            fi
            exit 5
          fi

      - name: Execute reproducible T030 closeout
        shell: bash
        run: |
          rm -f .agent/evidence/T-030/runner-last-error.txt
          set +e
          bash .agent/generated/t030-final-runner.sh 2>&1 | tee /tmp/t030-runner.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            current_status="$(git status --short || true)"
            git reset --hard HEAD
            mkdir -p .agent/evidence/T-030
            {
              echo "RUNNER_EXIT=$status"
              echo
              echo 'GIT_STATUS_AT_FAILURE'
              printf '%s\n' "$current_status"
              echo
              echo 'RUNNER_LOG'
              cat /tmp/t030-runner.log
            } > .agent/evidence/T-030/runner-last-error.txt
            git config user.name 'komerce-t030-bot'
            git config user.email 'komerce-t030-bot@users.noreply.github.com'
            git add .agent/evidence/T-030/runner-last-error.txt
            if ! git diff --cached --quiet; then
              git commit -m 'chore(t030): record runner failure details'
              git push origin HEAD:agent/lane-final
            fi
            exit "$status"
          fi
