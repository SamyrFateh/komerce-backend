name: T030 Final PDP Closeout

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: t030-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'agent/lane-final'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout final lane head
        uses: actions/checkout@v4
        with:
          ref: agent/lane-final
          fetch-depth: 0
          persist-credentials: true

      - name: Preflight — T029 integration marker
        run: test -f .agent/evidence/T-030/t029-integration-complete.txt

      - name: Preflight — Git refs and durable ancestry
        shell: bash
        run: |
          set -euo pipefail
          source <(sed '$d' .agent/generated/t030-final-runner.sh)
          configure_git

      - name: Preflight — verify T028 semantic invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          files = {
              'shell': Path('public/boutique/css/modal-shell.css').read_text(encoding='utf-8'),
              'media': Path('public/boutique/css/modal-media.css').read_text(encoding='utf-8'),
              'product': Path('public/boutique/css/modal-product.css').read_text(encoding='utf-8'),
              'lot4': Path('public/boutique/css/modal-product-lot4-hybrid.css').read_text(encoding='utf-8'),
          }

          def strip_comments(text):
              return re.sub(r'/\*.*?\*/', '', text, flags=re.S)

          def block(text, selector):
              text = strip_comments(text)
              start = text.find(selector)
              if start < 0:
                  raise AssertionError(f'selector absent: {selector}')
              brace = text.find('{', start)
              depth = 0
              for index in range(brace, len(text)):
                  if text[index] == '{':
                      depth += 1
                  elif text[index] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[brace + 1:index]
              raise AssertionError(f'bloc non fermé: {selector}')

          clean = {key: strip_comments(value) for key, value in files.items()}
          checks = [
              ('mic pulse animation removed', 'animation: k-mic-pulse' not in clean['product'] and '@keyframes k-mic-pulse' not in clean['product']),
              ('favorite pop removed', 'k-modal-fav-pop' not in clean['media']),
              ('favorite active scale removed', '.k-modal-fav-btn:active' not in clean['media']),
              ('favorite base transition has no transform', 'transform' not in block(files['media'], '.k-modal-fav-btn {')),
              ('recent-card hover has no transform', 'transform' not in block(files['media'], '.k-modal-recent-card:hover')),
              ('keyboard hint hidden', 'display: none' in block(files['media'], '.k-modal-keyboard-hint')),
              ('reduced motion block present', '@media (prefers-reduced-motion: reduce)' in clean['shell']),
              ('SKU base transition has no transform', 'transform' not in block(files['product'], '.k-sku {')),
              ('SKU hover has no transform', 'transform' not in block(files['product'], '.k-sku:hover:not(.k-sku--out)')),
              ('payment tab base has no transform', 'transform' not in block(files['lot4'], '#k-modal .k-buybox-payment-tab {')),
              ('payment tab hover has no transform', 'transform' not in block(files['lot4'], '#k-modal .k-buybox-payment-tab:hover')),
              ('thumbnail hover has no transform', 'transform' not in block(files['shell'], '#k-modal .k-modal-thumb:hover')),
          ]

          out = Path('.agent/evidence/T-030/t028-integration-check.txt')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text('\n'.join(f"{'PASS' if ok else 'FAIL'} — {name}" for name, ok in checks) + '\n', encoding='utf-8')
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit('T-028 invariants missing: ' + ', '.join(failed))
          PY

      - name: Preflight — recover T028 and T029 metadata
        shell: bash
        run: |
          set -euo pipefail
          source <(sed '$d' .agent/generated/t030-final-runner.sh)
          recover_lane_metadata

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          source <(sed '$d' .agent/generated/t030-final-runner.sh)
          install_dependencies

      - name: Initialize final gate evidence
        shell: bash
        run: |
          mkdir -p .agent/evidence/T-030
          : > .agent/evidence/T-030/gates-final.txt

      - name: Gate — deploy CSS
        run: npm --prefix public/boutique run deploy:css 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — cache
        run: npm --prefix public/boutique run check:cache 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — boutique check all
        run: npm --prefix public/boutique run check:all 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — boutique unit tests
        run: npm --prefix public/boutique run test:unit 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — root unit tests
        run: npm run test:unit 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — feature registry
        run: npm run feature:registry 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — schema
        run: npm run gate:schema 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — touched files
        run: npm run gate:touched-files 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — docs lint
        run: npm run gate:docs-lint 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — feature audit
        run: npm run gate:feature-audit 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — boutique ownership
        run: npm run gate:boutique-ownership 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — audit features
        run: npm run audit:features 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt
      - name: Gate — map check
        run: npm run map:check 2>&1 | tee -a .agent/evidence/T-030/gates-final.txt

      - name: Capture final coverage
        shell: bash
        run: |
          set -euo pipefail
          source <(sed '$d' .agent/generated/t030-final-runner.sh)
          capture_coverage

      - name: Generate 36 real PDP captures
        shell: bash
        run: |
          set -euo pipefail
          ./public/boutique/node_modules/.bin/serve public -l 4173 > /tmp/t030-serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/boutique/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          NODE_PATH="$PWD/public/boutique/node_modules" \
            T030_BASE_URL='http://127.0.0.1:4173/boutique/' \
            node .agent/generated/t030-capture.cjs 2>&1 | tee /tmp/t030-capture.log
          test "$(find .agent/evidence/T-030/captures -type f -name '*.png' | wc -l)" -eq 36
          test "$(find .agent/evidence/T-030/states -type f -name '*.json' | wc -l)" -eq 36

      - name: Persist capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          capture_log="$(tail -n 240 /tmp/t030-capture.log 2>/dev/null || true)"
          serve_log="$(tail -n 120 /tmp/t030-serve.log 2>/dev/null || true)"
          partial_files="$(find .agent/evidence/T-030/captures .agent/evidence/T-030/states -type f 2>/dev/null | sort || true)"
          git reset --hard HEAD
          git clean -fd
          mkdir -p .agent/evidence/T-030
          {
            echo 'T030_CAPTURE_FAILURE=1'
            echo
            echo 'CAPTURE_LOG_LAST_240'
            printf '%s\n' "$capture_log"
            echo
            echo 'SERVER_LOG_LAST_120'
            printf '%s\n' "$serve_log"
            echo
            echo 'PARTIAL_FILES'
            printf '%s\n' "$partial_files"
          } > .agent/evidence/T-030/capture-error.txt
          git config user.name 'komerce-t030-bot'
          git config user.email 'komerce-t030-bot@users.noreply.github.com'
          git add .agent/evidence/T-030/capture-error.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore(t-030): record Playwright capture failure'
            git push origin HEAD:agent/lane-final
          fi

      - name: Build final report and package
        shell: bash
        run: |
          set -euo pipefail
          source <(sed '$d' .agent/generated/t030-final-runner.sh)
          build_report_and_package

      - name: Finalize T030 state
        shell: bash
        run: |
          set -euo pipefail
          source <(sed '$d' .agent/generated/t030-final-runner.sh)
          finalize_state

      - name: Commit and push T030 closeout
        shell: bash
        run: |
          set -euo pipefail
          source <(sed '$d' .agent/generated/t030-final-runner.sh)
          git config user.name 'komerce-t030-bot'
          git config user.email 'komerce-t030-bot@users.noreply.github.com'
          commit_final_result
