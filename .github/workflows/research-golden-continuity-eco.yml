name: R&D ECO Golden continuity checkpoints
on:
  push:
    branches:
      - research/golden-continuity-checkpoints-20261026
    paths:
      - .github/workflows/research-golden-continuity-eco.yml
      - scripts/research/golden-continuity-fingerprint.js
      - scripts/research/golden-continuity-fingerprint.test.js
      - scripts/research/golden-continuity-collector.js
      - scripts/research/golden-continuity-collector.test.js
      - scripts/research/p1-p7-boundary-oracle.js
      - scripts/research/p1-p7-boundary-oracle.test.js
      - scripts/research/p1-p7-canonical-collector.js
      - scripts/research/p1-p7-canonical-collector.test.js
      - scripts/research/p2-p4-canonical-collector.js
      - scripts/research/p2-p4-canonical-collector.test.js
      - scripts/research/p4-p2-canonical-collector.js
      - scripts/research/p4-p2-canonical-collector.test.js
      - scripts/research/p5-p2-canonical-collector.js
      - scripts/research/p5-p2-canonical-collector.test.js
      - scripts/research/p3-p6-canonical-collector.js
      - scripts/research/p3-p6-canonical-collector.test.js
      - scripts/research/p4-p6-canonical-collector.js
      - scripts/research/p4-p6-canonical-collector.test.js
      - scripts/research/p5-p6-canonical-collector.js
      - scripts/research/p5-p6-canonical-collector.test.js
      - scripts/research/p1-p7-audit-once.js
      - scripts/research/p1-p7-audit-once.test.js
      - package.json
      - tests/unit/golden-checkout-thread.test.js
      - services/golden-checkout-thread.js
permissions:
  contents: read
concurrency:
  group: research-golden-continuity-eco
  cancel-in-progress: true
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      FP_EXPECT_GOLDEN_MARKET_GUARD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Pure continuity fingerprints (zero new dependencies)
        run: node --test scripts/research/golden-continuity-fingerprint.test.js scripts/research/golden-continuity-collector.test.js scripts/research/p1-p7-boundary-oracle.test.js scripts/research/p1-p7-canonical-collector.test.js scripts/research/p1-p7-audit-once.test.js scripts/research/p2-p4-canonical-collector.test.js scripts/research/p4-p2-canonical-collector.test.js scripts/research/p5-p2-canonical-collector.test.js scripts/research/p3-p6-canonical-collector.test.js scripts/research/p4-p6-canonical-collector.test.js scripts/research/p5-p6-canonical-collector.test.js
      - name: Install existing dependencies only
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Targeted Golden projections — checkout, upstream, order
        run: ./node_modules/.bin/jest --config jest.unit.config.js --runInBand --no-coverage --runTestsByPath tests/unit/golden-checkout-thread.test.js tests/unit/golden-upstream-evidence.test.js tests/unit/golden-e2e-cockpit.test.js
