name: Temporary AUTH-8e harness fix

on:
  push:
    branches: [auth/8e-bearer-boundary]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Align route harness with AUTH-7 recent proof
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/auth-route.test.js')
          text = p.read_text(encoding='utf-8')
          old = "  authenticate: (req, _res, next) => { req.user = req.user || { id: 'user-1' }; next(); },"
          new = "  authenticate: (req, _res, next) => {\n    req.user = req.user || { id: 'user-1' };\n    req.auth = req.auth || { authTime: Math.floor(Date.now() / 1000), amr: ['passkey'] };\n    next();\n  },"
          if old not in text:
              raise SystemExit('auth-route authenticate harness pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/tmp-auth8e-harness-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/auth-route.test.js .github/workflows/tmp-auth8e-harness-fix.yml
          git commit -m "test(auth): align route harness with recent proof"
          git push origin HEAD:auth/8e-bearer-boundary
