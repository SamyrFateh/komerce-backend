name: Golden CDR

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/pricing-cdr.js'
      - 'services/pricing-engine.js'
      - 'services/pricing-recommend.js'
      - 'services/transport-pricing.js'
      - 'services/transport-rails.js'
      # LOT 1A — migrations de structure : BEFORE == AFTER obligatoire.
      - 'routes/admin-pricing-matrices.js'
      - 'routes/admin-finance-config.js'
      - 'routes/economic.js'
      - 'services/economic-engine-queries.js'
      - 'services/dashboard-ops-queries.js'
      - 'utils/eco-bridge.js'
      - 'utils/rates.js'
      - 'tools/golden-cdr/golden-cdr.js'
      - 'tools/golden-cdr/witnesses.js'
      - 'tools/golden-cdr/fixtures/**'
      - 'tools/golden-cdr/golden/**'

permissions:
  contents: read

jobs:
  verify:
    name: Golden CDR — parité
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts
      - name: Vérifier la présence du golden réel
        run: |
          if [ ! -f tools/golden-cdr/golden/cdr.golden.json ]; then
            echo "::error::Golden absent (tools/golden-cdr/golden/cdr.golden.json). Lance 'capture' et commite-le."
            exit 1
          fi
      - name: Verify (parité imputable au seul code)
        run: node tools/golden-cdr/golden-cdr.js verify
