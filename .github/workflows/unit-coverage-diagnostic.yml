name: Root Unit Coverage Diagnostic

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  statuses: write

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run unit coverage with forceExit
        run: |
          set -o pipefail
          npx jest --testPathPatterns="tests/unit" --ci --runInBand --testPathIgnorePatterns="tests/integration" --coverage --forceExit 2>&1 | tee unit-coverage.log
      - name: Upload unit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ github.run_id }}
          path: unit-coverage.log
          retention-days: 1
      - name: Publish unit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = "success" ]; then state=success; fi
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"unit-coverage-diagnostic\",\"description\":\"Root unit coverage diagnostic complete\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
