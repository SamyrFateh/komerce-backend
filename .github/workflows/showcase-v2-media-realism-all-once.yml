name: Showcase V2 media realism resume remaining

on:
  push:
    branches:
      - ops/showcase-v2-all-20260822
    paths:
      - '.github/workflows/showcase-v2-media-realism-all-once.yml'

permissions:
  contents: read

concurrency:
  group: showcase-v2-media-realism
  cancel-in-progress: false

jobs:
  generate-realistic-heroes:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require media realism secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY missing'; exit 1; }
          test -n "$IMAGEKIT_PRIVATE_KEY" || { echo 'IMAGEKIT_PRIVATE_KEY missing'; exit 1; }

      - name: Build exact resume set
        id: resume
        shell: bash
        run: |
          set -euo pipefail
          refs="SHOWCASE-V2-0162"
          for n in $(seq 164 500); do
            refs="$refs,SHOWCASE-V2-$(printf '%04d' "$n")"
          done
          echo "count=338" >> "$GITHUB_OUTPUT"
          echo "refs=$refs" >> "$GITHUB_OUTPUT"

      - name: Materialize 338-image resume plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/showcase-v2-media-realism.js \
            --refs '${{ steps.resume.outputs.refs }}' \
            --quality medium \
            --output artifacts/showcase-v2-media-realism-plan.json

      - name: Generate and overwrite remaining ImageKit heroes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/showcase-v2-media-realism.js \
            --apply \
            --refs '${{ steps.resume.outputs.refs }}' \
            --quality medium \
            --concurrency 2 \
            --confirm-all GENERATE-500 \
            --output artifacts/showcase-v2-media-realism-report.json

      - name: Upload media realism evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-v2-media-realism-resume-338
          path: artifacts/showcase-v2-media-realism-*.json
          if-no-files-found: warn
          retention-days: 14
