name: Temporary AUTH-8c finalizer

on:
  push:
    branches: [auth/8c-host-cookie]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove temporary helper from intended tree
        run: rm .github/workflows/tmp-auth8c-finalize.yml
      - run: npm ci
      - name: AUTH-8b/c regression
        run: npx jest tests/unit/auth-cookie.test.js tests/unit/csrf-origin.test.js tests/unit/auth-middleware.test.js --runInBand
      - name: Backend quality and feature gates
        run: |
          node scripts/code-quality-gate.js --strict
          node scripts/feature-guard.js --strict
      - name: Refresh governance projections
        run: |
          node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
          node scripts/gen-gate-findings.js
          node scripts/gen-feature-360.js
      - name: Verify final tree
        run: |
          node scripts/feature-guard.js --strict
          node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique
          node scripts/feature-360-check.js
          git diff --check
      - name: Commit final AUTH-8c tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(auth): use __Host- session cookies on secure runtimes"
          git push origin HEAD:auth/8c-host-cookie
