name: '4370 — Candidate staging Chromium wizard dry run'
on:
  push:
    branches: [recette/4370-candidate-chromium-2ec819c]
  workflow_dispatch:
  pull_request:
    branches: [feat/4370-market-onboarding-v2]
    paths: ['.github/workflows/4370-candidate-chromium-readonly.yml']
permissions:
  contents: read
concurrency:
  group: komerce-canonical-chromium-staging
  cancel-in-progress: false
jobs:
  onboarding-readonly:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'recette/4370-candidate-chromium-2ec819c')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      E2E_EXPECTED_DEPLOY_SHA: 2ec819c80d645f0cf50a32b3a775298ca729acab
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ec819c80d645f0cf50a32b3a775298ca729acab
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify pinned staging SHA
        run: node scripts/recette/staging-chromium-deployment-preflight.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real admin login and market onboarding entry (read only)
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const { expect } = require('@playwright/test');
          const origin = process.env.E2E_STAGING_BASE_URL;
          const sha = '2ec819c80d645f0cf50a32b3a775298ca729acab';
          const output = 'test-results/4370';
          fs.mkdirSync(output, { recursive: true });
          const proof = { target: origin, candidate: sha, viewport: '1440x900', browser: 'chromium', mode: 'READ_ONLY', outcome: 'NOT_PROVEN', blockedWrites: [] };
          (async () => {
            let browser;
            try {
              if (!process.env.E2E_ADMIN_EMAIL || !process.env.E2E_ADMIN_PASSWORD) throw Error('ADMIN_TEST_IDENTITY_MISSING');
              browser = await chromium.launch();
              const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, baseURL: origin });
              await page.route('**/*', route => {
                const req = route.request();
                const u = new URL(req.url());
                if (u.origin !== origin) return route.abort();
                if (['GET','HEAD','OPTIONS'].includes(req.method()) || (req.method() === 'POST' && u.pathname === '/api/auth/login')) return route.continue();
                proof.blockedWrites.push({ method: req.method(), path: u.pathname });
                return route.abort();
              });
              const version = await page.request.get('/health/version');
              const body = await version.json();
              proof.observedSha = String(body.commit || body.sha || '');
              if (!version.ok() || !/^[a-f0-9]{8,40}$/.test(proof.observedSha) || !sha.startsWith(proof.observedSha)) throw Error('EXACT_CANDIDATE_SHA_NOT_OBSERVED');
              await page.goto('/login.html?next='+encodeURIComponent('/dashboards/canonical/access.html'), {waitUntil:'domcontentloaded'});
              await page.locator('#email').fill(process.env.E2E_ADMIN_EMAIL);
              await page.locator('#password').fill(process.env.E2E_ADMIN_PASSWORD);
              const login = page.waitForResponse(r => new URL(r.url()).pathname === '/api/auth/login' && r.request().method() === 'POST');
              await page.locator('#btn-submit').click();
              proof.loginHttp = (await login).status();
              if (proof.loginHttp !== 200) throw Error('LOGIN_REFUSED');
              await page.waitForURL(u => u.pathname !== '/login.html');
              const ctx = await page.request.get('/api/admin/dashboard/context');
              proof.contextHttp = ctx.status();
              const data = await ctx.json();
              proof.role = data.actor?.role;
              if (!ctx.ok() || proof.role !== 'admin') throw Error('ADMIN_CONTEXT_NOT_PROVEN');
              await page.goto('/dashboards/canonical/access.html', {waitUntil:'domcontentloaded'});
              proof.stage = 'MARKET_REGISTRY';
              proof.path = new URL(page.url()).pathname;
              const create = page.locator('#markets-management').getByRole('button', {name:'Nouveau marché', exact:true});
              await expect(create).toBeVisible({timeout:20000});
              proof.stage = 'OPEN_WIZARD';
              const authority = page.waitForResponse(r => new URL(r.url()).pathname === '/api/admin/markets/central-authority' && r.request().method() === 'GET');
              await create.click();
              proof.authorityHttp = (await authority).status();
              if (proof.authorityHttp !== 200) throw Error('CENTRAL_AUTHORITY_REFUSED');
              proof.stage = 'WIZARD_FIELDS';
              const wizard = page.locator('.kmc-markets-onboarding');
              await expect(wizard).toBeVisible({timeout:20000});
              await expect(wizard.getByText('Initialiser un marché', {exact:true})).toBeVisible();
              await expect(wizard.getByText(/La boutique restera fermée/)).toBeVisible();
              await expect(wizard.locator('[name=code]')).toBeVisible();
              await expect(wizard.locator('[name=currency]')).toBeVisible();
              await expect(wizard.locator('[name=business_timezone]')).toBeVisible();
              proof.entry = 'PASS';
              proof.stage = 'IDENTITY';
              const field = name => wizard.locator('[name="'+name+'"]');
              const next = () => wizard.getByRole('button',{name:'Suivant',exact:true}).click();
              const occupied = await page.locator('#markets-management tr[data-market-code]').evaluateAll(rows=>rows.map(row=>row.dataset.marketCode));
              const choices = await field('currency').locator('option').evaluateAll(options=>options.map(o=>o.value).filter(Boolean));
              const candidates = [
                {code:'GA',currency:'XAF',timezone:'Africa/Libreville'},
                {code:'SN',currency:'XOF',timezone:'Africa/Dakar'},
                {code:'BJ',currency:'XOF',timezone:'Africa/Porto-Novo'},
                {code:'FR',currency:'EUR',timezone:'Europe/Paris'}
              ];
              const candidate = candidates.find(c=>!occupied.includes(c.code)&&choices.includes(c.currency));
              if (!candidate) throw Error('NO_FREE_DRY_RUN_MARKET_CURRENCY');
              proof.dryRunMarket = candidate.code;
              await field('code').fill(candidate.code);
              await field('name').fill('RECETTE 4370 — simulation');
              await field('currency').selectOption(candidate.currency);
              await field('business_timezone').fill(candidate.timezone);
              await expect(field('minor_unit')).not.toHaveValue('');
              await next();
              proof.stage = 'LEAD_AND_RIGHTS';
              await expect(wizard.getByText(/Responsable et droits/)).toBeVisible();
              const refs = await field('central_referent_user_id').locator('option').evaluateAll(options=>options.map(o=>o.value).filter(Boolean));
              if (!refs.length) throw Error('NO_CENTRAL_REFERENT');
              await field('central_referent_user_id').selectOption(refs[0]);
              await field('last_name').fill('Recette');
              await field('first_name').fill('Épreuve');
              await expect(field('email_preview')).toHaveValue('recette.epreuve@komerce.co');
              await field('phone').fill('+12025550123');
              const limits = wizard.locator('input[name^="limit_"]');
              await expect(limits).toHaveCount(4);
              for(let i=0;i<4;i++) await limits.nth(i).fill('0');
              await next();
              proof.stage = 'OPTIONAL_RELAY';
              await expect(wizard.getByText(/Relais \(facultatif\)/)).toBeVisible();
              await next();
              proof.stage = 'CASH_ONLY';
              await expect(wizard.getByText(/Étape 4 sur 5/)).toBeVisible();
              await field('cash_enabled').selectOption('true');
              await field('confirmation_mode').selectOption('SINGLE');
              for (const mode of ['stripe_eur','paypal_eur']) {
                if (await field(mode).count()) await field(mode).selectOption('false');
              }
              await next();
              proof.stage = 'FINAL_REVIEW';
              await expect(wizard.getByText(/Étape 5 sur 5/)).toBeVisible();
              await expect(wizard.getByText(/recette.epreuve@komerce.co/)).toBeVisible();
              await expect(wizard.getByText(/Premier relais : à configurer localement/)).toBeVisible();
              await expect(wizard.getByText('Paiements : Cash au relais',{exact:true})).toBeVisible();
              await expect(wizard.getByRole('button',{name:'Initialiser le marché',exact:true})).toBeVisible();
              await wizard.screenshot({path:output+'/wizard-review.png'});
              // Do not submit: no market fixture cleanup or isolated phone proof yet.
              await wizard.getByRole('button',{name:'Fermer',exact:true}).click();
              await expect(wizard).toHaveCount(0);
              if(proof.blockedWrites.some(w=>w.method==='POST'&&w.path==='/api/admin/markets')) throw Error('UNEXPECTED_PROVISION_ATTEMPT');
              proof.stage = 'DONE';
              proof.outcome = 'PASS_WIZARD_DRY_RUN_ONLY';
              proof.businessCertification = 'NOT_PROVEN';
            } catch (err) {
              proof.outcome = 'FAIL';
              proof.reason = ['ADMIN_TEST_IDENTITY_MISSING','EXACT_CANDIDATE_SHA_NOT_OBSERVED','LOGIN_REFUSED','ADMIN_CONTEXT_NOT_PROVEN','CENTRAL_AUTHORITY_REFUSED'].includes(err.message) ? err.message : (err.name || 'Error');
              console.error('Read-only candidate smoke failed:', proof.stage || 'PRE_ENTRY', proof.reason);
              process.exitCode = 1;
            } finally {
              if (browser) await browser.close();
              fs.writeFileSync(output+'/proof.json', JSON.stringify(proof,null,2));
            }
          })();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-4370-readonly-${{ github.run_id }}
          path: |
            test-results/4370/
            test-results/staging-chromium/deployment-preflight.json
          retention-days: 14
          if-no-files-found: warn
