name: Accounting 4D wire one-shot

on:
  push:
    branches:
      - ci/canonical-accounting-4d-wire

permissions:
  contents: write

jobs:
  wire-accounting-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ci-dummy:ci-dummy@localhost:5432/ci-dummy
      ADMIN_PASSWORD: ci-dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-dummy
      JWT_SECRET: ci-dummy
      SESSION_SECRET: ci-dummy
      INTERNAL_API_KEY: ci-dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      JWT_EXPIRES: 7d
      APP_URL: http://localhost
      PUBLIC_URL: http://localhost
      PUBLIC_BASE_URL: http://localhost
      ADMIN_RESET_KEY: ci-dummy
      INVOICE_PUBLIC_LINK_SECRET: ci-dummy
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_TOKEN: ci-dummy
      META_WA_PHONE_NUMBER_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-finance-accounting-workspace-4d
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Delegate Legacy cash deposit mutations to shared authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('routes/cash.js')
          s = p.read_text()
          if "cash-deposit-service" not in s:
              s = s.replace(
                  "const { collectCash } = require('../services/cash-operations'); // [R5]\n",
                  "const { collectCash } = require('../services/cash-operations'); // [R5]\nconst cashDeposits = require('../services/cash-deposit-service');\n",
                  1,
              )
              s = s.replace(
                  '* @depends       db.js, middleware/auth.js, services/*',
                  '* @depends       db.js, middleware/auth.js, services/cash-operations.js, services/cash-deposit-service.js, services/*',
                  1,
              )

          deposit_block = r'''// ═+\n// 3\. POST /deposit — Agent déclare un dépôt\n// ═+\nrouter\.post\('/deposit',[\s\S]*?\n\}\);\n\n// ═+\n// 4\. GET /deposits'''
          deposit_repl = '''// ══════════════════════════════════════════════════════════════════════════════
// 3. POST /deposit — Agent déclare un dépôt
// ══════════════════════════════════════════════════════════════════════════════
router.post('/deposit', authenticate, requireRelaisOrAdmin, async (req, res, next) => {
  try {
    const deposit = await cashDeposits.createDeposit({ agentId: req.user.id, payload: req.body || {} });
    return res.status(201).json({
      success: true,
      message: `Dépôt de ${Number(deposit.amount_kmf).toLocaleString('fr-FR')} KMF enregistré`,
      deposit,
    });
  } catch (err) {
    if (err instanceof cashDeposits.CashDepositError) {
      return res.status(err.status || 400).json({ error: err.message });
    }
    return next(err);
  }
});

// ══════════════════════════════════════════════════════════════════════════════
// 4. GET /deposits'''
          s, n = re.subn(deposit_block, deposit_repl, s, count=1)
          if n != 1:
              raise SystemExit(f'deposit legacy block replacement failed: {n}')

          verify_block = r'''// ═+\n// 5\. POST /deposits/:id/verify — Admin valide un dépôt\n// ═+\nrouter\.post\('/deposits/:id/verify',[\s\S]*?\n\}\);\n\n// ═+\n// 6\. POST /deposits/:id/dispute'''
          verify_repl = '''// ══════════════════════════════════════════════════════════════════════════════
// 5. POST /deposits/:id/verify — Admin valide un dépôt
// ══════════════════════════════════════════════════════════════════════════════
router.post('/deposits/:id/verify', authenticate, requireAdmin, async (req, res, next) => {
  try {
    const deposit = await cashDeposits.verifyDeposit({
      depositId: req.params.id,
      verifierId: req.user.id,
      notes: req.body && req.body.notes,
    });
    return res.json({ success: true, message: 'Dépôt vérifié', deposit });
  } catch (err) {
    if (err instanceof cashDeposits.CashDepositError) {
      return res.status(err.status || 400).json({ error: err.message });
    }
    return next(err);
  }
});

// ══════════════════════════════════════════════════════════════════════════════
// 6. POST /deposits/:id/dispute'''
          s, n = re.subn(verify_block, verify_repl, s, count=1)
          if n != 1:
              raise SystemExit(f'verify legacy block replacement failed: {n}')

          dispute_block = r'''// ═+\n// 6\. POST /deposits/:id/dispute — Admin conteste un dépôt\n// ═+\nrouter\.post\('/deposits/:id/dispute',[\s\S]*?\n\}\);\n\n// ═+\n// 7\. GET /reconciliation'''
          dispute_repl = '''// ══════════════════════════════════════════════════════════════════════════════
// 6. POST /deposits/:id/dispute — Admin conteste un dépôt
// ══════════════════════════════════════════════════════════════════════════════
router.post('/deposits/:id/dispute', authenticate, requireAdmin, async (req, res, next) => {
  try {
    const deposit = await cashDeposits.disputeDeposit({
      depositId: req.params.id,
      verifierId: req.user.id,
      reason: req.body && req.body.reason,
    });
    return res.json({ success: true, message: 'Dépôt contesté', deposit });
  } catch (err) {
    if (err instanceof cashDeposits.CashDepositError) {
      return res.status(err.status || 400).json({ error: err.message });
    }
    return next(err);
  }
});

// ══════════════════════════════════════════════════════════════════════════════
// 7. GET /reconciliation'''
          s, n = re.subn(dispute_block, dispute_repl, s, count=1)
          if n != 1:
              raise SystemExit(f'dispute legacy block replacement failed: {n}')
          p.write_text(s)
          PY

      - name: Wire Accounting Workspace into Canonical runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # API manifest
          p = Path('bootstrap/api-routes.js')
          s = p.read_text()
          if 'adminFinanceAccountingWorkspaceRouter' not in s:
              s = s.replace(
                  "  const adminCatalogWorkspaceRouter = require('../routes/admin-catalog-workspace');\n",
                  "  const adminCatalogWorkspaceRouter = require('../routes/admin-catalog-workspace');\n  const adminFinanceAccountingWorkspaceRouter = require('../routes/admin-finance-accounting-workspace');\n",
                  1,
              )
              s = s.replace(
                  "  app.use('/api/admin/workspaces/catalog', adminCatalogWorkspaceRouter);\n",
                  "  app.use('/api/admin/workspaces/catalog', adminCatalogWorkspaceRouter);\n  app.use('/api/admin/workspaces/accounting', adminFinanceAccountingWorkspaceRouter);\n",
                  1,
              )
              s = s.replace(
                  'routes/admin-shipping-customs-workspace.js, routes/admin-catalog-workspace.js',
                  'routes/admin-shipping-customs-workspace.js, routes/admin-catalog-workspace.js, routes/admin-finance-accounting-workspace.js',
                  1,
              )
          p.write_text(s)

          # HTML routes
          p = Path('bootstrap/html-routes.js')
          s = p.read_text()
          if "'/admin/workspaces/accounting'" not in s:
              s = s.replace(
                  "    '/admin/workspaces/catalog',\n",
                  "    '/admin/workspaces/catalog',\n    '/admin/workspaces/accounting',\n",
                  1,
              )
              s = s.replace(
                  "    '/admin-next/workspaces/catalog': '/admin/workspaces/catalog',\n",
                  "    '/admin-next/workspaces/catalog': '/admin/workspaces/catalog',\n    '/admin-next/workspaces/accounting': '/admin/workspaces/accounting',\n",
                  1,
              )
          p.write_text(s)

          # Canonical script
          p = Path('public/dashboards/canonical/index.html')
          s = p.read_text()
          if '/dashboards/canonical/js/finance-accounting-workspace.js' not in s:
              anchor = '  <script src="/dashboards/canonical/js/catalog-workspace.js"></script>\n'
              if anchor not in s:
                  raise SystemExit('canonical index catalog script anchor missing')
              s = s.replace(anchor, anchor + '  <script src="/dashboards/canonical/js/finance-accounting-workspace.js"></script>\n', 1)
          p.write_text(s)

          # Canonical app
          p = Path('public/dashboards/canonical/js/app.js')
          s = p.read_text()
          if "ACCOUNTING_WORKSPACE: 'accounting-workspace'" not in s:
              s = s.replace(
                  "    CATALOG_WORKSPACE: 'catalog-workspace',\n",
                  "    CATALOG_WORKSPACE: 'catalog-workspace',\n    ACCOUNTING_WORKSPACE: 'accounting-workspace',\n",
                  1,
              )
              route_anchor = "    if (path === '/admin/workspaces/catalog' || path === '/admin-next/workspaces/catalog') {\n      return SURFACES.CATALOG_WORKSPACE;\n    }\n"
              if route_anchor not in s:
                  raise SystemExit('accounting route anchor missing')
              s = s.replace(
                  route_anchor,
                  route_anchor + "    if (path === '/admin/workspaces/accounting' || path === '/admin-next/workspaces/accounting') {\n      return SURFACES.ACCOUNTING_WORKSPACE;\n    }\n",
                  1,
              )
              render_anchor = "  function renderCatalogWorkspace(root, user, adminContext) {\n"
              block = "  function renderFinanceAccountingWorkspace(root, user, adminContext, requestedMarket) {\n    return canonicalMount(\n      global.KomerceCanonicalFinanceAccountingWorkspace,\n      'canonical_accounting_workspace_module_missing',\n      root,\n      user,\n      adminContext,\n      requestedMarket\n    );\n  }\n\n"
              if render_anchor not in s:
                  raise SystemExit('accounting render anchor missing')
              s = s.replace(render_anchor, block + render_anchor, 1)
              shell_anchor = "  function renderDemo(root, user) {\n"
              shell = "  function renderFinanceAccountingWorkspaceShell(root, user, adminContext) {\n    return renderMarketSurfaceShell(root, user, adminContext, {\n      surface: 'accounting-workspace',\n      title: 'Workspace Finance / Comptabilité',\n      requireMarket: true,\n      render: renderFinanceAccountingWorkspace,\n    });\n  }\n\n"
              if shell_anchor not in s:
                  raise SystemExit('accounting shell anchor missing')
              s = s.replace(shell_anchor, shell + shell_anchor, 1)
              s = s.replace(
                  "    if (surface === SURFACES.CATALOG_WORKSPACE) return renderCatalogWorkspace(root, user, adminContext);\n",
                  "    if (surface === SURFACES.CATALOG_WORKSPACE) return renderCatalogWorkspace(root, user, adminContext);\n    if (surface === SURFACES.ACCOUNTING_WORKSPACE) return renderFinanceAccountingWorkspaceShell(root, user, adminContext);\n",
                  1,
              )
              s = s.replace(
                  "    renderCatalogWorkspace,\n",
                  "    renderCatalogWorkspace,\n    renderFinanceAccountingWorkspace,\n",
                  1,
              )
              s = s.replace(
                  "    renderShippingCustomsWorkspaceShell,\n",
                  "    renderShippingCustomsWorkspaceShell,\n    renderFinanceAccountingWorkspaceShell,\n",
                  1,
              )
              s = s.replace(
                  'shipping-customs-workspace, catalog-workspace, order-360',
                  'shipping-customs-workspace, catalog-workspace, finance-accounting-workspace, order-360',
                  1,
              )
              s = s.replace(
                  '/admin/workspaces/shipping-customs, /admin/workspaces/catalog, /admin/orders',
                  '/admin/workspaces/shipping-customs, /admin/workspaces/catalog, /admin/workspaces/accounting, /admin/orders',
                  1,
              )
          p.write_text(s)
          PY

      - name: Register Accounting routes in contract generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/contract-generate.js')
          s = p.read_text()
          route_anchor = "  { prefix: '/api/admin/workspaces/catalog/categories/{key}/subcategories/{subKey}/deactivate', method: 'post', schema: null },\n"
          route_block = "  // LOT 4D — Canonical Finance / Comptabilité Workspace (single-market cash actions)\n" + \
            "  { prefix: '/api/admin/workspaces/accounting/market/{marketCode}', method: 'get', schema: null },\n" + \
            "  { prefix: '/api/admin/workspaces/accounting/market/{marketCode}/deposits', method: 'post', schema: null },\n" + \
            "  { prefix: '/api/admin/workspaces/accounting/market/{marketCode}/deposits/{depositRef}/verify', method: 'post', schema: null },\n" + \
            "  { prefix: '/api/admin/workspaces/accounting/market/{marketCode}/deposits/{depositRef}/dispute', method: 'post', schema: null },\n"
          if 'LOT 4D — Canonical Finance / Comptabilité Workspace' not in s:
              if route_anchor not in s:
                  raise SystemExit('4D contract route anchor missing')
              s = s.replace(route_anchor, route_anchor + route_block, 1)

          response_anchor = 'const KNOWN_RESPONSES = {\n'
          response_block = "  // LOT 4D — réponses Finance / Comptabilité Workspace consommées par Canonical.\n" + \
            "  '/api/admin/workspaces/accounting/market/{marketCode}': { get: { fields: ['scope','filters','summary','reconciliation','deposits','uncollected','collections','invoices'], source: 'test' } },\n" + \
            "  '/api/admin/workspaces/accounting/market/{marketCode}/deposits': { post: { fields: ['ok','action','result'], source: 'test' } },\n" + \
            "  '/api/admin/workspaces/accounting/market/{marketCode}/deposits/{depositRef}/verify': { post: { fields: ['ok','action','result'], source: 'test' } },\n" + \
            "  '/api/admin/workspaces/accounting/market/{marketCode}/deposits/{depositRef}/dispute': { post: { fields: ['ok','action','result'], source: 'test' } },\n"
          if '// LOT 4D — réponses Finance / Comptabilité Workspace' not in s:
              if response_anchor not in s:
                  raise SystemExit('KNOWN_RESPONSES anchor missing')
              s = s.replace(response_anchor, response_anchor + response_block, 1)
          p.write_text(s)
          PY

      - name: Register Feature First ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('features/payments.feature.js')
          s = p.read_text()
          if 'services/cash-deposit-service.js' not in s:
              s = s.replace(
                  "      'services/cash-operations.js',\n",
                  "      'services/cash-operations.js',\n      'services/cash-deposit-service.js',\n",
                  1,
              )
          if 'migrations/148_cash_deposit_business_reference.sql' not in s:
              s = s.replace(
                  "      'migrations/079_paypal_payment_mode.sql',\n",
                  "      'migrations/079_paypal_payment_mode.sql',\n      'migrations/148_cash_deposit_business_reference.sql',\n",
                  1,
              )
          if 'tests/unit/cash-deposit-service.test.js' not in s:
              s = s.replace(
                  "      'tests/unit/cash-operations-service.test.js',\n",
                  "      'tests/unit/cash-operations-service.test.js',\n      'tests/unit/cash-deposit-service.test.js',\n",
                  1,
              )
          p.write_text(s)

          p = Path('features/dashboard.feature.js')
          s = p.read_text()
          if 'services/finance-accounting-workspace.js' not in s:
              s = s.replace(
                  "      'services/relay-dashboard-queries.js',\n",
                  "      'services/relay-dashboard-queries.js',\n      'services/finance-accounting-workspace.js',\n",
                  1,
              )
          if 'routes/admin-finance-accounting-workspace.js' not in s:
              s = s.replace(
                  "      'routes/admin-dashboard.js',\n",
                  "      'routes/admin-dashboard.js',\n      'routes/admin-finance-accounting-workspace.js',\n",
                  1,
              )
          if 'dashboards/canonical/js/finance-accounting-workspace.js' not in s:
              s = s.replace(
                  "      'dashboards/canonical/js/demo-order-flow.js',\n",
                  "      'dashboards/canonical/js/demo-order-flow.js',\n      'dashboards/canonical/js/finance-accounting-workspace.js',\n",
                  1,
              )
          for test_path in [
              'tests/unit/admin-finance-accounting-workspace-route.test.js',
              'tests/unit/finance-accounting-workspace.test.js',
              'tests/unit/canonical-finance-accounting-workspace-boundary.test.js',
          ]:
              if test_path not in s:
                  s = s.replace(
                      "      'tests/unit/canonical-demo-order-flow.test.js',\n",
                      "      'tests/unit/canonical-demo-order-flow.test.js',\n      '" + test_path + "',\n",
                      1,
                  )
          p.write_text(s)
          PY

      - name: Generate contracts, governance and run focused proof
        run: |
          node scripts/gen-route-registry.js
          npm run contract:generate
          node scripts/contract-check.js
          npm run arch:gen
          npm run business-graph:gen
          npm run feature:360:gen
          node scripts/feature-guard.js --strict
          npm run business-graph:check
          npm run feature:360:check
          npx jest --config jest.unit.config.js --runInBand --forceExit \
            tests/unit/admin-finance-accounting-workspace-route.test.js \
            tests/unit/finance-accounting-workspace.test.js \
            tests/unit/cash-deposit-service.test.js \
            tests/unit/canonical-finance-accounting-workspace-boundary.test.js \
            tests/unit/cash-route.test.js \
            tests/unit/bootstrap-html-routes.test.js

      - name: Assert contract ratchet
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync('docs/contract/openapi.json','utf8'));
          const paths = Object.keys(doc.paths || {});
          if (paths.length !== 476) throw new Error(`Expected 476 contract routes, got ${paths.length}`);
          const debt = fs.readFileSync('docs/contract/DEBT.md','utf8');
          const match = debt.match(/UNKNOWN[^0-9]*(\d+)/i);
          console.log(`contract routes=${paths.length}; debt marker=${match ? match[1] : 'not parsed'}`);
          NODE

      - name: Commit wired LOT 4D to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            routes/cash.js \
            bootstrap/api-routes.js \
            bootstrap/html-routes.js \
            public/dashboards/canonical/index.html \
            public/dashboards/canonical/js/app.js \
            scripts/contract-generate.js \
            features/payments.feature.js \
            features/dashboard.feature.js \
            docs/_generated/route-registry.json \
            docs/contract/openapi.json \
            docs/contract/DEBT.md \
            docs/komerce-arch-header-graph.json \
            docs/KOMERCE_ARCH_HEADER_GRAPH.md \
            docs/BUSINESS_FEATURE_GRAPH.json \
            docs/BUSINESS_FEATURE_GRAPH.md \
            docs/FEATURE_360.json \
            docs/FEATURE_360.md \
            docs/META_GRAPH.json \
            docs/O6_INVENTORY.md \
            governance/business-graph-ontology-gaps.json || true
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No wiring changes to commit"
            exit 1
          fi
          git commit -m "feat(canonical): wire Finance Accounting Workspace LOT 4D"
          git push origin HEAD:feat/canonical-finance-accounting-workspace-4d
