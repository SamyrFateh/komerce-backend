name: Staging Hub E2E central authority audit
on:
  workflow_dispatch: {}
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-staging-e2e-hub-central-readonly
  cancel-in-progress: false
jobs:
  scope:
    # Central Hub is NOT part of market team; audits never grant membership.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       (github.event.issue.title == '[staging-op] hub-market-scope-audit' || github.event.issue.title == '[staging-op] hub-central-readonly-audit'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      KOMERCE_ENV: staging
      E2E_STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      HUB_MARKET_GRANT_MODE: audit
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_MARKET_OPERATOR_EMAIL: ${{ secrets.E2E_MARKET_OPERATOR_EMAIL }}
      E2E_MARKET_OPERATOR_PASSWORD: ${{ secrets.E2E_MARKET_OPERATOR_PASSWORD }}
      E2E_AGENT_HUB_EMAIL: ${{ secrets.E2E_AGENT_HUB_EMAIL }}
      E2E_AGENT_HUB_PASSWORD: ${{ secrets.E2E_AGENT_HUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit Hub central context, cross-market reads and forbidden grants
        run: node scripts/recette/staging-hub-e2e-market-grant.js
