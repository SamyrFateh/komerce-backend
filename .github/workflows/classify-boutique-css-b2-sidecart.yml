name: Apply Boutique CSS B2 Side Cart

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b2-side-cart

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b2-side-cart
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Remove losing side-cart declarations from legacy desktop owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('public/boutique/css/boutique-desktop.css')
          css = path.read_text(encoding='utf-8')
          start_marker = '   SIDE CART DESKTOP — Layout Temu pur'
          end_marker = '/* ── GARDE DESKTOP : le panier plein écran'
          start = css.index(start_marker)
          end = css.index(end_marker, start)
          head, section, tail = css[:start], css[start:end], css[end:]

          transfers = {
              '.k-side-cart--in-modal': {'max-height'},
              '.k-sc-header': {'padding', 'background', 'border-top', 'gap'},
              '.k-sc-clear': {'width', 'padding', 'border', 'border-radius', 'font-size'},
              '.k-sc-clear:hover': {'border-color', 'background'},
              '.k-sc-free-ship': {'color', 'background', 'border-radius', 'padding', 'margin-bottom'},
              '.k-sc-items': {'padding'},
              '.k-sc-item': {'gap', 'padding', 'background', 'border-radius', 'border'},
              '.k-sc-item-img': {'width', 'height', 'border-radius'},
              '.k-sc-item-info': {'min-height', 'justify-content', 'gap'},
              '.k-sc-item-name': {'font-size', 'font-weight'},
              '.k-sc-item-meta': {'margin-top'},
              '.k-sc-item-price': {'font-weight', 'letter-spacing'},
              '.k-side-cart--in-modal .k-sc-item': {'align-items', 'padding'},
              '.k-side-cart--in-modal .k-sc-item-img': {'width', 'height'},
              '.k-side-cart--in-modal .k-sc-item-info': {'min-height'},
              '.k-side-cart--in-modal .k-sc-item-name': {'font-size', '-webkit-line-clamp'},
          }

          removed = []
          for selector, props in transfers.items():
              pattern = re.compile(r'(^\s*' + re.escape(selector) + r'\s*\{)([\s\S]*?)(^\s*\})', re.M)
              matches = list(pattern.finditer(section))
              if not matches:
                  raise SystemExit(f'missing selector in side-cart section: {selector}')

              def repl(match):
                  body = match.group(2)
                  lines = body.splitlines(keepends=True)
                  out = []
                  seen = set()
                  for line in lines:
                      m = re.match(r'^(\s*)(-?[a-zA-Z][a-zA-Z0-9-]*)\s*:', line)
                      if m and m.group(2) in props:
                          seen.add(m.group(2))
                          removed.append((selector, m.group(2)))
                          continue
                      out.append(line)
                  # Only the first block carrying at least one transferred prop is edited.
                  if seen:
                      return match.group(1) + ''.join(out) + match.group(3)
                  return match.group(0)

              section = pattern.sub(repl, section, count=1)

          expected = {(s, p) for s, props in transfers.items() for p in props}
          actual = set(removed)
          missing = sorted(expected - actual)
          if missing:
              raise SystemExit(f'transferred declarations not found: {missing}')
          if len(actual) != 41:
              raise SystemExit(f'expected 41 transferred declarations, got {len(actual)}')

          section = section.replace(
              '   Owner unique de .k-side-cart et de tous les sélecteurs .k-sc-*\n   pour ≥900px.',
              '   Owner structurel du side-cart desktop ≥900px. Les propriétés de\n   convergence visuelle finales sont owned par side-cart-desktop-polish.css ;\n   elles ne doivent plus être redéclarées dans ce bloc.'
          )
          path.write_text(head + section + tail, encoding='utf-8')
          print(f'Removed {len(actual)} losing declarations from boutique-desktop.css')
          PY
      - name: Rebuild canonical CSS bundles
        run: npm --prefix public/boutique run deploy:css
      - name: Prove side-cart ownership and no new CSS debt
        run: |
          npm --prefix public/boutique test -- --runInBand tests/unit/side-cart-css-ownership.test.js
          npm --prefix public/boutique run check:css-guard
          npm --prefix public/boutique run check:css-specificity-guard
      - name: Ratchet cascade debt downward and write evidence
        run: |
          OLD_CASCADE=$(node -p "require('./public/boutique/scripts/.css-guard-baseline.json').total")
          OLD_SPEC=$(node -p "require('./public/boutique/scripts/.css-specificity-guard-baseline.json').total")
          npm --prefix public/boutique run check:css-guard:save
          npm --prefix public/boutique run check:css-specificity-guard:save
          NEW_CASCADE=$(node -p "require('./public/boutique/scripts/.css-guard-baseline.json').total")
          NEW_SPEC=$(node -p "require('./public/boutique/scripts/.css-specificity-guard-baseline.json').total")
          if [ "$NEW_CASCADE" -ge "$OLD_CASCADE" ]; then
            echo "Expected a cascade debt decrease, got ${OLD_CASCADE} -> ${NEW_CASCADE}"
            exit 1
          fi
          cat > public/boutique/docs/BOUTIQUE_CSS_DEBT_B2_SIDE_CART.md <<EOF
          # Boutique CSS Debt — B2-1 side-cart ownership

          The current visual result was preserved: only losing declarations from the earlier `boutique-desktop.css` layer were removed. Winning declarations remain in `side-cart-desktop-polish.css`.

          - Side-cart conflicts identified before patch: **44**
          - Losing declarations transferred out of `boutique-desktop.css`: **41**
          - Cascade baseline: **${OLD_CASCADE} → ${NEW_CASCADE}**
          - Specificity baseline: **${OLD_SPEC} → ${NEW_SPEC}**
          - Expected side-cart conflicts intentionally left for a separate cross-owner patch: **3** (`#k-cart-surface-switch.k-cart-tabs` background, `#k-modal .k-modal-cart-slot` justify-content + padding-block)
          - New CSS debt keys: **0** (strict guards passed before ratchet save)

          `boutique-desktop.css` remains the structural desktop side-cart layer. `side-cart-desktop-polish.css` is the owner of the final visual convergence properties listed in `side-cart-css-ownership.test.js`.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/boutique/docs/BOUTIQUE_DEBT_ZERO_STATUS.md')
          s = p.read_text(encoding='utf-8')
          needle = "- [ ] classifier les 211 conflits de cascade par famille fonctionnelle et réduire les owners concurrents sans augmenter l'allowlist ;"
          replacement = "- [x] B2-1 side-cart : supprimer 41 déclarations perdantes du layer `boutique-desktop.css` et transférer explicitement leur ownership visuel à `side-cart-desktop-polish.css` ; baseline cascade abaissée sans nouvelle clé ;\n- [ ] poursuivre la classification des conflits de cascade par famille fonctionnelle et réduire les owners concurrents sans augmenter l'allowlist ;"
          if needle in s:
              s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit B2-1 patch if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/boutique-desktop.css public/boutique/css/dist public/boutique/index.html public/boutique/scripts/.css-guard-baseline.json public/boutique/scripts/.css-specificity-guard-baseline.json public/boutique/docs/BOUTIQUE_CSS_DEBT_B2_SIDE_CART.md public/boutique/docs/BOUTIQUE_DEBT_ZERO_STATUS.md
          if git diff --cached --quiet; then
            echo "B2-1 patch already applied"
            exit 0
          fi
          git commit -m "refactor(boutique): transfer side-cart visual CSS ownership"
          git push origin HEAD:refactor/boutique-debt-zero-b2-side-cart
