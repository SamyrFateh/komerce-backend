name: One-shot prove SCHEMA live summary counts

on:
  push:
    branches: [fix/schema-summary-live-counts]
    paths:
      - 'scripts/schema-summary-manifest-patch.py'
      - '.github/workflows/schema-summary-live-counts-one-shot.yml'

permissions:
  contents: write

jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts

      - name: Apply Feature-First ownership patch
        run: python3 scripts/schema-summary-manifest-patch.py

      - name: Prove parser and materialize live summary
        run: |
          npx --no-install jest tests/unit/schema-sync-summary.test.js --runInBand
          node scripts/schema-sync-summary.js --write
          node scripts/schema-promote-all.js --check
          npm run feature:registry
          npm run gate:schema
          npm run gate:docs-lint
          npm run arch:gate
          git diff --check

      - name: Publish generated summary and ownership
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SCHEMA.md features/infrastructure.feature.js
          git commit -m 'fix(schema): sync overview counts from Railway dump'
          git push origin HEAD:fix/schema-summary-live-counts
