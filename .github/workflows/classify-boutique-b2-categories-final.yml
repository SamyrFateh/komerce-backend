name: Consolidate Boutique B2 Final Category Cascade

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b2-categories-final

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b2-categories-final
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Remove final losing category declarations
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const postcss = require('./public/boutique/node_modules/postcss');

          const root = path.resolve('public/boutique');
          const cssDir = path.join(root, 'css');
          const baseline = JSON.parse(fs.readFileSync(path.join(root, 'scripts/.css-guard-baseline.json'), 'utf8'));
          if (baseline.total !== 52) throw new Error(`Expected cascade baseline 52, got ${baseline.total}`);
          const baselineKeys = new Set(baseline.keys);

          function isCategorySelector(selector) {
            return selector.startsWith('.k-cat-cutout') ||
              selector.startsWith('.k-cat-section') ||
              selector.startsWith('.k-cats::after') ||
              selector.startsWith('.k-chip-photo img') ||
              selector.startsWith('.k-chip.active .k-chip-label') ||
              selector.startsWith('.k-chip:active') ||
              selector.startsWith('.k-sec-') ||
              selector.startsWith('.k-shelf-') ||
              selector.startsWith('.k-subcutout');
          }
          const categoryKeys = baseline.keys.filter(key => isCategorySelector(key.split('|||')[0]));
          if (categoryKeys.length !== 9) throw new Error(`Expected 9 category conflicts, got ${categoryKeys.length}`);

          const categoriesPath = path.join(cssDir, 'categories.css');
          let categoriesRaw = fs.readFileSync(categoriesPath, 'utf8');

          // Old malformed visual fragment: the browser already ignores these orphan values
          // because no CSS property precedes them. Removing them only makes the source parseable.
          const deadShadow = /\n\s*0 6px 18px rgba\(198,168,93,\.09\),\n\s*0 1px 0 rgba\(198,168,93,\.07\);/;
          if (!deadShadow.test(categoriesRaw)) throw new Error('Expected malformed orphan shadow fragment not found');
          categoriesRaw = categoriesRaw.replace(deadShadow, '');

          const ast = postcss.parse(categoriesRaw, { from: 'categories.css' });

          function contextOf(rule) {
            let node = rule.parent;
            while (node && node.type !== 'root') {
              if (node.type === 'atrule' && node.name === 'media') return `@media ${node.params} {`;
              node = node.parent;
            }
            return 'global';
          }

          const removed = [];
          function removeExact({ selector, media = 'global', prop, oldValue }) {
            const matches = [];
            ast.walkRules(rule => {
              if (contextOf(rule) !== media) return;
              const selectors = rule.selectors || [rule.selector];
              if (!selectors.map(s => s.trim()).includes(selector)) return;
              rule.nodes.forEach(node => {
                if (node.type === 'decl' && node.prop === prop && node.value === oldValue) {
                  matches.push({ rule, decl: node });
                }
              });
            });
            if (matches.length !== 1) {
              throw new Error(`Expected one losing declaration for ${selector} / ${media} / ${prop}:${oldValue}, got ${matches.length}`);
            }
            const key = `${selector}|||${media}|||${prop}`;
            if (!baselineKeys.has(key)) throw new Error(`Refusing non-baseline removal: ${key}`);
            matches[0].decl.remove();
            removed.push({ key, oldValue });
          }

          removeExact({ selector: '.k-cat-section', prop: 'margin-bottom', oldValue: '4px' });
          removeExact({ selector: '.k-cats::after', prop: 'flex', oldValue: '0 0 12px' });
          removeExact({ selector: '.k-chip-photo img', prop: 'border-radius', oldValue: '12px' });
          removeExact({ selector: '.k-chip.active .k-chip-label', prop: 'font-weight', oldValue: '800' });
          removeExact({ selector: '.k-chip:active', prop: 'transform', oldValue: 'scale(.95)' });
          removeExact({ selector: '.k-sec-grid', prop: 'padding', oldValue: '4px 0 12px' });
          removeExact({ selector: '.k-sec-header-emoji', prop: 'font-size', oldValue: '18px' });
          removeExact({ selector: '.k-sec-header-name', prop: 'font-size', oldValue: '16px' });
          removeExact({ selector: '.k-sec-header', media: '@media (min-width: 900px) {', prop: 'display', oldValue: 'none' });

          if (removed.length !== 9 || new Set(removed.map(r => r.key)).size !== 9) {
            throw new Error(`Expected 9 unique removals, got ${removed.length}`);
          }

          ast.walkRules(rule => {
            if (rule.nodes && rule.nodes.filter(n => n.type !== 'comment').length === 0) rule.remove();
          });
          fs.writeFileSync(categoriesPath, ast.toString(), 'utf8');

          // Prove the values currently winning in production remain available.
          function collect(file, selector, media, prop) {
            const parsed = postcss.parse(fs.readFileSync(path.join(cssDir, file), 'utf8'), { from: file });
            const values = [];
            parsed.walkRules(rule => {
              if (contextOf(rule) !== media) return;
              const selectors = rule.selectors || [rule.selector];
              if (!selectors.map(s => s.trim()).includes(selector)) return;
              rule.walkDecls(prop, decl => values.push(decl.value));
            });
            return values;
          }
          function expectValue(file, selector, media, prop, expected) {
            const values = collect(file, selector, media, prop);
            if (!values.includes(expected)) throw new Error(`Expected ${file} ${selector} ${media} ${prop}=${expected}; got ${values.join(' <> ')}`);
          }

          expectValue('categories.css', '.k-cat-section', 'global', 'margin-bottom', '2px');
          expectValue('categories.css', '.k-cats::after', 'global', 'flex', '0 0 2px');
          expectValue('categories.css', '.k-chip-photo img', 'global', 'border-radius', '50%');
          expectValue('categories.css', '.k-chip.active .k-chip-label', 'global', 'font-weight', '700');
          expectValue('categories.css', '.k-chip:active', 'global', 'transform', 'scale(.93)');
          expectValue('categories.css', '.k-sec-header-emoji', 'global', 'font-size', '17px');
          expectValue('categories.css', '.k-sec-header-name', 'global', 'font-size', '15.5px');
          expectValue('products.css', '.k-sec-grid', 'global', 'padding', '4px 12px 12px');
          expectValue('products.css', '.k-sec-header', '@media (min-width: 900px) {', 'display', 'flex');

          fs.writeFileSync('/tmp/category-final-summary.json', JSON.stringify({
            oldCascade: 52,
            categoryBefore: 9,
            removedConflictKeys: 9,
            removedDeclarations: 9,
            removedMalformedFragment: true,
            keys: removed.map(r => r.key).sort(),
          }, null, 2));
          console.log(fs.readFileSync('/tmp/category-final-summary.json', 'utf8'));
          NODE
      - name: Rebuild canonical bundles
        run: npm --prefix public/boutique run deploy:css
      - name: Prove no new CSS debt before lowering ratchet
        run: |
          npm --prefix public/boutique run check:css-guard
          npm --prefix public/boutique run check:css-specificity-guard
      - name: Lower ratchet, prove category zero, and write report
        run: |
          npm --prefix public/boutique run check:css-guard:save
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('public/boutique');
          const baseline = JSON.parse(fs.readFileSync(path.join(root, 'scripts/.css-guard-baseline.json'), 'utf8'));
          function isCategorySelector(selector) {
            return selector.startsWith('.k-cat-cutout') || selector.startsWith('.k-cat-section') || selector.startsWith('.k-cats::after') || selector.startsWith('.k-chip-photo img') || selector.startsWith('.k-chip.active .k-chip-label') || selector.startsWith('.k-chip:active') || selector.startsWith('.k-sec-') || selector.startsWith('.k-shelf-') || selector.startsWith('.k-subcutout');
          }
          const remaining = baseline.keys.filter(key => isCategorySelector(key.split('|||')[0]));
          if (baseline.total !== 43) throw new Error(`Expected cascade baseline 43, got ${baseline.total}`);
          if (remaining.length !== 0) throw new Error(`Expected category debt 0, got ${remaining.length}: ${remaining.join('\n')}`);
          const report = [
            '# Boutique CSS Debt — B2-3b final category ownership',
            '',
            '- Cascade baseline: **52 → 43**',
            '- Category-family conflicts: **9 → 0**',
            '- Losing conflict declarations removed: **9**',
            '- Malformed orphan shadow fragment removed: **1** (already ignored by browsers)',
            '- New cascade keys before ratchet save: **0**',
            '- Specificity ratchet: **strict passed; not increased**',
            '',
            'Current winning values remain unchanged. `categories.css` is also parseable again by PostCSS.',
          ].join('\n') + '\n';
          fs.writeFileSync(path.join(root, 'docs/BOUTIQUE_CSS_DEBT_B2_CATEGORIES_FINAL.md'), report);
          console.log(report);
          NODE
      - name: Commit B2-3b category zero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/categories.css public/boutique/css/dist public/boutique/index.html public/boutique/scripts/.css-guard-baseline.json public/boutique/docs/BOUTIQUE_CSS_DEBT_B2_CATEGORIES_FINAL.md
          git commit -m "refactor(boutique): close category cascade debt"
          git push origin HEAD:refactor/boutique-debt-zero-b2-categories-final
