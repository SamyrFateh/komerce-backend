name: tmp-find-ordi-source-v7

on:
  push:
    branches:
      - fix/subcategory-canonical-cutouts-v7
    paths:
      - .github/workflows/tmp-find-ordi-source-v7.yml

permissions:
  contents: write

jobs:
  find-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subcategory-canonical-cutouts-v7
      - name: Find reachable laptop/tablet/computer source across catalog
        run: |
          curl -fsSL 'https://komerce-backend-production.up.railway.app/api/products?limit=1000' -o /tmp/products.json
          python3 - <<'PY'
          import json,re,requests
          raw=json.load(open('/tmp/products.json'))
          ps=raw if isinstance(raw,list) else raw.get('products',[])
          rx=re.compile(r'ordinateur|laptop|notebook|tablette|tablet|computer|chromebook|macbook',re.I)
          matches=[]
          for p in ps:
            text=' '.join(str(p.get(k,'')) for k in ('name','title','description','subcategory','category','product_ref'))
            if not rx.search(text) or not p.get('image_url'): continue
            try:
              r=requests.get(p['image_url'],timeout=12,headers={'User-Agent':'Mozilla/5.0 KomerceCutoutQA/1.0'},stream=True)
              ok=r.status_code==200
            except Exception:
              ok=False
            matches.append({k:p.get(k) for k in ('id','product_ref','name','category','subcategory','image_url')} | {'reachable':ok})
          print('ORDI_MATCHES',json.dumps(matches,ensure_ascii=False,indent=2))
          print('REACHABLE_COUNT',sum(1 for x in matches if x['reachable']))
          PY
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tmp-find-ordi-source-v7.yml
          git commit -m 'chore(qa): remove temporary Ordi source finder' || true
          git push origin HEAD:fix/subcategory-canonical-cutouts-v7
