name: Playwright live contextual V2.9 audit

on:
  push:
    branches:
      - audit/playwright-live-contextual-v29
    paths:
      - .github/workflows/playwright-live-contextual-v29.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - run: npm --prefix public/boutique ci
      - run: npx --prefix public/boutique playwright install --with-deps chromium
      - name: Navigate live mobile pager
        working-directory: public/boutique
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 }, deviceScaleFactor: 1,
              isMobile: true, hasTouch: true, serviceWorkers: 'block',
              userAgent: 'Komerce-Playwright-Hero-Sticky-Audit/1.0 Mobile'
            });
            await context.setExtraHTTPHeaders({ 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' });
            const page = await context.newPage();
            const response = await page.goto(`https://komerce.co/boutique/?pw_hero_sticky=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(8000);

            const snap = async (label) => page.evaluate((label) => {
              const grid = document.getElementById('k-grid');
              const realPages = grid ? Array.from(grid.querySelectorAll(':scope > .k-cat-section:not([data-ghost])')) : [];
              const active = document.querySelector('#k-cats .k-chip.active')?.dataset.cat || null;
              const activePage = realPages.find(p => p.dataset.cat === active) || realPages[Math.round((grid?.scrollLeft || 0) / (grid?.clientWidth || innerWidth))] || null;
              const shell = activePage?.querySelector(':scope > .k-discovery-shell') || null;
              const rect = (el) => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { x:+r.x.toFixed(1), y:+r.y.toFixed(1), width:+r.width.toFixed(1), height:+r.height.toFixed(1) };
              };
              const wrap = document.getElementById('k-hero-fixed-wrap');
              const hero = document.querySelector('.k-hero .k-hero-inner .k-hero-media');
              const cats = document.querySelector('.k-shelf-rail');
              const figures = document.querySelector('.k-hero-media .k-hero-figures');
              const cs = figures ? getComputedStyle(figures) : null;
              return {
                label, active,
                gridScrollLeft: grid?.scrollLeft ?? null,
                pagerTop: getComputedStyle(document.documentElement).getPropertyValue('--pager-top').trim(),
                wrap: rect(wrap), wrapTransform: wrap ? getComputedStyle(wrap).transform : null,
                hero: rect(hero), categories: rect(cats),
                figuresBackgroundPosition: cs?.backgroundPosition || null,
                figuresBackgroundSize: cs?.backgroundSize || null,
                activePageScrollTop: activePage?.scrollTop ?? null,
                discovery: rect(shell),
                discoveryHidden: shell ? shell.hidden : null,
                discoveryTitle: shell?.querySelector('.k-discovery-title')?.textContent?.trim() || null,
                ghostCount: grid?.querySelectorAll(':scope > .k-cat-section[data-ghost="right"]').length || 0
              };
            }, label);

            const initial = await snap('initial');
            await page.screenshot({path:'hero-nav-01-initial.png'});

            await page.evaluate(() => {
              const p = document.querySelector('#k-grid > .k-cat-section[data-cat="all"]:not([data-ghost])');
              if (p) p.scrollTop = 320;
            });
            await page.waitForTimeout(500);
            const afterVertical = await snap('after-vertical-scroll');
            await page.screenshot({path:'hero-nav-02-after-scroll.png'});

            const targetCat = await page.evaluate(() => {
              const pages = Array.from(document.querySelectorAll('#k-grid > .k-cat-section:not([data-ghost])'));
              const target = pages.find(p => p.dataset.cat !== 'all' && p.querySelector(':scope > .k-discovery-shell:not([hidden])'));
              return target?.dataset.cat || pages.find(p => p.dataset.cat !== 'all')?.dataset.cat || null;
            });
            if (targetCat) {
              await page.evaluate((cat) => {
                const grid = document.getElementById('k-grid');
                const pages = Array.from(grid.querySelectorAll(':scope > .k-cat-section:not([data-ghost])'));
                const idx = pages.findIndex(p => p.dataset.cat === cat);
                grid.scrollTo({left: idx * grid.clientWidth, behavior:'instant'});
              }, targetCat);
              await page.waitForTimeout(600);
            }
            const afterSwipe = await snap('after-horizontal-swipe');
            await page.screenshot({path:'hero-nav-03-after-swipe.png'});

            await page.evaluate(() => {
              const grid = document.getElementById('k-grid');
              const pages = Array.from(grid.querySelectorAll(':scope > .k-cat-section'));
              const idx = pages.findIndex(p => p.dataset.ghost === 'right');
              if (idx >= 0) grid.scrollTo({left: idx * grid.clientWidth, behavior:'instant'});
            });
            await page.waitForTimeout(800);
            const afterGhost = await snap('after-ghost');
            await page.screenshot({path:'hero-nav-04-after-ghost.png'});

            const result = { responseStatus: response?.status() || null, targetCat, initial, afterVertical, afterSwipe, afterGhost };
            fs.writeFileSync('hero-navigation-audit.json', JSON.stringify(result, null, 2));
            console.log('HERO_NAV_AUDIT=' + JSON.stringify(result));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-live-hero-navigation-baseline
          path: |
            public/boutique/hero-navigation-audit.json
            public/boutique/hero-nav-*.png
          if-no-files-found: error
