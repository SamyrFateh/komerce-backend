name: Patch economic transport cost ownership

on:
  push:
    branches: [agent/transport-rail-doctrine-audit]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transport-rail-doctrine-audit
          fetch-depth: 0
      - name: Register transport cost allocation ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('features/economic-engine.feature.js')
          s = p.read_text()
          if "'services/transport-cost-allocation.js'" not in s:
              s = s.replace("      'services/cost-allocation/index.js',", "      'services/cost-allocation/index.js',\n      'services/transport-cost-allocation.js',")
          if "'tests/unit/transport-cost-allocation.test.js'" not in s:
              s = s.replace("      'tests/unit/cost-allocation.test.js',", "      'tests/unit/cost-allocation.test.js',\n      'tests/unit/transport-cost-allocation.test.js',")
          if "'docs/doctrine/DOCTRINE_TRANSPORT_COST_ALLOCATION.md'" not in s:
              s = s.replace("    'docs/doctrine/DOCTRINE_DENSITE_VALEUR.md',", "    'docs/doctrine/DOCTRINE_DENSITE_VALEUR.md',\n    'docs/doctrine/DOCTRINE_TRANSPORT_COST_ALLOCATION.md',")
          p.write_text(s)
          PY
          if git diff --quiet -- features/economic-engine.feature.js; then
            echo 'ownership already registered'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add features/economic-engine.feature.js
          git commit -m 'feat(economic-engine): own transport cost allocation contract'
          git push origin HEAD:agent/transport-rail-doctrine-audit
