name: Temporary AUTH-4 finalizer

on:
  push:
    branches:
      - auth/4-passkey-login

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch identity gate and enrollment trigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'public/boutique/js/b-identity.js',
              "} from './b-phone.js';\n",
              "} from './b-phone.js';\nimport { openPasskeyLogin } from './b-passkey-login.js';\n",
              'b-identity import'
          )

          replace_once(
              'public/boutique/js/b-identity.js',
              "        window.dispatchEvent(new CustomEvent('komerce:identity-authenticated'));",
              "        window.dispatchEvent(new CustomEvent('komerce:identity-authenticated', {\n          detail: { method: 'otp', user: user || data.user || { phone: phoneValue } },\n        }));",
              'OTP auth event'
          )

          replace_once(
              'public/boutique/js/b-identity.js',
              "export async function requireIdentity(options = {}) {\n  const existing = await restoreIdentity();\n  if (existing) return existing;\n  return openIdentityModal(options);\n}",
              "export async function requireIdentity(options = {}) {\n  const existing = await restoreIdentity();\n  if (existing) return existing;\n\n  // AUTH-4 — la Passkey est le chemin nominal pour un utilisateur revenant.\n  // Le téléphone/OTP n'est demandé qu'après choix explicite du fallback.\n  const passkey = await openPasskeyLogin({\n    reason: options.reason,\n    returnFocusTo: options.returnFocusTo || null,\n  });\n\n  if (passkey?.outcome === 'authenticated' && passkey.user) {\n    const user = normalizeUser(passkey.user);\n    if (user) state.user = user;\n    const authenticatedUser = user || passkey.user;\n    window.dispatchEvent(new CustomEvent('komerce:identity-authenticated', {\n      detail: { method: 'passkey', user: authenticatedUser },\n    }));\n    return authenticatedUser;\n  }\n\n  if (passkey?.outcome === 'cancelled') return null;\n  return openIdentityModal(options);\n}",
              'requireIdentity'
          )

          replace_once(
              'public/boutique/js/b-passkey-enrollment.js',
              "  window.addEventListener('komerce:identity-authenticated', () => queuePostOtpOffer(0));",
              "  window.addEventListener('komerce:identity-authenticated', event => {\n    // AUTH-4 : ne jamais reproposer un enrôlement après un login Passkey.\n    // L'absence de method reste assimilée à OTP pour compatibilité avec\n    // d'éventuels émetteurs historiques le temps de leur migration.\n    if (event?.detail?.method && event.detail.method !== 'otp') return;\n    queuePostOtpOffer(0);\n  });",
              'enrollment event filter'
          )
          PY
      - name: Remove temporary helper from intended final tree
        run: rm .github/workflows/tmp-auth4-finalize.yml
      - name: Install root dependencies
        run: npm ci
      - name: Backend passkey tests
        run: npx jest tests/unit/auth-passkey.test.js --runInBand
      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci
      - name: AUTH-4 Boutique tests
        working-directory: public/boutique
        run: npx jest tests/unit/b-passkey-login.test.js tests/unit/b-identity-passkey.test.js tests/unit/b-passkey-enrollment.test.js --runInBand
      - name: Generate canonical governance projections
        run: |
          node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
          node scripts/gen-gate-findings.js
          node scripts/gen-feature-360.js
      - name: Verify final tree
        run: |
          node scripts/feature-guard.js --strict
          node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique
          node scripts/feature-360-check.js
          git diff --check
      - name: Commit final AUTH-4 tree and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/js/b-identity.js public/boutique/js/b-passkey-enrollment.js
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md docs/GATE_FINDINGS.json docs/FEATURE_360.json docs/FEATURE_360.md
          git add -u .github/workflows/tmp-auth4-finalize.yml
          git commit -m "feat(auth): make passkey nominal identity gate"
          git push origin HEAD:auth/4-passkey-login
