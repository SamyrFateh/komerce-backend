name: Temporary AUTH-8e logout fix

on:
  push:
    branches: [auth/8e-bearer-boundary]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Use canonical token reader in logout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('routes/auth.js')
          text = p.read_text(encoding='utf-8')
          old_import = "const { setAuthCookie, clearAuthCookie } = require('../utils/auth-cookie');"
          new_import = "const { setAuthCookie, clearAuthCookie, readAuthToken } = require('../utils/auth-cookie');"
          if old_import not in text:
              raise SystemExit('auth-cookie import pattern not found')
          text = text.replace(old_import, new_import, 1)
          old = "    const token =\n      req.cookies?.[COOKIE_NAME] ||\n      (req.headers.authorization?.startsWith('Bearer ')\n        ? req.headers.authorization.split(' ')[1]\n        : null);"
          new = "    const token = readAuthToken(req);"
          if old not in text:
              raise SystemExit('logout token reader pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/tmp-auth8e-logout-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/auth.js .github/workflows/tmp-auth8e-logout-fix.yml
          git commit -m "fix(auth): use canonical token reader on logout"
          git push origin HEAD:auth/8e-bearer-boundary
