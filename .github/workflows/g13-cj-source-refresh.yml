# G13 owner-only source refresh using canonical Sourcing API, never direct SQL writes.
# Canary before batch; exact frozen CJ IDs only; no publish/pricing/orders.
name: G13 CJ exact source refresh — guarded staging
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-g13-catalogue-seed
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      github.actor == github.repository_owner &&
      (github.event.issue.title == '[staging-op] g13-cj-source-refresh-canary' ||
       github.event.issue.title == '[staging-op] g13-cj-source-refresh-batch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_ACTIONS: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      PGOPTIONS: '-c default_transaction_read_only=on'
      G13_CJ_REFRESH_SCOPE: ${{ github.event.issue.title == '[staging-op] g13-cj-source-refresh-canary' && 'canary' || 'batch' }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Refresh authentic CJ source units without publication
        run: node scripts/recette/g13-cj-source-refresh.js
      - name: Preserve immutable scope and source readiness verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-cj-source-refresh-${{ github.run_id }}
          path: test-results/g13-cj-source-refresh/report.json
          retention-days: 21
          if-no-files-found: error
