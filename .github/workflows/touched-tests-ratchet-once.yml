name: Validate touched-tests coverage ratchet once

on:
  push:
    paths:
      - '.github/workflows/touched-tests-ratchet-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - name: Run touched-tests ratchet unit proofs
        run: npx jest tests/unit/touched-tests-gate-coverage-thresholds.test.js tests/unit/touched-tests-gate-css.test.js --runInBand
      # one-shot semantic proof; workflow removed after green
