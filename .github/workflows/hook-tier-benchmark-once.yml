name: Benchmark hooks tiers 1-3 once

on:
  push:
    paths:
      - '.github/workflows/hook-tier-benchmark-once.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Komerce hooks explicitly
        run: bash scripts/setup-hooks.sh

      - name: Simulate representative staged commits
        shell: bash
        run: |
          set -uo pipefail

          simulate() {
            local label="$1"
            local file="$2"
            local marker="$3"
            local start end rc

            git reset --hard HEAD >/dev/null
            git clean -fd >/dev/null
            printf '\n%s\n' "$marker" >> "$file"
            git add "$file"

            echo "===== SIMULATION: $label ====="
            echo "staged: $file"
            start=$(node -e 'process.stdout.write(String(Date.now()))')
            set +e
            .git/hooks/pre-commit
            rc=$?
            set -e
            end=$(node -e 'process.stdout.write(String(Date.now()))')
            echo "SIM_RESULT label=$label rc=$rc total_ms=$((end-start))"
            echo
          }

          simulate "docs-only" "docs/doctrine/FEATURE_DOCTRINE.md" "<!-- hook benchmark docs-only -->"
          simulate "backend-js" "services/catalog-enrichment.js" "// hook benchmark backend-js"
          simulate "boutique-js" "public/boutique/js/b-cart.js" "// hook benchmark boutique-js"
          simulate "feature-manifest" "features/catalog.feature.js" "// hook benchmark feature-manifest"
          simulate "migration-sql" "migrations/014_parcels_final_cleanup.sql" "-- hook benchmark migration-sql"

          git reset --hard HEAD >/dev/null
          git clean -fd >/dev/null

      - name: Diagnose candidate Tier 3 DB gates on a staged migration
        shell: bash
        run: |
          set -uo pipefail
          printf '\n-- hook benchmark tier3 candidate\n' >> migrations/014_parcels_final_cleanup.sql
          git add migrations/014_parcels_final_cleanup.sql

          diagnose() {
            local label="$1"
            shift
            local start end rc
            echo "===== TIER3_CANDIDATE: $label ====="
            start=$(node -e 'process.stdout.write(String(Date.now()))')
            set +e
            "$@"
            rc=$?
            set -e
            end=$(node -e 'process.stdout.write(String(Date.now()))')
            echo "TIER3_RESULT label=$label rc=$rc total_ms=$((end-start))"
            echo
          }

          diagnose "sql-headers" node scripts/arch-header-sql-check.js
          diagnose "schema-resurrection" node scripts/check-schema-resurrection.js
          diagnose "schema-drift" node scripts/arch-schema-drift-check.js
          diagnose "schema-freshness" node scripts/check-schema-freshness.js

          git reset --hard HEAD >/dev/null
