# Owner-only real buyer P2 browser probe. NO ORDER WRITES: all non-GET requests abort.
name: G6 P2 KM — buyer PDP cart checkout Chromium READ ONLY
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-g6-p2-buyer-cart-readonly
  cancel-in-progress: false
jobs:
  buyer:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] g6-p2-km-cart-checkout-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      PGOPTIONS: '-c default_transaction_read_only=on'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pin deployed staging version and protected database
        run: |
          node scripts/recette/resolve-staging-deploy-pin.js
          node scripts/recette/target-guard.js
      - run: npx playwright install --with-deps chromium
      - name: Real Chromium buyer PDP, SKU, add-to-cart, checkout (no order)
        run: node scripts/recette/g6-p2-buyer-cart-checkout-readonly.js
      - name: Preserve screenshots, target identity, and SQL readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-p2-buyer-cart-readonly-${{ github.run_id }}
          path: |
            test-results/g6-p2-buyer-readonly/
            test-results/hub-v1-http/deploy-pin.json
          if-no-files-found: warn
          retention-days: 21
