name: PDC1-PDC6 Main Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pdc1-pdc6-main-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'integration/pdc1-pdc6-main'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ci-dummy:ci-dummy@localhost:5432/ci-dummy
      ADMIN_PASSWORD: ci-dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-dummy
      JWT_SECRET: ci-dummy
      SESSION_SECRET: ci-dummy
      INTERNAL_API_KEY: ci-dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      JWT_EXPIRES: 7d
      APP_URL: http://localhost
      PUBLIC_URL: http://localhost
      PUBLIC_BASE_URL: http://localhost
      ADMIN_RESET_KEY: ci-dummy
      INVOICE_PUBLIC_LINK_SECRET: ci-dummy
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_TOKEN: ci-dummy
      META_WA_PHONE_NUMBER_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/pdc1-pdc6-main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git and record branch lease
        id: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "start_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch canonical PDC-6 head
        run: |
          git fetch origin feat/pdc6-legacy-modal-extinction-final
          test "$(git rev-parse origin/feat/pdc6-legacy-modal-extinction-final)" = "1cf302c482f2c76ed4a10028e241006324998c48"

      - name: Merge cumulative PDC-1 to PDC-6
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor 1cf302c482f2c76ed4a10028e241006324998c48 HEAD; then
            git merge --no-ff -X ours 1cf302c482f2c76ed4a10028e241006324998c48 \
              -m "integration(pdc): merge PDC-1→PDC-6 into main"
          fi
          rm -f .github/pdc1-pdc6-main.trigger

      - name: Reconcile PDC ownership and canonical products mount
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).write_text(content, encoding='utf-8')

          def remove_exact_lines(path, lines):
              content = read(path)
              for line in lines:
                  if line not in content:
                      raise SystemExit(f'Expected ownership line missing in {path}: {line.rstrip()}')
                  content = content.replace(line, '', 1)
              write(path, content)

          # modal-product is the sole Boutique slice owner of PDC modal runtime/tests.
          remove_exact_lines('public/boutique/features/catalog.feature.js', [
              "      '../js/b-modal-desktop-product.js',\n",
              "      '../js/b-modal-mobile-product.js',\n",
              "      '../js/b-modal-product-detail-bootstrap.js',\n",
              "      '../js/view-models/modal-selection-model.js',\n",
              "      '../tests/unit/modal-selection-model.test.js',\n",
              "      '../tests/unit/b-modal-mobile-product.test.js',\n",
              "      '../tests/unit/b-modal-desktop-product.test.js',\n",
              "      '../tests/unit/b-modal-product-detail-bootstrap.test.js',\n",
          ])
          remove_exact_lines('public/boutique/features/boutique.feature.js', [
              "      '../js/b-modal-approche-c-hybrid.js',\n",
              "      '../js/b-modal-desktop-enhancers.js',\n",
          ])

          # Compose Product Detail under the canonical products router. The route
          # registry recursively follows inline require() mounts and retains all
          # existing SKU routes from routes/products.js under one /api/products mount.
          products = read('routes/products.js')
          marker = '// ─── GET /api/products/:id ───────────────────────────────────\n'
          mount = (
              '// ─── Product Detail Contract v1 ───────────────────────────────────\n'
              "router.use(require('./catalog-product-detail'));\n\n"
          )
          if mount not in products:
              if marker not in products:
                  raise SystemExit('Canonical products detail insertion marker missing')
              products = products.replace(marker, mount + marker, 1)
          write('routes/products.js', products)

          # Remove the competing top-level /api/products mount if the PDC side won
          # these hunks despite the conservative merge strategy.
          bootstrap = read('bootstrap/api-routes.js')
          bootstrap = bootstrap.replace("  const productDetailRouter = require('../routes/catalog-product-detail');\n", '')
          bootstrap = bootstrap.replace("  app.use('/api/products',   productDetailRouter);\n", '')
          write('bootstrap/api-routes.js', bootstrap)

          route = read('routes/catalog-product-detail.js')
          route = route.replace(
              '@used-by       bootstrap/api-routes.js, future public/boutique/js/b-modal-core.js',
              '@used-by       routes/products.js, public/boutique/js/b-modal-product-detail-bootstrap.js',
          )
          write('routes/catalog-product-detail.js', route)
          PY

      - name: Install backend and Boutique dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Regenerate canonical artifacts with exact diagnostics
        shell: bash
        run: |
          set -euo pipefail
          validation_dir="$RUNNER_TEMP/pdc-validation"
          logs_dir="$validation_dir/logs"
          mkdir -p "$logs_dir"

          run_gen() {
            name="$1"
            shift
            echo "=== generator:$name ==="
            set +e
            "$@" >"$logs_dir/generator-$name.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "generator:$name=$rc" > "$validation_dir/generator-failure.txt"
              tail -200 "$logs_dir/generator-$name.log"
              exit "$rc"
            fi
          }

          run_gen route-registry node scripts/gen-route-registry.js
          run_gen openapi npm run contract:generate
          run_gen arch npm run arch:gen
          run_gen dashboards-360 npm run dashboards:360
          run_gen boutique-360 npm run boutique:360
          run_gen business-graph npm run business-graph:gen
          run_gen meta-graph npm run meta:graph

      - name: Register the single intended public Product Detail security surface
        shell: bash
        run: |
          set -euo pipefail
          security_log="$RUNNER_TEMP/security-before-save.log"
          set +e
          npm run security:360:check >"$security_log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            clean_log="$RUNNER_TEMP/security-before-save.clean.log"
            sed -E 's/\x1B\[[0-9;]*[mK]//g' "$security_log" > "$clean_log"
            count=$(grep -c '^   ↑ ' "$clean_log" || true)
            test "$count" -eq 1
            grep -Fq 'GET /api/products/{id}/detail — UNPROTECTED' "$clean_log"
            npm run security:360:save
          fi
          npm run security:360:check

      - name: Run integration validations with exact diagnostics
        id: validate
        shell: bash
        run: |
          set +e
          validation_dir="$RUNNER_TEMP/pdc-validation"
          logs_dir="$validation_dir/logs"
          summary="$validation_dir/validation-summary.txt"
          mkdir -p "$logs_dir"
          : > "$summary"
          overall=0

          run_check() {
            name="$1"
            shift
            echo "=== $name ===" | tee -a "$summary"
            "$@" >"$logs_dir/$name.log" 2>&1
            rc=$?
            echo "$name=$rc" | tee -a "$summary"
            if [ "$rc" -ne 0 ]; then
              overall=1
              echo "--- tail $name ---" >> "$summary"
              tail -160 "$logs_dir/$name.log" >> "$summary"
              echo "--- end tail $name ---" >> "$summary"
            fi
          }

          run_check boutique-fast npm --prefix public/boutique run check:fast
          run_check feature-registry npm run feature:registry
          run_check gate-schema npm run gate:schema
          run_check docs-lint npm run gate:docs-lint
          run_check boutique-ownership npm run gate:boutique-ownership
          run_check map-check npm run map:check

          node >"$logs_dir/pdc6-legacy.log" 2>&1 <<'NODE'
          const fs = require('fs');
          const stripComments = source => source
            .replace(/\/\*[\s\S]*?\*\//g, '')
            .replace(/(^|[^:])\/\/[^\n]*/g, '$1');
          const core = stripComments(fs.readFileSync('public/boutique/js/b-modal-core.js', 'utf8'));
          const product = stripComments(fs.readFileSync('public/boutique/js/b-modal-product.js', 'utf8'));
          if (core.includes('_renderVariants') || product.includes('_renderVariants')) {
            throw new Error('_renderVariants remains in executable modal source');
          }
          if (core.includes('/api/products/')) {
            throw new Error('legacy /api/products product fetch remains in modal core executable source');
          }
          for (const dead of [
            'public/boutique/js/view-models/modal-view-model.js',
            'public/boutique/js/b-modal-mobile-product-bootstrap.js',
          ]) {
            if (fs.existsSync(dead)) throw new Error(`legacy owner still exists: ${dead}`);
          }
          NODE
          legacy_rc=$?
          echo "pdc6-legacy-extinction=$legacy_rc" | tee -a "$summary"
          if [ "$legacy_rc" -ne 0 ]; then
            overall=1
            cat "$logs_dir/pdc6-legacy.log" >> "$summary"
          fi

          echo "overall=$overall" | tee -a "$summary"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"

      - name: Commit and publish validated integration tree
        if: steps.validate.outputs.overall == '0'
        shell: bash
        run: |
          set -euo pipefail
          validation_dir="$RUNNER_TEMP/pdc-validation"
          summary="$validation_dir/validation-summary.txt"
          push_log="$validation_dir/logs/push.log"
          start_sha='${{ steps.branch.outputs.start_sha }}'

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "integration(pdc): reconcile PDC-1→PDC-6 with Feature First main"
          fi

          git fetch origin integration/pdc1-pdc6-main
          remote_sha=$(git rev-parse origin/integration/pdc1-pdc6-main)
          if [ "$remote_sha" != "$start_sha" ]; then
            echo "push=1" >> "$summary"
            echo "integration branch moved: expected $start_sha, got $remote_sha" | tee "$push_log"
            exit 1
          fi

          set +e
          git push --force-with-lease=refs/heads/integration/pdc1-pdc6-main:$start_sha \
            origin HEAD:refs/heads/integration/pdc1-pdc6-main >"$push_log" 2>&1
          push_rc=$?
          set -e
          echo "push=$push_rc" >> "$summary"
          cat "$push_log"
          exit "$push_rc"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdc1-pdc6-integration-validation
          path: ${{ runner.temp }}/pdc-validation/
          retention-days: 7

      - name: Enforce validation result
        if: steps.validate.outputs.overall != '0'
        run: |
          cat "$RUNNER_TEMP/pdc-validation/validation-summary.txt"
          exit 1
