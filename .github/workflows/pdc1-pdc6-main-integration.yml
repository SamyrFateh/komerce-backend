name: PDC1-PDC6 Main Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pdc1-pdc6-main-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'integration/pdc1-pdc6-main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/pdc1-pdc6-main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch canonical PDC-6 head
        run: |
          git fetch origin feat/pdc6-legacy-modal-extinction-final
          test "$(git rev-parse origin/feat/pdc6-legacy-modal-extinction-final)" = "1cf302c482f2c76ed4a10028e241006324998c48"

      - name: Merge cumulative PDC-1 to PDC-6
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor 1cf302c482f2c76ed4a10028e241006324998c48 HEAD; then
            if ! git merge --no-ff -X ours 1cf302c482f2c76ed4a10028e241006324998c48 \
              -m "integration(pdc): merge PDC-1→PDC-6 into main"; then
              echo "Automatic conservative merge did not resolve every conflict."
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi
          rm -f .github/pdc1-pdc6-main.trigger

      - name: Install dependencies
        run: npm ci

      - name: Regenerate canonical architecture artifacts
        run: |
          npm run arch:gen
          npm run dashboards:360
          npm run boutique:360
          npm run meta:graph

      - name: Run integration validations with exact diagnostics
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p validation-logs
          : > validation-summary.txt
          overall=0

          run_check() {
            name="$1"
            shift
            echo "=== $name ===" | tee -a validation-summary.txt
            "$@" >"validation-logs/$name.log" 2>&1
            rc=$?
            echo "$name=$rc" | tee -a validation-summary.txt
            if [ "$rc" -ne 0 ]; then
              overall=1
              echo "--- tail $name ---" >> validation-summary.txt
              tail -120 "validation-logs/$name.log" >> validation-summary.txt
              echo "--- end tail $name ---" >> validation-summary.txt
            fi
          }

          run_check boutique-fast npm --prefix public/boutique run check:fast
          run_check feature-registry npm run feature:registry
          run_check gate-schema npm run gate:schema
          run_check docs-lint npm run gate:docs-lint
          run_check boutique-ownership npm run gate:boutique-ownership
          run_check map-check npm run map:check

          legacy_rc=0
          grep -n "_renderVariants" public/boutique/js/b-modal-core.js public/boutique/js/b-modal-product.js >validation-logs/pdc6-legacy.log 2>&1 && legacy_rc=1
          grep -nE "fetch\([^\n]*api/products/.+[^/]detail" public/boutique/js/b-modal-core.js >>validation-logs/pdc6-legacy.log 2>&1 && legacy_rc=1
          test ! -e public/boutique/js/view-models/modal-view-model.js || legacy_rc=1
          test ! -e public/boutique/js/b-modal-mobile-product-bootstrap.js || legacy_rc=1
          echo "pdc6-legacy-extinction=$legacy_rc" | tee -a validation-summary.txt
          if [ "$legacy_rc" -ne 0 ]; then
            overall=1
            cat validation-logs/pdc6-legacy.log >> validation-summary.txt
          fi

          echo "overall=$overall" | tee -a validation-summary.txt
          echo "overall=$overall" >> "$GITHUB_OUTPUT"

      - name: Commit merged tree and generated artifacts to integration branch
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(governance): regenerate artifacts after PDC integration"
          fi
          git status --short
          git push origin HEAD:integration/pdc1-pdc6-main

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdc1-pdc6-integration-validation
          path: |
            validation-summary.txt
            validation-logs/
          retention-days: 7

      - name: Enforce validation result
        if: steps.validate.outputs.overall != '0'
        run: |
          cat validation-summary.txt
          exit 1
