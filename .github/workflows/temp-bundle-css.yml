name: Temporary CSS bundle

on:
  push:
    branches:
      - chore/rebundle-ui-20260818

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rebundle-ui-20260818
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Regenerate CSS bundles atomically
        run: npm --prefix public/boutique run bundle:css
      - name: Commit generated CSS state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/dist public/boutique/index.html public/boutique/.cache-buster-state.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build(boutique): regenerate css bundles"
          git push origin HEAD:chore/rebundle-ui-20260818
