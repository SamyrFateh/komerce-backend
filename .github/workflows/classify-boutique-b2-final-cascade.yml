name: Classify Boutique B2 Final Cascade

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b2-final-cascade

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b2-final-cascade
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Classify the final 16 cascade keys
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const postcss = require('./public/boutique/node_modules/postcss');
          const { BUNDLES } = require('./public/boutique/scripts/css-bundles');
          const root = path.resolve('public/boutique');
          const cssDir = path.join(root,'css');
          const baseline = JSON.parse(fs.readFileSync(path.join(root,'scripts/.css-guard-baseline.json'),'utf8'));
          if (baseline.total !== 16 || baseline.keys.length !== 16) throw new Error(`Expected final baseline 16, got ${baseline.total}/${baseline.keys.length}`);
          console.log(`FINAL_KEYS=${baseline.keys.length}`);
          baseline.keys.forEach(k => console.log(`KEY ${k}`));

          const distOrder = ['base.css','components.css','desktop.css'];
          const delivered = [];
          for (let di=0; di<distOrder.length; di++) {
            const bundle = BUNDLES.find(b => b.out === distOrder[di]);
            bundle.files.forEach((name,si) => delivered.push({file:`${name}.css`,dist:distOrder[di],rank:di*1000+si}));
          }
          function contextOf(rule) {
            let node = rule.parent;
            while (node && node.type !== 'root') {
              if (node.type === 'atrule' && node.name === 'media') return `@media ${node.params} {`;
              node = node.parent;
            }
            return 'global';
          }
          const rowsByKey = new Map(baseline.keys.map(k => [k,[]]));
          for (const meta of delivered) {
            const fp = path.join(cssDir,meta.file);
            if (!fs.existsSync(fp)) continue;
            let raw = fs.readFileSync(fp,'utf8');
            if (meta.file === 'hero.css') {
              const deadShadow = /\n\s*0 8px 20px rgba\(198,168,93,\.10\),\n\s*0 2px 6px rgba\(100,175,90,\.06\);/;
              if (!deadShadow.test(raw)) throw new Error('Expected hero malformed orphan shadow fragment not found');
              raw = raw.replace(deadShadow,'');
            }
            const ast = postcss.parse(raw,{from:meta.file});
            ast.walkRules(rule => {
              const media = contextOf(rule);
              const selectors = rule.selectors || [rule.selector];
              rule.walkDecls(decl => selectors.forEach(rawSel => {
                const selector = rawSel.trim();
                const key = `${selector}|||${media}|||${decl.prop}`;
                if (!rowsByKey.has(key)) return;
                rowsByKey.get(key).push({file:meta.file,dist:meta.dist,rank:meta.rank,line:decl.source?.start?.line||null,selector,fullSelector:rule.selector,grouped:selectors.length>1,media,prop:decl.prop,value:decl.value});
              }));
            });
          }
          const sets = new Map();
          for (const key of baseline.keys) {
            const rows = (rowsByKey.get(key)||[]).sort((a,b)=>a.rank-b.rank||(a.line||0)-(b.line||0));
            console.log(`\n=== ${key} ===`);
            rows.forEach(r=>console.log(JSON.stringify(r)));
            if (!rows.length) console.log('NO_SOURCE_MATCH');
            else console.log(`WINNER ${rows.at(-1).file}:${rows.at(-1).line} -> ${rows.at(-1).value}`);
            const owners=[...new Set(rows.map(r=>r.file))].join(' + ')||'<none>';
            sets.set(owners,(sets.get(owners)||0)+1);
          }
          console.log('\n=== OWNER SET COUNTS ===');
          [...sets.entries()].sort((a,b)=>b[1]-a[1]).forEach(([o,c])=>console.log(`${c} ${o}`));
          NODE
