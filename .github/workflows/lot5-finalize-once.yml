name: Lot 5 finalize once

on:
  push:
    branches:
      - fix/lot5-qualification
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lot5-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgres://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: lot5-ci-secret-not-for-prod
      ADMIN_PASSWORD: lot5-ci-admin
      QR_SECRET: lot5-ci-qr-secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/lot5-qualification

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Apply guarded Lot 5 corrections
        run: node scripts/finalize-lot5-branch.js

      - name: Syntax checks
        run: |
          node --check services/pickup-secret-service.js
          node --check services/pickup-authorization-service.js
          node --check routes/pickup-secret.js
          node --check routes/auth.js
          node --check validators/index.js

      - name: Load canonical schema and migration 121
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/121_exceptional_pickup_authorization.sql
          node scripts/run-migrations.js --baseline

      - name: Lot 5 unit suites
        run: >-
          npx jest
          tests/unit/auth-route.test.js
          tests/unit/name-normalize.test.js
          tests/unit/pickup-authorization-service.test.js
          tests/unit/pickup-secret-service.test.js
          tests/unit/pickup-secret.test.js
          --runInBand --forceExit --detectOpenHandles

      - name: PostgreSQL code-versus-name race proof
        run: >-
          npx jest
          tests/e2e-api/orders.pickup-code-vs-authorized-name.e2e.test.js
          --runInBand --forceExit --detectOpenHandles

      - name: Rebuild governed artifacts
        run: |
          npm run arch:gen
          npm run business-graph:gen
          npm run feature:360:gen

      - name: Map and governance gates
        run: npm run map:check

      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci

      - name: Boutique Lot 5 unit and CSP checks
        working-directory: public/boutique
        run: |
          npx jest tests/unit/b-komerce.test.js --runInBand
          npm run check:inline-scripts:strict
          npm run check:no-injection

      - name: Remove one-shot tooling
        run: |
          rm -f scripts/finalize-lot5-branch.js
          rm -f .github/workflows/lot5-finalize-once.yml

      - name: Commit qualified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "fix: finalize exceptional pickup qualification"
          git push origin HEAD:fix/lot5-qualification
