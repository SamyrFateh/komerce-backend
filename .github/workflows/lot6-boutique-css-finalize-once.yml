name: Lot 6 boutique CSS finalization once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: lot6-boutique-css-finalization
  cancel-in-progress: true

jobs:
  finalize-css:
    if: github.event.pull_request.head.ref == 'fix/lot6-schema-reconciliation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lot6-schema-reconciliation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Rebuild CSS bundles and remove one-shot workflow
        run: |
          npm --prefix public/boutique ci
          npm --prefix public/boutique run deploy:css
          rm -f .github/workflows/lot6-boutique-css-finalize-once.yml

      - name: Prove Boutique quality
        run: npm --prefix public/boutique run check:fast

      - name: Persist generated CSS artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "fix(boutique): regenerate semantic danger CSS bundle"
          git push origin HEAD:fix/lot6-schema-reconciliation
