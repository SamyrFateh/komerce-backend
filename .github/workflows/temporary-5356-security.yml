name: On Demand isolated governance regeneration
on:
  push:
    branches: [diag/5356-security-2d099c3]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Context and regenerate security projection
        run: |
          npm run agent:context -- --pack authz --feature market-delegation
          npm run arch:impact -- market-delegation
          npm run security:360
          npm run security:360:check
      - name: Store projection on diagnostic branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "diag/5356-security-2d099c3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SECURITY_360.json docs/SECURITY_360.md
          git diff --cached --stat
          git commit -m "chore: regenerate Security 360 for On Demand"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Verify candidate without temporary workflow
        run: |
          git rm .github/workflows/temporary-5356-security.yml
          git commit -m "diag: remove temporary workflow from test tree"
          npm ci --prefix public/boutique
          npm run pr:preflight
