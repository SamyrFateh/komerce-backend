name: Temporary AUTH-3 projection generation

on:
  push:
    branches:
      - auth/3-passkey-enrollment

permissions:
  contents: write

jobs:
  generate-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove temporary helper from intended final tree
        run: rm .github/workflows/tmp-auth3-projection-gen.yml
      - name: Generate Business Graph
        run: node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
      - name: Generate gate findings
        run: node scripts/gen-gate-findings.js
      - name: Generate Feature 360
        run: node scripts/gen-feature-360.js
      - name: Verify generated tree
        run: |
          node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique
          node scripts/feature-360-check.js
          git diff --check
      - name: Commit canonical projections and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md docs/GATE_FINDINGS.json docs/FEATURE_360.json docs/FEATURE_360.md
          git add -u .github/workflows/tmp-auth3-projection-gen.yml
          git commit -m "chore(governance): refresh AUTH-3 canonical projections"
          git push origin HEAD:auth/3-passkey-enrollment
