name: Mobile PDP Chromium proof

on:
  push:
    branches:
      - 'fix/mobile-pdp-finishing-*'

permissions:
  contents: write

jobs:
  chromium-mobile:
    name: Chromium 360 / 390 / 430 PDP geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      MODAL_V3_CATALOGUE_SHOTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install boutique dependencies
        working-directory: public/boutique
        run: npm ci
      - name: Build canonical Boutique CSS assets
        working-directory: public/boutique
        run: npm run deploy:css
      - name: Regenerate canonical Boutique ownership and architecture maps
        working-directory: public/boutique
        run: |
          npm run audit:arch:live
          npm run audit:ownership
      - name: Synchronize generated CSS on branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/dist/components.css public/boutique/index.html public/boutique/.cache-buster-state.json public/boutique/docs/BOUTIQUE_ARCHITECTURE_LIVE.md public/boutique/docs/BOUTIQUE_OWNERSHIP_LIVE.md
          if ! git diff --cached --quiet; then
            git commit -m "build(boutique): refresh PDP CSS and generated architecture maps"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium
      - name: Exercise exact mobile PDP geometry in Chromium
        working-directory: public/boutique
        shell: bash
        run: |
          env -u BASE_URL npx playwright test \
            tests/e2e/modal-v3-mobile-finition.spec.js \
            --project='Desktop Chrome' \
            --grep='PDP mobile retouches 2026-11' \
            --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-pdp-chromium-evidence
          path: |
            public/boutique/test-results/
            public/boutique/docs/_work/modal-v3-catalogue/mobile-pdp-*.png
          if-no-files-found: ignore
          retention-days: 7
