name: Apply MODAL-SELECTION-1

on:
  push:
    branches:
      - fix/modal-selection-stock-sync-apply
    paths:
      - '.github/patches/modal-selection-1.b64.part*'
      - '.github/patches/modal-selection-1-test-fix.patch'
      - '.github/workflows/modal-selection-1-apply.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/patches/modal-selection-1.b64.part*'
      - '.github/patches/modal-selection-1-test-fix.patch'
      - '.github/workflows/modal-selection-1-apply.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply-and-test:
    if: github.event_name == 'push' || github.head_ref == 'fix/modal-selection-stock-sync-apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/modal-selection-stock-sync-apply
          fetch-depth: 0

      - name: Rebuild and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/modal-selection-1.b64.part{1..6} \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/modal-selection-1.patch
          git apply --check /tmp/modal-selection-1.patch
          git apply /tmp/modal-selection-1.patch
          git apply --check .github/patches/modal-selection-1-test-fix.patch
          git apply .github/patches/modal-selection-1-test-fix.patch

      - name: Remove temporary delivery files
        shell: bash
        run: |
          rm -f .github/patches/modal-selection-1.b64.part{1..6}
          rm -f .github/patches/modal-selection-1-test-fix.patch
          rm -f .github/workflows/modal-selection-1-apply.yml
          rmdir .github/patches 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install boutique dependencies
        working-directory: public/boutique
        run: npm ci --ignore-scripts

      - name: Syntax checks
        shell: bash
        run: |
          node --check public/boutique/js/b-modal-buybox-shared.js
          node --check public/boutique/js/b-modal-mobile-product.js
          node --check public/boutique/js/b-modal-desktop-product.js

      - name: Targeted boutique unit tests
        working-directory: public/boutique
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx jest \
            tests/unit/b-modal-mobile-product.test.js \
            tests/unit/b-modal-desktop-product.test.js \
            tests/unit/modal-selection-model.test.js \
            --runInBand 2>&1 | tee /tmp/modal-selection-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### MODAL-SELECTION-1 — targeted tests failed'
              echo
              echo '```text'
              tail -n 220 /tmp/modal-selection-tests.log
              echo '```'
            } > /tmp/modal-selection-comment.md
            gh pr comment 627 --body-file /tmp/modal-selection-comment.md
            exit "$status"
          fi

      - name: Commit functional correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(boutique): synchronize modal SKU selection without full rerender'
          git push origin HEAD:fix/modal-selection-stock-sync-apply
