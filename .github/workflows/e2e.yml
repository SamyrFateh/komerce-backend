# .github/workflows/e2e.yml
# Pipeline CI — Tests unitaires + E2E Playwright × 5 navigateurs
#
# Déclenchement :
#   - push sur main/develop
#   - PR vers main/develop
#   - cron quotidien (nightly) à 6h UTC
#   - manuel (workflow_dispatch)

name: "🧪 Tests Boutique"

on:
  push:
    branches: [main, develop]
    paths:
      - "public/boutique/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "public/boutique/**"
  schedule:
    # Nightly à 6h UTC (8h Paris) — attrape les régressions lentes
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL cible (vide = prod)"
        default: "https://komerce.co/boutique/"
      browsers:
        description: "Navigateurs (all | mobile | desktop | safari)"
        default: "all"
        type: choice
        options: [all, mobile, desktop, safari]

# Annule les runs précédents sur la même branche (économie CI)
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'https://komerce.co/boutique/' }}
  CI: true

jobs:
  # ── Job 1 : Tests unitaires (rapides, ~30s) ──────────────────────────
  unit:
    name: "🔬 Unit tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/boutique
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - run: npm ci
      - run: npm run test:unit

  # ── Job 2 : E2E Playwright — matrice navigateurs ─────────────────────
  e2e:
    name: "🎭 E2E — ${{ matrix.project }}"
    needs: unit # Les E2E ne tournent que si les units passent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: public/boutique

    strategy:
      fail-fast: false # Un navigateur qui échoue ne bloque pas les autres
      matrix:
        include:
          - project: "Mobile Chrome"
            group: mobile
          - project: "Mobile Safari"
            group: mobile
          - project: "Desktop Chrome"
            group: desktop
          - project: "Desktop Firefox"
            group: desktop
          - project: "Desktop Safari"
            group: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - run: npm ci

      # Installe les navigateurs Playwright (Chromium, Firefox, WebKit)
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Filtre selon le choix workflow_dispatch (all par défaut)
      - name: Check if this browser should run
        id: filter
        run: |
          CHOICE="${{ github.event.inputs.browsers || 'all' }}"
          GROUP="${{ matrix.group }}"
          if [[ "$CHOICE" == "all" ]] || [[ "$CHOICE" == "$GROUP" ]] || [[ "$CHOICE" == "safari" && "${{ matrix.project }}" == *"Safari"* ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Run E2E tests — ${{ matrix.project }}
        if: steps.filter.outputs.skip != 'true'
        run: |
          npx playwright test \
            --project="${{ matrix.project }}" \
            --workers=2 \
            --retries=2
        env:
          BASE_URL: ${{ env.BASE_URL }}

      # Artefacts en cas d'échec : screenshots, traces, rapport
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.project }}
          path: |
            public/boutique/test-results/
            public/boutique/playwright-report/
          retention-days: 7

  # ── Job 3 : Rapport consolidé ─────────────────────────────────────────
  report:
    name: "📊 Rapport E2E"
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: e2e-results-*
          merge-multiple: true

      - name: Summary
        run: |
          echo "## 🧪 Résultats E2E" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "all-results" ]; then
            echo "⚠️ Des échecs ont été détectés. Voir les artefacts ci-dessous." >> $GITHUB_STEP_SUMMARY
            ls -la all-results/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          else
            echo "✅ Tous les navigateurs sont passés !" >> $GITHUB_STEP_SUMMARY
          fi
