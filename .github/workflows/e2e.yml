# .github/workflows/e2e.yml
# Pipeline CI — unités + E2E Playwright multi-navigateurs.
#
# PR : preuve déterministe du tree checkouté, servi localement.
# main/nightly/manual : campagne distante explicite sur l'URL cible.

name: "🧪 Tests Boutique"

on:
  push:
    branches: [main, develop]
    paths:
      - "public/boutique/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "public/boutique/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL cible distante"
        default: "https://komerce.co/boutique/"
      browsers:
        description: "Navigateurs (all | mobile | desktop | safari)"
        default: "all"
        type: choice
        options: [all, mobile, desktop, safari]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  unit:
    name: "🔬 Unit tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/boutique
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: "🎭 E2E — ${{ matrix.project }}"
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: public/boutique

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: "Mobile Chrome"
            group: mobile
          - project: "Mobile Safari"
            group: mobile
          - project: "Desktop Chrome"
            group: desktop
          - project: "Desktop Firefox"
            group: desktop
          - project: "Desktop Safari"
            group: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            public/boutique/package-lock.json

      - name: Install backend deps required by CSP contract imports
        working-directory: .
        run: npm ci

      - name: Install Boutique deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check if this browser should run
        id: filter
        run: |
          CHOICE="${{ github.event.inputs.browsers || 'all' }}"
          GROUP="${{ matrix.group }}"
          if [[ "$CHOICE" == "all" ]] || [[ "$CHOICE" == "$GROUP" ]] || [[ "$CHOICE" == "safari" && "${{ matrix.project }}" == *"Safari"* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove checked-out PR tree locally
        if: github.event_name == 'pull_request' && matrix.project == 'Desktop Chrome'
        run: |
          npx playwright test \
            tests/e2e/modal-geometry.spec.js \
            tests/e2e/hero-geometry.spec.js \
            tests/e2e/modal-backtop-zindex.spec.js \
            --project='Chromium Local-Only' \
            --workers=2 \
            --retries=1
          npx playwright test \
            tests/e2e/modal-mdm9-gallery-layout.spec.js \
            --project='Chromium MDM-9' \
            --workers=1 \
            --retries=1

      - name: Run remote campaign — ${{ matrix.project }}
        if: github.event_name != 'pull_request' && steps.filter.outputs.skip != 'true'
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://komerce.co/boutique/' }}
        run: |
          npx playwright test \
            --project="${{ matrix.project }}" \
            --workers=2 \
            --retries=2

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.project }}
          path: |
            public/boutique/test-results/
            public/boutique/playwright-report/
          retention-days: 7

  report:
    name: "📊 Rapport E2E"
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: e2e-results-*
          merge-multiple: true

      - name: Summary
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "## 🧪 Résultats E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Résultat matrice : **${E2E_RESULT}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$E2E_RESULT" = "success" ]; then
            echo "✅ Tous les navigateurs sélectionnés sont passés." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ La matrice n'est pas verte. Les artefacts disponibles contiennent les preuves d'échec." >> "$GITHUB_STEP_SUMMARY"
          fi
