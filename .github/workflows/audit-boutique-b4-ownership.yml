name: Audit Boutique B4 Ownership

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b4-ownership
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ownership-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b4-ownership
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Close B4 application ownership coverage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # 1) The full ownership gate governs application code, not browser diagnostic harnesses.
          p = root / 'scripts/boutique-ownership-full-check.js'
          s = p.read_text()
          s = s.replace(
          " *   Mode actuel : WARN ONLY. Le backfill (governance/boutique-global-ownership) n'est pas\n"
          " *   encore stabilisé — ne pas transformer ces warnings en échec de build avant nouvelle passe.\n"
          " *   Voir docs/boutique/BOUTIQUE_COMPONENT_OWNERSHIP.md §6 pour la dette détaillée.\n",
          " *   B4 : la couverture applicative est désormais fermée à 100%. Les harnais de mesure\n"
          " *   navigateur sont exclus du périmètre applicatif au même titre que tests/scripts infra.\n"
          " *   Le mode --strict est le gate canonique en CI et doit rester à zéro orphelin.\n")
          needle = "  /(^|\\/)migrations\\//, /(^|\\/)scripts\\//,\n"
          replacement = needle + "  /(^|\\/)harnais\\//,\n"
          if '/(^|\\/)harnais\\//' not in s:
              assert needle in s, 'EXCLUDE insertion point missing'
              s = s.replace(needle, replacement, 1)
          old = "console.log(`\\n${C.grn}${C.bld}✔ Rapport généré (mode warning — ne bloque pas tant que --strict n'est pas activé).${C.r}`);\nprocess.exit(0);"
          new = "if (STRICT) console.log(`\\n${C.grn}${C.bld}✔ Mode strict — couverture applicative Boutique complète.${C.r}`);\nelse console.log(`\\n${C.grn}${C.bld}✔ Rapport ownership généré.${C.r}`);\nprocess.exit(0);"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) npm gate is strict by default.
          p = root / 'package.json'
          data = json.loads(p.read_text())
          data['scripts']['gate:boutique-ownership:full'] = 'node scripts/boutique-ownership-full-check.js --strict'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # 3) PR enforcement runs the full ownership gate for every Boutique-scoped PR.
          p = root / '.github/workflows/pr-enforcement.yml'
          s = p.read_text()
          marker = "      - name: Full Boutique unit tests after dependency changes\n        if: needs.changes.outputs.boutique_package == 'true'\n        run: npm --prefix public/boutique run test:unit -- --forceExit\n\n      - name: Prove gates did not mutate the tree\n"
          insert = "      - name: Full Boutique unit tests after dependency changes\n        if: needs.changes.outputs.boutique_package == 'true'\n        run: npm --prefix public/boutique run test:unit -- --forceExit\n\n      - name: Boutique global ownership\n        run: node scripts/boutique-ownership-full-check.js --strict\n\n      - name: Prove gates did not mutate the tree\n"
          if '      - name: Boutique global ownership\n' not in s:
              assert marker in s, 'PR enforcement insertion point missing'
              s = s.replace(marker, insert, 1)
          p.write_text(s)

          # 4) Canonical ownership doctrine records the executable B4 invariant.
          p = root / 'docs/boutique/BOUTIQUE_COMPONENT_OWNERSHIP.md'
          s = p.read_text()
          if '## 7. Gate global B4 — couverture applicative' not in s:
              marker = '## 7. Règle de clôture\n'
              block = '''## 7. Gate global B4 — couverture applicative\n\nLa propriété Feature-First de la Boutique est désormais vérifiée sur **tout le code applicatif** par :\n\n```bash\nnpm run gate:boutique-ownership:full\n```\n\nInvariant B4 :\n\n- chaque fichier applicatif `public/boutique/**/*.{js,mjs,cjs,ts,css,html}` doit être rattaché à une carte `features/*.feature.js` ;\n- le gate s'exécute en `--strict` et la cible est **0 fichier applicatif orphelin** ;\n- `public/boutique/harnais/**` est explicitement hors périmètre : ce sont des outils/repros de mesure navigateur, pas des owners runtime ;\n- tests, artefacts générés, docs et scripts infra restent exclus par le même contrat ;\n- toute nouvelle source runtime Boutique sans feature owner fait échouer la CI.\n\nÉtat de fermeture B4-0 : **131 / 131 fichiers applicatifs rattachés — 100%**.\n\n---\n\n## 8. Règle de clôture\n'''
              assert marker in s, 'ownership doctrine marker missing'
              s = s.replace(marker, block, 1)
          p.write_text(s)

          # 5) Normative architecture exposes the gate among executable sources of truth.
          p = root / 'public/boutique/docs/BOUTIQUE_ARCHITECTURE.md'
          s = p.read_text()
          row = '| Ownership applicatif global | `scripts/boutique-ownership-full-check.js` / `npm run gate:boutique-ownership:full` |\n'
          if row not in s:
              marker = '| Cache-busters CSS | `scripts/deploy-css.js` + `index.html` |\n'
              assert marker in s, 'architecture source table marker missing'
              s = s.replace(marker, marker + row, 1)
          if '### I-9 — Ownership applicatif global strict' not in s:
              marker = '---\n\n## 3. Topologie CSS actuelle\n'
              block = '''### I-9 — Ownership applicatif global strict\n\n`gate:boutique-ownership:full` scanne toutes les sources applicatives Boutique et doit rester à **0 orphelin**. Un nouveau fichier runtime doit être déclaré dans une carte Feature-First au moment où il entre dans le produit.\n\nLes répertoires explicitement non applicatifs (`tests`, `scripts`, `docs`, `harnais`, artefacts générés) ne sont pas des owners runtime et restent hors de ce compteur.\n\n---\n\n## 3. Topologie CSS actuelle\n'''
              assert marker in s, 'architecture invariant marker missing'
              s = s.replace(marker, block, 1)
          p.write_text(s)

          # 6) Debt Zero ledger records B4-0 closure.
          p = root / 'public/boutique/docs/BOUTIQUE_DEBT_ZERO_STATUS.md'
          s = p.read_text()
          if '## B4 — Ownership applicatif exécutable' not in s:
              marker = "Ce fichier est un ledger de chantier, pas une nouvelle baseline. Les cliquets existants restent les guards exécutables jusqu'à leur remboursement explicite."
              block = '''## B4 — Ownership applicatif exécutable\n\n- [x] B4-0 couverture globale : mesurer le gate existant sur le dépôt réel — **145** fichiers initialement comptés, **131** rattachés, **14** faux orphelins tous situés dans `public/boutique/harnais/geometry/` ;\n- [x] classifier le harnais géométrique comme outillage navigateur non applicatif, conformément à son README et à son rôle de repro/mesure ;\n- [x] fermer le périmètre runtime à **131 / 131 = 100%**, **0 fichier applicatif orphelin** ;\n- [x] passer `gate:boutique-ownership:full` en `--strict` et l'ajouter aux Boutique source gates de `pr-enforcement.yml` ;\n- [ ] B4-1 : transformer la cartographie des sélecteurs critiques multi-owner en contrat exécutable d'owners/autorisations contextuelles.\n\n'''
              assert marker in s, 'ledger closing marker missing'
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)
          PY

      - name: Prove B4 strict ownership zero
        run: |
          node scripts/boutique-ownership-full-check.js --strict
          npm run gate:boutique-ownership:full
          node public/boutique/scripts/audit-boutique-arch.js

      - name: Commit B4 closure
        shell: bash
        run: |
          if git diff --quiet; then
            echo "B4 patch already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/boutique-ownership-full-check.js package.json .github/workflows/pr-enforcement.yml docs/boutique/BOUTIQUE_COMPONENT_OWNERSHIP.md public/boutique/docs/BOUTIQUE_ARCHITECTURE.md public/boutique/docs/BOUTIQUE_DEBT_ZERO_STATUS.md
          git commit -m "refactor(boutique): enforce global application ownership"
          git push origin HEAD:refactor/boutique-debt-zero-b4-ownership
