name: Integration Audit One Shot

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  statuses: write

jobs:
  integration-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://komerce:komerce@127.0.0.1:5432/komerce_test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify schema snapshot
        run: |
          node scripts/check-schema-freshness.js
          node scripts/check-schema-resurrection.js

      - name: Load canonical integration schema
        run: |
          set -o pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/db/railway-live-schema.sql 2>&1 | tee integration-schema.log
          node scripts/ci-migrate.js 2>&1 | tee -a integration-schema.log

      - name: Run every integration suite and collect failures
        run: |
          set -o pipefail
          : > integration-test.log
          : > integration-failures.txt
          failed=0
          total=0
          for f in tests/integration/*.test.js; do
            total=$((total + 1))
            echo "── $f ──" | tee -a integration-test.log
            if npx jest "$f" --ci --forceExit 2>&1 | tee -a integration-test.log; then
              echo "PASS $f" | tee -a integration-test.log
            else
              echo "$f" >> integration-failures.txt
              echo "FAIL $f" | tee -a integration-test.log
              failed=$((failed + 1))
            fi
          done
          echo "TOTAL=$total FAILED=$failed" | tee -a integration-test.log
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-audit-${{ github.run_id }}
          path: |
            integration-schema.log
            integration-test.log
            integration-failures.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Publish integration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description="Integration suites failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Integration suites passed"
          fi
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"integration-audit\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
