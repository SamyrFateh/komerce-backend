name: Integration Audit One Shot

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  statuses: write

jobs:
  integration-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d komerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/komerce_test
      JWT_SECRET: integration-test-secret
      ADMIN_PASSWORD: integration-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: integration-qr-secret
      AUTHKEY_API_KEY: integration-dummy
      PAYPAL_CLIENT_ID: integration-dummy
      PAYPAL_CLIENT_SECRET: integration-dummy
      PAYPAL_WEBHOOK_ID: integration-dummy
      META_WA_APP_SECRET: integration-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration suites
        run: |
          set -o pipefail
          npx jest tests/integration --runInBand --forceExit --detectOpenHandles --verbose 2>&1 | tee integration-test.log

      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-audit-${{ github.run_id }}
          path: integration-test.log
          retention-days: 1

      - name: Publish integration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description="Integration suites failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Integration suites passed"
          fi
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"integration-audit\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
