name: Mobile Money realign

on:
  push:
    branches:
      - feat/mobile-money-cm-cg
    paths:
      - '.github/workflows/mm-realign.yml'

permissions:
  contents: write

jobs:
  realign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      KOMERCE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_test
      JWT_SECRET: ci-test-jwt-secret-mobile-money-32chars
      QR_SECRET: ci-test-qr-secret-mobile-money-32chars
      ADMIN_PASSWORD: ci-test-admin-password
      STRIPE_SECRET_KEY: sk_test_ci_mobile_money_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_mobile_money_placeholder
      PAYPAL_CLIENT_ID: ci-test-paypal-client
      PAYPAL_CLIENT_SECRET: ci-test-paypal-secret
      PAYPAL_WEBHOOK_ID: ci-test-paypal-webhook
      META_WA_APP_SECRET: ci-test-meta-secret
      AUTHKEY_API_KEY: ci-test-authkey
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-money-cm-cg
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Renumber Mobile Money migration and document intended schema
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['bootstrap/api-routes.js','bootstrap/crons.js','features/payments.feature.js','migrations/169_mobile_money_foundation.sql']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('168_mobile_money_foundation.sql', '169_mobile_money_foundation.sql')
              s = s.replace('Migration 168', 'Migration 169')
              s = s.replace('migration 168', 'migration 169')
              p.write_text(s)
          p = Path('docs/SCHEMA.md')
          s = p.read_text()
          old = "| `payment_mode` | `stripe_eur`, `cash_relais`, `mixed_shared_cart_cash` | `routes/orders/create.js` |"
          new = "| `payment_mode` | `stripe_eur`, `cash_relais`, `mixed_shared_cart_cash`; **Migration 169 (2026-09-07, `intended_migration_schema`)** : + `mobile_money`, rail Komerce distinct du provider opérateur. | `routes/orders/create.js` + `services/payment-mobile-money.js` |"
          if old not in s and 'Migration 169' not in s:
              raise SystemExit('payment_mode anchor not found')
          s = s.replace(old, new)
          s = s.replace('### 4.4 Paiements et finance (9 tables)', '### 4.4 Paiements et finance (9 tables live + 2 visées)')
          old_invoice = "| `invoices` | Factures / mini-factures. Contrainte UNIQUE(order_id) — une seule facture par commande. |"
          new_invoice = "| `invoices` | Factures / mini-factures. Contrainte UNIQUE(order_id) — une seule facture par commande. **Migration 169 (2026-09-07, `intended_migration_schema`)** : + `payment_total_amount` NUMERIC(18,4), `payment_currency` TEXT et `payment_minor_unit` INTEGER pour figer la devise réellement encaissée par les rails natifs comme Mobile Money XAF, sans réinterpréter `display_total_amount`. |"
          if old_invoice not in s and 'payment_total_amount' not in s:
              raise SystemExit('invoice anchor not found')
          s = s.replace(old_invoice, new_invoice)
          pending_lines = [
              '<!-- schema-pending',
              'object: market_payment_providers',
              'kind: table',
              'migration: 169',
              'section: ### 4.4 Paiements et finance (9 tables live + 2 visées)',
              "role: Providers Mobile Money autorisés par marché, sans credential persistée ; l'activation métier reste distincte de la configuration secrète runtime.",
              '-->',
              '',
              '<!-- schema-pending',
              'object: mobile_money_transactions',
              'kind: table',
              'migration: 169',
              'section: ### 4.4 Paiements et finance (9 tables live + 2 visées)',
              'role: Tentatives et transactions Mobile Money idempotentes ; snapshot provider, marché, MSISDN, devise/montant et statut externe avant confirmation canonique paiement→stock.',
              '-->',
              '',
          ]
          marker = '### 4.5 Paniers et catalogue'
          if 'object: market_payment_providers' not in s:
              if marker not in s:
                  raise SystemExit('section 4.5 anchor not found')
              s = s.replace(marker, '\n'.join(pending_lines) + marker, 1)
          p.write_text(s)
          PY
      - name: Refresh canonical derived projections
        run: |
          npm run contract:generate
          npm run security:360
          node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
          node scripts/gen-feature-360.js
          node scripts/gen-agent-remediation-index.js
      - name: Commit realigned state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/api-routes.js bootstrap/crons.js features/payments.feature.js migrations/169_mobile_money_foundation.sql docs/SCHEMA.md docs/contract docs/SECURITY_360.json docs/SECURITY_360.md docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/FEATURE_360.json docs/FEATURE_360.md docs/AGENT_REMEDIATION_INDEX.json
          if git diff --cached --quiet; then
            echo 'No realignment changes.'
          else
            git commit -m 'chore(payment): realign Mobile Money on migration 169'
            git push origin HEAD:feat/mobile-money-cm-cg
          fi