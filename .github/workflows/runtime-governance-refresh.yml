name: Runtime Governance Refresh

on:
  push:
    branches: [feat/discovery-local-v2]
    paths:
      - '.github/workflows/runtime-governance-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discovery-local-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Remove temporary workflow before canonical scans
        run: rm .github/workflows/runtime-governance-refresh.yml

      - name: Regenerate canonical governance artifacts
        run: |
          npm run business-graph:gen
          npm run security:360
          npm run feature:360:gen
          npm run agent:remediation:gen

      - name: Commit generated projections and workflow cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(governance): refresh runtime hardening projections'
          git push origin HEAD:feat/discovery-local-v2
