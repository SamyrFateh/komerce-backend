name: Claude PAR — comptes de recette dédiés CM et CG (staging)

# Certification parallèle Claude : 4 rôles par marché (responsable pays, finance, transitaire, agent relais) et un relais
# "CLAUDE-PAR Relais <code>" par marché, via les writers canoniques. Hub, sourcing et directrice Hub restent les comptes
# Claude PAR globaux existants. Mots de passe générés dans le run, masqués, livrés uniquement chiffrés.
on:
  push:
    branches: [cert/claude-par-accounts]
    paths:
      - '.github/workflows/claude-par-cm-cg-provision.yml'
      - 'scripts/recette/claude-par/provision-cm-cg.js'

permissions:
  contents: read

concurrency:
  group: claude-par-cm-cg-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier la cible staging
        run: node scripts/recette/target-guard.js
      - name: Générer les identifiants (masqués)
        run: |
          set -euo pipefail
          umask 077
          echo '{' > "$RUNNER_TEMP/creds.json"; first=1
          for m in CM CG; do
            for r in MARKET_OPERATOR FINANCE AGENT_TRANSITAIRE AGENT_RELAIS; do
              slug=$(echo "$r" | tr 'A-Z_' 'a-z-'); ml=$(echo "$m" | tr 'A-Z' 'a-z')
              email="claude-par-${ml}-${slug}@komerce-recette.test"
              pass="Kp9$(openssl rand -hex 14)Z"
              echo "::add-mask::$pass"
              echo "CLAUDE_PAR_${m}_${r}_EMAIL=$email" >> "$GITHUB_ENV"
              echo "CLAUDE_PAR_${m}_${r}_PASSWORD=$pass" >> "$GITHUB_ENV"
              [ $first -eq 1 ] || echo ',' >> "$RUNNER_TEMP/creds.json"; first=0
              printf '"%s-%s":{"email":"%s","password":"%s"}' "$ml" "$slug" "$email" "$pass" >> "$RUNNER_TEMP/creds.json"
            done
          done
          echo '}' >> "$RUNNER_TEMP/creds.json"
      - name: Provisionner (transaction unique)
        run: |
          set -euo pipefail
          mkdir -p test-results/claude-par-cm-cg
          node scripts/recette/claude-par/provision-cm-cg.js | tee test-results/claude-par-cm-cg/report.json
      - name: Chiffrer les identifiants pour Opus
        run: |
          set -euo pipefail
          umask 077
          openssl rand -out "$RUNNER_TEMP/k.bin" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/creds.json" \
            -out test-results/claude-par-cm-cg/creds.enc -pass "file:$RUNNER_TEMP/k.bin"
          openssl pkeyutl -encrypt -pubin -inkey scripts/recette/claude-par/recipient.pub.pem \
            -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k.bin" -out test-results/claude-par-cm-cg/key.enc
          shred -u "$RUNNER_TEMP/k.bin" "$RUNNER_TEMP/creds.json"
          if grep -q 'Kp9' test-results/claude-par-cm-cg/report.json; then echo 'Refus : mot de passe dans le rapport'; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-par-cm-cg-${{ github.run_id }}
          path: test-results/claude-par-cm-cg/
          if-no-files-found: warn
          retention-days: 7
