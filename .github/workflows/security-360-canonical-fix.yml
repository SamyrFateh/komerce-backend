name: Security 360 canonical guard fix

on:
  push:
    branches:
      - ci/security-360-canonical-fix-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: repo
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: ci/security-360-canonical-fix-v1
          path: helper
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-360-canonical-guards
          fetch-depth: 0
          path: repo
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - run: npm ci
      - name: Patch parser, freshness semantics and PR gate
        run: python3 ../helper/ci/security360_fix.py .
      - name: Regenerate Security 360 derived docs
        run: npm run security:360
      - name: Assert Canonical guard findings are resolved
        run: |
          node <<'NODE'
          const j = require('./docs/SECURITY_360.json');
          console.log(JSON.stringify(j.summary));
          const admin = j.routes.filter(r => r.level === 'ADMIN_NO_GUARD');
          const unknown = j.routes.filter(r => r.level === 'UNKNOWN');
          if (admin.length) {
            console.error('ADMIN_NO_GUARD still present:', admin.map(r => r.key));
            process.exit(1);
          }
          const pricingUnknown = unknown.filter(r => r.key.includes('/api/admin/pricing-matrices/'));
          if (pricingUnknown.length) {
            console.error('pricing-matrices still UNKNOWN:', pricingUnknown.map(r => r.key));
            process.exit(1);
          }
          if (j.summary.total !== 549) throw new Error(`expected 549 routes, got ${j.summary.total}`);
          NODE
      - name: Security 360 check is read-only and fresh
        run: |
          cp docs/SECURITY_360.json /tmp/security360.json
          cp docs/SECURITY_360.md /tmp/security360.md
          npm run security:360:check
          cmp docs/SECURITY_360.json /tmp/security360.json
          cmp docs/SECURITY_360.md /tmp/security360.md
      - name: Standard gates
        run: |
          node scripts/code-quality-gate.js --strict
          node scripts/feature-guard.js --strict
          node scripts/contract-check.js
          git diff --check
      - name: Commit and push verified parser and docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/pr-enforcement.yml
          git add scripts/gen-security-360.js docs/SECURITY_360.json docs/SECURITY_360.md
          git status --short
          git commit -m "fix(security): fiabiliser Security 360 sur les gardes Canonical"
          git push origin HEAD:fix/security-360-canonical-guards
