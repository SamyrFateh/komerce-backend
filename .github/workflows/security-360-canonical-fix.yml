name: Security 360 canonical guard fix

on:
  push:
    branches:
      - ci/security-360-canonical-fix-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: repo
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: ci/security-360-canonical-fix-v1
          path: helper
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-360-canonical-guards
          fetch-depth: 0
          path: repo
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - run: npm ci
      - name: Patch Security 360 enforcement scope
        run: python3 ../helper/ci/security360_scope_fix.py .
      - name: Assert Security 360 sources wake Backend
        run: |
          node <<'NODE'
          const scope = require('./scripts/pr-enforcement-scope');
          for (const file of [
            'scripts/gen-security-360.js',
            'scripts/run-security-360.js',
            'scripts/.security-360-baseline.json',
            'docs/SECURITY_360.json',
            'docs/SECURITY_360.md',
          ]) {
            if (!scope.isBackendFile(file)) throw new Error(`Security 360 file not backend-scoped: ${file}`);
          }
          NODE
      - name: Existing Security 360 remains fresh
        run: npm run security:360:check
      - name: Standard gates
        run: |
          node scripts/code-quality-gate.js --strict
          node scripts/feature-guard.js --strict
          node scripts/contract-check.js
          git diff --check
      - name: Commit and push verified scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/pr-enforcement-scope.js
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to persist"
            exit 0
          fi
          git commit -m "fix(security): réveiller le gate Security 360 sur ses sources"
          git push origin HEAD:fix/security-360-canonical-guards
