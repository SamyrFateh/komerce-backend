name: Staging AliExpress catalog publish pilot

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: komerce-staging-aliexpress-catalog-publish-pilot
  cancel-in-progress: false

jobs:
  publish:
    name: AliExpress catalog — publish 5-product pilot
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[staging-op] aliexpress-catalog-publish-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}

    steps:
      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Preflight capacity and exact five
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo '::error::RAILWAY_DATABASE_URL manquant'; exit 1; }
          node <<'NODE'
          const db = require('./db');
          const { getRuleNumber } = require('./utils/rules');
          const refs = ['KPR-131413','KPR-131414','KPR-131415','KPR-131416','KPR-131417'];
          (async () => {
            const cap = Math.max(1, Number(await getRuleNumber('CATALOG_CAP_MVP', 120)) || 120);
            const { rows: [{ count }] } = await db.query('SELECT COUNT(*)::int AS count FROM products WHERE is_active = TRUE');
            const published = Number(count) || 0;
            const { rows } = await db.query(`
              SELECT p.product_ref, p.lifecycle_status, p.is_active, p.content_source, p.needs_review,
                     COUNT(DISTINCT cm.id) FILTER (WHERE cm.is_active = TRUE)::int AS active_media,
                     COUNT(DISTINCT ps.id) FILTER (WHERE ps.is_active = TRUE)::int AS active_skus,
                     COUNT(DISTINCT ps.id) FILTER (
                       WHERE ps.is_active = TRUE
                         AND ps.supplier_unit_ref IS NOT NULL
                         AND ps.supplier_order_identity IS NOT NULL
                     )::int AS soi_complete_skus
                FROM products p
                LEFT JOIN catalog_media cm ON cm.product_id = p.id
                LEFT JOIN product_skus ps ON ps.product_id = p.id
               WHERE p.product_ref = ANY($1::text[])
               GROUP BY p.id
               ORDER BY p.product_ref`, [refs]);

            console.log(JSON.stringify({ catalog: { published, cap, remaining: cap - published }, products: rows }, null, 2));
            const failures = [];
            if (published + refs.length > cap) failures.push(`catalog capacity insufficient: ${published}/${cap}, need ${refs.length}`);
            if (rows.length !== refs.length) failures.push(`products found ${rows.length}/${refs.length}`);
            for (const row of rows) {
              if (row.lifecycle_status !== 'candidate' || row.is_active !== false) failures.push(`${row.product_ref}: not pending`);
              if (row.content_source !== 'manual' || row.needs_review !== false) failures.push(`${row.product_ref}: not manually ready`);
              if (Number(row.active_media) < 1) failures.push(`${row.product_ref}: no active media`);
              if (Number(row.active_skus) < 1 || Number(row.active_skus) !== Number(row.soi_complete_skus)) failures.push(`${row.product_ref}: SOI ${row.soi_complete_skus}/${row.active_skus}`);
            }
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exitCode = 1;
            }
          })().catch(err => { console.error(err); process.exitCode = 1; }).finally(() => db.pool.end());
          NODE

      - name: Publish exact five through canonical catalog approval
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const db = require('./db');
          const { approveProduct } = require('./services/catalog-approval');
          const refs = ['KPR-131413','KPR-131414','KPR-131415','KPR-131416','KPR-131417'];
          const actor = { id: 'staging-aliexpress-catalog-pilot' };
          (async () => {
            for (const ref of refs) {
              const { rows: [row] } = await db.query('SELECT id FROM products WHERE product_ref = $1', [ref]);
              if (!row) throw new Error(`${ref}: product missing`);
              const result = await approveProduct(db, row.id, actor);
              if (result.status !== 200) throw new Error(`${ref}: approval failed ${result.status} ${JSON.stringify(result.body)}`);
              console.log(`${ref}: published`);
            }
          })().catch(err => { console.error(err); process.exitCode = 1; }).finally(() => db.pool.end());
          NODE

      - name: Audit exact five after publication
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const db = require('./db');
          const refs = ['KPR-131413','KPR-131414','KPR-131415','KPR-131416','KPR-131417'];
          (async () => {
            const { rows } = await db.query(`
              SELECT p.product_ref, p.name, p.category, p.price_kmf, p.stock,
                     p.lifecycle_status, p.is_active, p.quality_validated,
                     p.content_source, p.needs_review,
                     COUNT(DISTINCT cm.id) FILTER (WHERE cm.is_active = TRUE)::int AS active_media,
                     COUNT(DISTINCT ps.id) FILTER (WHERE ps.is_active = TRUE)::int AS active_skus,
                     COUNT(DISTINCT ps.id) FILTER (
                       WHERE ps.is_active = TRUE
                         AND ps.supplier_unit_ref IS NOT NULL
                         AND ps.supplier_order_identity IS NOT NULL
                     )::int AS soi_complete_skus
                FROM products p
                LEFT JOIN catalog_media cm ON cm.product_id = p.id
                LEFT JOIN product_skus ps ON ps.product_id = p.id
               WHERE p.product_ref = ANY($1::text[])
               GROUP BY p.id
               ORDER BY p.product_ref`, [refs]);
            console.log(JSON.stringify(rows, null, 2));
            const failures = [];
            if (rows.length !== refs.length) failures.push(`rows=${rows.length}/${refs.length}`);
            for (const row of rows) {
              if (row.lifecycle_status !== 'active' || row.is_active !== true || row.quality_validated !== true) failures.push(`${row.product_ref}: not active/validated`);
              if (row.content_source !== 'manual' || row.needs_review !== false) failures.push(`${row.product_ref}: content state unexpected`);
              if (Number(row.active_media) < 1) failures.push(`${row.product_ref}: no active media`);
              if (Number(row.active_skus) < 1 || Number(row.active_skus) !== Number(row.soi_complete_skus)) failures.push(`${row.product_ref}: SOI ${row.soi_complete_skus}/${row.active_skus}`);
            }
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exitCode = 1;
            }
          })().catch(err => { console.error(err); process.exitCode = 1; }).finally(() => db.pool.end());
          NODE

      - name: Close successful command issue
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'Published KPR-131413 → KPR-131417 through canonical catalog approval. Post-publication audit passed with complete SOI coverage.'
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
