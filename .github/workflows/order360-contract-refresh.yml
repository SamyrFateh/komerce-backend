name: Order 360 contract refresh

on:
  push:
    branches:
      - feat/order-360-canonical-3a

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/order-360-canonical-3a
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Generate validated Order 360 contract artifacts
        run: node scripts/contract-check.js
      - name: Commit generated artifacts only
        run: |
          git add scripts/contract-generate.js docs/_generated/route-registry.json docs/contract/openapi.json
          if git diff --cached --quiet; then
            echo "No generated diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(contract): refresh Order 360 artifacts"
          git push origin HEAD:feat/order-360-canonical-3a
