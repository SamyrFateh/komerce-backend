name: Verify Golden showcase deployment

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-golden-showcase-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report Golden API database state
        shell: bash
        run: |
          curl -L --max-time 30 -sS \
            'https://komerce-backend-production.up.railway.app/api/products/aaaaaaaa-1111-4aaa-8aaa-aaaaaaaa0001/detail' \
            -o /tmp/golden.json
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/golden.json', 'utf8'));
          const urls = (d.media || []).map(m => String(m.url));
          console.log(JSON.stringify({
            inventory_model: d.inventory_model,
            media: urls.length,
            local_media: urls.filter(u => u.startsWith('/images/products/golden-elite-pro/')).length,
            old_cdn_media: urls.filter(u => u.includes('cdn.example.com')).length,
            sellable_units: (d.sellable_units || []).length,
            brand: d.content?.brand ?? null,
            enrichment_version: d.content?.provenance?.enrichment_version ?? null,
            urls
          }, null, 2));
          NODE
