name: Verify Golden showcase deployment

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    if: github.head_ref == 'ops/verify-golden-showcase-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public media and API contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u -o pipefail
          product_id='aaaaaaaa-1111-4aaa-8aaa-aaaaaaaa0001'
          media=(neutral-main.svg bleu-main.svg bleu-scene.svg bleu-detail-semelle.svg noir-main.svg noir-scene.svg size-guide.svg)
          origins=('https://komerce.co' 'https://komerce-backend-production.up.railway.app')
          ok=1
          report='### Golden showcase — état déployé\n\n'

          for origin in "${origins[@]}"; do
            report+="#### ${origin}\n"
            for file in "${media[@]}"; do
              url="${origin}/images/products/golden-elite-pro/${file}"
              code=$(curl -L --max-time 20 -sS -o /dev/null -w '%{http_code}' "$url" || true)
              report+="- ${file}: ${code}\n"
              [ "$code" = '200' ] || ok=0
            done
            report+='\n'
          done

          api="https://komerce-backend-production.up.railway.app/api/products/${product_id}/detail"
          api_code=$(curl -L --max-time 30 -sS -o /tmp/golden-detail.json -w '%{http_code}' "$api" || true)
          report+="#### API detail\n- HTTP: ${api_code}\n"
          if [ "$api_code" = '200' ]; then
            node - <<'NODE' >/tmp/api-summary.txt
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/golden-detail.json', 'utf8'));
          const urls = (d.media || []).map(m => String(m.url));
          const local = urls.filter(url => url.startsWith('/images/products/golden-elite-pro/'));
          const external = urls.filter(url => url.includes('cdn.example.com'));
          console.log(`- inventory_model: ${d.inventory_model}`);
          console.log(`- media: ${urls.length}`);
          console.log(`- local_media: ${local.length}`);
          console.log(`- old_cdn_media: ${external.length}`);
          console.log(`- sellable_units: ${(d.sellable_units || []).length}`);
          console.log(`- brand: ${d.content?.brand ?? 'null'}`);
          console.log(`- enrichment_version: ${d.content?.provenance?.enrichment_version ?? 'null'}`);
          process.exitCode = d.inventory_model === 'SKU'
            && (d.sellable_units || []).length === 5
            && local.length === 7
            && external.length === 0
            && d.content?.brand === 'Elite Pro' ? 0 : 1;
          NODE
            summary_status=$?
            report+="$(cat /tmp/api-summary.txt)\n"
            [ "$summary_status" = '0' ] || ok=0
          else
            ok=0
          fi

          printf '%b' "$report" | tee /tmp/golden-report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/golden-report.md || true
          [ "$ok" = '1' ]
