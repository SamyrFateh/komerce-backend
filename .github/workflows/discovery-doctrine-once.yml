name: Discovery doctrine alignment once

on:
  push:
    branches:
      - docs/discovery-experience-invariants

permissions:
  contents: write

concurrency:
  group: discovery-doctrine-alignment
  cancel-in-progress: true

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/discovery-experience-invariants
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align canonical doctrine
        run: |
          node scripts/patch-discovery-experience-doctrine-once.js
          rm -f scripts/patch-discovery-experience-doctrine-once.js

      - name: Validate documentation contract
        run: |
          npm run gate:docs-lint
          npm run feature:registry
          npm run gate:schema

      - name: Persist canonical doctrine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/doctrine/DOCTRINE_DISCOVERY_LOCALE_UNIFIEE.md scripts/patch-discovery-experience-doctrine-once.js
          git diff --cached --check
          git commit --no-verify -m "docs(discovery): codify experience invariants"
          git push origin HEAD:docs/discovery-experience-invariants
