name: Close Boutique B4 Selector Ownership

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b4-selector-ownership
  workflow_dispatch:

permissions:
  contents: write

jobs:
  b4-selector-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b4-selector-ownership
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Consolidate LIVE and architecture audit on one ownership contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # LIVE: tracked selectors are exactly the machine-readable contract keys.
          p = Path('public/boutique/scripts/gen-boutique-arch-live.js')
          s = p.read_text()
          bundle_require = "const { BUNDLES } = require('./css-bundles.js');\n"
          contract_require = "const { CRITICAL_SELECTOR_OWNERSHIP } = require('./critical-selector-ownership.js');\n"
          if contract_require not in s:
              assert bundle_require in s
              s = s.replace(bundle_require, bundle_require + contract_require, 1)
          s, n = re.subn(
              r"const TRACKED_SELECTORS = \[\n(?:.|\n)*?\n\];\n\nconst JS_OWNED_VARS",
              "const TRACKED_SELECTORS = Object.freeze(Object.keys(CRITICAL_SELECTOR_OWNERSHIP));\n\nconst JS_OWNED_VARS",
              s,
              count=1,
          )
          assert n == 1, f'TRACKED_SELECTORS replacement count={n}'
          p.write_text(s)

          # Architecture audit I-2: remove stale historical allowlist and reuse the same scanner+contract.
          p = Path('public/boutique/scripts/audit-boutique-arch.js')
          s = p.read_text()
          path_require = "const path = require('path');\n"
          imports = (
              "const { TRACKED_SELECTORS, selectorMap } = require('./gen-boutique-arch-live.js');\n"
              "const { evaluateSelectorOwnership } = require('./critical-selector-ownership.js');\n"
          )
          if "evaluateSelectorOwnership" not in s.split('// ═', 1)[0]:
              assert path_require in s
              s = s.replace(path_require, path_require + imports, 1)

          start = s.index('// I-2 : Ownership CSS. Format')
          end_marker = '// I-3 : Allowlist hex hors tokens.css. Justifier chaque exception.'
          end = s.index(end_marker)
          s = s[:start] + (
              "// I-2 : le contrat canonique vit dans critical-selector-ownership.js.\n"
              "// Le LIVE et cet audit consomment exactement la même cartographie.\n\n"
          ) + s[end:]

          fn_start = s.index('function checkI2_ownership() {')
          fn_end_marker = '// ════════════════════════════════════════════════════════════════\n// CHECK I-3'
          fn_end = s.index(fn_end_marker, fn_start)
          replacement = '''function checkI2_ownership() {\n  const result = evaluateSelectorOwnership(selectorMap(), TRACKED_SELECTORS);\n  for (const error of result.errors) {\n    violate('I-2', error.message,\n      'Mettre à jour le code dans l’owner existant ou modifier explicitement ' +\n      'scripts/critical-selector-ownership.js si la nouvelle responsabilité est volontaire.');\n  }\n}\n\n'''
          s = s[:fn_start] + replacement + s[fn_end:]
          p.write_text(s)

          # Normative architecture: identify the executable source of truth and preserve legacy .k-sec-grid coverage.
          p = Path('public/boutique/docs/BOUTIQUE_ARCHITECTURE.md')
          s = p.read_text()
          old = "Le principe n’est plus « un selector littéral dans un seul fichier à tout prix ». Le contrat est : **un owner sémantique principal + uniquement des adaptations contextuelles explicites**. Le LIVE signale les selectors multi-owner pour revue ; ils ne constituent pas une dette lorsqu’ils correspondent au tableau ci-dessous et que cascade/spécificité restent à zéro."
          new = old + "\n\nLa source exécutable unique de ce contrat est `scripts/critical-selector-ownership.js`. `gen-boutique-arch-live.js`, `check-selector-ownership.js` et l’invariant I-2 de `audit-boutique-arch.js` consomment ce même registre : aucune seconde allowlist d’owners n’est admise."
          if 'source exécutable unique de ce contrat' not in s:
              assert old in s
              s = s.replace(old, new, 1)
          grid_row = "| `.k-grid` | `products.css` | `cart.css` contexte panier, `layout.css` contrainte structurelle desktop |\n"
          sec_row = "| `.k-sec-grid` | `products.css` | `categories.css` pour le contexte des sections catégorie |\n"
          if sec_row not in s:
              assert grid_row in s
              s = s.replace(grid_row, grid_row + sec_row, 1)
          old_rule = "Toute nouvelle adaptation doit répondre aux trois conditions : contexte identifiable, propriété non concurrente avec une valeur différente, et owner/documentation explicites."
          new_rule = old_rule + " Le guard `node scripts/check-selector-ownership.js` bloque tout owner ou contexte media non déclaré et exige la présence de l’owner principal. Une réduction d’adaptation reste autorisée."
          if 'Le guard `node scripts/check-selector-ownership.js`' not in s:
              assert old_rule in s
              s = s.replace(old_rule, new_rule, 1)
          p.write_text(s)

          # Debt Zero ledger.
          p = Path('public/boutique/docs/BOUTIQUE_DEBT_ZERO_STATUS.md')
          s = p.read_text()
          old = '- [ ] B4-1 : transformer la cartographie des sélecteurs critiques multi-owner en contrat exécutable d\'owners/autorisations contextuelles.'
          new = "- [x] B4-1 sélecteurs critiques : remplacer l’ancienne allowlist I-2 historique par un registre machine-readable unique partagé par le LIVE, le guard dédié et l’audit architecture ; **15 sélecteurs contractés**, owner principal obligatoire, nouveaux owners/contextes base-desktop interdits, réduction d’adaptation autorisée ;\n- [ ] B4-2 : verrouiller de la même façon les producteurs des variables CSS runtime posées par JS."
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Install Boutique unit dependencies
        run: npm --prefix public/boutique ci

      - name: Prove selector ownership contract and detection
        shell: bash
        run: |
          node public/boutique/scripts/check-selector-ownership.js
          node public/boutique/scripts/audit-boutique-arch.js
          cd public/boutique
          npx jest tests/unit/critical-selector-ownership.test.js tests/unit/gen-boutique-arch-live-debt-metrics.test.js --runInBand

      - name: Regenerate LIVE from canonical contract
        run: node public/boutique/scripts/gen-boutique-arch-live.js

      - name: Re-prove after LIVE regeneration
        run: |
          node public/boutique/scripts/check-selector-ownership.js
          node public/boutique/scripts/audit-boutique-arch.js

      - name: Commit B4-1 consolidation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/boutique/scripts/critical-selector-ownership.js \
            public/boutique/scripts/check-selector-ownership.js \
            public/boutique/scripts/gen-boutique-arch-live.js \
            public/boutique/scripts/audit-boutique-arch.js \
            public/boutique/tests/unit/critical-selector-ownership.test.js \
            public/boutique/docs/BOUTIQUE_ARCHITECTURE.md \
            public/boutique/docs/BOUTIQUE_ARCHITECTURE_LIVE.md \
            public/boutique/docs/BOUTIQUE_DEBT_ZERO_STATUS.md
          if git diff --cached --quiet; then
            echo "B4-1 already committed"
            exit 0
          fi
          git commit -m "refactor(boutique): enforce critical selector ownership"
          git push origin HEAD:refactor/boutique-debt-zero-b4-selector-ownership
