name: Staging local offers BALEBA KOYAMBA demo
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: komerce-staging-local-offers-5245
  cancel-in-progress: false
jobs:
  stage-demo:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.user.login == github.repository_owner &&
        github.event.issue.title == '[staging-op] local-offers-5245-demo'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      MANUAL_DISCOVERY_WRITE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/recette/target-guard.js
      - run: node scripts/recette/local-offers-5245-showcase.js

  check-demo:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] local-offers-5245-demo-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/recette/target-guard.js
      - run: npx playwright install --with-deps chromium
      - run: node scripts/recette/local-offers-5245-chromium.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-offers-5245-demo
          path: test-results/local-offers-5245/
          if-no-files-found: warn
