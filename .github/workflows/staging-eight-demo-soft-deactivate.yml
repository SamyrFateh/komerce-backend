name: Staging eight SQL-demo soft deactivation
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: staging-eight-sql-demo-soft-deactivate
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.actor == github.repository_owner && github.event.issue.title == '[staging-op] sql-demo-soft-deactivate-eight'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      KOMERCE_DEMO_DEACTIVATION_CONFIRM: DISABLE_EXACT_KPR_000084_TO_000091
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Verify eight exact identities and dependencies (no writes)
        run: node scripts/recette/staging-demo-soft-deactivate.js --dry-run
      - name: Soft-disable through canonical catalogue owner in one atomic transaction
        run: node scripts/recette/staging-demo-soft-deactivate.js --apply
      - name: Independently verify current exact state
        run: node scripts/recette/staging-demo-soft-deactivate.js --dry-run
      - name: Archive before-after and blocked verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-eight-demo-soft-deactivation-${{ github.run_id }}
          path: test-results/staging-demo-cleanup/
          retention-days: 30
          if-no-files-found: warn
