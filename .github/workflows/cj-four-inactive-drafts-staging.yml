# Exactly four real CJ identities into inactive catalogue drafts. Never publish.
name: CJ four catalogue inactive drafts — guarded staging handoff
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-cj-four-inactive-drafts-staging
  cancel-in-progress: false
jobs:
  handoff:
    name: Four authentic CJ candidates to inactive drafts (no publication)
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] cj-four-inactive-drafts-approved'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_ACTIONS: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      CJ_FOUR_DRAFT_HANDOFF_APPROVED: '1'
      CJ_FOUR_READONLY_APPROVED: '1'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify official staging identity
        run: node scripts/recette/target-guard.js
      - name: Canonical bounded draft handoff
        run: node scripts/recette/cj-four-inactive-drafts-staging.js
      - name: Preserve exact product links and postconditions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-four-inactive-drafts-${{ github.run_id }}
          path: test-results/cj-four-inactive-drafts/report.json
          retention-days: 21
          if-no-files-found: warn
