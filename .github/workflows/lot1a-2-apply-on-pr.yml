name: LOT1A-2 apply FX on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/lot1a-2-usd-fx'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Apply exact patch
        run: python tools/lot1a-2-apply-fx.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Focused backend tests
        run: npx jest tests/unit/rates.test.js tests/unit/supplier-catalog-scanner.test.js --runInBand
      - name: Golden BEFORE == AFTER
        run: node tools/golden-cdr/golden-cdr.js verify
      - name: Commit result on branch
        run: |
          git add services/pricing-cdr.js services/supplier-catalog-scanner.js routes/admin-finance-config.js public/dashboards/admin/js/views/PricingView.js public/dashboards/tests/unit/PricingView.test.js public/tests/unit/PricingView.test.js tests/unit/supplier-catalog-scanner.test.js
          if git diff --cached --quiet; then echo "Patch already applied."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "LOT 1A-2 — branche les consommateurs sur la vérité FX CURRENT"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
