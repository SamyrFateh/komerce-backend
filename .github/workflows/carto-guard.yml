name: 🗺️ Carto Guard — Vérification coffre-fort v2.0

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  carto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Vérifier si des fichiers code ont changé
        id: code_changes
        run: |
          # La cartographie 360 décrit la topologie applicative, pas l'outillage de
          # gouvernance du dépôt ni les suites de tests. Un nouveau gate sous scripts/
          # ou un test sous public/**/tests/ ne doit donc pas forcer un faux delta
          # CARTOGRAPHY_360. package.json ne compte que si une surface runtime/topologique
          # change (entrypoint, start, deps, engine).
          APP_CHANGED=$(git diff --name-only origin/main...HEAD | grep -E '^(routes/|middleware/|utils/|validators/|db/|public/|dashboard-app/|server\.js|db\.js)' | grep -Ev '(^|/)tests?/' || true)
          PACKAGE_RUNTIME_CHANGED=$(git diff --unified=0 origin/main...HEAD -- package.json | grep -E '^[+-].*"(main|start|dependencies|engines)"' || true)
          CODE_CHANGED=$(printf '%s\n%s\n' "$APP_CHANGED" "$PACKAGE_RUNTIME_CHANGED" | sed '/^$/d')
          if [ -n "$CODE_CHANGED" ]; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
            echo "files<<ENDFILES" >> $GITHUB_OUTPUT
            echo "$CODE_CHANGED" >> $GITHUB_OUTPUT
            echo "ENDFILES" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 🗺️ Vérifier si la carto a été mise à jour
        id: carto_check
        if: steps.code_changes.outputs.code_changed == 'true'
        run: |
          CARTO_UPDATED=$(git diff --name-only origin/main...HEAD | grep -c 'docs/CARTOGRAPHY_360.md' || true)
          if [ "$CARTO_UPDATED" = "0" ]; then
            echo "carto_updated=false" >> $GITHUB_OUTPUT
          else
            echo "carto_updated=true" >> $GITHUB_OUTPUT
          fi

      - name: ⚠️ Commenter si la carto n'est pas mise à jour
        if: steps.code_changes.outputs.code_changed == 'true' && steps.carto_check.outputs.carto_updated == 'false'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ steps.code_changes.outputs.files }}`;
            const body = [
              '## ⚠️ Carto Guard — Coffre-Fort non mis à jour',
              '',
              'Cette PR modifie des fichiers code mais la **Cartographie 360°** n\'a pas été mise à jour.',
              '',
              '### 📁 Fichiers code modifiés :',
              '```',
              files,
              '```',
              '',
              '### ✅ Action requise (approche DELTA) :',
              '1. Ouvrir [`docs/CARTOGRAPHY_360.md`](../docs/CARTOGRAPHY_360.md)',
              '2. Mettre à jour **uniquement les lignes impactées** :',
              '   - SHA du fichier modifié dans l\'arbre',
              '   - Endpoints ajoutés/modifiés dans la section routes',
              '   - Tables/vues modifiées dans la section BDD',
              '3. Committer la mise à jour carto dans cette PR',
              '',
              '> 🔒 *Règle #9 : Pas de mise à jour carto → pas de merge.*',
              '> 📐 *Approche DELTA : ne modifier que ce qui a changé.*'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: ❌ Carto manquante
        if: steps.code_changes.outputs.code_changed == 'true' && steps.carto_check.outputs.carto_updated == 'false'
        run: |
          echo "Cette PR modifie du code sans mise à jour docs/CARTOGRAPHY_360.md."
          exit 1

      - name: ✅ Carto à jour
        if: steps.code_changes.outputs.code_changed == 'true' && steps.carto_check.outputs.carto_updated == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ✅ Carto Guard — Coffre-Fort mis à jour\n\nLa Cartographie 360° a été mise à jour dans cette PR. 🔒👍'
            });
