name: LOT1A-3 apply relay on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/lot1a-3-relay-commission'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Apply exact patch
        run: python tools/lot1a-3-apply-relay.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Relay proofs
        run: >-
          npx jest
          tests/unit/relay-commission.test.js
          tests/unit/relay-commission-allocation.test.js
          tests/unit/admin-finance-config-relay-retired.test.js
          tests/unit/admin-finance-config.test.js
          tests/unit/cost-allocation-allocate.test.js
          --runInBand
      - name: Golden BEFORE == AFTER
        run: node tools/golden-cdr/golden-cdr.js verify
      - name: Commit result on branch
        run: |
          git add services/cost-allocation/allocate.js routes/admin-finance-config.js
          if git diff --cached --quiet; then echo "Patch already applied."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "LOT 1A-3 — branche l’allocation sur la commission relais canonique"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
