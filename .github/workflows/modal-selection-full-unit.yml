name: Diagnose modal selection full unit suite

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  full-unit:
    if: github.head_ref == 'ops/modal-selection-full-unit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/modal-selection-full-unit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci --ignore-scripts
      - name: Run full Boutique unit suite and report failed assertions
        working-directory: public/boutique
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx jest tests/unit --runInBand --json --outputFile=/tmp/jest-results.json >/tmp/full-unit.log 2>&1
          status=$?
          set -e
          node - <<'NODE' > /tmp/full-unit-comment.md
          const fs = require('fs');
          const strip = (s = '') => String(s).replace(/\u001b\[[0-9;]*m/g, '');
          const r = JSON.parse(fs.readFileSync('/tmp/jest-results.json', 'utf8'));
          const lines = [];
          lines.push(`### Full Boutique unit suite: ${r.success ? 'PASS' : 'FAIL'}`);
          lines.push('');
          lines.push(`Suites: ${r.numPassedTestSuites}/${r.numTotalTestSuites} passed · Tests: ${r.numPassedTests}/${r.numTotalTests} passed`);
          const failures = [];
          for (const suite of r.testResults || []) {
            for (const assertion of suite.assertionResults || []) {
              if (assertion.status !== 'failed') continue;
              failures.push({
                suite: suite.name,
                name: assertion.fullName || assertion.title,
                message: (assertion.failureMessages || []).map(strip).join('\n\n'),
              });
            }
            if (suite.status === 'failed' && !(suite.assertionResults || []).some(a => a.status === 'failed') && suite.message) {
              failures.push({ suite: suite.name, name: 'suite failure', message: strip(suite.message) });
            }
          }
          if (failures.length) {
            lines.push('');
            failures.forEach((failure, index) => {
              lines.push(`#### ${index + 1}. ${failure.name}`);
              lines.push('');
              lines.push(`Suite: \`${failure.suite}\``);
              lines.push('');
              lines.push('```text');
              lines.push(failure.message.slice(0, 7000));
              lines.push('```');
            });
          }
          fs.writeFileSync('/tmp/full-unit-comment.md', lines.join('\n'));
          NODE
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/full-unit-comment.md
          exit "$status"
