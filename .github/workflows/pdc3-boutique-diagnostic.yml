name: PDC3 Boutique Diagnostic

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  boutique-diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique
        run: npm --prefix public/boutique ci --silent
      - name: Diagnose check fast
        id: diagnose
        continue-on-error: true
        run: |
          set +e
          npm --prefix public/boutique run check:fast > /tmp/pdc3-check-fast.log 2>&1
          code=$?
          tail -n 120 /tmp/pdc3-check-fast.log > /tmp/pdc3-check-fast-tail.log
          echo "$code" > /tmp/pdc3-check-fast-exit-code
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Comment diagnostic tail
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = fs.readFileSync('/tmp/pdc3-check-fast-tail.log', 'utf8');
            const code = fs.readFileSync('/tmp/pdc3-check-fast-exit-code', 'utf8').trim();
            const safeTail = tail.length > 60000 ? tail.slice(-60000) : tail;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## PDC-3 Boutique diagnostic\n\nExit code: **${code}**\n\n\`\`\`text\n${safeTail}\n\`\`\``
            });
      - name: Preserve diagnostic failure
        if: steps.diagnose.outputs.code != '0'
        run: exit 1
