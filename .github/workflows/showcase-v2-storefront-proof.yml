name: One-shot Showcase V2 storefront proof

on:
  push:
    branches:
      - ops/showcase-v2-run50
    paths:
      - '.github/workflows/showcase-v2-storefront-proof.yml'

permissions:
  contents: read

jobs:
  storefront-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://komerce.co/boutique/
      TARGET_SHA: 3a7b48cd40fd8f3badde8b69cc2866f94812e818
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a7b48cd40fd8f3badde8b69cc2866f94812e818

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Materialize read-only Showcase V2 storefront proof
        working-directory: public/boutique
        shell: bash
        run: |
          cat > tests/e2e/showcase-v2-storefront-proof.temp.spec.js <<'JS'
          /**
           * One-shot proof only — generated by ops workflow, never committed to main.
           * Reads public catalogue/PDC and exercises modal selection; no cart mutation.
           */
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const { test, expect } = require('@playwright/test');
          const { waitForGrid, waitForModalOpen } = require('./helpers/boutique.helpers');

          const SHOWCASE_RE = /^SHOWCASE-V2-\d{4}$/;

          function esc(value) {
            return String(value).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
          }

          function optionSelector(axisKey, value) {
            return `[data-axis-key="${esc(axisKey)}"] button[data-option-value="${esc(value)}"]`;
          }

          function kmfNumber(text) {
            const digits = String(text || '').replace(/[^0-9]/g, '');
            return digits ? Number(digits) : null;
          }

          async function fetchAllProducts(page) {
            return page.evaluate(async () => {
              const all = [];
              let offset = 0;
              let total = Infinity;
              const limit = 1000;
              while (offset < total) {
                const response = await fetch(`/api/products?limit=${limit}&offset=${offset}`, { credentials: 'include' });
                if (!response.ok) throw new Error(`GET /api/products HTTP ${response.status}`);
                const data = await response.json();
                const rows = Array.isArray(data.products) ? data.products : [];
                total = Number(data.total) || 0;
                all.push(...rows);
                if (!rows.length) break;
                offset += rows.length;
              }
              return all;
            });
          }

          async function fetchDetails(page, ids) {
            return page.evaluate(async (productIds) => Promise.all(productIds.map(async (id) => {
              const response = await fetch(`/api/products/${encodeURIComponent(id)}/detail`, { credentials: 'include' });
              if (!response.ok) return { id, detail: null, status: response.status };
              return { id, detail: await response.json(), status: response.status };
            })), ids);
          }

          function scenarioFor(detail) {
            if (!detail || detail.contract_version !== '1' || detail.inventory_model !== 'SKU') return null;
            if (!Array.isArray(detail.option_axes) || detail.option_axes.length !== 2) return null;
            if (!Array.isArray(detail.sellable_units) || !detail.sellable_units.length) return null;

            const [axisA, axisB] = detail.option_axes;
            const units = detail.sellable_units;
            const mediaIds = new Set((detail.media || []).map((m) => m.id));

            for (const a of axisA.values || []) {
              const aValue = a.value;
              const matching = units.filter((u) => u.option_values?.[axisA.key] === aValue);
              const available = matching.find((u) =>
                u.stock_status === 'AVAILABLE'
                && Number(u.available_quantity) > 0
                && Array.isArray(u.media_ids)
                && u.media_ids.length > 0
                && u.media_ids.every((id) => mediaIds.has(id))
              );
              const out = matching.find((u) => u.stock_status === 'OUT_OF_STOCK' || Number(u.available_quantity) === 0);
              const presentB = new Set(matching.map((u) => u.option_values?.[axisB.key]));
              const missing = (axisB.values || []).find((v) => !presentB.has(v.value));
              if (available && out && missing) {
                return { axisA, axisB, aValue, available, out, missingValue: missing.value };
              }
            }
            return null;
          }

          async function discoverShowcaseCandidate(page, showcaseProducts) {
            const batchSize = 20;
            for (let i = 0; i < showcaseProducts.length; i += batchSize) {
              const batch = showcaseProducts.slice(i, i + batchSize);
              const details = await fetchDetails(page, batch.map((p) => p.id));
              for (const result of details) {
                const scenario = scenarioFor(result.detail);
                if (!scenario) continue;
                const listProduct = batch.find((p) => p.id === result.id);
                return { listProduct, detail: result.detail, scenario };
              }
            }
            return null;
          }

          async function openBySearch(page, candidate) {
            const input = page.locator('#k-search-input');
            await expect(input).toBeVisible({ timeout: 8_000 });
            await input.fill(candidate.listProduct.name);
            const dropdown = page.locator('#k-search-dropdown');
            await expect(dropdown).toHaveClass(/open/, { timeout: 5_000 });
            const item = dropdown.locator(`.k-search-item[data-id="${esc(candidate.listProduct.id)}"]`);
            await expect(item, `SHOWCASE V2 absent de la recherche: ${candidate.listProduct.product_ref}`).toBeVisible({ timeout: 5_000 });
            await item.click();
            await waitForModalOpen(page);
          }

          async function assertSelectedMedia(page, detail, unit) {
            const expectedPaths = (detail.media || [])
              .filter((m) => (unit.media_ids || []).includes(m.id))
              .map((m) => new URL(m.url).pathname);
            expect(expectedPaths.length).toBeGreaterThan(0);

            await expect(page.locator('.k-modal-slide').first()).toBeVisible({ timeout: 8_000 });
            const actualPaths = await page.locator('.k-modal-slide').evaluateAll((imgs) => imgs.map((img) => {
              try { return new URL(img.src).pathname; } catch (_) { return img.src; }
            }));
            expect(actualPaths.some((actual) => expectedPaths.some((expected) => actual === expected))).toBe(true);
          }

          async function assertAvailableStock(page, unit, isMobile) {
            const qty = Number(unit.available_quantity);
            expect(qty).toBeGreaterThan(0);

            if (isMobile) {
              const pill = page.locator('#k-modal-stock-pill');
              await expect(pill).toBeVisible({ timeout: 5_000 });
              const label = pill.locator('.k-mdm-stock-pill-label');
              if (qty <= 5) {
                await expect(label).toHaveText(`Plus que ${qty}`);
                await expect(pill).toHaveClass(/k-mdm-stock-pill--low/);
              } else {
                await expect(label).toHaveText('En stock');
                await expect(pill).toHaveClass(/k-mdm-stock-pill--ok/);
              }
              return;
            }

            const stock = page.locator('#k-modal-stock');
            await expect(stock).toBeVisible({ timeout: 5_000 });
            await expect(stock).toContainText(String(qty));
            await expect(stock).toContainText(/en stock/i);
          }

          test('Showcase V2 — catalogue → PDC → modal SKU/media/stock/prix', async ({ page }, testInfo) => {
            await page.goto(process.env.BASE_URL, { waitUntil: 'domcontentloaded' });
            await waitForGrid(page);

            const allProducts = await fetchAllProducts(page);
            const showcaseProducts = allProducts.filter((p) => SHOWCASE_RE.test(String(p.product_ref || '')));
            expect(showcaseProducts, 'le catalogue public doit exposer exactement les 500 Showcase V2 actifs').toHaveLength(500);

            const candidate = await discoverShowcaseCandidate(page, showcaseProducts);
            expect(candidate, 'aucun SHOWCASE-V2 riche ne cumule AVAILABLE + OOS + combinaison absente + média SKU').not.toBeNull();

            expect(candidate.detail.product.reference).toBe(candidate.listProduct.product_ref);
            expect(candidate.detail.media.length).toBeGreaterThan(0);
            expect(candidate.detail.sellable_units.length).toBeGreaterThan(0);

            await openBySearch(page, candidate);

            const isMobile = testInfo.project.name === 'Mobile Chrome';
            await expect(page.locator(isMobile ? '[data-pdc4-root="1"]' : '[data-pdc5-root="1"]')).toBeVisible({ timeout: 8_000 });
            await expect(page.locator('#k-modal-name')).toHaveText(candidate.detail.product.name);
            await expect(page.locator('#k-add-cart-btn')).toBeDisabled();

            const { axisA, axisB, aValue, available, out, missingValue } = candidate.scenario;
            await page.locator(optionSelector(axisA.key, aValue)).click();
            await expect(page.locator(optionSelector(axisA.key, aValue))).toHaveAttribute('aria-pressed', 'true');

            const availableB = available.option_values[axisB.key];
            const outB = out.option_values[axisB.key];
            await expect(page.locator(optionSelector(axisB.key, availableB))).toHaveAttribute('data-option-state', 'AVAILABLE');
            await expect(page.locator(optionSelector(axisB.key, outB))).toHaveAttribute('data-option-state', 'OUT_OF_STOCK');
            await expect(page.locator(optionSelector(axisB.key, missingValue))).toHaveAttribute('data-option-state', 'INCOMPATIBLE');

            await page.locator(optionSelector(axisB.key, availableB)).click();
            await expect(page.locator('#k-add-cart-btn')).toBeEnabled();
            await assertAvailableStock(page, available, isMobile);
            if (available.sku) await expect(page.locator('#k-modal-sku')).toContainText(available.sku);
            const expectedPrice = available.price_kmf ?? candidate.detail.pricing.price_kmf;
            if (expectedPrice != null) {
              await expect.poll(async () => kmfNumber(await page.locator('#k-modal-price').textContent())).toBe(expectedPrice);
            }
            await assertSelectedMedia(page, candidate.detail, available);

            await page.locator(optionSelector(axisB.key, outB)).click();
            await expect(page.locator('#k-add-cart-btn')).toBeDisabled();
            await expect(page.locator('#k-modal-selection-message')).toContainText(/rupture/i);

            await page.locator(optionSelector(axisB.key, missingValue)).click();
            await expect(page.locator('#k-add-cart-btn')).toBeDisabled();
            await expect(page.locator('#k-modal-selection-message')).toContainText(/non propos|combinaison/i);

            await page.locator(optionSelector(axisB.key, availableB)).click();
            await expect(page.locator('#k-add-cart-btn')).toBeEnabled();

            fs.mkdirSync('test-results', { recursive: true });
            const slug = testInfo.project.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            const evidence = {
              target_sha: process.env.TARGET_SHA,
              base_url: process.env.BASE_URL,
              project: testInfo.project.name,
              showcase_count: showcaseProducts.length,
              product_ref: candidate.listProduct.product_ref,
              product_id: candidate.listProduct.id,
              category: candidate.detail.product.category,
              subcategory: candidate.detail.product.subcategory,
              axes: candidate.detail.option_axes.map((axis) => axis.key),
              sellable_units: candidate.detail.sellable_units.length,
              media: candidate.detail.media.length,
              selected_sku: available.sku,
              selected_price_kmf: expectedPrice,
              selected_stock: available.available_quantity,
              out_of_stock_sku: out.sku,
              incompatible_combo: { [axisA.key]: aValue, [axisB.key]: missingValue },
              status: 'PASS'
            };
            fs.writeFileSync(path.join('test-results', `showcase-v2-storefront-${slug}.json`), JSON.stringify(evidence, null, 2));
            await page.screenshot({
              path: path.join('test-results', `showcase-v2-storefront-${slug}.png`),
              fullPage: false,
            });
          });
          JS

      - name: Run real Mobile + Desktop storefront proof
        working-directory: public/boutique
        env:
          CI: '1'
        run: |
          npx playwright test tests/e2e/showcase-v2-storefront-proof.temp.spec.js \
            --project='Desktop Chrome' \
            --project='Mobile Chrome' \
            --workers=1 \
            --retries=0

      - name: Upload storefront proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-v2-storefront-proof
          path: |
            public/boutique/test-results/**/*.json
            public/boutique/test-results/**/*.png
            public/boutique/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14
