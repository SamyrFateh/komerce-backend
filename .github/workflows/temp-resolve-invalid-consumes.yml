name: Temporary invalid consumes cleanup

on:
  push:
    branches:
      - governance/resolve-invalid-consumes

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/resolve-invalid-consumes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply canonical consumes cleanup
        run: node scripts/temp-resolve-invalid-consumes.js
      - name: Remove temporary tooling before canonical generation
        run: rm .github/workflows/temp-resolve-invalid-consumes.yml scripts/temp-resolve-invalid-consumes.js
      - name: Refresh canonical governance projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Verify zero invalid declarations
        shell: bash
        run: |
          npm run business-graph:check
          node scripts/business-graph-ratchet-check.js
          npm run feature:360:check
          node scripts/feature-guard.js --strict
          node - <<'NODE'
          const m=require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const s=require('./governance/business-graph-warning-semantics.js');
          const invalid=m.drifts.debt.filter(w=>s.classify(w,{ROOT:process.cwd()}).category==='INVALID_DECLARATION');
          if (invalid.length) throw new Error(`INVALID_DECLARATION remaining: ${JSON.stringify(invalid)}`);
          if (m.drifts.summary.debt !== 93) throw new Error(`expected debt=93, got ${m.drifts.summary.debt}`);
          if (m.drifts.summary.signals !== 113) throw new Error(`expected signals=113, got ${m.drifts.summary.signals}`);
          if (m.drifts.summary.expectedTopology !== 12 || m.drifts.summary.generatorLimitations !== 8) throw new Error('non-debt semantic counts changed unexpectedly');
          console.log(m.drifts.summary);
          NODE
          git diff --check
      - name: Commit final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): canonicalize feature consumes"
          git push origin HEAD:governance/resolve-invalid-consumes
