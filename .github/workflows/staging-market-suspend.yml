name: Staging — suspendre CM/CG/YT via la route lifecycle canonique

# Dry-run par defaut. Ecriture : POST /api/admin/markets/:code/lifecycle {status:SUSPENDED} (compte E2E admin),
# uniquement CM, CG, YT. KM et DJ ne sont jamais touches. Trace : market_delegation_audit (MARKET_LIFECYCLE_CHANGED).

on:
  workflow_dispatch:
    inputs:
      markets:
        description: 'Marches a suspendre (sous-ensemble de CM,CG,YT)'
        required: false
        default: 'CM,CG,YT'
      confirmation:
        description: 'Ecriture uniquement : saisir exactement SUSPEND-CM-CG-YT'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: komerce-staging-market-suspend
  cancel-in-progress: false

jobs:
  suspend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      SUSPEND_MARKETS: ${{ inputs.markets }}
      SUSPEND_CONFIRMATION: ${{ inputs.confirmation }}
      SUSPEND_APPLY: ${{ inputs.confirmation != '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Suspension (dry-run sauf confirmation exacte)
        run: node scripts/recette/staging-market-suspend.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-market-suspend-${{ github.run_id }}
          path: test-results/market-suspend/report.json
          if-no-files-found: warn
