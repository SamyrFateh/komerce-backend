name: Generate Komerce Architecture Graph

on:
  workflow_dispatch:
  push:
    paths:
      - 'server.js'
      - 'bootstrap/**/*.js'
      - 'routes/**/*.js'
      - 'services/**/*.js'
      - 'middleware/**/*.js'
      - 'utils/**/*.js'
      - 'public/boutique/js/**/*.js'
      - 'scripts/generate-komerce-arch-graph.js'

permissions:
  contents: write

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate architecture graph
        run: node scripts/generate-komerce-arch-graph.js

      - name: Commit architecture graph
        run: |
          if git diff --quiet; then
            echo "No architecture graph changes to commit."
            exit 0
          fi
          git config user.name "komerce-arch-bot"
          git config user.email "komerce-arch-bot@users.noreply.github.com"
          git add docs/KOMERCE_ARCH_HEADER_GRAPH.md docs/komerce-arch-header-graph.json
          git commit -m "Generate Komerce architecture header graph"
          git push
