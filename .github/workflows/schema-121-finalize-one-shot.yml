name: One-shot finalize Railway 121 schema truth

on:
  push:
    branches: [fix/schema-121-finalize]
    paths:
      - 'scripts/schema-121-finalize-patch.py'
      - '.github/workflows/schema-121-finalize-one-shot.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts

      - name: Apply deterministic schema truth patch
        run: python3 scripts/schema-121-finalize-patch.py

      - name: Prove pending truth against committed dump
        run: |
          node scripts/schema-promote-all.js --check
          npm run arch:gate
          npm run feature:registry
          npm run gate:schema
          npm run gate:docs-lint
          git diff --check

      - name: Publish SCHEMA.md only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SCHEMA.md
          git commit -m 'fix(schema): stage Railway 121 grant truth'
          git push origin HEAD:fix/schema-121-finalize
