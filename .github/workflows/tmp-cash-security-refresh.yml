name: tmp-cash-security-refresh

on:
  push:
    branches:
      - feat/market-cash-control

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-cash-control
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regenerate Security 360 from canonical routes
        run: npm run security:360
      - name: Commit only Security 360 projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SECURITY_360.json docs/SECURITY_360.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(security): régénérer Security 360 pour cash control"
          git push origin HEAD:feat/market-cash-control
