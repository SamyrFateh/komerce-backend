name: Benchmark hook tier 5 related tests once

on:
  push:
    paths:
      - '.github/workflows/hook-tier5-benchmark-once.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root and Boutique deps
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix public/boutique
      - name: Benchmark Jest related tests
        shell: bash
        run: |
          set -uo pipefail
          bench() {
            local label="$1"
            shift
            local start end rc
            start=$(node -e 'process.stdout.write(String(Date.now()))')
            set +e
            "$@" >/tmp/tier5.out 2>&1
            rc=$?
            set -e
            end=$(node -e 'process.stdout.write(String(Date.now()))')
            echo "TIER5_RESULT label=$label rc=$rc total_ms=$((end-start))"
            tail -30 /tmp/tier5.out
            echo
          }

          bench backend-related ./node_modules/.bin/jest --config jest.unit.config.js --findRelatedTests services/suppliers/normalized-product.js --runInBand --passWithNoTests
          cd public/boutique
          bench boutique-related ./node_modules/.bin/jest --findRelatedTests js/b-cart.js --runInBand --passWithNoTests
