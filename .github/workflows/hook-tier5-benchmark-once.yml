name: Validate hook tier 5 once

on:
  push:
    paths:
      - '.github/workflows/hook-tier5-benchmark-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root and Boutique deps
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix public/boutique
      - name: Unit-proof resolver semantics
        run: npx jest tests/unit/run-staged-related-tests.test.js --runInBand
      - name: Install current Komerce hook
        run: bash scripts/setup-hooks.sh
      - name: Validate full hook on representative staged commits
        shell: bash
        run: |
          set -uo pipefail

          simulate() {
            local label="$1"
            local file="$2"
            local marker="$3"
            local start end rc

            git reset --hard HEAD >/dev/null
            printf '\n%s\n' "$marker" >> "$file"
            git add "$file"

            echo "===== resolver $label ====="
            node scripts/run-staged-related-tests.js

            start=$(node -e 'process.stdout.write(String(Date.now()))')
            set +e
            .git/hooks/pre-commit >/tmp/tier5-hook.out 2>&1
            rc=$?
            set -e
            end=$(node -e 'process.stdout.write(String(Date.now()))')

            echo "===== hook $label ====="
            cat /tmp/tier5-hook.out
            echo "TIER5_HOOK_RESULT label=$label rc=$rc total_ms=$((end-start))"
            test "$rc" -eq 0
            echo
          }

          simulate backend-source services/suppliers/normalized-product.js '// tier5 hook validation'
          simulate boutique-source public/boutique/js/b-cart.js '// tier5 hook validation'
          simulate root-test tests/unit/run-staged-related-tests.test.js '// tier5 hook validation'

          git reset --hard HEAD >/dev/null
