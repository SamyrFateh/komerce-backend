name: Debt Zero simulator feature sync

on:
  push:
    branches:
      - fix/debt-zero-simulator-ownership

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-zero-simulator-ownership
          fetch-depth: 0
      - name: Sync Feature First contracts
        run: |
          node <<'NODE'
          const fs = require('fs');

          {
            const file = 'features/orders.feature.js';
            let src = fs.readFileSync(file, 'utf8');
            const anchor = "      { fn: 'markFailed', file: 'services/payment-service.js' },";
            if (!src.includes(anchor)) throw new Error('orders internalApi anchor missing');
            if (!src.includes("forcePaymentStatusForSimulation")) {
              src = src.replace(anchor, anchor + "\n      // Non-production uniquement : chaos-test explicite, écriture conservée chez l'owner payment.\n      { fn: 'forcePaymentStatusForSimulation', file: 'services/payment-service.js' },");
            }
            fs.writeFileSync(file, src);
          }

          {
            const file = 'features/platform-ops.feature.js';
            let src = fs.readFileSync(file, 'utf8');
            src = src.replace(
              "      'orders: RW~',  // technical-writer (campagne WRITER-NOT-OWNER, 2026-08) — écriture directe limitée à services/simulator/state-advancer.js (payment_status en chaos ; les transitions de statut réelles passent par transitionOrderStatus(), déjà déclaré via contract.consumes) ; propriétaire réel : orders",
              "      'orders: R',  // mutations déléguées à order-status-machine/payment-service ; aucun write SQL direct depuis platform-ops"
            );
            src = src.replace(/^\s*'store_credits: W',\r?\n/m, '');
            src = src.replace(
              "      'orders (simulateur declenche une transition commande via transitionOrderStatus — services/order-status-machine.js, O7.1 OWNERSHIP_CONFIRMED_BOUNDARY_REQUIRED, boundary formalisee O7.3)',",
              "      'orders (simulateur délègue statuts commande/paiement à order-status-machine + payment-service ; le chaos payment reste non-production et owner-bound)',\n      'wallet (simulateur crédite les remboursements via wallet-service.credit ; aucun store_credits legacy direct)',"
            );
            fs.writeFileSync(file, src);
          }
          NODE
      - name: Remove temporary workflow and commit sync
        run: |
          rm .github/workflows/debt-zero-simulator-feature-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/orders.feature.js features/platform-ops.feature.js .github/workflows/debt-zero-simulator-feature-sync.yml
          git diff --cached --check
          git commit -m "chore(governance): align simulator Feature First boundaries"
          git push origin HEAD:fix/debt-zero-simulator-ownership
