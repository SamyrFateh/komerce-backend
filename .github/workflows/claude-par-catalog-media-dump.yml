name: Claude PAR — lister les médias des produits catalogue CLAUDE-PAR (lecture seule)

# Lecture seule : urls publiques fournisseur des seuls produits listés dans catalog-targets.json.
on:
  push:
    branches: [cert/claude-par-catalog]
    paths:
      - '.github/workflows/claude-par-catalog-media-dump.yml'
      - 'scripts/recette/claude-par/catalog-media-dump.js'
      - 'scripts/recette/claude-par/catalog-targets.json'

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier la cible staging
        run: node scripts/recette/target-guard.js
      - name: Lister les médias
        run: node scripts/recette/claude-par/catalog-media-dump.js
