name: Debt Zero remediation refresh

on:
  push:
    branches:
      - fix/debt-zero-simulator-ownership

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-zero-simulator-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regenerate remediation index from canonical sources
        run: npm run agent:remediation:gen
      - name: Commit projection and remove temporary workflow
        run: |
          rm .github/workflows/debt-zero-refresh-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AGENT_REMEDIATION_INDEX.json .github/workflows/debt-zero-refresh-remediation.yml
          git diff --cached --check
          git commit -m "docs(governance): refresh remediation index after simulator debt repayment"
          git push origin HEAD:fix/debt-zero-simulator-ownership
