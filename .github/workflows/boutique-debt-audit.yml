name: Boutique Debt Audit

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b1c-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b1c-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependency tree
        run: npm --prefix public/boutique ci
      - name: Apply safe npm advisory fixes
        run: npm --prefix public/boutique audit fix
      - name: Prove full npm audit is clean
        run: npm --prefix public/boutique audit --audit-level=low
      - name: Prove Komerce high-critical gate is clean
        run: node public/boutique/scripts/audit-gate.js --strict
      - name: Commit lockfile-only security remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/package-lock.json public/boutique/package.json
          if git diff --cached --quiet; then
            echo "No dependency metadata changes required"
            exit 0
          fi
          git commit -m "fix(boutique): remediate npm audit findings"
          git push origin HEAD:refactor/boutique-debt-zero-b1c-audit
