name: Boutique Debt Audit

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b1c-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b1c-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependency tree
        run: npm --prefix public/boutique ci
      - name: Full npm advisory report
        run: npm --prefix public/boutique audit --json || true
      - name: Komerce high-critical audit gate
        run: node public/boutique/scripts/audit-gate.js --strict
