name: One-off contract debt zero

on:
  push:
    branches:
      - fix/contract-unknown-zero

permissions:
  contents: write

jobs:
  close-contract-debt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ci-dummy:ci-dummy@localhost:5432/ci-dummy
      ADMIN_PASSWORD: ci-dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-dummy
      JWT_SECRET: ci-dummy
      SESSION_SECRET: ci-dummy
      INTERNAL_API_KEY: ci-dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      JWT_EXPIRES: 7d
      APP_URL: http://localhost
      PUBLIC_URL: http://localhost
      PUBLIC_BASE_URL: http://localhost
      ADMIN_RESET_KEY: ci-dummy
      INVOICE_PUBLIC_LINK_SECRET: ci-dummy
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_TOKEN: ci-dummy
      META_WA_PHONE_NUMBER_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contract-unknown-zero
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply proven response migration
        run: |
          node scripts/contract-zero-migrate-once.js
          node scripts/contract-zero-finalize-once.js
      - name: Refresh route ownership and contract
        run: |
          node scripts/gen-route-registry.js
          npm run contract:generate
      - name: Prove zero UNKNOWN and response fidelity
        run: |
          node scripts/contract-check.js
          node <<'NODE'
          const fs = require('fs');
          const api = JSON.parse(fs.readFileSync('docs/contract/openapi.json', 'utf8'));
          const unknown = api['x-contract-debt']?.unknown_responses;
          if (unknown !== 0) throw new Error(`Expected 0 UNKNOWN, got ${unknown}`);
          const download = api.paths?.['/api/auth/me/documents/{id}/download']?.get?.responses?.['200']?.content;
          if (!download?.['application/pdf']) throw new Error('Document download must be application/pdf');
          const inquiry = api.paths?.['/api/providers-services/inquiries']?.post?.responses;
          if (!inquiry?.['201'] || inquiry?.['200']) throw new Error('Provider inquiry success must be 201 only');
          const scopes = api.paths?.['/api/admin/users/{id}/market-scopes']?.post?.responses;
          if (!scopes?.['200'] || !scopes?.['201']) throw new Error('Market-scope upsert must document 200 and 201');
          const owner = api.paths?.['/api/admin/users/{id}/market-scopes']?.get?.['x-route-file'];
          if (owner !== 'routes/admin/users.js') throw new Error(`Wrong market-scope route owner: ${owner}`);
          const debt = fs.readFileSync('docs/contract/DEBT.md', 'utf8');
          if (!debt.includes('Réponses 200 `UNKNOWN` : **0**')) throw new Error('DEBT.md does not prove zero UNKNOWN');
          console.log('✅ 518 runtime routes: 0 UNKNOWN; PDF, 201 and route ownership fidelity proven.');
          NODE
      - name: Commit generated contract zero state
        run: |
          git config user.name "komerce-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/contract-generate.js package.json docs/_generated/route-registry.json docs/contract/openapi.json docs/contract/DEBT.md
          git commit -m "fix(contract): close all historical UNKNOWN responses"
          git push origin HEAD:fix/contract-unknown-zero
