name: Materialize header first impact engine

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transport-rail-doctrine-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch impact engine and materialize blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/impact-check.js')
          s = p.read_text()
          marker = "// ── Analyse d'impact en cascade ──────────────────────────────"
          helper = r'''function readServiceHeaderImpact(filePath) {
            try {
              const src = fs.readFileSync(filePath, 'utf8');
              const header = src.slice(0, 5000);
              const read = header.match(/@db-read\s+([^\n\r*]+)/);
              const write = header.match(/@db-write\s+([^\n\r*]+)/);
              const usedBy = header.match(/@used-by\s+([^\n\r*]+)/);
              const hasArchImpact = Boolean(read || write || usedBy);
              if (!hasArchImpact) return null;

              const tables = new Set();
              for (const match of [read, write]) {
                if (!match) continue;
                match[1].split(',').map(x => x.trim()).filter(x => x && x !== 'none')
                  .forEach(x => tables.add(x));
              }

              const routes = new Set();
              if (usedBy) {
                usedBy[1].split(',').map(x => x.trim()).filter(Boolean)
                  .filter(x => x.startsWith('routes/'))
                  .forEach(x => routes.add(x));
              }

              return { tables: [...tables], routes: [...routes] };
            } catch {
              return null;
            }
          }

'''
          if helper not in s:
              s = s.replace(marker, helper + marker)
          old = r'''      case 'service': {
                // Résolution via l'index manifest : file → feature → routes exposées + tables
                const manifest = MANIFEST_INDEX.get(file);
                if (manifest) {
                  manifest.routes.forEach(r => impact.routes.add(r));
                  manifest.tables.forEach(t => impact.tables.add(t));
                }
                // Fallback : chercher dans impact-config.json services si déclaré
                const svcConfig = (CONFIG.architecture.services || {})[name];
                if (svcConfig) {
                  (svcConfig.tables  || []).forEach(t => impact.tables.add(t));
                  (svcConfig.services|| []).forEach(s => impact.services.add(s));
                  if (svcConfig.critical) impact.criticalFiles.push(file);
                }
                break;
              }'''
          new = r'''      case 'service': {
                // Priorité au header @komerce-arch du fichier : il décrit l'impact réel
                // du service. Le manifest feature reste un fallback pour le legacy sans
                // métadonnées fines ; on n'attribue plus 100% d'une feature à chaque service.
                const headerImpact = readServiceHeaderImpact(file);
                if (headerImpact) {
                  headerImpact.routes.forEach(r => impact.routes.add(r));
                  headerImpact.tables.forEach(t => impact.tables.add(t));
                } else {
                  const manifest = MANIFEST_INDEX.get(file);
                  if (manifest) {
                    manifest.routes.forEach(r => impact.routes.add(r));
                    manifest.tables.forEach(t => impact.tables.add(t));
                  }
                }
                // Fallback/config complémentaire : services explicitement déclarés.
                const svcConfig = (CONFIG.architecture.services || {})[name];
                if (svcConfig) {
                  (svcConfig.tables  || []).forEach(t => impact.tables.add(t));
                  (svcConfig.services|| []).forEach(s => impact.services.add(s));
                  if (svcConfig.critical) impact.criticalFiles.push(file);
                }
                break;
              }'''
          if old not in s:
              raise SystemExit('service case marker not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          node scripts/impact-check.js --files=services/transport-rails.js --json > impact-smoke.json
          git rev-parse 'HEAD^{tree}' > base-tree-sha.txt
          python - <<'PY' > blob-payload.json
          import base64, json
          raw = open('scripts/impact-check.js', 'rb').read()
          print(json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input blob-payload.json --jq .sha > impact-blob-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: impact-header-first-blob
          path: |
            base-tree-sha.txt
            impact-blob-sha.txt
            impact-smoke.json
          if-no-files-found: error
