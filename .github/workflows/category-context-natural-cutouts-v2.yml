name: Category Context Natural Cutouts V2

on:
  push:
    branches:
      - feat/desktop-category-context-v2
    paths:
      - .github/workflows/category-context-natural-cutouts-v2.yml

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-category-context-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Apply natural cutout contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          dpath = Path('public/boutique/css/category-cutout-navigation-desktop.css')
          lpath = Path('public/boutique/css/boutique-desktop.css')
          tpath = Path('public/boutique/tests/unit/category-cutout-navigation.test.js')
          d = dpath.read_text()
          l = lpath.read_text()
          t = tpath.read_text()

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing {label}')
              return text.replace(old, new, 1)

          d = once(d,
            "    --k-sub-active-y: -1px;\n    --k-sub-active-scale: 1.03;\n    min-width: 72px;\n    min-height: 60px;",
            "    --k-sub-active-y: -2px;\n    --k-sub-active-scale: 1.035;\n    min-width: 104px;\n    min-height: 88px;",
            'subcategory geometry')
          d = once(d,
            "  .k-subcutout-icon {\n    position: relative;\n    width: 48px;\n    height: 42px;\n    font-size: 22px;\n  }",
            "  .k-subcutout-icon {\n    position: relative;\n    width: 76px;\n    height: 68px;\n    font-size: 24px;\n  }",
            'subcategory icon')
          d = once(d,
            "    bottom: 2px;\n    width: 34px;\n    height: 10px;\n    border-radius: 50%;\n    background: var(--sand-warm);\n    opacity: .16;\n    filter: blur(4px);",
            "    bottom: 3px;\n    width: 48px;\n    height: 12px;\n    border-radius: 50%;\n    background: var(--sand-warm);\n    opacity: .12;\n    filter: blur(5px);",
            'subcategory halo')

          pattern = re.compile(r"  \.k-shelf-object--subcategory \{.*?\n  \}\n\n  \.k-subcutout:hover \.k-shelf-object--subcategory,\n  \.k-subcutout\.active \.k-shelf-object--subcategory \{.*?\n  \}", re.S)
          replacement = """  .k-shelf-object--subcategory {
    width: 72px;
    height: 64px;
    transform:
      translate(var(--k-sub-x), var(--k-sub-y))
      scale(var(--k-sub-scale));
    filter:
      drop-shadow(0 3px 5px var(--border-text-08))
      saturate(1.02)
      contrast(1.04);
  }

  .k-subcutout:hover .k-shelf-object--subcategory,
  .k-subcutout.active .k-shelf-object--subcategory {
    transform:
      translate(var(--k-sub-x), var(--k-sub-active-y))
      scale(var(--k-sub-active-scale));
    filter:
      drop-shadow(0 4px 7px var(--border-text-08))
      saturate(1.06)
      contrast(1.06);
  }"""
          d, n = pattern.subn(replacement, d, count=1)
          if n != 1:
              raise SystemExit('missing natural filter block')

          d = once(d,
            "    font-size: 21px;\n    line-height: 40px;\n    opacity: .9;\n    filter: grayscale(1) sepia(.58) hue-rotate(62deg) saturate(1.55) contrast(1.16) brightness(.74);",
            "    font-size: 24px;\n    line-height: 64px;\n    opacity: .92;\n    filter: drop-shadow(0 2px 3px var(--border-text-08));",
            'fallback natural color')
          d = once(d,
            "  html.k-home-premium-v1 .k-subcutout-rail {\n    min-width: 0;\n    gap: 14px;\n  }",
            "  html.k-home-premium-v1 .k-subcutout-rail {\n    min-width: 0;\n    gap: 18px;\n  }",
            'premium rail gap')
          d = once(d,
            "    color: currentColor;\n    font-size: 10.5px;\n    line-height: 1.15;",
            "    color: currentColor;\n    font-size: 11.5px;\n    line-height: 1.15;",
            'base label size')
          d = once(d,
            "  .k-subcutout-label {\n    font-size: 11px;\n    font-weight: 630;\n  }",
            "  .k-subcutout-label {\n    font-size: 11.5px;\n    font-weight: 630;\n  }",
            'final label size')

          l = once(l,
            "    font-family: var(--font);\n    font-size: 13px;\n    font-weight: 750;\n    color: var(--text);",
            "    font-family: var(--font);\n    font-size: 14px;\n    font-weight: 780;\n    color: var(--text);",
            'runtime title size')
          l = once(l,
            "  #k-subcats-wrap .k-subcats-rail {\n    display: flex;\n    align-items: center;\n    justify-content: flex-start;\n    flex-wrap: nowrap;\n    gap: 6px;",
            "  #k-subcats-wrap .k-subcats-rail {\n    display: flex;\n    align-items: flex-start;\n    justify-content: flex-start;\n    flex-wrap: nowrap;\n    gap: 18px;",
            'runtime rail gap')

          t = t.replace('width:\\s*48px[^}]*height:\\s*42px', 'width:\\s*76px[^}]*height:\\s*68px')
          t = t.replace('min-width:\\s*72px[^}]*min-height:\\s*60px', 'min-width:\\s*104px[^}]*min-height:\\s*88px')
          t = t.replace('font-size:\\s*11px/s);', 'font-size:\\s*11\\.5px/s);')

          marker = "  it('garde les nouveaux skins hors des selectors ownership historiques', () => {"
          if "préserve les couleurs naturelles" not in t:
              natural = """  it('préserve les couleurs naturelles des détourages de sous-catégorie', () => {
    expect(desktop).toMatch(/\\.k-shelf-object--subcategory\\s*\\{[^}]*width:\\s*72px[^}]*height:\\s*64px/s);
    expect(desktop).toContain('saturate(1.02)');
    expect(desktop).not.toContain('grayscale(1)');
    expect(desktop).not.toContain('sepia(.58)');
    expect(desktop).not.toContain('hue-rotate(62deg)');
    expect(desktopLegacy).toMatch(/#k-subcats-wrap \\.k-subcats-title\\s*\\{[^}]*font-size:\\s*14px/s);
    expect(desktopLegacy).toMatch(/#k-subcats-wrap \\.k-subcats-rail\\s*\\{[^}]*gap:\\s*18px/s);
  });

"""
              if marker not in t:
                  raise SystemExit('missing test marker')
              t = t.replace(marker, natural + marker, 1)

          dpath.write_text(d)
          lpath.write_text(l)
          tpath.write_text(t)
          PY

      - name: Install Boutique
        run: npm --prefix public/boutique ci

      - name: Build and validate scoped Boutique contract
        run: |
          npm --prefix public/boutique run deploy:css
          cd public/boutique
          npx jest tests/unit/category-cutout-navigation.test.js --runInBand
          npm run check:important
          npm run check:css-guard
          npm run check:css-specificity-guard
          npm run check:css-dist-only
          npm run check:cache
          npm run audit:arch
          npm run audit:ownership

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Create Chromium audit spec
        shell: bash
        run: |
          cat > public/boutique/tests/e2e/category-context-natural-audit.spec.js <<'EOF'
          'use strict';
          const { test, expect } = require('@playwright/test');
          const fs = require('fs');
          const path = require('path');

          for (const vp of [
            { name: 'desktop-1280', width: 1280, height: 800 },
            { name: 'desktop-1440', width: 1440, height: 900 },
          ]) {
            test(`${vp.name} natural cutouts`, async ({ page }) => {
              await page.setViewportSize({ width: vp.width, height: vp.height });
              await page.addInitScript(() => { window.KOMERCE_FORCE_FALLBACK_CATEGORIES = true; });
              await page.route(/\/api\//, async route => {
                if (/\/api\/auth\/me/.test(route.request().url())) {
                  return route.fulfill({ status: 401, contentType: 'application/json', body: '{}' });
                }
                return route.fulfill({ status: 200, contentType: 'application/json', body: '[]' });
              });
              await page.goto('/boutique/index.html', { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(900);
              await page.evaluate(async () => {
                document.documentElement.classList.add('k-home-premium-v1');
                const { renderSubcatRail } = await import('/boutique/js/controllers/home-controller.js');
                renderSubcatRail('Mode & Beauté', { count: 383 });
              });
              await page.waitForSelector('#k-subcats-wrap .k-subcutout-context', { state: 'visible', timeout: 10000 });
              await page.waitForTimeout(300);

              const metrics = await page.evaluate(() => {
                const wrap = document.querySelector('#k-subcats-wrap');
                const title = wrap.querySelector('.k-subcutout-title');
                const rail = wrap.querySelector('.k-subcutout-rail');
                const object = wrap.querySelector('.k-shelf-object--subcategory');
                const items = [...wrap.querySelectorAll('.k-subcutout')];
                const css = el => getComputedStyle(el);
                const rect = el => el.getBoundingClientRect();
                return {
                  wrapHeight: rect(wrap).height,
                  titleFontSize: css(title).fontSize,
                  railGap: css(rail).gap,
                  objectWidth: rect(object).width,
                  objectHeight: rect(object).height,
                  objectFilter: css(object).filter,
                  itemCount: items.length,
                };
              });

              fs.mkdirSync(path.join(process.cwd(), 'visual-audit-natural'), { recursive: true });
              fs.writeFileSync(path.join(process.cwd(), 'visual-audit-natural', `${vp.name}.json`), JSON.stringify(metrics, null, 2));
              await page.locator('#k-subcats-wrap').screenshot({ path: `visual-audit-natural/${vp.name}-context.png` });
              await page.screenshot({ path: `visual-audit-natural/${vp.name}-viewport.png`, fullPage: false });

              expect(metrics.titleFontSize).toBe('14px');
              expect(metrics.railGap).toBe('18px');
              expect(metrics.objectWidth).toBeGreaterThanOrEqual(68);
              expect(metrics.objectHeight).toBeGreaterThanOrEqual(60);
              expect(metrics.objectFilter).not.toContain('grayscale');
              expect(metrics.objectFilter).not.toContain('sepia');
              expect(metrics.itemCount).toBe(5);
              expect(metrics.wrapHeight).toBeLessThanOrEqual(140);
            });
          }
          EOF

      - name: Run Chromium audit
        working-directory: public/boutique
        run: npx playwright test tests/e2e/category-context-natural-audit.spec.js --project='Desktop Chrome' --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-context-natural-cutouts-v2
          path: public/boutique/visual-audit-natural/
          retention-days: 7

      - name: Commit clean state
        if: success()
        shell: bash
        run: |
          rm -f public/boutique/tests/e2e/category-context-natural-audit.spec.js
          rm -f .github/workflows/category-context-natural-cutouts.yml
          rm -f .github/workflows/category-context-natural-cutouts-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(boutique): restore natural subcategory cutouts"
          git push origin HEAD:feat/desktop-category-context-v2
