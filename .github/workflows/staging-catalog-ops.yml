name: Staging catalog operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Opération catalogue staging autorisée'
        required: true
        type: choice
        default: aliexpress-draft-audit
        options:
          - aliexpress-refinery-rescan-dry-run
          - aliexpress-refinery-rescan
          - aliexpress-draft-audit
          - aliexpress-promote-drafts
          - aliexpress-soi-replay-dry-run
          - aliexpress-enrich-fr-dry-run
      limit:
        description: 'Nombre maximum de candidats/promotions pour ce run'
        required: false
        default: '100'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: komerce-staging-catalog-${{ github.event_name == 'workflow_dispatch' && inputs.operation || github.event.issue.title }}
  cancel-in-progress: false

jobs:
  catalog-ops:
    name: Catalog staging — bounded operation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       (github.event.issue.title == '[staging-op] aliexpress-refinery-rescan-dry-run' ||
        github.event.issue.title == '[staging-op] aliexpress-refinery-rescan' ||
        github.event.issue.title == '[staging-op] aliexpress-draft-audit' ||
        github.event.issue.title == '[staging-op] aliexpress-promote-drafts' ||
        github.event.issue.title == '[staging-op] aliexpress-soi-replay-dry-run' ||
        github.event.issue.title == '[staging-op] aliexpress-enrich-fr-dry-run'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}

    steps:
      - name: Resolve bounded operation
        id: operation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          DISPATCH_OPERATION: ${{ inputs.operation || '' }}
          DISPATCH_LIMIT: ${{ inputs.limit || '100' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            operation="$DISPATCH_OPERATION"
            limit="$DISPATCH_LIMIT"
          else
            limit='100'
            case "$ISSUE_TITLE" in
              '[staging-op] aliexpress-refinery-rescan-dry-run') operation='aliexpress-refinery-rescan-dry-run' ;;
              '[staging-op] aliexpress-refinery-rescan') operation='aliexpress-refinery-rescan' ;;
              '[staging-op] aliexpress-draft-audit') operation='aliexpress-draft-audit' ;;
              '[staging-op] aliexpress-promote-drafts') operation='aliexpress-promote-drafts' ;;
              '[staging-op] aliexpress-soi-replay-dry-run') operation='aliexpress-soi-replay-dry-run'; limit='500' ;;
              '[staging-op] aliexpress-enrich-fr-dry-run') operation='aliexpress-enrich-fr-dry-run'; limit='500' ;;
              *) echo '::error::Opération non autorisée'; exit 1 ;;
            esac
          fi

          case "$operation" in
            aliexpress-refinery-rescan-dry-run|aliexpress-refinery-rescan|aliexpress-draft-audit|aliexpress-promote-drafts|aliexpress-soi-replay-dry-run|aliexpress-enrich-fr-dry-run) ;;
            *) echo '::error::Opération non autorisée'; exit 1 ;;
          esac
          if ! [[ "$limit" =~ ^[0-9]+$ ]] || [ "$limit" -lt 1 ] || [ "$limit" -gt 500 ]; then
            echo '::error::limit doit être un entier 1..500'
            exit 1
          fi

          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"

      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Require staging database secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo '::error::RAILWAY_DATABASE_URL manque dans les secrets GitHub'
            exit 1
          fi

      - name: Dry-run AliExpress refinery rescan
        id: rescan_dry_run
        if: steps.operation.outputs.operation == 'aliexpress-refinery-rescan-dry-run'
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 1200s node scripts/aliexpress-refinery-rescan-staging.js --dry-run --limit=${{ steps.operation.outputs.limit }})"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-7000)"
          echo "summary=$compact" >> "$GITHUB_OUTPUT"

      - name: Execute AliExpress refinery rescan
        id: rescan
        if: steps.operation.outputs.operation == 'aliexpress-refinery-rescan'
        shell: bash
        env:
          KOMERCE_ALLOW_ALIEXPRESS_RESCAN: '1'
        run: |
          set -euo pipefail
          output="$(timeout 1500s node scripts/aliexpress-refinery-rescan-staging.js --execute --limit=${{ steps.operation.outputs.limit }})"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-7000)"
          echo "summary=$compact" >> "$GITHUB_OUTPUT"

      - name: Audit refinery after executed rescan
        id: refinery_audit
        if: steps.operation.outputs.operation == 'aliexpress-refinery-rescan'
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 180s node scripts/aliexpress-refinery-audit-staging.js)"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-7000)"
          echo "summary=$compact" >> "$GITHUB_OUTPUT"

      - name: Audit AliExpress draft promotion
        id: audit
        if: steps.operation.outputs.operation == 'aliexpress-draft-audit'
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 120s node scripts/aliexpress-promote-drafts-staging.js --dry-run --limit=${{ steps.operation.outputs.limit }})"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-3500)"
          echo "summary=$compact" >> "$GITHUB_OUTPUT"

      - name: Promote next eligible AliExpress drafts
        id: promote
        if: steps.operation.outputs.operation == 'aliexpress-promote-drafts'
        shell: bash
        env:
          KOMERCE_ALLOW_ALIEXPRESS_DRAFT_PROMOTION: '1'
        run: |
          set -euo pipefail
          output="$(timeout 1500s node scripts/aliexpress-promote-drafts-staging.js --execute --limit=${{ steps.operation.outputs.limit }})"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-3500)"
          echo "summary=$compact" >> "$GITHUB_OUTPUT"

      - name: Dry-run AliExpress Supplier Order Identity replay
        id: soi_replay_dry_run
        if: steps.operation.outputs.operation == 'aliexpress-soi-replay-dry-run'
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 300s node scripts/replay-soi.js --dry-run --limit=${{ steps.operation.outputs.limit }})"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-7000)"
          echo "summary=$compact" >> "$GITHUB_OUTPUT"

      - name: Dry-run AliExpress French enrichment batch
        id: enrich_fr_dry_run
        if: steps.operation.outputs.operation == 'aliexpress-enrich-fr-dry-run'
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 300s node scripts/batch-enrich-fr.js --dry-run --limit=${{ steps.operation.outputs.limit }})"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-7000)"
          echo "summary=$compact" >> "$GITHUB_OUTPUT"

      - name: Write operation summary
        if: always()
        shell: bash
        env:
          OPERATION: ${{ steps.operation.outputs.operation }}
          LIMIT: ${{ steps.operation.outputs.limit }}
          RESCAN_DRY_RUN_SUMMARY: ${{ steps.rescan_dry_run.outputs.summary }}
          RESCAN_SUMMARY: ${{ steps.rescan.outputs.summary }}
          REFINERY_AUDIT_SUMMARY: ${{ steps.refinery_audit.outputs.summary }}
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
          PROMOTE_SUMMARY: ${{ steps.promote.outputs.summary }}
          SOI_REPLAY_DRY_RUN_SUMMARY: ${{ steps.soi_replay_dry_run.outputs.summary }}
          ENRICH_FR_DRY_RUN_SUMMARY: ${{ steps.enrich_fr_dry_run.outputs.summary }}
        run: |
          {
            echo '## Komerce staging catalog operation'
            echo
            echo "- operation: ${OPERATION:-unknown}"
            echo "- limit: ${LIMIT:-unknown}"
            if [ -n "${RESCAN_DRY_RUN_SUMMARY:-}" ]; then echo "- refinery dry-run: \`${RESCAN_DRY_RUN_SUMMARY}\`"; fi
            if [ -n "${RESCAN_SUMMARY:-}" ]; then echo "- refinery rescan: \`${RESCAN_SUMMARY}\`"; fi
            if [ -n "${REFINERY_AUDIT_SUMMARY:-}" ]; then echo "- refinery audit: \`${REFINERY_AUDIT_SUMMARY}\`"; fi
            if [ -n "${AUDIT_SUMMARY:-}" ]; then echo "- audit: \`${AUDIT_SUMMARY}\`"; fi
            if [ -n "${PROMOTE_SUMMARY:-}" ]; then echo "- promotion: \`${PROMOTE_SUMMARY}\`"; fi
            if [ -n "${SOI_REPLAY_DRY_RUN_SUMMARY:-}" ]; then echo "- SOI replay dry-run: \`${SOI_REPLAY_DRY_RUN_SUMMARY}\`"; fi
            if [ -n "${ENRICH_FR_DRY_RUN_SUMMARY:-}" ]; then echo "- FR enrichment dry-run: \`${ENRICH_FR_DRY_RUN_SUMMARY}\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close successful command issue
        if: success() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OPERATION: ${{ steps.operation.outputs.operation }}
          RESCAN_DRY_RUN_SUMMARY: ${{ steps.rescan_dry_run.outputs.summary }}
          RESCAN_SUMMARY: ${{ steps.rescan.outputs.summary }}
          REFINERY_AUDIT_SUMMARY: ${{ steps.refinery_audit.outputs.summary }}
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
          PROMOTE_SUMMARY: ${{ steps.promote.outputs.summary }}
          SOI_REPLAY_DRY_RUN_SUMMARY: ${{ steps.soi_replay_dry_run.outputs.summary }}
          ENRICH_FR_DRY_RUN_SUMMARY: ${{ steps.enrich_fr_dry_run.outputs.summary }}
        run: |
          set -euo pipefail
          note="Staging catalog operation \`$OPERATION\` completed successfully."
          if [ -n "${RESCAN_DRY_RUN_SUMMARY:-}" ]; then note="$note\n\n\`$RESCAN_DRY_RUN_SUMMARY\`"; fi
          if [ -n "${RESCAN_SUMMARY:-}" ]; then note="$note\n\n\`$RESCAN_SUMMARY\`"; fi
          if [ -n "${REFINERY_AUDIT_SUMMARY:-}" ]; then note="$note\n\n\`$REFINERY_AUDIT_SUMMARY\`"; fi
          if [ -n "${AUDIT_SUMMARY:-}" ]; then note="$note\n\n\`$AUDIT_SUMMARY\`"; fi
          if [ -n "${PROMOTE_SUMMARY:-}" ]; then note="$note\n\n\`$PROMOTE_SUMMARY\`"; fi
          if [ -n "${SOI_REPLAY_DRY_RUN_SUMMARY:-}" ]; then note="$note\n\n\`$SOI_REPLAY_DRY_RUN_SUMMARY\`"; fi
          if [ -n "${ENRICH_FR_DRY_RUN_SUMMARY:-}" ]; then note="$note\n\n\`$ENRICH_FR_DRY_RUN_SUMMARY\`"; fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$note"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
