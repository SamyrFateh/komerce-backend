name: Staging catalog operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Opération catalogue staging autorisée'
        required: true
        type: choice
        default: aliexpress-draft-audit
        options:
          - aliexpress-draft-audit
          - aliexpress-promote-drafts
      limit:
        description: 'Nombre maximum de promotions pour ce run'
        required: false
        default: '100'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: komerce-staging-catalog-${{ github.event_name == 'workflow_dispatch' && inputs.operation || github.event.issue.title }}
  cancel-in-progress: false

jobs:
  catalog-ops:
    name: Catalog staging — bounded operation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       (github.event.issue.title == '[staging-op] aliexpress-draft-audit' ||
        github.event.issue.title == '[staging-op] aliexpress-promote-drafts'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      KOMERCE_ALLOW_ALIEXPRESS_DRAFT_PROMOTION: '1'
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}

    steps:
      - name: Resolve bounded operation
        id: operation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          DISPATCH_OPERATION: ${{ inputs.operation || '' }}
          DISPATCH_LIMIT: ${{ inputs.limit || '100' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            operation="$DISPATCH_OPERATION"
            limit="$DISPATCH_LIMIT"
          else
            limit='100'
            case "$ISSUE_TITLE" in
              '[staging-op] aliexpress-draft-audit') operation='aliexpress-draft-audit' ;;
              '[staging-op] aliexpress-promote-drafts') operation='aliexpress-promote-drafts' ;;
              *) echo '::error::Opération non autorisée'; exit 1 ;;
            esac
          fi

          case "$operation" in
            aliexpress-draft-audit|aliexpress-promote-drafts) ;;
            *) echo '::error::Opération non autorisée'; exit 1 ;;
          esac
          if ! [[ "$limit" =~ ^[0-9]+$ ]] || [ "$limit" -lt 1 ] || [ "$limit" -gt 500 ]; then
            echo '::error::limit doit être un entier 1..500'
            exit 1
          fi

          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"

      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Require staging database secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo '::error::RAILWAY_DATABASE_URL manque dans les secrets GitHub'
            exit 1
          fi

      - name: Audit AliExpress draft promotion
        id: audit
        if: steps.operation.outputs.operation == 'aliexpress-draft-audit'
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 120s node scripts/aliexpress-promote-drafts-staging.js --dry-run --limit=${{ steps.operation.outputs.limit }})"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-3500)"
          echo "summary=$compact" >> "$GITHUB_OUTPUT"

      - name: Promote next eligible AliExpress drafts
        id: promote
        if: steps.operation.outputs.operation == 'aliexpress-promote-drafts'
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 1500s node scripts/aliexpress-promote-drafts-staging.js --execute --limit=${{ steps.operation.outputs.limit }})"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-3500)"
          echo "summary=$compact" >> "$GITHUB_OUTPUT"

      - name: Write operation summary
        if: always()
        shell: bash
        env:
          OPERATION: ${{ steps.operation.outputs.operation }}
          LIMIT: ${{ steps.operation.outputs.limit }}
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
          PROMOTE_SUMMARY: ${{ steps.promote.outputs.summary }}
        run: |
          {
            echo '## Komerce staging catalog operation'
            echo
            echo "- operation: ${OPERATION:-unknown}"
            echo "- limit: ${LIMIT:-unknown}"
            if [ -n "${AUDIT_SUMMARY:-}" ]; then
              echo "- audit: \`${AUDIT_SUMMARY}\`"
            fi
            if [ -n "${PROMOTE_SUMMARY:-}" ]; then
              echo "- promotion: \`${PROMOTE_SUMMARY}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close successful command issue
        if: success() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OPERATION: ${{ steps.operation.outputs.operation }}
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
          PROMOTE_SUMMARY: ${{ steps.promote.outputs.summary }}
        run: |
          set -euo pipefail
          note="Staging catalog operation \`$OPERATION\` completed successfully."
          if [ -n "${AUDIT_SUMMARY:-}" ]; then note="$note\n\n\`$AUDIT_SUMMARY\`"; fi
          if [ -n "${PROMOTE_SUMMARY:-}" ]; then note="$note\n\n\`$PROMOTE_SUMMARY\`"; fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$note"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
