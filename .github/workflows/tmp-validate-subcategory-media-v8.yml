name: tmp-validate-subcategory-media-v8

on:
  push:
    branches:
      - fix/subcategory-canonical-cutouts-v8
    paths:
      - .github/workflows/tmp-validate-subcategory-media-v8.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subcategory-canonical-cutouts-v8
          fetch-depth: 0

      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci

      - name: Regenerate canonical CSS projection
        working-directory: public/boutique
        run: node scripts/deploy-css.js

      - name: Run focused Boutique unit tests
        working-directory: public/boutique
        run: |
          npx jest tests/unit/category-cutout-navigation.test.js tests/unit/category-subcategory-continuity.test.js tests/unit/b-subcat.test.js --runInBand

      - name: Run Boutique source and ownership gates
        working-directory: public/boutique
        run: |
          npm run check:imports
          npm run check:assets
          npm run check:important
          npm run check:css-guard
          npm run check:css-specificity-guard
          npm run check:css-dist-only
          npm run check:cache
          npm run audit:arch
          npm run audit:ownership
          npm run feature:guard:strict

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Chromium canonical/fallback/missing audit
        run: |
          cat > public/boutique/__qa_subcategory_media.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8">
          <link rel="stylesheet" href="/boutique/css/tokens.css">
          <link rel="stylesheet" href="/boutique/css/interactions.css">
          <link rel="stylesheet" href="/boutique/css/category-cutout-navigation-desktop.css">
          <style>
            body{font-family:Arial,sans-serif;margin:24px;background:#fbf8f2;color:#2f312e}
            .qa-family{margin:0 0 22px}.qa-family h2{font-size:15px;margin:0 0 8px}
            .qa-rail{display:flex;gap:14px;flex-wrap:wrap}.k-subcutout{display:flex;flex-direction:column;align-items:center;border:0;background:transparent;min-width:104px;min-height:88px}
            .k-subcutout-icon{display:grid;place-items:center;width:76px;height:68px}.k-subcutout-label{font-size:11.5px}
            #qa-fallback{margin-top:24px;padding-top:16px;border-top:1px solid #ddd}
          </style></head><body><main id="qa"></main><div id="qa-fallback"></div>
          <script type="module">
            import { renderShelfSubcategoryMedia, bindShelfMediaFallbacks } from '/boutique/js/render/category-shelf-visuals.js';
            const families = {
              'Mode & Beauté':['Femme','Homme','Enfant','Beauté'],
              'Maison':['Confort','Cuisine','Déco','Enfants'],
              'Tech':['Phones','Ordi','Audio','Montres','Gaming'],
              'Bricolage':['Outillage','Electricité','Sécurité'],
              'Créations personnelles':['Cérémonie','Cadeau','Impression'],
              'Auto':['Filtres','Freinage','Éclairage','Moto'],
            };
            const root=document.getElementById('qa');
            Object.entries(families).forEach(([cat,subs])=>{
              const section=document.createElement('section'); section.className='qa-family';
              section.innerHTML='<h2>'+cat+'</h2><div class="qa-rail">'+subs.map(sub=>'<button class="k-subcutout" data-subcat="'+sub+'"><span class="k-subcutout-icon">'+renderShelfSubcategoryMedia([],cat,sub,'k-shelf-object--subcategory')+'</span><span class="k-subcutout-label">'+sub+'</span></button>').join('')+'</div>';
              root.appendChild(section); bindShelfMediaFallbacks(section);
            });
            const fallback=document.getElementById('qa-fallback');
            fallback.innerHTML='<button id="fallback-holder" data-subcat="Cuisine"><span class="k-subcutout-icon">'+renderShelfSubcategoryMedia([{category:'Maison',subcategory:'Cuisine',image_url:'/boutique/categories/cat-maison-v3.webp?v=1',sort_order:1}], 'Maison','Cuisine','k-shelf-object--subcategory')+'</span></button>';
            bindShelfMediaFallbacks(fallback);
            window.__qaReady=true;
          </script></body></html>
          HTML
          python3 -m http.server 4173 --directory public >/tmp/subcat-http.log 2>&1 &
          echo $! >/tmp/subcat-http.pid
          cat > /tmp/subcat-audit.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/public/boutique/node_modules/playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            await page.goto('http://127.0.0.1:4173/boutique/__qa_subcategory_media.html');
            await page.waitForFunction(()=>window.__qaReady===true);
            await page.waitForFunction(()=>[...document.querySelectorAll('#qa img[data-shelf-media="canonical"]')].every(img=>img.complete && img.naturalWidth>0));
            const metrics=await page.evaluate(()=>({
              canonical:document.querySelectorAll('#qa img[data-shelf-media="canonical"]').length,
              missing:document.querySelectorAll('#qa [data-shelf-media="missing"]').length,
              broken:[...document.images].filter(img=>img.complete&&img.naturalWidth===0).map(img=>img.src),
              statuses:[...document.querySelectorAll('#qa [data-subcat]')].map(x=>[x.dataset.subcat,x.dataset.shelfImageStatus]),
            }));
            if(metrics.canonical!==23) throw new Error('expected 23 canonical cutouts, got '+metrics.canonical);
            if(metrics.missing!==0) throw new Error('unexpected initial missing media');
            if(metrics.broken.length) throw new Error('broken canonical images: '+metrics.broken.join(','));
            if(metrics.statuses.some(([,s])=>s!=='canonical')) throw new Error('non canonical initial status '+JSON.stringify(metrics.statuses));

            const holder=page.locator('#fallback-holder');
            const first=holder.locator('img');
            await first.evaluate(img=>{img.src='/boutique/categories/does-not-exist-canonical.webp';});
            await page.waitForFunction(()=>document.querySelector('#fallback-holder')?.dataset.shelfImageStatus==='product-fallback');
            const fallbackSrc=await holder.locator('img').getAttribute('src');
            if(!fallbackSrc.includes('cat-maison-v3.webp')) throw new Error('product fallback did not activate: '+fallbackSrc);
            await holder.locator('img').evaluate(img=>{img.src='/boutique/categories/does-not-exist-product.webp';});
            await page.waitForFunction(()=>document.querySelector('#fallback-holder')?.dataset.shelfImageStatus==='missing');
            if(await holder.locator('.k-shelf-media-placeholder').count()!==1) throw new Error('missing placeholder not rendered');
            if(await holder.locator('img').count()!==0) throw new Error('broken image remained after final fallback');

            fs.mkdirSync('/tmp/subcategory-media-audit',{recursive:true});
            fs.writeFileSync('/tmp/subcategory-media-audit/metrics.json',JSON.stringify(metrics,null,2));
            await page.screenshot({path:'/tmp/subcategory-media-audit/desktop-1280.png',fullPage:true});
            await page.setViewportSize({width:390,height:844});
            await page.screenshot({path:'/tmp/subcategory-media-audit/mobile-390.png',fullPage:true});
            console.log('SUBCATEGORY_MEDIA_AUDIT_OK',JSON.stringify(metrics));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/subcat-audit.cjs
          kill $(cat /tmp/subcat-http.pid) || true
          rm -f public/boutique/__qa_subcategory_media.html

      - uses: actions/upload-artifact@v4
        with:
          name: subcategory-media-v8-audit
          path: /tmp/subcategory-media-audit

      - name: Persist regenerated projection if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/boutique/.cache-buster-state.json public/boutique/css/dist public/boutique/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore(boutique): refresh CSS projection after realign'
            git push origin HEAD:fix/subcategory-canonical-cutouts-v8
          fi

      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f public/boutique/__qa_subcategory_media.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tmp-validate-subcategory-media-v8.yml || true
          git commit -m 'chore(qa): remove temporary subcategory validation' || true
          git push origin HEAD:fix/subcategory-canonical-cutouts-v8
