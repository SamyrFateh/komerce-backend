name: RCT1 — moteur staging (lecture et contrôle sans réinjection)
# Issue ouverte par le proprietaire : titre "[staging-op] rct1-<phase>" ; phase dans la liste blanche ci-dessous.
on:
  workflow_dispatch: {}
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-rct1-engine
  cancel-in-progress: false
jobs:
  engine:
    if: >-
      github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[staging-op] rct1-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      NODE_ENV: test
      ORDER_COST_SNAPSHOT_ACTIVE: 'true'
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require staging secret
        run: test -n "$DATABASE_URL"
      - name: Run phase
        shell: bash
        run: |
          phase="${ISSUE_TITLE#\[staging-op\] rct1-}"
          case "$phase" in
            introspect|pricing-probe|gate-probe|finance-probe|inventory|dump|tables|plan|dry-run|verify|replay|report) ;;
            *) echo "::error::phase refusee"; exit 1 ;;
          esac
          # RCT1 est retiré du catalogue commercial : phase apply volontairement interdite.
          # Corps d'issue : lignes TABLES=a,b / ONLY=id1,id2 (liste blanche de caracteres)
          export RCT1_TABLES="$(printf '%s' "$ISSUE_BODY" | sed -n 's/^TABLES=\([a-z_0-9,]*\)\r\?$/\1/p' | head -1)"
          export RCT1_ONLY="$(printf '%s' "$ISSUE_BODY" | sed -n 's/^ONLY=\([A-Za-z0-9_,.-]*\)\r\?$/\1/p' | head -1)"
          # Arbitrage metier du prix local P3 (entier positif uniquement) : ligne P3_PRICE=7000 dans le corps d'issue.
          p3="$(printf '%s' "$ISSUE_BODY" | sed -n 's/^P3_PRICE=\([0-9]\{3,7\}\)\r\?$/\1/p' | head -1)"
          if [ -n "$p3" ]; then export RCT1_P3_PRICE_KMF="$p3"; fi
          node scripts/recette/rct1/cli.js "$phase"
