name: Temporary Pricing Market Decision E2E

on:
  push:
    branches:
      - test/pricing-market-decision-e2e

permissions:
  contents: write

jobs:
  e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/pricing-market-decision-e2e
          fetch-depth: 0

      - name: Register E2E ownership in dashboard feature
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('features/dashboard.feature.js')
          s = p.read_text()
          needle = "      'tests/unit/canonical-pricing-workspace-boundary.test.js',\n"
          line = "      'public/boutique/tests/e2e/admin-pricing-market-decision.spec.js',\n"
          if line not in s:
              if needle not in s:
                  raise SystemExit('dashboard test marker missing')
              s = s.replace(needle, needle + line, 1)
              p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install Playwright harness
        working-directory: public/boutique
        run: npm ci

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Run decision E2E scenarios
        working-directory: public/boutique
        run: npx playwright test tests/e2e/admin-pricing-market-decision.spec.js --project='Desktop Chrome' --workers=1

      - name: Commit feature ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/dashboard.feature.js
          git commit -m "test(dashboard): register market decision e2e" || exit 0
          git push origin HEAD:test/pricing-market-decision-e2e
