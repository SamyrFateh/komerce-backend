name: Governance Lot 0 recovery proof

on:
  push:
    branches:
      - agent/governance-lot0-recovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply approved breakpoint recovery
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const fixes = [
            ['public/boutique/css/checkout-vertical-rail.css', '@media (min-width: 900px) and (max-width: 1120px) {', '@media (min-width: 900px) and (max-width: 1199px) {'],
            ['public/boutique/css/notifications.css', '@media (max-width:700px) {', '@media (max-width:899px) {'],
          ];
          for (const [file, from, to] of fixes) {
            let src = fs.readFileSync(file, 'utf8');
            if (src.includes(from)) {
              src = src.replace(from, to);
              fs.writeFileSync(file, src, 'utf8');
              console.log(`fixed ${file}`);
            }
          }
          NODE

          if ! git diff --quiet -- public/boutique/css/checkout-vertical-rail.css public/boutique/css/notifications.css; then
            git config user.name "Komerce Governance Recovery"
            git config user.email "actions@users.noreply.github.com"
            git add public/boutique/css/checkout-vertical-rail.css public/boutique/css/notifications.css
            git commit -m "fix(boutique): align responsive breakpoints with doctrine [gov-write]"
            git push origin HEAD:agent/governance-lot0-recovery
          fi

      - name: Capture current gate evidence
        shell: bash
        run: |
          set -u
          mkdir -p evidence/dist

          capture() {
            name="$1"
            shift
            set +e
            "$@" >"evidence/${name}.log" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" >"evidence/${name}.exit"
            echo "${name}: exit ${rc}"
          }

          capture deploy-css node public/boutique/scripts/deploy-css.js
          cp public/boutique/scripts/.css-specificity-guard-baseline.json evidence/specificity-baseline.json
          cp public/boutique/scripts/.breakpoints-baseline.json evidence/breakpoints-baseline.json
          cp public/boutique/scripts/css-bundles.js evidence/
          cp public/boutique/css/dist/base.css evidence/dist/
          cp public/boutique/css/dist/components.css evidence/dist/
          cp public/boutique/css/dist/desktop.css evidence/dist/

          capture breakpoints node public/boutique/scripts/check-breakpoints.js --strict
          capture specificity node public/boutique/scripts/css-specificity-guard.js --strict
          capture gate-findings node scripts/gen-gate-findings.js
          capture feature-guard node scripts/feature-guard.js --strict
          capture business-graph-check node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique
          capture feature-360-check node scripts/feature-360-check.js

          git status --short > evidence/git-status-after.log

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: governance-lot0-recovery-evidence
          path: evidence/
          if-no-files-found: error
