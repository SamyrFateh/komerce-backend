name: Governance Lot 0 recovery proof

on:
  push:
    branches:
      - agent/governance-lot0-recovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[gov-write]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply reviewed Lot 0 corrections
        run: |
          node scripts/governance-lot0-recovery-mutate.js
          node scripts/governance-lot0-recovery-adapter.js

      - name: Persist gate semantics and card corrections
        shell: bash
        run: |
          git config user.name "Komerce Governance Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add \
            public/boutique/css/checkout-vertical-rail.css \
            public/boutique/css/notifications.css \
            features/catalog.feature.js \
            features/infrastructure.feature.js \
            public/boutique/scripts/check-breakpoints.js \
            public/boutique/scripts/css-specificity-guard.js \
            scripts/gen-gate-findings.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(governance): make CSS gate diagnostics semantic and attributable [gov-write]"
            git push origin HEAD:agent/governance-lot0-recovery
          fi

      - name: Refresh reviewed CSS baseline and deploy bundles
        shell: bash
        run: |
          node public/boutique/scripts/deploy-css.js
          node public/boutique/scripts/css-specificity-guard.js --save
          node public/boutique/scripts/check-breakpoints.js --strict
          node public/boutique/scripts/css-specificity-guard.js --strict

          git add \
            public/boutique/scripts/.css-specificity-guard-baseline.json \
            public/boutique/.cache-buster-state.json \
            public/boutique/index.html \
            public/boutique/css/dist/base.css \
            public/boutique/css/dist/components.css \
            public/boutique/css/dist/desktop.css
          if ! git diff --cached --quiet; then
            git commit -m "chore(boutique): refresh reviewed CSS gate baseline and bundles [gov-write]"
            git push origin HEAD:agent/governance-lot0-recovery
          fi

      - name: Regenerate governance truth from final source tree
        shell: bash
        run: |
          # Les deux fichiers suivants sont uniquement le harnais temporaire de reprise.
          # Les retirer AVANT génération garantit que les artefacts décrivent le tree final.
          rm -f .github/workflows/governance-lot0-recovery-proof.yml
          rm -f scripts/governance-lot0-recovery-mutate.js
          rm -f scripts/governance-lot0-recovery-adapter.js

          node scripts/gen-gate-findings.js
          node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
          node scripts/gen-feature-360.js

          git add \
            docs/GATE_FINDINGS.json \
            docs/BUSINESS_FEATURE_GRAPH.json \
            docs/BUSINESS_FEATURE_GRAPH.md \
            docs/O6_INVENTORY.md \
            docs/FEATURE_360.json \
            docs/FEATURE_360.md \
            .github/workflows/governance-lot0-recovery-proof.yml \
            scripts/governance-lot0-recovery-mutate.js \
            scripts/governance-lot0-recovery-adapter.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(governance): regenerate Lot 0 canonical projections [gov-write]"
            git push origin HEAD:agent/governance-lot0-recovery
          fi

      - name: Final Lot 0 DoD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          node public/boutique/scripts/check-breakpoints.js --strict | tee evidence/breakpoints.log
          node public/boutique/scripts/css-specificity-guard.js --strict | tee evidence/specificity.log
          node scripts/feature-guard.js --strict | tee evidence/feature-guard.log
          node scripts/gen-gate-findings.js | tee evidence/gate-findings.log
          node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique | tee evidence/business-graph-check.log
          node scripts/feature-360-check.js | tee evidence/feature-360-check.log

          git diff --exit-code
          git status --short | tee evidence/git-status.log
          test -z "$(git status --porcelain)"

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: governance-lot0-final-evidence
          path: evidence/
          if-no-files-found: error
