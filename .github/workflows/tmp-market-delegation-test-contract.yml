name: tmp-market-delegation-test-contract

on:
  push:
    branches:
      - fix/market-delegation-runtime-bridge

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-delegation-runtime-bridge
      - name: Align focused tests with delegated pre-guard
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const partnersFile = 'tests/unit/partners.test.js';
          let p = fs.readFileSync(partnersFile, 'utf8');
          const partnerAnchor = "jest.mock('../../middleware/validate', () => ({";
          const partnerMock = `jest.mock('../../middleware/require-market-delegated-role', () => ({\n  attachMarketDelegatedRoleFor: () => (req, res, next) => next(),\n}));\n\n`;
          if (!p.includes(partnerMock.trim())) {
            if (!p.includes(partnerAnchor)) throw new Error('partners mock anchor missing');
            p = p.replace(partnerAnchor, partnerMock + partnerAnchor);
          }
          fs.writeFileSync(partnersFile, p);

          const dashboardFile = 'tests/unit/admin-dashboard-market.test.js';
          let d = fs.readFileSync(dashboardFile, 'utf8');
          const oldBlock = `    expect(res.status).toBe(403);\n    expect(mockQuery).not.toHaveBeenCalled();\n  });\n\n  test('market_operator CM lit son cockpit CM mais ne peut pas lire CG'`;
          const newBlock = `    expect(res.status).toBe(403);\n    expect(mockQuery).toHaveBeenCalledTimes(1);\n    expect(mockQuery.mock.calls[0][0]).toContain('operator_market_scopes');\n    expect(mockQuery.mock.calls.some(([sql]) => String(sql).includes('FROM markets'))).toBe(false);\n  });\n\n  test('market_operator CM lit son cockpit CM mais ne peut pas lire CG'`;
          if (!d.includes(oldBlock)) throw new Error('dashboard assertion anchor missing');
          d = d.replace(oldBlock, newBlock);
          fs.writeFileSync(dashboardFile, d);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/partners.test.js tests/unit/admin-dashboard-market.test.js
          git commit -m "test(market-delegation): aligner les guards historiques"
          git push origin HEAD:fix/market-delegation-runtime-bridge
