name: Temporary route registration fix

on:
  push:
    branches:
      - feat/canonical-economic-pilotage-fin-cutover

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-economic-pilotage-fin-cutover
      - name: Register redirected legacy paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bootstrap/html-routes.js')
          text = p.read_text()
          old = "    '/admin/transitaire',\n    '/admin/sante',"
          new = "    '/admin/transitaire',\n    '/admin/economic',\n    '/admin/pilotage-fin',\n    '/admin/sante',"
          if old not in text:
              raise SystemExit('route list marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit route fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/html-routes.js
          git commit -m "fix(canonical): register economic legacy redirect paths"
          git push origin HEAD:feat/canonical-economic-pilotage-fin-cutover
