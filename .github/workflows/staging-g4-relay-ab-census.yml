name: Staging G4 — inventaire relais A/B en lecture seule

# Diagnostic préalable uniquement. Ne crée aucun compte, aucun relais, aucun ordre.
on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: komerce-staging-g4-relay-ab-census
  cancel-in-progress: false

jobs:
  readonly-census:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] g4-relay-ab-readonly-census'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      G4_CENSUS_CONFIRMATION: G4-READ-ONLY
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Epingler le SHA runtime exact
        run: node scripts/recette/resolve-staging-deploy-pin.js
      - name: Verifier l'empreinte DB staging en lecture seule
        run: node scripts/recette/target-guard.js
      - name: Compter les relais E2E et les dossiers (aucune mutation)
        run: node scripts/recette/staging-g4-relay-ab-readonly-census.js
      - name: Archiver diagnostic anonymise, meme si BLOCKED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-g4-relay-ab-census-${{ github.run_id }}
          path: test-results/g4-relay-ab/readonly-census.json
          if-no-files-found: warn
          retention-days: 30
