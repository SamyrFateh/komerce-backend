name: PDC5 Merge Main

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: pdc5-merge-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merge-main:
    if: github.event.pull_request.number == 584
    runs-on: ubuntu-latest
    steps:
      - name: Stack collapse owns integration now
        run: echo "PDC integration moved to top-down stack collapse; no branch write performed."
