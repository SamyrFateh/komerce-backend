name: Hub — Chromium transversal des surfaces
on:
  pull_request:
    paths:
      - 'public/dashboards/canonical/js/hub-*.js'
      - 'public/dashboards/canonical/js/operations-workspace.js'
      - 'public/dashboards/canonical/css/operations-workspace.css'
      - 'routes/admin-operations-workspace.js'
      - 'services/hub-global-board.js'
      - 'services/hub-procurement-dossier.js'
      - 'services/hub-reception-quality-plan.js'
      - 'services/hub-supplier-receipt-quality.js'
      - 'migrations/*_hub_supplier_receipt_quality.sql'
      - 'tests/integration/hub-physical-identity-postgres.test.js'
      - 'tests/e2e/hub-*.spec.js'
      - 'playwright.config.js'
      - '.github/workflows/hub-domain-chromium.yml'
permissions:
  contents: read
concurrency:
  group: hub-domain-chromium-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: All Hub surfaces, navigation, roles, operations, QR and guided recipe
        run: npx playwright test --config=playwright.config.js 'tests/e2e/(hub-|purchasing-workspace|live-ops-shell|market-readonly-views|golden-cockpit-browser-flow|dashboard-role-matrix|context-return-links)' --trace retain-on-failure
      - name: Preserve synthetic browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-domain-chromium-${{ github.run_id }}
          path: |
            .playwright-output/
            test-artifacts/
            test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: State proof scope
        if: always()
        run: |
          echo "Chromium réel, HTTP simulé : vérification UI/navigation, pas de certification PostgreSQL/Railway ni de scanner physique. La certification staging reste un gate distinct." >> "$GITHUB_STEP_SUMMARY"

  reception-pg16:
    name: Hub — réception V3 sur PostgreSQL 16 isolé
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exécuter le banc Hub-001 dans son schéma PostgreSQL jetable
        run: |
          set -euo pipefail
          mkdir -p test-results/hub-reception-pg
          node node_modules/jest/bin/jest.js tests/integration/hub-physical-identity-postgres.test.js --runInBand --ci --forceExit |& tee test-results/hub-reception-pg/integration.log
      - name: Archiver la preuve PG isolée
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-reception-pg16-${{ github.run_id }}
          path: test-results/hub-reception-pg/
          if-no-files-found: warn
          retention-days: 14
      - name: Scope de la preuve
        if: always()
        run: echo "PG16 réel dans un schéma jetable, hors Railway et production. Le GO staging reste distinct." >> "$GITHUB_STEP_SUMMARY"
