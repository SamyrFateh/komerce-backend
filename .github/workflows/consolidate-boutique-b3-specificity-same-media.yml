name: Consolidate Boutique B3 Same-Media Specificity

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b3-specificity

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b3-specificity
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - run: npm --prefix public/boutique ci
      - name: Consolidate 43 all-pairs same-media specificity keys
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const postcss = require('./public/boutique/node_modules/postcss');
          const { BUNDLES } = require('./public/boutique/scripts/css-bundles');

          const root = path.resolve('public/boutique');
          const specBase = JSON.parse(fs.readFileSync(path.join(root, 'scripts/.css-specificity-guard-baseline.json'), 'utf8'));
          const cascadeBase = JSON.parse(fs.readFileSync(path.join(root, 'scripts/.css-guard-baseline.json'), 'utf8'));
          if (specBase.total !== 86) throw new Error(`Expected specificity 86, got ${specBase.total}`);
          if (cascadeBase.total !== 0) throw new Error(`Expected cascade 0, got ${cascadeBase.total}`);

          // Guard output is used only for identity/location. Values are deliberately
          // resolved from PostCSS because the legacy guard prints multiline values
          // (e.g. box-shadow:) incompletely and may include inline comments.
          const raw = cp.execFileSync('node', ['scripts/css-specificity-guard.js'], {
            cwd: root, encoding: 'utf8', maxBuffer: 20 * 1024 * 1024,
          });
          const lines = raw.replace(/\x1b\[[0-9;]*m/g, '').split(/\r?\n/);
          const physical = [];
          for (let i = 0; i < lines.length; i++) {
            const m = lines[i].match(/^🔴 \.([^ ]+) — propriété (.+)$/);
            if (!m) continue;
            const win = (lines[i + 1] || '').match(/^\s*gagnant\s+([^:]+):L(\d+)\s+(.+)$/);
            const lose = (lines[i + 3] || '').match(/^\s*perdant\s+([^:]+):L(\d+)\s+(.+)$/);
            if (!win || !lose) throw new Error(`Guard location parse failure near output line ${i + 1}`);
            physical.push({
              gc: m[1], prop: m[2],
              wf: win[1], wl: +win[2], ws: win[3],
              lf: lose[1], ll: +lose[2], ls: lose[3],
            });
          }
          const semanticBefore = new Set(physical.map(f => [f.gc, f.ws, f.ls, f.prop].join('|||')));
          if (semanticBefore.size !== 86) throw new Error(`Expected 86 semantic findings, got ${semanticBefore.size}`);

          const rank = new Map();
          ['base.css', 'components.css', 'desktop.css'].forEach((out, di) => {
            const bundle = BUNDLES.find(x => x.out === out);
            bundle.files.forEach((name, si) => rank.set(`public/boutique/css/${name}.css`, di * 1000 + si));
          });

          const cache = new Map();
          const norm = s => s.replace(/\s+/g, ' ').trim();
          const members = r => (r.selectors || [r.selector]).map(norm);
          function load(file) {
            if (!cache.has(file)) {
              const fp = path.resolve(file);
              cache.set(file, { fp, ast: postcss.parse(fs.readFileSync(fp, 'utf8'), { from: file }) });
            }
            return cache.get(file).ast;
          }
          function media(rule) {
            const parts = [];
            let n = rule.parent;
            while (n && n.type !== 'root') {
              if (n.type === 'atrule' && n.name === 'media') parts.unshift(`@media ${n.params}`);
              n = n.parent;
            }
            return parts.length ? parts.join(' && ') : 'global';
          }
          function findDecl(file, reportedLine, selector, prop) {
            const ast = load(file);
            const target = norm(selector);
            const candidates = [];
            ast.walkRules(rule => {
              if (!members(rule).includes(target)) return;
              for (const decl of rule.nodes || []) {
                if (decl.type !== 'decl' || decl.prop !== prop) continue;
                const declLine = decl.source?.start?.line || rule.source?.start?.line || 0;
                const ruleLine = rule.source?.start?.line || 0;
                candidates.push({ rule, decl, distance: Math.min(Math.abs(declLine - reportedLine), Math.abs(ruleLine - reportedLine)) });
              }
            });
            if (!candidates.length) throw new Error(`Declaration not found ${file}:${reportedLine} ${selector} ${prop}`);
            candidates.sort((a, b) => a.distance - b.distance);
            const best = candidates[0];
            if (candidates.length > 1 && candidates[1].distance === best.distance && candidates[1].decl !== best.decl) {
              const aLine = best.decl.source?.start?.line || best.rule.source?.start?.line || 0;
              const bLine = candidates[1].decl.source?.start?.line || candidates[1].rule.source?.start?.line || 0;
              if (aLine === bLine) throw new Error(`Ambiguous declaration ${file}:${reportedLine} ${selector} ${prop}`);
            }
            return best;
          }
          function resolve(row, kind) {
            const file = kind === 'w' ? row.wf : row.lf;
            const line = kind === 'w' ? row.wl : row.ll;
            const selector = kind === 'w' ? row.ws : row.ls;
            const found = findDecl(file, line, selector, row.prop);
            return {
              file, selector, prop: row.prop,
              reportedLine: line,
              line: found.decl.source?.start?.line || found.rule.source?.start?.line || line,
              rule: found.rule, decl: found.decl,
              media: media(found.rule),
              value: found.decl.value,
              important: !!found.decl.important,
            };
          }

          const groups = new Map();
          for (const f of physical) {
            const key = [f.gc, f.ws, f.ls, f.prop].join('|||');
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push({ ...f, w: resolve(f, 'w'), l: resolve(f, 'l') });
          }
          const selected = [];
          for (const [key, rows] of groups) {
            if (rows[0].gc === 'modal-open') continue;
            if (rows.every(r => r.w.media === r.l.media)) selected.push({ key, rows });
          }
          if (selected.length !== 43) throw new Error(`Expected 43 all-pairs same-media keys, got ${selected.length}`);

          function stripGlobal(selector, gc) {
            let out = selector.split('.' + gc).join('');
            out = out.replace(/^(html|body)\s+/, '');
            return norm(out);
          }
          function currentDecl(file, line, selector, prop) {
            return findDecl(file, line, selector, prop);
          }
          function preserveOtherSelectors(rule, decl, targetSelector, oldValue, oldImportant) {
            const selectors = members(rule);
            const target = norm(targetSelector);
            const others = selectors.filter(s => s !== target);
            if (!others.length) return;
            const keep = postcss.rule({ selector: others.join(', ') });
            keep.append({ prop: decl.prop, value: oldValue, important: oldImportant });
            rule.after(keep);
          }
          function removeForSelector(ref) {
            const { rule, decl } = currentDecl(ref.file, ref.line, ref.selector, ref.prop);
            preserveOtherSelectors(rule, decl, ref.selector, decl.value, !!decl.important);
            decl.remove();
            if ((rule.nodes || []).filter(n => n.type !== 'comment').length === 0) rule.remove();
          }
          function setCanonical(ref, winnerValue, winnerImportant) {
            const { rule, decl } = currentDecl(ref.file, ref.line, ref.selector, ref.prop);
            const selectors = members(rule);
            if (selectors.length > 1) {
              preserveOtherSelectors(rule, decl, ref.selector, decl.value, !!decl.important);
              decl.remove();
              const win = postcss.rule({ selector: norm(ref.selector) });
              win.append({ prop: ref.prop, value: winnerValue, important: winnerImportant });
              rule.after(win);
              if ((rule.nodes || []).filter(n => n.type !== 'comment').length === 0) rule.remove();
            } else {
              decl.value = winnerValue;
              decl.important = winnerImportant;
            }
          }
          const identity = ref => [ref.file, ref.line, norm(ref.selector), ref.prop].join('|');

          const touched = [];
          for (const { key, rows } of selected) {
            const stripped = [...new Set(rows.map(r => stripGlobal(r.ws, r.gc)))];
            const losers = [...new Set(rows.map(r => norm(r.ls)))];
            if (stripped.length !== 1 || losers.length !== 1 || stripped[0] !== losers[0]) {
              throw new Error(`Selector strip mismatch ${key}: ${stripped.join()} vs ${losers.join()}`);
            }
            const winnerValues = [...new Set(rows.map(r => `${r.w.value}|||${r.w.important}`))];
            if (winnerValues.length !== 1) throw new Error(`Multiple premium winner values for ${key}`);
            const winnerValue = rows[0].w.value;
            const winnerImportant = rows[0].w.important;

            const uniqueLosers = [...new Map(rows.map(r => [identity(r.l), r.l])).values()];
            uniqueLosers.sort((a, b) => (rank.get(b.file) ?? -1) - (rank.get(a.file) ?? -1) || b.line - a.line);
            const canonical = uniqueLosers[0];
            setCanonical(canonical, winnerValue, winnerImportant);
            for (const loser of uniqueLosers.slice(1)) removeForSelector(loser);

            const uniqueWinners = [...new Map(rows.map(r => [identity(r.w), r.w])).values()];
            for (const winner of uniqueWinners) removeForSelector(winner);
            touched.push(key);
          }
          if (touched.length !== 43) throw new Error(`Expected 43 touched keys, got ${touched.length}`);

          for (const { fp, ast } of cache.values()) fs.writeFileSync(fp, ast.toString(), 'utf8');
          console.log(JSON.stringify({ specificityBefore: 86, keysConsolidated: 43, sourceFiles: [...cache.keys()].sort() }, null, 2));
          NODE
      - name: Rebuild canonical bundles
        run: npm --prefix public/boutique run deploy:css
      - name: Prove cascade remains zero and no specificity keys are added
        run: |
          npm --prefix public/boutique run check:css-guard
          npm --prefix public/boutique run check:css-specificity-guard
      - name: Lower specificity ratchet and write report
        run: |
          npm --prefix public/boutique run check:css-specificity-guard:save
          node <<'NODE'
          const fs = require('fs'), path = require('path');
          const root = path.resolve('public/boutique');
          const spec = JSON.parse(fs.readFileSync(path.join(root, 'scripts/.css-specificity-guard-baseline.json'), 'utf8'));
          const cascade = JSON.parse(fs.readFileSync(path.join(root, 'scripts/.css-guard-baseline.json'), 'utf8'));
          if (spec.total !== 43) throw new Error(`Expected specificity 43, got ${spec.total}`);
          if (cascade.total !== 0) throw new Error(`Cascade moved from zero to ${cascade.total}`);
          const report = [
            '# Boutique CSS Debt — B3-1 same-media specificity', '',
            '- Specificity baseline: **86 → 43**',
            '- All-physical-pairs same-media keys consolidated: **43**',
            '- Cascade baseline: **0 → 0**',
            '- Premium class lifecycle: additive/permanent; no remove/toggle path observed',
            '- Strategy: premium winning value moved into the latest normal-cascade base owner for the same media; premium property and redundant losing base declarations removed',
            '- New specificity keys before ratchet save: **0**', '',
            'No winning value changes. Mobile/global rules outside the matching media are untouched.'
          ].join('\n') + '\n';
          fs.writeFileSync(path.join(root, 'docs/BOUTIQUE_CSS_DEBT_B3_SPECIFICITY.md'), report);
          console.log(report);
          NODE
      - name: Commit B3-1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css public/boutique/index.html public/boutique/scripts/.css-specificity-guard-baseline.json public/boutique/docs/BOUTIQUE_CSS_DEBT_B3_SPECIFICITY.md
          git commit -m "refactor(boutique): halve specificity debt"
          git push origin HEAD:refactor/boutique-debt-zero-b3-specificity
