name: Showcase V2 visual audit

on:
  push:
    branches:
      - audit/showcase-v2-visual-20260904

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://komerce.co/boutique/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Diagnose live mobile rendering
        working-directory: public/boutique
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          cat > audit-output/diagnose.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('@playwright/test');

          const target = process.env.TARGET_URL || 'https://komerce.co/boutique/';
          const out = 'audit-output';

          function ancestry(el) {
            const rows = [];
            let cur = el;
            for (let i = 0; cur && i < 7; i += 1, cur = cur.parentElement) {
              rows.push({
                tag: cur.tagName,
                id: cur.id || '',
                className: typeof cur.className === 'string' ? cur.className : '',
                data: Object.fromEntries([...cur.attributes]
                  .filter(a => a.name.startsWith('data-'))
                  .map(a => [a.name, a.value])),
              });
            }
            return rows;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'fr-FR' });
            const page = await context.newPage();
            const badResponses = [];
            page.on('response', res => {
              if (res.status() >= 400) badResponses.push({ status: res.status(), url: res.url(), method: res.request().method() });
            });

            const nav = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForLoadState('networkidle', { timeout: 20000 }).catch(() => {});
            await page.waitForSelector('.k-card', { timeout: 45000 });
            await page.waitForTimeout(1200);

            const api = await page.evaluate(async () => {
              async function get(offset) {
                const r = await fetch(`/api/products?limit=1000&offset=${offset}`, { credentials: 'same-origin' });
                return { status: r.status, body: await r.json() };
              }
              const p0 = await get(0);
              const p1 = await get(1000);
              const all = [...(p0.body.products || []), ...(p1.body.products || [])];
              const v2 = all.filter(p => String(p.product_ref || '').startsWith('SHOWCASE-V2-'));
              const cricket = all.filter(p => /cricket helmet/i.test(String(p.name || ''))).map(p => ({
                id: p.id,
                ref: p.product_ref,
                name: p.name,
                description: p.description,
                category: p.category,
                subcategory: p.subcategory,
                image_url: p.image_url,
                images: p.images,
              }));
              return {
                page0: { status: p0.status, count: (p0.body.products || []).length, total: p0.body.total },
                page1: { status: p1.status, count: (p1.body.products || []).length, total: p1.body.total },
                combined: all.length,
                v2Count: v2.length,
                v2Min: v2[0]?.product_ref || null,
                v2Max: v2[v2.length - 1]?.product_ref || null,
                cricket,
              };
            });

            const dom = await page.evaluate(() => {
              const cards = [...document.querySelectorAll('.k-card')].slice(0, 12).map((card, index) => ({
                index,
                id: card.getAttribute('data-id'),
                name: card.querySelector('.k-card-name')?.textContent?.trim() || '',
                description: card.querySelector('.k-card-desc')?.textContent?.trim() || '',
                imageSrc: card.querySelector('img')?.currentSrc || card.querySelector('img')?.src || '',
                ancestry: (() => {
                  const rows = [];
                  let cur = card;
                  for (let i = 0; cur && i < 7; i += 1, cur = cur.parentElement) {
                    rows.push({
                      tag: cur.tagName,
                      id: cur.id || '',
                      className: typeof cur.className === 'string' ? cur.className : '',
                      data: Object.fromEntries([...cur.attributes]
                        .filter(a => a.name.startsWith('data-'))
                        .map(a => [a.name, a.value])),
                    });
                  }
                  return rows;
                })(),
              }));

              const available = [...document.querySelectorAll('h1,h2,h3,[role="heading"]')]
                .filter(el => el.textContent.trim() === 'Disponible ici')
                .map((el, index) => {
                  const r = el.getBoundingClientRect();
                  const s = getComputedStyle(el);
                  const ancestors = [];
                  let cur = el;
                  for (let i = 0; cur && i < 6; i += 1, cur = cur.parentElement) {
                    ancestors.push({ tag: cur.tagName, id: cur.id || '', className: typeof cur.className === 'string' ? cur.className : '' });
                  }
                  return {
                    index,
                    visible: r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden',
                    rect: { x: r.x, y: r.y, width: r.width, height: r.height },
                    ancestors,
                  };
                });

              const cricketCard = [...document.querySelectorAll('.k-card')]
                .find(card => /cricket helmet/i.test(card.querySelector('.k-card-name')?.textContent || ''));

              return {
                cards,
                disponibleIci: available,
                cricketCard: cricketCard ? {
                  id: cricketCard.getAttribute('data-id'),
                  html: cricketCard.outerHTML.slice(0, 3500),
                } : null,
              };
            });

            await page.screenshot({ path: `${out}/mobile-diagnostic.png`, fullPage: false });

            const uniqueBad = [...new Map(badResponses.map(x => [`${x.status}|${x.method}|${x.url}`, x])).values()];
            const result = {
              httpStatus: nav?.status() || null,
              finalUrl: page.url(),
              api,
              dom,
              badResponses: uniqueBad,
            };
            fs.writeFileSync(`${out}/diagnostic.json`, JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));

            await context.close();
            await browser.close();
          })().catch(err => { console.error(err); process.exitCode = 1; });
          NODE

          node audit-output/diagnose.cjs | tee audit-output/diagnostic.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-v2-visual-diagnostic
          path: public/boutique/audit-output/
          retention-days: 7
