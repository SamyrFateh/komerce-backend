name: Canonical Action Center Cutover 4N

on:
  push:
    branches:
      - ci/canonical-action-center-cutover-4n

permissions:
  contents: write

jobs:
  build-prove-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preserve implementation script
        run: cp scripts/ci-action-center-cutover-4n.py /tmp/ci-action-center-cutover-4n.py

      - name: Build route-only cutover from current main
        run: |
          git config user.name "SamyrFateh"
          git config user.email "fatehsamyr@gmail.com"
          git fetch origin main
          git checkout -B feat/canonical-action-center-cutover-4n origin/main
          python3 /tmp/ci-action-center-cutover-4n.py
          git status --short

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prove Action Center cutover and decision-signals truth
        run: |
          npx jest \
            tests/unit/bootstrap-html-routes.test.js \
            tests/unit/canonical-action-center-boundary.test.js \
            tests/unit/radar-queries.test.js \
            tests/unit/signals.test.js \
            tests/unit/signal-service.test.js \
            tests/unit/signal-admin-service.test.js \
            tests/unit/action-center-workspace.test.js \
            tests/unit/admin-action-center-route.test.js \
            tests/unit/require-decision-signal-global-authority.test.js \
            tests/unit/signals-error-propagation.test.js \
            tests/unit/action-center-migration-contract.test.js \
            tests/unit/canonical-dashboard-boundary.test.js \
            --runInBand

      - name: Quality and card-first gates
        run: |
          npm run quality:gate
          npm run feature:registry
          npm run gate:schema
          npm run gate:docs-lint

      - name: Stage product slice for touched gates
        run: |
          git add \
            bootstrap/html-routes.js \
            tests/unit/bootstrap-html-routes.test.js \
            tests/unit/canonical-action-center-boundary.test.js \
            docs/contract/ACTION_CENTER_4G.md \
            docs/contract/DECISION_SIGNALS_TRUTH_4H.md \
            docs/contract/ACTION_CENTER_CUTOVER_4N.md \
            docs/contract/DASHBOARD_CUTOVER_2.md \
            public/dashboards/canonical/README.md

      - name: Scoped canonical proof
        run: |
          npm run gate:touched-files
          npm run gate:touched-tests
          npm run gate:feature-audit
          npm run dashboards:360:check
          npm run business-graph:check
          npm run business-graph:ratchet-check
          npm run business-graph:disposition-check
          npm run feature:360:check
          npm run security:360:check

      - name: Ensure helper files stay out of product branch
        run: |
          test ! -e scripts/ci-action-center-cutover-4n.py
          test ! -e .github/workflows/canonical-action-center-cutover-4n.yml

      - name: Commit and push product branch
        run: |
          git add \
            bootstrap/html-routes.js \
            tests/unit/bootstrap-html-routes.test.js \
            tests/unit/canonical-action-center-boundary.test.js \
            docs/contract/ACTION_CENTER_4G.md \
            docs/contract/DECISION_SIGNALS_TRUTH_4H.md \
            docs/contract/ACTION_CENTER_CUTOVER_4N.md \
            docs/contract/DASHBOARD_CUTOVER_2.md \
            public/dashboards/canonical/README.md
          git commit -m "feat(canonical): converge action center entrypoints"
          git push --force-with-lease origin HEAD:refs/heads/feat/canonical-action-center-cutover-4n
