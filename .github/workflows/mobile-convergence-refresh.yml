name: Mobile convergence generated refresh

on:
  push:
    branches:
      - style/mobile-boutique-convergence

permissions:
  contents: write

jobs:
  refresh-generated-artifacts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: style/mobile-boutique-convergence
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild Boutique CSS bundles
        run: npm run build

      - name: Refresh business graph
        run: npm run business-graph:gen

      - name: Refresh Feature 360 projections
        run: npm run feature:360:refresh-global

      - name: Commit generated artifacts and remove helper workflow
        run: |
          rm .github/workflows/mobile-convergence-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh generated boutique artifacts"
          git push origin HEAD:style/mobile-boutique-convergence
