# Owner-only G6-A diagnosis. SQL is read-only, no product/price/order writers.
name: G6 A — diagnose buyer price snapshot (staging READ ONLY)
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-g6-a-price-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] g6-a-price-snapshot-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      PGOPTIONS: '-c default_transaction_read_only=on'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pin actual staging and prove target database
        run: |
          node scripts/recette/resolve-staging-deploy-pin.js
          node scripts/recette/target-guard.js
      - name: Count exact product/market/price join rows without writes
        run: node scripts/recette/g6-a-price-snapshot-diagnostic.js
      - name: Archive diagnostic (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-a-price-diagnostic-${{ github.run_id }}
          path: |
            test-results/g6-a-diagnosis/report.json
            test-results/hub-v1-http/deploy-pin.json
          if-no-files-found: warn
          retention-days: 21
