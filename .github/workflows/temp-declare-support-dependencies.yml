name: Temporary declare support dependencies

on:
  push:
    branches:
      - governance/declare-support-dependencies

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/declare-support-dependencies
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply support dependency declarations
        run: node scripts/temp-declare-support-dependencies.js
      - name: Remove temporary tooling before canonical generation
        run: rm .github/workflows/temp-declare-support-dependencies.yml scripts/temp-declare-support-dependencies.js
      - name: Refresh canonical governance projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Prove support seams are closed
        shell: bash
        run: |
          npm run business-graph:check
          node scripts/business-graph-ratchet-check.js
          npm run feature:360:check
          node scripts/feature-guard.js --strict
          node - <<'NODE'
          const m = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const debt = m.drifts.debt || [];
          const observed = debt.filter(x => x.type === 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY');
          const supportLeaks = observed.filter(x => {
            const s = JSON.stringify(x);
            return s.includes('-> infrastructure') || s.includes('-> platform-ops') ||
              s.includes('"to":"infrastructure"') || s.includes('"to":"platform-ops"');
          });
          const allowedUnregistered = supportLeaks.filter(x => {
            const s = JSON.stringify(x);
            return s.includes('decision-signals') && s.includes('infrastructure');
          });
          console.log({ summary: m.drifts.summary, observedUndeclared: observed.length, supportLeaks: supportLeaks.length, allowedUnregistered: allowedUnregistered.length });
          if (supportLeaks.length !== 1 || allowedUnregistered.length !== 1) {
            throw new Error(`unexpected support dependency leaks remain: ${JSON.stringify(supportLeaks)}`);
          }
          if (m.drifts.summary.debt !== 65) throw new Error(`expected debt=65, got ${m.drifts.summary.debt}`);
          if (observed.length !== 39) throw new Error(`expected observed undeclared=39, got ${observed.length}`);
          if (m.drifts.summary.expectedTopology !== 12 || m.drifts.summary.generatorLimitations !== 8) {
            throw new Error('non-debt semantic counts changed unexpectedly');
          }
          NODE
          git diff --check
      - name: Commit final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): declare observed support dependencies"
          git push origin HEAD:governance/declare-support-dependencies
