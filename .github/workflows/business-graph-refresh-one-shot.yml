name: Business graph refresh one-shot

on:
  push:
    branches:
      - feat/discovery-product-staging

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discovery-product-staging
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Declare Discovery staging cross-feature consumers
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'features/providers-services.feature.js';
          let s = fs.readFileSync(file, 'utf8');
          const anchor = "      'market — référentiel markets, résolution code -> id côté serveur',\n";
          if (!s.includes("'local-stock —")) {
            if (!s.includes(anchor)) throw new Error('providers-services consumes anchor not found');
            s = s.replace(anchor, anchor +
              "      'catalog — Golden Product canonique utilisé par le seed Discovery staging via son owner officiel',\n" +
              "      'local-stock — déclaration et exposition du stock local Product Komerce du seed Discovery staging via les primitives owner',\n");
          }
          fs.writeFileSync(file, s);
          NODE

      - name: Regenerate Business Feature Graph projections
        run: |
          node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
          node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique
          git diff --check

      - name: Commit regenerated canonical projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/providers-services.feature.js docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md
          if git diff --cached --quiet; then
            echo "No generated drift to commit."
            exit 0
          fi
          git commit -m "fix(governance): refresh business graph projections"
          git push origin HEAD:feat/discovery-product-staging
