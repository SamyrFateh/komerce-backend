name: G6 ergonomie UX1 — Hub read-only live refresh Chromium
on:
  pull_request:
    paths:
      - 'public/dashboards/canonical/js/operations-workspace.js'
      - 'tests/e2e/hub-live-execution.spec.js'
      - 'tests/unit/canonical-operations-workspace.test.js'
      - '.github/workflows/g6-ergonomie-ux1-chromium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux1-chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure origin/main available for pr:preflight
        run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run pr:preflight
      - run: npx playwright install --with-deps chromium
      - name: Local mock Chromium 20 repeated runs, no staging
        run: npx playwright test tests/e2e/hub-live-execution.spec.js --grep 'UX1 — nouvelle ligne fournisseur' --repeat-each=20 --workers=1
      - name: Verify UX1 before/after screenshots exist
        run: test -s test-artifacts/ux1/ux1-avant.png && test -s test-artifacts/ux1/ux1-apres.png
      - name: UX1 targeted unit tests
        run: npx jest --config jest.unit.config.js --runInBand tests/unit/canonical-operations-workspace.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-ergonomie-ux1-before-after-${{ github.run_id }}
          path: test-artifacts/ux1/
          retention-days: 14
          if-no-files-found: error
