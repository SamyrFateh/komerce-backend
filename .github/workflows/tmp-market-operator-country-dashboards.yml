name: Temporary market operator dashboard patch

on:
  push:
    branches:
      - feat/market-operator-country-dashboards

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-operator-country-dashboards
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/tmp-market-operator-country-dashboards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/admin-dashboard-market.js tests/unit/admin-dashboard-market.test.js features/auth-identity.feature.js db/schema.sql docs/contract/DASHBOARD_MARKET_SCOPE_2C.md migrations/158_market_operator_user_role.sql
          git commit -m "feat(dashboard): add market operator country cockpit access"
          git push origin HEAD:feat/market-operator-country-dashboards
