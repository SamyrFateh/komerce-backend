# Exact owner-only trigger; staging is deliberately disposable. No provider or payment is charged.
name: G6 KM — real buyer OTP and canonical order Chromium
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-g6-km-buyer-real-otp-order
  cancel-in-progress: false
jobs:
  order:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] g6-km-real-buyer-otp-order'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pin actual Railway runtime and verify disposable staging DB
        run: |
          node scripts/recette/resolve-staging-deploy-pin.js
          node scripts/recette/target-guard.js
      - name: Prepare real Chromium (headless shell, no Ubuntu apt)
        timeout-minutes: 5
        run: npx playwright install chromium --only-shell
      - name: Play OTP in Chromium then submit ONE true cash order (no provider)
        run: node scripts/recette/g6-p2-buyer-order-real-chromium.js
      - name: Archive browser screenshots and scrubbed independent DB proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-km-real-buyer-order-${{ github.run_id }}
          path: |
            test-results/g6-p2-buyer-order/
            test-results/hub-v1-http/deploy-pin.json
          if-no-files-found: warn
          retention-days: 21
