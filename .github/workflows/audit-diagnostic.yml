name: Root Audit Diagnostic

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run root audit gate
        run: |
          set -o pipefail
          npm run audit:gate 2>&1 | tee npm-audit-root.log
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-audit-${{ github.run_id }}
          path: npm-audit-root.log
          retention-days: 1
      - name: Publish audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = "success" ]; then state=success; fi
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"root-audit-diagnostic\",\"description\":\"Root npm audit diagnostic complete\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
