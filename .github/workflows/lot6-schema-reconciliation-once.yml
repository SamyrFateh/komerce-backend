name: Lot 6 schema reconciliation once

on:
  push:
    branches:
      - fix/lot6-schema-reconciliation
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lot6-schema-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-generated:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lot6-schema-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconcile verified schema and feature ownership
        run: node scripts/lot6-reconcile-live-schema.js
      - name: Commit generated reconciliation when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SCHEMA.md features/platform-ops.feature.js features/economic-engine.feature.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Generated reconciliation already current."
            exit 0
          fi
          git commit --no-verify -m "docs(db): reconcile verified live schema and ownership"
          git push origin HEAD:fix/lot6-schema-reconciliation

  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgres://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: lot6-ci-secret-not-for-prod
      ADMIN_PASSWORD: lot6-ci-admin
      QR_SECRET: lot6-ci-qr-secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
      KOMERCE_DISABLE_CRONS: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch comparison base
        run: git fetch origin main:refs/remotes/origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load canonical base schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Baseline before migrations 121 and 122
        run: |
          mkdir -p /tmp/lot6
          mv migrations/121_exceptional_pickup_authorization.sql /tmp/lot6/
          mv migrations/122_cleanup_realdb_test_schema_residue.sql /tmp/lot6/
          node scripts/run-migrations.js --baseline

      - name: Apply migration 121 through the real runner
        run: |
          mv /tmp/lot6/121_exceptional_pickup_authorization.sql migrations/
          node scripts/run-migrations.js

      - name: Reproduce the two verified live residues safely
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE outbox_events (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            event_type text NOT NULL,
            payload jsonb NOT NULL,
            created_at timestamptz DEFAULT NOW(),
            processed_at timestamptz,
            attempts int DEFAULT 0,
            last_error text
          );
          INSERT INTO outbox_events (event_type, payload)
          VALUES ('order.created', '{"reason":"r6-proof"}'::jsonb);

          INSERT INTO pricing_matrices_audit
            (matrix_type, category, old_value, new_value, change_reason)
          VALUES
            ('dims', 'maison', '{"length_cm":1}'::jsonb, '{"length_cm":2}'::jsonb, 'canonical row');

          ALTER TABLE pricing_matrices_audit RENAME TO pricing_matrices_audit_hidden;

          CREATE TABLE pricing_matrices_audit (
            id SERIAL PRIMARY KEY,
            matrix_type VARCHAR(20) NOT NULL CHECK (matrix_type IN ('taxes', 'dims')),
            category VARCHAR(50) NOT NULL,
            old_value JSONB NOT NULL,
            new_value JSONB NOT NULL,
            changed_by UUID REFERENCES users(id) ON DELETE SET NULL,
            change_reason TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE INDEX idx_pma_created ON pricing_matrices_audit(created_at DESC);
          CREATE INDEX idx_pma_matrix_cat ON pricing_matrices_audit(matrix_type, category);
          INSERT INTO pricing_matrices_audit
            (matrix_type, category, old_value, new_value, change_reason)
          VALUES
            ('taxes', 'electronique', '{"tva_pct":0.1}'::jsonb, '{"tva_pct":0.2}'::jsonb, 'canonical row 2');
          SQL

      - name: Apply migration 122 through the real runner
        run: |
          mv /tmp/lot6/122_cleanup_realdb_test_schema_residue.sql migrations/
          node scripts/run-migrations.js

      - name: Prove runner idempotency
        run: node scripts/run-migrations.js

      - name: Assert Lot 5 and cleanup schema objects
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.user_pickup_authorizations') IS NULL THEN
              RAISE EXCEPTION 'missing user_pickup_authorizations';
            END IF;
            IF to_regclass('public.outbox_events') IS NOT NULL THEN
              RAISE EXCEPTION 'outbox_events residue remains';
            END IF;
            IF to_regclass('public.pricing_matrices_audit_hidden') IS NOT NULL THEN
              RAISE EXCEPTION 'pricing_matrices_audit_hidden residue remains';
            END IF;
            IF to_regclass('public.pricing_matrices_audit') IS NULL THEN
              RAISE EXCEPTION 'canonical pricing_matrices_audit missing';
            END IF;
            IF (SELECT COUNT(*) FROM pricing_matrices_audit) <> 2 THEN
              RAISE EXCEPTION 'pricing audit rows were not conservatively merged';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='orders'
                AND column_name='exceptional_pickup_attempts'
            ) THEN RAISE EXCEPTION 'missing orders.exceptional_pickup_attempts'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='scans'
                AND column_name='pickup_method'
            ) THEN RAISE EXCEPTION 'missing scans.pickup_method'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='chk_scans_exceptional_pickup_proof'
                AND conrelid='public.scans'::regclass
            ) THEN RAISE EXCEPTION 'missing exceptional pickup proof constraint'; END IF;
          END
          $$;
          SQL

      - name: REAL_DB residue regression proofs
        run: >-
          npx jest
          tests/integration/r6-crash-window.test.js
          tests/integration/txg01-pricing-matrices.test.js
          --runInBand --forceExit --detectOpenHandles

      - name: Lot 5 unit proof
        run: >-
          npx jest
          tests/unit/auth-route.test.js
          tests/unit/name-normalize.test.js
          tests/unit/pickup-authorization-service.test.js
          tests/unit/pickup-secret-service.test.js
          tests/unit/pickup-secret.test.js
          --runInBand --forceExit --detectOpenHandles

      - name: PostgreSQL pickup race proof
        run: >-
          npx jest
          tests/e2e-api/orders.pickup-code-vs-authorized-name.e2e.test.js
          --runInBand --forceExit --detectOpenHandles

      - name: Schema drift gate
        run: node scripts/arch-schema-drift-check.js --report

      - name: Map and governance gates
        run: npm run map:check
