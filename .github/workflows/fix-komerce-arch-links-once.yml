name: Fix Komerce Architecture Links Once

on:
  push:
    paths:
      - .github/workflows/fix-komerce-arch-links-once.yml
      - scripts/fix-komerce-arch-links.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix architecture links
        run: node scripts/fix-komerce-arch-links.js

      - name: Commit architecture link fixes
        run: |
          if git diff --quiet; then
            echo "No architecture link changes to commit."
            exit 0
          fi
          git config user.name "komerce-arch-bot"
          git config user.email "komerce-arch-bot@users.noreply.github.com"
          git add \
            public/boutique/js/b-cart.js \
            public/boutique/js/b-checkout.js \
            public/boutique/js/b-catalog.js \
            public/boutique/js/b-subcat.js \
            public/boutique/js/b-share-cart.js \
            public/boutique/js/b-nav.js \
            scripts/apply-komerce-arch-headers.js
          git commit -m "Normalize Komerce architecture links"
          git push
