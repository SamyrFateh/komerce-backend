name: Classify Boutique B3 Specificity Debt

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b3-specificity

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b3-specificity
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Classify media contexts and delivery order for specificity debt
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const postcss = require('./public/boutique/node_modules/postcss');
          const { BUNDLES } = require('./public/boutique/scripts/css-bundles');

          const root = path.resolve('public/boutique');
          const baseline = JSON.parse(fs.readFileSync(path.join(root, 'scripts/.css-specificity-guard-baseline.json'), 'utf8'));
          if (baseline.total !== 86 || baseline.keys.length !== 86) throw new Error(`Expected specificity baseline 86, got ${baseline.total}/${baseline.keys.length}`);

          const raw = cp.execFileSync('node', ['scripts/css-specificity-guard.js'], { cwd: root, encoding: 'utf8', maxBuffer: 20 * 1024 * 1024 });
          const clean = raw.replace(/\x1b\[[0-9;]*m/g, '');
          const lines = clean.split(/\r?\n/);
          const physical = [];
          for (let i = 0; i < lines.length; i++) {
            const m = lines[i].match(/^🔴 \.([^ ]+) — propriété (.+)$/);
            if (!m) continue;
            const win = (lines[i + 1] || '').match(/^\s*gagnant\s+([^:]+):L(\d+)\s+(.+)$/);
            const winVal = (lines[i + 2] || '').match(/^\s*→\s+(.+?)\s+\(spécificité/);
            const lose = (lines[i + 3] || '').match(/^\s*perdant\s+([^:]+):L(\d+)\s+(.+)$/);
            const loseVal = (lines[i + 4] || '').match(/^\s*→\s+(.+?)\s+\(spécificité/);
            if (!win || !lose || !winVal || !loseVal) throw new Error(`Cannot parse finding at output line ${i + 1}`);
            physical.push({
              globalClass:m[1], prop:m[2],
              winnerFile:win[1], winnerLine:Number(win[2]), winnerSelector:win[3], winnerValue:winVal[1].trim(),
              loserFile:lose[1], loserLine:Number(lose[2]), loserSelector:lose[3], loserValue:loseVal[1].trim(),
            });
          }
          const semantic = new Map();
          for (const f of physical) {
            const key=[f.globalClass,f.winnerSelector,f.loserSelector,f.prop].join('|||');
            if (!semantic.has(key)) semantic.set(key,f);
          }
          if (semantic.size !== 86) throw new Error(`Expected 86 semantic findings, got ${semantic.size}`);
          console.log(`PHYSICAL_FINDINGS=${physical.length}`);
          console.log(`SEMANTIC_FINDINGS=${semantic.size}`);

          let addHits=0, removeToggleHits=0;
          const jsDir=path.join(root,'js');
          for (const file of fs.readdirSync(jsDir).filter(f=>f.endsWith('.js'))) {
            const content=fs.readFileSync(path.join(jsDir,file),'utf8');
            addHits += (content.match(/classList\.add\(\s*['"]k-home-premium-v1['"]/g)||[]).length;
            removeToggleHits += (content.match(/classList\.(?:remove|toggle)\([^\n]*['"]k-home-premium-v1['"]/g)||[]).length;
          }
          console.log(`PREMIUM_ADD_HITS=${addHits}`);
          console.log(`PREMIUM_REMOVE_TOGGLE_HITS=${removeToggleHits}`);
          if (addHits < 2 || removeToggleHits !== 0) throw new Error('k-home-premium-v1 lifecycle no longer matches permanent-class proof');

          const distOrder=['base.css','components.css','desktop.css'];
          const sourceRank=new Map();
          for (let di=0; di<distOrder.length; di++) {
            const bundle=BUNDLES.find(b=>b.out===distOrder[di]);
            bundle.files.forEach((name,si)=>sourceRank.set(`public/boutique/css/${name}.css`, di*1000+si));
          }

          const astCache=new Map();
          function normalizeSelector(s){ return s.replace(/\s+/g,' ').trim(); }
          function selectorMembers(rule){ return (rule.selectors || [rule.selector]).map(normalizeSelector); }
          function loadAst(file){
            if (!astCache.has(file)) {
              const abs=path.resolve(file);
              astCache.set(file,postcss.parse(fs.readFileSync(abs,'utf8'),{from:file}));
            }
            return astCache.get(file);
          }
          function mediaOf(rule){
            const chain=[];
            let n=rule.parent;
            while(n&&n.type!=='root'){
              if(n.type==='atrule'&&n.name==='media') chain.unshift(`@media ${n.params}`);
              n=n.parent;
            }
            return chain.length?chain.join(' && '):'global';
          }
          function ruleMeta(file,line,selector){
            const ast=loadAst(file);
            const target=normalizeSelector(selector);
            const candidates=[];
            ast.walkRules(rule=>{ if(selectorMembers(rule).includes(target)) candidates.push(rule); });
            if(!candidates.length) throw new Error(`Rule not found: ${file}:${line} ${selector}`);
            const exact=candidates.filter(rule=>rule.source?.start?.line===line);
            const chosen=exact.length===1 ? exact[0] : candidates.sort((a,b)=>Math.abs((a.source?.start?.line||0)-line)-Math.abs((b.source?.start?.line||0)-line))[0];
            return {media:mediaOf(chosen),line:chosen.source.start.line,grouped:selectorMembers(chosen).length>1};
          }

          function stripGlobal(selector,className){
            const token='.'+className;
            let out=selector.split(token).join('');
            out=out.replace(/^(html|body)\s+/,'');
            return normalizeSelector(out);
          }
          function deliveredLater(f,wMeta,lMeta){
            const wr=sourceRank.get(f.winnerFile), lr=sourceRank.get(f.loserFile);
            if(wr==null||lr==null) throw new Error(`Missing source rank for ${f.winnerFile} or ${f.loserFile}`);
            if(wr!==lr) return wr>lr;
            return wMeta.line>lMeta.line;
          }

          const plans=new Map();
          const mediaPairs=new Map();
          const families=new Map();
          const needs=[];
          function family(selector){
            if(selector.includes('#k-subcats-wrap')||selector.includes('.k-subcutout-')) return 'subcats-navigation';
            if(selector.includes('.k-chip')||selector.includes('.k-cats')||selector.includes('.k-cat')) return 'categories-chips';
            if(selector.includes('.k-hero')) return 'hero';
            if(selector.includes('.k-header')||selector.includes('.k-logo')||selector.includes('.k-search')) return 'header-search';
            if(selector.includes('.k-sec-header')) return 'section-header';
            if(selector==='body'||selector.includes('modal-open')) return 'modal-state';
            return 'other';
          }

          for(const [key,f] of semantic){
            const wMeta=ruleMeta(f.winnerFile,f.winnerLine,f.winnerSelector);
            const lMeta=ruleMeta(f.loserFile,f.loserLine,f.loserSelector);
            const pair=`${wMeta.media} -> ${lMeta.media}`;
            mediaPairs.set(pair,(mediaPairs.get(pair)||0)+1);
            families.set(family(f.winnerSelector),(families.get(family(f.winnerSelector))||0)+1);

            if(f.globalClass==='modal-open'){
              plans.set('reviewed-transient',(plans.get('reviewed-transient')||0)+1);
              continue;
            }
            const stripped=stripGlobal(f.winnerSelector,f.globalClass);
            if(stripped!==normalizeSelector(f.loserSelector)) throw new Error(`Strip mismatch for ${key}: ${stripped} != ${f.loserSelector}`);
            const sameMedia=wMeta.media===lMeta.media;
            const later=deliveredLater(f,wMeta,lMeta);
            let plan;
            if(sameMedia) plan='strip+remove-loser';
            else if(later) plan='strip-only-different-media';
            else plan='needs-rehome';
            plans.set(plan,(plans.get(plan)||0)+1);
            if(plan==='needs-rehome') needs.push({...f,wMedia:wMeta.media,lMedia:lMeta.media,wResolvedLine:wMeta.line,lResolvedLine:lMeta.line,wGrouped:wMeta.grouped,lGrouped:lMeta.grouped});
          }

          console.log('\n=== MEDIA PAIRS ===');
          [...mediaPairs.entries()].sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>console.log(`${v} ${k}`));
          console.log('\n=== SAFE CONSOLIDATION PLAN ===');
          [...plans.entries()].sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>console.log(`${v} ${k}`));
          console.log('\n=== FAMILIES ===');
          [...families.entries()].sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>console.log(`${v} ${k}`));
          console.log(`\nNEEDS_REHOME=${needs.length}`);
          needs.forEach(f=>console.log(JSON.stringify(f)));
          NODE
