name: Temporary audit remaining dependencies

on:
  push:
    branches:
      - governance/audit-remaining-dependencies

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Print remaining observed undeclared dependencies with evidence
        run: |
          node - <<'NODE'
          const graph = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const rows = (graph.drifts.debt || []).filter(x => x.type === 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY');
          console.log(`COUNT=${rows.length}`);
          for (const row of rows) {
            console.log('---');
            console.log(JSON.stringify(row, null, 2));
          }
          NODE
