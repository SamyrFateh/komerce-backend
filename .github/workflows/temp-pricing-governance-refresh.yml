name: Temporary pricing governance refresh

on:
  push:
    branches:
      - feat/economic-workshop-market-contribution-ui

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economic-workshop-market-contribution-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regenerate committed governance projections
        run: |
          node scripts/contract-generate.js
          node scripts/gen-security-360.js
      - name: Commit generated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contract/openapi.json docs/contract/DEBT.md docs/SECURITY_360.json docs/SECURITY_360.md
          if git diff --cached --quiet; then
            echo "No generated projection changes"
            exit 0
          fi
          git commit -m "chore(governance): refresh pricing projections"
          git push origin HEAD:feat/economic-workshop-market-contribution-ui
