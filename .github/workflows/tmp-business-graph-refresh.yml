name: Temporary business graph refresh

on:
  push:
    branches:
      - feat/canonical-costing-cutover

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-costing-cutover
      - name: Generate business graph artifacts
        run: node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(governance): refresh business feature graph"
          git push origin HEAD:feat/canonical-costing-cutover
