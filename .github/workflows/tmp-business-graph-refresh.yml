name: Temporary business graph refresh

on:
  push:
    branches:
      - feat/canonical-costing-cutover

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate business graph artifacts
        run: node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: business-graph-refresh
          path: |
            docs/BUSINESS_FEATURE_GRAPH.json
            docs/BUSINESS_FEATURE_GRAPH.md
            docs/O6_INVENTORY.md
          if-no-files-found: error
