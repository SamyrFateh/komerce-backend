name: Mode Subcategory Cutouts Validate Temp

on:
  push:
    branches:
      - feat/mode-subcategory-real-cutouts-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mode-subcategory-real-cutouts-v2
          fetch-depth: 0

      - name: Patch contract test for direct Mode cutouts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/boutique/tests/unit/category-cutout-navigation.test.js')
          s = p.read_text()
          anchor = "const sw = fs.readFileSync(path.resolve(ROOT, '../sw.js'), 'utf8');\n"
          extra = """const modeFemme = fs.readFileSync(path.join(ROOT, 'categories/sub-mode-femme-v4.svg'), 'utf8');
          const modeHomme = fs.readFileSync(path.join(ROOT, 'categories/sub-mode-homme-v4.svg'), 'utf8');
          const modeEnfant = fs.readFileSync(path.join(ROOT, 'categories/sub-mode-enfant-v4.svg'), 'utf8');
          const modeBeaute = fs.readFileSync(path.join(ROOT, 'categories/sub-mode-beaute-v4.svg'), 'utf8');
          """
          if extra not in s:
              s = s.replace(anchor, anchor + extra)
          s = s.replace("expect(visuals).toContain(\"Femme: 'showcase-mode:1:0'\");", "expect(visuals).toContain(\"Femme: 'mode-cutout:femme'\");")
          s = s.replace("expect(visuals).toContain(\"Homme: 'showcase-mode:2:0'\");", "expect(visuals).toContain(\"Homme: 'mode-cutout:homme'\");")
          s = s.replace("expect(visuals).toContain(\"Enfant: 'showcase-mode:0:1'\");", "expect(visuals).toContain(\"Enfant: 'mode-cutout:enfant'\");")
          s = s.replace("expect(visuals).toContain(\"Beauté: 'showcase-mode:1:1'\");", "expect(visuals).toContain(\"Beauté: 'mode-cutout:beaute'\");")
          s = s.replace("expect(visuals).toContain('renderCategoryCutout');", "expect(visuals).toContain('renderCategoryCutout');\n    expect(visuals).toContain('renderModeSubcategoryCutout');\n    expect(visuals).toContain(\"femme: '/boutique/categories/sub-mode-femme-v4.svg?v=1'\");\n    expect(visuals).toContain(\"homme: '/boutique/categories/sub-mode-homme-v4.svg?v=1'\");\n    expect(visuals).toContain(\"enfant: '/boutique/categories/sub-mode-enfant-v4.svg?v=1'\");\n    expect(visuals).toContain(\"beaute: '/boutique/categories/sub-mode-beaute-v4.svg?v=1'\");")
          s = s.replace("expect(visuals).toContain(\"visual.startsWith('showcase-mode:')\");", "expect(visuals).toContain(\"visual.startsWith('mode-cutout:')\");\n    expect(visuals).toContain(\"visual.startsWith('showcase-mode:')\");")
          marker = "  it('utilise un contraste gris franc et les cutouts dans les titres de section', () => {"
          guard = """  it('garde quatre palettes Mode distinctes sans vert de marque dans les objets', () => {
              expect(modeFemme).toContain('#D51F3E');
              expect(modeHomme).toContain('#203C68');
              expect(modeEnfant).toContain('#2388E8');
              expect(modeEnfant).toContain('#FFD84D');
              expect(modeBeaute).toContain('#F6B691');
              expect(modeBeaute).toContain('#FF4057');
              [modeFemme, modeHomme, modeEnfant, modeBeaute].forEach((asset) => {
                expect(asset).toContain('<svg');
                expect(asset).not.toMatch(/#2A7A3E|#64AF5A|green/i);
              });
            });

          """
          if guard not in s:
              s = s.replace(marker, guard + marker)
          p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install Boutique
        working-directory: public/boutique
        run: npm ci

      - name: Contract test
        working-directory: public/boutique
        run: npx jest tests/unit/category-cutout-navigation.test.js --runInBand

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Chromium visual audit
        shell: bash
        run: |
          python3 -m http.server 4173 --directory public >/tmp/komerce-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cd public/boutique
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 700 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/boutique/index.html', { waitUntil: 'domcontentloaded' });
          await page.evaluate(async () => {
            const mod = await import('/boutique/js/render/category-shelf-visuals.js');
            document.documentElement.classList.add('k-home-premium-v1');
            document.body.innerHTML = `<main style="padding:36px 56px;background:#fff;min-height:100vh"><section id="k-subcats-wrap" class="k-shelf-subcats"><div class="k-subcats-context k-subcutout-context"><button class="k-subcats-back k-subcutout-back"><span>Toutes les catégories</span></button><span class="k-subcats-title k-subcutout-title"><span class="k-subcats-name k-subcutout-name">Mode & Beauté</span><span class="k-subcats-count k-subcutout-count">383</span></span></div><div id="audit-rail" class="k-subcats-rail k-subcutout-rail k-desktop-rayons-rail k-subcats-visible"></div></section></main>`;
            const rail = document.getElementById('audit-rail');
            const entries = [
              ['Femme','femme'], ['Homme','homme'], ['Enfant','enfant'], ['Beauté','beaute']
            ];
            rail.innerHTML = `<button class="k-subcutout"><span class="k-subcutout-icon k-subcutout-icon--all"><svg class="k-shelf-object k-shelf-object--subcategory k-shelf-object--all" viewBox="0 0 48 48"><rect x="7" y="7" width="13" height="13" rx="3"></rect><rect x="28" y="7" width="13" height="13" rx="3"></rect><rect x="7" y="28" width="13" height="13" rx="3"></rect><rect x="28" y="28" width="13" height="13" rx="3"></rect></svg></span><span class="k-subcutout-label">Tout voir</span></button>` + entries.map(([label,key]) => `<button class="k-subcutout${label==='Enfant'?' active':''}" data-shelf-visual="mode-cutout:${key}"><span class="k-subcutout-icon">${mod.renderShelfUse(`mode-cutout:${key}`, 'k-shelf-object--subcategory')}</span><span class="k-subcutout-label">${label}</span></button>`).join('');
          });
          await page.waitForFunction(() => [...document.querySelectorAll('.k-mode-subcategory-cutout')].every(i => i.complete && i.naturalWidth > 0));
          const metrics = await page.evaluate(() => ({
            directCutouts: document.querySelectorAll('.k-mode-subcategory-cutout').length,
            atlasCutouts: document.querySelectorAll('[data-shelf-visual^="mode-cutout:"] .k-shelf-atlas-cell').length,
            sources: [...document.querySelectorAll('.k-mode-subcategory-cutout')].map(i => i.getAttribute('src')),
            colors: [...document.querySelectorAll('.k-mode-subcategory-cutout')].map(i => getComputedStyle(i).filter),
          }));
          console.log(JSON.stringify(metrics, null, 2));
          if (metrics.directCutouts !== 4 || metrics.atlasCutouts !== 0) throw new Error('Mode cutout contract not rendered directly');
          if (new Set(metrics.sources).size !== 4) throw new Error('Mode cutout sources are not distinct');
          await page.screenshot({ path: '/tmp/mode-subcategory-cutouts-v4.png', fullPage: false });
          await browser.close();
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: mode-subcategory-cutouts-v4
          path: /tmp/mode-subcategory-cutouts-v4.png
          if-no-files-found: error

      - name: Persist test and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/boutique/tests/unit/category-cutout-navigation.test.js
          git rm -f .github/workflows/mode-subcategory-cutouts-validate-temp.yml
          if ! git diff --cached --quiet; then
            git commit -m 'test(boutique): guard distinct Mode subcategory cutouts'
            git push origin HEAD:feat/mode-subcategory-real-cutouts-v2
          fi
