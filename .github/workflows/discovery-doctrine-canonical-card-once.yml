name: Discovery doctrine canonical card once

on:
  workflow_dispatch:
  push:
    branches:
      - fix/discovery-canonical-card-governance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discovery-canonical-card-governance
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch doctrine source of truth
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'docs/doctrine/DOCTRINE_DISCOVERY_LOCALE_UNIFIEE.md';
          let source = fs.readFileSync(file, 'utf8');

          const before = `### Invariant UX — One Card Contract

Sur une même surface Discovery, \`Product\`, \`Physical Offer\` et \`Service\` partagent **la même géométrie de carte**.

Le kind métier peut modifier le contenu d’un slot ; il ne peut jamais modifier le squelette de la carte.

\`\`\`text
DiscoveryCard
├── media slot
├── title slot
├── primary meta slot
├── context slot
└── action slot
\`\`\`

Les slots structurels restent présents même lorsque leur donnée est absente. Une donnée optionnelle ne doit donc jamais :`;

          const after = `### Invariant UX — One Card Contract

Sur une même surface Discovery, \`Product\`, \`Physical Offer\` et \`Service\` ne créent pas un nouveau modèle de carte : ils **réutilisent le shell visuel canonique de la Boutique Komerce**.

La référence est le Product Display Contract existant :

\`\`\`text
ProductCardViewModel
      ↓
renderProductCard()
      ↓
k-card / products.css
\`\`\`

Discovery peut ajouter des capacités et des hooks de comportement, mais ne peut jamais devenir propriétaire d’un second cadre visuel. \`.k-discovery-card\` est donc un hook de projection / interaction ; sa géométrie appartient au shell \`k-card\`.

Le kind métier peut modifier le contenu d’un slot ; il ne peut jamais modifier le squelette ni recréer \`background / border / radius / media ratio / info padding / title geometry / action placement\` dans un shell parallèle.

\`\`\`text
k-card
├── k-card-img-wrap   ← media + badge de promesse
├── k-card-info
│   ├── k-card-name
│   ├── context capability
│   └── k-card-bottom
└── k-card-add        ← action Acheter / Commander / Demander
\`\`\`

Les slots structurels restent présents même lorsque leur donnée est absente. Une donnée optionnelle ne doit donc jamais :`;

          if (!source.includes(before)) {
            throw new Error('One Card Contract doctrine anchor missing');
          }
          source = source.replace(before, after);

          const marker = `> **Même expérience ne veut pas dire même métier. Même expérience veut dire même contrat de présentation.**`;
          const strengthened = `${marker}\n\n> **Unification signifie réemploi du modèle Komerce existant, pas création d’un modèle Discovery cohérent avec lui-même.**`;
          if (!source.includes(marker)) throw new Error('Doctrine strengthening marker missing');
          source = source.replace(marker, strengthened);

          fs.writeFileSync(file, source);
          NODE

      - name: Validate doctrine lint
        run: node scripts/docs-history-lint.js --strict

      - name: Commit doctrine patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/doctrine/DOCTRINE_DISCOVERY_LOCALE_UNIFIEE.md
          if git diff --cached --quiet; then
            echo "No doctrine change to commit"
            exit 0
          fi
          git commit -m "docs(discovery): bind One Card Contract to k-card"
          git push origin HEAD:fix/discovery-canonical-card-governance
