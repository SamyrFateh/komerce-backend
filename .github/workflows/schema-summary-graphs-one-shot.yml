name: One-shot regenerate schema summary governance artifacts

on:
  push:
    branches: [fix/schema-summary-live-counts]
    paths:
      - '.github/workflows/schema-summary-graphs-one-shot.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-schema-summary-governance-secret-32chars
      NODE_ENV: test
      KOMERCE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts

      - name: Model final tree without this temporary helper
        run: rm .github/workflows/schema-summary-graphs-one-shot.yml

      - name: Regenerate canonical governance artifacts
        run: |
          npm run business-graph:gen
          npm run feature:360:refresh-global
          npm run business-graph:check
          npm run feature:360:check
          git diff --check

      - name: Publish generated docs only
        run: |
          if [ -z "$(git status --porcelain docs/)" ]; then
            echo 'No generated docs changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/
          git commit -m 'chore(governance): refresh schema summary projections'
          git push origin HEAD:fix/schema-summary-live-counts
