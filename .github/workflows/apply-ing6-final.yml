name: Apply and validate ING6 final

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnose-integration:
    if: github.event.pull_request.head.ref == 'agent/ing6-final'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: komerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/komerce_test
      JWT_SECRET: ci-test-secret-not-for-prod
      NODE_ENV: test
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ing6-final

      - name: Apply final patch and diagnostic-only test edits
        shell: bash
        run: |
          set -euo pipefail
          cat .ing6/part-* > /tmp/ing6.diff.gz.b64
          echo '6f3d029d1579ffb9821aa090d4d881622d86107af043584eb0403365a85c1bae  /tmp/ing6.diff.gz.b64' | sha256sum -c -
          base64 -d /tmp/ing6.diff.gz.b64 | gunzip > /tmp/ING6_FINAL_ALL_IN_ONE.diff
          echo '2f266afe651f96e34e8afd1a7e56b4de9044a54fa3e5516979efd3cf25190de3  /tmp/ING6_FINAL_ALL_IN_ONE.diff' | sha256sum -c -
          git apply --check /tmp/ING6_FINAL_ALL_IN_ONE.diff
          git apply /tmp/ING6_FINAL_ALL_IN_ONE.diff
          python - <<'PY'
          from pathlib import Path

          unit = Path('tests/unit/json-source-pipeline.test.js')
          text = unit.read_text()
          text = text.replace(
              "const multi = r.ready.filter((e) => e.contract.schema_version === '2');",
              "const multi = r.ready.filter((e) => {\n      const src = products.find((p) => p.id === e.diagnostics.source_id);\n      return Array.isArray(src?.images) && new Set(src.images).size > 1;\n    });"
          )
          unit.write_text(text)

          integration = Path('tests/integration/catalog-import-json.integration.test.js')
          text = integration.read_text()
          text = text.replace(
              '    expect(result.status).toBe(200);',
              "    if (result.status !== 200) console.error('ING6_RESULT_BODY', JSON.stringify(result.body));\n    expect(result.status).toBe(200);"
          )
          text = text.replace(
              '    expect(first.status).toBe(200);',
              "    if (first.status !== 200) console.error('ING6_FIRST_BODY', JSON.stringify(first.body));\n    expect(first.status).toBe(200);"
          )
          integration.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare PostgreSQL 16 with the real migration chain
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          mapfile -t migrations_to_apply < <(
            find migrations -maxdepth 1 -type f \
              | grep -E '/(10[2-9]|110)_[^/]+\.sql$' \
              | sort -V
          )
          test "${#migrations_to_apply[@]}" -gt 0
          printf 'Applying migrations:\n%s\n' "${migrations_to_apply[*]}"
          for migration in "${migrations_to_apply[@]}"; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run diagnostic integration test
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx jest tests/integration/catalog-import-json.integration.test.js --runInBand 2>&1 | tee /tmp/ing6-integration-diagnostic.log
      - name: Upload exact integration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ing6-integration-diagnostic
          path: /tmp/ing6-integration-diagnostic.log
          if-no-files-found: error
      - if: steps.integration.outcome == 'failure'
        run: exit 1
