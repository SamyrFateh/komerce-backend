name: Isolated catalog TERMIUM memory

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      checkpoint_run_id:
        description: 'Run carrying the reusable CJ Raffinerie checkpoint'
        required: false
        default: '36225161597'
      checkpoint_name:
        description: 'Checkpoint artifact name'
        required: false
        default: 'real-cj-refinery-continuation-checkpoint'
      workpack_run_id:
        description: 'Run carrying the current 974-product FR workpack'
        required: false
        default: '36239081215'
      workpack_name:
        description: 'FR workpack artifact name'
        required: false
        default: 'cj-fr-quality-workpack'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: isolated-catalog-termium-memory
  cancel-in-progress: false

jobs:
  termium-memory:
    name: TERMIUM → relevant catalog memory → enriched FR workpack
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       github.event.issue.title == '[isolated-op] catalog-termium-memory')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_real_catalog_stress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_real_catalog_stress"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: '1'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_real_catalog_stress
      PGPASSWORD: komerce

    steps:
      - name: Checkout protected main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download reusable CJ checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.checkpoint_name || 'real-cj-refinery-continuation-checkpoint' }}
          path: checkpoint
          repository: ${{ github.repository }}
          run-id: ${{ inputs.checkpoint_run_id || '36225161597' }}
          github-token: ${{ github.token }}

      - name: Restore disposable checkpoint and add terminology schema
        shell: bash
        run: |
          set -euo pipefail
          dump_file="$(find checkpoint -type f -name '*.dump' | head -1)"
          test -n "$dump_file" || { echo '::error::Checkpoint sans dump PostgreSQL'; exit 1; }
          pg_restore --clean --if-exists --no-owner --no-privileges             -h 127.0.0.1 -U komerce -d komerce_real_catalog_stress "$dump_file"
          psql -h 127.0.0.1 -U komerce -d komerce_real_catalog_stress             -v ON_ERROR_STOP=1 -f migrations/243_catalog_terminology_reference.sql

      - name: Download current FR source workpack
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.workpack_name || 'cj-fr-quality-workpack' }}
          path: workpack
          repository: ${{ github.repository }}
          run-id: ${{ inputs.workpack_run_id || '36239081215' }}
          github-token: ${{ github.token }}

      - name: Download official TERMIUM subject datasets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p termium/zips termium/raw

          download_domain() {
            local slug="$1"
            local url="$2"
            echo "Downloading TERMIUM domain: $slug"
            curl --fail --location --retry 3 --retry-delay 2 "$url" -o "termium/zips/$slug.zip"
            mkdir -p "termium/raw/$slug"
            unzip -q -o "termium/zips/$slug.zip" -d "termium/raw/$slug"
          }

          download_domain arts-recreation-sports             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-ArtsLoisirsSports-subject-ArtsRecreationSports.zip'
          download_domain construction             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-subject-construction.zip'
          download_domain electricity             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-electricite-subject_electricity.zip'
          download_domain electronics-informatics             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-ElectroniqueInformatique-subject-ElectronicsInformatics.zip'
          download_domain home-economics-accommodation             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-EconomieDomHotellerie-subject-HomeEconomicsAccommodationSc.zip'
          download_domain industries             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-subject-industries.zip'
          download_domain math-physics-natural-sciences             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-Math_Physique_ScNaturelles-Subject-Math_Physics_NaturalSc.zip'
          download_domain mechanics-heat             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-MecaniqueEtChaleur-subject-MechanicsAndHeat.zip'
          download_domain metallurgy             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-metallurgie-sbject-metallurgy.zip'
          download_domain telecommunications             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-TelecommunicationsPostes-subject-TelecommunicationsPostalService.zip'
          download_domain transport-materials-handling             'https://donnees-data.tpsgc-pwgsc.gc.ca/bt1/tp-tp/domaine-TransportManutention-subject-TransportationMaterialsHandling.zip'

          find termium/raw -type f -name '*.csv' -print | sort
          test "$(find termium/raw -type f -name '*.csv' | wc -l)" -gt 0

      - name: Import only TERMIUM references relevant to the 974-product corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/catalog-termium
          node scripts/catalog-termium-import.js             --csv-dir=termium/raw             --corpus-dir=workpack             --execute             --output=artifacts/catalog-termium/relevant-references.json             --report=artifacts/catalog-termium/report.json

          cat > artifacts/catalog-termium/ATTRIBUTION.txt <<'EOF'
          TERMIUM Plus® terminology reference data
          Source: Government of Canada Open Data
          Dataset: TERMIUM Plus®, the Government of Canada's terminology and linguistic data bank
          Licence: Open Government Licence – Canada
          Attribution: Contains information licensed under the Open Government Licence – Canada.
          Dataset URL: https://open.canada.ca/data/en/dataset/94fc74d6-9b9a-4c2e-9c6c-45a5092453aa
          Licence URL: https://open.canada.ca/en/open-government-licence-canada
          Data date used by this importer: 2026-05-04
          EOF

      - name: Re-export FR workpack with terminology hints
        shell: bash
        run: |
          set -euo pipefail
          node scripts/catalog-fr-quality-workpack.js             --limit=1000             --batch-size=40             --output-dir=artifacts/cj-fr-quality-workpack-termium

      - name: Save terminology-enriched reusable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cj-fr-quality-termium-checkpoint
          pg_dump -h 127.0.0.1 -U komerce -d komerce_real_catalog_stress -Fc             -f artifacts/cj-fr-quality-termium-checkpoint/komerce-real-catalog-termium.dump

      - name: Final safety audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const db = require('./db');
          (async () => {
            const { rows: [safety] } = await db.query(`
              SELECT COUNT(*) FILTER (WHERE p.is_active=TRUE)::int AS active,
                     COUNT(DISTINCT pme.product_id)::int AS exposed,
                     COUNT(*) FILTER (WHERE p.lifecycle_status IS DISTINCT FROM 'candidate')::int AS wrong_lifecycle
                FROM sourcing_candidates sc
                JOIN products p ON p.id=sc.product_id
                LEFT JOIN product_market_exposure pme ON pme.product_id=p.id
               WHERE sc.supplier_name='CJdropshipping'
                 AND sc.state='imported_to_catalog'
            `);
            const { rows: [memory] } = await db.query(`
              SELECT count(*)::int AS references,
                     count(DISTINCT term_en_normalized)::int AS english_terms
                FROM catalog_terminology_reference
               WHERE source='termium_plus' AND is_active=TRUE
            `);
            console.log(JSON.stringify({ safety, memory }));
            if (Number(safety.active)||Number(safety.exposed)||Number(safety.wrong_lifecycle)) {
              throw new Error('SAFETY_AUDIT_FAILED:' + JSON.stringify(safety));
            }
          })().catch(e => { console.error(e); process.exitCode=1; }).finally(() => db.pool.end());
          NODE

      - name: Upload relevant TERMIUM memory
        uses: actions/upload-artifact@v4
        with:
          name: catalog-termium-relevant-memory
          path: artifacts/catalog-termium/
          if-no-files-found: error
          retention-days: 14

      - name: Upload terminology-enriched FR workpack
        uses: actions/upload-artifact@v4
        with:
          name: cj-fr-quality-workpack-termium
          path: artifacts/cj-fr-quality-workpack-termium/
          if-no-files-found: error
          retention-days: 14

      - name: Upload terminology-enriched checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: cj-fr-quality-termium-checkpoint
          path: artifacts/cj-fr-quality-termium-checkpoint/
          if-no-files-found: error
          retention-days: 14

      - name: Close successful command issue
        if: success() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body 'TERMIUM relevant-memory import completed in disposable DB. Artifacts: catalog-termium-relevant-memory, cj-fr-quality-workpack-termium, cj-fr-quality-termium-checkpoint.'
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
