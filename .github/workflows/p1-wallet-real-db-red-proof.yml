name: P1 Wallet REAL_DB red proof — temporary

on:
  push:
    branches:
      - agent/proof-wallet-concurrency-red-20260816

permissions:
  contents: read

jobs:
  wallet-red-proof:
    name: Wallet REAL_DB expected-red proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Charger le schéma canonique de test
        run: |
          PGPASSWORD=komerce psql -h localhost -U komerce -d komerce_test -f docs/db/railway-live-schema.sql
          node scripts/ci-migrate.js
      - name: Oracle concurrence wallet — attendu rouge sans correctif
        run: node scripts/run-e2e-feature-tests.js --feature=wallet
