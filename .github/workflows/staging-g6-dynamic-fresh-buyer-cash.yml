thub.event.issue.title, '-full-M03-') && 'M03' || contains(github.event.issue.title, '-full-M02-') && 'M02' || 'M01' }}
      G6_TARGET_MARKET: ${{ contains(github.event.issue.title, '-full-N') && endsWith(github.event.issue.title, '-CM') && 'CM' || contains(github.event.issue.title, '-full-N') && endsWith(github.event.issue.title, '-CG') && 'CG' || endsWith(github.event.issue.title, '-M01-CM') && 'CM' || endsWith(github.event.issue.title, '-M02-CM') && 'CM' || endsWith(github.event.issue.title, '-M01-CG') && 'CG' || endsWith(github.event.issue.title, '-M02-CG') && 'CG' || 'KM' }}
