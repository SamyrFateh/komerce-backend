    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pin immutable main SHA for a real staging deployment
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          live="$(curl -fsS "$STAGING_BASE_URL/health/version" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).commit||"")))')"
          expected="$head"
          # Railway saute (SKIPPED) les merges hors watchPatterns de railway.toml : on épingle alors
          # le SHA servi, uniquement si aucun fichier modifié depuis ne relève de ces watchPatterns.
          if [ "$live" != "$head" ] && [[ "$live" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$live" "$head"; then
            if git diff --name-only "$live" "$head" | node -e '
              const fs=require("fs");const t=fs.readFileSync("railway.toml","utf8");
              const m=/watchPatterns\s*=\s*\[([\s\S]*?)\]/.exec(t);if(!m)process.exit(1);
              const pats=[...m[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]);
              const hit=f=>pats.some(p=>p.endsWith("/**")?f.startsWith(p.slice(0,-2)):f===p);
              const files=fs.readFileSync(0,"utf8").split("\n").filter(Boolean);
              process.exit(files.length&&!files.some(hit)?0:1)'; then
              expected="$live"
              echo "Undeployed-only drift: pinning served SHA $live (main $head)"
            fi
          fi
          echo "E2E_EXPECTED_DEPLOY_SHA=$expected" >> "$GITHUB_ENV"
      - name: Verify actual Railway staging and database identity before any fixture
        run: |
          set -euo pipefail
          node scripts/recette/target-guard.js
          node -e '(async()=>{const v=await(await fetch(process.env.STAGING_BASE_URL+"/health/version")).json();if(v.commit!==process.env.E2E_EXPECTED_DEPLOY_SHA)throw Error("G6_DYNAMIC_STAGING_SHA_DRIFT")})().catch(e=>{console.error(e.message);process.exit(1)})'
      - name: Install Chromium headless for actual UI gestures
        run: npx playwright install chromium --only-shell
      - name: Execute fresh M01 buyer checkout and relay cash only
        run: node scripts/recette/g6-dynamic-buyer-cash.js
      - name: Preserve complete stage and proof checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-dynamic-fresh-buyer-cash-${{ github.run_id }}
          path: |
            test-results/g6-dynamic-buyer-cash/
            test-results/g6-dynamic-checkpoints/
            test-results/g6-p2-buyer-order/
            test-results/g6-a-relay-cash/
            test-results/g6-p3-kuyiyuk/
            test-results/g6-hub-commitment/
            test-results/g6-hub-vendor-readiness/
            test-results/g6-hub-vendor-simulation/
            test-results/g6-hub-receiving/
            test-results/g6-hub-receiving-readback/
            test-results/g6-hub-customer-bag/
            test-results/g6-hub-kom-box/
            test-results/g6-hub-shipment/
            test-results/g6-canonical-forwarder/
            test-results/g6-canonical-customs/
            test-results/g6-canonical-relay-receipt/
            test-results/g6-canonical-client-pickup/
            test-results/g6-local-relay-available/
            test-results/g6-local-client-pickup/
            test-results/g6-m03-not-collected/
            test-results/g6-m03-collected-final/
            test-results/g6-negative/
            test-results/g6-negative-n09/
            test-results/g6-negative-n23-n24/
            test-results/g6-negative-n21-n22/
            test-results/g6-negative-n20/
            test-results/g6-negative-n29/
            test-results/g6-negative-*/
            test-results/hub-v1-clicks/
          retention-days: 21
          if-no-files-found: warn
