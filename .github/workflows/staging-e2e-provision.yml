# The owner-only exact-title issue path is a one-shot post-reset convenience. It
# requires the canonical empty-state verifier and an actual rollback dry-run
# before running the EXISTING official provisioner. Other issue titles skip.
# Provisionnement des identites E2E du staging (apres un reset) : 7 profils de l'audit Chromium, une
# responsable Hub (optionnelle) et un relais actif par marche. Aucune donnee metier.
# Declenchement MANUEL, proprietaire du depot uniquement. dry-run par defaut (meme code, transaction annulee) ;
# execute exige la confirmation texte PROVISION-STAGING-E2E et l'epingle de base STAGING_DB_PIN.
# Les mots de passe viennent des secrets E2E_*_PASSWORD et ne sont jamais affiches. Code : scripts/recette/staging-e2e-provision.js.
name: Staging E2E provision

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (aucune ecriture) ou execute'
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - execute
      extra_markets:
        description: 'Marches de recette supplementaires (sous-ensemble de CM,CG ; vide = KM seul)'
        required: false
        default: ''
        type: string
      confirmation:
        description: 'Pour execute uniquement : saisir exactement PROVISION-STAGING-E2E'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: komerce-staging-e2e-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Staging E2E provision - ${{ inputs.mode }}
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        github.event.issue.user.login == github.repository_owner &&
        github.event.issue.title == '[staging-op] provision-e2e-after-reset-approved'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      PROVISION_MODE: ${{ github.event_name == 'issues' && 'execute' || inputs.mode }}
      E2E_PROVISION_EXTRA_MARKETS: ${{ inputs.extra_markets }}
      PROVISION_CONFIRMATION: ${{ github.event_name == 'issues' && 'PROVISION-STAGING-E2E' || inputs.confirmation }}
      E2E_ADMIN_EMAIL: ${{ github.event_name == 'issues' && 'admin@komerce.km' || secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_MARKET_OPERATOR_EMAIL: ${{ secrets.E2E_MARKET_OPERATOR_EMAIL }}
      E2E_MARKET_OPERATOR_PASSWORD: ${{ secrets.E2E_MARKET_OPERATOR_PASSWORD }}
      E2E_FINANCE_EMAIL: ${{ secrets.E2E_FINANCE_EMAIL }}
      E2E_FINANCE_PASSWORD: ${{ secrets.E2E_FINANCE_PASSWORD }}
      E2E_SOURCING_EMAIL: ${{ secrets.E2E_SOURCING_EMAIL }}
      E2E_SOURCING_PASSWORD: ${{ secrets.E2E_SOURCING_PASSWORD }}
      E2E_AGENT_HUB_EMAIL: ${{ secrets.E2E_AGENT_HUB_EMAIL }}
      E2E_AGENT_HUB_PASSWORD: ${{ secrets.E2E_AGENT_HUB_PASSWORD }}
      E2E_AGENT_RELAIS_EMAIL: ${{ secrets.E2E_AGENT_RELAIS_EMAIL }}
      E2E_AGENT_RELAIS_PASSWORD: ${{ secrets.E2E_AGENT_RELAIS_PASSWORD }}
      E2E_AGENT_TRANSITAIRE_EMAIL: ${{ secrets.E2E_AGENT_TRANSITAIRE_EMAIL }}
      E2E_AGENT_TRANSITAIRE_PASSWORD: ${{ secrets.E2E_AGENT_TRANSITAIRE_PASSWORD }}
      # Nouveaux secrets (a creer) : sans eux, le profil responsable Hub est saute avec un avertissement.
      E2E_HUB_DIRECTOR_EMAIL: ${{ secrets.E2E_HUB_DIRECTOR_EMAIL }}
      E2E_HUB_DIRECTOR_PASSWORD: ${{ secrets.E2E_HUB_DIRECTOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Preconditions (secrets, pin, confirmation)
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${DATABASE_URL:-}" ] || { echo "::error::secret RAILWAY_DATABASE_URL absent"; exit 1; }
          [ -n "${KOMERCE_STAGING_RESET_DB_PIN:-}" ] || { echo "::error::variable de depot STAGING_DB_PIN absente (host:port/base)"; exit 1; }
          if [ -z "${E2E_HUB_DIRECTOR_EMAIL:-}" ] || [ -z "${E2E_HUB_DIRECTOR_PASSWORD:-}" ]; then
            echo "::warning::secrets E2E_HUB_DIRECTOR_EMAIL / E2E_HUB_DIRECTOR_PASSWORD absents : profil responsable Hub saute"
          fi
          case "$PROVISION_MODE" in
            dry-run) ;;
            execute)
              [ "$PROVISION_CONFIRMATION" = 'PROVISION-STAGING-E2E' ] || { echo "::error::confirmation texte invalide"; exit 1; }
              ;;
            *) echo "::error::mode inconnu"; exit 1 ;;
          esac
      - name: Guard live staging identity
        run: node scripts/recette/target-guard.js
      - name: Verify empty staging before issue-triggered provisioning
        if: github.event_name == 'issues'
        run: node scripts/recette/staging-verify-empty.js
      - name: Prove E2E provisioning in rollback before issue-triggered write
        if: github.event_name == 'issues'
        run: node scripts/recette/staging-e2e-provision.js --dry-run
      - name: Provision report (${{ env.PROVISION_MODE }})
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/staging-e2e-provision
          if [ "$PROVISION_MODE" = 'execute' ]; then
            export KOMERCE_STAGING_E2E_PROVISION_ACK="$PROVISION_CONFIRMATION"
          fi
          node scripts/recette/staging-e2e-provision.js "--$PROVISION_MODE" | tee test-results/staging-e2e-provision/report.json
      - name: Publish report (no secret in it)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-provision-${{ inputs.mode }}-${{ github.run_id }}
          path: test-results/staging-e2e-provision
          retention-days: 14
          if-no-files-found: warn
