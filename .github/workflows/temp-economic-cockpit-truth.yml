name: Temporary economic cockpit truth

on:
  push:
    branches:
      - feat/economic-workshop-mock-fidelity

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economic-workshop-mock-fidelity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Align cockpit with actual Market ID structure truth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Server: expose the current Market ID share on each governed GROUP allocation.
          path = Path('services/pricing-period-structure.js')
          text = path.read_text()
          old = """    const allocation = allocateChargePool(pool.group_pool_kmf, policy, basis.rows);\n    charges.push({\n      ...pool,\n      ...allocation,\n      policy,\n      basis_source: basis.basis_source,\n      basis_total: basis.rows.reduce((sum, row) => sum + Number(row.basis_value || 0), 0),\n    });\n\n    if (allocation.decisional) {\n      allocatedGroupPool += pool.group_pool_kmf;\n      const marketShare = allocation.shares.find((share) => String(share.market_id) === String(marketId));\n      marketPartial += Number(marketShare?.allocated_kmf || 0);\n    }"""
          new = """    const allocation = allocateChargePool(pool.group_pool_kmf, policy, basis.rows);\n    const marketShare = allocation.decisional\n      ? allocation.shares.find((share) => String(share.market_id) === String(marketId))\n      : null;\n    charges.push({\n      ...pool,\n      ...allocation,\n      policy,\n      basis_source: basis.basis_source,\n      basis_total: basis.rows.reduce((sum, row) => sum + Number(row.basis_value || 0), 0),\n      market_share_kmf: allocation.decisional ? roundKmf(marketShare?.allocated_kmf || 0) : null,\n      market_allocation_ratio: allocation.decisional && marketShare\n        ? Number(marketShare.allocation_ratio)\n        : null,\n    });\n\n    if (allocation.decisional) {\n      allocatedGroupPool += pool.group_pool_kmf;\n      marketPartial += Number(marketShare?.allocated_kmf || 0);\n    }"""
          if old not in text:
              raise SystemExit('pricing-period-structure allocation block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Cockpit: variable configuration remains configuration; fixed cards use period truth.
          path = Path('public/dashboards/canonical/js/pricing-economic-cockpit.js')
          text = path.read_text()
          text = text.replace(
            "['Élément', 'Nature', 'Périmètre', 'Clé d’allocation', `Valeur / quote-part ${marketCode}`]",
            "['Élément', 'Nature', 'Périmètre', 'Clé d’allocation', `Valeur effective ${marketCode}`]",
            1,
          )
          text = text.replace(
            "table.appendChild(tableCell(doc, componentValue(component), perimeter === 'mutualized' ? 'is-market-share' : 'is-derived'));",
            "const value = tableCell(doc, componentValue(component), 'is-derived');\n      if (perimeter === 'mutualized') value.title = `Configuration effective du coût variable mutualisé pour ${marketCode}; la contribution SKU reste calculée par le moteur.`;\n      table.appendChild(value);",
            1,
          )

          start = text.index('  function fixedDirectCard(')
          end = text.index('\n\n  function fixedMutualizedCard(', start)
          fixed_direct = """  function fixedDirectCard(doc, structure) {\n    const card = el(doc, 'section', 'kmc-cockpit-cost-card is-fixed-direct');\n    card.dataset.costSummary = 'fixed-direct';\n    card.appendChild(costCardHeader(doc, '🏠', 'Charges fixes directes', 'Vérité structurelle de période propre au marché.', 'Ajuster les charges', 'fixed-direct'));\n    const table = el(doc, 'div', 'kmc-cockpit-cost-table is-fixed-direct');\n    table.appendChild(tableCell(doc, 'Élément', 'is-head'));\n    table.appendChild(tableCell(doc, 'Montant reconnu', 'is-head'));\n    const rows = Array.isArray(structure?.evidence)\n      ? structure.evidence.filter(item => item.scope_kind === 'MARKET_DIRECT')\n      : [];\n    rows.slice(0, 6).forEach(item => {\n      table.appendChild(tableCell(doc, item.charge_name || item.charge_family || 'Charge structurelle'));\n      table.appendChild(tableCell(doc, formatKmf(item.recognized_amount_kmf), 'is-derived is-number'));\n    });\n    if (!rows.length) table.appendChild(el(doc, 'div', 'kmc-cockpit-empty-row', structure ? 'Aucune charge fixe directe reconnue sur la période.' : 'Vérité de période indisponible.'));\n    card.appendChild(table);\n    card.appendChild(el(doc, 'p', 'kmc-cockpit-card-foot', `${rows.length} fait${rows.length > 1 ? 's' : ''} de période · source moteur.`));\n    return card;\n  }"""
          text = text[:start] + fixed_direct + text[end:]

          start = text.index('  function fixedMutualizedCard(')
          end = text.index('\n\n  function principleCard(', start)
          fixed_mutualized = """  function fixedMutualizedCard(doc, structure, marketCode) {\n    const card = el(doc, 'section', 'kmc-cockpit-cost-card is-fixed-mutualized');\n    card.dataset.costSummary = 'fixed-mutualized';\n    card.appendChild(costCardHeader(doc, '🔗', 'Charges fixes mutualisées', 'Pools structurels partagés, alloués par Market ID.', 'Gérer les mutualisations', 'fixed-mutualized'));\n    const table = el(doc, 'div', 'kmc-cockpit-cost-table is-fixed-mutualized');\n    ['Élément', 'Coût global', 'Clé d’allocation', `Quote-part ${marketCode}`].forEach(label => table.appendChild(tableCell(doc, label, 'is-head')));\n    const charges = Array.isArray(structure?.allocation?.charges) ? structure.allocation.charges : [];\n    charges.slice(0, 6).forEach(charge => {\n      table.appendChild(tableCell(doc, charge.charge_name || charge.charge_family || 'Charge mutualisée'));\n      table.appendChild(tableCell(doc, formatKmf(charge.group_pool_kmf), 'is-derived'));\n      const policy = charge.policy;\n      table.appendChild(tableCell(doc, policy ? `${policy.basis_kind || '—'} · ${policy.policy_kind || '—'}` : 'Politique manquante', 'is-derived'));\n      const shareText = charge.market_share_kmf == null ? 'À gouverner' : formatKmf(charge.market_share_kmf);\n      const share = tableCell(doc, shareText, `is-derived ${charge.market_share_kmf == null ? '' : 'is-market-share'}`.trim());\n      if (charge.market_allocation_ratio != null) share.title = `Quote-part Market ID ${marketCode} : ${formatNumber(Number(charge.market_allocation_ratio) * 100, 2)} %`;\n      table.appendChild(share);\n    });\n    const groupPool = finite(structure?.group_pool_kmf);\n    if (!charges.length && groupPool != null && groupPool !== 0) {\n      table.appendChild(el(doc, 'div', 'kmc-cockpit-empty-row', 'Pool mutualisé réel présent, mais politique d’allocation non décisionnelle : aucune quote-part n’est inventée.'));\n    } else if (!charges.length) {\n      table.appendChild(el(doc, 'div', 'kmc-cockpit-empty-row', structure ? 'Aucune charge fixe mutualisée reconnue sur la période.' : 'Vérité de période indisponible.'));\n    }\n    card.appendChild(table);\n    const status = structure?.shared_allocation_applied ? `Quote-part ${marketCode} calculée par le moteur.` : 'Allocation fail-closed tant que la politique Market ID n’est pas gouvernée.';\n    card.appendChild(el(doc, 'p', 'kmc-cockpit-card-foot', status));\n    return card;\n  }"""
          text = text[:start] + fixed_mutualized + text[end:]

          start = text.index('  function createCostPilotage(')
          end = text.index('\n\n  function corridorAmount(', start)
          cost_pilotage = """  function createCostPilotage(doc, payload, marketCode, decision) {\n    const groups = classifyComponents(Array.isArray(payload.cost_components) ? payload.cost_components : []);\n    const structure = decision?.coverage?.structure || null;\n    const section = el(doc, 'section', 'kmc-cockpit-costs');\n    section.appendChild(variableCostCard(doc, groups.variable, marketCode));\n    section.appendChild(fixedDirectCard(doc, structure));\n    section.appendChild(fixedMutualizedCard(doc, structure, marketCode));\n    section.appendChild(principleCard(doc, marketCode));\n    return section;\n  }"""
          text = text[:start] + cost_pilotage + text[end:]

          corridor_fn = """  async function fetchCorridor(workspace, options, productRef) {\n    const endpoint = workspace.endpointFor({ requestedMarket: options.requestedMarket });\n    return workspace.jsonRequest(options.fetch, `${endpoint}/corridor?product_ref=${encodeURIComponent(productRef)}`);\n  }"""
          decision_fn = corridor_fn + """\n\n  async function fetchDecision(workspace, options) {\n    const endpoint = workspace.endpointFor({ requestedMarket: options.requestedMarket });\n    return workspace.jsonRequest(options.fetch, `${endpoint}/decision`);\n  }"""
          if corridor_fn not in text:
              raise SystemExit('fetchCorridor block not found')
          text = text.replace(corridor_fn, decision_fn, 1)

          old = """  function buildCockpit(doc, rootNode, payload, marketCode) {\n    const cockpit = el(doc, 'div', 'kmc-economic-cockpit');\n    cockpit.dataset[COCKPIT_ATTR] = '';\n    moveEquilibriumIntoCockpit(rootNode, cockpit);\n    cockpit.appendChild(createCostPilotage(doc, payload, marketCode));\n    cockpit.appendChild(createPortfolioShell(doc, payload));\n    return cockpit;\n  }"""
          new = """  function buildCockpit(doc, rootNode, payload, marketCode, decision) {\n    const cockpit = el(doc, 'div', 'kmc-economic-cockpit');\n    cockpit.dataset[COCKPIT_ATTR] = '';\n    moveEquilibriumIntoCockpit(rootNode, cockpit);\n    cockpit.appendChild(createCostPilotage(doc, payload, marketCode, decision));\n    cockpit.appendChild(createPortfolioShell(doc, payload));\n    return cockpit;\n  }"""
          if old not in text:
              raise SystemExit('buildCockpit block not found')
          text = text.replace(old, new, 1)

          old = """    const existing = Array.from(slot.children).filter(node => !node.matches?.('[data-pricing-flow-equilibrium]'));\n    const advancedNodes = existing.filter(node => !node.classList?.contains('kmc-cost-formula') && !node.matches?.('[data-pricing-decision-chain]'));\n    const cockpit = buildCockpit(options.document, options.root, payload, options.requestedMarket || payload.scope?.market_code || 'Marché');"""
          new = """    const existing = Array.from(slot.children).filter(node => !node.matches?.('[data-pricing-flow-equilibrium]'));\n    const advancedNodes = existing.filter(node => !node.classList?.contains('kmc-cost-formula') && !node.matches?.('[data-pricing-decision-chain]'));\n    let decision = null;\n    try { decision = await fetchDecision(workspace, options); } catch (_) { decision = null; }\n    const cockpit = buildCockpit(options.document, options.root, payload, options.requestedMarket || payload.scope?.market_code || 'Marché', decision);"""
          if old not in text:
              raise SystemExit('enhance cockpit block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Protect both the server share projection and the cockpit source choice.
          path = Path('tests/unit/pricing-period-structure.test.js')
          text = path.read_text()
          marker = """    expect(result.allocation.conservation_ok).toBe(true);\n    expect(result.allocation.allocated_group_pool_kmf).toBe(60000);"""
          replacement = marker + """\n    expect(result.allocation.charges[0].market_share_kmf).toBe(40000);\n    expect(result.allocation.charges[0].market_allocation_ratio).toBeCloseTo(2 / 3, 6);"""
          if marker not in text:
              raise SystemExit('period structure assertion marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)

          path = Path('tests/unit/canonical-pricing-economic-cockpit.test.js')
          text = path.read_text()
          marker = """  expect(source).toContain('/corridor?product_ref=');\n  expect(source).toContain('point?.economics?.contribution_unit_kmf');"""
          replacement = """  expect(source).toContain('/corridor?product_ref=');\n  expect(source).toContain('`${endpoint}/decision`');\n  expect(source).toContain('decision?.coverage?.structure');\n  expect(source).toContain('charge.market_share_kmf');\n  expect(source).toContain('Valeur effective ${marketCode}');\n  expect(source).toContain('point?.economics?.contribution_unit_kmf');"""
          if marker not in text:
              raise SystemExit('cockpit assertion marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - name: Prove period truth and cockpit fidelity
        run: npx jest tests/unit/pricing-period-structure.test.js tests/unit/pricing-engine.test.js tests/unit/pricing-market-corridor.test.js tests/unit/canonical-pricing-workspace-boundary.test.js tests/unit/canonical-pricing-economic-cockpit.test.js --runInBand
      - name: Commit truth alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/pricing-period-structure.js public/dashboards/canonical/js/pricing-economic-cockpit.js tests/unit/pricing-period-structure.test.js tests/unit/canonical-pricing-economic-cockpit.test.js
          if git diff --cached --quiet; then
            echo "No truth alignment changes"
            exit 0
          fi
          git commit -m "fix(pricing): source mutualized shares from Market ID period truth"
          git push origin HEAD:feat/economic-workshop-mock-fidelity
