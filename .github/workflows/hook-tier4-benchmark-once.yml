name: Benchmark hook tier 4 Boutique once

on:
  push:
    paths:
      - '.github/workflows/hook-tier4-benchmark-once.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Benchmark source-level Boutique candidates
        shell: bash
        run: |
          set -uo pipefail
          cd public/boutique

          diagnose() {
            local label="$1"
            shift
            local start end rc
            start=$(node -e 'process.stdout.write(String(Date.now()))')
            set +e
            "$@" >/tmp/tier4.out 2>&1
            rc=$?
            set -e
            end=$(node -e 'process.stdout.write(String(Date.now()))')
            echo "TIER4_RESULT label=$label rc=$rc total_ms=$((end-start))"
            if [ "$rc" -ne 0 ]; then
              tail -80 /tmp/tier4.out
            fi
          }

          diagnose important node scripts/check-important.js --strict
          diagnose breakpoints node scripts/check-breakpoints.js --strict
          diagnose architecture node scripts/audit-boutique-arch.js
          diagnose js-imports node scripts/check-js-imports.js
          diagnose no-css-injection node scripts/check-no-css-injection.js
          diagnose html-balance node scripts/check-html-balance.js
          diagnose body-classes node scripts/check-body-classes.js
          diagnose css-vars node scripts/check-css-vars.js --strict
          diagnose zindex node scripts/check-zindex-contract.js --strict
          diagnose sticky node scripts/check-sticky-integrity.js --strict
          diagnose dom-contract node scripts/check-dom-contract.js
