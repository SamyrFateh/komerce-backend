name: Validate hook tier 4 Boutique once

on:
  push:
    paths:
      - '.github/workflows/hook-tier4-benchmark-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install current Komerce hook
        run: bash scripts/setup-hooks.sh

      - name: Simulate full pre-commit by Boutique file type
        shell: bash
        run: |
          set -uo pipefail

          simulate() {
            local label="$1"
            local file="$2"
            local marker="$3"
            local start end rc

            git reset --hard HEAD >/dev/null
            printf '\n%s\n' "$marker" >> "$file"
            git add "$file"

            start=$(node -e 'process.stdout.write(String(Date.now()))')
            set +e
            .git/hooks/pre-commit >/tmp/tier4-hook.out 2>&1
            rc=$?
            set -e
            end=$(node -e 'process.stdout.write(String(Date.now()))')

            echo "===== $label ====="
            cat /tmp/tier4-hook.out
            echo "TIER4_HOOK_RESULT label=$label rc=$rc total_ms=$((end-start))"
            echo
          }

          simulate css-source public/boutique/css/modal-shell.css '/* tier4 hook benchmark */'
          simulate js-source public/boutique/js/b-cart.js '// tier4 hook benchmark'
          simulate html-source public/boutique/index.html '<!-- tier4 hook benchmark -->'

          git reset --hard HEAD >/dev/null
