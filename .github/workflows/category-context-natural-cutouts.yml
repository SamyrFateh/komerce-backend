name: Category Context Natural Cutouts

on:
  push:
    branches:
      - feat/desktop-category-context-v2
    paths:
      - .github/workflows/category-context-natural-cutouts.yml

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-category-context-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Apply natural-color category context contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          desktop_path = Path('public/boutique/css/category-cutout-navigation-desktop.css')
          legacy_path = Path('public/boutique/css/boutique-desktop.css')
          test_path = Path('public/boutique/tests/unit/category-cutout-navigation.test.js')

          desktop = desktop_path.read_text()
          legacy = legacy_path.read_text()
          test = test_path.read_text()

          replacements = [
            (
              """  .k-subcutout {\n    --k-sub-x: 0px;\n    --k-sub-y: 1px;\n    --k-sub-scale: .98;\n    --k-sub-active-y: -1px;\n    --k-sub-active-scale: 1.03;\n    min-width: 72px;\n    min-height: 60px;\n  }\n\n  .k-subcutout-icon {\n    position: relative;\n    width: 48px;\n    height: 42px;\n    font-size: 22px;\n  }""",
              """  .k-subcutout {\n    --k-sub-x: 0px;\n    --k-sub-y: 1px;\n    --k-sub-scale: .98;\n    --k-sub-active-y: -2px;\n    --k-sub-active-scale: 1.035;\n    min-width: 104px;\n    min-height: 88px;\n  }\n\n  .k-subcutout-icon {\n    position: relative;\n    width: 76px;\n    height: 68px;\n    font-size: 24px;\n  }"""
            ),
            (
              """  .k-subcutout-icon::before {\n    content: '';\n    position: absolute;\n    left: 50%;\n    bottom: 2px;\n    width: 34px;\n    height: 10px;\n    border-radius: 50%;\n    background: var(--sand-warm);\n    opacity: .16;\n    filter: blur(4px);\n    transform: translateX(-50%);\n    pointer-events: none;\n  }""",
              """  .k-subcutout-icon::before {\n    content: '';\n    position: absolute;\n    left: 50%;\n    bottom: 3px;\n    width: 48px;\n    height: 12px;\n    border-radius: 50%;\n    background: var(--sand-warm);\n    opacity: .12;\n    filter: blur(5px);\n    transform: translateX(-50%);\n    pointer-events: none;\n  }"""
            ),
            (
              """  .k-shelf-object--subcategory {\n    width: 46px;\n    height: 41px;\n    transform:\n      translate(var(--k-sub-x), var(--k-sub-y))\n      scale(var(--k-sub-scale));\n    filter:\n      drop-shadow(0 3px 5px var(--border-text-08))\n      grayscale(1)\n      sepia(.58)\n      hue-rotate(62deg)\n      saturate(1.55)\n      contrast(1.16)\n      brightness(.74);\n  }\n\n  .k-subcutout:hover .k-shelf-object--subcategory,\n  .k-subcutout.active .k-shelf-object--subcategory {\n    transform:\n      translate(var(--k-sub-x), var(--k-sub-active-y))\n      scale(var(--k-sub-active-scale));\n    filter:\n      drop-shadow(0 4px 6px var(--border-text-08))\n      grayscale(1)\n      sepia(.68)\n      hue-rotate(62deg)\n      saturate(1.8)\n      contrast(1.22)\n      brightness(.66);\n  }""",
              """  .k-shelf-object--subcategory {\n    width: 72px;\n    height: 64px;\n    transform:\n      translate(var(--k-sub-x), var(--k-sub-y))\n      scale(var(--k-sub-scale));\n    filter:\n      drop-shadow(0 3px 5px var(--border-text-08))\n      saturate(1.02)\n      contrast(1.04);\n  }\n\n  .k-subcutout:hover .k-shelf-object--subcategory,\n  .k-subcutout.active .k-shelf-object--subcategory {\n    transform:\n      translate(var(--k-sub-x), var(--k-sub-active-y))\n      scale(var(--k-sub-active-scale));\n    filter:\n      drop-shadow(0 4px 7px var(--border-text-08))\n      saturate(1.06)\n      contrast(1.06);\n  }"""
            ),
            (
              """  .k-shelf-emoji-fallback {\n    font-size: 21px;\n    line-height: 40px;\n    opacity: .9;\n    filter: grayscale(1) sepia(.58) hue-rotate(62deg) saturate(1.55) contrast(1.16) brightness(.74);\n  }""",
              """  .k-shelf-emoji-fallback {\n    font-size: 24px;\n    line-height: 64px;\n    opacity: .92;\n    filter: drop-shadow(0 2px 3px var(--border-text-08));\n  }"""
            ),
            (
              """  .k-subcutout-label {\n    font-size: 11px;\n    font-weight: 630;\n  }""",
              """  .k-subcutout-label {\n    font-size: 11.5px;\n    font-weight: 630;\n  }"""
            ),
            (
              """  html.k-home-premium-v1 .k-subcutout-rail {\n    min-width: 0;\n    gap: 14px;\n  }""",
              """  html.k-home-premium-v1 .k-subcutout-rail {\n    min-width: 0;\n    gap: 18px;\n  }"""
            ),
          ]

          for old, new in replacements:
            if old not in desktop:
              raise SystemExit(f'missing desktop replacement:\n{old[:180]}')
            desktop = desktop.replace(old, new, 1)

          legacy_replacements = [
            ("""  #k-subcats-wrap .k-subcats-title {\n    margin: 0;\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    font-family: var(--font);\n    font-size: 13px;\n    font-weight: 750;""",
             """  #k-subcats-wrap .k-subcats-title {\n    margin: 0;\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    font-family: var(--font);\n    font-size: 14px;\n    font-weight: 780;"""),
            ("""  #k-subcats-wrap .k-subcats-rail {\n    display: flex;\n    align-items: center;\n    justify-content: flex-start;\n    flex-wrap: nowrap;\n    gap: 6px;""",
             """  #k-subcats-wrap .k-subcats-rail {\n    display: flex;\n    align-items: flex-start;\n    justify-content: flex-start;\n    flex-wrap: nowrap;\n    gap: 18px;"""),
          ]
          for old, new in legacy_replacements:
            if old not in legacy:
              raise SystemExit(f'missing legacy replacement:\n{old[:180]}')
            legacy = legacy.replace(old, new, 1)

          test_replacements = [
            ("expect(desktop).toMatch(/\\.k-subcutout-icon\\s*\\{[^}]*width:\\s*48px[^}]*height:\\s*42px/s);",
             "expect(desktop).toMatch(/\\.k-subcutout-icon\\s*\\{[^}]*width:\\s*76px[^}]*height:\\s*68px/s);"),
            ("expect(desktop).toMatch(/\\.k-subcutout-label\\s*\\{[^}]*font-size:\\s*11px/s);",
             "expect(desktop).toMatch(/\\.k-subcutout-label\\s*\\{[^}]*font-size:\\s*11\\.5px/s);"),
            ("expect(desktop).toMatch(/\\.k-subcutout\\s*\\{[^}]*min-width:\\s*72px[^}]*min-height:\\s*60px/s);",
             "expect(desktop).toMatch(/\\.k-subcutout\\s*\\{[^}]*min-width:\\s*104px[^}]*min-height:\\s*88px/s);"),
          ]
          for old, new in test_replacements:
            if old not in test:
              raise SystemExit(f'missing test replacement: {old}')
            test = test.replace(old, new)

          marker = """  it('garde les nouveaux skins hors des selectors ownership historiques', () => {"""
          natural_test = """  it('préserve les couleurs naturelles des détourages de sous-catégorie', () => {\n    expect(desktop).toMatch(/\\.k-shelf-object--subcategory\\s*\\{[^}]*width:\\s*72px[^}]*height:\\s*64px/s);\n    expect(desktop).toContain('saturate(1.02)');\n    expect(desktop).not.toContain('grayscale(1)');\n    expect(desktop).not.toContain('sepia(.58)');\n    expect(desktop).not.toContain('hue-rotate(62deg)');\n    expect(desktopLegacy).toMatch(/#k-subcats-wrap \\.k-subcats-title\\s*\\{[^}]*font-size:\\s*14px/s);\n    expect(desktopLegacy).toMatch(/#k-subcats-wrap \\.k-subcats-rail\\s*\\{[^}]*gap:\\s*18px/s);\n  });\n\n"""
          if marker not in test:
            raise SystemExit('missing ownership marker')
          if "préserve les couleurs naturelles" not in test:
            test = test.replace(marker, natural_test + marker, 1)

          desktop_path.write_text(desktop)
          legacy_path.write_text(legacy)
          test_path.write_text(test)
          PY

      - name: Install Boutique and Chromium
        run: |
          npm --prefix public/boutique ci
          cd public/boutique
          npx playwright install --with-deps chromium

      - name: Build CSS and run scoped Boutique gates
        run: |
          npm --prefix public/boutique run deploy:css
          cd public/boutique
          npx jest tests/unit/category-cutout-navigation.test.js --runInBand
          npm run check:important
          npm run check:css-guard
          npm run check:css-specificity-guard
          npm run check:css-dist-only
          npm run check:cache
          npm run audit:arch
          npm run audit:ownership

      - name: Create deterministic visual audit
        shell: bash
        run: |
          cat > public/boutique/tests/e2e/category-context-natural-audit.spec.js <<'EOF'
          'use strict';
          const { test, expect } = require('@playwright/test');
          const fs = require('fs');
          const path = require('path');

          for (const vp of [
            { name: 'desktop-1280', width: 1280, height: 800 },
            { name: 'desktop-1440', width: 1440, height: 900 },
          ]) {
            test(`${vp.name} natural cutouts`, async ({ page }) => {
              await page.setViewportSize({ width: vp.width, height: vp.height });
              await page.addInitScript(() => { window.KOMERCE_FORCE_FALLBACK_CATEGORIES = true; });
              await page.route(/\/api\//, async route => {
                const url = route.request().url();
                if (/\/api\/auth\/me/.test(url)) {
                  return route.fulfill({ status: 401, contentType: 'application/json', body: '{}' });
                }
                return route.fulfill({ status: 200, contentType: 'application/json', body: '[]' });
              });
              await page.goto('/boutique/index.html', { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(900);
              await page.evaluate(async () => {
                document.documentElement.classList.add('k-home-premium-v1');
                const { renderSubcatRail } = await import('/boutique/js/controllers/home-controller.js');
                renderSubcatRail('Mode & Beauté', { count: 383 });
              });
              await page.waitForSelector('#k-subcats-wrap .k-subcutout-context', { state: 'visible', timeout: 10000 });
              await page.waitForTimeout(250);

              const metrics = await page.evaluate(() => {
                const wrap = document.querySelector('#k-subcats-wrap');
                const title = wrap.querySelector('.k-subcutout-title');
                const rail = wrap.querySelector('.k-subcutout-rail');
                const object = wrap.querySelector('.k-shelf-object--subcategory');
                const items = [...wrap.querySelectorAll('.k-subcutout')];
                const css = el => getComputedStyle(el);
                const r = el => el.getBoundingClientRect();
                return {
                  wrapHeight: r(wrap).height,
                  titleFontSize: css(title).fontSize,
                  railGap: css(rail).gap,
                  objectWidth: r(object).width,
                  objectHeight: r(object).height,
                  objectFilter: css(object).filter,
                  itemCount: items.length,
                  itemWidths: items.map(el => r(el).width),
                };
              });

              fs.mkdirSync(path.join(process.cwd(), 'visual-audit-natural'), { recursive: true });
              fs.writeFileSync(path.join(process.cwd(), 'visual-audit-natural', `${vp.name}.json`), JSON.stringify(metrics, null, 2));
              await page.locator('#k-subcats-wrap').screenshot({ path: `visual-audit-natural/${vp.name}-context.png` });
              await page.screenshot({ path: `visual-audit-natural/${vp.name}-viewport.png`, fullPage: false });

              expect(metrics.titleFontSize).toBe('14px');
              expect(metrics.railGap).toBe('18px');
              expect(metrics.objectWidth).toBeGreaterThanOrEqual(68);
              expect(metrics.objectHeight).toBeGreaterThanOrEqual(60);
              expect(metrics.objectFilter).not.toContain('grayscale');
              expect(metrics.objectFilter).not.toContain('sepia');
              expect(metrics.itemCount).toBe(5);
              expect(metrics.wrapHeight).toBeLessThanOrEqual(140);
            });
          }
          EOF

      - name: Run Chromium visual audit
        working-directory: public/boutique
        run: npx playwright test tests/e2e/category-context-natural-audit.spec.js --project='Desktop Chrome' --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-context-natural-cutouts
          path: public/boutique/visual-audit-natural/
          retention-days: 7

      - name: Commit clean source state and remove harness
        if: success()
        shell: bash
        run: |
          rm -f public/boutique/tests/e2e/category-context-natural-audit.spec.js
          rm -f .github/workflows/category-context-natural-cutouts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(boutique): restore natural subcategory cutouts"
          git push origin HEAD:feat/desktop-category-context-v2
