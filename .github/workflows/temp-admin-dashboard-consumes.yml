name: Temporary admin dashboard consumes

on:
  push:
    branches:
      - governance/admin-dashboard-consumes

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/admin-dashboard-consumes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply admin dashboard consumes
        run: node scripts/temp-admin-dashboard-consumes.js
      - name: Remove temporary tooling before canonical generation
        run: rm .github/workflows/temp-admin-dashboard-consumes.yml scripts/temp-admin-dashboard-consumes.js
      - name: Refresh canonical governance projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Prove dashboard dependencies and gates
        shell: bash
        run: |
          npm run business-graph:check
          node scripts/business-graph-ratchet-check.js
          npm run feature:360:check
          node scripts/feature-guard.js --strict
          node - <<'NODE'
          const m = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const debt = m.drifts.debt || [];
          const observed = debt.filter(x => x.type === 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY');
          const admin = observed.filter(x => String(x.ref).startsWith('admin-dashboard -> '));
          console.log({ summary: m.drifts.summary, observedDebt: observed.length, adminDashboardDebt: admin.length });
          if (m.drifts.summary.signals !== 75) throw new Error(`expected raw signals=75, got ${m.drifts.summary.signals}`);
          if (m.drifts.summary.debt !== 42) throw new Error(`expected debt=42, got ${m.drifts.summary.debt}`);
          if (m.drifts.summary.expectedTopology !== 25) throw new Error(`expected expectedTopology=25, got ${m.drifts.summary.expectedTopology}`);
          if (m.drifts.summary.generatorLimitations !== 8) throw new Error(`expected tool-limit=8, got ${m.drifts.summary.generatorLimitations}`);
          if (observed.length !== 16) throw new Error(`expected observed debt=16, got ${observed.length}`);
          if (admin.length !== 0) throw new Error(`admin-dashboard undeclared dependencies remain: ${JSON.stringify(admin)}`);
          NODE
          git diff --check
      - name: Commit final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): declare admin dashboard providers"
          git push origin HEAD:governance/admin-dashboard-consumes
