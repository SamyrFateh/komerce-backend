name: Route Owner Dependency Diff

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: route-owner-dependency-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    if: github.head_ref == 'diag/route-owner-dependency-diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/route-owner-dependency-diff
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

      - name: Diff observed undeclared feature dependencies
        run: |
          git show origin/main:docs/BUSINESS_FEATURE_GRAPH.json > /tmp/main-business-graph.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('/tmp/main-business-graph.json').read_text(encoding='utf-8'))
          current = json.loads(Path('docs/BUSINESS_FEATURE_GRAPH.json').read_text(encoding='utf-8'))

          def refs(graph):
              return {
                  warning['ref']: warning['msg']
                  for warning in graph.get('diagnostics', {}).get('warnings', graph.get('warnings', []))
                  if warning.get('type') == 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY'
              }

          before = refs(base)
          after = refs(current)
          added = sorted(set(after) - set(before))
          removed = sorted(set(before) - set(after))

          out = [
              f'before={len(before)}',
              f'after={len(after)}',
              f'added={len(added)}',
              f'removed={len(removed)}',
              '',
              '=== ADDED ===',
          ]
          for ref in added:
              out += [ref, after[ref]]
          out += ['', '=== REMOVED ===']
          for ref in removed:
              out += [ref, before[ref]]

          Path('docs/_generated/route-owner-dependency-diff.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('\n'.join(out))
          PY

      - name: Publish exact dependency diff
        run: |
          git add docs/_generated/route-owner-dependency-diff.txt
          if git diff --cached --quiet; then
            echo "Dependency diff unchanged."
            exit 0
          fi
          git commit --no-verify -m "chore(governance): publish route-owner dependency diff"
          git push origin HEAD:diag/route-owner-dependency-diff
