name: GOV-03 October 2026 advisory repair — isolated proposal
on:
  pull_request:
    paths:
      - '.github/workflows/security-advisory-repair-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build advisory patch proposal — never push
        run: |
          set -euo pipefail
          npm pkg set 'dependencies.joi=^17.13.9'
          npm pkg set 'overrides.glob=14.0.2'
          npm pkg set 'overrides.minimatch=11.0.1'
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: GOV-03 gate
        run: npm run audit:gate
      - name: Focused regression tests
        run: npx jest --config jest.unit.config.js --ci --runInBand --no-coverage tests/unit/catalog-workspace.test.js tests/unit/catalog-approval.test.js tests/unit/canonical-catalog-workspace-boundary.test.js
      - name: Upload npm-generated changes for source review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-oct31-proposed-lockfile
          path: |
            package.json
            package-lock.json
          retention-days: 3
          if-no-files-found: error
