name: Hub V1 — staging transaction readiness preflight (READ ONLY)

on:
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: komerce-hub-v1-staging-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Prove staging isolated fixture safety (no business writes)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == '[staging-op] hub-v1-transaction-preflight')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Pin source SHA to the deployed backend
        shell: bash
        run: echo "E2E_EXPECTED_DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Require staging secret without disclosing it
        run: test -n "$DATABASE_URL"
      - name: No-write staging fixture preflight
        run: node scripts/recette/hub-v1-staging-transactional-preflight.js
      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Hub V1 — safety-first staging transactional readiness'
            echo ''
            echo 'A red HOLD result blocks writes; it does **not** indicate staging runtime service failure.'
            echo 'This workflow never creates an order or a PO and never performs a payment.'
            echo 'No delete, reset or mutation of existing RCT1/E2E fixtures.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive all available preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-v1-staging-transactional-preflight-${{ github.run_id }}
          path: test-results/hub-v1-cert/transactional-preflight.json
          if-no-files-found: warn
          retention-days: 14
