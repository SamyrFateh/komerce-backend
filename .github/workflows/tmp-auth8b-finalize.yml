name: Temporary AUTH-8b finalizer

on:
  push:
    branches: [auth/8b-csrf-origin]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      KOMERCE_ENV: test
      JWT_SECRET: auth8b-test-secret-minimum-32-characters
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wire CSRF guard and canonical feature ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, got {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'server.js',
              "const { requestIdMiddleware } = require('./middleware/request-id');\n",
              "const { requestIdMiddleware } = require('./middleware/request-id');\nconst { csrfOriginGuard } = require('./middleware/csrf-origin');\n",
              'server csrf import'
          )
          replace_once(
              'server.js',
              "app.use(cookieParser());\napp.use(requestIdMiddleware);\n",
              "app.use(cookieParser());\n// AUTH-8b — SameSite=Lax reste compatible WhatsApp ; les mutations portées\n// par le cookie de session doivent en plus venir d'une Origin autorisée.\napp.use(csrfOriginGuard);\napp.use(requestIdMiddleware);\n",
              'server csrf mount'
          )
          replace_once(
              'server.js',
              'bootstrap/feature-wiring.js, routes/shared-cart.js',
              'bootstrap/feature-wiring.js, routes/shared-cart.js, middleware/csrf-origin.js',
              'server arch dependency'
          )
          replace_once(
              'features/auth.feature.js',
              "      'middleware/auth.js',\n",
              "      'middleware/auth.js',\n      'middleware/csrf-origin.js',\n",
              'auth feature middleware ownership'
          )
          replace_once(
              'features/auth.feature.js',
              "      'tests/unit/auth-middleware.test.js',\n",
              "      'tests/unit/auth-middleware.test.js',\n      'tests/unit/csrf-origin.test.js',\n",
              'auth feature test ownership'
          )
          replace_once(
              'features/auth.feature.js',
              "    'toute route mutante passe par un middleware d\\'auth declare — jamais d\\'acces direct sans garde',\n",
              "    'toute route mutante passe par un middleware d\\'auth declare — jamais d\\'acces direct sans garde',\n    'toute mutation portée par le cookie de session exige une Origin explicitement autorisée (AUTH-8b)',\n",
              'auth csrf invariant'
          )
          replace_once(
              'utils/auth-cookie.js',
              " * Politique actuelle (à durcir en AUTH-8b/c/d) :\n",
              " * Politique actuelle (AUTH-8b ; durcissements complémentaires en AUTH-8c/d) :\n",
              'auth cookie doctrine status'
          )
          PY
      - name: Remove temporary finalizer from intended tree
        run: rm .github/workflows/tmp-auth8b-finalize.yml
      - run: npm ci
      - name: AUTH-8b unit regression
        run: npx jest tests/unit/csrf-origin.test.js tests/unit/auth-middleware.test.js --runInBand
      - name: Backend quality and feature gates
        run: |
          node scripts/code-quality-gate.js --strict
          node scripts/feature-guard.js --strict
      - name: Refresh governance projections
        run: |
          node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
          node scripts/gen-gate-findings.js
          node scripts/gen-feature-360.js
      - name: Verify final tree
        run: |
          node scripts/feature-guard.js --strict
          node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique
          node scripts/feature-360-check.js
          git diff --check
      - name: Commit final AUTH-8b tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(auth): guard cookie mutations against CSRF origins"
          git push origin HEAD:auth/8b-csrf-origin
