name: Hub V1 — orphan supplier/source links preview (READ ONLY)
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-hub-v1-orphan-links-preview
  cancel-in-progress: false
jobs:
  preview:
    name: Verify FK and named non-FK consumers of all orphan RUN8 roots
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] hub-v1-orphan-links-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Require runtime SHA served by official staging
        run: node scripts/recette/resolve-staging-deploy-pin.js
      - run: npm ci
      - name: Require existing staging DB secret
        run: test -n "$DATABASE_URL"
      - name: Verify same Railway staging DB
        run: node scripts/recette/target-guard.js
      - name: Check orphan suppliers and sources for incoming references (READ ONLY)
        run: node scripts/recette/hub-v1-orphan-refs-preview.js
      - name: Archive the private manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-v1-orphan-links-preview-${{ github.run_id }}
          path: test-results/hub-v1-cert/staging-orphan-refs-preview.json
          if-no-files-found: warn
          retention-days: 30
      - name: Never claim deletion approval
        if: always()
        run: |
          echo 'READ ONLY. FK/column scan is informative, not an exhaustive JSON/event lineage proof.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No DELETE, no CASCADE, no trigger changes, no cleanup certified.' >> "$GITHUB_STEP_SUMMARY"
