name: U2 governance refresh once

on:
  push:
    branches:
      - feat/u2-discovery-provider-identity

permissions:
  contents: write

concurrency:
  group: u2-governance-refresh-once
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/u2-discovery-provider-identity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate governed projections
        run: |
          npm run business-graph:gen
          # Transport-only workflow: do not let it become an application source
          # in Gate Findings / Feature 360 while generating canonical projections.
          rm -f .github/workflows/u2-governance-refresh-once.yml
          npm run gate:findings:gen
          npm run feature:360:gen
          npm run agent:remediation:gen
          git checkout -- .github/workflows/u2-governance-refresh-once.yml

      - name: Commit generated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md \
                  docs/GATE_FINDINGS.json docs/FEATURE_360.json docs/FEATURE_360.md \
                  docs/AGENT_REMEDIATION_INDEX.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit --no-verify -m "chore(governance): refresh U2 projections"
          git push origin HEAD:feat/u2-discovery-provider-identity
