name: Lot 8 schema snapshot once

on:
  push:
    branches:
      - test/lot8-pre-go-live-certification

permissions:
  contents: write

concurrency:
  group: lot8-schema-snapshot-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgres://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: lot8-ci-secret-not-for-prod
      ADMIN_PASSWORD: lot8-ci-admin
      QR_SECRET: lot8-ci-qr-secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
      KOMERCE_DISABLE_CRONS: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/lot8-pre-go-live-certification
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Rebuild deployed schema projection
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/db/railway-live-schema.sql
          node scripts/ci-migrate.js
          node scripts/db-snapshot.js
          node scripts/arch-reconcile.js --write
          npm run arch:gate

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/lot8-schema-snapshot-once.yml

      - name: Commit reconciled snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/db/railway-live-schema.sql scripts/arch-debt-budget.json .github/workflows/lot8-schema-snapshot-once.yml
          git diff --cached --check
          git commit --no-verify -m "fix: reconcile Lot 8 deployed schema snapshot"
          git push origin HEAD:test/lot8-pre-go-live-certification
