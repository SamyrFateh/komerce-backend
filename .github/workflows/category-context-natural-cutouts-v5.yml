name: Category Context Natural Cutouts V5

on:
  push:
    branches:
      - feat/desktop-category-context-v2
    paths:
      - .github/workflows/category-context-natural-cutouts-v5.yml

permissions:
  contents: write

jobs:
  persist-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-category-context-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Apply source contract
        shell: bash
        run: |
          set -euo pipefail
          D='public/boutique/css/category-cutout-navigation-desktop.css'
          L='public/boutique/css/boutique-desktop.css'
          T='public/boutique/tests/unit/category-cutout-navigation.test.js'

          perl -0pi -e 's/--k-sub-active-y: -1px;\n    --k-sub-active-scale: 1\.03;\n    min-width: 72px;\n    min-height: 60px;/--k-sub-active-y: -2px;\n    --k-sub-active-scale: 1.035;\n    min-width: 104px;\n    min-height: 88px;/' "$D"
          perl -0pi -e 's/\.k-subcutout-icon \{\n    position: relative;\n    width: 48px;\n    height: 42px;\n    font-size: 22px;/\.k-subcutout-icon {\n    position: relative;\n    width: 76px;\n    height: 68px;\n    font-size: 24px;/' "$D"
          perl -0pi -e 's/bottom: 2px;\n    width: 34px;\n    height: 10px;\n    border-radius: 50%;\n    background: var\(--sand-warm\);\n    opacity: \.16;\n    filter: blur\(4px\);/bottom: 3px;\n    width: 48px;\n    height: 12px;\n    border-radius: 50%;\n    background: var(--sand-warm);\n    opacity: .12;\n    filter: blur(5px);/' "$D"
          perl -0pi -e 's/\.k-shelf-object--subcategory \{\n    width: 46px;\n    height: 41px;/\.k-shelf-object--subcategory {\n    width: 72px;\n    height: 64px;/' "$D"
          perl -0pi -e 's/drop-shadow\(0 3px 5px var\(--border-text-08\)\)\n      grayscale\(1\)\n      sepia\(\.58\)\n      hue-rotate\(62deg\)\n      saturate\(1\.55\)\n      contrast\(1\.16\)\n      brightness\(\.74\);/drop-shadow(0 3px 5px var(--border-text-08))\n      saturate(1.02)\n      contrast(1.04);/' "$D"
          perl -0pi -e 's/drop-shadow\(0 4px 6px var\(--border-text-08\)\)\n      grayscale\(1\)\n      sepia\(\.68\)\n      hue-rotate\(62deg\)\n      saturate\(1\.8\)\n      contrast\(1\.22\)\n      brightness\(\.66\);/drop-shadow(0 4px 7px var(--border-text-08))\n      saturate(1.06)\n      contrast(1.06);/' "$D"
          perl -0pi -e 's/font-size: 21px;\n    line-height: 40px;\n    opacity: \.9;\n    filter: grayscale\(1\) sepia\(\.58\) hue-rotate\(62deg\) saturate\(1\.55\) contrast\(1\.16\) brightness\(\.74\);/font-size: 24px;\n    line-height: 64px;\n    opacity: .92;\n    filter: drop-shadow(0 2px 3px var(--border-text-08));/' "$D"
          perl -0pi -e 's/color: currentColor;\n    font-size: 10\.5px;/color: currentColor;\n    font-size: 11.5px;/' "$D"
          perl -0pi -e 's/\.k-subcutout-label \{\n    font-size: 11px;\n    font-weight: 630;/\.k-subcutout-label {\n    font-size: 11.5px;\n    font-weight: 630;/' "$D"
          perl -0pi -e 's/\.k-subcutout-rail \{\n    display: flex;\n    align-items: flex-start;\n    justify-content: flex-start;\n    flex-wrap: nowrap;\n    gap: 14px;/\.k-subcutout-rail {\n    display: flex;\n    align-items: flex-start;\n    justify-content: flex-start;\n    flex-wrap: nowrap;\n    gap: 18px;/' "$D"
          perl -0pi -e 's/html\.k-home-premium-v1 \.k-subcutout-rail \{\n    min-width: 0;\n    gap: 14px;/html.k-home-premium-v1 .k-subcutout-rail {\n    min-width: 0;\n    gap: 18px;/' "$D"
          perl -0pi -e 's/color: var\(--catalog-nav-sage\);\n    fill: var\(--catalog-nav-sage\);/color: var(--catalog-nav-muted);\n    fill: currentColor;/' "$D"
          perl -0pi -e 's/color: var\(--green-dark-text\);\n    fill: var\(--green-dark-text\);/color: var(--catalog-nav-strong);\n    fill: currentColor;/' "$D"

          perl -0pi -e 's/font-family: var\(--font\);\n    font-size: 13px;\n    font-weight: 750;\n    color: var\(--text\);/font-family: var(--font);\n    font-size: 14px;\n    font-weight: 780;\n    color: var(--text);/' "$L"
          perl -0pi -e 's/#k-subcats-wrap \.k-subcats-rail \{\n    display: flex;\n    align-items: center;\n    justify-content: flex-start;\n    flex-wrap: nowrap;\n    gap: 6px;/#k-subcats-wrap .k-subcats-rail {\n    display: flex;\n    align-items: flex-start;\n    justify-content: flex-start;\n    flex-wrap: nowrap;\n    gap: 18px;/' "$L"

          perl -0pi -e 's/width:\\s\*48px\[\^}\]\*height:\\s\*42px/width:\\s*76px[^}]*height:\\s*68px/g' "$T"
          perl -0pi -e 's/min-width:\\s\*72px\[\^}\]\*min-height:\\s\*60px/min-width:\\s*104px[^}]*min-height:\\s*88px/g' "$T"
          perl -0pi -e 's/font-size:\\s\*11px\/s/font-size:\\s*11\\.5px\/s/g' "$T"

          grep -q 'width: 72px;' "$D"
          grep -q 'height: 64px;' "$D"
          grep -q 'saturate(1.02)' "$D"
          ! grep -q 'grayscale(1)' "$D"
          ! grep -q 'hue-rotate(62deg)' "$D"
          grep -q 'font-size: 14px;' "$L"
          grep -q 'gap: 18px;' "$L"

      - name: Install Boutique
        run: npm --prefix public/boutique ci

      - name: Build and validate Boutique
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix public/boutique run deploy:css
          cd public/boutique
          npx jest tests/unit/category-cutout-navigation.test.js --runInBand
          npm run check:important
          npm run check:css-guard
          npm run check:css-specificity-guard
          npm run check:css-dist-only
          npm run check:cache
          npm run audit:arch
          npm run audit:ownership

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Create deterministic Chromium audit
        shell: bash
        run: |
          cat > public/boutique/tests/e2e/category-context-natural-audit.spec.js <<'EOF'
          'use strict';
          const { test, expect } = require('@playwright/test');
          const fs = require('fs');
          const path = require('path');

          for (const vp of [
            { name: 'desktop-1280', width: 1280, height: 800 },
            { name: 'desktop-1440', width: 1440, height: 900 },
          ]) {
            test(`${vp.name} natural subcategories`, async ({ page }) => {
              await page.setViewportSize({ width: vp.width, height: vp.height });
              await page.addInitScript(() => { window.KOMERCE_FORCE_FALLBACK_CATEGORIES = true; });
              await page.route(/\/api\//, async route => {
                const url = route.request().url();
                if (/\/api\/auth\/me/.test(url)) return route.fulfill({ status: 401, contentType: 'application/json', body: '{}' });
                return route.fulfill({ status: 200, contentType: 'application/json', body: '[]' });
              });
              await page.goto('/boutique/index.html', { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(700);
              await page.evaluate(async () => {
                document.documentElement.classList.add('k-home-premium-v1');
                const { renderSubcatRail } = await import('/boutique/js/controllers/home-controller.js');
                renderSubcatRail('Mode & Beauté', { count: 383 });
              });
              await page.waitForSelector('#k-subcats-wrap .k-subcutout-context', { state: 'visible', timeout: 10000 });
              await page.waitForTimeout(250);

              const metrics = await page.evaluate(() => {
                const wrap = document.querySelector('#k-subcats-wrap');
                const rail = wrap.querySelector('.k-subcutout-rail');
                const title = wrap.querySelector('.k-subcutout-title');
                const object = wrap.querySelector('.k-shelf-object--subcategory');
                const item = wrap.querySelector('.k-subcutout');
                const cs = el => getComputedStyle(el);
                const rect = el => el.getBoundingClientRect();
                return {
                  wrapHeight: rect(wrap).height,
                  railGap: cs(rail).gap,
                  titleFontSize: cs(title).fontSize,
                  objectWidth: rect(object).width,
                  objectHeight: rect(object).height,
                  objectFilter: cs(object).filter,
                  itemWidth: rect(item).width,
                  itemHeight: rect(item).height,
                  count: wrap.querySelectorAll('.k-subcutout').length,
                };
              });

              fs.mkdirSync(path.join(process.cwd(), 'visual-audit-natural'), { recursive: true });
              fs.writeFileSync(path.join(process.cwd(), 'visual-audit-natural', `${vp.name}.json`), JSON.stringify(metrics, null, 2));
              await page.locator('#k-subcats-wrap').screenshot({ path: `visual-audit-natural/${vp.name}-context.png` });
              await page.screenshot({ path: `visual-audit-natural/${vp.name}-viewport.png`, fullPage: false });

              expect(metrics.railGap).toBe('18px');
              expect(metrics.titleFontSize).toBe('14px');
              expect(metrics.objectWidth).toBeGreaterThanOrEqual(68);
              expect(metrics.objectHeight).toBeGreaterThanOrEqual(60);
              expect(metrics.itemWidth).toBeGreaterThanOrEqual(100);
              expect(metrics.itemHeight).toBeGreaterThanOrEqual(84);
              expect(metrics.objectFilter).not.toContain('grayscale');
              expect(metrics.objectFilter).not.toContain('sepia');
              expect(metrics.count).toBe(5);
              expect(metrics.wrapHeight).toBeLessThanOrEqual(150);
            });
          }
          EOF

      - name: Run Chromium audit
        working-directory: public/boutique
        run: npx playwright test tests/e2e/category-context-natural-audit.spec.js --project='Desktop Chrome' --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-context-natural-cutouts-v5
          path: public/boutique/visual-audit-natural/
          retention-days: 7

      - name: Commit source, bundles and clean harnesses
        if: success()
        shell: bash
        run: |
          rm -f public/boutique/tests/e2e/category-context-natural-audit.spec.js
          rm -rf public/boutique/visual-audit-natural
          rm -f .github/workflows/category-context-natural-cutouts-v4.yml
          rm -f .github/workflows/category-context-natural-cutouts-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/boutique .github/workflows/category-context-natural-cutouts-v4.yml .github/workflows/category-context-natural-cutouts-v5.yml
          git commit -m 'feat(boutique): restore natural desktop subcategory cutouts'
          git push origin HEAD:feat/desktop-category-context-v2
