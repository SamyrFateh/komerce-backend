name: MDM9 governance reopen

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mdm9-modal-gallery-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reconcile snapshots and cartography
        run: node scripts/mdm9-governance-reconcile.js
      - name: Install dependencies
        run: npm ci
      - name: Generate official artifacts
        run: |
          npm run arch:gen
          npm run arch:reconcile -- --write
          npm run business-graph:gen
          npm run meta:graph:save
      - name: Commit final governance artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mdm9-governance-reconcile.yml
          rm -f .github/workflows/mdm9-governance-reopen.yml
          rm -f scripts/mdm9-governance-reconcile.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'docs(governance): reconcile MDM9 and ING6 artifacts'
          git push origin HEAD:fix/mdm9-modal-gallery-layout
