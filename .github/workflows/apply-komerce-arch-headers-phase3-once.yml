name: Apply Komerce Architecture Headers Phase 3 Once

on:
  push:
    paths:
      - .github/workflows/apply-komerce-arch-headers-phase3-once.yml
      - scripts/apply-komerce-arch-headers-phase3.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-headers-phase3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply architecture headers phase 3
        run: node scripts/apply-komerce-arch-headers-phase3.js

      - name: Commit architecture headers phase 3
        run: |
          if git diff --quiet; then
            echo "No architecture header changes to commit."
            exit 0
          fi
          git config user.name "komerce-arch-bot"
          git config user.email "komerce-arch-bot@users.noreply.github.com"
          git add \
            services/payment-stripe.js \
            services/payment-cash-confirm.js \
            services/order-status-machine.js \
            services/order-service.js \
            services/notification-service.js \
            services/whatsapp-meta.js \
            routes/orders.js \
            routes/products.js \
            services/shared-cart-estimation-service.js \
            services/shared-cart-financial-guard.js \
            services/shared-cart-items-service.js \
            services/shared-cart-v41-transitions.js \
            services/shared-cart-queries.js \
            routes/wallet.js \
            routes/admin-boutique-categories.js \
            routes/boutique-suggestions.js
          git commit -m "Apply Komerce architecture headers phase 3"
          git push
