name: MDM9 migration 110 snapshot reconciliation

on:
  push:
    branches: [fix/mdm9-modal-gallery-layout]
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      NODE_ENV: test
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mdm9-modal-gallery-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reconcile migration 110 ALTER statements in live snapshot
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'docs/db/railway-live-schema.sql';
          let sql = fs.readFileSync(file, 'utf8');
          const marker = '-- Migration 110 — colonnes et contraintes d audit sur tables existantes';
          if (!sql.includes(marker)) {
            sql = `${sql.trimEnd()}\n\n${marker}\n\n` + String.raw`
ALTER TABLE public.supplier_catalog_imports
  DROP CONSTRAINT IF EXISTS supplier_catalog_imports_source_type_check;

ALTER TABLE public.supplier_catalog_imports
  ADD CONSTRAINT supplier_catalog_imports_source_type_check
  CHECK (source_type = ANY (ARRAY['csv'::text, 'manual'::text, 'api'::text, 'json'::text]));

ALTER TABLE public.supplier_catalog_imports
  ADD COLUMN IF NOT EXISTS profile_id text,
  ADD COLUMN IF NOT EXISTS profile_version integer,
  ADD COLUMN IF NOT EXISTS profile_hash text,
  ADD COLUMN IF NOT EXISTS source_sha256 text,
  ADD COLUMN IF NOT EXISTS source_bytes bigint,
  ADD COLUMN IF NOT EXISTS connector_name text,
  ADD COLUMN IF NOT EXISTS connector_version text,
  ADD COLUMN IF NOT EXISTS connector_contract_version text,
  ADD COLUMN IF NOT EXISTS pipeline_version text,
  ADD COLUMN IF NOT EXISTS status text NOT NULL DEFAULT 'COMPLETED',
  ADD COLUMN IF NOT EXISTS ready_count integer NOT NULL DEFAULT 0,
  ADD COLUMN IF NOT EXISTS quarantined_count integer NOT NULL DEFAULT 0,
  ADD COLUMN IF NOT EXISTS rejected_count integer NOT NULL DEFAULT 0,
  ADD COLUMN IF NOT EXISTS invalid_pct numeric(5,2),
  ADD COLUMN IF NOT EXISTS quarantined_pct numeric(5,2),
  ADD COLUMN IF NOT EXISTS started_at timestamptz,
  ADD COLUMN IF NOT EXISTS finished_at timestamptz,
  ADD COLUMN IF NOT EXISTS error_code text,
  ADD COLUMN IF NOT EXISTS error_detail text,
  ADD COLUMN IF NOT EXISTS batch_findings jsonb NOT NULL DEFAULT '[]'::jsonb;

ALTER TABLE public.supplier_catalog_imports
  DROP CONSTRAINT IF EXISTS supplier_catalog_imports_status_check;

ALTER TABLE public.supplier_catalog_imports
  ADD CONSTRAINT supplier_catalog_imports_status_check
  CHECK (status = ANY (ARRAY[
    'PROCESSING',
    'COMPLETED',
    'COMPLETED_WITH_QUARANTINE',
    'BLOCKED_QUARANTINE_THRESHOLD',
    'BLOCKED_INVALID_THRESHOLD',
    'FAILED'
  ]::text[]));

ALTER TABLE public.supplier_catalog_imports
  DROP CONSTRAINT IF EXISTS supplier_catalog_imports_profile_traceability_check;

ALTER TABLE public.supplier_catalog_imports
  ADD CONSTRAINT supplier_catalog_imports_profile_traceability_check
  CHECK (
    source_type <> 'json'
    OR (profile_id IS NOT NULL AND profile_version IS NOT NULL AND profile_hash IS NOT NULL)
  ) NOT VALID;

CREATE INDEX IF NOT EXISTS idx_sci_source_sha256 ON public.supplier_catalog_imports (source_sha256);
CREATE INDEX IF NOT EXISTS idx_sci_profile ON public.supplier_catalog_imports (profile_id, profile_version);
CREATE INDEX IF NOT EXISTS idx_sci_status ON public.supplier_catalog_imports (status, imported_at DESC);

ALTER TABLE public.sourcing_candidates
  DROP CONSTRAINT IF EXISTS sourcing_candidates_state_check;

ALTER TABLE public.sourcing_candidates
  ADD CONSTRAINT sourcing_candidates_state_check
  CHECK (state = ANY (ARRAY[
    'raw_imported', 'normalized', 'scanned', 'test_ready', 'watchlist',
    'imported_to_catalog', 'quarantined', 'rejected', 'archived'
  ]::text[]));

ALTER TABLE public.sourcing_candidates
  ADD COLUMN IF NOT EXISTS promotion_status text,
  ADD COLUMN IF NOT EXISTS promotion_reasons jsonb NOT NULL DEFAULT '[]'::jsonb,
  ADD COLUMN IF NOT EXISTS findings jsonb NOT NULL DEFAULT '[]'::jsonb,
  ADD COLUMN IF NOT EXISTS profile_id text,
  ADD COLUMN IF NOT EXISTS profile_version integer,
  ADD COLUMN IF NOT EXISTS profile_hash text,
  ADD COLUMN IF NOT EXISTS source_sha256 text,
  ADD COLUMN IF NOT EXISTS source_row_sha256 text,
  ADD COLUMN IF NOT EXISTS connector_version text,
  ADD COLUMN IF NOT EXISTS observed_at timestamptz;

ALTER TABLE public.sourcing_candidates
  DROP CONSTRAINT IF EXISTS sourcing_candidates_promotion_status_check;

ALTER TABLE public.sourcing_candidates
  ADD CONSTRAINT sourcing_candidates_promotion_status_check
  CHECK (promotion_status IS NULL OR promotion_status = ANY (ARRAY[
    'READY_FOR_PROMOTION',
    'QUARANTINED_UNSUPPORTED_MEDIA',
    'QUARANTINED_LOSSY_MAPPING',
    'QUARANTINED_CURRENCY_POLICY'
  ]::text[]));
` + '\n';
            fs.writeFileSync(file, sql);
          }
          NODE
      - name: Remove one-shot workflow before graph generation
        run: rm -f .github/workflows/mdm9-schema-reconcile.yml
      - name: Install dependencies
        run: npm ci
      - name: Regenerate official governance artifacts
        run: |
          npm run arch:gen
          npm run arch:reconcile -- --write
          npm run business-graph:gen
          npm run meta:graph:save
          npm run feature:360:gen
      - name: Validate live snapshot and failing integration suite
        run: |
          node scripts/check-schema-freshness.js
          node scripts/check-schema-resurrection.js
          psql "$DATABASE_URL" -f docs/db/railway-live-schema.sql
          node scripts/ci-migrate.js
          npx jest tests/integration/catalog-import-json.integration.test.js --ci --forceExit
      - name: Validate Boutique CSS bundle
        working-directory: public/boutique
        run: |
          npm ci
          npm run check:fast
      - name: Validate complete governance map
        run: |
          npm run arch:gate
          npm run map:check
      - name: Commit reconciled snapshot and artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'docs(db): complete migration 110 live snapshot'
          git push origin HEAD:fix/mdm9-modal-gallery-layout
