name: Governance graph — blind spot discovery (READ ONLY)
on:
  push:
    branches:
      - audit/discover-governance-blindspots-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Challenge detectors on known positive and negative fixtures (no DB)
        run: node --test tests/unit/novel-bug-patterns.test.js
      - name: Calibrate the calibrator (fail-closed negative controls)
        run: node --test tests/unit/scanner-calibration-verifier.test.js
      - name: Reproduce silent conflict against the real auto-parcel service (mocked PostgreSQL result)
        run: ./node_modules/.bin/jest --config jest.unit.config.js --runInBand tests/unit/auto-parcel-silent-conflict-discovery.test.js
      - name: Generate candidates FROM the full feature graph without named bugs
        run: node scripts/audits/governance-graph-discovery.js --out audit-results/discovery
      - name: Upload complete cross-domain graph and candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-discovery-graph
          path: audit-results/discovery
          if-no-files-found: error

  prove-inventory:
    name: Independent authority counterexample — real PostgreSQL (ROLLBACK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
      KOMERCE_DISABLE_CRONS: 'true'
      JWT_SECRET: ci-test-jwt-secret
      ADMIN_PASSWORD: ci-test-admin-password
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-test-authkey
      PAYPAL_CLIENT_ID: ci-test-paypal-client
      PAYPAL_CLIENT_SECRET: ci-test-paypal-secret
      PAYPAL_WEBHOOK_ID: ci-test-paypal-webhook
      META_WA_APP_SECRET: ci-test-meta-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build isolated database with canonical schema, never Railway
        run: |
          PGPASSWORD=komerce psql -v ON_ERROR_STOP=1 -h localhost -U komerce -d komerce_test -f docs/db/railway-live-schema.sql > /tmp/ci-schema.log
          node scripts/ci-db-bootstrap.js
      - name: Reproduce discovered cross-order receipt plus healthy negative control
        run: |
          mkdir -p audit-results/novel
          set -o pipefail
          node scripts/run-integration-tests.js --files=tests/integration/inventory-cross-order-governance-discovery.test.js | tee audit-results/novel/inventory-proof.log
      - name: Calibrate Auto-parcel business truth versus silent SQL conflict
        run: |
          set -o pipefail
          node scripts/run-integration-tests.js --files=tests/integration/auto-parcel-calibration-real-db.test.js | tee audit-results/novel/auto-parcel-proof.log
      - name: Calibrate Hub repack exemption vs Sourcing density on real PostgreSQL
        run: |
          set -o pipefail
          node scripts/run-integration-tests.js --files=tests/integration/hub-repack-exemption-calibration-real-db.test.js | tee audit-results/novel/hub-repack-proof.log
      - name: Reject missing or unpaired nominal/deviation PostgreSQL evidence
        run: |
          node scripts/audits/verify-calibration-evidence.js audit-results/novel/inventory-proof.log audit-results/novel/auto-parcel-proof.log audit-results/novel/hub-repack-proof.log --out audit-results/calibration
          cat audit-results/calibration/calibration.md
      - name: Preserve complete paired PostgreSQL evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-calibration-postgres-proof
          path: |
            audit-results/novel/
            audit-results/calibration/
          if-no-files-found: warn
