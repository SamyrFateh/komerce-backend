name: Staging E2E Hub and Relay credential reconciliation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only audit first, or audited per-E2E-account reconciliation
        required: true
        type: choice
        default: audit
        options: [audit, reconcile]
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-staging-e2e-logistics-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    # Only the repository owner's audit issue runs without manual approval.
    # Never allow an issue to request password reconciliation.
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        github.event.issue.user.login == github.repository_owner &&
        github.event.issue.title == '[staging-op] audit-hub-relais-e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KOMERCE_ENV: staging
      E2E_STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      E2E_LOGISTICS_RECONCILE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.issue.title == '[staging-op] reconcile-hub-relais-e2e' && 'reconcile' || 'audit') }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_AGENT_HUB_EMAIL: ${{ secrets.E2E_AGENT_HUB_EMAIL }}
      E2E_AGENT_HUB_PASSWORD: ${{ secrets.E2E_AGENT_HUB_PASSWORD }}
      E2E_AGENT_RELAIS_EMAIL: ${{ secrets.E2E_AGENT_RELAIS_EMAIL }}
      E2E_AGENT_RELAIS_PASSWORD: ${{ secrets.E2E_AGENT_RELAIS_PASSWORD }}
      E2E_MARKET_OPERATOR_EMAIL: ${{ secrets.E2E_MARKET_OPERATOR_EMAIL }}
      E2E_MARKET_OPERATOR_PASSWORD: ${{ secrets.E2E_MARKET_OPERATOR_PASSWORD }}
      HUB_MARKET_GRANT_MODE: audit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure issue-triggered credential checks are read-only
        if: ${{ github.event_name == 'issues' }}
        run: test "$E2E_LOGISTICS_RECONCILE_MODE" = 'audit'
      - name: Pin real deployed backend SHA, reject code drift
        shell: bash
        run: |
          set -euo pipefail
          # The backend may not redeploy for docs/workflow-only commits.
          # Verify exact runtime SHA is an ancestor of audited main, and reject
          # all runtime code changes absent from the deployed backend.
          DEPLOY_SHA="$(node -e '
          (async () => {
            const r = await fetch("https://komerce-backend-production.up.railway.app/health/version", {
              signal: AbortSignal.timeout(20000), redirect: "error"
            });
            if (!r.ok) throw Error("STAGING_VERSION_HTTP");
            const v = await r.json();
            const sha = String(v.commit || v.sha || "");
            if (!/^[a-f0-9]{40}$/i.test(sha)) throw Error("STAGING_VERSION_INVALID");
            process.stdout.write(sha);
          })().catch(() => { process.stderr.write("STAGING_VERSION_UNVERIFIED\n"); process.exit(2); });
          ')"
          git cat-file -e "${DEPLOY_SHA}^{commit}" || { echo STAGING_SHA_NOT_IN_MAIN_HISTORY; exit 2; }
          git merge-base --is-ancestor "$DEPLOY_SHA" HEAD || { echo STAGING_SHA_NOT_ANCESTOR; exit 2; }
          DRIFT="$(git diff --name-only "$DEPLOY_SHA" HEAD | grep -Ev '^(docs/|\.github/workflows/)' || true)"
          if [ -n "$DRIFT" ]; then
            echo STAGING_RUNTIME_DRIFT_DENIED
            exit 2
          fi
          echo "E2E_EXPECTED_DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
      - name: Verify identities and reconcile only explicitly dedicated E2E Hub/Relay accounts
        run: node scripts/recette/reconcile-staging-logistics-e2e.js
      - name: Audit central Hub routes and forbidden market-team grants (read-only)
        run: node scripts/recette/staging-hub-e2e-market-grant.js
