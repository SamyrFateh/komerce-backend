name: Hub V1 — final transactional proof on official staging

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: komerce-hub-v1-official-staging-final
  cancel-in-progress: false

jobs:
  final-staging:
    name: One RUN8 · 13 real service steps · no external payment
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] hub-v1-final-transaction-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      HUB_V1_E2E_APPLY_MODE: approved
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      STRIPE_SECRET_KEY: sk_test_certification_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_certification_placeholder
      PAYPAL_CLIENT_ID: ci-certification-placeholder
      PAYPAL_CLIENT_SECRET: ci-certification-placeholder
      PAYPAL_WEBHOOK_ID: ci-certification-placeholder
      META_WA_APP_SECRET: ci-certification-placeholder
      AUTHKEY_API_KEY: ci-certification-placeholder
      JWT_SECRET: ci-certification-placeholder
      QR_SECRET: ci-certification-placeholder
      ADMIN_PASSWORD: ci-certification-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Pin source commit and choose one unique RUN8
        shell: bash
        run: |
          echo "E2E_EXPECTED_DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "HUB_V1_CERTIFICATION_RUN=$(node -p 'require("crypto").randomBytes(4).toString("hex").toUpperCase()')" >> "$GITHUB_ENV"
      - name: Refuse missing remote DB secret
        run: test -n "$DATABASE_URL"
      - name: Mandatory pure guard tests
        run: node node_modules/jest/bin/jest.js tests/unit/hub-v1-staging-target-authorization.test.js tests/unit/hub-v1-runner-evidence.test.js --runInBand --ci --forceExit
      - name: First pass — strict fingerprint + SHA + market baseline + dry run
        shell: bash
        run: |
          mkdir -p test-results/hub-v1-cert
          node scripts/recette/hub-v1-certification-runner.js --allow-remote-staging --run="$HUB_V1_CERTIFICATION_RUN" --dry-run
      - name: Official staging — execute real 13 steps on one fixture
        shell: bash
        run: |
          node scripts/recette/hub-v1-certification-runner.js --allow-remote-staging --run="$HUB_V1_CERTIFICATION_RUN"
      - name: Archive transactional verdict and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-v1-official-staging-final-${{ github.run_id }}
          path: test-results/hub-v1-cert/
          if-no-files-found: warn
          retention-days: 30
      - name: Declare remaining gate
        if: always()
        run: |
          echo "### Hub V1 official staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Real transactions only if target fingerprint, deployment SHA and commercial baseline matched." >> "$GITHUB_STEP_SUMMARY"
          echo "No fixture DELETE; immutable evidence is retained. Production GO still requires Chromium business review." >> "$GITHUB_STEP_SUMMARY"
