name: Refine Komerce Architecture Quality Once

on:
  push:
    paths:
      - .github/workflows/refine-komerce-arch-quality-once.yml
      - scripts/refine-komerce-arch-quality.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-arch-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refine architecture headers
        run: node scripts/refine-komerce-arch-quality.js

      - name: Generate architecture graph
        run: node scripts/generate-komerce-arch-graph.js

      - name: Commit refined architecture headers
        run: |
          if git diff --quiet; then
            echo "No architecture quality changes to commit."
            exit 0
          fi
          git config user.name "komerce-arch-bot"
          git config user.email "komerce-arch-bot@users.noreply.github.com"
          git add server.js bootstrap routes services middleware utils public/boutique/js docs/KOMERCE_ARCH_HEADER_GRAPH.md docs/komerce-arch-header-graph.json
          git commit -m "Refine Komerce architecture header quality"
          git push
