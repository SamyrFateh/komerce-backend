name: CJ 20 canonical staging intake — guarded
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-cj-twenty-canonical-staging
  cancel-in-progress: false
jobs:
  replay:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] cj-twenty-canonical-intake-approved'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GITHUB_ACTIONS: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_ALLOW_CJ_CANONICAL_20_STAGING: '1'
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      CJ_ACCESS_TOKEN: ${{ secrets.KOMERCE_CJ_PROOF_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Acquire exact 20 CJ products and run canonical sourcing import (staging-only, no publishing)
        run: node scripts/cj-20-canonical-staging-replay.js
      - name: Preserve per-product and FX deferral evidence even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-twenty-staging-replay-${{ github.run_id }}
          path: test-results/cj-canonical-20-staging/report.json
          retention-days: 21
          if-no-files-found: warn
