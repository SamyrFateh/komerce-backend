name: Agent AIR packing one-shot

on:
  push:
    branches: [agent/transport-rail-doctrine-audit]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transport-rail-doctrine-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply generic impact fix and rail-aware packing
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # 1) impact-check: precise @komerce-arch header first, manifest only legacy fallback.
          p = Path('scripts/impact-check.js')
          s = p.read_text()
          marker = "// ── Analyse d'impact en cascade ──────────────────────────────"
          helper = r'''function readServiceHeaderImpact(filePath) {
            try {
              const src = fs.readFileSync(filePath, 'utf8');
              const header = src.slice(0, 5000);
              const read = header.match(/@db-read\s+([^\n\r*]+)/);
              const write = header.match(/@db-write\s+([^\n\r*]+)/);
              const usedBy = header.match(/@used-by\s+([^\n\r*]+)/);
              const hasArchImpact = Boolean(read || write || usedBy);
              if (!hasArchImpact) return null;

              const tables = new Set();
              for (const match of [read, write]) {
                if (!match) continue;
                match[1].split(',').map(x => x.trim()).filter(x => x && x !== 'none')
                  .forEach(x => tables.add(x));
              }

              const routes = new Set();
              if (usedBy) {
                usedBy[1].split(',').map(x => x.trim()).filter(Boolean)
                  .filter(x => x.startsWith('routes/'))
                  .forEach(x => routes.add(x));
              }

              return { tables: [...tables], routes: [...routes] };
            } catch {
              return null;
            }
          }

          '''
          if helper not in s:
              s = s.replace(marker, helper + marker)
          old = r'''      case 'service': {
                // Résolution via l'index manifest : file → feature → routes exposées + tables
                const manifest = MANIFEST_INDEX.get(file);
                if (manifest) {
                  manifest.routes.forEach(r => impact.routes.add(r));
                  manifest.tables.forEach(t => impact.tables.add(t));
                }
                // Fallback : chercher dans impact-config.json services si déclaré
                const svcConfig = (CONFIG.architecture.services || {})[name];
                if (svcConfig) {
                  (svcConfig.tables  || []).forEach(t => impact.tables.add(t));
                  (svcConfig.services|| []).forEach(s => impact.services.add(s));
                  if (svcConfig.critical) impact.criticalFiles.push(file);
                }
                break;
              }'''
          new = r'''      case 'service': {
                // Le header @komerce-arch du fichier décrit l'impact réel du service.
                // Le manifest feature complet reste uniquement un fallback legacy.
                const headerImpact = readServiceHeaderImpact(file);
                if (headerImpact) {
                  headerImpact.routes.forEach(r => impact.routes.add(r));
                  headerImpact.tables.forEach(t => impact.tables.add(t));
                } else {
                  const manifest = MANIFEST_INDEX.get(file);
                  if (manifest) {
                    manifest.routes.forEach(r => impact.routes.add(r));
                    manifest.tables.forEach(t => impact.tables.add(t));
                  }
                }
                const svcConfig = (CONFIG.architecture.services || {})[name];
                if (svcConfig) {
                  (svcConfig.tables  || []).forEach(t => impact.tables.add(t));
                  (svcConfig.services|| []).forEach(s => impact.services.add(s));
                  if (svcConfig.critical) impact.criticalFiles.push(file);
                }
                break;
              }'''
          if old not in s:
              raise SystemExit('impact service case not found')
          p.write_text(s.replace(old, new))

          # 2) transport rail owns packing profiles. AIR remains deliberately pending.
          p = Path('services/transport-rails.js')
          s = p.read_text()
          insert_after = "const COMMERCIAL_EXPOSURE = Object.freeze({\n  PUBLIC: 'PUBLIC',\n  DISABLED: 'DISABLED',\n});\n"
          packing = """

const PACKING_PROFILE_STATUS = Object.freeze({
  ACTIVE: 'ACTIVE',
  PENDING: 'PENDING',
});

const PACKING_PROFILES = Object.freeze({
  SEA_STANDARD: Object.freeze({
    status: PACKING_PROFILE_STATUS.ACTIVE,
    config: Object.freeze({
      maxParcelWeightKg: 25,
      maxParcelVolumeCm3: 100_000,
      targetParcelValueKmf: 300_000,
    }),
  }),
  AIR_EXPRESS: Object.freeze({
    status: PACKING_PROFILE_STATUS.PENDING,
    config: null,
  }),
});
"""
          if 'const PACKING_PROFILE_STATUS' not in s:
              s = s.replace(insert_after, insert_after + packing)
          fn_marker = "function isTransportRailCommerciallyExposed(rawCode) {"
          fn = """
function getTransportRailPackingProfile(rawCode) {
  const rail = getTransportRail(rawCode);
  if (!rail) return null;

  const profile = PACKING_PROFILES[rail.code];
  if (!profile || profile.status !== PACKING_PROFILE_STATUS.ACTIVE || !profile.config) {
    throw new TransportRailError(
      `Profil de packing non stabilise pour ${rail.code}`,
      'TRANSPORT_RAIL_PACKING_PROFILE_PENDING'
    );
  }

  return profile.config;
}

"""
          if 'function getTransportRailPackingProfile' not in s:
              s = s.replace(fn_marker, fn + fn_marker)
          s = s.replace("  COMMERCIAL_EXPOSURE,\n  TRANSPORT_RAILS,", "  COMMERCIAL_EXPOSURE,\n  PACKING_PROFILE_STATUS,\n  PACKING_PROFILES,\n  TRANSPORT_RAILS,")
          s = s.replace("  getTransportRail,\n  isTransportRailCommerciallyExposed,", "  getTransportRail,\n  getTransportRailPackingProfile,\n  isTransportRailCommerciallyExposed,")
          p.write_text(s)

          # 3) Packing gets an explicit rail context. UNASSIGNED keeps legacy config;
          # AIR fails closed instead of silently inheriting SEA limits.
          p = Path('services/parcelOptimizationService.js')
          s = p.read_text()
          strict = "'use strict';\n"
          req = "'use strict';\n\nconst { getTransportRailPackingProfile } = require('./transport-rails');\n"
          if "require('./transport-rails')" not in s:
              s = s.replace(strict, req, 1)
          old_sig = "function buildParcelsFromAvailableItems({ items = [], existingParcels = [], config = {} } = {}) {\n  const cfg = { ...DEFAULT_CONFIG, ...config };"
          new_sig = "function buildParcelsFromAvailableItems({ items = [], existingParcels = [], config = {}, transportRailCode = null } = {}) {\n  const railConfig = transportRailCode ? getTransportRailPackingProfile(transportRailCode) : {};\n  const cfg = { ...DEFAULT_CONFIG, ...railConfig, ...config };"
          if old_sig not in s:
              raise SystemExit('packing signature marker not found')
          s = s.replace(old_sig, new_sig)
          s = s.replace(" * @param {object}   params.config          — Configuration (DEFAULT_CONFIG par défaut)", " * @param {object}   params.config          — Overrides explicites de configuration\n * @param {string|null} params.transportRailCode — Rail canonique ou UNASSIGNED (null)")
          p.write_text(s)

          # 4) Concept contract evolves because packing now consumes the rail contract.
          p = Path('governance/concepts.json')
          doc = json.loads(p.read_text())
          c = doc['concepts'][0]
          c['revision'] = '2026-07-11-air-express-packing-v1'
          if 'services/parcelOptimizationService.js' not in c['contractPaths']:
              c['contractPaths'].append('services/parcelOptimizationService.js')
          p.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n')

          p = Path('governance/concept-impact-acks.json')
          doc = json.loads(p.read_text())
          reasons = {
            'economic-engine': ('adapted', 'Le packing consomme maintenant un profil par rail; AIR_EXPRESS reste sans profil actif et aucun prix air n est invente.'),
            'orders': ('compatible', 'Le rail execute n est toujours pas persiste; le packing accepte un contexte de rail explicite sans introduire de defaut maritime.'),
            'catalog': ('compatible', 'Aucune eligibilite AIR n est exposee en catalogue; le profil de packing AIR reste PENDING et ferme.'),
            'customs': ('compatible', 'Aucune regle de transportabilite n est encore branchee; AIR_EXPRESS echoue ferme avant packing tant que son profil est absent.'),
            'notifications': ('not-applicable', 'Aucune promesse AIR ni ETA AIR n est produite par le raccord rail vers packing.'),
            'dashboard': ('not-applicable', 'Aucun rail execute n est encore persiste ou segmente dans les projections dashboard.')
          }
          for ack in doc['acks']:
              ack['revision'] = '2026-07-11-air-express-packing-v1'
              ack['status'], ack['reason'] = reasons[ack['feature']]
          p.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n')

          # 5) Tests: rail profile behavior and packing fail-closed.
          p = Path('tests/unit/transport-rails.test.js')
          s = p.read_text()
          if 'getTransportRailPackingProfile' not in s:
              s = s.replace("  listCommercialTransportRails,", "  listCommercialTransportRails,\n  getTransportRailPackingProfile,")
          extra = """

describe('packing profiles par rail', () => {
  test('SEA_STANDARD expose le profil historique de packing', () => {
    expect(getTransportRailPackingProfile('SEA_STANDARD')).toEqual(expect.objectContaining({
      maxParcelWeightKg: 25,
      maxParcelVolumeCm3: 100000,
    }));
  });

  test('AIR_EXPRESS echoue ferme tant que son profil de packing est PENDING', () => {
    expect(() => getTransportRailPackingProfile('AIR_EXPRESS')).toThrow(expect.objectContaining({
      code: 'TRANSPORT_RAIL_PACKING_PROFILE_PENDING',
    }));
  });
});
"""
          if "packing profiles par rail" not in s:
              s += extra
          p.write_text(s)

          p = Path('tests/unit/parcelOptimizationService.test.js')
          s = p.read_text()
          extra = """

describe('packing contextualise par transport rail', () => {
  test('UNASSIGNED conserve explicitement le profil legacy sans choisir SEA', () => {
    const res = buildParcelsFromAvailableItems({ items: [item()], transportRailCode: null });
    expect(res.createdParcels).toHaveLength(1);
  });

  test('SEA_STANDARD utilise un profil de packing actif', () => {
    const res = buildParcelsFromAvailableItems({ items: [item()], transportRailCode: 'SEA_STANDARD' });
    expect(res.createdParcels).toHaveLength(1);
  });

  test('AIR_EXPRESS est bloque tant que son profil de packing est PENDING', () => {
    expect(() => buildParcelsFromAvailableItems({
      items: [item()],
      transportRailCode: 'AIR_EXPRESS',
    })).toThrow(expect.objectContaining({ code: 'TRANSPORT_RAIL_PACKING_PROFILE_PENDING' }));
  });
});
"""
          if 'packing contextualise par transport rail' not in s:
              s += extra
          p.write_text(s)
          PY

          node scripts/impact-check.js --files=services/transport-rails.js --json > /tmp/impact-rail.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/impact-rail.json', 'utf8');
          const match = raw.match(/\{[\s\S]*"score"[\s\S]*\}/);
          if (!match) throw new Error('impact JSON absent');
          const result = JSON.parse(match[0]);
          if (result.tables.length !== 0 || result.routes.length !== 0) {
            throw new Error(`faux blast radius persistant: ${result.tables.length} tables, ${result.routes.length} routes`);
          }
          console.log(`impact smoke: score=${result.score} tables=${result.tables.length} routes=${result.routes.length}`);
          NODE
          npm test -- --runTestsByPath tests/unit/transport-rails.test.js tests/unit/parcelOptimizationService.test.js tests/unit/concept-impact-gate.test.js --runInBand --no-coverage
          node scripts/concept-impact-gate.js --base origin/main
          npm run map:check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/zz-agent-air-packing-once.yml
          git add scripts/impact-check.js services/transport-rails.js services/parcelOptimizationService.js governance/concepts.json governance/concept-impact-acks.json tests/unit/transport-rails.test.js tests/unit/parcelOptimizationService.test.js docs/KOMERCE_ARCH_HEADER_GRAPH.md docs/komerce-arch-header-graph.json
          git commit -m "feat(logistics): make packing transport-rail aware"
          git push origin HEAD:agent/transport-rail-doctrine-audit
