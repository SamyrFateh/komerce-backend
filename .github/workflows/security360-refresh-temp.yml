name: Temporary Security 360 Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-security-360:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate fresh Security 360
        run: npm run security:360
      - name: Commit refreshed projection
        shell: bash
        run: |
          if git diff --quiet -- docs/SECURITY_360.json docs/SECURITY_360.md; then
            echo "Security 360 already fresh"
            exit 0
          fi
          git config user.name "komerce-security-bot"
          git config user.email "komerce-security-bot@users.noreply.github.com"
          git add docs/SECURITY_360.json docs/SECURITY_360.md
          git commit -m "chore(security): refresh Security 360 projection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
