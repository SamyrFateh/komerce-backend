name: Temporary Security 360 Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh-security-360:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate fresh Security 360
        run: npm run security:360
      - name: Upload generated Security 360
        uses: actions/upload-artifact@v4
        with:
          name: security-360-refresh
          path: |
            docs/SECURITY_360.json
            docs/SECURITY_360.md
          if-no-files-found: error
