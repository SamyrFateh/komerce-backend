name: Temporary Security 360 projection refresh

on:
  push:
    branches:
      - feat/aliexpress-open-platform-oauth

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/aliexpress-open-platform-oauth
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Generate canonical Security 360 projections
        run: npm run security:360
      - name: Restore canonical runner and remove temporary workflow
        run: |
          git fetch origin main
          git checkout origin/main -- scripts/run-security-360.js
          git rm .github/workflows/security360-refresh-temp.yml
      - name: Commit generated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SECURITY_360.json docs/SECURITY_360.md scripts/run-security-360.js
          git diff --cached --stat
          git commit -m "docs(security): refresh Security 360 projection"
          git push origin HEAD:feat/aliexpress-open-platform-oauth