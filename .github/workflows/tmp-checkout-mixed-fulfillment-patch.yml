        + '<span class="ck-recap-origin-title">' + sanitize(origin.title) + '</span>'
        + (origin.badge
          ? '<span class="ck-recap-origin-badge">' + sanitize(origin.badge) + '</span>'
          : '')
        + '<span class="ck-recap-toggle-sub">'
          + _checkoutFulfillmentSummaryLabel(items)
        + '</span>'
      + '</span>'
    + '</span>'
    + '<span class="ck-recap-toggle-chevron" aria-hidden="true">\u203A</span>';

  const toggleSub = toggle.querySelector('.ck-recap-toggle-sub');

  const content = document.createElement('div');
  content.id = 'ck-recap-content';
  content.className = 'ck-recap-content';

  const indexedItems = items.map((item, index) => ({ item, index }));

  const appendRow = (target, entry) => {
    const it = entry.item;
