name: Temporary mixed fulfillment checkout patch

on:
  push:
    branches:
      - feat/checkout-mixed-fulfillment-groups-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/checkout-mixed-fulfillment-groups-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded checkout grouping patch
        run: python .tmp/patch_checkout_mixed_fulfillment.py
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Targeted checkout tests
        run: npm --prefix public/boutique test -- tests/unit/b-checkout.test.js --runInBand
      - name: Boutique source gates
        run: |
          node public/boutique/scripts/check-js-imports.js
          node public/boutique/scripts/check-no-css-injection.js
          node public/boutique/scripts/check-important.js --strict
          node public/boutique/scripts/check-breakpoints.js --strict
          node public/boutique/scripts/check-css-vars.js --strict
          node public/boutique/scripts/check-zindex-contract.js --strict
          node public/boutique/scripts/check-sticky-integrity.js --strict
          node public/boutique/scripts/audit-boutique-arch.js
      - name: Commit bounded checkout changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/js/b-checkout.js \
                  public/boutique/css/checkout-vertical-rail.css \
                  public/boutique/tests/unit/b-checkout.test.js \
                  public/boutique/features/checkout.feature.js
          git commit -m "feat(checkout): group local-now and incoming items"
          git push origin HEAD:feat/checkout-mixed-fulfillment-groups-v1
