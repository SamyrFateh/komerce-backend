          if set_start < 0 or set_end < 0:
              raise SystemExit('checkout selection setter markers not found')
          setter = checkout[set_start:set_end]
          setter = replace_once(
              setter,
              "  const nextItems = current.items.map((item, i) => (\n    i === index\n      ? { ...item, checkout_included: !!included }\n      : item\n  ));",
              "  const nextItems = current.items.map((item, i) => {\n    if (i !== index) return item;\n    const next = { ...item, checkout_included: !!included };\n    delete next.fulfillment_preview_state;\n    return next;\n  });",
              'checkout inclusion state reset',
          )
          setter = replace_once(
              setter,
              '  refreshCheckoutComputedUI();\n  updateWalletDisplay();\n}',
              '  refreshCheckoutComputedUI();\n  updateWalletDisplay();\n  _refreshCheckoutFulfillmentPreview(state.orderData);\n}',
              'checkout inclusion preview refresh',
