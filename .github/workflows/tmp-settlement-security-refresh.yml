name: tmp settlement security refresh

on:
  push:
    branches:
      - feat/market-delegation-settlement

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-delegation-settlement
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run security:360
      - name: Commit generated Security 360
        shell: bash
        run: |
          git add docs/SECURITY_360.json docs/SECURITY_360.md
          if git diff --cached --quiet; then
            echo "Security 360 already fresh"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(security): refresh Security 360 for settlement"
          git push origin HEAD:feat/market-delegation-settlement
