name: Lot 2A migrations bootstrap proof

on:
  push:
    branches:
      - agent/lot2a-pr-enforcement-migrations

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Prove scope and immutability semantics
        run: |
          npx jest --config jest.unit.config.js \
            tests/unit/pr-enforcement-scope.test.js \
            tests/unit/check-migration-immutability.test.js \
            --runInBand --forceExit
      - name: Audit migration immutability on unchanged base
        env:
          BASE_SHA: b83ddf36160813919594fa712ca86cc8fbed8150
          HEAD_SHA: b83ddf36160813919594fa712ca86cc8fbed8150
        run: node scripts/check-migration-immutability.js --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Audit schema freshness on current main truth
        run: node scripts/check-schema-freshness.js
      - name: Audit anti-resurrection on current live dump
        run: node scripts/check-schema-resurrection.js
      - name: Prove zero mutation
        run: git diff --exit-code
