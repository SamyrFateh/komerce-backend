name: tmp-provider-security-final
on:
  push:
    branches:
      - feat/market-delegation-provider-v2
permissions:
  contents: write
jobs:
  security:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: provider-review-security-only-2026-09
      META_WA_APP_SECRET: provider-review-meta-only-2026-09
      META_WA_VERIFY_TOKEN: provider-review-verify-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Regenerate Security 360 and capture exact result
        run: |
          set +e
          node scripts/gen-security-360.js > /tmp/security.txt 2>&1
          STATUS=$?
          {
            echo "security_status=$STATUS"
            cat /tmp/security.txt
          } > tmp-provider-security-validation.txt
          exit 0
      - name: Commit projection and remove diagnostics
        run: |
          rm .github/workflows/tmp-provider-security-final.yml
          rm -f tmp-provider-review-validation.txt
          git config user.name provider-review-bot
          git config user.email provider-review-bot@users.noreply.github.com
          git add -A
          git commit -m "chore(provider): régénérer la projection Security 360"
          git push origin HEAD:feat/market-delegation-provider-v2
