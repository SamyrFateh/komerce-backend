name: Lot 8 contract repair once

on:
  push:
    branches:
      - test/lot8-pre-go-live-certification

permissions:
  contents: write

concurrency:
  group: lot8-contract-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/lot8-pre-go-live-certification
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Regenerate and verify API contract
        run: |
          npm run contract:generate
          node scripts/contract-check.js

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/lot8-contract-repair-once.yml

      - name: Commit generated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "fix: refresh API contract for Lot 8 certification"
          git push origin HEAD:test/lot8-pre-go-live-certification
