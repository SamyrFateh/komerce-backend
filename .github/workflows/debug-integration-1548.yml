name: Debug integration 1548

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: read

jobs:
  integration_debug:
    name: Integration debug artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-test-jwt-secret
      ADMIN_PASSWORD: ci-test-admin-password
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-test-authkey
      PAYPAL_CLIENT_ID: ci-test-paypal-client
      PAYPAL_CLIENT_SECRET: ci-test-paypal-secret
      PAYPAL_WEBHOOK_ID: ci-test-paypal-webhook
      META_WA_APP_SECRET: ci-test-meta-secret
      KOMERCE_DISABLE_CRONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Rebuild PostgreSQL from canonical schema-only snapshot
        run: |
          PGPASSWORD=komerce psql -h localhost -U komerce -d komerce_test -f docs/db/railway-live-schema.sql
          node scripts/ci-db-bootstrap.js
      - name: Integration DB proofs with persisted log
        shell: bash
        run: |
          set +e
          npm run test:integration 2>&1 | tee integration.log
          status=${PIPESTATUS[0]}
          echo "$status" > integration.status
          exit "$status"
      - name: Upload integration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-debug-1548
          path: |
            integration.log
            integration.status
          if-no-files-found: error
