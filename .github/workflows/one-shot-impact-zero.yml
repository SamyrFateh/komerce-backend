name: One-shot impact suppressions zero

on:
  push:
    branches:
      - governance/impact-suppressions-zero

permissions:
  contents: write

jobs:
  apply-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci

      - name: Repair one-shot literal
        run: node scripts/fix-one-shot-impact-zero.js

      - name: Apply permanent refactors
        run: node scripts/one-shot-impact-zero.js

      - name: Targeted backend proofs
        run: >-
          npx jest
          tests/unit/impact-check-security-conventions.test.js
          tests/unit/dashboard-metrics-helpers.test.js
          tests/unit/dashboard-metrics.test.js
          tests/unit/admin-costing.test.js
          tests/unit/parcels-route.test.js
          --runInBand

      - name: Suppression ledger must be clean
        run: npm run impact:suppressions:check

      - name: Feature schema and guard
        run: |
          node scripts/feature-schema-check.js --strict --full
          node scripts/feature-guard.js --strict

      - name: Prove in-process Boutique static server
        run: |
          node <<'NODE'
          const http = require('http');
          const smoke = require('./public/boutique/scripts/gate-smoke-boutique.cjs');
          (async () => {
            const server = await smoke.startServer();
            try {
              await new Promise((resolve, reject) => {
                http.get(smoke.BASE_URL, (res) => {
                  res.resume();
                  if (res.statusCode !== 200) return reject(new Error(`status ${res.statusCode}`));
                  resolve();
                }).on('error', reject);
              });
            } finally {
              await smoke.stopServer(server);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit permanent refactors only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/impact-suppressions.json \
            services/dashboard-metrics/_helpers.js \
            services/dashboard-metrics/control-tower.js \
            routes/admin-costing.js \
            routes/parcels.js \
            public/boutique/scripts/gate-smoke-boutique.cjs \
            tests/unit/dashboard-metrics-helpers.test.js \
            tests/unit/admin-costing.test.js \
            tests/unit/parcels-route.test.js \
            tests/unit/impact-check-security-conventions.test.js
          git diff --cached --check
          git commit -m "fix(governance): eliminate final impact suppressions"
          git push origin HEAD:governance/impact-suppressions-zero
