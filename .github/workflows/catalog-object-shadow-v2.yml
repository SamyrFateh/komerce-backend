name: Catalog object family V2 — shadow-only proof
on:
  pull_request:
    paths:
      - 'scripts/cj-object-shadow-v2.js'
      - 'scripts/cj-deterministic-family-probe.js'
      - 'scripts/cj-headnoun-ab-experiment.js'
      - 'scripts/cj-headnoun-bound.js'
      - 'tests/unit/cj-headnoun-bound.test.js'
      - 'tests/unit/cj-headnoun-ab-experiment.test.js'
      - 'tests/unit/cj-deterministic-family-probe.test.js'
      - 'scripts/cj-object-extract-batch.js'
      - 'tests/unit/cj-object-extract-batch.test.js'
      - 'tests/unit/cj-object-shadow-v2.test.js'
      - 'features/catalog.feature.js'
      - '.github/workflows/catalog-object-shadow-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  shadow-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check pure scripts and adversarial family propagation
        run: |
          set -euo pipefail
          node --check scripts/cj-object-shadow-v2.js
          node --check scripts/cj-deterministic-family-probe.js
          node --check scripts/cj-headnoun-ab-experiment.js
          node --check scripts/cj-headnoun-bound.js
          node --check scripts/cj-object-extract-batch.js
          npx jest --config jest.unit.config.js tests/unit/cj-object-shadow-v2.test.js tests/unit/cj-object-extract-batch.test.js tests/unit/cj-deterministic-family-probe.test.js tests/unit/cj-headnoun-ab-experiment.test.js tests/unit/cj-headnoun-bound.test.js --runInBand --no-coverage
      - name: Recover exact 498 authentic products and V1 decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline v1
          gh run download 40518230098 -R "$GITHUB_REPOSITORY" -n cj-balanced-e2e-500 -D baseline
          echo '9ff18f6f902f2e72fc893a90da96b61058c77028d55e941381631fc9fb8116de  baseline/classification-evidence.json' | sha256sum -c -
          gh run download 40607392815 -R "$GITHUB_REPOSITORY" -n cj-498-p1-real-pg-e2e-40607392815 -D v1
      - name: Produce blind reviews and 498-identity shadow inventory without API
        run: |
          set -euo pipefail
          node scripts/cj-object-shadow-v2.js prepare baseline/classification-evidence.json v1/all-498-decisions.json artifacts/object-shadow
          node -e "const r=require('./artifacts/object-shadow/prepare-report.json');if(r.source_count!==498||r.v1_by_status.AUTO_CLASSIFIED!==63||r.v1_by_status.CATEGORY_CLASSIFIED!==240||r.v1_by_status.REVIEW_REQUIRED!==195)process.exit(1)"
      - name: Probe family candidates from real CJ 498 WITHOUT AI
        run: |
          set -euo pipefail
          node scripts/cj-deterministic-family-probe.js baseline/classification-evidence.json v1/all-498-decisions.json artifacts/object-shadow/deterministic-probe
          node -e "const r=require('./artifacts/object-shadow/deterministic-probe/report.json');if(r.counts.products!==498||r.certification!=='NOT_CERTIFIED'||r.counts.v1_review_products!==195)process.exit(1)"
      - name: Export A-only head-noun family review without inspecting sealed B
        run: |
          set -euo pipefail
          node scripts/cj-headnoun-ab-experiment.js train baseline/classification-evidence.json v1/all-498-decisions.json artifacts/object-shadow/headnoun-AB
          node -e "const m=require('./artifacts/object-shadow/headnoun-AB/A-training-manifest.json');if(m.stats.source_A<200||m.stats.source_A>300||m.certification!=='NOT_CERTIFIED'||m.stats.human_decisions!==0)process.exit(1)"
      - name: One-shot B upper bound, no human labels or AI keys
        run: |
          set -euo pipefail
          node scripts/cj-headnoun-bound.js baseline/classification-evidence.json v1/all-498-decisions.json artifacts/object-shadow/one-shot-verdict
          node -e "const r=require('./artifacts/object-shadow/one-shot-verdict/B-theoretical-reuse-bound.json');if(r.primary.A_products!==248||r.primary.B_products!==250||r.primary.B_review_products!==91||r.primary.A_eligible_families!==11||r.primary.B_potential_reuse_review!==4||r.final_decision!=='NO_GO_UNDER_OPUS_25_PERCENT_REUSE_THRESHOLD')process.exit(1)"
      - name: Preserve review-ready evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-object-shadow-v2-${{ github.run_id }}
          path: artifacts/object-shadow/
          if-no-files-found: warn
          retention-days: 30
