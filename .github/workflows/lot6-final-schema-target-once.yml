name: Lot 6 final schema target once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: lot6-final-schema-target
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/lot6-schema-reconciliation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgres://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: lot6-ci-secret-not-for-prod
      ADMIN_PASSWORD: lot6-ci-admin
      QR_SECRET: lot6-ci-qr-secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
      KOMERCE_DISABLE_CRONS: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lot6-schema-reconciliation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Rebuild target from the latest canonical main dump
        run: |
          git fetch origin main
          git checkout origin/main -- docs/db/railway-live-schema.sql
          sed -i '/^\\restrict /d; /^\\unrestrict /d' docs/db/railway-live-schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/db/railway-live-schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/122_cleanup_realdb_test_schema_residue.sql
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges > docs/db/railway-live-schema.sql
          node scripts/check-schema-resurrection.js

      - name: Align SCHEMA.md and remove the one-shot before governance generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/SCHEMA.md')
          s = p.read_text(encoding='utf-8')
          lines = [
              line for line in s.splitlines()
              if not line.startswith('| `outbox_events` |')
              and not line.startswith('| `pricing_matrices_audit_hidden` |')
          ]
          s = '\n'.join(lines) + '\n'
          s = s.replace('| Tables | 115 |', '| Tables | 113 |')
          s = s.replace('### 4.4 Paiements et finance (10 tables)', '### 4.4 Paiements et finance (9 tables)')
          s = s.replace('### 4.8 Pricing et économie (18 tables)', '### 4.8 Pricing et économie (17 tables)')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/lot6-final-schema-target-once.yml

      - name: Rebuild and prove all governed artifacts
        run: |
          npm ci
          npm --prefix public/boutique ci
          npm run arch:gen
          npm run business-graph:gen
          npm run feature:360:gen
          npm run map:check

      - name: Persist the qualified target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "fix(db): finalize Lot 6 post-migration schema target"
          git push origin HEAD:fix/lot6-schema-reconciliation
