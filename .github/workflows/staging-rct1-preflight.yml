name: RCT1 — preflight staging (lecture seule)
# Préparation du lot #2674. Ne crée PAS les données de recette.
on:
  workflow_dispatch: {}
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-rct1-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       github.event.issue.title == '[staging-op] recette-rct1-preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require staging secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No staging database secret"
            exit 1
          fi
      - name: Guard live staging identity
        run: node scripts/recette/target-guard.js
      - name: Inspect RCT1 existing data without writes
        run: node scripts/recette/rct1-preflight.js
