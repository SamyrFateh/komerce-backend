name: Apply Feature First overlay and close FF-C1 FF-C2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: chore/feature-first-c1-c2-closure-20260729
          fetch-depth: 0

      - name: Restore verified local overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/feature-first-overlay/part-03')
          lines = path.read_text().splitlines()
          if len(lines) != 131:
              raise SystemExit(f'Unexpected part-03 line count: {len(lines)}')
          lines[125] = 'yDCY5B1x/1PMA7N/B0eHn2/td3Y/2z84asuVZbYm75Lm8t6YngNjHoZ05S/qwbgSuCmWfHuOn+JK'
          path.write_text('\n'.join(lines))
          PY
          cat .github/feature-first-overlay/part-0[0-8] > /tmp/feature-first-overlay.b64
          base64 --decode /tmp/feature-first-overlay.b64 > /tmp/feature-first-overlay.tar.gz
          test "$(sha256sum /tmp/feature-first-overlay.tar.gz | awk '{print $1}')" = "c01170ae198afaffe892147b5b7e237ac83a1009b4050158400978bac0de8da5"
          tar -xzf /tmp/feature-first-overlay.tar.gz -C .

      - name: Align finalizer with capability manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/finalize-ff-c1-c2.js')
          src = path.read_text()
          old = """    const contract = /(contract\\s*:\\s*\\{\\s*\\n)/;
              assert(contract.test(src), `${manifestRel}: bloc contract introuvable`);
              return src.replace(contract, `$1    consumes: [\\n${entry}    ],\\n`);
          """
          new = """    const contract = /(contract\\s*:\\s*\\{\\s*\\n)/;
              if (contract.test(src)) {
                return src.replace(contract, `$1    consumes: [\\n${entry}    ],\\n`);
              }

              // Les capabilities historiques peuvent ne pas encore avoir de bloc
              // contract. La clôture FF-C1 le crée explicitement au lieu de
              // transformer l'absence de contrat en exception silencieuse.
              const moduleEnd = /\\n\\};\\s*$/;
              assert(moduleEnd.test(src), `${manifestRel}: fin de manifeste introuvable`);
              return src.replace(moduleEnd,
                `\\n\\n  contract: {\\n    consumes: [\\n${entry}    ],\\n  },\\n};\\n`);
          """
          if old not in src:
              raise SystemExit('Finalizer capability patch anchor not found')
          path.write_text(src.replace(old, new))
          PY

      - name: Validate overlay JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/finalize-ff-c1-c2.js
          node --check scripts/feature-first-conformance.js
          node --check scripts/runtime-writes.js
          node --check scripts/gen-data-ownership.js
          node --check scripts/gen-governance-units.js
          node --check tests/governance/feature-first/lib/feature-graph.js
          node --check tests/governance/feature-first/lib/checks.js
          node --check features/auth-identity.feature.js
          node --check features/business-rules.feature.js
          node --check features/catalog.feature.js
          node --check features/dashboard.feature.js
          node --check features/infrastructure.feature.js
          node --check routes/admin-rules.js

      - name: Execute FF-C1 FF-C2 closure
        shell: bash
        run: |
          set -euo pipefail
          node scripts/finalize-ff-c1-c2.js | tee /tmp/ff-c1-c2-finalize.log
          grep -q 'PASS FF-C1' /tmp/ff-c1-c2-finalize.log
          grep -q 'PASS FF-C2' /tmp/ff-c1-c2-finalize.log
          node scripts/feature-first-conformance.js --report > /tmp/feature-first-report.txt || true
          cat /tmp/feature-first-report.txt

      - name: Remove transport-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/feature-first-overlay
          rm -f .github/workflows/feature-first-overlay-inspect.yml
          rm -f .github/workflows/feature-first-self-apply.yml

      - name: Commit verified closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'feat(governance): close FF-C1 and FF-C2 from verified local state'
          git push origin HEAD:chore/feature-first-c1-c2-closure-20260729
