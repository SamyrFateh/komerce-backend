name: One-shot schema drift pending truth

on:
  push:
    branches: [fix/schema-drift-pending-truth]
    paths:
      - '.github/workflows/schema-drift-pending-truth-one-shot.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts

      - name: Apply schema truth corrections
        run: python3 scripts/schema-drift-pending-truth-patch.py

      - name: Promote existing live column intents
        run: node scripts/schema-promote-all.js --write

      - name: Generate architecture and prove schema gates
        run: |
          npm run arch:gen
          npm run arch:reconcile:write
          npm run arch:gate
          node scripts/schema-promote-all.js --check
          npx --no-install jest tests/unit/arch-drift-pending-migration.test.js tests/unit/schema-promote-columns.test.js --runInBand
          git diff --check

      - name: Assert absolute drift state
        run: |
          node <<'NODE'
          const core = require('./scripts/lib/arch-drift-core');
          const a = core.analyze();
          if (a.fictionUnlisted.length) throw new Error(`blocking fiction: ${a.fictionUnlisted.map(x => x.token).join(', ')}`);
          if (a.ghosts.length) throw new Error(`ghosts: ${a.ghosts.join(', ')}`);
          if (a.undocumented.length) throw new Error(`undocumented live: ${a.undocumented.join(', ')}`);
          const hs = core.analyzeHeaderSql();
          if (hs.totalUnder) throw new Error(`header under-declaration: ${hs.totalUnder}`);
          console.log('✅ drift strict: 0 blocking fiction, 0 ghosts, 0 undocumented live, 0 header under-declaration');
          console.log(`ℹ️ pending migrations: ${a.fictionPendingMigration.map(x => x.token).join(', ') || 'none'}`);
          NODE

      - name: Commit product changes and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/schema-drift-pending-truth-one-shot.yml scripts/schema-drift-pending-truth-patch.py
          git add docs/SCHEMA.md scripts/lib/arch-drift-core.js scripts/arch-schema-drift-check.js scripts/arch-reconcile.js \
            services/shipping-customs-workspace.js routes/local-stock.js services/order-display-snapshot.js \
            routes/providers-services.js routes/auth-passkey.js tests/unit/arch-drift-pending-migration.test.js \
            docs/KOMERCE_ARCH_HEADER_GRAPH.md docs/komerce-arch-header-graph.json scripts/arch-debt-budget.json
          git commit -m 'fix(schema): reconcile live and pending database truth'
          git push origin HEAD:fix/schema-drift-pending-truth
