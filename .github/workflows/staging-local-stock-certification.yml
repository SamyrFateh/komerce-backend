name: Staging — LOCAL_STOCK direct relais (KM CM CG)

# Independent of the historical Hub physical chain. Runs only with manual owner approval.
# Creates an isolated E2E fixture with simulated payment; never charges a real PSP.
on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Marché (une fixture neuve et une preuve distincte par marché)'
        required: true
        type: choice
        options: [KM, CM, CG]
      confirmation:
        description: 'Saisir exactement RUN-LOCAL-CERT-<MARCHÉ>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: komerce-staging-local-stock-cert
  cancel-in-progress: false

jobs:
  local-stock:
    if: github.actor == github.repository_owner && inputs.confirmation == format('RUN-LOCAL-CERT-{0}', inputs.market)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      KOMERCE_DISABLE_CRONS: 'true'
      HUB_V1_E2E_APPLY_MODE: approved
      HTTP_RUNNER_MARKET: ${{ inputs.market }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      HTTP_RUNNER_BASE_URL: https://komerce-backend-production.up.railway.app
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_AGENT_HUB_EMAIL: ${{ secrets.E2E_AGENT_HUB_EMAIL }}
      E2E_AGENT_HUB_PASSWORD: ${{ secrets.E2E_AGENT_HUB_PASSWORD }}
      E2E_MARKET_OPERATOR_EMAIL: ${{ secrets.E2E_MARKET_OPERATOR_EMAIL }}
      E2E_MARKET_OPERATOR_PASSWORD: ${{ secrets.E2E_MARKET_OPERATOR_PASSWORD }}
      E2E_AGENT_RELAIS_EMAIL: ${{ secrets.E2E_AGENT_RELAIS_EMAIL }}
      E2E_AGENT_RELAIS_PASSWORD: ${{ secrets.E2E_AGENT_RELAIS_PASSWORD }}
      E2E_TRANSITAIRE_EMAIL: ${{ secrets.E2E_AGENT_TRANSITAIRE_EMAIL }}
      E2E_TRANSITAIRE_PASSWORD: ${{ secrets.E2E_AGENT_TRANSITAIRE_PASSWORD }}
      STRIPE_SECRET_KEY: sk_test_certification_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_certification_placeholder
      PAYPAL_CLIENT_ID: ci-certification-placeholder
      PAYPAL_CLIENT_SECRET: ci-certification-placeholder
      PAYPAL_WEBHOOK_ID: ci-certification-placeholder
      META_WA_APP_SECRET: ci-certification-placeholder
      AUTHKEY_API_KEY: ci-certification-placeholder
      JWT_SECRET: ci-certification-placeholder
      QR_SECRET: ci-certification-placeholder
      ADMIN_PASSWORD: ci-certification-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Pin SHA déployé et empreinte staging
        run: |
          test -n "$DATABASE_URL"
          node scripts/recette/resolve-staging-deploy-pin.js
          node scripts/recette/target-guard.js
      - name: Fixture commerciale neuve (paiement simulé, aucun débit externe)
        shell: bash
        run: |
          set -euo pipefail
          RUN8="$(node -p 'require("crypto").randomBytes(4).toString("hex").toUpperCase()')"
          echo "HTTP_RUNNER_RUN8=$RUN8" >> "$GITHUB_ENV"
          echo "HUB_V1_CERTIFICATION_RUN=$RUN8" >> "$GITHUB_ENV"
          export HUB_V1_CERTIFICATION_RUN="$RUN8"
          node scripts/recette/hub-v1-certification-runner.js \
            --allow-remote-staging --run="$RUN8" --market="$HTTP_RUNNER_MARKET" --stop-after=2 --dry-run
          node scripts/recette/hub-v1-certification-runner.js \
            --allow-remote-staging --run="$RUN8" --market="$HTTP_RUNNER_MARKET" --stop-after=2
      - name: Rattacher le relais de recette à la fixture
        run: |
          RELAY_MODE=to-fixture RELAY_RUN8="$HTTP_RUNNER_RUN8" \
          RELAY_APPLY=1 RELAY_CONFIRMATION=REASSIGN-E2E-RELAY \
            node scripts/recette/staging-e2e-relay-reassign.js
          cp test-results/relay-reassign/report.json test-results/relay-reassign/assignment-original.json
      - name: Recette LOCAL_STOCK par HTTP réel et readback physique
        run: node scripts/recette/staging-local-stock-real-relay-cert.js
      - name: Gate sans Hub ni faux transit
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'test-results/local-stock-cert/local-stock-' +
            process.env.HTTP_RUNNER_MARKET + '-' + process.env.HTTP_RUNNER_RUN8 + '.json';
          if (!fs.existsSync(p)) throw Error('LOCAL_PROOF_MISSING');
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (r.verdict !== 'LOCAL_STOCK_HTTP_PASS' || r.checks.some(c => c.verdict !== 'PASS')) {
            throw Error('LOCAL_STOCK_NOT_CERTIFIED:' + r.verdict);
          }
          const keys = new Set(r.checks.map(c => c.key));
          for (const k of ['physical:local-without-hub', 'final:collected-zero-hub',
            'deny:hub', 'deny:market-operator', 'deny:transitaire', 'deny:repeated-receipt']) {
            if (!keys.has(k)) throw Error('LOCAL_PROOF_INCOMPLETE:' + k);
          }
          NODE
      - name: Restaurer l'affectation du compte relais de recette
        if: always()
        shell: bash
        run: |
          if [ -f test-results/relay-reassign/assignment-original.json ]; then
            BEFORE="$(node -p "require('./test-results/relay-reassign/assignment-original.json').relais_before || ''")"
            if [[ "$BEFORE" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              RELAY_MODE=restore RELAY_RESTORE_ID="$BEFORE" RELAY_APPLY=1 \
              RELAY_CONFIRMATION=REASSIGN-E2E-RELAY node scripts/recette/staging-e2e-relay-reassign.js
            else
              echo "RELAY_RESTORE_ID_INVALID" >&2
              exit 1
            fi
          fi
      - name: Archiver la preuve et le pin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-local-stock-${{ inputs.market }}-${{ github.run_id }}
          path: |
            test-results/local-stock-cert/
            test-results/hub-v1-cert/
            test-results/hub-v1-http/deploy-pin.json
            test-results/relay-reassign/
          if-no-files-found: warn
          retention-days: 30
