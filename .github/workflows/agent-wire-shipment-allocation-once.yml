name: Agent wire shipment allocation once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transport-rail-doctrine-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply rail-aware shipment allocation patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/cost-allocation/allocate.js')
          s = p.read_text()
          s = s.replace("const { shareByWeight } = require('./_helpers');", "const { shareByWeight } = require('./_helpers');\nconst { allocateTransportCost } = require('../transport-cost-allocation');")
          s = s.replace("async function allocateShipmentRealCosts(shipmentId, dbClient = null) {", "async function allocateShipmentRealCosts(shipmentId, dbClient = null, options = {}) {")
          start = s.index('    // Pour freight : le poids ne fait PAS partie de l\'équation en maritime')
          end = s.index('\n\n    // 5. Pour chaque parcel', start)
          replacement = '''    // Freight explicite : le rail consomme le contrat transport-cost-allocation.
    // Sans rail explicite, le comportement legacy reste identifie et n'est jamais
    // converti silencieusement en SEA_STANDARD.
    const transportMode = String(ship.transport_mode || '').trim().toLowerCase();
    const transportRail = transportMode === 'sea'
      ? 'SEA_STANDARD'
      : transportMode === 'air'
        ? 'AIR_EXPRESS'
        : null;

    const parcelFreightEntries = parcels.map(p => ({
      id: p.parcel_id,
      actual_weight_kg: Number(p.parcel_weight_kg) || 0,
      volume_m3: (Number(p.parcel_volume_cm3) || 0) / 1_000_000,
    }));

    let freightSharesArr;
    let freightAllocationMethod;
    let freightConfidence;

    if (transportRail) {
      freightSharesArr = allocateTransportCost({
        total: totalFreight,
        transport_rail: transportRail,
        component: 'FREIGHT',
        entries: parcelFreightEntries,
        options: options.transport_cost_allocation || {},
      });
      const hasVolumeSignal = parcelFreightEntries.some(entry => entry.volume_m3 > 0);
      freightAllocationMethod = transportRail === 'AIR_EXPRESS'
        ? 'by_taxable_weight'
        : hasVolumeSignal
          ? 'by_volume'
          : 'estimated_fallback';
      freightConfidence = freightAllocationMethod === 'estimated_fallback' ? 'low' : 'high';
    } else {
      const freightWeights = parcels.map(p => ({
        id: p.parcel_id,
        weight: Number(p.parcel_weight_kg) || 0,
      }));
      freightSharesArr = shareByWeight(totalFreight, freightWeights);
      freightAllocationMethod = 'by_weight';
      freightConfidence = 'high';
    }

    const freightShares = freightSharesArr.map(s => ({
      parcel_id: s.id,
      freight_share: s.share,
    }));'''
          s = s[:start] + replacement + s[end:]

          start2 = s.index('      // Eclater freight par volume si dispo (maritime), sinon répartition égale')
          end2 = s.index('\n\n      // INSERT pour chaque order_item', start2)
          replacement2 = '''      // Projection parcel -> order_items avec la meme cle economique par rail.
      let freightSplit;
      if (transportRail) {
        const itemFreightEntries = items.map(it => ({
          id: it.order_item_id,
          actual_weight_kg: (Number(it.weight_kg) || 0) * (Number(it.parcel_qty) || 1),
          volume_m3: ((Number(it.volume_cm3) || 0) * (Number(it.parcel_qty) || 1)) / 1_000_000,
        }));
        freightSplit = allocateTransportCost({
          total: freightShare,
          transport_rail: transportRail,
          component: 'FREIGHT',
          entries: itemFreightEntries,
          options: options.transport_cost_allocation || {},
        });
      } else {
        const freightWeightsItems = items.map(it => ({
          id: it.order_item_id,
          weight: (Number(it.weight_kg) || 0) * (Number(it.parcel_qty) || 1),
        }));
        freightSplit = shareByWeight(freightShare, freightWeightsItems);
      }'''
          s = s[:start2] + replacement2 + s[end2:]
          p.write_text(s)

          tp = Path('tests/unit/cost-allocation-allocate.test.js')
          t = tp.read_text()
          marker = "  it('maritime sans volume snapshoté (legacy) → répartition égale, PAS par poids', async () => {"
          air_tests = '''  it('AIR explicite sans calibration bloque avant persistance freight', async () => {
    const shipment = { id: 'ship-air', customs_paid_kmf: '0', freight_kmf: '1000', allocation_method: 'by_cif_value', transport_mode: 'air' };
    const parcel = { parcel_id: 'parcel-air', order_id: 'order-air', parcel_cif_kmf: '1000', parcel_weight_kg: '2', parcel_volume_cm3: '12000', customs_share_kmf: null };
    const client = makeClient([{ rows: [shipment] }, { rows: [parcel] }, { rows: [], rowCount: 0 }]);
    db.pool.connect.mockResolvedValue(client);
    await expect(allocateShipmentRealCosts('ship-air')).rejects.toMatchObject({ code: 'TRANSPORT_COST_ALLOCATION_CALIBRATION_PENDING' });
    expectTransactionRolledBack(client);
    expect(client.query.mock.calls.some(c => c[0].includes("'freight'"))).toBe(false);
  });

  it('AIR explicite calibre ventile le fret par poids taxable', async () => {
    const shipment = { id: 'ship-air', customs_paid_kmf: '0', freight_kmf: '1000', allocation_method: 'by_cif_value', transport_mode: 'air' };
    const parcelA = { parcel_id: 'parcel-A', order_id: 'order-A', parcel_cif_kmf: '1000', parcel_weight_kg: '10', parcel_volume_cm3: '10000', customs_share_kmf: null };
    const parcelB = { parcel_id: 'parcel-B', order_id: 'order-B', parcel_cif_kmf: '1000', parcel_weight_kg: '2', parcel_volume_cm3: '300000', customs_share_kmf: null };
    const itemA = { order_item_id: 'oi-A', parcel_qty: '1', product_id: 'prod-A', weight_kg: '10', volume_cm3: '10000', cost_kmf: '1000' };
    const itemB = { order_item_id: 'oi-B', parcel_qty: '1', product_id: 'prod-B', weight_kg: '2', volume_cm3: '300000', cost_kmf: '1000' };
    const client = makeClient([{ rows: [shipment] }, { rows: [parcelA, parcelB] }, { rows: [], rowCount: 0 }, { rows: [itemA] }, { rows: [], rowCount: 1 }, { rows: [itemB] }, { rows: [], rowCount: 1 }]);
    db.pool.connect.mockResolvedValue(client);
    const result = await allocateShipmentRealCosts('ship-air', null, { transport_cost_allocation: { volumetric_factor_kg_per_m3: 100 } });
    expect(result.freight_allocation_method).toBe('by_taxable_weight');
    const freightInsertA = client.query.mock.calls.find(c => c[0].includes("'freight'") && c[1][2] === 'parcel-A');
    const freightInsertB = client.query.mock.calls.find(c => c[0].includes("'freight'") && c[1][2] === 'parcel-B');
    expect(freightInsertA[1][4]).toBe(250);
    expect(freightInsertB[1][4]).toBe(750);
    expect(freightInsertA[1][5]).toBe('by_taxable_weight');
    expectTransactionCommitted(client);
  });

'''
          if 'AIR explicite sans calibration bloque avant persistance freight' not in t:
            t = t.replace(marker, air_tests + marker)
          tp.write_text(t)
          PY
      - name: Run focused tests
        run: npx jest tests/unit/transport-cost-allocation.test.js tests/unit/cost-allocation-allocate.test.js --runInBand --no-coverage
      - name: Commit and push branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/cost-allocation/allocate.js tests/unit/cost-allocation-allocate.test.js
          git commit -m "feat(economic-engine): wire shipment freight to transport allocation contract"
          git push origin HEAD:agent/transport-rail-doctrine-audit
