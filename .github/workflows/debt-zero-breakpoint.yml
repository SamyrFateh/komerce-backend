name: Debt Zero breakpoint

on:
  push:
    branches:
      - ci/debt-zero-breakpoint

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: chore/debt-zero-breakpoint
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm --prefix public/boutique ci

      - name: Remove the remaining checkout 380px breakpoint intrinsically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('public/boutique/css/checkout-vertical-rail.css')
          src = p.read_text(encoding='utf-8')

          old_padding = '  padding: 16px 18px 18px;'
          new_padding = '  padding: 16px clamp(12px, 4vw, 18px) 18px;'
          if old_padding not in src:
              raise SystemExit('checkout body padding anchor missing')
          src = src.replace(old_padding, new_padding, 1)

          recipient_pattern = re.compile(
              r'(\.ck-recipient-grid\s*\{[^}]*?)grid-template-columns:\s*repeat\(2,\s*minmax\(0,1fr\)\);',
              re.S,
          )
          src, count = recipient_pattern.subn(
              r'\1grid-template-columns: repeat(auto-fit, minmax(min(100%, 11.5rem), 1fr));',
              src,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'recipient grid anchor count={count}')

          blocks = [
              '''@media (max-width: 380px) {\n  .ck-recipient-grid { grid-template-columns: 1fr; }\n}\n''',
              '''@media (max-width: 380px) {\n  .k-order-overlay.open .k-order-body--checkout { padding-right: 12px; padding-left: 12px; }\n  .ck-step-header { padding-right: 11px; padding-left: 11px; }\n  .ck-step-header-change { padding: 0 9px; }\n  .ck-pay-chip { min-height: 56px; padding: 7px 9px; }\n}\n''',
          ]
          for block in blocks:
              if block not in src:
                  raise SystemExit('expected 380px block missing')
              src = src.replace(block, '', 1)

          if '380px' in src:
              raise SystemExit('380px still present after intrinsic rewrite')

          p.write_text(src, encoding='utf-8')
          PY

      - name: Prove responsive regression tests
        run: |
          npm --prefix public/boutique test -- --runInBand tests/unit/shared-list-responsive-layout.test.js tests/unit/checkout-responsive-css.test.js

      - name: Prove breakpoint debt is actually zero
        run: |
          npm --prefix public/boutique run check:breakpoints
          npm --prefix public/boutique run check:breakpoints:save
          node - <<'NODE'
          const b = require('./public/boutique/scripts/.breakpoints-baseline.json');
          console.log(JSON.stringify(b, null, 2));
          if (b.total !== 0 || Object.keys(b.perFile || {}).length !== 0) {
            throw new Error('breakpoint baseline is not zero');
          }
          NODE
          npm --prefix public/boutique run check:breakpoints

      - name: Prove official Boutique CSS source gates
        run: |
          node public/boutique/scripts/check-important.js --strict
          node public/boutique/scripts/check-breakpoints.js --strict
          node public/boutique/scripts/check-css-vars.js --strict
          node public/boutique/scripts/check-zindex-contract.js --strict
          node public/boutique/scripts/check-sticky-integrity.js --strict
          node public/boutique/scripts/audit-boutique-arch.js

      - name: Prove Boutique Feature First ownership
        run: |
          npm --prefix public/boutique run audit:registry
          npm --prefix public/boutique run feature:guard:strict

      - name: Regenerate Gate Findings and prove breakpoint finding gone
        run: |
          node scripts/gen-gate-findings.js
          node - <<'NODE'
          const g = require('./docs/GATE_FINDINGS.json');
          const bp = (g.findings || []).filter((f) => f.gate === 'check:breakpoints');
          console.log(`total=${(g.findings || []).length} breakpoint_findings=${bp.length}`);
          if (g.contract?.attributableSources !== 18) throw new Error('GATE_FINDINGS attribution regressed');
          if (bp.length) throw new Error(JSON.stringify(bp, null, 2));
          NODE

      - name: Refresh dependent projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen

      - name: Standard governance gates
        run: |
          node scripts/feature-registry-check.js
          node scripts/feature-guard.js --strict
          npm run business-graph:check
          npm run feature:360:check
          node scripts/code-quality-gate.js --strict
          node scripts/contract-check.js
          npm run security:360:check
          git diff --check

      - name: Commit verified breakpoint closure
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(boutique): fermer la dette breakpoint"
          git push origin HEAD:chore/debt-zero-breakpoint
