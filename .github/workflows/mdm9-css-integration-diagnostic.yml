name: MDM9 CSS and integration diagnostic

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      NODE_ENV: test
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mdm9-modal-gallery-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Regenerate served Boutique CSS
        working-directory: public/boutique
        run: |
          npm ci
          npm run deploy:css
      - name: Prepare integration database
        run: |
          node scripts/check-schema-freshness.js
          node scripts/check-schema-resurrection.js
          psql "$DATABASE_URL" -f docs/db/railway-live-schema.sql
          node scripts/ci-migrate.js
      - name: Run integration suites with complete log
        id: integration
        shell: bash
        run: |
          set +e
          status=0
          : > /tmp/mdm9-integration.log
          for f in tests/integration/*.test.js; do
            echo "── $f ──" | tee -a /tmp/mdm9-integration.log
            npx jest "$f" --ci --forceExit 2>&1 | tee -a /tmp/mdm9-integration.log
            suite_status=${PIPESTATUS[0]}
            if [[ $suite_status -ne 0 ]]; then
              status=$suite_status
              echo "FAILED_SUITE=$f STATUS=$suite_status" | tee -a /tmp/mdm9-integration.log
              break
            fi
          done
          echo "INTEGRATION_EXIT=$status" | tee -a /tmp/mdm9-integration.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload integration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdm9-integration-diagnostic
          path: /tmp/mdm9-integration.log
          if-no-files-found: error
      - name: Commit regenerated CSS and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mdm9-css-integration-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/boutique/css/dist public/boutique/index.html public/boutique/.cache-buster-state.json .github/workflows/mdm9-css-integration-diagnostic.yml
          git status --short
          git commit -m 'build(boutique): regenerate MDM9 CSS bundles'
          git push origin HEAD:fix/mdm9-modal-gallery-layout
      - name: Fail if integration suite failed
        if: steps.integration.outputs.status != '0'
        run: exit 1
