name: Feature 360 refresh one-shot

on:
  push:
    branches:
      - feat/discovery-product-staging

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discovery-product-staging
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate Feature 360 canonical projection
        run: |
          node scripts/gen-feature-360.js
          node scripts/feature-360-check.js
          git diff --check

      - name: Commit regenerated Feature 360
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_360.json docs/FEATURE_360.md
          if git diff --cached --quiet; then
            echo "No Feature 360 drift to commit."
            exit 0
          fi
          git commit -m "fix(governance): refresh Feature 360 projection"
          git push origin HEAD:feat/discovery-product-staging
