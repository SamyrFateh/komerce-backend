name: Isolated CJ Raffinerie continuation — exact SKU + SOI

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Workflow run carrying the checkpoint artifact'
        required: false
        default: '36193418960'
      checkpoint_name:
        description: 'Checkpoint artifact name'
        required: false
        default: 'real-cj-1000-pre-fr-checkpoint'
      limit:
        description: 'Maximum CJ TEST drafts to hydrate'
        required: false
        default: '974'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: isolated-cj-refinery-continuation
  cancel-in-progress: false

jobs:
  continue-refinery:
    name: CJ exact detail → SKU/SOI → readiness
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       github.event.issue.title == '[isolated-op] cj-refinery-continuation')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_real_catalog_stress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_real_catalog_stress"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: '1'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@127.0.0.1:5432/komerce_real_catalog_stress
      CJ_ACCESS_TOKEN: ${{ secrets.KOMERCE_CJ_PROOF_ACCESS_TOKEN }}

    steps:
      - name: Checkout protected main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert isolated runtime and CJ credential
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://komerce:komerce@127.0.0.1:5432/komerce_real_catalog_stress'
          test "$NODE_ENV" = 'test'
          test "$KOMERCE_ENV" = 'staging'
          test -n "${CJ_ACCESS_TOKEN:-}" || { echo '::error::KOMERCE_CJ_PROOF_ACCESS_TOKEN manquant'; exit 1; }

      - name: Download reusable Raffinerie checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.checkpoint_name || 'real-cj-1000-pre-fr-checkpoint' }}
          path: checkpoint
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '36193418960' }}
          github-token: ${{ github.token }}

      - name: Restore disposable checkpoint
        shell: bash
        env:
          PGPASSWORD: komerce
        run: |
          set -euo pipefail
          dump_file="$(find checkpoint -type f -name '*.dump' | head -1)"
          test -n "$dump_file" || { echo '::error::Checkpoint sans dump PostgreSQL'; exit 1; }
          pg_restore --clean --if-exists --no-owner --no-privileges             -h 127.0.0.1 -U komerce -d komerce_real_catalog_stress "$dump_file"
          psql -h 127.0.0.1 -U komerce -d komerce_real_catalog_stress -Atqc             "SELECT 'cj_candidates=' || count(*) FROM sourcing_candidates WHERE supplier_name='CJdropshipping';"

      - name: Ensure free French staging preparation is applied
        run: node scripts/catalog-fr-free-e2e-preparation.js --limit=1000

      - name: Continue Raffinerie with exact CJ detail, SKU and Supplier Order Identity
        id: continue
        shell: bash
        env:
          KOMERCE_ALLOW_CJ_REFINERY_CONTINUATION: '1'
          KOMERCE_CJ_REFINERY_DETAIL_DELAY_MS: '1100'
          KOMERCE_CJ_REFINERY_QUOTA_WAIT_MS: '60000'
          KOMERCE_CJ_REFINERY_MAX_QUOTA_WAITS: '15'
        run: |
          set -euo pipefail
          mkdir -p artifacts/cj-refinery-continuation
          limit="${{ inputs.limit || '974' }}"
          output="$(timeout 2520s node scripts/cj-refinery-commandability-continuation.js             --limit="$limit" --chunk=20             --output=artifacts/cj-refinery-continuation/readiness.json)"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-18000)"
          {
            echo 'summary<<EOF'
            echo "$compact"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Save reusable continuation checkpoint
        if: always()
        shell: bash
        env:
          PGPASSWORD: komerce
        run: |
          set -euo pipefail
          mkdir -p artifacts/cj-refinery-checkpoint
          pg_dump -h 127.0.0.1 -U komerce -d komerce_real_catalog_stress -Fc             -f artifacts/cj-refinery-checkpoint/komerce-real-catalog-refinery-continuation.dump
          cp artifacts/cj-refinery-continuation/readiness.json              artifacts/cj-refinery-checkpoint/readiness.json 2>/dev/null || true

      - name: Upload reusable continuation checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-cj-refinery-continuation-checkpoint
          path: artifacts/cj-refinery-checkpoint/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Raffinerie readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-refinery-continuation-report
          path: artifacts/cj-refinery-continuation/
          if-no-files-found: warn
          retention-days: 14

      - name: Final safety audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const db = require('./db');
          (async () => {
            const { rows: [r] } = await db.query(`
              SELECT COUNT(*) FILTER (WHERE p.is_active=TRUE)::int AS active,
                     COUNT(DISTINCT pme.product_id)::int AS exposed,
                     COUNT(*) FILTER (WHERE p.lifecycle_status IS DISTINCT FROM 'candidate')::int AS wrong_lifecycle
                FROM sourcing_candidates sc
                JOIN products p ON p.id=sc.product_id
                LEFT JOIN product_market_exposure pme ON pme.product_id=p.id
               WHERE sc.supplier_name='CJdropshipping'
                 AND sc.state='imported_to_catalog'
            `);
            console.log(JSON.stringify(r));
            if (Number(r.active)||Number(r.exposed)||Number(r.wrong_lifecycle)) {
              throw new Error('SAFETY_AUDIT_FAILED:' + JSON.stringify(r));
            }
          })().catch(e => { console.error(e); process.exitCode=1; }).finally(() => db.pool.end());
          NODE

      - name: Write Raffinerie continuation summary
        if: always()
        shell: bash
        env:
          CONTINUE_SUMMARY: ${{ steps.continue.outputs.summary }}
        run: |
          {
            echo '## CJ Raffinerie continuation'
            echo
            echo '- database: disposable PostgreSQL 16 localhost'
            echo '- exact CJ detail: enabled'
            echo '- publication/exposure/order/payment: forbidden'
            echo '- objective: exact variants/SKU + Supplier Order Identity + media + readiness'
            if [ -n "${CONTINUE_SUMMARY:-}" ]; then echo "- result: `$CONTINUE_SUMMARY`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close successful command issue
        if: success() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body 'CJ Raffinerie continuation completed. Reusable checkpoint and readiness report uploaded.'
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
