name: Temporary economic cutover patch

on:
  push:
    branches:
      - feat/canonical-economic-pilotage-fin-cutover

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-economic-pilotage-fin-cutover
      - name: Apply canonical economic cutover patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Backend Pricing Workspace: consume economic authorities internally.
          replace(
              'services/pricing-workspace.js',
              " * @outputs       canonical_pricing_projection, delegated_mutation_results\n * @depends       db.js, services/pricing-engine.js, services/pricing-recommend.js, services/pricing-rates.js, services/pricing-apply.js, services/pricing-strategy-service.js, services/cost-component-admin-service.js\n * @used-by       routes/admin-pricing-workspace.js\n * @db-read       products, competitor_prices",
              " * @outputs       canonical_pricing_projection, global_economic_projection, delegated_mutation_results\n * @depends       db.js, services/pricing-engine.js, services/pricing-recommend.js, services/pricing-rates.js, services/pricing-apply.js, services/pricing-strategy-service.js, services/cost-component-admin-service.js, services/economic-engine-queries.js\n * @used-by       routes/admin-pricing-workspace.js\n * @db-read       products, competitor_prices, charges, economic_variables, economic_snapshots, finance_config"
          )
          replace(
              'services/pricing-workspace.js',
              "const costComponents = require('./cost-component-admin-service');",
              "const costComponents = require('./cost-component-admin-service');\nconst economicQueries = require('./economic-engine-queries');"
          )
          replace(
              'services/pricing-workspace.js',
              "  const [productRes, componentProjection, rates, competitorCountRes] = await Promise.all([\n    db.query(\n      `SELECT id, product_ref, name, category, price_kmf, cost_kmf, weight_kg, is_active\n         FROM products\n        ORDER BY is_active DESC, updated_at DESC NULLS LAST, name\n        LIMIT 250`\n    ),\n    costComponents.listComponents({}),\n    pricingRates.getCurrentRates().catch(() => null),\n    db.query('SELECT COUNT(*)::int AS count FROM competitor_prices WHERE is_active = TRUE'),\n  ]);",
              "  const [\n    productRes,\n    componentProjection,\n    rates,\n    competitorCountRes,\n    economicExecutive,\n    economicVariables,\n    economicCharges,\n  ] = await Promise.all([\n    db.query(\n      `SELECT id, product_ref, name, category, price_kmf, cost_kmf, weight_kg, is_active\n         FROM products\n        ORDER BY is_active DESC, updated_at DESC NULLS LAST, name\n        LIMIT 250`\n    ),\n    costComponents.listComponents({}),\n    pricingRates.getCurrentRates().catch(() => null),\n    db.query('SELECT COUNT(*)::int AS count FROM competitor_prices WHERE is_active = TRUE'),\n    economicQueries.buildExecutiveSummary().catch(() => null),\n    economicQueries.getVariables().catch(() => null),\n    economicQueries.getCharges().catch(() => null),\n  ]);"
          )
          replace(
              'services/pricing-workspace.js',
              "    rates: stripInternalIds(rates),\n  };",
              "    rates: stripInternalIds(rates),\n    economic: stripInternalIds({\n      scope: 'global_pricing',\n      source_of_truth: 'economic-engine',\n      executive: economicExecutive,\n      variables: economicVariables,\n      charges: economicCharges,\n    }),\n  };"
          )

          # Canonical Pricing UI: render the real economic model without legacy API calls.
          marker = "  async function action(context, url, body, success, method = 'POST') {"
          economic_ui = r'''  function formatEconomicValue(value, unit) {
            if (value == null || value === '') return '—';
            const numeric = Number(value);
            if (!Number.isFinite(numeric)) return String(value);
            if (unit === 'KMF' || unit === 'kmf') return formatKmf(numeric);
            if (unit === '%' || unit === 'pct') {
              return `${new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 }).format(numeric)} %`;
            }
            return `${new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(numeric)}${unit ? ` ${unit}` : ''}`;
          }

          function renderEconomicModel(rootNode, ui, doc, payload) {
            const slot = section(rootNode, ui, 'Santé économique globale', 'Seuil, pression des charges et profit du moteur économique global. Cette surface est réservée à l’autorité Pricing centrale.');
            const executive = payload.economic && payload.economic.executive;
            if (!executive) {
              slot.appendChild(text(doc, 'div', 'kmc-workspace-empty', 'Modèle économique indisponible.'));
              return;
            }

            const status = doc.createElement('div');
            status.className = 'kmc-workspace-detail';
            status.appendChild(text(doc, 'strong', 'kmc-workspace-detail-title', `${executive.status_emoji || ''} ${executive.status_label || executive.status || 'État du modèle'}`.trim()));
            status.appendChild(text(doc, 'p', 'kmc-workspace-note', `Source : moteur économique global · génération ${executive.generated_at ? new Date(executive.generated_at).toLocaleString('fr-FR') : '—'}`));
            slot.appendChild(status);

            const modelMetrics = (executive.kpis || []).map(metric => ({
              key: metric.key || 'economic',
              label: metric.label || metric.key || 'Indicateur',
              value: formatEconomicValue(metric.value, metric.unit),
              tone: metric.key === 'net_profit_per_order' && Number(metric.value) < 0
                ? 'critical'
                : (metric.key === 'safety_ratio' && Number(metric.value) < 15 ? 'warning' : 'neutral'),
            }));
            if (modelMetrics.length) slot.appendChild(ui.KpiStrip.create(modelMetrics).element);

            const alerts = executive.alerts || [];
            if (alerts.length) {
              const alertHost = doc.createElement('div');
              alertHost.className = 'kmc-workspace-actions-grid';
              alerts.forEach(alert => {
                const card = doc.createElement('div');
                card.className = 'kmc-workspace-action-card';
                card.appendChild(text(doc, 'strong', '', alert.message || alert.category || 'Alerte'));
                if (alert.detail) card.appendChild(text(doc, 'small', '', alert.detail));
                alertHost.appendChild(card);
              });
              slot.appendChild(alertHost);
            }
            if (executive.recommendation && executive.recommendation.text) {
              slot.appendChild(text(doc, 'p', 'kmc-workspace-note', `Recommandation : ${executive.recommendation.text}`));
            }
          }

          function renderEconomicVariables(rootNode, ui, doc, payload) {
            const slot = section(rootNode, ui, 'Variables économiques', 'Hypothèses et projections globales. economic_variables reste un stockage Legacy en lecture ; finance_config est la vérité des entrées configurables.');
            const categories = payload.economic && payload.economic.variables && payload.economic.variables.categories;
            const rows = [];
            Object.entries(categories || {}).forEach(([categoryKey, category]) => {
              (category.variables || []).forEach(variable => rows.push({
                category: category.label || categoryKey,
                ...variable,
              }));
            });
            if (!rows.length) {
              slot.appendChild(text(doc, 'div', 'kmc-workspace-empty', 'Aucune variable économique disponible.'));
              return;
            }
            const wrap = doc.createElement('div');
            wrap.className = 'kmc-workspace-table-wrap';
            const table = doc.createElement('table');
            table.className = 'kmc-workspace-table';
            table.innerHTML = '<thead><tr><th>Variable</th><th>Catégorie</th><th>Valeur</th><th>Source</th><th>Nature</th></tr></thead>';
            const tbody = doc.createElement('tbody');
            rows.forEach(row => {
              const tr = doc.createElement('tr');
              tr.appendChild(td(doc, row.label || row.key));
              tr.appendChild(td(doc, row.category));
              tr.appendChild(td(doc, formatEconomicValue(row.value_used, row.unit)));
              tr.appendChild(td(doc, row.source_used || '—'));
              tr.appendChild(td(doc, row.is_computed ? 'Calculée' : 'Configurée'));
              tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            wrap.appendChild(table);
            slot.appendChild(wrap);
          }

          function renderEconomicCharges(rootNode, ui, doc, payload) {
            const slot = section(rootNode, ui, 'Charges économiques', 'Charges globales utilisées par le modèle. Elles sont affichées ici comme vérité moteur, sans dupliquer leur logique dans le navigateur.');
            const families = payload.economic && payload.economic.charges && payload.economic.charges.families;
            const rows = [];
            Object.entries(families || {}).forEach(([familyKey, family]) => {
              (family.charges || []).forEach(charge => rows.push({
                family: family.label || familyKey,
                ...charge,
              }));
            });
            if (!rows.length) {
              slot.appendChild(text(doc, 'div', 'kmc-workspace-empty', 'Aucune charge économique disponible.'));
              return;
            }
            const wrap = doc.createElement('div');
            wrap.className = 'kmc-workspace-table-wrap';
            const table = doc.createElement('table');
            table.className = 'kmc-workspace-table';
            table.innerHTML = '<thead><tr><th>Charge</th><th>Famille</th><th>Montant</th><th>Récurrence</th><th>État</th></tr></thead>';
            const tbody = doc.createElement('tbody');
            rows.forEach(row => {
              const tr = doc.createElement('tr');
              tr.appendChild(td(doc, row.name));
              tr.appendChild(td(doc, row.family));
              tr.appendChild(td(doc, formatKmf(row.amount_kmf)));
              tr.appendChild(td(doc, row.recurrence_period || (row.is_recurring ? 'récurrente' : 'ponctuelle')));
              tr.appendChild(td(doc, row.is_active === false ? 'Inactive' : 'Active'));
              tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            wrap.appendChild(table);
            slot.appendChild(wrap);
          }

          '''
          replace('public/dashboards/canonical/js/pricing-workspace.js', marker, economic_ui + marker)
          replace(
              'public/dashboards/canonical/js/pricing-workspace.js',
              "      rootNode.appendChild(context.ui.KpiStrip.create(metrics(payload.summary)).element);\n      renderProducts(rootNode, context.ui, context.document, payload, context);\n      renderStrategy(rootNode, context.ui, context.document, context);\n      renderCosts(rootNode, context.ui, context.document, payload, context);",
              "      rootNode.appendChild(context.ui.KpiStrip.create(metrics(payload.summary)).element);\n      renderEconomicModel(rootNode, context.ui, context.document, payload);\n      renderProducts(rootNode, context.ui, context.document, payload, context);\n      renderStrategy(rootNode, context.ui, context.document, context);\n      renderCosts(rootNode, context.ui, context.document, payload, context);\n      renderEconomicVariables(rootNode, context.ui, context.document, payload);\n      renderEconomicCharges(rootNode, context.ui, context.document, payload);"
          )
          replace(
              'public/dashboards/canonical/js/pricing-workspace.js',
              "  return { ENDPOINT, mount, jsonRequest, metrics, recommendationByRef };",
              "  return { ENDPOINT, mount, jsonRequest, metrics, recommendationByRef, formatEconomicValue };"
          )

          # Stable URLs: Economic -> Pricing, Pilotage Financier -> Finance, rollback remains explicit.
          replace(
              'bootstrap/html-routes.js',
              "  // LOT 4Q / 4S — anciennes vues de lecture dont les besoins sont maintenant\n  // absorbés par les dashboards Canonical. Le pathname normal converge ;",
              "  // LOT 4Q / 4S / 4T — anciennes vues de lecture dont les besoins sont maintenant\n  // absorbés par les dashboards/workspaces Canonical. Le pathname normal converge ;"
          )
          replace(
              'bootstrap/html-routes.js',
              "    '/admin/control-tower': '/admin/pilotage',\n    '/admin/costing': '/admin/finance',",
              "    '/admin/control-tower': '/admin/pilotage',\n    '/admin/costing': '/admin/finance',\n    '/admin/economic': '/admin/workspaces/pricing',\n    '/admin/pilotage-fin': '/admin/finance',"
          )
          replace(
              'bootstrap/html-routes.js',
              "    '/admin/transitaire',\n    '/admin/economic',\n    '/admin/pilotage-fin',\n    '/admin/sante',",
              "    '/admin/transitaire',\n    '/admin/sante',"
          )

          # Pricing service tests: prove delegation + sanitization.
          p = Path('tests/unit/pricing-workspace.test.js')
          text = p.read_text()
          insert_after = "jest.mock('../../services/cost-component-admin-service', () => ({\n  META: { families: ['landed_relay'] },\n  listComponents: (...args) => mockListComponents(...args),\n  createComponent: (...args) => mockCreateComponent(...args),\n  updateComponent: (...args) => mockUpdateComponent(...args),\n  toggleComponent: (...args) => mockToggleComponent(...args),\n}));\n"
          economic_mock = "\nconst mockEconomicExecutive = jest.fn();\nconst mockEconomicVariables = jest.fn();\nconst mockEconomicCharges = jest.fn();\njest.mock('../../services/economic-engine-queries', () => ({\n  buildExecutiveSummary: (...args) => mockEconomicExecutive(...args),\n  getVariables: (...args) => mockEconomicVariables(...args),\n  getCharges: (...args) => mockEconomicCharges(...args),\n}));\n"
          if insert_after not in text: raise SystemExit('pricing-workspace test mock marker missing')
          text = text.replace(insert_after, insert_after + economic_mock, 1)
          old_before = "  mockRecommendBatch.mockResolvedValue({ items: [] });\n});"
          new_before = "  mockRecommendBatch.mockResolvedValue({ items: [] });\n  mockEconomicExecutive.mockResolvedValue({ status: 'stable', kpis: [], internal_id: 'hidden-exec' });\n  mockEconomicVariables.mockResolvedValue({ categories: {}, source_of_truth: 'finance_config' });\n  mockEconomicCharges.mockResolvedValue({ families: {}, totals: {} });\n});"
          if old_before not in text: raise SystemExit('pricing-workspace beforeEach marker missing')
          text = text.replace(old_before, new_before, 1)
          text += """

test('workspace absorbe la vérité économique globale sans exposer les ids internes', async () => {
  mockQuery.mockImplementation(async sql => {
    const source = String(sql);
    if (source.includes('FROM products')) return { rows: [] };
    if (source.includes('FROM competitor_prices')) return { rows: [{ count: 0 }] };
    return { rows: [] };
  });
  mockEconomicExecutive.mockResolvedValueOnce({ status: 'surveiller', kpis: [{ key: 'seuil_rentabilite', value: 42000, unit: 'KMF' }], internal_id: 'exec-internal' });
  mockEconomicVariables.mockResolvedValueOnce({ categories: { pricing: { label: 'Pricing', variables: [{ id: 'var-internal', key: 'target_basket', value_used: 50000, unit: 'KMF' }] } } });
  mockEconomicCharges.mockResolvedValueOnce({ families: { operationnelle: { label: 'Opérationnelle', charges: [{ id: 'charge-internal', name: 'Hub Dubai', amount_kmf: 400, is_active: true }] } } });

  const result = await workspace.buildWorkspace();

  expect(mockEconomicExecutive).toHaveBeenCalledTimes(1);
  expect(mockEconomicVariables).toHaveBeenCalledTimes(1);
  expect(mockEconomicCharges).toHaveBeenCalledTimes(1);
  expect(result.economic).toMatchObject({ scope: 'global_pricing', source_of_truth: 'economic-engine', executive: { status: 'surveiller' } });
  expect(JSON.stringify(result.economic)).not.toMatch(/exec-internal|var-internal|charge-internal/);
});
"""
          p.write_text(text)

          # Boundary tests: aliases + no Legacy economic API in browser.
          replace(
              'tests/unit/canonical-pricing-workspace-boundary.test.js',
              "    '/admin/economic-flow',\n  ]) {",
              "    '/admin/economic-flow',\n    '/admin/economic',\n  ]) {"
          )
          replace(
              'tests/unit/canonical-pricing-workspace-boundary.test.js',
              "  expect(source).not.toContain('/api/admin/cost-components');\n  expect(source).toContain('/api/admin/workspaces/pricing');",
              "  expect(source).not.toContain('/api/admin/cost-components');\n  expect(source).not.toContain('/api/admin/economic');\n  expect(source).toContain('/api/admin/workspaces/pricing');\n  expect(source).toContain('Santé économique globale');\n  expect(source).toContain('Variables économiques');\n  expect(source).toContain('Charges économiques');"
          )
          replace(
              'tests/unit/canonical-pricing-workspace-boundary.test.js',
              "  expect(source).toContain(\"require('./cost-component-admin-service')\");\n});",
              "  expect(source).toContain(\"require('./cost-component-admin-service')\");\n  expect(source).toContain(\"require('./economic-engine-queries')\");\n});\n\ntest('Pilotage Financier converge vers Finance avec rollback Legacy explicite', () => {\n  const app = fakeApp();\n  mountHtmlRoutes(app, ROOT);\n\n  const canonicalRes = fakeRes();\n  app._routes['/admin/pilotage-fin']({ query: {} }, canonicalRes);\n  expect(canonicalRes.redirect).toHaveBeenCalledWith(302, '/admin/finance');\n\n  const legacyRes = fakeRes();\n  app._routes['/admin/pilotage-fin']({ query: { legacy: '1' } }, legacyRes);\n  expect(legacyRes.setHeader).toHaveBeenCalledWith('X-Admin-Generation', 'legacy-1');\n});"
          )

          # Extend the existing Pricing contract with the cutover proof.
          p = Path('docs/contract/PRICING_WORKSPACE_4F.md')
          text = p.read_text()
          text += """

## LOT 4T — Economic + Pilotage Financier cutover

### Legacy needs audit

`EconomicView` mixed four reads: catalogue pricing, executive economic model, charges and coherence. The catalogue/pricing part was already absorbed by Pricing 4F. LOT 4T adds the remaining **global economic model**, **economic variables** and **economic charges** to the same Pricing Workspace by delegating directly to `services/economic-engine-queries.js`.

`PilotageFinView` does not own a valid independent financial time series: it expects `history.months/data`, while `/api/admin/economic/history` actually returns `{ snapshots }` of the economic model. Its legitimate financial KPIs and trajectory are already owned by Canonical Finance, and category performance is already owned by Canonical Commerce. The broken Legacy projection is not ported.

### Authorization boundary

Economic configuration is global, not market-scoped. Canonical therefore exposes it only through `/api/admin/workspaces/pricing`, already protected by `requirePricingGlobalAuthority`. The browser does **not** call `/api/admin/economic/*` and never supplies a market identifier.

### Stable URL convergence

- `/admin/economic` → `/admin/workspaces/pricing`
- `/admin/pilotage-fin` → `/admin/finance`
- `?legacy=1` remains the explicit Legacy 1 rollback for both paths.

The Legacy API and UI files remain present for rollback/forensic purposes; LOT 4T changes the normal navigation path, not historical evidence.
"""
          p.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/pricing-workspace.js public/dashboards/canonical/js/pricing-workspace.js bootstrap/html-routes.js tests/unit/pricing-workspace.test.js tests/unit/canonical-pricing-workspace-boundary.test.js docs/contract/PRICING_WORKSPACE_4F.md
          git commit -m "feat(canonical): absorb economic and financial steering legacy views"
          git push origin HEAD:feat/canonical-economic-pilotage-fin-cutover
