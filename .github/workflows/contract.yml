name: Contract & Security (app-booting gates)

# Ces portes BOOTENT l'app (introspection runtime) : trop lourdes pour le
# pre-commit, elles vivent donc en CI. Elles ferment le maillon faible de la
# gouvernance : le contrat OpenAPI est la clef de voûte que les cartes 360 +
# meta utilisent pour résoudre les appels front -> backend, mais c'est le SEUL
# artefact que le pre-commit ne régénère pas. Ici on le régénère et on bloque
# si le contrat committé est PÉRIMÉ (route changée sans `npm run contract:generate`).

on:
  pull_request:
    branches: [main]
    # L'introspection du contrat ne doit bloquer que les PR capables de changer
    # la surface HTTP ou le générateur. Les gates/docs/scripts de gouvernance
    # n'altèrent pas le contrat runtime et ne doivent pas réveiller une dette de
    # génération préexistante sans rapport avec leur blast radius.
    paths:
      - 'routes/**'
      - 'validators/**'
      - 'bootstrap/**'
      - 'server.js'
      - 'scripts/contract-generate.js'
      - 'scripts/gen-route-registry.js'
      - 'docs/_generated/route-registry.json'
      - 'docs/contract/**'
  push:
    branches: [main]

jobs:
  contract-security:
    runs-on: ubuntu-latest

    # Secrets factices : l'app doit BOOTER pour l'introspection. Aucune valeur
    # réelle requise (le contrat s'écrit avant le seed DB ; l'ECONNREFUSED 5432
    # éventuel est inoffensif). Mêmes conventions que le job integration de ci.yml.
    env:
      NODE_ENV: test
      # P4-2 : bootstrap/env.js exige déjà toute cette liste (requiredEnv) —
      # sans elles server.js fait process.exit(1) avant l'introspection
      # runtime, donc ce job ne pouvait déjà pas booter l'app réellement.
      # DATABASE_URL factice, non résolvable : volontaire (cf. commentaire
      # ci-dessus, l'ECONNREFUSED qui en résulte est inoffensif ici).
      DATABASE_URL: postgres://ci-dummy:ci-dummy@localhost:5432/ci-dummy
      ADMIN_PASSWORD: ci-dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-dummy
      JWT_SECRET: ci-dummy
      SESSION_SECRET: ci-dummy
      INTERNAL_API_KEY: ci-dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      JWT_EXPIRES: 7d
      APP_URL: http://localhost
      PUBLIC_URL: http://localhost
      PUBLIC_BASE_URL: http://localhost
      ADMIN_RESET_KEY: ci-dummy
      INVOICE_PUBLIC_LINK_SECRET: ci-dummy
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_TOKEN: ci-dummy
      META_WA_PHONE_NUMBER_ID: ci-dummy
      # P4-2 : routes/meta-whatsapp.js fait process.exit(1) si absente
      # (cohérent avec JWT_SECRET) — l'app ne boote plus sans elle.
      META_WA_APP_SECRET: ci-dummy

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # 1. Reconstruit d'abord la table récursive route -> vrai fichier owner.
      #    Le contrat OpenAPI l'utilise pour x-route-file ; un simple mapping par
      #    préfixe top-level perd l'owner des sous-routers imbriqués.
      - name: Régénérer le registre récursif des routes
        run: node scripts/gen-route-registry.js

      # 2. Régénère le contrat par introspection runtime (vérité terrain).
      - name: Générer le contrat
        run: npm run contract:generate

      # 3. BLOQUANT — maillon faible fermé : le contrat committé doit être à jour.
      #    Si une route a changé sans régénération, le diff n'est pas vide => échec
      #    avec le remède exact. (Même logique que le "drift" du graphe dans governance.yml.)
      - name: Contrat à jour dans la PR (drift)
        run: |
          git diff --exit-code -- docs/_generated/route-registry.json docs/contract/openapi.json \
          || (echo "::error::Registre/contrat périmé. Régénère le route registry puis lance 'npm run contract:generate' et commit les artefacts" && exit 1)

      # 4. BLOQUANT — coutures front -> contrat (boutique + dashboards + meta),
      #    résolues contre le contrat FRAÎCHEMENT régénéré ci-dessus.
      - name: Boutique 360 (couture -> contrat)
        run: npm run boutique:360:check
      - name: Dashboards 360 (couture -> contrat)
        run: npm run dashboards:360:check
      - name: Meta-graphe (coutures fantômes)
        run: npm run meta:graph:check

      # 5. BLOQUANT — couverture des gardes : aucune NOUVELLE route admin sans
      #    garde / non protégée / non classable hors baseline.
      - name: Security 360 (gardes)
        run: npm run security:360:check
