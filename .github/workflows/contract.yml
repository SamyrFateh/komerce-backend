name: Contract Check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Générer le contrat
        run: npm run contract:generate
      - name: Vérifier la dérive
        run: npm run contract:check
        env:
          BOUTIQUE_DIR: public/boutique/js
          DASHBOARDS_DIR: public/dashboards
