name: Staging PDP AliExpress live audit

on:
  push:
    branches: [main]
    paths:
      - 'public/boutique/tests/e2e/pdp-aliexpress-live-audit.spec.js'
      - 'public/boutique/tests/e2e/pdp-aliexpress-all-units.spec.js'
      - '.github/workflows/staging-pdp-aliexpress-live-audit.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: komerce-staging-pdp-aliexpress-live-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Playwright PDP full battery
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issues' && github.actor == github.repository_owner &&
       github.event.issue.title == '[staging-op] pdp-aliexpress-live-audit')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://komerce.co/boutique/
      PDP_LIVE_AUDIT: '1'
      CI: '1'

    steps:
      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Run full PDP battery
        id: audit
        working-directory: public/boutique
        shell: bash
        run: |
          set +e
          forensic_mobile_rc=0
          forensic_desktop_rc=0
          all_units_rc=0
          live_core_rc=0
          local_geometry_rc=0
          local_gallery_rc=0

          echo '=== 1/6 AliExpress forensic — Mobile Chrome, 4 viewports x 5 products ==='
          npx playwright test tests/e2e/pdp-aliexpress-live-audit.spec.js \
            --project='Mobile Chrome' --grep='@ m' --workers=1 --retries=0 || forensic_mobile_rc=$?

          echo '=== 2/6 AliExpress forensic — Desktop Chrome, 1 viewport x 5 products ==='
          npx playwright test tests/e2e/pdp-aliexpress-live-audit.spec.js \
            --project='Desktop Chrome' --grep='@ d' --workers=1 --retries=0 || forensic_desktop_rc=$?

          echo '=== 3/6 Every sellable unit — all five AliExpress pilots ==='
          npx playwright test tests/e2e/pdp-aliexpress-all-units.spec.js \
            --project='Mobile Chrome' --project='Desktop Chrome' --workers=1 --retries=0 || all_units_rc=$?

          echo '=== 4/6 Existing live PDP regressions ==='
          npx playwright test \
            tests/e2e/modal.spec.js \
            tests/e2e/product-detail-pdc.spec.js \
            tests/e2e/golden-product-content-live.spec.js \
            tests/e2e/golden-product-gpm.spec.js \
            tests/e2e/modal-v3-mobile-finition.spec.js \
            tests/e2e/accessibility.spec.js \
            tests/e2e/cart.spec.js \
            --project='Mobile Chrome' --project='Desktop Chrome' --workers=1 --retries=0 || live_core_rc=$?

          echo '=== 5/6 Deterministic modal geometry + visual regression ==='
          env -u BASE_URL npx playwright test \
            tests/e2e/modal-geometry.spec.js \
            tests/e2e/modal-backtop-zindex.spec.js \
            tests/e2e/modal-visual-regression.spec.js \
            --project='Chromium Local-Only' --workers=1 --retries=0 || local_geometry_rc=$?

          echo '=== 6/6 Dedicated gallery layout matrix ==='
          env -u BASE_URL npx playwright test \
            tests/e2e/modal-mdm9-gallery-layout.spec.js \
            --project='Chromium MDM-9' --workers=1 --retries=0 || local_gallery_rc=$?

          for pair in \
            "forensic_mobile_rc=$forensic_mobile_rc" \
            "forensic_desktop_rc=$forensic_desktop_rc" \
            "all_units_rc=$all_units_rc" \
            "live_core_rc=$live_core_rc" \
            "local_geometry_rc=$local_geometry_rc" \
            "local_gallery_rc=$local_gallery_rc"; do
            echo "$pair" | tee -a "$GITHUB_OUTPUT"
          done

          mkdir -p test-results/pdp-live-audit
          cat > test-results/pdp-live-audit/BATTERY_STATUS.json <<JSON
          {
            "forensic_mobile": $forensic_mobile_rc,
            "forensic_desktop": $forensic_desktop_rc,
            "all_units": $all_units_rc,
            "live_core": $live_core_rc,
            "local_geometry": $local_geometry_rc,
            "local_gallery": $local_gallery_rc
          }
          JSON

          if [ "$forensic_mobile_rc" -ne 0 ] || [ "$forensic_desktop_rc" -ne 0 ] || \
             [ "$all_units_rc" -ne 0 ] || [ "$live_core_rc" -ne 0 ] || \
             [ "$local_geometry_rc" -ne 0 ] || [ "$local_gallery_rc" -ne 0 ]; then
            exit 1
          fi

      - name: Aggregate forensic findings
        if: always()
        working-directory: public/boutique
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.join(process.cwd(), 'test-results', 'pdp-live-audit');
          const reports = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const name of fs.readdirSync(dir)) {
              const p = path.join(dir, name);
              const st = fs.statSync(p);
              if (st.isDirectory()) walk(p);
              else if (name === 'report.json') {
                try { reports.push(JSON.parse(fs.readFileSync(p, 'utf8'))); } catch (_) {}
              }
            }
          }
          walk(root);
          const findings = reports.flatMap(r => (r.findings || []).map(f => ({
            ref: r.ref || 'unknown', viewport: r.viewport?.[0] || 'unknown', ...f
          })));
          const count = s => findings.filter(f => f.severity === s).length;
          const byCode = {};
          for (const f of findings) byCode[f.code] = (byCode[f.code] || 0) + 1;
          const summary = {
            reports: reports.length,
            findings: findings.length,
            p0: count('P0'),
            p1: count('P1'),
            by_code: Object.fromEntries(Object.entries(byCode).sort((a,b) => b[1]-a[1])),
            details: findings,
          };
          fs.mkdirSync(root, { recursive: true });
          fs.writeFileSync(path.join(root, 'SUMMARY.json'), JSON.stringify(summary, null, 2));
          const md = [
            '# PDP AliExpress live audit', '',
            `- forensic reports: ${summary.reports}/25`,
            `- P0: ${summary.p0}`,
            `- P1: ${summary.p1}`,
            '', '## Findings by code', '',
            ...Object.entries(summary.by_code).map(([k,v]) => `- ${k}: ${v}`),
          ].join('\n');
          fs.writeFileSync(path.join(root, 'SUMMARY.md'), md + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload PDP battery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdp-playwright-full-battery
          path: |
            public/boutique/test-results/
            public/boutique/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment command issue
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'PDP Playwright full battery completed. Review artifact pdp-playwright-full-battery.'
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
