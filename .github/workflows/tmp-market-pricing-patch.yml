name: Temporary market pricing patch

on:
  push:
    branches:
      - feat/market-operator-provisioning

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-operator-provisioning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fix focused Jest mock harness
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp-market-pricing-patch.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("let role = 'market_operator';", "let mockRole = 'market_operator';"),
              ("let authorized = new Set(['market-cm']);", "let mockAuthorized = new Set(['market-cm']);"),
              ("let centralPricing = false;", "let mockCentralPricing = false;"),
              ("role }; next();", "role: mockRole }; next();"),
              ("new Set(authorized)", "new Set(mockAuthorized)"),
              ("async () => centralPricing", "async () => mockCentralPricing"),
              ("=> centralPricing ? next()", "=> mockCentralPricing ? next()"),
              ("  role = 'market_operator';", "  mockRole = 'market_operator';"),
              ("  authorized = new Set(['market-cm']);", "  mockAuthorized = new Set(['market-cm']);"),
              ("  centralPricing = false;", "  mockCentralPricing = false;"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing mock harness anchor: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply market pricing patch
        run: python scripts/tmp-market-pricing-patch.py
      - name: Focused market pricing tests
        run: >-
          npx jest --runInBand
          tests/unit/cost-component-market-service.test.js
          tests/unit/admin-pricing-workspace-market-route.test.js
          tests/unit/order-cost-snapshot.test.js
          tests/unit/admin-pricing-workspace-route.test.js
          tests/unit/pricing-cdr.test.js
          tests/unit/pricing-workspace.test.js
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(pricing): add market-scoped cost model overrides"
          git push origin HEAD:feat/market-operator-provisioning
