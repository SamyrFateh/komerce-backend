name: Catalog supplier service proof

on:
  push:
    branches:
      - fix/feature-proof-catalog-supplier-services

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/feature-proof-catalog-supplier-services
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Register focused supplier tests in catalog slice
        shell: python
        run: |
          from pathlib import Path
          p = Path('features/catalog.feature.js')
          text = p.read_text(encoding='utf-8')
          anchor = "      'tests/unit/json-source-pipeline.test.js',\n"
          insert = anchor + "      'tests/unit/pipeline-constants.test.js',\n      'tests/unit/media-normalizer.test.js',\n      'tests/unit/promotion-classifier.test.js',\n      'tests/unit/source-product-normalizer.test.js',\n      'tests/unit/catalog-sync-checkpoint.test.js',\n"
          assert anchor in text, 'catalog supplier test anchor missing'
          assert 'tests/unit/pipeline-constants.test.js' not in text, 'supplier proofs already registered'
          p.write_text(text.replace(anchor, insert, 1), encoding='utf-8')
      - name: Run focused supplier tests
        run: npx jest tests/unit/pipeline-constants.test.js tests/unit/media-normalizer.test.js tests/unit/promotion-classifier.test.js tests/unit/source-product-normalizer.test.js tests/unit/catalog-sync-checkpoint.test.js --runInBand --no-coverage
      - name: Prove catalog slice reaches zero warnings
        run: node scripts/feature-guard.js --feature catalog --strict
      - name: Commit manifest and remove temporary workflow
        run: |
          rm .github/workflows/catalog-supplier-service-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/catalog.feature.js tests/unit/pipeline-constants.test.js tests/unit/media-normalizer.test.js tests/unit/promotion-classifier.test.js tests/unit/source-product-normalizer.test.js tests/unit/catalog-sync-checkpoint.test.js .github/workflows/catalog-supplier-service-proof.yml
          git commit -m "test(catalog): attach proofs to supplier pipeline services"
          git push origin HEAD:fix/feature-proof-catalog-supplier-services
