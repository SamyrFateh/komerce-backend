name: tmp-provider-v2-compose
on:
  push:
    branches: [feat/market-delegation-provider-v2]
permissions:
  contents: write
jobs:
  compose:
    if: ${{ !contains(github.event.head_commit.message, '[provider-v2-composed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Compose provider v2 on current main contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rw(path, fn):
              p = Path(path)
              s = p.read_text()
              n = fn(s)
              if n == s:
                  raise SystemExit(f'no change produced for {path}')
              p.write_text(n)

          # provider owner boundary: mutation de statut elle-même market-scopée,
          # tout en conservant les appels historiques à 2/3 arguments.
          def patch_provider_owner(s):
              old = "async function setProviderStatus(providerId, status, executor = db) {"
              new = "async function setProviderStatus(providerId, status, executor = db, marketId = null) {"
              if old not in s:
                  raise SystemExit('setProviderStatus signature not found')
              s = s.replace(old, new, 1)
              old_block = """  const { rows } = await executor.query(\n    `UPDATE providers SET status = $2, updated_at = now()\n     WHERE id = $1\n     RETURNING id, name, phone, market_id, status, created_at, updated_at`,\n    [providerId, status]\n  );"""
              new_block = """  const params = [providerId, status];\n  const marketPredicate = marketId ? ' AND market_id = $3' : '';\n  if (marketId) params.push(marketId);\n  const { rows } = await executor.query(\n    `UPDATE providers SET status = $2, updated_at = now()\n     WHERE id = $1${marketPredicate}\n     RETURNING id, name, phone, market_id, status, created_at, updated_at`,\n    params\n  );"""
              if old_block not in s:
                  raise SystemExit('setProviderStatus SQL block not found')
              return s.replace(old_block, new_block, 1)
          rw('services/providers-service.js', patch_provider_owner)

          def patch_orchestrator(s):
              s = s.replace("""const {\n  audit,\n} = require('./market-delegation-service');\n\nconst {\n  resolveActiveAssignmentByMarketCode,\n  resolveAuthorization,\n} = require('./market-delegation-team-service');""", """const {\n  audit,\n  resolveActiveAssignmentByMarketCode,\n  resolveAuthorization,\n} = require('./market-delegation-service');""", 1)
              old = "const after = await providersService.setProviderStatus(providerId, status, db);"
              new = "const after = await providersService.setProviderStatus(providerId, status, db, authz.market_id);"
              if old not in s:
                  raise SystemExit('provider status orchestration call not found')
              return s.replace(old, new, 1)
          rw('services/market-delegation-provider-service.js', patch_orchestrator)

          # Mount alongside network + catalog on the latest composition root.
          def patch_bootstrap(s):
              anchor = "  const marketDelegationNetworkRouter = require('../routes/market-delegation-network');\n"
              if "marketDelegationProviderRouter" not in s:
                  s = s.replace(anchor, anchor + "  const marketDelegationProviderRouter = require('../routes/market-delegation-provider');\n", 1)
              mount = "  app.use('/api/market-delegation', marketDelegationNetworkRouter);\n"
              if "app.use('/api/market-delegation', marketDelegationProviderRouter);" not in s:
                  s = s.replace(mount, mount + "  app.use('/api/market-delegation', marketDelegationProviderRouter);\n", 1)
              return s
          rw('bootstrap/api-routes.js', patch_bootstrap)

          # Registry/checkpoint: network=23/31 live; provider ajoute exactement +1.
          rw('config/market-delegation-capabilities.js', lambda s: s.replace(
              "['provider.manage','DELEGATION','network','MARKET','DELEGABLE',true,'MISSING']",
              "['provider.manage','DELEGATION','network','MARKET','DELEGABLE',true,'LIVE']", 1))

          def patch_checkpoint(s):
              s = s.replace("lot: '2C-cash+2A-network'", "lot: '2B-provider'", 1)
              s = s.replace("live: 23,", "live: 24,", 1)
              return s
          rw('scripts/capability-registry-check.js', patch_checkpoint)

          rw('tests/unit/market-delegation-cash-control-routes.test.js', lambda s: s.replace(
              "{ live: 23, total: 31 }", "{ live: 24, total: 31 }", 1))

          def patch_p0(s):
              s = s.replace('LOT 2C+2A advance autonomy to 23/31', 'LOT 2B provider advances autonomy to 24/31', 1)
              s = s.replace("{ live: 23, total: 31, rate: 23 / 31 }", "{ live: 24, total: 31, rate: 24 / 31 }", 1)
              s = s.replace("checkpoint: { lot: '2C-cash+2A-network', p0_live: 15, live: 23, delegation: 31 }", "checkpoint: { lot: '2B-provider', p0_live: 15, live: 24, delegation: 31 }", 1)
              anchor = """    for (const capability of ['network.create', 'network.update', 'network.suspend']) {\n      expect(CAPABILITIES.find(row => row.capability === capability)?.status).toBe('LIVE');\n    }"""
              if "capability === 'provider.manage'" not in s:
                  s = s.replace(anchor, anchor + "\n    expect(CAPABILITIES.find(row => row.capability === 'provider.manage')?.status).toBe('LIVE');", 1)
              tail = """  test('promotion network LIVE aligne ceiling et responsables pays sans élargir les viewers', () => {"""
              # Append provider migration invariant before final describe close.
              if 'promotion provider.manage LIVE' not in s:
                  insert = """\n\n  test('promotion provider.manage LIVE aligne ceiling et responsables pays sans élargir les viewers', () => {\n    const migration = read('migrations/203_market_delegation_provider_manage_live.sql');\n    expect(migration).toMatch(/provider\\.manage/);\n    expect(migration).toMatch(/INSERT INTO assignment_capability_ceiling/);\n    expect(migration).toMatch(/mc\\.capability = 'team\\.grant'/);\n    expect(migration).toMatch(/mc\\.capability = 'team\\.revoke'/);\n    expect(migration).toMatch(/mc\\.capability = 'network\\.read'/);\n    expect(migration).toMatch(/INSERT INTO membership_capabilities/);\n    expect(migration).toMatch(/CAPABILITY_GRANTED_BY_PROMOTION/);\n    expect(migration).toMatch(/migration-203/);\n  });\n"""
                  idx = s.rfind('\n});')
                  if idx < 0: raise SystemExit('p0 describe tail not found')
                  s = s[:idx] + insert + s[idx:]
              return s
          rw('tests/unit/market-delegation-p0.test.js', patch_p0)

          # Provider tests: status UPDATE must itself carry market scope.
          def patch_provider_test(s):
              old = """      expect(sql).toMatch(/UPDATE providers SET status/);\n      expect(params[1]).toBe('suspended');"""
              new = """      expect(sql).toMatch(/UPDATE providers SET status/);\n      expect(sql).toMatch(/market_id = \\$3/);\n      expect(params[1]).toBe('suspended');\n      expect(params[2]).toBe('mkt-cm');"""
              if old not in s: raise SystemExit('provider service test status block not found')
              return s.replace(old, new, 1)
          rw('tests/unit/market-delegation-provider-service.test.js', patch_provider_test)

          # Owner service test: direct market-scoped status update contract.
          def patch_owner_test(s):
              idx = s.rfind('\n});')
              if idx < 0: raise SystemExit('providers test tail not found')
              block = """\n\n  it('setProviderStatus peut borner le UPDATE au market_id sans casser la signature historique', async () => {\n    const svc = loadService();\n    mockQuery.mockImplementationOnce(async (sql, params) => {\n      expect(sql).toMatch(/WHERE id = \\$1\\$\\{marketPredicate\\}/);\n      expect(params).toEqual([PROVIDER_ID, 'suspended', MARKET_CM]);\n      return { rows: [{ id: PROVIDER_ID, market_id: MARKET_CM, status: 'suspended' }] };\n    });\n    const row = await svc.setProviderStatus(PROVIDER_ID, 'suspended', { query: mockQuery }, MARKET_CM);\n    expect(row.status).toBe('suspended');\n  });\n"""
              return s[:idx] + block + s[idx:]
          rw('tests/unit/providers-service.test.js', patch_owner_test)

          # Migration 203: promotion LIVE + ceiling + managers existants, auditée.
          Path('migrations/203_market_delegation_provider_manage_live.sql').write_text(r"""-- @migration 203_market_delegation_provider_manage_live.sql
-- @domain    market-delegation
-- @purpose   provider.manage devient réellement LIVE et immédiatement utilisable
--            par les responsables pays existants, sans élargir les viewers.

UPDATE capability_registry
   SET status = 'LIVE', updated_at = NOW()
 WHERE capability = 'provider.manage';

INSERT INTO assignment_capability_ceiling (assignment_id, capability, granted_by)
SELECT a.id, 'provider.manage', a.granted_by
  FROM market_operating_assignments a
 WHERE a.status = 'ACTIVE'
   AND NOT EXISTS (
     SELECT 1 FROM assignment_capability_ceiling acc
      WHERE acc.assignment_id = a.id
        AND acc.capability = 'provider.manage'
        AND acc.revoked_at IS NULL
   );

WITH eligible AS (
  SELECT am.id AS membership_id, am.assignment_id, am.user_id
    FROM assignment_memberships am
   WHERE am.status = 'ACTIVE'
     AND EXISTS (
       SELECT 1 FROM membership_capabilities mc
        WHERE mc.membership_id = am.id AND mc.capability = 'team.grant' AND mc.revoked_at IS NULL
     )
     AND EXISTS (
       SELECT 1 FROM membership_capabilities mc
        WHERE mc.membership_id = am.id AND mc.capability = 'team.revoke' AND mc.revoked_at IS NULL
     )
     AND EXISTS (
       SELECT 1 FROM membership_capabilities mc
        WHERE mc.membership_id = am.id AND mc.capability = 'network.read' AND mc.revoked_at IS NULL
     )
), inserted AS (
  INSERT INTO membership_capabilities (membership_id, capability, granted_by)
  SELECT e.membership_id, 'provider.manage', e.user_id
    FROM eligible e
   WHERE NOT EXISTS (
     SELECT 1 FROM membership_capabilities mc
      WHERE mc.membership_id = e.membership_id
        AND mc.capability = 'provider.manage'
        AND mc.revoked_at IS NULL
   )
  RETURNING membership_id
)
INSERT INTO market_delegation_audit (
  actor_user_id, assignment_id, membership_id, capability, action,
  payload_before, payload_after, occurred_at, correlation_id
)
SELECT am.user_id, am.assignment_id, am.id, 'provider.manage',
       'CAPABILITY_GRANTED_BY_PROMOTION', NULL,
       jsonb_build_object('capability','provider.manage','source','migration-203'),
       NOW(), 'migration-203'
  FROM inserted i
  JOIN assignment_memberships am ON am.id = i.membership_id;
""")

          # Merge provider into latest market-delegation feature card; never replace it.
          def patch_market_feature(s):
              s = s.replace('Migration 198 retire le défaut géographique Anjouan', 'Migration 200 retire le défaut géographique Anjouan', 1)
              r_anchor = "      'LOT 2A rend le réseau local (relais) autonome par capabilities network.* ; suspension jamais suppression, pour préserver les FK entrantes (orders, parcels, scans, partners, recipients, shared_carts, users).',\n"
              if 'LOT 2B rend les providers locaux' not in s:
                  s = s.replace(r_anchor, r_anchor + "      'LOT 2B rend les providers locaux autonomes par provider.manage ; création, modification, suspension/réactivation restent bornées au Market ID et auditables.',\n", 1)
              in_anchor = "      'un relais reste rattaché à son marché d’origine ; toute tentative de lecture/écriture cross-market échoue en 404, sans confirmer l’existence de la ressource sur un autre marché',\n"
              if 'un provider reste rattaché' not in s:
                  s = s.replace(in_anchor, in_anchor + "      'un provider reste rattaché à son marché d’origine ; provider.manage ne permet jamais une réassignation cross-market et les mutations passent par providers-services, lifecycle owner',\n", 1)
              s = s.replace("      'providers/relais comme principaux locaux secondaires : jamais des assignments concurrents',", "      'providers/relais comme principaux locaux secondaires : jamais des assignments concurrents ; leur gestion locale reste déléguable sans transformer leur identité en user_role',", 1)
              mig_anchor = "      'migrations/200_market_delegation_relais_island_nullable.sql',\n"
              if "203_market_delegation_provider_manage_live" not in s:
                  s = s.replace(mig_anchor, mig_anchor + "      'migrations/201_market_network_promotion_agent_optional.sql',\n      'migrations/203_market_delegation_provider_manage_live.sql',\n", 1)
              svc_anchor = "      'services/market-delegation-network-service.js',\n"
              if "services/market-delegation-provider-service.js" not in s:
                  s = s.replace(svc_anchor, svc_anchor + "      'services/market-delegation-provider-service.js',\n", 1)
              route_anchor = "      'routes/market-delegation-network.js',\n"
              if "routes/market-delegation-provider.js" not in s:
                  s = s.replace(route_anchor, route_anchor + "      'routes/market-delegation-provider.js',\n", 1)
              test_anchor = "      'tests/unit/market-delegation-network-routes.test.js',\n"
              if "tests/unit/market-delegation-provider-service.test.js" not in s:
                  s = s.replace(test_anchor, test_anchor + "      'tests/unit/market-delegation-provider-service.test.js',\n      'tests/unit/market-delegation-provider-routes.test.js',\n", 1)
              db_anchor = "      'relais: R',  // mutations via logistics/relais-mutation-service\n"
              if "'providers: R'" not in s:
                  s = s.replace(db_anchor, db_anchor + "      'providers: R',  // mutations via providers-services/providers-service\n", 1)
              s = s.replace('authedRoutesDetected: 15,', 'authedRoutesDetected: 20,', 1)
              s = s.replace('totalRoutes: 15,', 'totalRoutes: 20,', 1)
              s = s.replace('LOT 1A + LOT 2A + LOT 2C + LOT 4', 'LOT 1A + LOT 2A + LOT 2B + LOT 2C + LOT 4', 1)
              s = s.replace('team.*/network.*/cash_control.*/catalog.expose/finance.read', 'team.*/network.*/provider.manage/cash_control.*/catalog.expose/finance.read', 1)
              exposes_anchor = "      'POST /api/market-delegation/markets/:marketCode/network/relais/:relaisId/activate — network.update',\n"
              if '/network/providers — provider.manage' not in s:
                  s = s.replace(exposes_anchor, exposes_anchor + "      'GET /api/market-delegation/markets/:marketCode/network/providers — provider.manage',\n      'POST /api/market-delegation/markets/:marketCode/network/providers — provider.manage',\n      'PUT /api/market-delegation/markets/:marketCode/network/providers/:providerId — provider.manage',\n      'POST /api/market-delegation/markets/:marketCode/network/providers/:providerId/suspend — provider.manage',\n      'POST /api/market-delegation/markets/:marketCode/network/providers/:providerId/activate — provider.manage',\n", 1)
              api_anchor = "      { fn: 'setRelaisActive', file: 'services/market-delegation-network-service.js' },\n"
              if "{ fn: 'createProvider', file: 'services/market-delegation-provider-service.js' }" not in s:
                  s = s.replace(api_anchor, api_anchor + "      { fn: 'createProvider', file: 'services/market-delegation-provider-service.js' },\n      { fn: 'updateProvider', file: 'services/market-delegation-provider-service.js' },\n      { fn: 'setProviderStatus', file: 'services/market-delegation-provider-service.js' },\n", 1)
              s = s.replace("'logistics', 'catalog']", "'logistics', 'catalog', 'providers-services']", 1)
              inv_anchor = "    { statement: 'les routes réseau refusent market_id/marketId venant du client comme preuve d’autorité, comme les routes équipe', test: 'tests/unit/market-delegation-network-routes.test.js' },\n"
              if 'suspendre un provider ne le supprime jamais' not in s:
                  s = s.replace(inv_anchor, inv_anchor + "    { statement: 'un provider ne peut jamais être modifié par une membership d’un autre marché ; la réponse est 404 pour ne pas confirmer son existence', test: 'tests/unit/market-delegation-provider-service.test.js' },\n    { statement: 'suspendre un provider ne le supprime jamais ; il reste réactivable et son Market ID est immuable par cette boundary', test: 'tests/unit/market-delegation-provider-service.test.js' },\n", 1)
              return s
          rw('features/market-delegation.feature.js', patch_market_feature)
          PY

      - name: Regenerate Security 360
        run: node scripts/gen-security-360.js
      - name: Targeted provider tests
        run: npx jest --runInBand tests/unit/providers-service.test.js tests/unit/market-delegation-provider-service.test.js tests/unit/market-delegation-provider-routes.test.js tests/unit/market-delegation-p0.test.js tests/unit/market-delegation-cash-control-routes.test.js
      - name: Registry checkpoint
        run: node scripts/capability-registry-check.js
      - name: Commit composed provider v2
        run: |
          git config user.name "provider-v2-bot"
          git config user.email "provider-v2-bot@users.noreply.github.com"
          git add bootstrap/api-routes.js config/market-delegation-capabilities.js docs/SECURITY_360.json docs/SECURITY_360.md features/market-delegation.feature.js features/providers-services.feature.js migrations/203_market_delegation_provider_manage_live.sql routes/market-delegation-provider.js scripts/capability-registry-check.js services/market-delegation-provider-service.js services/providers-service.js tests/unit/market-delegation-cash-control-routes.test.js tests/unit/market-delegation-p0.test.js tests/unit/market-delegation-provider-routes.test.js tests/unit/market-delegation-provider-service.test.js tests/unit/providers-service.test.js
          git commit -m "feat(provider): autonomie locale provider.manage [provider-v2-composed]"
          git push origin HEAD:feat/market-delegation-provider-v2
