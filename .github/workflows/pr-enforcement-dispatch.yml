name: PR enforcement dispatcher

on:
  pull_request_target:
    branches:
      - main
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: pr-enforcement-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch PR enforcement
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch certification on exact internal PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail

          pending_payload="$(node -e "process.stdout.write(JSON.stringify({state:'pending',context:'Required verdict',description:'Trusted PR enforcement in progress'}))")"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -d "$pending_payload"

          node - <<'NODE' > /tmp/dispatch.json
          const payload = {
            ref: process.env.HEAD_REF,
            inputs: {
              pr_number: String(process.env.PR_NUMBER),
              head_sha: String(process.env.HEAD_SHA),
              base_sha: String(process.env.BASE_SHA),
              head_ref: String(process.env.HEAD_REF),
              base_ref: String(process.env.BASE_REF),
            },
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/pr-enforcement.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
