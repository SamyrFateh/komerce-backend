name: Temporary no-noise warning stream

on:
  push:
    branches:
      - governance/no-noise-warning-stream

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/no-noise-warning-stream
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply no-noise warning stream doctrine
        run: node scripts/temp-no-noise-warning-stream.js
      - name: Remove temporary tooling before canonical generation
        run: rm .github/workflows/temp-no-noise-warning-stream.yml scripts/temp-no-noise-warning-stream.js
      - name: Refresh canonical governance projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Run warning stream regressions
        run: npx jest tests/unit/business-graph-warning-stream.test.js tests/unit/business-graph-warning-semantics.test.js --runInBand
      - name: Prove no-noise output and gates
        shell: bash
        run: |
          npm run business-graph:check
          node scripts/business-graph-ratchet-check.js
          npm run feature:360:check
          node scripts/feature-guard.js --strict
          node - <<'NODE'
          const g = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const warn = g.drifts.warn || [];
          const debt = g.drifts.debt || [];
          const expected = g.drifts.expectedTopology || [];
          const limits = g.drifts.generatorLimitations || [];
          const key = x => `${x.type}::${x.ref}`;
          const w = new Set(warn.map(key));
          const pollution = [...expected, ...limits].filter(x => w.has(key(x)));
          console.log({ summary: g.drifts.summary, warn: warn.length, debt: debt.length, expected: expected.length, limits: limits.length, pollution: pollution.length });
          if (JSON.stringify(warn) !== JSON.stringify(debt)) throw new Error('drifts.warn must equal drifts.debt');
          if (pollution.length) throw new Error(`noise still emitted as warning: ${JSON.stringify(pollution)}`);
          if (g.drifts.summary.signals !== debt.length) throw new Error('summary.signals must count emitted warning signals only');
          if (g.drifts.summary.classifiedCandidates !== debt.length + expected.length + limits.length) throw new Error('classified candidate accounting mismatch');
          if (debt.length !== 30) throw new Error(`debt changed unexpectedly: ${debt.length}`);
          NODE
          git diff --check
      - name: Commit final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): stop emitting noise as warnings"
          git push origin HEAD:governance/no-noise-warning-stream
