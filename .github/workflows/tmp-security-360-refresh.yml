name: Temporary Security 360 refresh

on:
  push:
    branches:
      - feat/mixed-fulfillment-checkout-preview-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mixed-fulfillment-checkout-preview-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regenerate reviewed Security 360 projection and baseline
        run: npm run security:360:save
      - name: Commit generated Security 360 artifacts
        run: |
          if git diff --quiet -- docs/SECURITY_360.json docs/SECURITY_360.md scripts/.security-360-baseline.json; then
            echo "Security 360 already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SECURITY_360.json docs/SECURITY_360.md scripts/.security-360-baseline.json
          git commit -m "chore(security): refresh Security 360 for checkout preview"
          git push origin HEAD:feat/mixed-fulfillment-checkout-preview-v1
