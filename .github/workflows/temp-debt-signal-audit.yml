name: Temporary debt signal truth finalizer

on:
  push:
    branches:
      - governance/debt-signal-truth

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/debt-signal-truth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply semantic debt split
        run: node scripts/temp-debt-signal-truth.js
      - name: Semantic regression tests
        run: npx jest --config jest.unit.config.js --runInBand --no-coverage tests/unit/business-graph-warning-semantics.test.js
      - name: Remove temporary tooling before canonical generation
        run: rm .github/workflows/temp-debt-signal-audit.yml scripts/temp-debt-signal-truth.js
      - name: Refresh Business Graph and Feature360
        run: |
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Verify debt truth and ratchet
        shell: bash
        run: |
          npm run business-graph:check
          node scripts/business-graph-ratchet-check.js
          npm run feature:360:check
          npm run quality:gate
          node scripts/feature-guard.js --strict
          node - <<'NODE'
          const m=require('./docs/BUSINESS_FEATURE_GRAPH.json');
          if (m.drifts.summary.debt !== 107) throw new Error(`expected debt=107, got ${m.drifts.summary.debt}`);
          if (m.drifts.summary.expectedTopology !== 12) throw new Error(`expected expectedTopology=12, got ${m.drifts.summary.expectedTopology}`);
          if (m.drifts.summary.generatorLimitations !== 8) throw new Error(`expected generatorLimitations=8, got ${m.drifts.summary.generatorLimitations}`);
          if (m.drifts.summary.signals !== 127) throw new Error(`expected signals=127, got ${m.drifts.summary.signals}`);
          console.log(m.drifts.summary);
          NODE
          git diff --check
      - name: Commit final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): separate debt from tool noise"
          git push origin HEAD:governance/debt-signal-truth
