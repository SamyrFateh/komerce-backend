name: Temporary debt signal audit

on:
  push:
    branches:
      - governance/debt-signal-truth

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Semantic counts by category and ratchet key
        shell: bash
        run: |
          node - <<'NODE'
          const m = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const s = require('./governance/business-graph-warning-semantics.js');
          const byCategory = {};
          const byKey = {};
          for (const w of m.drifts.warn) {
            const category = s.classify(w, { ROOT: process.cwd() }).category;
            byCategory[category] = (byCategory[category] || 0) + 1;
            const key = `${w.type}::${category}`;
            byKey[key] = (byKey[key] || 0) + 1;
          }
          console.log(JSON.stringify({ total: m.drifts.warn.length, byCategory, byKey }, null, 2));
          NODE
      - name: Current ratchet result
        run: node scripts/business-graph-ratchet-check.js
