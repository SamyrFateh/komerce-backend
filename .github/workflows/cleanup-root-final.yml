name: Final Repository Cleanup

on:
  push:
    branches: [cleanup/root-final-20260728]

permissions:
  contents: write
  statuses: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cleanup/root-final-20260728

      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"root-cleanup\",\"description\":\"Repository cleanup validation running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Remove obsolete repository material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf certification-logs coverage
          rm -rf docs/_agent docs/_logs docs/_pending docs/_work docs/_archive
          rm -rf docs/audit docs/chantier
          find . -maxdepth 1 -type f \( -iname '*.zip' -o -iname '*.patch' -o -iname '*.diff' -o -iname '*.log' -o -iname 'PROMPT*.md' \) -delete
          find docs -type f \( -iname 'PROMPT*.md' -o -iname '*.patch' -o -iname '*.patch.md' -o -iname '*.diff' \) -delete
          find .github/workflows -maxdepth 1 -type f -name '*once*.yml' -delete
          rm -f docs/KNOWN_FAILING_TESTS.md
          rm -f docs/AUDIT_CONFORMITE_PRE_GOLIVE_2026-06-08.md
          rm -f docs/P4_1_CALIBRAGE_RUN2.md
          rm -f docs/P4_1_PREMIER_RUN.md
          rm -f docs/RECONCILIATION_2026-06-16.md
          rm -f docs/SIGNOFF_REVERIF.md
          rm -f docs/backend/ROUTES_REFACTO_ANALYSIS_2026-06-14.md
          rm -f docs/boutique/ROADMAP_MODAL_TEMU.md
          rm -f docs/doctrine/AUDIT_FEATURE_DOCTRINE.md
          rm -f docs/vision/ROADMAP_PILOTE_KOMERCE.md

          cat > docs/TEST_CERTIFICATION.md <<'EOF'
          # Certification des tests et de la gouvernance

          État certifié le 28 juillet 2026.

          - Unités racine : toutes les suites de `tests/unit` sont vertes avec couverture, via `npm run test:unit:coverage`.
          - Intégration : 31/31 suites vertes avec PostgreSQL 16 et le bootstrap CI canonique, via `npm run test:integration`.
          - Boutique : audit, gates rapides et couverture verts.
          - Dashboards : audit et `check:all` verts.
          - Gouvernance : registre, classification, invariants, projections 360, dispositions O6 et `map:check` verts.
          - Preuve d'exécution complète : GitHub Actions run `30349485657`.

          L'ancien chiffre « 13 suites en échec » provenait d'un ancien harnais et de fixtures périmées. Il ne décrit plus l'état du dépôt.

          ## Commandes canoniques

          ```bash
          npm run test:unit:coverage
          npm run test:integration
          npm --prefix public/boutique run check:fast
          npm --prefix public/boutique run test:coverage
          npm --prefix public/dashboards run check:all
          npm run feature:360:check
          npm run map:check
          ```
          EOF

      - name: Reconcile certified governance files
        run: node scripts/cleanup-final-repo.js

      - name: Remove cleanup harness before validation
        run: |
          rm -f scripts/cleanup-final-repo.js
          rm -f .github/workflows/cleanup-root-final.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Audit classifier test
        run: npx jest tests/unit/npm-audit-core.test.js --ci --runInBand
      - name: Dependency audit gate
        run: npm run audit:gate
      - name: Feature registry
        run: npm run feature:registry
      - name: Registry documentation
        run: npm run feature:registry-doc
      - name: Strict classification
        run: npm run feature:classification:strict
      - name: Feature guard
        run: npm run feature:check
      - name: Full documentation lint
        run: |
          set -o pipefail
          npm run gate:docs-lint:full 2>&1 | tee docs-lint-cleanup.log
      - name: Upload documentation lint evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: root-cleanup-docs-${{ github.run_id }}
          path: docs-lint-cleanup.log
          retention-days: 1
      - name: Regenerate governance projections
        run: |
          npm run arch:gen
          npm run dashboards:360
          npm run boutique:360
          npm run business-graph:gen
          npm run meta:graph
          npm run feature:360:gen
      - name: Final governance checks
        run: |
          npm run feature:360:check
          npm run map:check

      - name: Commit cleaned tree
        id: commit
        run: |
          rm -f docs-lint-cleanup.log
          git config user.name "Komerce Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(repo): retain only current governed material [root-clean]"
          git push origin HEAD:cleanup/root-final-20260728
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          state=failure
          description="Repository cleanup validation failed"
          target_sha="$GITHUB_SHA"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Repository cleanup and governance passed"
            target_sha="$FINAL_SHA"
          fi
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
            -d "{\"state\":\"${state}\",\"context\":\"root-cleanup\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
