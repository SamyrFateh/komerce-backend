name: tmp-provider-finalize
on:
  push:
    branches:
      - feat/market-delegation-provider-v2
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Patch composition and feature cards
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p = Path(path)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'anchor missing in {path}: {old[:80]}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('bootstrap/api-routes.js', [
            ("routes/market-delegation-network.js, routes/market-delegation-catalog.js", "routes/market-delegation-network.js, routes/market-delegation-provider.js, routes/market-delegation-catalog.js"),
            ("  const marketDelegationNetworkRouter = require('../routes/market-delegation-network');\n  const marketDelegationCatalogRouter", "  const marketDelegationNetworkRouter = require('../routes/market-delegation-network');\n  const marketDelegationProviderRouter = require('../routes/market-delegation-provider');\n  const marketDelegationCatalogRouter"),
            ("  app.use('/api/market-delegation', marketDelegationNetworkRouter);\n  app.use('/api/market-delegation', marketDelegationCatalogRouter);", "  app.use('/api/market-delegation', marketDelegationNetworkRouter);\n  app.use('/api/market-delegation', marketDelegationProviderRouter);\n  app.use('/api/market-delegation', marketDelegationCatalogRouter);")
          ])

          p = Path('features/market-delegation.feature.js')
          s = p.read_text()
          s = s.replace('Migration 198 retire le défaut géographique Anjouan', 'Migration 200 retire le défaut géographique Anjouan', 1)
          s = s.replace(
            "      'LOT 2A rend le réseau local (relais) autonome par capabilities network.* ; suspension jamais suppression, pour préserver les FK entrantes (orders, parcels, scans, partners, recipients, shared_carts, users).',\n",
            "      'LOT 2A rend le réseau local (relais) autonome par capabilities network.* ; suspension jamais suppression, pour préserver les FK entrantes (orders, parcels, scans, partners, recipients, shared_carts, users).',\n      'LOT 2B rend les providers locaux autonomes par provider.manage ; création, modification, suspension/réactivation restent bornées au Market ID et auditables.',\n", 1)
          s = s.replace(
            "      'un relais reste rattaché à son marché d’origine ; toute tentative de lecture/écriture cross-market échoue en 404, sans confirmer l’existence de la ressource sur un autre marché',\n",
            "      'un relais reste rattaché à son marché d’origine ; toute tentative de lecture/écriture cross-market échoue en 404, sans confirmer l’existence de la ressource sur un autre marché',\n      'un provider reste rattaché à son marché d’origine ; provider.manage ne permet jamais une réassignation cross-market et les mutations passent par providers-services, lifecycle owner',\n", 1)
          s = s.replace(
            "      'providers/relais comme principaux locaux secondaires : jamais des assignments concurrents',",
            "      'providers/relais comme principaux locaux secondaires : jamais des assignments concurrents ; leur gestion locale reste déléguable sans transformer leur identité en user_role',", 1)
          s = s.replace(
            "      'migrations/200_market_delegation_relais_island_nullable.sql',\n",
            "      'migrations/200_market_delegation_relais_island_nullable.sql',\n      'migrations/201_market_network_promotion_agent_optional.sql',\n      'migrations/203_market_delegation_provider_manage_live.sql',\n", 1)
          s = s.replace(
            "      'services/market-delegation-network-service.js',\n",
            "      'services/market-delegation-network-service.js',\n      'services/market-delegation-provider-service.js',\n", 1)
          s = s.replace(
            "      'routes/market-delegation-network.js',\n",
            "      'routes/market-delegation-network.js',\n      'routes/market-delegation-provider.js',\n", 1)
          s = s.replace(
            "      'tests/unit/market-delegation-network-routes.test.js',\n",
            "      'tests/unit/market-delegation-network-routes.test.js',\n      'tests/unit/market-delegation-provider-service.test.js',\n      'tests/unit/market-delegation-provider-routes.test.js',\n", 1)
          s = s.replace(
            "      'relais: R',  // mutations via logistics/relais-mutation-service\n",
            "      'relais: R',  // mutations via logistics/relais-mutation-service\n      'providers: R',  // mutations via providers-services boundaries\n", 1)
          s = s.replace('authedRoutesDetected: 15,', 'authedRoutesDetected: 20,', 1)
          s = s.replace('totalRoutes: 15,', 'totalRoutes: 20,', 1)
          s = s.replace('LOT 1A + LOT 2A + LOT 2C + LOT 4', 'LOT 1A + LOT 2A + LOT 2B + LOT 2C + LOT 4', 1)
          s = s.replace('team.*/network.*/cash_control.*/catalog.expose/finance.read', 'team.*/network.*/provider.manage/cash_control.*/catalog.expose/finance.read', 1)
          s = s.replace(
            "      'POST /api/market-delegation/markets/:marketCode/network/relais/:relaisId/activate — network.update',\n",
            "      'POST /api/market-delegation/markets/:marketCode/network/relais/:relaisId/activate — network.update',\n      'GET /api/market-delegation/markets/:marketCode/network/providers — provider.manage',\n      'POST /api/market-delegation/markets/:marketCode/network/providers — provider.manage',\n      'PUT /api/market-delegation/markets/:marketCode/network/providers/:providerId — provider.manage',\n      'POST /api/market-delegation/markets/:marketCode/network/providers/:providerId/suspend — provider.manage',\n      'POST /api/market-delegation/markets/:marketCode/network/providers/:providerId/activate — provider.manage',\n", 1)
          s = s.replace(
            "      { fn: 'setRelaisActive', file: 'services/market-delegation-network-service.js' },\n",
            "      { fn: 'setRelaisActive', file: 'services/market-delegation-network-service.js' },\n      { fn: 'createProvider', file: 'services/market-delegation-provider-service.js' },\n      { fn: 'updateProvider', file: 'services/market-delegation-provider-service.js' },\n      { fn: 'setProviderStatus', file: 'services/market-delegation-provider-service.js' },\n", 1)
          s = s.replace("'logistics', 'catalog']", "'logistics', 'catalog', 'providers-services']", 1)
          s = s.replace(
            "    { statement: 'les routes réseau refusent market_id/marketId venant du client comme preuve d’autorité, comme les routes équipe', test: 'tests/unit/market-delegation-network-routes.test.js' },\n",
            "    { statement: 'les routes réseau refusent market_id/marketId venant du client comme preuve d’autorité, comme les routes équipe', test: 'tests/unit/market-delegation-network-routes.test.js' },\n    { statement: 'un provider ne peut jamais être modifié par une membership d’un autre marché ; la réponse est 404 pour ne pas confirmer son existence', test: 'tests/unit/market-delegation-provider-service.test.js' },\n    { statement: 'suspendre un provider ne le supprime jamais ; il reste réactivable et son Market ID est immuable par cette boundary', test: 'tests/unit/market-delegation-provider-service.test.js' },\n", 1)
          p.write_text(s)

          p = Path('features/providers-services.feature.js')
          s = p.read_text()
          svc_anchor = "      'services/providers-service.js',\n"
          if svc_anchor in s and "services/provider-status-mutation-service.js" not in s:
              s = s.replace(svc_anchor, svc_anchor + "      'services/provider-status-mutation-service.js',\n", 1)
          test_anchor = "      'tests/unit/providers-service.test.js',\n"
          if test_anchor in s and "tests/unit/provider-status-mutation-service.test.js" not in s:
              s = s.replace(test_anchor, test_anchor + "      'tests/unit/provider-status-mutation-service.test.js',\n", 1)
          internal_anchor = "      { fn: 'updateProvider', file: 'services/providers-service.js' },\n"
          if internal_anchor in s and "setOwnedProviderStatus" not in s:
              s = s.replace(internal_anchor, internal_anchor + "      { fn: 'setOwnedProviderStatus', file: 'services/provider-status-mutation-service.js' },\n", 1)
          p.write_text(s)
          PY
      - name: Security projection
        run: node scripts/gen-security-360.js
      - name: Provider tests
        run: npx jest --runInBand tests/unit/providers-service.test.js tests/unit/provider-status-mutation-service.test.js tests/unit/market-delegation-provider-service.test.js tests/unit/market-delegation-provider-routes.test.js tests/unit/market-delegation-p0.test.js tests/unit/market-delegation-cash-control-routes.test.js
      - name: Registry checkpoint
        run: node scripts/capability-registry-check.js
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-provider-finalize.yml
          git config user.name provider-v2-bot
          git config user.email provider-v2-bot@users.noreply.github.com
          git add -A
          git commit -m "feat(provider): finaliser autonomie provider.manage"
          git push origin HEAD:feat/market-delegation-provider-v2
