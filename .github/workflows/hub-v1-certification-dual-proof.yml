name: Hub V1 — isolated transaction proofs + staging read-only inventory

on:
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: komerce-hub-v1-certification
  cancel-in-progress: false

jobs:
  isolated:
    name: PG16 — Hub transactional and negative E2E (ephemeral only)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == '[staging-op] hub-v1-certification')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-hub-v1-test-secret
      ADMIN_PASSWORD: ci-hub-v1-admin-only
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      QR_SECRET: ci-hub-v1-test-secret
      AUTHKEY_API_KEY: ci-hub-authkey-test
      PAYPAL_CLIENT_ID: ci-hub-paypal-client
      PAYPAL_CLIENT_SECRET: ci-hub-paypal-secret
      PAYPAL_WEBHOOK_ID: ci-hub-paypal-webhook
      META_WA_APP_SECRET: ci-hub-meta-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build isolated PostgreSQL from canonical staging schema
        run: |
          PGPASSWORD=komerce psql -v ON_ERROR_STOP=1 -h localhost -U komerce -d komerce_test -f docs/db/railway-live-schema.sql > /dev/null
          node scripts/ci-db-bootstrap.js
      - name: Prove E2E-HUB-V1 fixture inventory safety (pure unit)
        shell: bash
        run: node node_modules/jest/bin/jest.js tests/unit/hub-v1-fixture-dependency-inventory.test.js --runInBand --ci --forceExit
      - name: Runner verdict safety gates (pure unit)
        run: node node_modules/jest/bin/jest.js tests/unit/hub-v1-runner-evidence.test.js --runInBand --ci --forceExit
      - name: Real PG16 Hub stages (independent service suites)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/hub-v1-cert
          node scripts/run-integration-tests.js --files=tests/integration/hub-v1-atomic-checkout-payment-postgres.test.js,tests/integration/hub-v1-fixture-dependency-inventory-postgres.test.js,tests/integration/hub-v1-fixture-payment-postgres.test.js,tests/integration/hub-v1-certification-runner-postgres.test.js,tests/integration/auto-parcel-reference-postgres.test.js,tests/integration/auto-parcel-cleanup-postgres.test.js,tests/integration/hub-live-cockpit-postgres.test.js,tests/integration/hub-directrice-authorizations-postgres.test.js,tests/integration/hub-autonomous-purchasing-postgres.test.js,tests/integration/hub-p0-procurement-chain-postgres.test.js,tests/integration/hub-p0-authorization-postgres.test.js,tests/integration/hub-order-bag-ownership-postgres.test.js,tests/integration/hub-physical-hardening-postgres.test.js,tests/integration/hub-physical-identity-postgres.test.js,tests/integration/hub-physical-proof-postgres.test.js,tests/integration/hub-p0-transmission-box-shipment-postgres.test.js,tests/integration/relay-shipment-receipt-postgres.test.js,tests/integration/supplier-source-anomaly-postgres.test.js,tests/integration/supplier-source-resolution-postgres.test.js,tests/integration/hub-t8-unreconciled-arrival-postgres.test.js | tee test-results/hub-v1-cert/integration.log
      - name: E2E HTTP cross-role and local-order refusal on ephemeral PG16
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            tests/e2e-api/logistics.hub-live-cockpit-roles.e2e.test.js \
            tests/e2e-api/logistics.loop-closure.e2e.test.js \
            tests/e2e-api/logistics.order-coverage-rc2.e2e.test.js \
            tests/e2e-api/orders.local-relay-receipt.e2e.test.js
          do
            echo "── $suite ──"
            node node_modules/jest/bin/jest.js "$suite" --runInBand --ci --forceExit
          done | tee test-results/hub-v1-cert/e2e-http.log
      - name: Archive isolated transactional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-v1-isolated-pg16-${{ github.run_id }}
          path: test-results/hub-v1-cert/
          if-no-files-found: warn
          retention-days: 14

  staging-readonly:
    name: Staging — prove target and inventory without writes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == '[staging-op] hub-v1-certification')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Fail closed if staging secret missing
        run: test -n "$DATABASE_URL"
      - name: Verify actual Railway staging target by fingerprint
        run: node scripts/recette/target-guard.js
      - name: Record deployed runtime SHA
        shell: bash
        run: |
          mkdir -p test-results/hub-v1-cert
          node -e '(async()=>{const r=await fetch(process.env.STAGING_BASE_URL+"/health/version");if(!r.ok)throw Error("STAGING_SHA_NOT_AVAILABLE");const v=await r.json();const sha=String(v.commit||v.sha||"");if(!/^[a-f0-9]{40}$/i.test(sha))throw Error("INVALID_RUNTIME_SHA");require("fs").writeFileSync("test-results/hub-v1-cert/runtime-sha.txt",sha+"\n");console.log("Staging runtime:",sha.slice(0,12));})().catch(e=>{console.error(e.message);process.exit(2)})'
      - name: Supplier link audit (transaction READ ONLY)
        run: |
          node scripts/recette/audit-sku-supplier-link.js --json > test-results/hub-v1-cert/suppliers.json
          node -e 'const r=require("./test-results/hub-v1-cert/suppliers.json");console.log(JSON.stringify(r.counts,null,2))'
      - name: RCT1 fixture preflight (transaction READ ONLY)
        run: node scripts/recette/rct1-preflight.js > test-results/hub-v1-cert/rct1.json
      - name: Collect Hub PO / sac / box / shipment / relais existing evidence
        run: node scripts/recette/hub-v1-staging-cert-readonly.js
      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Hub V1 — two distinct levels of evidence'
            echo ''
            echo '- PG16 isolated: transactional tests; never a staging-write proof.'
            echo '- Railway staging: target-guard fingerprint, SQL READ ONLY inventories; never 13-stage execution.'
            echo '- Existing RCT1/AUDIT fixtures are not customer incidents and must not be automatically changed.'
            echo '- Overall GO cannot be issued without a staged 13-step transactional fixture and readback.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive read-only staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-v1-staging-readonly-${{ github.run_id }}
          path: test-results/hub-v1-cert/
          if-no-files-found: warn
          retention-days: 14
