name: Temporary AUTH-4 contract finalizer v2

on:
  push:
    branches: [auth/4-passkey-login]

permissions:
  contents: write

jobs:
  finalize-contract:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      KOMERCE_ENV: test
      JWT_SECRET: contract-introspection-only-secret-2026-08-not-runtime
      QR_SECRET: contract-introspection-qr-secret-2026-08-not-runtime
      DATABASE_URL: postgresql://contract:contract@127.0.0.1:5432/contract
      FRONTEND_URL: http://localhost:3000
      INTERNAL_API_KEY: contract-introspection-api-key
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: Komerce
      WEBAUTHN_ORIGINS: http://localhost:3000
      META_WA_APP_SECRET: contract-introspection-meta-secret
      META_WA_VERIFY_TOKEN: contract-introspection-meta-verify
      STRIPE_SECRET_KEY: sk_test_contract_introspection_only
      STRIPE_WEBHOOK_SECRET: whsec_contract_introspection_only
      PAYPAL_CLIENT_ID: contract-client-id
      PAYPAL_CLIENT_SECRET: contract-client-secret
      PAYPAL_WEBHOOK_ID: contract-webhook-id
      PAYPAL_ENV: sandbox
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: contract-token
      TWILIO_WHATSAPP_FROM: whatsapp:+14155238886
      AT_API_KEY: contract-key
      AT_USERNAME: sandbox
      CLOUDINARY_CLOUD_NAME: contract
      CLOUDINARY_API_KEY: contract
      CLOUDINARY_API_SECRET: contract
      KOMERCE_DISABLE_CRONS: 'true'
      KOMERCE_SKIP_STARTUP_MIGRATIONS: 'true'
      KOMERCE_SKIP_BOOT_ENSURE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Teach contract generator the AUTH-2 WebAuthn surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/contract-generate.js')
          text = p.read_text(encoding='utf-8')
          def r(old, new, label):
              global text
              n = text.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)
          r("  { prefix: '/api/auth/otp/verify',        method: 'post',   schema: null }, // idem\n",
            "  { prefix: '/api/auth/otp/verify',        method: 'post',   schema: null }, // idem\n"
            "  // AUTH-2/AUTH-4 — WebAuthn bodies are verified by @simplewebauthn/server, not Joi.\n"
            "  { prefix: '/api/auth/passkey/register/options', method: 'post', schema: null },\n"
            "  { prefix: '/api/auth/passkey/register/verify',  method: 'post', schema: null },\n"
            "  { prefix: '/api/auth/passkey/login/options',    method: 'post', schema: null },\n"
            "  { prefix: '/api/auth/passkey/login/verify',     method: 'post', schema: null },\n", 'route schema map')
          r("const KNOWN_RESPONSES = {\n",
            "const KNOWN_RESPONSES = {\n"
            "  // AUTH-2/AUTH-4 — WebAuthn option shapes come from services/webauthn-service.js.\n"
            "  '/api/auth/passkey/register/options': { post: { fields: ['challenge','rp','user','pubKeyCredParams','timeout','attestation','excludeCredentials','authenticatorSelection','extensions'], source: 'service-read' } },\n"
            "  '/api/auth/passkey/register/verify':  { post: { fields: ['verified'], source: 'route-read' } },\n"
            "  '/api/auth/passkey/login/options':    { post: { fields: ['challenge','timeout','rpId','allowCredentials','userVerification','extensions'], source: 'service-read' } },\n"
            "  '/api/auth/passkey/login/verify':     { post: { fields: ['verified','user'], source: 'route-read' } },\n", 'known responses')
          r("      '  - x-contract-status: \"route-read\" → champs lus directement dans le handler (res.json),',\n",
            "      '  - x-contract-status: \"route-read\" → champs lus directement dans le handler (res.json),',\n"
            "      '  - x-contract-status: \"service-read\" → forme top-level lue dans le service/lib appelée par la route,',\n", 'status docs')
          r("const RESPONSE_OVERRIDES = {\n",
            "const RESPONSE_OVERRIDES = {\n"
            "  'POST /api/auth/passkey/register/options': { '401': { description: 'Session K1 requise' }, '500': { description: 'Erreur serveur WebAuthn' } },\n"
            "  'POST /api/auth/passkey/register/verify': { '400': { description: 'Réponse WebAuthn invalide ou refusée' }, '401': { description: 'Session K1 requise' }, '500': { description: 'Erreur serveur WebAuthn' } },\n"
            "  'POST /api/auth/passkey/login/options': { '500': { description: 'Erreur serveur WebAuthn' } },\n"
            "  'POST /api/auth/passkey/login/verify': { '400': { description: 'Réponse WebAuthn invalide' }, '401': { description: 'Passkey inconnue, révoquée ou refusée' }, '500': { description: 'Erreur serveur WebAuthn' } },\n", 'response overrides')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary helper from intended final tree
        run: rm .github/workflows/tmp-auth4-contract-finalize-v2.yml
      - run: npm ci
      - name: Generate contract and assert Passkey coverage
        run: |
          node scripts/contract-generate.js
          node scripts/contract-check.js
          node - <<'NODE'
          const spec = require('./docs/contract/openapi.json');
          for (const p of ['/api/auth/passkey/register/options','/api/auth/passkey/register/verify','/api/auth/passkey/login/options','/api/auth/passkey/login/verify']) {
            const op = spec.paths?.[p]?.post;
            if (!op) throw new Error(`missing ${p}`);
            const st = op.responses?.['200']?.content?.['application/json']?.schema?.['x-contract-status'];
            if (!st || st === 'UNKNOWN') throw new Error(`uncovered ${p}: ${st}`);
          }
          NODE
      - name: Backend Passkey regression
        run: npx jest tests/unit/auth-passkey.test.js --runInBand
      - run: npm --prefix public/boutique ci
      - name: AUTH-3/AUTH-4 Boutique regression
        working-directory: public/boutique
        run: npx jest tests/unit/b-passkey-login.test.js tests/unit/b-identity-passkey.test.js tests/unit/b-passkey-enrollment.test.js --runInBand
      - name: Refresh governance projections
        run: |
          node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique
          node scripts/gen-gate-findings.js
          node scripts/gen-feature-360.js
      - name: Verify final tree
        run: |
          node scripts/feature-guard.js --strict
          node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique
          node scripts/feature-360-check.js
          node scripts/contract-check.js
          git diff --check
      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/contract-generate.js docs/contract/openapi.json docs/contract/DEBT.md
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md docs/GATE_FINDINGS.json docs/FEATURE_360.json docs/FEATURE_360.md
          git add -u .github/workflows/tmp-auth4-contract-finalize-v2.yml
          git commit -m "fix(auth): close Passkey API contract surface"
          git push origin HEAD:auth/4-passkey-login
