name: Finalize 1548

on:
  push:
    branches:
      - fix/test-pyramid-from-scratch-governance

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-test-jwt-secret
      ADMIN_PASSWORD: ci-test-admin-password
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-test-authkey
      PAYPAL_CLIENT_ID: ci-test-paypal-client
      PAYPAL_CLIENT_SECRET: ci-test-paypal-secret
      PAYPAL_WEBHOOK_ID: ci-test-paypal-webhook
      META_WA_APP_SECRET: ci-test-meta-secret
      KOMERCE_DISABLE_CRONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-pyramid-from-scratch-governance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Patch proven production and E2E drifts
        run: |
          node <<'NODE'
          const fs = require('fs');

          function patch(file, before, after, label) {
            let src = fs.readFileSync(file, 'utf8');
            if (!src.includes(before)) {
              if (src.includes(after)) return;
              throw new Error(`${label}: expected source fragment not found in ${file}`);
            }
            src = src.replace(before, after);
            fs.writeFileSync(file, src);
          }

          // Real production bug exposed by G5: updateProduct reloaded too few fields
          // before the publication guard, making a valid description look missing.
          patch(
            'services/product-admin-service.js',
            "'SELECT id, name, category, subcategory, price_kmf, stock, is_active, is_available, content_source, lifecycle_status FROM products WHERE id = $1'",
            "'SELECT id, name, description, category, subcategory, price_kmf, stock, is_active, is_available, content_source, source_locale, lifecycle_status FROM products WHERE id = $1'",
            'product publication reload'
          );

          // Routing is fail-closed: order E2Es must seed the canonical relay island.
          for (const file of [
            'tests/e2e-api/inventory.stock-never-negative.e2e.test.js',
            'tests/e2e-api/orders.cancellation-doctrine.e2e.test.js',
            'tests/e2e-api/orders.checkout-payment-cycle.e2e.test.js',
            'tests/e2e-api/refunds.no-double-application.e2e.test.js',
          ]) {
            patch(file, 'address, market_id)', 'address, island_code, market_id)', 'relay island column');
            patch(
              file,
              "'Moroni Test', (SELECT id FROM markets WHERE code = 'KM'))",
              "'Moroni Test', 'MORONI', (SELECT id FROM markets WHERE code = 'KM'))",
              'relay island value'
            );
          }

          // Market resolved at checkout => only a LOCAL_ACTIVE decision is buyer-effective.
          // These legacy E2Es exercise order/inventory/refund semantics, so seed the
          // market decision explicitly instead of relying on products.price_kmf.
          patch(
            'tests/e2e-api/inventory.stock-never-negative.e2e.test.js',
            "    await db.query(\n      `INSERT INTO products (id, name, price_kmf, stock) VALUES ($1, $2, 25000, $3)`,\n      [id, `E2E Stock ${tag(label)}`, stock]\n    );\n    return id;",
            "    await db.query(\n      `INSERT INTO products (id, name, price_kmf, stock) VALUES ($1, $2, 25000, $3)`,\n      [id, `E2E Stock ${tag(label)}`, stock]\n    );\n    await db.query(\n      `INSERT INTO product_market_price_drafts\n         (market_id, product_id, amount, currency, status, reason, authorized_at, authorization_snapshot, active_at)\n       SELECT id, $1, 25000, 'KMF', 'LOCAL_ACTIVE', 'E2E KM active price', NOW(), '{\"e2e\":true}'::jsonb, NOW()\n         FROM markets WHERE code = 'KM'`,\n      [id]\n    );\n    return id;",
            'inventory LOCAL_ACTIVE price'
          );
          patch(
            'tests/e2e-api/orders.cancellation-doctrine.e2e.test.js',
            "    await db.query(\n      'INSERT INTO products (id, name, price_kmf, stock) VALUES ($1, $2, $3, 30)',\n      [id, `E2E Orders ${tag(label)}`, priceKmf]\n    );\n    return id;",
            "    await db.query(\n      'INSERT INTO products (id, name, price_kmf, stock) VALUES ($1, $2, $3, 30)',\n      [id, `E2E Orders ${tag(label)}`, priceKmf]\n    );\n    await db.query(\n      `INSERT INTO product_market_price_drafts\n         (market_id, product_id, amount, currency, status, reason, authorized_at, authorization_snapshot, active_at)\n       SELECT id, $1, $2, 'KMF', 'LOCAL_ACTIVE', 'E2E KM active price', NOW(), '{\"e2e\":true}'::jsonb, NOW()\n         FROM markets WHERE code = 'KM'`,\n      [id, priceKmf]\n    );\n    return id;",
            'orders doctrine LOCAL_ACTIVE price'
          );
          patch(
            'tests/e2e-api/orders.checkout-payment-cycle.e2e.test.js',
            "    await db.query(\n      `INSERT INTO products (id, name, price_kmf, stock)\n       VALUES ($1, $2, 25000, 50)`,\n      [productId, `E2E Produit ${tag('sku')}`]\n    );\n    cleanup.track('products', 'id', productId);",
            "    await db.query(\n      `INSERT INTO products (id, name, price_kmf, stock)\n       VALUES ($1, $2, 25000, 50)`,\n      [productId, `E2E Produit ${tag('sku')}`]\n    );\n    await db.query(\n      `INSERT INTO product_market_price_drafts\n         (market_id, product_id, amount, currency, status, reason, authorized_at, authorization_snapshot, active_at)\n       SELECT id, $1, 25000, 'KMF', 'LOCAL_ACTIVE', 'E2E KM active price', NOW(), '{\"e2e\":true}'::jsonb, NOW()\n         FROM markets WHERE code = 'KM'`,\n      [productId]\n    );\n    cleanup.track('products', 'id', productId);",
            'checkout LOCAL_ACTIVE price'
          );
          patch(
            'tests/e2e-api/refunds.no-double-application.e2e.test.js',
            "    await db.query(\n      `INSERT INTO products (id, name, price_kmf, stock) VALUES ($1, $2, 25000, 20)`,\n      [id, `E2E Refund ${tag(label)}`]\n    );\n    return id;",
            "    await db.query(\n      `INSERT INTO products (id, name, price_kmf, stock) VALUES ($1, $2, 25000, 20)`,\n      [id, `E2E Refund ${tag(label)}`]\n    );\n    await db.query(\n      `INSERT INTO product_market_price_drafts\n         (market_id, product_id, amount, currency, status, reason, authorized_at, authorization_snapshot, active_at)\n       SELECT id, $1, 25000, 'KMF', 'LOCAL_ACTIVE', 'E2E KM active price', NOW(), '{\"e2e\":true}'::jsonb, NOW()\n         FROM markets WHERE code = 'KM'`,\n      [id]\n    );\n    return id;",
            'refund LOCAL_ACTIVE price'
          );

          // Legacy viewer projection now requires the complete read baseline.
          patch(
            'tests/helpers/marketDelegationE2EKit.js',
            "  'market_config.read',\n  'finance.read',",
            "  'market_config.read',\n  'catalog.read',\n  'finance.read',",
            'market viewer catalog baseline'
          );

          // Arithmetic typo: 1000.25 + 500.10 + 400.75 + 300.33 + 200.05 = 2401.48.
          patch(
            'tests/e2e-api/invoices-finance-config.kmf-numeric.e2e.test.js',
            'expect(sumFixed).toBeCloseTo(2401.38, 5);',
            'expect(sumFixed).toBeCloseTo(2401.48, 5);',
            'finance fixed-cost sum'
          );

          // Preserve the semantic notification assertion without coupling to old grammar.
          patch(
            'tests/e2e-api/auth-identity.pickup-authorization-staging.e2e.test.js',
            "expect.stringContaining('a été remis')",
            "expect.stringContaining('retrait exceptionnel autorisé')",
            'exceptional pickup notification matcher'
          );

          // Normal AVAILABLE pickup is now one-shot by code. Exercise that secure path
          // instead of the intentionally forbidden orderId-only legacy path.
          const collectFile = 'tests/e2e-api/orders.single-collect.e2e.test.js';
          patch(
            collectFile,
            "const { signAuthToken } = require('../../utils/auth-session');",
            "const { signAuthToken } = require('../../utils/auth-session');\nconst { generateAndStoreSecret } = require('../../services/pickup-secret-service');",
            'single collect secret issuer import'
          );
          patch(
            collectFile,
            "    return orderId;\n  }\n\n  function collect(orderId, name) {",
            "    const generated = await generateAndStoreSecret({\n      orderId,\n      relaisId,\n      channel: 'cash_relais',\n    });\n    return { orderId, code: generated.code };\n  }\n\n  function collect(orderId, name, code) {",
            'single collect seeded secret'
          );
          patch(
            collectFile,
            ".send({ collected_by_name: name });",
            ".send({ collected_by_name: name, pickup_code: code });",
            'single collect request code'
          );
          patch(
            collectFile,
            "    const orderId = await seedOrder('nominal');\n\n    const res = await collect(orderId, 'Client Nominal');",
            "    const { orderId, code } = await seedOrder('nominal');\n\n    const res = await collect(orderId, 'Client Nominal', code);",
            'single collect nominal'
          );
          patch(
            collectFile,
            "    const orderId = await seedOrder('race');\n    const N = 5;",
            "    const { orderId, code } = await seedOrder('race');\n    const N = 5;",
            'single collect race seed'
          );
          patch(
            collectFile,
            "Array.from({ length: N }, (_, i) => collect(orderId, `Concurrent ${i}`))",
            "Array.from({ length: N }, (_, i) => collect(orderId, `Concurrent ${i}`, code))",
            'single collect race code'
          );
          patch(
            collectFile,
            "    // intelligible (409, avec un message d'erreur exploitable).",
            "    // intelligible (404 après consommation one-shot, sans fuite d'état).",
            'single collect one-shot comment'
          );
          patch(
            collectFile,
            '      expect(f.status).toBe(409);',
            '      expect(f.status).toBe(404);',
            'single collect one-shot status'
          );
          patch(
            collectFile,
            "    cleanup.trackSql(`DELETE FROM orders WHERE relais_id = $1`, [relaisId]);",
            "    cleanup.trackSql(`DELETE FROM orders WHERE relais_id = $1`, [relaisId]);\n    cleanup.trackSql(`DELETE FROM alerts WHERE entity_type = 'order' AND entity_id IN (SELECT id::text FROM orders WHERE relais_id = $1)`, [relaisId]);",
            'single collect security alert cleanup'
          );
          NODE
      - name: Rebuild PostgreSQL from canonical schema-only snapshot
        run: |
          PGPASSWORD=komerce psql -h localhost -U komerce -d komerce_test -f docs/db/railway-live-schema.sql
          node scripts/ci-db-bootstrap.js
      - name: Prove final G5 residue
        run: npx jest tests/integration/sourcing-flow-g5.test.js --runInBand --forceExit
      - name: Prove known E2E residues
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            tests/e2e-api/auth-identity.pickup-authorization-staging.e2e.test.js \
            tests/e2e-api/inventory.stock-never-negative.e2e.test.js \
            tests/e2e-api/invoices-finance-config.kmf-numeric.e2e.test.js \
            tests/e2e-api/market-delegation.dashboard-reads.e2e.test.js \
            tests/e2e-api/market-delegation.operations-read.e2e.test.js \
            tests/e2e-api/market-delegation.pricing.e2e.test.js \
            tests/e2e-api/orders.cancellation-doctrine.e2e.test.js \
            tests/e2e-api/orders.checkout-payment-cycle.e2e.test.js \
            tests/e2e-api/orders.single-collect.e2e.test.js \
            tests/e2e-api/refunds.no-double-application.e2e.test.js
          do
            node node_modules/jest/bin/jest.js "$file" --ci --runInBand
          done
      - name: Full integration DB proofs
        run: npm run test:integration
      - name: Feature-first E2E API proofs
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e:features 2>&1 | tee e2e.log
      - name: Upload E2E diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug-1548
          path: e2e.log
          if-no-files-found: warn
      - name: Commit proven fix and remove temporary workflows
        run: |
          git rm .github/workflows/debug-integration-1548.yml .github/workflows/finalize-1548.yml
          git add \
            services/product-admin-service.js \
            tests/helpers/marketDelegationE2EKit.js \
            tests/e2e-api/auth-identity.pickup-authorization-staging.e2e.test.js \
            tests/e2e-api/inventory.stock-never-negative.e2e.test.js \
            tests/e2e-api/invoices-finance-config.kmf-numeric.e2e.test.js \
            tests/e2e-api/orders.cancellation-doctrine.e2e.test.js \
            tests/e2e-api/orders.checkout-payment-cycle.e2e.test.js \
            tests/e2e-api/orders.single-collect.e2e.test.js \
            tests/e2e-api/refunds.no-double-application.e2e.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): close from-scratch integration and E2E drift"
          git push origin HEAD:fix/test-pyramid-from-scratch-governance
