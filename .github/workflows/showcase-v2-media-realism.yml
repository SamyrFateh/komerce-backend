name: Showcase V2 media realism

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'pilot = 21 héros, all = 500 héros'
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - all
      quality:
        description: 'GPT Image rendering quality'
        required: true
        default: medium
        type: choice
        options:
          - low
          - medium
          - high
      confirm_all:
        description: 'Pour all uniquement: GENERATE-500'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: showcase-v2-media-realism
  cancel-in-progress: false

jobs:
  generate-realistic-heroes:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require media realism secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY missing'; exit 1; }
          test -n "$IMAGEKIT_PRIVATE_KEY" || { echo 'IMAGEKIT_PRIVATE_KEY missing'; exit 1; }

      - name: Materialize bounded generation plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/showcase-v2-media-realism.js \
            --scope '${{ inputs.scope }}' \
            --quality '${{ inputs.quality }}' \
            --output artifacts/showcase-v2-media-realism-plan.json

      - name: Generate and overwrite ImageKit heroes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/showcase-v2-media-realism.js \
            --apply \
            --scope '${{ inputs.scope }}' \
            --quality '${{ inputs.quality }}' \
            --concurrency 2 \
            --confirm-all '${{ inputs.confirm_all }}' \
            --output artifacts/showcase-v2-media-realism-report.json

      - name: Upload media realism evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-v2-media-realism-${{ inputs.scope }}
          path: artifacts/showcase-v2-media-realism-*.json
          if-no-files-found: warn
          retention-days: 14
