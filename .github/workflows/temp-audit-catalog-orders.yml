name: Temporary audit catalog orders seam

on:
  push:
    branches:
      - governance/catalog-orders-boundary

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest ownership of favorite consumers
        run: |
          echo '=== manifest references ==='
          git grep -nE "b-modal-core\.js|boutique\.js|b-catalog\.js|b-subcat\.js|render-product-card\.js|b-modal-buybox-shared\.js" -- public/boutique/features features capabilities || true
          echo '=== graph file owner references ==='
          node - <<'NODE'
          const graph = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const targets = new Set([
            'public/boutique/js/b-modal-core.js',
            'public/boutique/js/boutique.js',
            'public/boutique/js/b-catalog.js',
            'public/boutique/js/b-subcat.js',
            'public/boutique/js/render/render-product-card.js',
            'public/boutique/js/b-modal-buybox-shared.js',
          ]);
          const seen = new Set();
          function walk(v, path='$') {
            if (!v || typeof v !== 'object' || seen.has(v)) return;
            seen.add(v);
            const txt = JSON.stringify(v);
            if ([...targets].some(t => txt.includes(t)) && txt.length < 5000) {
              console.log('\n' + path + '\n' + JSON.stringify(v, null, 2));
            }
            if (Array.isArray(v)) v.forEach((x,i)=>walk(x,`${path}[${i}]`));
            else Object.entries(v).forEach(([k,x])=>walk(x,`${path}.${k}`));
          }
          walk(graph);
          NODE
