name: Temporary audit catalog orders seam

on:
  push:
    branches:
      - governance/catalog-orders-boundary

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit favorites ownership and tests
        run: |
          echo '=== runtime favorite symbol references ==='
          git grep -nE '\b(isFav|saveFavs|toggleFav)\b' -- public/boutique/js || true
          echo '=== test favorite symbol references ==='
          git grep -nE '\b(isFav|saveFavs|toggleFav)\b' -- public/boutique/tests || true
          echo '=== b-cart favorite test neighborhoods ==='
          grep -n -B4 -A25 -E 'toggleFav|favori' public/boutique/tests/unit/b-cart.test.js || true
