name: Staging AliExpress manual catalog pilot

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: komerce-staging-aliexpress-manual-catalog-pilot
  cancel-in-progress: false

jobs:
  prepare:
    name: AliExpress catalog — manual preparation pilot
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[staging-op] aliexpress-catalog-manual-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}

    steps:
      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Apply canonical traced manual overrides
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo '::error::RAILWAY_DATABASE_URL manquant'; exit 1; }
          node <<'NODE'
          const db = require('./db');
          const { upsertOverrides } = require('./services/catalog-overrides');

          const entries = [
            {
              ref: 'KPR-131413',
              fields: {
                name: 'Écouteurs Bluetooth X15 avec micro et affichage LED',
                description: 'Écouteurs sans fil Bluetooth 5.3 avec microphone, faible latence annoncée de 65 ms et boîtier de charge à affichage LED. Portée annoncée jusqu’à 10 m et autonomie d’environ 2 à 3 heures selon la fiche fournisseur.',
                category: 'Tech',
              },
            },
            {
              ref: 'KPR-131414',
              fields: {
                name: 'Câble USB-C coudé 6 A pour charge rapide – 3 m ou 5 m',
                description: 'Câble USB-C coudé conçu pour la charge rapide, proposé en longueurs 3 m et 5 m. Compatible selon la fiche fournisseur avec des appareils Samsung, Huawei, Xiaomi, Oppo et OnePlus, ainsi qu’avec certains usages VR ou caméra.',
                category: 'Tech',
              },
            },
            {
              ref: 'KPR-131415',
              fields: {
                name: 'Soin contour des yeux Celimax Vita A au rétinal – 15 ml',
                description: 'Soin contour des yeux Celimax Vita A au rétinal, format 15 ml. La fiche fournisseur le présente comme un soin ciblant les ridules et la fermeté, avec une formule destinée aux soins du visage.',
                category: 'Mode & Beauté',
              },
            },
            {
              ref: 'KPR-131416',
              fields: {
                name: 'Lampe torche LED rechargeable USB avec zoom et indicateur',
                description: 'Lampe torche LED rechargeable par USB, avec zoom télescopique, indicateur de charge et plusieurs modes d’éclairage. Corps en ABS et batterie lithium intégrée selon la fiche fournisseur ; câble USB inclus.',
                category: 'Bricolage',
              },
            },
            {
              ref: 'KPR-131417',
              fields: {
                name: 'Mini trépied flexible pour smartphone avec pince',
                description: 'Mini trépied flexible pour smartphone avec pince, compatible avec les fixations appareil photo 1/4-20. La fiche fournisseur indique une largeur de téléphone d’environ 5,5 à 8,5 cm et une charge maximale de 275 g.',
                category: 'Tech',
              },
            },
          ];

          (async () => {
            for (const entry of entries) {
              const { rows: [product] } = await db.query(
                `SELECT id, product_ref, lifecycle_status, is_active, content_source
                   FROM products WHERE product_ref = $1`,
                [entry.ref]
              );
              if (!product) throw new Error(`${entry.ref}: produit introuvable`);
              if (product.lifecycle_status !== 'candidate' || product.is_active !== false || product.content_source !== 'connector_raw') {
                throw new Error(`${entry.ref}: état inattendu avant préparation`);
              }
              const result = await db.withTransaction(async tx => upsertOverrides(
                tx,
                product.id,
                entry.fields,
                { reason: 'AliExpress historical catalog pilot — manual FR preparation after SOI proof', setBy: null }
              ));
              console.log(`${entry.ref}: overrides=${result.overridden.join(',')} content_source=${result.product.content_source}`);
            }
          })().catch(err => { console.error(err); process.exitCode = 1; }).finally(() => db.pool.end());
          NODE

      - name: Audit publication readiness of exact five
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const db = require('./db');
          const { validatePublicationUpdate } = require('./services/product-publication-guard');
          const expected = new Map([
            ['KPR-131413', 'Tech'],
            ['KPR-131414', 'Tech'],
            ['KPR-131415', 'Mode & Beauté'],
            ['KPR-131416', 'Bricolage'],
            ['KPR-131417', 'Tech'],
          ]);
          const refs = [...expected.keys()];

          (async () => {
            const { rows } = await db.query(`
              SELECT p.*,
                     COUNT(DISTINCT cm.id) FILTER (WHERE cm.is_active = TRUE)::int AS active_media,
                     COUNT(DISTINCT ps.id) FILTER (WHERE ps.is_active = TRUE)::int AS active_skus,
                     COUNT(DISTINCT ps.id) FILTER (
                       WHERE ps.is_active = TRUE
                         AND ps.supplier_unit_ref IS NOT NULL
                         AND ps.supplier_order_identity IS NOT NULL
                     )::int AS soi_complete_skus
                FROM products p
                LEFT JOIN catalog_media cm ON cm.product_id = p.id
                LEFT JOIN product_skus ps ON ps.product_id = p.id
               WHERE p.product_ref = ANY($1::text[])
               GROUP BY p.id
               ORDER BY p.product_ref`, [refs]);

            console.log(JSON.stringify(rows.map(r => ({
              product_ref: r.product_ref,
              name: r.name,
              description: r.description,
              category: r.category,
              price_kmf: r.price_kmf,
              stock: r.stock,
              content_source: r.content_source,
              needs_review: r.needs_review,
              lifecycle_status: r.lifecycle_status,
              is_active: r.is_active,
              active_media: r.active_media,
              active_skus: r.active_skus,
              soi_complete_skus: r.soi_complete_skus,
            })), null, 2));

            const failures = [];
            for (const row of rows) {
              if (row.content_source !== 'manual') failures.push(`${row.product_ref}: content_source=${row.content_source}`);
              if (row.needs_review !== false) failures.push(`${row.product_ref}: needs_review=${row.needs_review}`);
              if (row.category !== expected.get(row.product_ref)) failures.push(`${row.product_ref}: category=${row.category}`);
              if (Number(row.active_media) < 1) failures.push(`${row.product_ref}: no active media`);
              if (Number(row.active_skus) < 1 || Number(row.active_skus) !== Number(row.soi_complete_skus)) {
                failures.push(`${row.product_ref}: SOI ${row.soi_complete_skus}/${row.active_skus}`);
              }
              const check = validatePublicationUpdate({
                before: row,
                patch: { is_active: true },
                context: { catalogMediaCount: Number(row.active_media) },
              });
              if (!check.ok) failures.push(`${row.product_ref}: publication guard ${check.code} — ${check.error}`);
            }
            if (rows.length !== refs.length) failures.push(`rows=${rows.length}/${refs.length}`);
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exitCode = 1;
            }
          })().catch(err => { console.error(err); process.exitCode = 1; }).finally(() => db.pool.end());
          NODE

      - name: Close successful command issue
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'Manual FR preparation completed for KPR-131413 → KPR-131417. All five passed publication guard and retained complete SOI coverage.'
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
