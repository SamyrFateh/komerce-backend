name: Jest Upgrade Diagnostic

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Upgrade Jest in isolated checkout
        run: npm install --save-dev jest@30.4.2
      - name: Audit upgraded tree
        run: |
          set -o pipefail
          npm run audit:gate 2>&1 | tee jest-upgrade-audit.log
      - name: Run unit suite on Jest 30
        run: |
          set -o pipefail
          npx jest --testPathPatterns="tests/unit" --ci --runInBand --testPathIgnorePatterns="tests/integration" --coverage 2>&1 | tee jest-upgrade-tests.log
      - name: Upload upgrade candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-upgrade-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
            jest-upgrade-audit.log
            jest-upgrade-tests.log
          retention-days: 1
      - name: Publish upgrade status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = "success" ]; then state=success; fi
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"jest-upgrade-diagnostic\",\"description\":\"Jest 30 audit and unit validation complete\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
