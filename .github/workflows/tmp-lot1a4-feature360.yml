name: TMP LOT 1A-4 Feature 360 refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/lot1a-4-economic-variables'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate Feature 360 officially
        run: npm run feature:360:gen
      - name: Verify Feature 360 freshness
        run: node scripts/feature-360-check.js
      - name: Diff integrity
        run: git diff --check
      - name: Commit Feature 360 projections only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_360.json docs/FEATURE_360.md
          if git diff --cached --quiet; then
            echo "Feature 360 already fresh"
            exit 0
          fi
          git commit -m "chore(governance): refresh Feature 360 for LOT 1A-4"
          git push origin HEAD:${GITHUB_HEAD_REF}
