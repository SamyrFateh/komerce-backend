name: Temporary Pricing Market Decision UI

on:
  push:
    branches:
      - feat/pricing-market-decision-ui

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ${{ github.sha }}
      META_WA_APP_SECRET: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pricing-market-decision-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: python scripts/tmp-pricing-market-decision-ui.py
      - run: npx jest tests/unit/canonical-pricing-workspace-boundary.test.js tests/unit/pricing-workspace-presentation.test.js --runInBand

      - name: Commit market decision UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dashboards/canonical/js/pricing-workspace.js public/dashboards/canonical/js/pricing-workspace-presentation.js public/dashboards/canonical/css/pricing-workspace.css public/dashboards/canonical/index.html tests/unit/canonical-pricing-workspace-boundary.test.js
          git commit -m "feat(pricing): surface market decision in canonical workspace"
          git push origin HEAD:feat/pricing-market-decision-ui
