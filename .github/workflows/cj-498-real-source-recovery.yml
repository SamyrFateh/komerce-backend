name: CJ real 498 — recover missing identities from provider read-only
on:
  pull_request:
    paths:
      - 'scripts/cj-498-real-cohort-recover.js'
      - '.github/workflows/cj-498-real-source-recovery.yml'
permissions:
  contents: read
  actions: read
jobs:
  capture-real-source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GITHUB_ACTIONS: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      CJ_ACCESS_TOKEN: ${{ secrets.KOMERCE_CJ_PROOF_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify read-only isolated recovery script
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CJ_ACCESS_TOKEN:-}"
          node --check scripts/cj-498-real-cohort-recover.js
      - name: Fetch the real 496 source corpus with pinned origin hash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh run download 40518230098 -R "$GITHUB_REPOSITORY" -n cj-balanced-e2e-500 -D baseline
          echo '18a93c7dc27cc2074df21f313ec0a1982836bfa664381c20a9b29a5e68598b0f  baseline/classification-evidence.json' | sha256sum -c -
      - name: Recover exactly 2 genuine CJ supplier identities (source-read only)
        run: node scripts/cj-498-real-cohort-recover.js
      - name: Preserve authentic 498 source corpus, including provider observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-real-498-source-${{ github.run_id }}
          path: artifacts/cj-real-498/classification-evidence.json
          if-no-files-found: warn
          retention-days: 30
