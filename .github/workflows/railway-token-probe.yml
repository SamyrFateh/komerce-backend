name: Railway staging token probe

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  railway-token-probe:
    name: Railway staging — token identity probe
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       github.event.issue.title == '[staging-op] railway-token-probe')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      EXPECTED_PROJECT_ID: '1c5c37ab-557b-41b1-885a-8b3ead573795'
      EXPECTED_ENVIRONMENT_ID: '7a0ce7dc-93a0-4bfa-88c9-088f70e8883a'

    steps:
      - name: Require Railway project token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo '::error::RAILWAY_TOKEN manque dans les secrets GitHub'
            exit 1
          fi

      - name: Resolve Railway project-token identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/railway-project-token.json"
          http_code="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary '{"query":"query { projectToken { projectId environmentId } }"}')"

          if [ "$http_code" != '200' ]; then
            echo "::error::Railway API HTTP $http_code"
            jq -c '.errors // [] | map({message})' "$response" 2>/dev/null || true
            exit 1
          fi

          if jq -e '.errors and (.errors | length > 0)' "$response" >/dev/null; then
            echo '::error::Railway API a refusé le project token'
            jq -c '.errors | map({message})' "$response"
            exit 1
          fi

          project_id="$(jq -r '.data.projectToken.projectId // empty' "$response")"
          environment_id="$(jq -r '.data.projectToken.environmentId // empty' "$response")"

          if [ -z "$project_id" ] || [ -z "$environment_id" ]; then
            echo '::error::Identité project token absente dans la réponse Railway'
            exit 1
          fi

          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "environment_id=$environment_id" >> "$GITHUB_OUTPUT"
          echo "Railway project token authenticated."
          echo "Project: $project_id"
          echo "Environment: $environment_id"

          if [ "$project_id" != "$EXPECTED_PROJECT_ID" ]; then
            echo "::error::Le token cible un autre projet Railway"
            exit 1
          fi
          if [ "$environment_id" != "$EXPECTED_ENVIRONMENT_ID" ]; then
            echo "::error::Le token cible un autre environnement Railway"
            exit 1
          fi

          echo 'railway_token_scope=expected-staging' >> "$GITHUB_OUTPUT"

      - name: Write safe summary
        if: always()
        shell: bash
        env:
          PROJECT_ID: ${{ steps.identity.outputs.project_id }}
          ENVIRONMENT_ID: ${{ steps.identity.outputs.environment_id }}
          TOKEN_SCOPE: ${{ steps.identity.outputs.railway_token_scope }}
        run: |
          {
            echo '## Railway staging token probe'
            echo
            echo "- project: ${PROJECT_ID:-unresolved}"
            echo "- environment: ${ENVIRONMENT_ID:-unresolved}"
            echo "- expected staging scope: ${TOKEN_SCOPE:-not-proven}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close successful command issue
        if: success() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body 'Railway project token authenticated and scoped to the expected Komerce staging environment.'
          gh issue close "$ISSUE_NUMBER" --reason completed
