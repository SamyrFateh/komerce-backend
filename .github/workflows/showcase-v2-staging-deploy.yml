name: Deploy staging showcase V2 refinery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de campagne : resume économise les étapes déjà prouvées ; fresh certifie depuis zéro'
        required: true
        type: choice
        default: resume
        options:
          - resume
          - fresh
  push:
    paths:
      - 'scripts/showcase-v2-plan.js'
      - 'scripts/showcase-v2-source-build.js'
      - 'scripts/showcase-v2-seed.js'
      - 'scripts/showcase-v2-reset.js'
      - 'scripts/showcase-media-mirror.js'
      - 'scripts/showcase-media-provider.js'
      - 'scripts/showcase-media-audit.js'
      - 'services/catalog-eligibility.js'
      - 'services/catalog-enrichment.js'
      - 'services/prompts/catalog-enrichment.prompt.js'
      - 'services/product-publication-guard.js'
      - 'services/suppliers/catalog-import-orchestrator.js'
      - 'tests/unit/catalog-eligibility.test.js'
      - 'tests/unit/catalog-import-eligibility-evidence.test.js'
      - 'tests/unit/catalog-enrichment.test.js'
      - 'tests/unit/catalog-enrichment-editorial-invariants.test.js'
      - 'tests/unit/product-publication-guard.test.js'
      - 'tests/unit/showcase-v2-plan.test.js'
      - 'tests/unit/showcase-v2-source-build.test.js'
      - 'tests/unit/showcase-v2-reset.test.js'
      - 'tests/unit/showcase-media-mirror.test.js'
      - 'tests/unit/showcase-media-provider.test.js'
      - '.github/workflows/showcase-v2-staging-deploy.yml'

permissions:
  contents: read

env:
  KOMERCE_ALLOW_SHOWCASE_SEED: '1'

jobs:
  preflight:
    name: V2 contract, French editorial and refinery preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check V2 runtime scripts
        run: |
          node --check scripts/showcase-v2-seed.js
          node --check scripts/showcase-v2-source-build.js
          node --check scripts/showcase-media-mirror.js
          node --check scripts/showcase-media-provider.js
          node --check scripts/showcase-media-audit.js
          node --check services/catalog-enrichment.js

      - name: V2 plan, refinery, editorial, source resilience and media-provider tests
        run: |
          npx jest \
            tests/unit/catalog-eligibility.test.js \
            tests/unit/catalog-import-eligibility-evidence.test.js \
            tests/unit/catalog-enrichment.test.js \
            tests/unit/catalog-enrichment-editorial-invariants.test.js \
            tests/unit/product-publication-guard.test.js \
            tests/unit/showcase-v2-plan.test.js \
            tests/unit/showcase-v2-source-build.test.js \
            tests/unit/showcase-v2-reset.test.js \
            tests/unit/showcase-media-mirror.test.js \
            tests/unit/showcase-media-provider.test.js \
            --runInBand

      - name: Prove 500 normalized V2 contracts and source lineage without network
        run: |
          node - <<'NODE'
          const { buildSlots, buildV2Contract, summary } = require('./scripts/showcase-v2-plan');
          const manualConnector = require('./services/suppliers/connectors/manual-connector');
          const { buildNormalizedSourceContractSnapshot } = require('./services/suppliers/normalized-product');
          const { validateForPromotion } = require('./services/catalog-promotion');

          const slots = buildSlots();
          const sourceProducts = slots.map((slot, index) => ({
            name: `Showcase V2 preflight ${index + 1}`,
            source_title: `Supplier object ${index + 1}`,
            source_description: `Original supplier description ${index + 1}`,
            description: 'Produit fournisseur synthétique réservé au préflight contractuel Komerce.',
            price_kmf: 10000 + index * 50,
            stock: 10,
            image_url: `https://example.test/showcase-v2/${slot.product_ref}/hero.jpg`,
            images: [`https://example.test/showcase-v2/${slot.product_ref}/hero.jpg`],
            source: `preflight:${slot.product_ref}`,
            source_url: `https://example.test/source/${slot.product_ref}`,
            source_locale: 'en',
          }));
          const items = sourceProducts.map((product, index) => {
            const slot = slots[index];
            const contract = buildV2Contract(product, slot);
            return {
              ...contract,
              supplier_name: 'Komerce Showcase V2',
              supplier_product_id: slot.product_ref,
              raw_payload: {
                ...(contract.raw_payload || {}),
                source_title: product.source_title,
                source_description: product.source_description,
                source_locale: product.source_locale,
              },
            };
          });
          if (items.some((item) => !item.raw_payload?.source_title || item.raw_payload?.source_locale !== 'en')) process.exit(1);

          const connector = manualConnector.fetchProducts({ supplier_name: 'Komerce Showcase V2', items });
          if (connector.products.length !== 500 || connector.invalid.length !== 0) {
            console.error(JSON.stringify({ valid: connector.products.length, invalid: connector.invalid.slice(0, 10) }, null, 2));
            process.exit(1);
          }
          const snapshots = connector.products.map(buildNormalizedSourceContractSnapshot);
          snapshots.forEach(validateForPromotion);
          const richSnapshots = snapshots.filter((row) => Array.isArray(row.sellable_units) && row.sellable_units.length > 0).length;
          const proof = { ...summary(), normalized_v2: snapshots.length, rich_snapshots: richSnapshots, raw_source_titles: items.filter((x) => x.raw_payload?.source_title).length };
          console.log(JSON.stringify(proof, null, 2));
          if (proof.products !== 500 || proof.rich_products !== 350 || proof.rich_snapshots !== 350 || proof.subcategories.length !== 21 || proof.raw_source_titles !== 500) process.exit(1);
          NODE

  build-media:
    name: Prepare 500 V2 products for resume or fresh certification
    needs: preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHOWCASE_MEDIA_PROVIDER: imagekit
      IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CATALOG_ENRICH_PROVIDER: openai
      CATALOG_ENRICH_MODEL: gpt-5.6-luna
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require staging secrets for selected mode
        shell: bash
        env:
          SHOWCASE_RUN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          for var in DATABASE_URL OPENAI_API_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var manquant dans les secrets GitHub"
              exit 1
            fi
          done
          if [ "$SHOWCASE_RUN_MODE" = "fresh" ] && [ -z "${IMAGEKIT_PRIVATE_KEY:-}" ]; then
            echo "::error::IMAGEKIT_PRIVATE_KEY manquant pour une certification fresh"
            exit 1
          fi

      - name: Fresh reset SHOWCASE-V2 staging
        if: inputs.mode == 'fresh'
        run: node scripts/showcase-v2-reset.js

      - name: Build 500 taxonomy-covered and eligible source products
        run: |
          node scripts/showcase-v2-source-build.js \
            --target 500 \
            --output data/catalogue-test-raw/showcase-catalog-v2-source.json

      - name: Validate real source contracts and lineage through refinery preflight
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { buildSlots, buildV2Contract, summary } = require('./scripts/showcase-v2-plan');
          const manualConnector = require('./services/suppliers/connectors/manual-connector');
          const { buildNormalizedSourceContractSnapshot } = require('./services/suppliers/normalized-product');
          const { validateForPromotion } = require('./services/catalog-promotion');

          const products = JSON.parse(fs.readFileSync('data/catalogue-test-raw/showcase-catalog-v2-source.json', 'utf8'));
          const slots = buildSlots();
          const items = products.map((product, index) => {
            const slot = slots[index];
            const contract = buildV2Contract(product, slot);
            return {
              ...contract,
              supplier_name: 'Komerce Showcase V2',
              supplier_product_id: slot.product_ref,
              raw_payload: {
                ...(contract.raw_payload || {}),
                source_title: product.source_title || null,
                source_description: product.source_description ?? null,
                source_locale: product.source_locale || 'en',
              },
            };
          });
          if (items.some((item) => !item.raw_payload?.source_title)) {
            console.error('raw_payload.source_title manquant');
            process.exit(1);
          }
          const connector = manualConnector.fetchProducts({ supplier_name: 'Komerce Showcase V2', items });
          if (connector.products.length !== 500 || connector.invalid.length !== 0) {
            console.error(JSON.stringify({ valid: connector.products.length, invalid: connector.invalid.slice(0, 10) }, null, 2));
            process.exit(1);
          }

          const snapshots = connector.products.map(buildNormalizedSourceContractSnapshot);
          snapshots.forEach(validateForPromotion);
          const richSnapshots = snapshots.filter((row) => Array.isArray(row.sellable_units) && row.sellable_units.length > 0).length;
          const proof = { ...summary(), normalized_v2: snapshots.length, rich_snapshots: richSnapshots, raw_source_titles: items.filter((x) => x.raw_payload?.source_title).length };
          console.log(JSON.stringify(proof, null, 2));
          if (products.length !== 500 || proof.rich_products !== 350 || proof.rich_snapshots !== 350 || proof.subcategories.length !== 21 || proof.raw_source_titles !== 500) process.exit(1);
          NODE

      - name: Mirror V2 media to ImageKit staging
        if: inputs.mode == 'fresh'
        run: |
          node scripts/showcase-media-mirror.js \
            --target 500 \
            --media-provider imagekit \
            --source-manifest data/catalogue-test-raw/showcase-catalog-v2-source.json \
            --manifest data/catalogue-test-raw/showcase-catalog-v2.json

      - name: Strict ImageKit V2 audit
        if: inputs.mode == 'fresh'
        run: |
          node scripts/showcase-media-audit.js \
            --target 500 \
            --media-provider imagekit \
            --namespace showcase-v2 \
            --manifest data/catalogue-test-raw/showcase-catalog-v2.json \
            --network \
            --strict \
            --concurrency 12

      - name: Preserve V2 campaign inputs
        uses: actions/upload-artifact@v4
        with:
          name: showcase-v2-canonical-manifests
          path: |
            data/catalogue-test-raw/showcase-catalog-v2-source.json
            data/catalogue-test-raw/showcase-catalog-v2.json
          if-no-files-found: error
          retention-days: 14

  refine-seed:
    name: Refine in French, SKU-audit and cumulatively seed Railway
    needs: build-media
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SHOWCASE_MEDIA_PROVIDER: imagekit
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CATALOG_ENRICH_PROVIDER: openai
      CATALOG_ENRICH_MODEL: gpt-5.6-luna
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Railway and French-enrichment secrets
        shell: bash
        run: |
          set -euo pipefail
          for var in DATABASE_URL OPENAI_API_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var manquant dans les secrets GitHub"
              exit 1
            fi
          done

      - name: Restore V2 campaign inputs
        uses: actions/download-artifact@v4
        with:
          name: showcase-v2-canonical-manifests
          path: data/catalogue-test-raw

      - name: Resume or fresh refinery seed with mandatory French enrichment
        shell: bash
        env:
          SHOWCASE_RUN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$SHOWCASE_RUN_MODE" = "fresh" ]; then
            manifest="data/catalogue-test-raw/showcase-catalog-v2.json"
          else
            manifest="data/catalogue-test-raw/showcase-catalog-v2-source.json"
          fi
          node scripts/showcase-v2-seed.js \
            --target 500 \
            --mode "$SHOWCASE_RUN_MODE" \
            --manifest "$manifest"

      - name: Preserve refinery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-v2-refinery-input
          path: data/catalogue-test-raw/showcase-catalog-v2-source.json
          if-no-files-found: error
          retention-days: 14
