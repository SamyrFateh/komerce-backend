name: Claude PAR — comptes de recette dédiés par rôle (staging KM)

# Certification parallèle Claude (#3868) : crée des comptes de test distincts de ceux de
# ChatGPT, via le provisioning officiel (scripts/recette/staging-e2e-provision.js), sans
# toucher aux comptes, relais ou délégations existants. Les mots de passe sont générés
# dans le run, masqués, et livrés uniquement chiffrés (RSA-OAEP + AES-256) pour la clé
# publique scripts/recette/claude-par/recipient.pub.pem.
on:
  push:
    branches: [cert/claude-par-accounts]
    paths:
      - '.github/workflows/claude-par-accounts-provision.yml'
      - 'scripts/recette/claude-par/recipient.pub.pem'

permissions:
  contents: read

concurrency:
  group: claude-par-accounts-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      PROVISION_CONFIRMATION: PROVISION-STAGING-E2E
      E2E_PROVISION_EXTRA_MARKETS: ''
      # Admin existant : jamais modifié par le provisioning (existingOnly).
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier la cible staging
        run: node scripts/recette/target-guard.js
      - name: Générer les identifiants dédiés (masqués)
        run: |
          set -euo pipefail
          umask 077
          echo '{' > "$RUNNER_TEMP/creds.json"
          first=1
          for p in MARKET_OPERATOR FINANCE SOURCING AGENT_HUB AGENT_RELAIS AGENT_TRANSITAIRE HUB_DIRECTOR; do
            slug=$(echo "$p" | tr 'A-Z_' 'a-z-')
            email="claude-par-${slug}@komerce-recette.test"
            pass="Kp9$(openssl rand -hex 14)Z"
            echo "::add-mask::$pass"
            echo "E2E_${p}_EMAIL=$email" >> "$GITHUB_ENV"
            echo "E2E_${p}_PASSWORD=$pass" >> "$GITHUB_ENV"
            [ $first -eq 1 ] || echo ',' >> "$RUNNER_TEMP/creds.json"
            first=0
            printf '"%s":{"email":"%s","password":"%s"}' "$slug" "$email" "$pass" >> "$RUNNER_TEMP/creds.json"
          done
          echo '}' >> "$RUNNER_TEMP/creds.json"
      - name: Provisioning — dry-run
        run: node scripts/recette/staging-e2e-provision.js --dry-run
      - name: Provisioning — execute
        run: |
          mkdir -p test-results/claude-par-accounts
          node scripts/recette/staging-e2e-provision.js --execute | tee test-results/claude-par-accounts/report.json
      - name: Chiffrer les identifiants pour Opus
        run: |
          set -euo pipefail
          umask 077
          openssl rand -out "$RUNNER_TEMP/k.bin" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/creds.json" \
            -out test-results/claude-par-accounts/creds.enc -pass "file:$RUNNER_TEMP/k.bin"
          openssl pkeyutl -encrypt -pubin -inkey scripts/recette/claude-par/recipient.pub.pem \
            -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k.bin" -out test-results/claude-par-accounts/key.enc
          shred -u "$RUNNER_TEMP/k.bin" "$RUNNER_TEMP/creds.json"
          if grep -q 'Kp9' test-results/claude-par-accounts/report.json; then echo 'Refus : mot de passe dans le rapport'; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-par-accounts-${{ github.run_id }}
          path: test-results/claude-par-accounts/
          if-no-files-found: warn
          retention-days: 7
