name: Catalog product service proof

on:
  push:
    branches:
      - fix/feature-proof-catalog-product-services

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/feature-proof-catalog-product-services
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Register focused tests in catalog slice
        shell: python
        run: |
          from pathlib import Path
          p = Path('features/catalog.feature.js')
          text = p.read_text(encoding='utf-8')
          anchor = "      'tests/unit/product-admin-service.test.js',\n"
          insert = anchor + "      'tests/unit/product-variant-service.test.js',\n      'tests/unit/product-sku-service.test.js',\n      'tests/unit/product-sellable-service.test.js',\n      'tests/unit/product-stock-service.test.js',\n"
          assert anchor in text, 'catalog test anchor missing'
          assert 'tests/unit/product-variant-service.test.js' not in text, 'tests already registered'
          p.write_text(text.replace(anchor, insert, 1), encoding='utf-8')
      - name: Run focused catalog tests
        run: npx jest tests/unit/product-variant-service.test.js tests/unit/product-sku-service.test.js tests/unit/product-sellable-service.test.js tests/unit/product-stock-service.test.js --runInBand --no-coverage
      - name: Check catalog feature slice
        run: node scripts/feature-guard.js --feature catalog --strict
      - name: Commit manifest and remove temporary workflow
        run: |
          rm .github/workflows/catalog-product-service-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/catalog.feature.js tests/unit/product-variant-service.test.js tests/unit/product-sku-service.test.js tests/unit/product-sellable-service.test.js tests/unit/product-stock-service.test.js .github/workflows/catalog-product-service-proof.yml
          git commit -m "test(catalog): attach proofs to extracted product services"
          git push origin HEAD:fix/feature-proof-catalog-product-services
