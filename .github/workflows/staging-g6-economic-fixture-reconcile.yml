# Exact disposable-staging fixture correction; no business Chromium certificate.
name: G6 KM — reconcile twelve evidenced duplicate economic fixture charges
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-g6-economic-fixture-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] g6-km-economic-fixture-reconcile'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      G6_ECONOMIC_FIXTURE_APPROVED: RECONCILE_12_EXACT_DUPLICATES
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      PGOPTIONS: '-c default_transaction_read_only=on'
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pin actual staging runtime
        run: node scripts/recette/resolve-staging-deploy-pin.js
      - name: Reconcile only twelve exact duplicate fixture charges through the canonical API
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const {request}=require('playwright');
          const db=require('./db');
          const {confirmTarget}=require('./scripts/recette/target-guard');
          const BASE='https://komerce-backend-production.up.railway.app';
