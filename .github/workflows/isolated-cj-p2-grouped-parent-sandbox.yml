name: Isolated CJ P2 grouped-parent sandbox

'on':
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: isolated-cj-p2-grouped-parent-sandbox
  cancel-in-progress: false

jobs:
  cj-p2-grouped:
    name: CJ P2 — grouped parent shipmentOrderId sandbox
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && github.event.issue.title == '[isolated-op] cj-p2-grouped-parent-sandbox')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: '1'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      CJ_ACCESS_TOKEN: ${{ secrets.KOMERCE_CJ_PROOF_ACCESS_TOKEN }}
      KOMERCE_ALLOW_CJ_P2_GROUPED_PARENT: '1'
      KOMERCE_CJ_SANDBOX: '1'
      KOMERCE_CJ_P2_GROUPED_PRODUCT_REF: 'KPR-131962'
      KOMERCE_CJ_P2_GROUPED_FROM_COUNTRY_CODE: 'CN'
      KOMERCE_CJ_P2_GROUPED_PAYMENT_MODE: 'payBalanceV2'

    steps:
      - name: Checkout protected main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Assert isolated sandbox runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$KOMERCE_ENV" = 'staging'
          test "$NODE_ENV" = 'test'
          test "$KOMERCE_CJ_SANDBOX" = '1'
          test "$KOMERCE_ALLOW_CJ_P2_GROUPED_PARENT" = '1'
          test "$KOMERCE_CJ_P2_GROUPED_PAYMENT_MODE" = 'payBalanceV2'
          test -n "${DATABASE_URL:-}"
          test -n "${CJ_ACCESS_TOKEN:-}"

      - name: Run CJ grouped parent proof
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 900s node scripts/cj-p2-grouped-parent-sandbox-proof.js)"
          printf '%s\n' "$output"
          compact="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-12000)"
          {
            echo 'summary<<EOF'
            echo "$compact"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Write proof summary
        if: always()
        env:
          PROOF_SUMMARY: ${{ steps.proof.outputs.summary }}
        run: |
          {
            echo '## CJ P2 grouped parent sandbox'
            echo
            echo '- runtime: staging/test'
            echo '- create: two exact CJ VIDs, isSandbox=1, payType=3'
            echo '- parent identity: real shipmentOrderId from create/read-back'
            echo '- batch operation: payBalanceV2(shipmentOrderId, payId) on 100% sandbox parent'
            echo '- real charge: impossible by proof guard'
            if [ -n "${PROOF_SUMMARY:-}" ]; then echo "- result: $PROOF_SUMMARY"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close successful command issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROOF_SUMMARY: ${{ steps.proof.outputs.summary }}
        run: |
          body="$(printf 'CJ P2 grouped-parent sandbox proof completed successfully. No real charge possible.\n\nResult: %s' "$PROOF_SUMMARY")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
