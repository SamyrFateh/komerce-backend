name: Inspect Feature First overlay

on:
  push:
    branches:
      - chore/feature-first-c1-c2-closure-20260729
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/feature-first-c1-c2-closure-20260729
          fetch-depth: 0
      - name: Repair and verify segment 03
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('.github/feature-first-overlay/part-03')
          lines = path.read_text().splitlines()
          expected_line_126 = 'yDCY5B1x/1PMA7N/B0eHn2/td3Y/2z84asuVZbYm75Lm8t6YngNjHoZ05S/qwbgSuCmWfHuOn+JK'
          if len(lines) != 131:
              raise SystemExit(f'Unexpected segment line count: {len(lines)}')
          if lines[125] != expected_line_126:
              print(f'Repairing line 126: {lines[125]}')
              lines[125] = expected_line_126
              path.write_text('\n'.join(lines))

          expected = {}
          for row in Path('.github/feature-first-overlay/part-03.expected-line-sha256').read_text().splitlines():
              number, digest = row.split()
              expected[int(number)] = digest
          actual_lines = path.read_bytes().splitlines(keepends=True)
          for number in sorted(expected):
              actual = hashlib.sha256(actual_lines[number - 1]).hexdigest()
              if actual != expected[number]:
                  raise SystemExit(f'Line {number} still differs: {actual} != {expected[number]}')
          print('SEGMENT_03_LINES_OK')
          PY
      - name: Rebuild and inspect archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/feature-first-overlay/part-0[0-8] > /tmp/feature-first-overlay.b64
          base64 --decode /tmp/feature-first-overlay.b64 > /tmp/feature-first-overlay.tar.gz
          test "$(sha256sum /tmp/feature-first-overlay.tar.gz | awk '{print $1}')" = "c01170ae198afaffe892147b5b7e237ac83a1009b4050158400978bac0de8da5"
          {
            echo "sha256  $(sha256sum /tmp/feature-first-overlay.tar.gz | awk '{print $1}')"
            echo "bytes   $(stat -c%s /tmp/feature-first-overlay.tar.gz)"
            echo
            tar -tzvf /tmp/feature-first-overlay.tar.gz
          } | tee /tmp/LISTING.txt
      - name: Commit repaired segment and listing on push only
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/LISTING.txt .github/feature-first-overlay/LISTING.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/feature-first-overlay/part-03 .github/feature-first-overlay/LISTING.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore(feature-first): repair and verify staged local overlay'
          git push origin HEAD:chore/feature-first-c1-c2-closure-20260729
