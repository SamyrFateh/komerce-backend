name: tmp-subcategory-cutout-complete-v7

on:
  push:
    branches:
      - fix/subcategory-canonical-cutouts-v7
    paths:
      - .github/workflows/tmp-subcategory-cutout-complete-v7.yml

permissions:
  contents: write

jobs:
  complete-cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subcategory-canonical-cutouts-v7
          fetch-depth: 0

      - name: Install cutout tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'rembg[cpu]' pillow requests

      - name: Build all 23 cutouts with resilient source selection
        run: |
          mkdir -p /tmp/subcat-cutouts
          curl -fsSL 'https://komerce-backend-production.up.railway.app/api/products?limit=1000' -o /tmp/products.json
          cat > /tmp/build_cutouts.py <<'PY'
          import io, json, re, requests
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from rembg import remove, new_session

          OUT = Path('/tmp/subcat-cutouts')
          raw = json.load(open('/tmp/products.json', encoding='utf-8'))
          products = raw if isinstance(raw, list) else raw.get('products', [])
          products = [p for p in products if p.get('is_available') is not False and p.get('image_url')]

          specs = [
            ('mode-femme','Mode & Beauté',['Femme'],None,'Femme'),
            ('mode-homme','Mode & Beauté',['Homme'],None,'Homme'),
            ('mode-enfant','Mode & Beauté',['Enfant'],None,'Enfant'),
            ('mode-beaute','Mode & Beauté',['Beauté'],None,'Beauté'),
            ('maison-confort','Maison',['Confort'],None,'Confort'),
            ('maison-cuisine','Maison',['Cuisine'],None,'Cuisine'),
            ('maison-deco','Maison',['Déco','Décoration'],None,'Déco'),
            ('maison-enfants','Maison',['Enfants'],None,'Enfants'),
            ('tech-phones','Tech',['Phones','Téléphones'],None,'Phones'),
            ('tech-ordi','Tech',['Ordinateurs','Tablettes'],None,'Ordi'),
            ('tech-audio','Tech',['Audio'],None,'Audio'),
            ('tech-montres','Tech',['Montres','Gadgets'],None,'Montres'),
            ('tech-gaming','Tech',[],r'gaming|gamer|game\b|manette|controller|joystick|console|playstation|xbox','Gaming'),
            ('brico-outillage','Bricolage',['Outillage'],None,'Outillage'),
            ('brico-electricite','Bricolage',['Electricité'],None,'Électricité'),
            ('brico-securite','Bricolage',['Sécurité'],None,'Sécurité'),
            ('perso-ceremonie','Créations personnelles',['Cérémonie'],None,'Cérémonie'),
            ('perso-cadeau','Créations personnelles',['Cadeau'],None,'Cadeau'),
            ('perso-impression','Créations personnelles',['Impression'],None,'Impression'),
            ('auto-filtres','Auto',['Filtres'],None,'Filtres'),
            ('auto-freinage','Auto',['Freinage'],None,'Freinage'),
            ('auto-eclairage','Auto',['Éclairage'],None,'Éclairage'),
            ('auto-moto','Auto',['Moto'],None,'Moto'),
          ]

          def score(p):
            url = str(p.get('image_url') or '')
            ref = str(p.get('product_ref') or '')
            # New Showcase V2 / ImageKit first: reachable and visually normalized.
            return (
              0 if 'ik.imagekit.io' in url else 1,
              0 if 'SHOWCASE-V2' in ref or '/showcase-v2/' in url else 1,
              int(p.get('sort_order') or 999999),
              ref or str(p.get('id') or ''),
            )

          def candidates(cat, subs, pattern):
            arr = [p for p in products if str(p.get('category','')).strip() == cat]
            if subs:
              arr = [p for p in arr if str(p.get('subcategory','')).strip() in subs]
            if pattern:
              rx = re.compile(pattern, re.I)
              arr = [p for p in arr if rx.search(' '.join(str(p.get(k,'')) for k in ('name','title','description','subcategory','product_ref')))]
            return sorted(arr, key=score)

          def fetch_first(arr, slug):
            for p in arr:
              try:
                r = requests.get(p['image_url'], timeout=20, headers={'User-Agent':'Mozilla/5.0 KomerceCutoutQA/1.0'})
                r.raise_for_status()
                img = Image.open(io.BytesIO(r.content)).convert('RGBA')
                if img.width < 80 or img.height < 80:
                  raise ValueError(f'image too small {img.size}')
                return p, img
              except Exception as exc:
                print('SOURCE_SKIP', slug, p.get('product_ref'), p.get('image_url'), type(exc).__name__, exc)
            return None, None

          session = new_session('u2netp')
          manifest=[]; selected=[]
          for slug, cat, subs, pattern, label in specs:
            arr=candidates(cat,subs,pattern)
            chosen, original=fetch_first(arr,slug)
            if chosen is None:
              manifest.append({'slug':slug,'label':label,'category':cat,'status':'missing','candidate_count':len(arr)})
              print('MISSING',slug,'candidates',len(arr))
              continue
            cut=remove(original,session=session,alpha_matting=True,
                       alpha_matting_foreground_threshold=240,
                       alpha_matting_background_threshold=15,
                       alpha_matting_erode_size=8)
            if not isinstance(cut,Image.Image):
              cut=Image.open(io.BytesIO(cut)).convert('RGBA')
            else:
              cut=cut.convert('RGBA')
            bbox=cut.getchannel('A').getbbox()
            if not bbox:
              manifest.append({'slug':slug,'label':label,'category':cat,'status':'empty-alpha'})
              continue
            cut=cut.crop(bbox)
            scale=min(420/cut.width,420/cut.height,1.0)
            cut=cut.resize((max(1,round(cut.width*scale)),max(1,round(cut.height*scale))),Image.Resampling.LANCZOS)
            canvas=Image.new('RGBA',(512,512),(0,0,0,0))
            canvas.alpha_composite(cut,((512-cut.width)//2,(512-cut.height)//2))
            out=OUT/f'sub-{slug}-v1.webp'
            canvas.save(out,'WEBP',quality=92,method=6)
            item={'slug':slug,'label':label,'category':cat,'status':'ok','asset':out.name,
                  'source':chosen.get('image_url'),'product_ref':chosen.get('product_ref'),
                  'product_id':chosen.get('id'),'product_name':chosen.get('name'),
                  'source_subcategory':chosen.get('subcategory'),'candidate_count':len(arr)}
            manifest.append(item); selected.append((item,canvas.copy()))
            print('OK',slug,'|',chosen.get('product_ref'),'|',chosen.get('subcategory'),'|',chosen.get('name'),'|',chosen.get('image_url'))

          with open(OUT/'manifest.json','w',encoding='utf-8') as f:
            json.dump(manifest,f,ensure_ascii=False,indent=2)

          cols,rows=5,5; cell_w,cell_h=250,290
          sheet=Image.new('RGB',(cols*cell_w,rows*cell_h),'white'); draw=ImageDraw.Draw(sheet); font=ImageFont.load_default()
          by_slug={i['slug']:(i,img) for i,img in selected}
          for idx,(slug,cat,subs,pattern,label) in enumerate(specs):
            cx=(idx%cols)*cell_w; cy=(idx//cols)*cell_h
            for yy in range(cy,cy+230,20):
              for xx in range(cx,cx+cell_w,20):
                fill=(238,238,238) if ((xx-cx)//20+(yy-cy)//20)%2==0 else (255,255,255)
                draw.rectangle([xx,yy,min(xx+19,cx+cell_w-1),min(yy+19,cy+229)],fill=fill)
            if slug in by_slug:
              item,img=by_slug[slug]; preview=img.copy(); preview.thumbnail((210,210),Image.Resampling.LANCZOS)
              px=cx+(cell_w-preview.width)//2; py=cy+(220-preview.height)//2
              sheet.paste(preview.convert('RGB'),(px,py),preview.getchannel('A'))
              draw.text((cx+8,cy+236),label,fill='black',font=font)
              draw.text((cx+8,cy+251),(item.get('product_name') or '')[:34],fill=(70,70,70),font=font)
              draw.text((cx+8,cy+266),str(item.get('source_subcategory') or ''),fill=(100,100,100),font=font)
            else:
              draw.rectangle([cx+18,cy+40,cx+cell_w-18,cy+190],outline=(180,0,0),width=3)
              draw.text((cx+55,cy+105),'MISSING',fill=(180,0,0),font=font)
              draw.text((cx+8,cy+236),label,fill='black',font=font)
          sheet.save(OUT/'contact-sheet.png',quality=95)
          ok=sum(1 for x in manifest if x['status']=='ok')
          print(f'CUTOUT_SUMMARY ok={ok} total={len(specs)} missing={len(specs)-ok}')
          if ok != len(specs):
            raise SystemExit('Not all canonical cutouts could be produced')
          PY
          python3 /tmp/build_cutouts.py

      - uses: actions/upload-artifact@v4
        with:
          name: subcategory-cutouts-v7-complete
          path: /tmp/subcat-cutouts
          retention-days: 3

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tmp-subcategory-cutout-complete-v7.yml
          git commit -m 'chore(qa): remove temporary complete-cutout workflow' || true
          git push origin HEAD:fix/subcategory-canonical-cutouts-v7
