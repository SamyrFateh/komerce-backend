name: PR Governance

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: pr-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-plan:
    name: Plan d'attaque PR obligatoire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Plan d'attaque PR (body)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-governance-check.js

      - name: Code touché ↔ signal test (touched-tests)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          set +e
          node scripts/touched-tests-gate.js --base origin/${{ github.base_ref }} --strict > touched-tests.log 2>&1
          code=$?
          cat touched-tests.log
          echo "$code" > touched-tests.exit-code
          exit 0

      - name: Measure PDC-5 detailed coverage
        run: |
          set +e
          cd public/boutique
          node_modules/.bin/jest \
            tests/unit/b-modal-desktop-product.test.js \
            tests/unit/b-modal-product-detail-bootstrap.test.js \
            tests/unit/b-modal-mobile-product-bootstrap.test.js \
            tests/unit/b-modal-mobile-product.test.js \
            tests/unit/modal-selection-model.test.js \
            tests/unit/b-modal-desktop-enhancers.test.js \
            tests/unit/b-modal-approche-c-hybrid.test.js \
            tests/unit/main.test.js \
            --runInBand \
            --coverage \
            --collectCoverageFrom=js/b-modal-desktop-product.js \
            --collectCoverageFrom=js/b-modal-product-detail-bootstrap.js \
            --collectCoverageFrom=js/b-modal-mobile-product-bootstrap.js \
            --collectCoverageFrom=js/b-modal-mobile-product.js \
            --collectCoverageFrom=js/view-models/modal-selection-model.js \
            --collectCoverageFrom=js/b-modal-desktop-enhancers.js \
            --collectCoverageFrom=js/b-modal-approche-c-hybrid.js \
            --collectCoverageFrom=js/main.js \
            --coverageReporters=json \
            --coverageReporters=text \
            --coverageDirectory=.pdc5-coverage \
            > ../../pdc5-tests.log 2>&1
          code=$?
          cat ../../pdc5-tests.log
          echo "$code" > ../../pdc5-tests.exit-code
          exit 0

      - name: Capture Boutique check-fast
        run: |
          set +e
          npm --prefix public/boutique run check:fast > boutique-check-fast.log 2>&1
          code=$?
          cat boutique-check-fast.log
          echo "$code" > boutique-check-fast.exit-code
          exit 0

      - name: Capture feature registry
        run: |
          set +e
          npm run feature:registry > feature-registry.log 2>&1
          code=$?
          cat feature-registry.log
          echo "$code" > feature-registry.exit-code
          exit 0

      - name: Capture schema freshness before snapshot
        run: |
          set +e
          npm run schema:check > schema-check.log 2>&1
          code=$?
          cat schema-check.log
          echo "$code" > schema-check.exit-code
          exit 0

      - name: Probe public Railway database secret and snapshot
        env:
          INTERNAL_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          PUBLIC_URL_1: ${{ secrets.RAILWAY_PUBLIC_DATABASE_URL }}
          PUBLIC_URL_2: ${{ secrets.DATABASE_PUBLIC_URL }}
          PUBLIC_URL_3: ${{ secrets.RAILWAY_DATABASE_PUBLIC_URL }}
          PUBLIC_URL_4: ${{ secrets.RAILWAY_TCP_DATABASE_URL }}
          PUBLIC_URL_5: ${{ secrets.RAILWAY_DATABASE_TCP_URL }}
        run: |
          set +e
          : > schema-secret-probe.log
          : > schema-snapshot.log
          selected=""
          selected_name=""

          for name in PUBLIC_URL_1 PUBLIC_URL_2 PUBLIC_URL_3 PUBLIC_URL_4 PUBLIC_URL_5; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name=set" >> schema-secret-probe.log
              selected="$value"
              selected_name="$name"
              break
            else
              echo "$name=unset" >> schema-secret-probe.log
            fi
          done

          if [ -z "$selected" ]; then
            echo "NO_PUBLIC_DATABASE_SECRET" | tee -a schema-snapshot.log
            if [ -n "$INTERNAL_URL" ]; then
              echo "INTERNAL_URL=set_but_not_usable_from_github_actions" >> schema-secret-probe.log
            else
              echo "INTERNAL_URL=unset" >> schema-secret-probe.log
            fi
            exit 0
          fi

          echo "selected=$selected_name" >> schema-secret-probe.log
          DATABASE_URL="$selected" node scripts/db-snapshot.js > schema-snapshot.log 2>&1
          code=$?
          cat schema-snapshot.log
          echo "$code" > schema-snapshot.exit-code
          if [ "$code" -eq 0 ]; then
            node scripts/check-schema-freshness.js > schema-after-snapshot.log 2>&1
            cat schema-after-snapshot.log
          fi
          exit 0

      - name: Upload PDC-5 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdc5-diagnostic
          path: |
            touched-tests.log
            touched-tests.exit-code
            pdc5-tests.log
            pdc5-tests.exit-code
            boutique-check-fast.log
            boutique-check-fast.exit-code
            feature-registry.log
            feature-registry.exit-code
            schema-check.log
            schema-check.exit-code
            schema-secret-probe.log
            schema-snapshot.log
            schema-snapshot.exit-code
            schema-after-snapshot.log
            docs/db/railway-live-schema.sql
            public/boutique/.pdc5-coverage/coverage-final.json
          retention-days: 1
