name: PR Governance

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: pr-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-plan:
    name: Plan d'attaque PR obligatoire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Plan d'attaque PR (body)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-governance-check.js

      - name: Code touché ↔ signal test (touched-tests)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          set +e
          node scripts/touched-tests-gate.js --base origin/${{ github.base_ref }} --strict > touched-tests.log 2>&1
          code=$?
          cat touched-tests.log
          echo "$code" > touched-tests.exit-code
          exit "$code"

      - name: Measure PDC-4 detailed coverage
        if: always()
        run: |
          set +e
          cd public/boutique
          node_modules/.bin/jest \
            tests/unit/b-modal-mobile-product.test.js \
            tests/unit/b-modal-mobile-product-bootstrap.test.js \
            --runInBand \
            --coverage \
            --collectCoverageFrom=js/b-modal-mobile-product.js \
            --collectCoverageFrom=js/b-modal-mobile-product-bootstrap.js \
            --coverageReporters=json \
            --coverageReporters=text \
            --coverageDirectory=.pdc4-coverage \
            > ../../pdc4-tests.log 2>&1
          code=$?
          cat ../../pdc4-tests.log
          echo "$code" > ../../pdc4-tests.exit-code
          exit 0

      - name: Upload PDC-4 touched-tests diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdc4-touched-tests-diagnostic
          path: |
            touched-tests.log
            touched-tests.exit-code
            pdc4-tests.log
            pdc4-tests.exit-code
            public/boutique/.pdc4-coverage/coverage-final.json
          retention-days: 1
