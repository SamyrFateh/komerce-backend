name: PR Governance

# Déclenché uniquement sur pull_request (pas sur push main — pas de PR_NUMBER).
on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: pr-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-plan:
    name: Plan d'attaque PR obligatoire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour git diff

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      # ── Gate 1 : body PR contient un plan d'attaque structuré ──────────────
      - name: Plan d'attaque PR (body)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-governance-check.js

      # ── Gate 2 : fichiers applicatifs touchés ont un signal test ───────────
      # PR_BODY injecté pour que touched-tests-gate puisse détecter ## Tests
      # sans appel API supplémentaire.
      # --strict active la règle de complétion au contact (QUALITY_PYRAMID_DOCTRINE.md
      # Niveau 3.1) : si un fichier ET son test sont touchés, la couverture doit
      # atteindre le seuil cible (governance/coverage-thresholds.json), pas juste
      # "un test existe". Le gate sélectionne désormais le Jest du workspace
      # concerné (backend racine ou public/boutique).
      - name: Code touché ↔ signal test (touched-tests)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          node scripts/touched-tests-gate.js --base origin/${{ github.base_ref }} --strict
