name: PR Governance

# Déclenché uniquement sur pull_request (pas sur push main — pas de PR_NUMBER).
on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: pr-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-plan:
    name: Plan d'attaque PR obligatoire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour git diff

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Plan d'attaque PR (body)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-governance-check.js

      - name: Code touché ↔ signal test (touched-tests)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          set +e
          node scripts/touched-tests-gate.js --base origin/${{ github.base_ref }} --strict > touched-tests.log 2>&1
          code=$?
          cat touched-tests.log
          echo "$code" > touched-tests.exit-code
          exit "$code"

      - name: Measure normalized-product detailed coverage
        if: always()
        run: |
          node_modules/.bin/jest \
            tests/unit/normalized-product.test.js \
            tests/unit/normalized-product-source-contract-v2.test.js \
            --runInBand \
            --coverage \
            --collectCoverageFrom=services/suppliers/normalized-product.js \
            --coverageReporters=json \
            --coverageDirectory=.diag-coverage \
            --silent || true

      - name: Upload touched-tests diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touched-tests-diagnostic-real-diff
          path: |
            touched-tests.log
            touched-tests.exit-code
            .diag-coverage/coverage-final.json
          retention-days: 1
