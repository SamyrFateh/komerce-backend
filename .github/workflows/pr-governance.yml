name: PR Governance

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: pr-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-plan:
    name: Plan d'attaque PR obligatoire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Plan d'attaque PR (body)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-governance-check.js

      - name: Code touché ↔ signal test (touched-tests)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          node scripts/touched-tests-gate.js --base origin/${{ github.base_ref }} --strict | tee touched-tests.log

      - name: Verify schema baseline / intended post-snapshot migrations
        run: npm run schema:check | tee schema-check.log

      - name: Materialize intended schema documentation artifact
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'docs/SCHEMA.md';
          let md = fs.readFileSync(file, 'utf8');

          function appendTableNote(table, sentinel, note) {
            if (md.includes(sentinel)) return;
            const escaped = table.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp(`^\\| \\`${escaped}\\` \\| .* \\|$`, 'm');
            if (!re.test(md)) throw new Error(`Ligne SCHEMA introuvable pour ${table}`);
            md = md.replace(re, (line) => line.replace(/ \|$/, ` ${note} |`));
          }

          md = md.replace(
            '### 4.5 Paniers et catalogue (10 tables)',
            '### 4.5 Paniers et catalogue'
          );

          appendTableNote(
            'order_items',
            'Migration 104 (2026-07-12, `intended_migration_schema` — non vérifié live) : + `sku_id`',
            '**Migration 104 (2026-07-12, `intended_migration_schema` — non vérifié live)** : + `sku_id` UUID nullable, FK vers `product_skus(id)` avec `ON DELETE SET NULL`. `variant_combo` reste snapshot d’affichage/historique ; le pilotage stock cible passe par `sku_id`. Doctrine : `docs/specs/DECISION_MODELE_STOCK_SKU.md`.'
          );

          appendTableNote(
            'products',
            'Migration 104 (2026-07-12, `intended_migration_schema` — non vérifié live) : + `inventory_model`',
            '**Migration 104 (2026-07-12, `intended_migration_schema` — non vérifié live)** : + `inventory_model` TEXT NOT NULL DEFAULT `LEGACY_VARIANTS`, CHECK (`LEGACY_VARIANTS` | `SKU`). La bascule vers SKU est explicite et atomique ; jamais déduite de l’existence de lignes dans `product_skus`.'
          );

          appendTableNote(
            'sourcing_candidates',
            'Migration 105 (2026-07-12, `intended_migration_schema` — non vérifié live) : + `normalized_source_contract`',
            '**Migration 105 (2026-07-12, `intended_migration_schema` — non vérifié live)** : + `normalized_source_contract` JSONB nullable, snapshot du `NormalizedSupplierProduct V2` validé sans dupliquer `raw_payload`. Préserve `media`, `option_axes` et `sellable_units` source ; ne constitue ni le catalogue canonique ni la vérité de stock.'
          );

          if (!md.includes('object: product_skus')) {
            const pending = `\n\n<!-- schema-pending\nobject: product_skus\nkind: table\nmigration: 104\nsection: ### 4.5 Paniers et catalogue\nrole: Unités vendables canoniques en Mode SKU : une combinaison exacte d’options = un SKU, stock unique par SKU, prix SKU optionnel, SKU par défaut si variant_combo est NULL. Source de vérité stock cible selon DECISION_MODELE_STOCK_SKU.\n-->`;
            const re = /(^\| `catalog_field_overrides` \|.*\|$)/m;
            if (!re.test(md)) throw new Error('Point insertion product_skus introuvable');
            md = md.replace(re, `$1${pending}`);
          }

          fs.writeFileSync(file, md);
          console.log('✅ docs/SCHEMA.md matérialisé en Mode B intended_migration_schema pour 104/105.');
          NODE

          grep -n "Migration 104\|Migration 105\|object: product_skus" docs/SCHEMA.md | tee schema-doc-patch.log

      - name: Capture Boutique check-fast
        run: npm --prefix public/boutique run check:fast > boutique-check-fast.log 2>&1

      - name: Capture feature registry
        run: npm run feature:registry | tee feature-registry.log

      - name: Upload PDC-5 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdc5-diagnostic
          path: |
            touched-tests.log
            schema-check.log
            schema-doc-patch.log
            boutique-check-fast.log
            feature-registry.log
            docs/SCHEMA.md
          retention-days: 1
