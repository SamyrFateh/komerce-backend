name: PR Governance

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: pr-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-plan:
    name: Plan d'attaque PR obligatoire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Plan d'attaque PR (body)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-governance-check.js

      - name: Code touché ↔ signal test (touched-tests)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          set +e
          node scripts/touched-tests-gate.js --base origin/${{ github.base_ref }} --strict > touched-tests.log 2>&1
          code=$?
          cat touched-tests.log
          echo "$code" > touched-tests.exit-code
          exit 0

      - name: Capture Boutique check-fast diagnostic
        run: |
          set +e
          npm --prefix public/boutique run check:fast > boutique-check-fast.log 2>&1
          code=$?
          cat boutique-check-fast.log
          echo "$code" > boutique-check-fast.exit-code
          exit 0

      - name: Upload final PDC-4 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdc4-final-diagnostic
          path: |
            touched-tests.log
            touched-tests.exit-code
            boutique-check-fast.log
            boutique-check-fast.exit-code
          retention-days: 1
