# Reset Staging (LOT 1) : vide les donnees metier/test et retire les fixtures, conserve la fondation.
# Declenchement MANUEL uniquement. dry-run par defaut (lecture seule) ; execute exige la confirmation texte
# RESET-STAGING-BUSINESS-DATA, le proprietaire du depot, et l'epingle de base STAGING_DB_PIN (variable de depot
# host:port/base, non secrete). Jamais lance automatiquement. Code : scripts/recette/staging-reset.js.
# Apres un execute RESET_OK, le job `provision` reprovisionne les comptes E2E (workflow reutilisable
# staging-e2e-provision.yml, memes script et secrets) puis verifie en lecture seule que chaque compte existe. Aucune saisie
# supplementaire : la confirmation RESET-STAGING-BUSINESS-DATA, deja exigee et verifiee par le job reset, vaut confirmation de
# provisionnement (la valeur PROVISION-STAGING-E2E est passee en interne, jamais saisie). skip_provision=true l'omet.
name: Staging reset

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (lecture seule) ou execute (destructif)'
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - execute
      scope:
        description: 'prudent (defaut) = fixtures reconnues seulement, blocage si reference par la fondation ; full = tout compte hors allowlist + purge nominative des lignes de fondation dont l auteur est retire ; activity = ACTIVITE seulement (commandes, achats, Hub, expeditions, douane, relais, cash, paiements, ecritures financieres, alertes, SAV), catalogue/sourcing/prix/medias PRESERVES et stock remis en etat'
        required: false
        type: choice
        default: prudent
        options:
          - prudent
          - full
          - activity
      simulate:
        description: 'dry-run seulement : repetition generale dans une transaction annulee (verrous exclusifs bref sur les tables purgees) - hors activite uniquement'
        required: false
        type: boolean
        default: false
      allow_reference_drift:
        description: 'execute : autoriser le seed a reecrire des referentiels existants divergents (rapport dry-run reference_drift a relire avant)'
        required: false
        type: boolean
        default: false
      provision_markets:
        description: 'execute : marches de recette supplementaires reprovisionnes apres le reset (sous-ensemble de CM,CG ; KM toujours inclus ; vide = KM seul)'
        required: false
        type: string
        default: 'CM,CG'
      skip_provision:
        description: 'execute : ne PAS reprovisionner les comptes E2E apres le reset'
        required: false
        type: boolean
        default: false
      confirmation:
        description: 'Pour execute uniquement : saisir exactement RESET-STAGING-BUSINESS-DATA'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Whole workflow holds G6 writer lock, including E2E reprovision after reset.
  group: komerce-g6-canonical-real-transaction
  cancel-in-progress: false

jobs:
  reset:
    name: Staging reset - ${{ inputs.mode }} / ${{ inputs.scope }}
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      reset_status: ${{ steps.status.outputs.reset_status }}
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      RESET_MODE: ${{ inputs.mode }}
      KOMERCE_STAGING_RESET_MODE: ${{ inputs.scope || 'prudent' }}
      KOMERCE_STAGING_RESET_SIMULATE: ${{ inputs.simulate && inputs.mode == 'dry-run' && '1' || '0' }}
      RESET_CONFIRMATION: ${{ inputs.confirmation }}
      KOMERCE_STAGING_RESET_ALLOW_REFERENCE_DRIFT: ${{ inputs.allow_reference_drift && inputs.mode == 'execute' && '1' || '0' }}
    steps:
      # Code execute = la ref depuis laquelle le workflow est lance (la PR avant merge : preuve dry-run, puis main).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Preconditions (secrets, pin, confirmation)
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${DATABASE_URL:-}" ] || { echo "::error::secret RAILWAY_DATABASE_URL absent"; exit 1; }
          [ -n "${KOMERCE_STAGING_RESET_DB_PIN:-}" ] || { echo "::error::variable de depot STAGING_DB_PIN absente (host:port/base)"; exit 1; }
          case "$RESET_MODE" in
            dry-run) ;;
            execute)
              [ "$RESET_CONFIRMATION" = 'RESET-STAGING-BUSINESS-DATA' ] || { echo "::error::confirmation texte invalide"; exit 1; }
              ;;
            *) echo "::error::mode inconnu"; exit 1 ;;
          esac
      - name: Guard live staging identity
        run: node scripts/recette/target-guard.js
      - name: Reset report (${{ inputs.mode }})
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/staging-reset
          if [ "$RESET_MODE" = 'execute' ]; then
            export KOMERCE_STAGING_RESET_ACK="$RESET_CONFIRMATION"
            export KOMERCE_CONTROLLED_PURGE_CONFIRM='PURGE_BUSINESS_DATA_KEEP_FOUNDATION'
          fi
          node scripts/recette/staging-reset.js "--$RESET_MODE" | tee test-results/staging-reset/report.json
      - name: Reset status
        id: status
        shell: bash
        run: |
          set -euo pipefail
          st=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('test-results/staging-reset/report.json','utf8')).status||''))")
          echo "reset_status=$st" >> "$GITHUB_OUTPUT"
      - name: E2E provisioning plan (dry-run, nothing executed)
        if: ${{ inputs.mode == 'dry-run' }}
        shell: bash
        run: |
          echo "Plan (dry-run) : apres un execute RESET_OK, staging-e2e-provision.yml sera appele en mode execute (marches KM + ${PROVISION_MARKETS:-aucun}), puis verification lecture seule des 8 comptes E2E. Rien n'est execute maintenant."
        env:
          PROVISION_MARKETS: ${{ inputs.provision_markets }}
      - name: Independent verification (execute only)
        if: ${{ inputs.mode == 'execute' }}
        run: node scripts/recette/staging-verify-empty.js | tee test-results/staging-reset/verify.json
      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-reset-${{ inputs.mode }}-${{ github.run_id }}
          path: test-results/staging-reset
          retention-days: 30
          if-no-files-found: warn

  # Reprovisionnement E2E : uniquement apres un reset execute RESET_OK (needs = succes du job reset), sauf skip_provision.
  # Meme script et memes secrets que staging-e2e-provision.yml (appel reutilisable, secrets: inherit). Confirmation interne.
  provision:
    name: E2E provision after reset
    needs: reset
    if: ${{ inputs.mode == 'execute' && inputs.skip_provision != true && needs.reset.outputs.reset_status == 'RESET_OK' }}
    uses: ./.github/workflows/staging-e2e-provision.yml
    with:
      mode: execute
      extra_markets: ${{ inputs.provision_markets }}
      confirmation: PROVISION-STAGING-E2E
    secrets: inherit
