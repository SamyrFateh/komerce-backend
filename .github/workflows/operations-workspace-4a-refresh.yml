name: Operations Workspace 4A refresh

on:
  push:
    branches:
      - feat/canonical-operations-workspace-4a

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-operations-workspace-4a
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Harden source and semantic browser proof
        run: |
          node <<'NODE'
          const fs = require('fs');

          const serviceFile = 'services/operations-workspace.js';
          let service = fs.readFileSync(serviceFile, 'utf8');

          const guardBefore = "  const parcel = await resolveParcelInMarket(parcelReference, resolvedMarket.id);\n  const result = await inventory.scanIntoParcel(rows[0].id, parcel.id);\n";
          const guardAfter = "  const parcel = await resolveParcelInMarket(parcelReference, resolvedMarket.id);\n  if (!['draft', 'preparation'].includes(parcel.status)) {\n    throw new OperationsWorkspaceError(\n      'inventory_parcel_not_open',\n      `Le colis ${parcel.reference} n'est plus ouvert à l'affectation inventaire`,\n      409\n    );\n  }\n  const result = await inventory.scanIntoParcel(rows[0].id, parcel.id);\n";
          if (!service.includes(guardAfter)) {
            if (!service.includes(guardBefore)) throw new Error('Inventory guard marker missing');
            service = service.replace(guardBefore, guardAfter);
          }

          const aggregateBefore = "       LEFT JOIN LATERAL (\n         SELECT COUNT(DISTINCT oi.order_id)::int AS orders_count,\n                COUNT(pi.id)::int AS items_count,\n                COALESCE(SUM(DISTINCT linked_order.total_kmf), 0)::int AS total_kmf\n           FROM parcel_items pi\n           JOIN order_items oi ON oi.id = pi.order_item_id\n           JOIN orders linked_order ON linked_order.id = oi.order_id\n          WHERE pi.parcel_id = p.id\n            AND linked_order.market_id = $1\n       ) agg ON true\n";
          const aggregateAfter = "       LEFT JOIN LATERAL (\n         SELECT COUNT(*)::int AS orders_count,\n                COALESCE(SUM(per_order.items_count), 0)::int AS items_count,\n                COALESCE(SUM(per_order.total_kmf), 0)::int AS total_kmf\n           FROM (\n             SELECT linked_order.id,\n                    COUNT(pi.id)::int AS items_count,\n                    MAX(linked_order.total_kmf)::int AS total_kmf\n               FROM parcel_items pi\n               JOIN order_items oi ON oi.id = pi.order_item_id\n               JOIN orders linked_order ON linked_order.id = oi.order_id\n              WHERE pi.parcel_id = p.id\n                AND linked_order.market_id = $1\n              GROUP BY linked_order.id\n           ) per_order\n       ) agg ON true\n";
          if (!service.includes(aggregateAfter)) {
            if (!service.includes(aggregateBefore)) throw new Error('Distribution aggregate marker missing');
            service = service.replace(aggregateBefore, aggregateAfter);
          }
          fs.writeFileSync(serviceFile, service);

          const testFile = 'tests/unit/canonical-operations-workspace.test.js';
          let test = fs.readFileSync(testFile, 'utf8');
          const testBefore = "test('le frontend ne construit jamais market_id comme autorité', () => {\n  expect(SOURCE).not.toContain('market_id');\n  expect(SOURCE).not.toContain('marketId');\n  expect(SOURCE).not.toContain('/api/hub/');\n  expect(SOURCE).not.toContain('/api/v2/');\n});\n";
          const testAfter = "test('le frontend ne construit jamais market_id comme autorité', () => {\n  const executable = SOURCE.replace(/\\/\\*\\*[\\s\\S]*?\\*\\//, '');\n  expect(executable).not.toMatch(/\\bmarket_id\\b/);\n  expect(executable).not.toMatch(/\\bmarketId\\b/);\n  expect(executable).not.toContain('/api/hub/');\n  expect(executable).not.toContain('/api/v2/');\n});\n";
          if (!test.includes(testAfter)) {
            if (!test.includes(testBefore)) throw new Error('Semantic browser proof marker missing');
            test = test.replace(testBefore, testAfter);
          }
          fs.writeFileSync(testFile, test);
          NODE
      - name: Register Operations workspace contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/contract-generate.js';
          let src = fs.readFileSync(file, 'utf8');
          const routeMarker = "  // LOT 3C — Canonical Product 360\n  { prefix: '/api/admin/entities/products/{productRef}', method: 'get', schema: null },\n";
          const routeBlock = "  // LOT 4A — Canonical Operations / Hub-Relais Workspace (single-market actions)\n  { prefix: '/api/admin/workspaces/operations/market/{marketCode}', method: 'get', schema: null },\n  { prefix: '/api/admin/workspaces/operations/market/{marketCode}/orders/{reference}/mark-ordered', method: 'post', schema: null },\n  { prefix: '/api/admin/workspaces/operations/market/{marketCode}/distribution/run', method: 'post', schema: null },\n  { prefix: '/api/admin/workspaces/operations/market/{marketCode}/parcels/{reference}/ship', method: 'post', schema: null },\n  { prefix: '/api/admin/workspaces/operations/market/{marketCode}/orders/{reference}/confirm-cash', method: 'post', schema: null },\n  { prefix: '/api/admin/workspaces/operations/market/{marketCode}/parcels/{reference}/receive', method: 'post', schema: null },\n  { prefix: '/api/admin/workspaces/operations/market/{marketCode}/parcels/{reference}/collect', method: 'post', schema: null },\n  { prefix: '/api/admin/workspaces/operations/market/{marketCode}/inventory/items/{itemId}/assign', method: 'post', schema: null },\n";
          if (!src.includes(routeBlock)) {
            if (!src.includes(routeMarker)) throw new Error('Product 360 route marker missing');
            src = src.replace(routeMarker, routeMarker + routeBlock);
          }

          const responseMarker = "  // LOT 3C — réponse Product 360 consommée par Canonical.\n";
          const responseBlock = "  // LOT 4A — réponses Operations Workspace consommées par Canonical.\n  '/api/admin/workspaces/operations/market/{marketCode}': {\n    get: { fields: ['scope','summary','queues','distribution','inventory','data_quality'], source: 'test' }\n  },\n  '/api/admin/workspaces/operations/market/{marketCode}/orders/{reference}/mark-ordered': {\n    post: { fields: ['ok','action','result'], source: 'test' }\n  },\n  '/api/admin/workspaces/operations/market/{marketCode}/distribution/run': {\n    post: { fields: ['ok','action','result'], source: 'test' }\n  },\n  '/api/admin/workspaces/operations/market/{marketCode}/parcels/{reference}/ship': {\n    post: { fields: ['ok','action','result'], source: 'test' }\n  },\n  '/api/admin/workspaces/operations/market/{marketCode}/orders/{reference}/confirm-cash': {\n    post: { fields: ['ok','action','result'], source: 'test' }\n  },\n  '/api/admin/workspaces/operations/market/{marketCode}/parcels/{reference}/receive': {\n    post: { fields: ['ok','action','result'], source: 'test' }\n  },\n  '/api/admin/workspaces/operations/market/{marketCode}/parcels/{reference}/collect': {\n    post: { fields: ['ok','action','result'], source: 'test' }\n  },\n  '/api/admin/workspaces/operations/market/{marketCode}/inventory/items/{itemId}/assign': {\n    post: { fields: ['ok','action','result'], source: 'test' }\n  },\n";
          if (!src.includes(responseBlock)) {
            if (!src.includes(responseMarker)) throw new Error('Product 360 response marker missing');
            src = src.replace(responseMarker, responseBlock + responseMarker);
          }
          fs.writeFileSync(file, src);
          NODE
      - name: Static syntax checks
        run: |
          node --check services/operations-workspace.js
          node --check routes/admin-operations-workspace.js
          node --check public/dashboards/canonical/js/operations-workspace.js
          node --check public/dashboards/canonical/js/app.js
      - name: Generate and validate contract
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://ci-dummy:ci-dummy@localhost:5432/ci-dummy
          ADMIN_PASSWORD: ci-dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          QR_SECRET: ci-dummy
          JWT_SECRET: ci-dummy
          SESSION_SECRET: ci-dummy
          INTERNAL_API_KEY: ci-dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          JWT_EXPIRES: 7d
          APP_URL: http://localhost
          PUBLIC_URL: http://localhost
          PUBLIC_BASE_URL: http://localhost
          ADMIN_RESET_KEY: ci-dummy
          INVOICE_PUBLIC_LINK_SECRET: ci-dummy
          AUTHKEY_API_KEY: ci-dummy
          PAYPAL_CLIENT_ID: ci-dummy
          PAYPAL_CLIENT_SECRET: ci-dummy
          PAYPAL_WEBHOOK_ID: ci-dummy
          META_WA_TOKEN: ci-dummy
          META_WA_PHONE_NUMBER_ID: ci-dummy
          META_WA_APP_SECRET: ci-dummy
        run: |
          node scripts/gen-route-registry.js
          npm run contract:generate
          node scripts/contract-check.js
      - name: Quality and feature gates
        run: |
          node scripts/code-quality-gate.js --strict
          node scripts/feature-guard.js --strict
      - name: Run Operations Workspace tests
        run: |
          npx jest --runInBand \
            tests/unit/admin-operations-workspace-route.test.js \
            tests/unit/operations-workspace-service.test.js \
            tests/unit/canonical-operations-workspace.test.js \
            tests/unit/canonical-operations-workspace-app.test.js \
            tests/unit/canonical-operations-workspace-boundary.test.js \
            tests/unit/canonical-admin-app.test.js
      - name: Commit source guard and generated artifacts
        run: |
          git add services/operations-workspace.js tests/unit/canonical-operations-workspace.test.js scripts/contract-generate.js docs/_generated/route-registry.json docs/contract/openapi.json
          if git diff --cached --quiet; then
            echo "No prepared diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(canonical): prepare Operations Workspace 4A contract"
          git push origin HEAD:feat/canonical-operations-workspace-4a
