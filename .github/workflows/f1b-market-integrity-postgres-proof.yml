name: F1-B market integrity PostgreSQL proof

on:
  pull_request:
    paths:
      - 'migrations/229_f1_market_integrity_guards.sql'
      - 'migrations/scheduled/229_f1_market_integrity_guards.sql'
      - 'tests/integration/f1-market-integrity-destructive.test.js'
      - 'tests/unit/f1-market-integrity-migration.test.js'
      - '.github/workflows/f1b-market-integrity-postgres-proof.yml'

permissions:
  contents: read

jobs:
  postgres-proof:
    name: F1-B PostgreSQL destructive + concurrency proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-test-jwt-secret
      ADMIN_PASSWORD: ci-test-admin-password
      KOMERCE_DISABLE_CRONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build canonical CI database and apply active migrations
        run: |
          PGPASSWORD=komerce psql -h localhost -U komerce -d komerce_test -f docs/db/railway-live-schema.sql
          node scripts/ci-migrate.js
      - name: Run F1-B destructive and concurrency proof
        run: npx jest tests/integration/f1-market-integrity-destructive.test.js --ci --runInBand --forceExit
