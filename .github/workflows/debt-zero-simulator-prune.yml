name: Debt Zero simulator allowance prune

on:
  push:
    branches:
      - fix/debt-zero-simulator-ownership

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-zero-simulator-ownership
          fetch-depth: 0
      - name: Remove repaid simulator allowances
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = ['audit-backend-arch.js', 'scripts/audit-backend-arch.js'];
          for (const file of files) {
            let src = fs.readFileSync(file, 'utf8');
            const before = src;

            // The simulator no longer writes these protected tables/columns directly.
            src = src.replace(/^\s*'services\/simulator\/state-advancer\.js',\r?\n/gm, '');

            // Remove comments that described the retired direct-write exceptions.
            src = src.replace(/\s*\/\/ ── Chaos-testing — PAS de la prod paiement ─+\r?\n\s*\/\/ Pose volontairement des états incohérents\. Ne doit PAS passer par\r?\n\s*\/\/ payment-service\.js \(ce serait dénaturer le chaos-testing\)\.\r?\n/g, '\n');
            src = src.replace(/\s*\/\/ ── Chaos-testing — même raison que orders\.payment_status ci-dessus ─+\r?\n/g, '\n');
            src = src.replace(/\s*\/\/ ── Chaos-testing ─+\r?\n/g, '\n');

            // store_credits is legacy. No runtime service owns direct writes anymore;
            // modern refunds use wallet-service.
            src = src.replace("owners:  new Set(['services/store-credit-service.js']),", "owners:  new Set([]),");
            src = src.replace("remedy: 'Passer par services/store-credit-service.js',", "remedy: 'store_credits est legacy : passer par services/wallet-service.js ; aucun writer runtime direct autorisé',");

            if (src === before) throw new Error(`${file}: no Debt Zero allowance change applied`);
            fs.writeFileSync(file, src);
          }
          NODE
      - name: Remove temporary workflow and commit cleanup
        run: |
          rm .github/workflows/debt-zero-simulator-prune.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-backend-arch.js scripts/audit-backend-arch.js .github/workflows/debt-zero-simulator-prune.yml
          git diff --cached --check
          git commit -m "chore(governance): remove repaid simulator debt allowances"
          git push origin HEAD:fix/debt-zero-simulator-ownership
