name: tmp-subcategory-product-photo-v6b

on:
  push:
    branches:
      - feat/subcategory-photo-cutouts-v6

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[photo-v6 done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/subcategory-photo-cutouts-v6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Apply product-photo patch and final contract guards
        run: |
          python3 scripts/tmp-subcategory-product-photo-v6.py
          python3 scripts/tmp-subcategory-product-photo-v6-test-fix.py
          rm -f scripts/tmp-subcategory-product-photo-v6.py
          rm -f scripts/tmp-subcategory-product-photo-v6-test-fix.py
          rm -f .github/workflows/tmp-subcategory-product-photo-v6b.yml

      - name: Build canonical CSS bundles and guards
        run: npm run build

      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci

      - name: Targeted Boutique unit tests
        working-directory: public/boutique
        run: npx jest tests/unit/category-subcategory-continuity.test.js tests/unit/home-controller.test.js tests/unit/category-cutout-navigation.test.js --runInBand --forceExit

      - name: Boutique architecture and ownership gates
        run: |
          npm run boutique:audit
          npm run gate:boutique-ownership
          npm run feature:registry

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Chromium contract for every canonical subcategory
        working-directory: public/boutique
        run: |
          cat > tests/e2e/tmp-subcategory-product-photo-v6.spec.js <<'JS'
          const { test, expect } = require('@playwright/test');

          test.use({ viewport: { width: 1440, height: 900 } });

          test('all canonical subcategories render real catalog product media', async ({ page }) => {
            await page.goto('/');
            const result = await page.evaluate(async () => {
              document.body.innerHTML = '<main style="padding:20px"><div id="k-subcats-wrap"></div></main>';
              const [{ state }, schema, controller] = await Promise.all([
                import('/boutique/js/b-store.js'),
                import('/boutique/js/shop-schema.js'),
                import('/boutique/js/controllers/home-controller.js'),
              ]);
              const families = ['Mode & Beauté', 'Maison', 'Tech', 'Bricolage', 'Créations personnelles', 'Auto'];
              const categoryImage = {
                'Mode & Beauté': '/boutique/categories/cat-mode-v3.webp?v=1',
                'Maison': '/boutique/categories/cat-maison-v3.webp?v=1',
                'Tech': '/boutique/categories/cat-tech-v3.webp?v=1',
                'Bricolage': '/boutique/categories/cat-bricolage-v3.webp?v=1',
                'Créations personnelles': '/boutique/categories/cat-perso-v3.webp?v=1',
                'Auto': '/boutique/categories/cat-auto-v3.webp?v=1',
              };

              state.products = [];
              let seq = 0;
              for (const cat of families) {
                for (const sub of schema.getSubcategories(cat) || []) {
                  seq += 1;
                  state.products.push({
                    id: `fixture-${seq}`,
                    product_ref: `FIX-${String(seq).padStart(3, '0')}`,
                    category: cat,
                    subcategory: sub.key,
                    image_url: categoryImage[cat],
                    sort_order: seq,
                  });
                }
              }

              const counts = {};
              for (const cat of families) {
                controller.renderSubcatRail(cat, { count: 99 });
                const wrap = document.getElementById('k-subcats-wrap');
                const expected = (schema.getSubcategories(cat) || []).length;
                counts[cat] = {
                  expected,
                  buttons: wrap.querySelectorAll('.k-subcutout[data-shelf-media="product"]').length,
                  photos: wrap.querySelectorAll('img.k-shelf-product-photo').length,
                };
              }
              controller.renderSubcatRail('Auto', { count: 99 });
              return { counts, html: document.getElementById('k-subcats-wrap').innerHTML };
            });

            for (const [cat, counts] of Object.entries(result.counts)) {
              expect(counts.buttons, `${cat} product buttons`).toBe(counts.expected);
              expect(counts.photos, `${cat} product photos`).toBe(counts.expected);
            }
            expect(result.html).toContain('data-shelf-media="product"');
            await page.screenshot({ path: 'test-results/subcategory-product-photo-v6-1440.png', fullPage: true });
          });
          JS
          npx playwright test tests/e2e/tmp-subcategory-product-photo-v6.spec.js --project="Desktop Chrome" --workers=1
          rm -f tests/e2e/tmp-subcategory-product-photo-v6.spec.js

      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/js/render/category-shelf-visuals.js \
                  public/boutique/js/controllers/home-controller.js \
                  public/boutique/js/b-subcat.js \
                  public/boutique/css/interactions.css \
                  public/boutique/css/category-cutout-navigation-desktop.css \
                  public/boutique/css/dist \
                  public/boutique/index.html \
                  public/boutique/.cache-buster-state.json \
                  public/boutique/tests/unit/category-subcategory-continuity.test.js \
                  public/boutique/tests/unit/home-controller.test.js \
                  scripts/tmp-subcategory-product-photo-v6.py \
                  scripts/tmp-subcategory-product-photo-v6-test-fix.py \
                  .github/workflows/tmp-subcategory-product-photo-v6b.yml
          git commit -m "feat(boutique): use catalog photos for all subcategories [photo-v6 done]"
          git push origin HEAD:feat/subcategory-photo-cutouts-v6
