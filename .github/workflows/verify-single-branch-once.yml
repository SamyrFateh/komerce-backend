name: Verify Single Branch

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[branch-prune]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main as the only remote branch
        run: |
          set -euo pipefail
          branches=$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          printf 'Remote branches:\n%s\n' "$branches"
          test "$branches" = "main"

      - name: Remove verifier and land final state
        id: final
        run: |
          rm -f .github/workflows/verify-single-branch-once.yml
          git config user.name "Komerce Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(repo): confirm main-only repository [branch-prune]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish verified status
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        run: |
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"branch-prune\",\"description\":\"Only main remains\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
