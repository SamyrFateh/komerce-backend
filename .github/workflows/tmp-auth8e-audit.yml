name: Temporary AUTH-8e Bearer audit

on:
  push:
    branches: [auth/8e-bearer-boundary]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runtime Authorization and Bearer consumers
        shell: bash
        run: |
          set -u
          run_grep() {
            local pattern="$1"
            shift
            set +e
            git grep -n -I -E "$pattern" -- "$@"
            local status=$?
            set -e
            if [ "$status" -gt 1 ]; then
              echo "git grep failed with exit=$status" >&2
              exit "$status"
            fi
          }
          list_grep() {
            local pattern="$1"
            shift
            set +e
            git grep -l -I -E "$pattern" -- "$@"
            local status=$?
            set -e
            if [ "$status" -gt 1 ]; then exit "$status"; fi
          }

          echo '=== EXACT orders-by-phone / orders_read REFERENCES ==='
          run_grep '(orders-by-phone|orders_read)' . \
            ':(exclude).github/workflows/tmp-auth8e-audit.yml'

          echo '=== TEST FILES USING INBOUND BEARER ==='
          list_grep '(Authorization|authorization).{0,30}Bearer|Bearer.{0,30}(Authorization|authorization)' \
            tests public/boutique/tests public/dashboards || true

          echo '=== RUNTIME INBOUND AUTH HELPERS ==='
          run_grep '(readAuthToken|extractToken|headers\.authorization|req\.headers\.authorization)' \
            middleware routes utils server.js bootstrap \
            ':(exclude).github/workflows/tmp-auth8e-audit.yml'

          echo '=== OPERATIONAL SCRIPTS SENDING KOMERCE BEARER ==='
          run_grep '(authorization|Authorization).{0,50}Bearer|Bearer.{0,50}(token|TOKEN)' scripts \
            ':(exclude)scripts/audit-security-major.js'
