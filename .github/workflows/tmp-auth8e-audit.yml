name: Temporary AUTH-8e Bearer audit

# Certification trigger only; this helper is removed by the finalizer.
on:
  push:
    branches: [auth/8e-bearer-boundary]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runtime Authorization and Bearer consumers
        shell: bash
        run: |
          set -u
          run_grep() {
            local pattern="$1"
            shift
            set +e
            git grep -n -I -E "$pattern" -- "$@"
            local status=$?
            set -e
            if [ "$status" -gt 1 ]; then
              echo "git grep failed with exit=$status" >&2
              exit "$status"
            fi
          }

          echo '=== ALL RUNTIME JWT PRODUCERS / VERIFIERS ==='
          run_grep '(jwt\.sign|jwt\.verify|jsonwebtoken)' \
            routes middleware services utils bootstrap server.js \
            ':(exclude).github/workflows/tmp-auth8e-audit.yml'

          echo '=== TOKEN-TYPE-LIKE CLAIMS ==='
          run_grep '(scope|purpose|token_use|type:.*token|type.*magic|magic.*token)' \
            routes middleware services utils \
            ':(exclude).github/workflows/tmp-auth8e-audit.yml'

          echo '=== EXACT orders-by-phone / orders_read REFERENCES ==='
          run_grep '(orders-by-phone|orders_read)' . \
            ':(exclude).github/workflows/tmp-auth8e-audit.yml'

          echo '=== RUNTIME INBOUND AUTH HELPERS ==='
          run_grep '(readAuthToken|extractToken|headers\.authorization|req\.headers\.authorization)' \
            middleware routes utils server.js bootstrap \
            ':(exclude).github/workflows/tmp-auth8e-audit.yml'
