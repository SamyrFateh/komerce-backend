name: Temporary AUTH-8e Bearer audit

on:
  push:
    branches: [auth/8e-bearer-boundary]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runtime Authorization and Bearer consumers
        shell: bash
        run: |
          set -u
          run_grep() {
            local pattern="$1"
            shift
            set +e
            git grep -n -I -E "$pattern" -- "$@"
            local status=$?
            set -e
            if [ "$status" -gt 1 ]; then
              echo "git grep failed with exit=$status" >&2
              exit "$status"
            fi
          }

          echo '=== RUNTIME AUTHORIZATION / BEARER / readAuthToken ==='
          run_grep '(Authorization|authorization|Bearer|bearer|readAuthToken|extractToken)' \
            . \
            ':(exclude)docs/**' \
            ':(exclude)tests/**' \
            ':(exclude)public/boutique/tests/**' \
            ':(exclude)*.md' \
            ':(exclude).github/workflows/tmp-auth8e-audit.yml'

          echo '=== JWT / AUTHENTICATE CALL SITES ==='
          run_grep '(authenticate|requireAdmin|requireRole|jwt\.sign|jwt\.verify)' \
            routes middleware services utils public bootstrap server.js \
            ':(exclude)public/boutique/tests/**'
