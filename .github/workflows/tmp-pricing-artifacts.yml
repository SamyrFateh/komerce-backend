name: Temporary Pricing Artifact Refresh

on:
  push:
    branches:
      - feat/pricing-market-decision-policy

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ github.sha }}
      META_WA_APP_SECRET: ${{ github.sha }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pricing-market-decision-policy
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Refresh generated contract and security projections
        run: |
          node scripts/contract-generate.js
          npm run security:360

      - name: Commit generated projections if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contract/openapi.json docs/SECURITY_360.json docs/SECURITY_360.md docs/_generated/route-registry.json || true
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(governance): refresh pricing contract and security projections"
          git push origin HEAD:feat/pricing-market-decision-policy
