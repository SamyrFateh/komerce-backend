name: Debt Zero imports close

on:
  push:
    branches:
      - ci/debt-zero-imports-close

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure tooling
        uses: actions/checkout@v4
        with:
          ref: ci/debt-zero-imports-close
          path: tooling

      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: chore/debt-zero-imports
          path: product
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Boutique dependencies
        run: npm ci --prefix product/public/boutique

      - name: Patch and prove Debt Zero imports
        run: python3 tooling/scripts/debt-zero-imports-close-v2.py product

      - name: Commit verified product branch
        working-directory: product
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/scripts/check-js-imports.js \
                  public/boutique/tests/gates/check-js-imports-i4-consumers.test.js \
                  public/boutique/js/b-modal.js \
                  public/boutique/js/b-scroll-owner.js \
                  public/boutique/js/b-utils.js \
                  docs/GATE_FINDINGS.json docs/GATE_FINDINGS.md \
                  docs/FEATURE_360.json docs/FEATURE_360.md
          git diff --cached --check
          git commit -m "chore(boutique): close actionable import debt"
          git push origin HEAD:chore/debt-zero-imports
