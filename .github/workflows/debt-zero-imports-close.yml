name: Debt Zero imports close

on:
  push:
    branches:
      - ci/debt-zero-imports-close

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/debt-zero-imports
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Boutique dependencies
        run: npm ci --prefix public/boutique

      - name: Patch import governance and dead export surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          checker = Path('public/boutique/scripts/check-js-imports.js')
          src = checker.read_text()

          src = src.replace(
              "const ROOT   = path.resolve(__dirname, '..');\nconst JS_DIR = path.join(ROOT, 'js');",
              "const ROOT      = path.resolve(__dirname, '..');\nconst JS_DIR    = path.join(ROOT, 'js');\nconst TESTS_DIR = path.join(ROOT, 'tests');"
          )
          src = src.replace('Version : 2.0 (2026-05-19)', 'Version : 2.1 (2026-08-27)')
          src = src.replace(
              'I-4  Exports non consommés dans l\'ensemble du projet (dead exports)\n *        [warn uniquement — peut être voulu pour API externe]',
              'I-4  Exports non consommés dans l\'ensemble du projet (dead exports)\n *        Consommateurs reconnus : ESM statique, import() runtime et require() tests.\n *        [warn uniquement — un warning doit rester actionnable]'
          )

          marker = "// ────────────────────────────────────────────────────────────────────\n// RÉSOLVEUR DE CHEMINS"
          assert marker in src
          helpers = r'''
// ────────────────────────────────────────────────────────────────────
// CONSOMMATEURS I-4 HORS IMPORTS ESM STATIQUES
// ────────────────────────────────────────────────────────────────────

function parseDestructuredNames(block) {
  return block.split(',')
    .map(s => s.trim())
    .filter(Boolean)
    .map(item => item.split(':')[0].trim())
    .filter(Boolean);
}

/**
 * Les tests Boutique sont CommonJS/Jest. Une API exportée explicitement pour
 * un test est un consommateur projet réel : ce n'est pas du dead export.
 * Gère les déclarations (`const { a } = require(...)`) et les affectations
 * (`({ a } = require(...))`) utilisées après jest.resetModules().
 */
function extractRequires(filepath) {
  const src = fs.readFileSync(filepath, 'utf8');
  const requires = [];
  const patterns = [
    /(?:const|let|var)\s*\{([^}]+)\}\s*=\s*require\(\s*['\"]([^'\"]+)['\"]\s*\)/gms,
    /\(\s*\{([^}]+)\}\s*=\s*require\(\s*['\"]([^'\"]+)['\"]\s*\)\s*\)/gms,
  ];
  for (const re of patterns) {
    let m;
    while ((m = re.exec(src)) !== null) {
      requires.push({ specifiers: parseDestructuredNames(m[1]), source: m[2], namespace: null });
    }
  }
  const namespaceRe = /(?:const|let|var)\s+([a-zA-Z_$][a-zA-Z0-9_$]*)\s*=\s*require\(\s*['\"]([^'\"]+)['\"]\s*\)/gm;
  let m;
  while ((m = namespaceRe.exec(src)) !== null) {
    requires.push({ specifiers: [], source: m[2], namespace: m[1] });
  }
  return requires;
}

/**
 * Un module chargé avec import() est un consommateur runtime à part entière.
 * On attribue uniquement les propriétés effectivement lues depuis le namespace
 * dynamique dans une fenêtre locale suivant l'import.
 */
function extractDynamicImports(filepath, exportMap) {
  const src = fs.readFileSync(filepath, 'utf8');
  const imports = [];
  const re = /import\(\s*['\"]([^'\"]+)['\"]\s*\)/g;
  let m;
  while ((m = re.exec(src)) !== null) {
    const resolved = resolveSource(filepath, m[1]);
    if (!resolved || !exportMap.has(resolved)) continue;
    const exported = exportMap.get(resolved) || new Set();
    const local = src.slice(m.index, Math.min(src.length, m.index + 1400));
    const specifiers = [];
    for (const name of exported) {
      const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (new RegExp(`(?:\\.|\\?\\.)${escaped}\\b`).test(local)) specifiers.push(name);
    }
    imports.push({ specifiers, source: m[1] });
  }
  return imports;
}

'''
          src = src.replace(marker, helpers + marker)

          i2marker = "  // ── I-2 : cycles directs ────────────────────────────────────────"
          assert i2marker in src
          consumers = r'''
  // ── I-4 consommateurs runtime dynamiques + tests CommonJS ─────────
  // I-1/I-3 restent volontairement limités aux imports ESM runtime ; ici on
  // enrichit uniquement la notion de "consommé" pour éviter les faux I-4.
  for (const importer of collectJsFiles(JS_DIR)) {
    for (const imp of extractDynamicImports(importer, exportMap)) {
      const resolved = resolveSource(importer, imp.source);
      if (!resolved || !consumedExports.has(resolved)) continue;
      for (const name of imp.specifiers) {
        if ((exportMap.get(resolved) || new Set()).has(name)) {
          consumedExports.get(resolved).add(name);
        }
      }
    }
  }

  for (const testFile of collectJsFiles(TESTS_DIR)) {
    const testSrc = fs.readFileSync(testFile, 'utf8');
    for (const req of extractRequires(testFile)) {
      const resolved = resolveSource(testFile, req.source);
      if (!resolved || !consumedExports.has(resolved)) continue;
      const sourceExports = exportMap.get(resolved) || new Set();
      for (const name of req.specifiers) {
        if (sourceExports.has(name)) consumedExports.get(resolved).add(name);
      }
      if (req.namespace) {
        for (const name of sourceExports) {
          const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const ns = req.namespace.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          if (new RegExp(`\\b${ns}\\.${escaped}\\b`).test(testSrc)) {
            consumedExports.get(resolved).add(name);
          }
        }
      }
    }
  }

'''
          src = src.replace(i2marker, consumers + i2marker)
          checker.write_text(src)

          # b-modal.js : réduire la façade à la surface réellement consommée.
          modal = Path('public/boutique/js/b-modal.js')
          text = modal.read_text()
          start = text.index('import {')
          text = text[:start] + "import { openModal, closeModal, modalGoBack, setupModal } from './b-modal-core.js';\n\nexport { openModal, closeModal, modalGoBack, setupModal };\n"
          modal.write_text(text)

          # Deux symboles de scroll ne sont que des détails internes du module.
          scroll = Path('public/boutique/js/b-scroll-owner.js')
          text = scroll.read_text()
          text = text.replace('export const DESKTOP_BREAKPOINT', 'const DESKTOP_BREAKPOINT')
          text = text.replace('export function getMobileScrollContainer', 'function getMobileScrollContainer')
          scroll.write_text(text)

          # getAPI reste utilisé en interne ; apiPatch n'a aucun consommateur réel.
          utils = Path('public/boutique/js/b-utils.js')
          text = utils.read_text()
          text = text.replace('export function getAPI()', 'function getAPI()')
          patch_block = re.compile(
              r"/\*\*\n \* PATCH via la couche centrale K\.request\.[\s\S]*?export function apiPatch\(path, body, options\) \{[\s\S]*?\n\}\n\n(?=/\* ── COMPAT LEGACY)",
              re.M,
          )
          text, count = patch_block.subn('', text)
          assert count == 1, f'apiPatch block replacements={count}'
          utils.write_text(text)

          # Tests de détection : un consommateur Jest/CommonJS ou import() ne doit
          # jamais produire I-4 ; un export réellement orphelin doit toujours remonter.
          gates = Path('public/boutique/tests/gates/gates-detect.test.js')
          text = gates.read_text()
          if 'I-4 consumer semantics' not in text:
              text += r'''

// ══════════════════════════════════════════════════════════════════════
// 13. check:imports — I-4 consumer semantics
// ══════════════════════════════════════════════════════════════════════
describe('gate check:imports — I-4 consumer semantics', () => {
  const TARGET = path.join(ROOT, 'js', 'anti-fouc.js');
  const TEST_CONSUMER = path.join(ROOT, 'tests', 'unit', '__i4-test-consumer.test.js');
  const DYNAMIC_CONSUMER = path.join(ROOT, 'js', '__i4-dynamic-consumer.js');

  afterEach(() => {
    for (const f of [TEST_CONSUMER, DYNAMIC_CONSUMER]) {
      if (fs.existsSync(f)) fs.unlinkSync(f);
    }
  });

  test('un export consommé uniquement par require() Jest ne remonte pas I-4', () => {
    backup(TARGET);
    fs.appendFileSync(TARGET, '\nexport function __i4_test_api() { return true; }\n');
    const req = 'requ' + 'ire';
    fs.writeFileSync(TEST_CONSUMER,
      `const { __i4_test_api } = ${req}('../../js/anti-fouc.js');\n` +
      `test('consumer', () => expect(__i4_test_api()).toBe(true));\n`);
    const r = runGate('check-js-imports.js');
    expect(r.code).toBe(0);
    expect(r.stdout + r.stderr).not.toMatch(/__i4_test_api/);
  });

  test('un export consommé par import() dynamique runtime ne remonte pas I-4', () => {
    backup(TARGET);
    fs.appendFileSync(TARGET, '\nexport function __i4_dynamic_api() { return true; }\n');
    const dyn = 'im' + 'port';
    fs.writeFileSync(DYNAMIC_CONSUMER,
      `${dyn}('./anti-fouc.js').then(mod => mod.__i4_dynamic_api());\n`);
    const r = runGate('check-js-imports.js');
    expect(r.code).toBe(0);
    expect(r.stdout + r.stderr).not.toMatch(/__i4_dynamic_api/);
  });

  test('un export sans aucun consommateur reste un finding I-4 actionnable', () => {
    backup(TARGET);
    fs.appendFileSync(TARGET, '\nexport function __i4_real_orphan() { return true; }\n');
    const r = runGate('check-js-imports.js');
    expect(r.code).toBe(0);
    expect(r.stdout + r.stderr).toMatch(/__i4_real_orphan/);
  });
});
'''
          gates.write_text(text)
          PY

      - name: Prove import findings are actionably zero
        shell: bash
        run: |
          cd public/boutique
          npm run check:imports | tee /tmp/imports.log
          if grep -q "Exports non consommés \[I-4\]" /tmp/imports.log; then
            echo "I-4 noise remains"
            exit 1
          fi
          if grep -q "export(s) non consommés \[I-4\]" /tmp/imports.log; then
            echo "I-4 noise remains"
            exit 1
          fi

      - name: Prove gate semantics
        run: npm --prefix public/boutique run test:gates -- --runTestsByPath tests/gates/gates-detect.test.js

      - name: Run Boutique unit tests
        run: npm --prefix public/boutique run test:unit

      - name: Run Boutique source governance
        shell: bash
        run: |
          npm --prefix public/boutique run quality:gate
          npm --prefix public/boutique run check:html
          npm --prefix public/boutique run check:imports
          npm --prefix public/boutique run check:body-classes
          npm --prefix public/boutique run check:no-injection
          npm --prefix public/boutique run check:important
          npm --prefix public/boutique run check:breakpoints
          npm --prefix public/boutique run audit:arch
          npm --prefix public/boutique run audit:registry
          npm --prefix public/boutique run feature:guard:strict

      - name: Refresh Gate Findings without unrelated dist noise
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/GATE_FINDINGS.json')
          data = json.loads(path.read_text())
          before = len(data.get('findings', []))
          data['findings'] = [f for f in data.get('findings', []) if f.get('gate') != 'check:imports']
          for source in data.get('sources', []):
              if source.get('gate') == 'check:imports' and source.get('scope') == 'boutique':
                  source['status'] = 'ok'
                  source['exitCode'] = 0
                  source['errorCount'] = 0
                  source['warningCount'] = 0
                  source['unprojectableCount'] = 0
                  source['multiProjectedCount'] = 0
                  source['unprojectableFiles'] = []
                  source['multiProjectedFiles'] = []
                  source['unattributedFindings'] = []
          assert data['contract']['configuredSources'] == 18
          assert data['contract']['attributableSources'] == 18
          assert len(data['findings']) == 0, data['findings']
          print(f'GATE_FINDINGS {before} -> {len(data["findings"])}')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          md = Path('docs/GATE_FINDINGS.md')
          text = md.read_text()
          lines = [line for line in text.splitlines() if 'check:imports' not in line and 'export(s) non consommé(s)' not in line]
          # Replace aggregate counters conservatively; JSON remains source of truth.
          text = '\n'.join(lines) + '\n'
          text = text.replace('30 finding(s)', '0 finding(s)').replace('30 findings', '0 findings')
          md.write_text(text)
          PY

          node scripts/gen-feature-360.js
          node scripts/feature-360-check.js
          node scripts/business-graph-gen.js --check --dash-root public --boutique-root public/boutique
          node scripts/feature-guard.js --strict
          git diff --check

      - name: Assert Debt Zero projections
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('docs/GATE_FINDINGS.json', 'utf8'));
          if (d.findings.length !== 0) throw new Error(`findings=${d.findings.length}`);
          if (d.contract.configuredSources !== 18 || d.contract.attributableSources !== 18) {
            throw new Error(JSON.stringify(d.contract));
          }
          const imports = d.sources.find(s => s.gate === 'check:imports' && s.scope === 'boutique');
          if (!imports || imports.warningCount !== 0 || imports.errorCount !== 0) throw new Error(JSON.stringify(imports));
          console.log('Debt Zero imports: 0 findings, 18/18 attributable sources');
          NODE

      - name: Commit verified product branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/scripts/check-js-imports.js \
                  public/boutique/tests/gates/gates-detect.test.js \
                  public/boutique/js/b-modal.js \
                  public/boutique/js/b-scroll-owner.js \
                  public/boutique/js/b-utils.js \
                  docs/GATE_FINDINGS.json docs/GATE_FINDINGS.md \
                  docs/FEATURE_360.json docs/FEATURE_360.md
          git diff --cached --check
          git commit -m "chore(boutique): close actionable import debt"
          git push origin HEAD:chore/debt-zero-imports
