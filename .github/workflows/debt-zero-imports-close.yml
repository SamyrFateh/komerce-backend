name: Debt Zero imports close

on:
  push:
    branches:
      - ci/debt-zero-imports-close

permissions:
  contents: write

jobs:
  refresh-final-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: chore/debt-zero-imports
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate Business Feature Graph
        run: npm run business-graph:gen

      - name: Prove graph and canonical projections are fresh
        run: |
          npm run business-graph:check
          npm run feature:360:check
          node scripts/feature-guard.js --strict
          git diff --check

      - name: Commit final Debt Zero graph artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md
          git diff --cached --check
          git commit -m "chore(governance): refresh debt-zero business graph"
          git push origin HEAD:chore/debt-zero-imports
