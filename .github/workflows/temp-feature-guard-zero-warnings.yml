name: Temporary feature guard zero warnings

on:
  push:
    branches:
      - governance/feature-guard-zero-warnings

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/feature-guard-zero-warnings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply warning cleanup
        run: node scripts/temp-feature-guard-zero-warnings.js
      - name: Remove temporary tooling before canonical checks
        run: rm .github/workflows/temp-feature-guard-zero-warnings.yml scripts/temp-feature-guard-zero-warnings.js
      - name: Run five direct unit suites
        run: >-
          npx jest
          tests/unit/json-connector.test.js
          tests/unit/qr-collection-core.test.js
          tests/unit/payment-status-validator.test.js
          tests/unit/simulator-cleanup.test.js
          tests/unit/shared-cart-saved.test.js
          --runInBand
      - name: Prove Feature Guard has zero warnings
        shell: bash
        run: |
          node scripts/feature-guard.js --json > /tmp/feature-guard.json
          node - <<'NODE'
          const rows = require('/tmp/feature-guard.json');
          const errors = rows.flatMap(r => r.errors.map(x => `${r.name}: ${x}`));
          const warnings = rows.flatMap(r => r.warnings.map(x => `${r.name}: ${x}`));
          console.log(`Feature Guard: ${errors.length} error(s), ${warnings.length} warning(s)`);
          if (errors.length || warnings.length) {
            console.error({ errors, warnings });
            process.exit(1);
          }
          NODE
      - name: Refresh canonical governance projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Verify canonical gates
        shell: bash
        run: |
          npm run business-graph:check
          node scripts/business-graph-ratchet-check.js
          npm run feature:360:check
          node scripts/feature-guard.js --strict
          git diff --check
      - name: Commit final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(governance): eliminate feature guard warning debt"
          git push origin HEAD:governance/feature-guard-zero-warnings
