name: PDC4 Coverage Diagnostic

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coverage-diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique
        run: npm --prefix public/boutique ci --silent
      - name: Measure PDC-4 owners
        run: |
          cd public/boutique
          npx jest \
            tests/unit/b-modal-product-detail-mobile.test.js \
            tests/unit/b-cart-selection.test.js \
            tests/unit/b-modal-cart.test.js \
            --runInBand \
            --coverage \
            --collectCoverageFrom=js/b-modal-product-detail-mobile.js \
            --collectCoverageFrom=js/b-cart-selection.js \
            --collectCoverageFrom=js/b-modal-cart.js \
            --coverageReporters=json-summary \
            --coverageReporters=json \
            --coverageDirectory=.diag-coverage
      - name: Build uncovered report
        run: |
          cd public/boutique
          node - <<'NODE' > /tmp/pdc4-uncovered.json
          const fs = require('fs');
          const path = require('path');
          const raw = JSON.parse(fs.readFileSync('.diag-coverage/coverage-final.json', 'utf8'));
          const report = {};
          for (const [file, cov] of Object.entries(raw)) {
            const name = path.basename(file);
            const statementLines = [...new Set(Object.entries(cov.s)
              .filter(([, count]) => count === 0)
              .map(([id]) => cov.statementMap[id].start.line))]
              .sort((a, b) => a - b);
            const branchLines = [...new Set(Object.entries(cov.b)
              .filter(([, counts]) => counts.some((count) => count === 0))
              .map(([id]) => cov.branchMap[id].loc.start.line))]
              .sort((a, b) => a - b);
            report[name] = { statementLines, branchLines };
          }
          process.stdout.write(JSON.stringify(report, null, 2));
          NODE
      - name: Run touched-tests strict
        id: touched
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin feat/modal-selection-model-v1 --depth=1 --quiet
          set +e
          node scripts/touched-tests-gate.js --base origin/feat/modal-selection-model-v1 --strict > /tmp/pdc4-touched.log 2>&1
          code=$?
          tail -n 100 /tmp/pdc4-touched.log > /tmp/pdc4-touched-tail.log
          echo "$code" > /tmp/pdc4-touched-exit-code
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Comment measured coverage
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'public/boutique/.diag-coverage/coverage-summary.json';
            const summary = fs.existsSync(summaryPath)
              ? JSON.stringify(JSON.parse(fs.readFileSync(summaryPath, 'utf8')), null, 2)
              : 'coverage-summary.json absent';
            const uncovered = fs.existsSync('/tmp/pdc4-uncovered.json')
              ? fs.readFileSync('/tmp/pdc4-uncovered.json', 'utf8')
              : 'uncovered report absent';
            const touched = fs.existsSync('/tmp/pdc4-touched-tail.log')
              ? fs.readFileSync('/tmp/pdc4-touched-tail.log', 'utf8')
              : 'touched-tests non exécuté';
            const touchedCode = fs.existsSync('/tmp/pdc4-touched-exit-code')
              ? fs.readFileSync('/tmp/pdc4-touched-exit-code', 'utf8').trim()
              : '?';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## PDC-4 detailed coverage\n\n### Measured coverage\n\n\`\`\`json\n${summary}\n\`\`\`\n\n### Uncovered lines\n\n\`\`\`json\n${uncovered}\n\`\`\`\n\n### touched-tests --strict — exit ${touchedCode}\n\n\`\`\`text\n${touched}\n\`\`\``
            });
      - name: Preserve touched-tests failure
        if: steps.touched.outputs.code != '0'
        run: exit 1
