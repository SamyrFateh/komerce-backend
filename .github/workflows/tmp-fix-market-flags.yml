name: Temporary market flags
on:
  push:
    branches: [fix/market-flags-real]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/tmp_fix_market_flags.py
      - run: npx jest tests/unit/canonical-navigation.test.js tests/unit/canonical-admin-app.test.js --runInBand
      - run: npx jest tests/unit/canonical-*.test.js --runInBand
      - name: Commit result
        shell: bash
        run: |
          git rm .github/workflows/tmp-fix-market-flags.yml scripts/tmp_fix_market_flags.py
          git add public/dashboards/canonical/js/navigation.js \
                  public/dashboards/canonical/css/navigation.css \
                  public/dashboards/canonical/index.html \
                  public/dashboards/canonical/access.html \
                  public/dashboards/canonical/market-autonomy.html \
                  tests/unit/canonical-navigation.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(admin): afficher de vrais drapeaux Market ID"
          git push origin HEAD:fix/market-flags-real
