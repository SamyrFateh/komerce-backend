name: Temporary AUTH governance closure

on:
  push:
    branches:
      - auth/close-passkey-governance

permissions:
  contents: write

jobs:
  close-auth-governance:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth/close-passkey-governance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply AUTH governance closure
        run: node scripts/temp-auth-governance-close.js

      - name: Targeted Passkey tests
        run: npx jest --config jest.unit.config.js --runInBand --no-coverage tests/unit/webauthn-service.test.js tests/unit/webauthn-management-service.test.js tests/unit/auth-passkey.test.js tests/unit/auth-passkey-management.test.js tests/unit/auth-passkey-step-up.test.js tests/unit/require-recent-auth.test.js

      - name: Passkey feature guard
        run: node scripts/feature-guard.js --feature auth-passkey --strict

      - name: Registry bijection
        run: node scripts/registry-doc-check.js --strict

      - name: Refresh canonical projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen

      - name: Verify refreshed projections
        run: |
          npm run business-graph:check
          npm run feature:360:check
          node scripts/registry-doc-check.js --strict
          node scripts/feature-guard.js --feature auth-passkey --strict
          git diff --check

      - name: Commit generated closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix(governance): close passkey registry gaps"
          git push origin HEAD:auth/close-passkey-governance
