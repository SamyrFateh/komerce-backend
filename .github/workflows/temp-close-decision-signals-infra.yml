name: Temporary close decision-signals infrastructure seam

on:
  push:
    branches:
      - governance/close-decision-signals-infra

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/close-decision-signals-infra
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove temporary workflow from checked tree
        run: rm .github/workflows/temp-close-decision-signals-infra.yml
      - name: Refresh governance projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Prove seam closure and gates
        run: |
          node - <<'NODE'
          const g = require('./docs/BUSINESS_FEATURE_GRAPH.json');
          const debt = g.drifts.debt || [];
          const deps = debt.filter(x => x.type === 'OBSERVED-UNDECLARED-FEATURE-DEPENDENCY');
          if (debt.length !== 29) throw new Error(`expected 29 total debt, got ${debt.length}`);
          if (deps.length !== 3) throw new Error(`expected 3 dependency debt, got ${deps.length}`);
          if (deps.some(x => x.ref === 'decision-signals -> infrastructure')) throw new Error('decision-signals infrastructure seam still present');
          if ((g.drifts.warn || []).length !== debt.length) throw new Error('warning stream polluted');
          console.log('DECISION_SIGNALS_INFRA_CLOSED');
          NODE
          npm run business-graph:ratchet-check
          npm run feature:check
          npm run feature:360:check
          git diff --check
      - name: Commit generated projections
        run: |
          git checkout HEAD -- .github/workflows/temp-close-decision-signals-infra.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md docs/FEATURE_360.json docs/FEATURE_360.md docs/GATE_FINDINGS.json docs/GATE_FINDINGS.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'chore(governance): refresh decision-signals projections'
            git push origin HEAD:governance/close-decision-signals-infra
          fi
