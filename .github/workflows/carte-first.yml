name: Carte First

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  statuses: write

concurrency:
  group: carte-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Carte-first governance
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install boutique dependencies
        if: github.event_name == 'pull_request'
        run: npm --prefix public/boutique ci

      - name: Touched files ownership
        if: github.event_name == 'pull_request'
        run: npm run gate:touched-files

      - name: Plan d'attaque PR (body)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-governance-check.js

      - name: Code touché ↔ signal test (touched-tests, strict)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          node scripts/touched-tests-gate.js --base origin/${{ github.base_ref }} --strict

      - name: Feature card schema
        run: npm run gate:schema

      - name: Docs history lint
        run: npm run gate:docs-lint

      - name: Feature audit
        run: npm run gate:feature-audit

      - name: Map reconstruction
        run: npm run map:check

  p3b-closure:
    name: P3b closure 18/18
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[p3b-generated]')
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Reconcile removed root prompt
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'features/infrastructure.feature.js';
          const before = fs.readFileSync(file, 'utf8');
          const after = before.replace("      'PROMPT_AUDIT_PREGOLIVE.md',\n", '');
          if (after === before) {
            throw new Error('PROMPT_AUDIT_PREGOLIVE.md reference not found exactly once');
          }
          fs.writeFileSync(file, after);
          NODE

      - name: Reconcile Boutique composition-root ownership
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'features/platform-ops.feature.js';
          const before = fs.readFileSync(file, 'utf8');
          let after = before.replace("      'js/main.js',\n", '');
          const marker = '  files: {\n';
          const block = "  files: {\n    compositionRoots: [\n      'public/boutique/js/main.js',\n      'public/boutique/js/boutique.js',\n      'public/boutique/js/b-nav.js',\n    ],\n";
          if (after === before || !after.includes(marker) || after.includes('compositionRoots:')) {
            throw new Error('platform-ops composition-root reconciliation precondition failed');
          }
          after = after.replace(marker, block);
          fs.writeFileSync(file, after);
          NODE

      - name: Regenerate dependent architecture maps
        run: |
          set -o pipefail
          npm run arch:gen 2>&1 | tee p3b-arch-gen.log
          npm run boutique:360 2>&1 | tee p3b-boutique-gen.log
          npm run business-graph:gen 2>&1 | tee p3b-business-gen.log
          npm run meta:graph 2>&1 | tee p3b-meta-gen.log
          npm run feature:360:gen 2>&1 | tee p3b-feature-gen.log

      - name: Verify Feature 360
        run: |
          set -o pipefail
          npm run feature:360:check 2>&1 | tee p3b-feature-check.log

      - name: Verify full governance map
        run: |
          set -o pipefail
          npm run map:check 2>&1 | tee p3b-map-check.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p3b-closure-logs-${{ github.run_id }}
          path: |
            p3b-*.log
            docs/BUSINESS_FEATURE_GRAPH.json
            docs/O6_INVENTORY.md
            docs/FEATURE_360.json
          if-no-files-found: warn
          retention-days: 1

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"p3b-closure\",\"description\":\"P3b closure failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"p3b-closure\",\"description\":\"18/18 sources and map-check passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Commit reconciled sources and generated artifacts
        if: success()
        run: |
          rm -f p3b-*.log
          git config user.name "Komerce Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No generated delta"
          else
            git commit -m "chore(p3b): reconcile sources and regenerate maps [p3b-generated]"
            git push origin HEAD:main
          fi
