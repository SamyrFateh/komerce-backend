name: Carte First

on:
  pull_request:
  push:
    branches: [ main, master ]

concurrency:
  group: carte-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Carte-first governance
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install boutique dependencies
        if: github.event_name == 'pull_request'
        run: npm --prefix public/boutique ci

      - name: Touched files ownership
        if: github.event_name == 'pull_request'
        run: npm run gate:touched-files

      # ── Gate : body PR contient un plan d'attaque structuré ──────────────
      - name: Plan d'attaque PR (body)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-governance-check.js

      # ── Gate : fichiers applicatifs touchés ↔ signal test ───────────────
      # --strict active la règle de complétion au contact (QUALITY_PYRAMID_DOCTRINE.md
      # Niveau 3.1) : si un fichier ET son test sont touchés, la couverture doit
      # atteindre le seuil cible (governance/coverage-thresholds.json), pas juste
      # "un test existe". Le gate sélectionne le Jest du workspace concerné
      # (backend racine ou public/boutique) — d'où l'install boutique ci-dessus.
      - name: Code touché ↔ signal test (touched-tests, strict)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          node scripts/touched-tests-gate.js --base origin/${{ github.base_ref }} --strict

      - name: Feature card schema
        run: npm run gate:schema

      - name: Docs history lint
        run: npm run gate:docs-lint

      - name: Feature audit
        run: npm run gate:feature-audit

      - name: Map reconstruction
        run: npm run map:check
