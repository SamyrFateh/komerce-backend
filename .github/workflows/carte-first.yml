name: Carte First

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  statuses: write

concurrency:
  group: carte-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Carte-first governance
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install boutique dependencies
        if: github.event_name == 'pull_request'
        run: npm --prefix public/boutique ci

      - name: Touched files ownership
        if: github.event_name == 'pull_request'
        run: npm run gate:touched-files

      - name: Plan d'attaque PR (body)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-governance-check.js

      - name: Code touché ↔ signal test (touched-tests, strict)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          node scripts/touched-tests-gate.js --base origin/${{ github.base_ref }} --strict

      - name: Feature card schema
        run: npm run gate:schema

      - name: Docs history lint
        run: npm run gate:docs-lint

      - name: Feature audit
        run: npm run gate:feature-audit

      - name: Map reconstruction
        run: npm run map:check

  p3b-closure:
    name: P3b closure 18/18
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[p3b-generated]')
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci

      - name: Generate Feature 360
        run: |
          set -o pipefail
          npm run feature:360:gen 2>&1 | tee p3b-feature-gen.log

      - name: Verify Feature 360
        run: |
          set -o pipefail
          npm run feature:360:check 2>&1 | tee p3b-feature-check.log

      - name: Verify full governance map
        run: |
          set -o pipefail
          npm run map:check 2>&1 | tee p3b-map-check.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p3b-closure-logs-${{ github.run_id }}
          path: p3b-*.log
          if-no-files-found: warn
          retention-days: 1

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"p3b-closure\",\"description\":\"P3b closure failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Commit generated artifacts
        if: success()
        run: |
          rm -f p3b-*.log
          git config user.name "Komerce Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/GATE_FINDINGS.json docs/FEATURE_360.json docs/FEATURE_360.md docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/BOUTIQUE_360.json docs/BOUTIQUE_360.md docs/META_GRAPH.json docs/META_GRAPH.md
          if git diff --cached --quiet; then
            echo "No generated delta"
          else
            git commit -m "chore(p3b): regenerate closure artifacts [p3b-generated]"
            git push origin HEAD:main
          fi

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"p3b-closure\",\"description\":\"18/18 sources and map-check passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
