name: Carte First

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: carte-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Carte-first governance
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install boutique dependencies
        run: npm --prefix public/boutique ci

      - name: Require a merged PR for every main update
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          associated_prs=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          merged_count=$(printf '%s' "$associated_prs" | jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          if [ "$merged_count" -lt 1 ]; then
            echo "::error::Mise à jour directe de main détectée. Toute modification doit passer par une pull request fusionnée."
            exit 1
          fi

      - name: Touched files ownership (PR)
        if: github.event_name == 'pull_request'
        run: npm run gate:touched-files

      - name: Touched files ownership (main push)
        if: github.event_name == 'push'
        run: node scripts/touched-files-feature-gate.js --base ${{ github.event.before }}

      - name: Plan d'attaque PR (body)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-governance-check.js

      - name: Code touché ↔ signal test (PR, strict)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          node scripts/touched-tests-gate.js --base origin/${{ github.base_ref }} --strict

      - name: Code touché ↔ signal test (main push, strict)
        if: github.event_name == 'push'
        run: node scripts/touched-tests-gate.js --base ${{ github.event.before }} --strict

      - name: Feature card schema
        run: npm run gate:schema

      - name: Docs history lint
        run: npm run gate:docs-lint

      - name: Feature audit
        run: npm run gate:feature-audit

      - name: Map reconstruction
        run: npm run map:check
