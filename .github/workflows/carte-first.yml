name: Carte First

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: carte-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Carte-first governance
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: PR governance body
        if: github.event_name == 'pull_request'
        run: npm run gate:pr-governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Touched files ownership
        if: github.event_name == 'pull_request'
        run: npm run gate:touched-files

      - name: Touched tests signal
        if: github.event_name == 'pull_request'
        run: npm run gate:touched-tests
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Feature card schema
        run: npm run gate:schema

      - name: Docs history lint
        run: npm run gate:docs-lint

      - name: Feature audit
        run: npm run gate:feature-audit

      - name: Map reconstruction
        run: npm run map:check

  wire-shipment-allocation-once:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/transport-rail-doctrine-audit' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transport-rail-doctrine-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Patch shipment allocation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/cost-allocation/allocate.js')
          s = p.read_text()
          s = s.replace("const { shareByWeight } = require('./_helpers');", "const { shareByWeight } = require('./_helpers');\nconst { allocateTransportCost } = require('../transport-cost-allocation');")
          s = s.replace("async function allocateShipmentRealCosts(shipmentId, dbClient = null) {", "async function allocateShipmentRealCosts(shipmentId, dbClient = null, options = {}) {")
          start = s.index("    // Pour freight : le poids ne fait PAS partie de l'équation en maritime")
          end = s.index('\n\n    // 5. Pour chaque parcel', start)
          s = s[:start] + '''    // Freight explicite : consommer le contrat transport-cost-allocation.
    // Sans rail explicite, le comportement legacy reste identifie et n'est jamais
    // converti silencieusement en SEA_STANDARD.
    const transportMode = String(ship.transport_mode || '').trim().toLowerCase();
    const transportRail = transportMode === 'sea' ? 'SEA_STANDARD' : transportMode === 'air' ? 'AIR_EXPRESS' : null;
    const parcelFreightEntries = parcels.map(p => ({
      id: p.parcel_id,
      actual_weight_kg: Number(p.parcel_weight_kg) || 0,
      volume_m3: (Number(p.parcel_volume_cm3) || 0) / 1_000_000,
    }));
    let freightSharesArr;
    let freightAllocationMethod;
    let freightConfidence;
    if (transportRail) {
      freightSharesArr = allocateTransportCost({
        total: totalFreight,
        transport_rail: transportRail,
        component: 'FREIGHT',
        entries: parcelFreightEntries,
        options: options.transport_cost_allocation || {},
      });
      const hasVolumeSignal = parcelFreightEntries.some(entry => entry.volume_m3 > 0);
      freightAllocationMethod = transportRail === 'AIR_EXPRESS' ? 'by_taxable_weight' : hasVolumeSignal ? 'by_volume' : 'estimated_fallback';
      freightConfidence = freightAllocationMethod === 'estimated_fallback' ? 'low' : 'high';
    } else {
      freightSharesArr = shareByWeight(totalFreight, parcels.map(p => ({ id: p.parcel_id, weight: Number(p.parcel_weight_kg) || 0 })));
      freightAllocationMethod = 'by_weight';
      freightConfidence = 'high';
    }
    const freightShares = freightSharesArr.map(s => ({ parcel_id: s.id, freight_share: s.share }));''' + s[end:]
          start2 = s.index('      // Eclater freight par volume si dispo (maritime), sinon répartition égale')
          end2 = s.index('\n\n      // INSERT pour chaque order_item', start2)
          s = s[:start2] + '''      // Projection parcel -> order_items avec la meme cle economique par rail.
      let freightSplit;
      if (transportRail) {
        freightSplit = allocateTransportCost({
          total: freightShare,
          transport_rail: transportRail,
          component: 'FREIGHT',
          entries: items.map(it => ({
            id: it.order_item_id,
            actual_weight_kg: (Number(it.weight_kg) || 0) * (Number(it.parcel_qty) || 1),
            volume_m3: ((Number(it.volume_cm3) || 0) * (Number(it.parcel_qty) || 1)) / 1_000_000,
          })),
          options: options.transport_cost_allocation || {},
        });
      } else {
        freightSplit = shareByWeight(freightShare, items.map(it => ({ id: it.order_item_id, weight: (Number(it.weight_kg) || 0) * (Number(it.parcel_qty) || 1) })));
      }''' + s[end2:]
          p.write_text(s)

          tp = Path('tests/unit/cost-allocation-allocate.test.js')
          t = tp.read_text()
          marker = "  it('maritime sans volume snapshoté (legacy) → répartition égale, PAS par poids', async () => {"
          if 'AIR explicite sans calibration bloque avant persistance freight' not in t:
            tests = '''  it('AIR explicite sans calibration bloque avant persistance freight', async () => {
    const shipment = { id: 'ship-air', customs_paid_kmf: '0', freight_kmf: '1000', allocation_method: 'by_cif_value', transport_mode: 'air' };
    const parcel = { parcel_id: 'parcel-air', order_id: 'order-air', parcel_cif_kmf: '1000', parcel_weight_kg: '2', parcel_volume_cm3: '12000', customs_share_kmf: null };
