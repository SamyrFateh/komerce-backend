name: Autopilot projections refresh once

on:
  push:
    branches:
      - feat/sourcing-source-autopilot

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'chore(generated): refresh autopilot projections') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sourcing-source-autopilot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Patch canonical contract generator for Source ON/OFF
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'scripts/contract-generate.js';
          let s = fs.readFileSync(p, 'utf8');

          const routeAnchor = "  { prefix: '/api/admin/workspaces/sourcing/suppliers/{partnerRef}/activate', method: 'post', schema: null },\n";
          const routeInsert = routeAnchor +
            "  { prefix: '/api/admin/workspaces/sourcing/sources/{sourceRef}/activate', method: 'post', schema: null },\n" +
            "  { prefix: '/api/admin/workspaces/sourcing/sources/{sourceRef}/deactivate', method: 'post', schema: null },\n";
          if (!s.includes("/api/admin/workspaces/sourcing/sources/{sourceRef}/activate")) {
            if (!s.includes(routeAnchor)) throw new Error('route anchor missing');
            s = s.replace(routeAnchor, routeInsert);
          }

          const getOld = "get: { fields: ['scope','summary','portfolio','imports','candidates','suppliers','connectors'], source: 'test' }";
          const getNew = "get: { fields: ['scope','summary','portfolio','imports','candidates','suppliers','connectors','sources'], source: 'test' }";
          if (s.includes(getOld)) s = s.replace(getOld, getNew);

          const responseAnchor = "  '/api/admin/workspaces/sourcing/suppliers/{partnerRef}/activate': {\n    post: { fields: ['ok','action','result'], source: 'test' }\n  },\n";
          if (!s.includes("'/api/admin/workspaces/sourcing/sources/{sourceRef}/activate'")) {
            if (!s.includes(responseAnchor)) throw new Error('response anchor missing');
            s = s.replace(responseAnchor, responseAnchor +
              "  '/api/admin/workspaces/sourcing/sources/{sourceRef}/activate': {\n    post: { fields: ['ok','action','result'], source: 'test' }\n  },\n" +
              "  '/api/admin/workspaces/sourcing/sources/{sourceRef}/deactivate': {\n    post: { fields: ['ok','action','result'], source: 'test' }\n  },\n");
          }

          fs.writeFileSync(p, s);

          const schema = 'docs/SCHEMA.md';
          let d = fs.readFileSync(schema, 'utf8');
          d = d.replace('distinct des faits économiques. **Migration 208', 'distinct de market_delegation_audit. **Migration 208');
          fs.writeFileSync(schema, d);
          NODE
      - name: Regenerate canonical contract and security projections
        run: |
          npm run contract:generate
          npm run security:360
          node scripts/contract-check.js
          npm run security:360:check
      - name: Commit generated truth and remove this one-shot workflow
        run: |
          git rm .github/workflows/autopilot-projections-refresh-once.yml
          git add scripts/contract-generate.js docs/contract/openapi.json docs/contract/DEBT.md docs/SECURITY_360.json docs/SECURITY_360.md docs/SCHEMA.md
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(generated): refresh autopilot projections'
          git push origin HEAD:feat/sourcing-source-autopilot
