name: Temporary pricing initial refresh no-flash
on:
  push:
    branches: [fix/pricing-initial-refresh-no-flash]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: python3 scripts/tmp_fix_pricing_initial_refresh_flash.py
      - run: npx jest tests/unit/canonical-pricing-economic-cockpit.test.js tests/unit/canonical-admin-app.test.js --runInBand
      - run: npx jest tests/unit/canonical-*.test.js tests/unit/admin-*.test.js --runInBand
      - name: Commit result
        run: |
          rm scripts/tmp_fix_pricing_initial_refresh_flash.py
          rm .github/workflows/tmp-fix-pricing-initial-refresh-no-flash.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(admin): supprimer le flash initial de l ancien cockpit pricing'
          git push origin HEAD:fix/pricing-initial-refresh-no-flash
