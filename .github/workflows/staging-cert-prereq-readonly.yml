name: Staging certification — prerequis par marche (lecture seule)

# Aucune ecriture : transaction READ ONLY, aucun writer metier, aucun secret en sortie.
# Declenchement : workflow_dispatch uniquement.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'SHA complet attendu sur /health/version (optionnel)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: komerce-staging-cert-prereq-readonly
  cancel-in-progress: false

jobs:
  prereq:
    name: Prerequis certification (READ ONLY)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      E2E_EXPECTED_DEPLOY_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Secret present
        shell: bash
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo '::error::RAILWAY_DATABASE_URL manque'; exit 1; fi
      - name: Prerequis par marche (READ ONLY)
        run: node scripts/recette/staging-cert-prereq-readonly.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-cert-prereq-${{ github.run_id }}
          path: test-results/cert-prereq/prereq-readonly.json
          if-no-files-found: warn
