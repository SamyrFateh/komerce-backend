name: Staging certification — prerequis par marche (lecture seule)

# Aucune ecriture : transaction READ ONLY, aucun writer metier, aucun secret en sortie.
# Declenchement : workflow_dispatch uniquement.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'SHA complet attendu sur /health/version (optionnel)'
        required: false
        default: ''
      order360:
        description: 'Also verify existing KM/CM/CG recipe Order 360 through Chromium (read only)'
        type: boolean
        required: false
        default: false
      fixture_inventory:
        description: 'Inventory existing campaign fixtures and login/relay eligibility metadata (no secret values, READ ONLY)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: komerce-staging-cert-prereq-readonly
  cancel-in-progress: false

jobs:
  prereq:
    name: Prerequis certification (READ ONLY)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      E2E_EXPECTED_DEPLOY_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Secret present
        shell: bash
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo '::error::RAILWAY_DATABASE_URL manque'; exit 1; fi
      - name: Prerequis par marche (READ ONLY)
        env:
          G6_A_FIXTURE_INVENTORY: ${{ inputs.fixture_inventory && 'true' || 'false' }}
          E2E_AGENT_RELAIS_EMAIL: ${{ secrets.E2E_AGENT_RELAIS_EMAIL }}
        run: node scripts/recette/staging-cert-prereq-readonly.js
      - name: Install Chromium for optional Order 360 proof
        if: inputs.order360
        run: npx playwright install --with-deps chromium
      - name: Order 360 via admin login UI and independent PostgreSQL (READ ONLY)
        if: inputs.order360
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_AGENT_RELAIS_EMAIL: ${{ secrets.E2E_AGENT_RELAIS_EMAIL }}
          E2E_AGENT_RELAIS_PASSWORD: ${{ secrets.E2E_AGENT_RELAIS_PASSWORD }}
        run: node scripts/recette/g6-a-order360-readonly.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-cert-prereq-${{ github.run_id }}
          path: |
            test-results/cert-prereq/prereq-readonly.json
            test-results/g6-a-order360/
          if-no-files-found: warn
