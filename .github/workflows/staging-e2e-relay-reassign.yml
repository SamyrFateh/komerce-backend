name: Staging E2E — reaffecter le compte agent_relais E2E (scope reversible)

# Dry-run par defaut. Ecriture : users.relais_id du SEUL compte E2E agent_relais, via assignAgentRelais.
# Retour arriere : mode restore + restore_relay_id (relais E2E d'origine, releve dans le rapport relais_before).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run-to-fixture | to-fixture | restore'
        required: true
        default: dry-run-to-fixture
        type: choice
        options: [dry-run-to-fixture, to-fixture, restore]
      run8:
        description: 'RUN8 de la fixture (to-fixture)'
        required: false
        default: ''
      restore_relay_id:
        description: 'UUID du relais a restaurer (restore)'
        required: false
        default: ''
      confirmation:
        description: 'Ecriture uniquement : saisir exactement REASSIGN-E2E-RELAY'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: komerce-staging-e2e-relay-reassign
  cancel-in-progress: false

jobs:
  reassign:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      E2E_AGENT_RELAIS_EMAIL: ${{ secrets.E2E_AGENT_RELAIS_EMAIL }}
      RELAY_MODE: ${{ inputs.mode }}
      RELAY_RUN8: ${{ inputs.run8 }}
      RELAY_RESTORE_ID: ${{ inputs.restore_relay_id }}
      RELAY_CONFIRMATION: ${{ inputs.confirmation }}
      RELAY_APPLY: ${{ inputs.mode != 'dry-run-to-fixture' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reaffectation (dry-run sauf confirmation exacte)
        run: node scripts/recette/staging-e2e-relay-reassign.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-e2e-relay-reassign-${{ github.run_id }}
          path: test-results/relay-reassign/report.json
          if-no-files-found: warn
