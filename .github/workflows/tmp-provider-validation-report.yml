name: tmp-provider-validation-report
on:
  push:
    branches:
      - feat/market-delegation-provider-v2
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Capture validation outputs
        run: |
          set +e
          npx jest --runInBand \
            tests/unit/providers-service.test.js \
            tests/unit/provider-status-mutation-service.test.js \
            tests/unit/market-delegation-provider-service.test.js \
            tests/unit/market-delegation-provider-routes.test.js \
            tests/unit/market-delegation-p0.test.js \
            tests/unit/market-delegation-team-ui.test.js \
            tests/unit/market-delegation-cash-control-routes.test.js \
            > /tmp/tests.txt 2>&1
          TEST_STATUS=$?
          node scripts/capability-registry-check.js > /tmp/registry.txt 2>&1
          REGISTRY_STATUS=$?
          node scripts/gen-security-360.js > /tmp/security.txt 2>&1
          SECURITY_STATUS=$?
          {
            echo "provider-review-validation"
            echo "tests_status=$TEST_STATUS"
            echo "registry_status=$REGISTRY_STATUS"
            echo "security_status=$SECURITY_STATUS"
            echo
            echo "=== JEST ==="
            cat /tmp/tests.txt
            echo
            echo "=== CAPABILITY REGISTRY ==="
            cat /tmp/registry.txt
            echo
            echo "=== SECURITY 360 ==="
            cat /tmp/security.txt
          } > tmp-provider-review-validation.txt
          exit 0
      - name: Commit report and remove diagnostic workflow
        run: |
          rm .github/workflows/tmp-provider-validation-report.yml
          git config user.name provider-review-bot
          git config user.email provider-review-bot@users.noreply.github.com
          git add -A
          git commit -m "test(provider): capturer la validation de revue"
          git push origin HEAD:feat/market-delegation-provider-v2
