# Owner-only inventory of the *live* staging reset scope. Absolutely no mutation:
# --dry-run, scope prudent, simulate=0. This does NOT certify RUN8 selective deletion.
name: Staging — cleanup readiness (READ ONLY)
on:
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: komerce-staging-cleanup-readiness
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect actual staging cleanup scope (no writes)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == '[staging-op] staging-cleanup-readiness')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      KOMERCE_STAGING_RESET_MODE: prudent
      KOMERCE_STAGING_RESET_SIMULATE: '0'
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      KOMERCE_STAGING_RESET_DB_PIN: ${{ vars.STAGING_DB_PIN }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Require staging-only secret and DB pin
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "::error::RAILWAY_DATABASE_URL missing"; exit 2; }
          test -n "${KOMERCE_STAGING_RESET_DB_PIN:-}" || { echo "::error::STAGING_DB_PIN missing"; exit 2; }
      - name: Verify staging target identity
        run: node scripts/recette/target-guard.js
      - name: Read-only dry-run on exact live staging DB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/staging-cleanup-readiness
          node scripts/recette/staging-reset.js --dry-run | tee test-results/staging-cleanup-readiness/report.json
      - name: Archive evidence even on HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-cleanup-readiness-${{ github.run_id }}
          path: test-results/staging-cleanup-readiness/
          if-no-files-found: warn
          retention-days: 30
