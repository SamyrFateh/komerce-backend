name: Lot 8 finalize once

on:
  push:
    branches:
      - test/lot8-pre-go-live-certification

permissions:
  contents: write

concurrency:
  group: lot8-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/lot8-pre-go-live-certification
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            public/boutique/package-lock.json

      - run: npm ci
      - run: npm --prefix public/boutique ci

      - name: Make countdown proof deterministic
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/boutique/tests/unit/group-helpers.test.js';
          const source = fs.readFileSync(path, 'utf8');
          const before = `  it('format en heures+minutes si >= 1h et < 48h', () => {\n    const result = timeRemaining(new Date(Date.now() + (2 * 3_600_000 + 30 * 60_000)));\n    expect(result).toBe('2h30min restantes');\n  });`;
          const after = `  it('format en heures+minutes si >= 1h et < 48h', () => {\n    const fixedNow = Date.parse('2026-08-01T12:00:00.000Z');\n    const nowSpy = jest.spyOn(Date, 'now').mockReturnValue(fixedNow);\n    try {\n      const result = timeRemaining(new Date(fixedNow + (2 * 3_600_000 + 30 * 60_000)));\n      expect(result).toBe('2h30min restantes');\n    } finally {\n      nowSpy.mockRestore();\n    }\n  });`;
          if (!source.includes(before)) throw new Error('Countdown test anchor not found');
          fs.writeFileSync(path, source.replace(before, after));
          NODE

      - name: Verify deterministic Boutique coverage
        working-directory: public/boutique
        run: npx jest tests/unit/group-helpers.test.js --runInBand --coverage

      - name: Refresh and verify API contract
        run: |
          npm run contract:generate
          node scripts/contract-check.js

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/lot8-finalize-once.yml

      - name: Commit qualified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "fix: stabilize Lot 8 certification proofs"
          git push origin HEAD:test/lot8-pre-go-live-certification
