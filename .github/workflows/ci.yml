name: CI technique manuelle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Tests unitaires backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx jest --config jest.unit.config.js --ci --runInBand --forceExit

  integration:
    name: Tests intégration backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce -d komerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://komerce:komerce@localhost:5432/komerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Charger le schéma canonique
        run: |
          PGPASSWORD=komerce psql -h localhost -U komerce -d komerce_test -f schema.sql
          bash scripts/ci-migrate-pending.sh
      - run: npm run test:integration
