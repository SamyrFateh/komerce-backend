name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + backend audit (no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: "Niveau 0 — Registre des features (cohérence)"
        run: npm run feature:registry

      - name: "Niveau 0 — Cartes feature (schema carte-first)"
        run: node scripts/feature-card-schema-check.js

      - name: "Niveau 1-4 — Pyramide qualité (code)"
        run: npm run quality:gate

      - name: Backend architecture audit (invariants)
        run: npm run backend:audit

      - name: npm audit gate (high/critical)
        run: npm run audit:gate

      - name: Run unit tests + coverage (enforced)
        run: >-
          npx jest --testPathPatterns="tests/unit" --ci --runInBand
          --testPathIgnorePatterns="tests/integration" --coverage

      - name: "Niveau 5 — Feature Slice Guard (périmètre complet, montage/démontage)"
        run: npm run feature:check

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      NODE_ENV: test
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check schema freshness
        run: node scripts/check-schema-freshness.js

      - name: Load DB schema + run pending migrations
        run: |
          psql "$DATABASE_URL" -f docs/db/railway-live-schema.sql
          node scripts/ci-migrate.js

      - name: Run integration tests (one suite per process)
        run: |
          for f in tests/integration/*.test.js; do
            echo "── $f ──"
            npx jest "$f" --ci --forceExit || exit 1
          done

  carte-first-governance:
    name: Carte-first governance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Carte-first bootstrap checks
        run: node scripts/run-carte-first-checks.js

  boutique-quality:
    name: "🛡️ Boutique Quality Gates"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/boutique
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install dependencies (boutique)
        run: npm ci

      - name: "N1 — npm audit gate boutique (high/critical)"
        run: npm run audit:gate

      - name: "Garde-fous boutique (= check:fast : N2 quality + invariants + carte 360, statique)"
        run: npm run check:fast
