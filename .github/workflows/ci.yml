name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# Annule les runs obsolètes sur une même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1 — Tests unitaires : rapides, aucune base de données.
  # ─────────────────────────────────────────────────────────────
  unit:
    name: Unit tests + backend audit (no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Backend architecture audit (invariants)
        run: npm run backend:audit

      - name: npm audit gate (high/critical)
        run: npm run audit:gate

      - name: Run unit tests + coverage (enforced)
        run: >-
          npx jest --testPathPatterns="tests/unit" --ci --runInBand
          --testPathIgnorePatterns="tests/integration" --coverage

  # ─────────────────────────────────────────────────────────────
  # Job 2 — Tests d'intégration : Postgres jetable (service container).
  # Charge docs/db/railway-live-schema.sql via ci-migrate.js,
  # qui baseline dynamiquement (git) les migrations déjà dans le dump
  # et n'applique que les migrations post-snapshot.
  # ─────────────────────────────────────────────────────────────
  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerce
          POSTGRES_PASSWORD: komerce
          POSTGRES_DB: komerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://komerce:komerce@localhost:5432/komerce_test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      NODE_ENV: test
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vérifie que docs/db/railway-live-schema.sql est frais avant tout.
      # Bloque si une migration récente a ajouté une colonne absente du dump.
      # Correctif : merger le PR auto créé par schema-refresh.yml.
      - name: Check schema freshness
        run: node scripts/check-schema-freshness.js

      # Charge le dump Railway (schéma complet) dans le Postgres CI,
      # puis baseline dynamiquement les migrations déjà présentes dans le dump
      # (via git log/ls-tree — plus de liste hardcodée).
      # N'applique que les migrations vraiment nouvelles (post-snapshot).
      - name: Load DB schema + run pending migrations
        run: |
          psql "$DATABASE_URL" -f docs/db/railway-live-schema.sql
          node scripts/ci-migrate.js

      - name: Run integration tests (one suite per process)
        run: |
          for f in tests/integration/*.test.js; do
            echo "── $f ──"
            npx jest "$f" --ci --forceExit || exit 1
          done
