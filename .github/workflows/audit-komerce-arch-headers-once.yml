name: Audit Komerce Architecture Headers Once

on:
  push:
    paths:
      - .github/workflows/audit-komerce-arch-headers-once.yml
      - scripts/audit-komerce-arch-headers.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-headers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit architecture headers
        run: node scripts/audit-komerce-arch-headers.js

      - name: Commit architecture audit
        run: |
          if git diff --quiet; then
            echo "No architecture audit changes to commit."
            exit 0
          fi
          git config user.name "komerce-arch-bot"
          git config user.email "komerce-arch-bot@users.noreply.github.com"
          git add docs/KOMERCE_ARCH_HEADER_AUDIT.md docs/komerce-arch-header-audit.json
          git commit -m "Audit Komerce architecture header coverage"
          git push
