name: Logistics pickup service proof

on:
  push:
    branches:
      - fix/feature-proof-logistics-pickup-services

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/feature-proof-logistics-pickup-services
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Register focused pickup tests in logistics slice
        shell: python
        run: |
          from pathlib import Path
          p = Path('features/logistics.feature.js')
          text = p.read_text(encoding='utf-8')
          anchor = "      'tests/unit/pickup-secret-service.test.js',\n"
          insert = anchor + "      'tests/unit/pickup-secret-issuer.test.js',\n      'tests/unit/pickup-secret-access-service.test.js',\n      'tests/unit/pickup-collection-service.test.js',\n      'tests/unit/pickup-collection-recorder.test.js',\n      'tests/unit/pickup-exceptional-collection-service.test.js',\n      'tests/unit/pickup-code-helpers.test.js',\n"
          assert anchor in text, 'logistics pickup test anchor missing'
          assert 'tests/unit/pickup-secret-issuer.test.js' not in text, 'pickup proofs already registered'
          p.write_text(text.replace(anchor, insert, 1), encoding='utf-8')
      - name: Run focused pickup tests
        run: npx jest tests/unit/pickup-secret-issuer.test.js tests/unit/pickup-secret-access-service.test.js tests/unit/pickup-collection-service.test.js tests/unit/pickup-collection-recorder.test.js tests/unit/pickup-exceptional-collection-service.test.js tests/unit/pickup-code-helpers.test.js --runInBand --no-coverage
      - name: Prove logistics slice reaches zero warnings
        run: node scripts/feature-guard.js --feature logistics --strict
      - name: Commit manifest and remove temporary workflow
        run: |
          rm .github/workflows/logistics-pickup-service-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/logistics.feature.js tests/unit/pickup-secret-issuer.test.js tests/unit/pickup-secret-access-service.test.js tests/unit/pickup-collection-service.test.js tests/unit/pickup-collection-recorder.test.js tests/unit/pickup-exceptional-collection-service.test.js tests/unit/pickup-code-helpers.test.js .github/workflows/logistics-pickup-service-proof.yml
          git commit -m "test(logistics): attach proofs to pickup services"
          git push origin HEAD:fix/feature-proof-logistics-pickup-services
