name: Recalibrate Boutique CSS Debt

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b2-recalibrate

permissions:
  contents: write

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b2-recalibrate
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Rebuild canonical dist bundles
        run: npm --prefix public/boutique run deploy:css
      - name: Prove no new cascade or specificity debt
        run: |
          npm --prefix public/boutique run check:css-guard
          npm --prefix public/boutique run check:css-specificity-guard
      - name: Lower ratchets to current clean-state floor
        run: |
          OLD_CASCADE=$(node -p "require('./public/boutique/scripts/.css-guard-baseline.json').total")
          OLD_SPEC=$(node -p "require('./public/boutique/scripts/.css-specificity-guard-baseline.json').total")
          npm --prefix public/boutique run check:css-guard:save
          npm --prefix public/boutique run check:css-specificity-guard:save
          NEW_CASCADE=$(node -p "require('./public/boutique/scripts/.css-guard-baseline.json').total")
          NEW_SPEC=$(node -p "require('./public/boutique/scripts/.css-specificity-guard-baseline.json').total")
          cat > public/boutique/docs/BOUTIQUE_CSS_DEBT_REBASE.md <<EOF
          # Boutique CSS Debt — B2-0 recalibration

          Recalibration performed only after rebuilding the canonical dist bundles and passing both strict ratchets against the previous baselines.

          - Cascade conflicts: **${OLD_CASCADE} → ${NEW_CASCADE}**
          - Global-state specificity overrides: **${OLD_SPEC} → ${NEW_SPEC}**
          - New keys versus previous baselines: **0** (strict gates passed before save)
          - `css/dist`: **rebuilt from canonical sources before scan**

          This is a downward ratchet only. It does not classify the remaining entries as legitimate; B2/B3 must still reduce them by functional family.
          EOF
      - name: Commit rebuilt dist and recalibrated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/dist public/boutique/index.html public/boutique/scripts/.css-guard-baseline.json public/boutique/scripts/.css-specificity-guard-baseline.json public/boutique/docs/BOUTIQUE_CSS_DEBT_REBASE.md
          if git diff --cached --quiet; then
            echo "No bundle or baseline change to commit"
            exit 0
          fi
          git commit -m "test(boutique): rebuild dist and recalibrate CSS debt"
          git push origin HEAD:refactor/boutique-debt-zero-b2-recalibrate
