# Automatic synchronization is owned exclusively by pr-sweep-behind.yml.
# The former pull_request_target auto-update eagerly changed HEAD while
# PR enforcement was still running, invalidating green proofs.
# Keep this workflow as a no-op compatibility notice for historical links.
name: PR auto update (delegated to sweep)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Synchronization is handled by PR sweep behind, not on PR opening or synchronize."
