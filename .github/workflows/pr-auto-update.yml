name: PR auto update

on:
  pull_request_target:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-auto-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update:
    name: Auto-update current PR from main
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Update internal PR when behind and conflict-free
        env:
          PR_SYNC_TOKEN: ${{ secrets.PR_SYNC_TOKEN || secrets.SCHEMA_REFRESH_PR_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PR_SYNC_TOKEN:-}" ]; then
            echo "::notice::PR sync skipped: no attributable PR_SYNC_TOKEN/SCHEMA_REFRESH_PR_TOKEN configured."
            exit 0
          fi
          GH_TOKEN="$PR_SYNC_TOKEN"
          PR_URL="https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$PR_URL" > /tmp/pr.json

          BASE_SHA="$(node -e 'const p=require("/tmp/pr.json"); process.stdout.write(String(p.base?.sha||""))')"
          HEAD_SHA="$(node -e 'const p=require("/tmp/pr.json"); process.stdout.write(String(p.head?.sha||""))')"
          MERGEABLE="$(node -e 'const p=require("/tmp/pr.json"); process.stdout.write(String(p.mergeable))')"
          MERGEABLE_STATE="$(node -e 'const p=require("/tmp/pr.json"); process.stdout.write(String(p.mergeable_state||"unknown"))')"

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error::Unable to resolve PR base/head SHA."
            exit 1
          fi

          COMPARE_URL="https://api.github.com/repos/$REPOSITORY/compare/$HEAD_SHA...$BASE_SHA"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$COMPARE_URL" > /tmp/compare.json

          BEHIND_BY="$(node -e 'const c=require("/tmp/compare.json"); process.stdout.write(String(c.behind_by||0))')"
          echo "mergeable_state=$MERGEABLE_STATE mergeable=$MERGEABLE behind_by=$BEHIND_BY"

          if [ "$MERGEABLE" = "false" ] && [ "$MERGEABLE_STATE" = "dirty" ]; then
            echo "Conflict detected: automatic update intentionally skipped."
            exit 0
          fi

          if [ "$BEHIND_BY" -gt 0 ]; then
            curl -fsSL -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/update-branch" \
              -d "{\"expected_head_sha\":\"$EXPECTED_HEAD_SHA\"}"
            echo "Branch update requested; synchronize will trigger PR enforcement on the new HEAD."
          else
            echo "No mechanical branch update required; PR head already contains current base."
          fi
