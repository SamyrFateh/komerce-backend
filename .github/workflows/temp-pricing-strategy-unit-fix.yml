name: Temporary pricing strategy unit fix

on:
  push:
    branches:
      - feat/economic-workshop-market-contribution-ui

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economic-workshop-market-contribution-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Preserve raw acquisition guard before psychological rounding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/pricing-strategy-service.js')
          text = path.read_text()
          old = """    const acquisitionPrice = arrondiPsycho(competitorStats.median * 0.90);\n    const candidates = ["""
          new = """    const acquisitionRawPrice = competitorStats.median * 0.90;\n    const acquisitionPrice = arrondiPsycho(acquisitionRawPrice);\n    const candidates = ["""
          if old in text:
              text = text.replace(old, new, 1)
          old_guard = """      acquisitionPrice >= Number(economics.minimum_safe_price_kmf || 0)\n        ? buildReferenceCandidate('acquisition_reference'"""
          new_guard = """      acquisitionRawPrice >= Number(economics.minimum_safe_price_kmf || 0)\n        ? buildReferenceCandidate('acquisition_reference'"""
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - name: Prove pricing strategy regression
        run: npx jest tests/unit/pricing-strategy-service-full.test.js --runInBand
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/pricing-strategy-service.js
          if git diff --cached --quiet; then
            echo "No pricing strategy changes"
            exit 0
          fi
          git commit -m "fix(pricing): guard acquisition reference before rounding"
          git push origin HEAD:feat/economic-workshop-market-contribution-ui
