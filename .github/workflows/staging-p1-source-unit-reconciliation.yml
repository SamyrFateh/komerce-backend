name: Staging P1 exact supplier-candidate reconciliation
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: staging-p1-source-unitary-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.actor == github.repository_owner && github.event.issue.title == '[staging-op] p1-source-unit-reconciliation'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      KOMERCE_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Reconcile sourcing candidates per real import run (read only)
        run: node scripts/recette/p1-source-unit-reconciliation.js
      - name: Keep full exact source units and blocked verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-source-unitary-reconciliation-${{ github.run_id }}
          path: test-results/staging-p1/source-unit-reconciliation.json
          retention-days: 30
          if-no-files-found: warn
