name: Finalize mobile modal integration

on:
  pull_request:
    branches:
      - agent/fix-modal-sku-actions

permissions:
  contents: write

jobs:
  finalize-mobile-modal:
    if: github.event.pull_request.head.ref == 'agent/finalize-mobile-modal'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-mobile-modal
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            public/boutique/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix public/boutique

      - name: Align catalog selector and historical assertions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          interactions = Path('public/boutique/css/interactions.css')
          text = interactions.read_text(encoding='utf-8')
          text = text.replace('.k-sug-add', '.k-catalog-sug-add')
          interactions.write_text(text, encoding='utf-8')

          render_test = Path('public/boutique/tests/unit/render-product-card.test.js')
          text = render_test.read_text(encoding='utf-8')
          old = "    expect(html).toContain('k-sug-add');"
          new = "    expect(html).toContain('k-catalog-sug-add');\n    expect(html).not.toContain('class=\"k-sug-add\"');"
          if old in text:
              text = text.replace(old, new, 1)
              render_test.write_text(text, encoding='utf-8')

          suggestions_test = Path('public/boutique/tests/unit/b-modal-suggestions.test.js')
          text = suggestions_test.read_text(encoding='utf-8')
          replacements = [
              (
                  "      renderSuggestions([product({ id: 7, name: 'Basket' })], [], 'Chaussures');\n\n      const addBtn = dom.sugRail.querySelector('.k-sug-add[data-add=\"7\"]');",
                  "      renderSuggestions([product({ id: 7, name: 'Basket' })], [], 'Chaussures');\n\n      const initialActions = dom.sugRail.querySelector('.k-sug-card[data-id=\"7\"] .k-sug-card-actions');\n      expect(initialActions.classList.contains('is-filled')).toBe(false);\n      expect(initialActions.querySelector('.k-sug-add')).not.toBeNull();\n      const addBtn = dom.sugRail.querySelector('.k-sug-add[data-add=\"7\"]');"
              ),
              (
                  "      expect(card.querySelector('.k-sug-qty').textContent).toBe('1');\n      expect(card.querySelector('.k-sug-add')).toBeNull();",
                  "      expect(card.querySelector('.k-sug-qty').textContent).toBe('1');\n      expect(card.querySelector('.k-sug-minus')).not.toBeNull();\n      expect(card.querySelector('.k-sug-plus')).not.toBeNull();\n      expect(card.querySelector('.k-sug-card-actions').classList.contains('is-filled')).toBe(true);\n      expect(card.querySelector('.k-sug-add')).toBeNull();"
              ),
              (
                  "      expect(card.querySelector('.k-sug-add')).not.toBeNull();\n      expect(card.querySelector('.k-sug-qty')).toBeNull();",
                  "      expect(card.querySelector('.k-sug-card-actions').classList.contains('is-filled')).toBe(false);\n      expect(card.querySelector('.k-sug-add')).not.toBeNull();\n      expect(card.querySelector('.k-sug-qty')).toBeNull();"
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          suggestions_test.write_text(text, encoding='utf-8')
          PY

      - name: Verify source markers
        shell: bash
        run: |
          grep -F "Boolean(inventoryModel) && !isSku" public/boutique/js/b-modal-cart.js
          grep -F "bus.on('modal:detail-ready', _syncModalQtyUI)" public/boutique/js/b-modal-cart.js
          grep -F "bus.emit('modal:detail-ready')" public/boutique/js/b-modal-product-detail-bootstrap.js
          ! grep -F "b-modal-cart.js" public/boutique/js/b-modal-product-detail-bootstrap.js
          grep -F "classList.toggle('is-filled', qty > 0)" public/boutique/js/b-modal-suggestions.js
          grep -F "k-catalog-sug-add" public/boutique/js/render/render-product-card.js
          grep -F ".k-catalog-sug-add" public/boutique/css/interactions.css
          ! grep -F ".k-sug-add" public/boutique/css/interactions.css

      - name: Targeted unit tests
        working-directory: public/boutique
        run: >-
          npx jest
          tests/unit/b-modal-suggestions.test.js
          tests/unit/b-modal-cart.test.js
          tests/unit/b-modal-product-detail-bootstrap.test.js
          tests/unit/render-product-card.test.js
          tests/unit/modal-cart-sku-guard.test.js
          tests/unit/modal-mobile-suggestion-actions.test.js
          --runInBand

      - name: Existing responsive mobile harness
        working-directory: public/boutique
        run: npm run audit:responsive

      - name: Official CSS build and guards
        run: npm run build

      - name: Verify generated bundle and cache buster
        shell: bash
        run: |
          grep -n "components.css?v=" public/boutique/index.html
          test -s public/boutique/css/dist/components.css
          grep -F ".k-catalog-sug-add" public/boutique/css/dist/components.css
          grep -F "#k-modal .k-sug-card-actions.is-filled" public/boutique/css/dist/components.css
          git diff --check

      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/agent-mobile-modal-integration.yml
          git rm -f --ignore-unmatch .github/workflows/agent-mobile-modal-integration-pr.yml
          git rm -f --ignore-unmatch .github/workflows/agent-finalize-mobile-modal.yml
          git rm -f --ignore-unmatch .agent/evidence/mobile-modal-integration-scope.md
          git add public/boutique/css/interactions.css
          git add public/boutique/css/dist/components.css
          git add public/boutique/index.html
          git add public/boutique/tests/unit/b-modal-suggestions.test.js
          git add public/boutique/tests/unit/render-product-card.test.js
          git diff --cached --check
          git commit -m "fix(modal): finalize mobile suggestion actions"
          git push origin HEAD:agent/finalize-mobile-modal
