name: tmp hero asset import

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-hero-asset-import.yml

permissions:
  contents: write

jobs:
  import-hero-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-hero-characters-v1-asset
          fetch-depth: 0

      - name: Download canonical transparent hero master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl --fail --location --retry 3 \
            'https://media.canva.com/v2/image-resize/format:PNG/height:1000/quality:100/uri:ifs%3A%2F%2FM%2Ff7a5e888-b596-4dd5-981d-5e3f96d29d63/watermark:F/width:1600?csig=AAAAAAAAAAAAAAAAAAAAACbWHbSOe0fTdGjW1gs-p5u9SBLNwsefybES8s7ZhBOI&exp=1787345680&osig=AAAAAAAAAAAAAAAAAAAAAG-ptAkGf_f84sINCmU3aZaGetNbwz6ikTHe-6OymYJp&signer=media-rpc&x-canva-quality=thumbnail' \
            --output public/images/komerce_hero_characters_v1.png

      - name: Validate canonical PNG contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from PIL import Image

          p = Path('public/images/komerce_hero_characters_v1.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          with Image.open(p) as im:
              im.load()
              assert im.size == (1600, 1000), im.size
              assert 'A' in im.getbands(), f'no alpha channel: {im.mode}'
              rgba = im.convert('RGBA')
              alpha_min, alpha_max = rgba.getchannel('A').getextrema()
              assert alpha_min == 0 and alpha_max == 255, (alpha_min, alpha_max)
          assert len(data) > 500_000, f'unexpectedly small asset: {len(data)} bytes'
          print({
              'size': '1600x1000',
              'mode': im.mode,
              'alpha': (alpha_min, alpha_max),
              'bytes': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
          })
          PY

      - name: Commit asset and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/komerce_hero_characters_v1.png
          git rm .github/workflows/tmp-hero-asset-import.yml
          git commit -m 'assets: add canonical hero character master v1'
          git push origin HEAD:ui-hero-characters-v1-asset
