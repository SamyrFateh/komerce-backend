name: Classify Boutique B2 Final Checkout Cascade

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b2-checkout-final

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b2-checkout-final
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci
      - name: Print exact source occurrences for remaining checkout keys
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const postcss = require('./public/boutique/node_modules/postcss');
          const { BUNDLES } = require('./public/boutique/scripts/css-bundles');

          const root = path.resolve('public/boutique');
          const cssDir = path.join(root, 'css');
          const baseline = JSON.parse(fs.readFileSync(path.join(root, 'scripts/.css-guard-baseline.json'), 'utf8'));

          function isCheckoutSelector(selector) {
            return selector.startsWith('.ck-') ||
              selector.startsWith('.k-ck-') ||
              selector.startsWith('.k-order') ||
              selector.startsWith('.k-confirm') ||
              selector.startsWith('.k-modal-subtotal') ||
              selector.startsWith('.k-stripe-wrap');
          }

          const checkoutKeys = baseline.keys.filter(key => isCheckoutSelector(key.split('|||')[0]));
          console.log(`REMAINING_CHECKOUT_KEYS=${checkoutKeys.length}`);
          checkoutKeys.forEach(k => console.log(`KEY ${k}`));

          const components = BUNDLES.find(b => b.out === 'components.css');
          const bundleFiles = components.files.map(name => `${name}.css`);
          const candidates = [
            'modal-shell.css',
            'modal-media.css',
            'modal-product.css',
            'modal-product-lot4-hybrid.css',
            'modal-desktop-density.css',
            'modal-mobile-canonical.css',
            'cart.css',
            'interactions.css',
            'identity.css',
            'paypal.css',
            'checkout-vertical-rail.css',
          ].filter(f => bundleFiles.includes(f));

          function contextOf(rule) {
            let node = rule.parent;
            while (node && node.type !== 'root') {
              if (node.type === 'atrule' && node.name === 'media') return `@media ${node.params} {`;
              node = node.parent;
            }
            return 'global';
          }

          const rowsByKey = new Map(checkoutKeys.map(k => [k, []]));
          for (const file of candidates) {
            const fp = path.join(cssDir, file);
            const ast = postcss.parse(fs.readFileSync(fp, 'utf8'), { from: file });
            const order = bundleFiles.indexOf(file);
            ast.walkRules(rule => {
              const media = contextOf(rule);
              const selectorParts = rule.selectors || [rule.selector];
              rule.walkDecls(decl => {
                for (const selector of selectorParts) {
                  const key = `${selector.trim()}|||${media}|||${decl.prop}`;
                  if (!rowsByKey.has(key)) continue;
                  rowsByKey.get(key).push({
                    file,
                    order,
                    selector: selector.trim(),
                    fullSelector: rule.selector,
                    grouped: selectorParts.length > 1,
                    media,
                    prop: decl.prop,
                    value: decl.value,
                    line: decl.source?.start?.line || null,
                  });
                }
              });
            });
          }

          for (const key of checkoutKeys) {
            console.log(`\n=== ${key} ===`);
            const rows = rowsByKey.get(key) || [];
            if (!rows.length) {
              console.log('NO_SOURCE_MATCH');
              continue;
            }
            rows.sort((a,b) => a.order - b.order || (a.line||0) - (b.line||0));
            for (const row of rows) {
              console.log(JSON.stringify(row));
            }
            const winner = rows[rows.length - 1];
            console.log(`WINNER ${winner.file}:${winner.line} -> ${winner.value}`);
          }
          NODE
