name: CSB Boutique zero-noise closure

on:
  push:
    branches:
      - agent/clean-signal-boundary-20260816

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix public/boutique ci
      - name: Apply Boutique clean-signal closure
        run: |
          node scripts/csb-boutique-zero-bootstrap.js
          node scripts/csb-boutique-zero.js
      - name: Remove proof machinery before projections
        run: |
          rm -f scripts/csb-boutique-zero.js scripts/csb-boutique-zero-bootstrap.js .github/workflows/csb-boutique-residual-diagnostics.yml
          test ! -e scripts/csb-boutique-zero.js
          test ! -e scripts/csb-boutique-zero-bootstrap.js
          test ! -e .github/workflows/csb-boutique-residual-diagnostics.yml
      - name: Prove Boutique registry has zero orphans
        run: node public/boutique/scripts/feature-registry-check.js --strict
      - name: Prove no direct JS cycles or import failures
        run: |
          node public/boutique/scripts/check-js-imports.js | tee /tmp/imports.log
          ! grep -E 'Cycle connu|⚠' /tmp/imports.log
      - name: Prove body-state contract has zero warnings
        run: |
          node public/boutique/scripts/check-body-classes.js | tee /tmp/body.log
          ! grep -E '⚠|Avertissements' /tmp/body.log
      - name: Eliminate bespoke breakpoint baseline
        run: |
          npm --prefix public/boutique run check:breakpoints
          npm --prefix public/boutique run check:breakpoints:save
          npm --prefix public/boutique run check:breakpoints
          node - <<'NODE'
          const b = require('./public/boutique/scripts/.breakpoints-baseline.json');
          if (b.total !== 0 || Object.keys(b.perFile || {}).length !== 0) {
            throw new Error('breakpoint baseline must be exactly zero');
          }
          console.log('breakpoint baseline = 0');
          NODE
      - name: Rebuild canonical CSS bundles
        run: npm --prefix public/boutique run deploy:css
      - name: Fast 01 quality
        run: npm --prefix public/boutique run quality:gate
      - name: Fast 02 group wording
        run: npm --prefix public/boutique run check:group-wording
      - name: Fast 03 html
        run: npm --prefix public/boutique run check:html
      - name: Fast 04 imports
        run: npm --prefix public/boutique run check:imports
      - name: Fast 05 body classes
        run: npm --prefix public/boutique run check:body-classes
      - name: Fast 06 no injection
        run: npm --prefix public/boutique run check:no-injection
      - name: Fast 07 assets
        run: npm --prefix public/boutique run check:assets
      - name: Fast 08 important
        run: npm --prefix public/boutique run check:important
      - name: Fast 09 css guard
        run: npm --prefix public/boutique run check:css-guard
      - name: Fast 10 specificity
        run: npm --prefix public/boutique run check:css-specificity-guard
      - name: Fast 11 dist only
        run: npm --prefix public/boutique run check:css-dist-only
      - name: Fast 12 cache
        run: npm --prefix public/boutique run check:cache
      - name: Fast 13 breakpoints
        run: npm --prefix public/boutique run check:breakpoints
      - name: Fast 14 visual lock
        run: npm --prefix public/boutique run check:visual-lock
      - name: Fast 15 architecture
        run: npm --prefix public/boutique run audit:arch
      - name: Fast 16 architecture live
        run: npm --prefix public/boutique run audit:arch:live
      - name: Fast 17 ownership
        run: npm --prefix public/boutique run audit:ownership
      - name: Fast 18 modal ownership
        run: npm --prefix public/boutique run audit:modal-ownership
      - name: Fast 19 modal layout
        run: npm --prefix public/boutique run audit:modal-layout
      - name: Fast 20 registry
        run: npm --prefix public/boutique run audit:registry
      - name: Fast 21 audit gate
        run: npm --prefix public/boutique run audit:gate
      - name: Fast 22 feature guard
        run: npm --prefix public/boutique run feature:guard:strict
      - name: Fast 23 unit tests
        run: npm --prefix public/boutique run test:unit
      - name: Regenerate canonical projections on final tree
        run: |
          npm run arch:gen
          npm run business-graph:gen
          npm run feature:360:gen
      - name: Prove Boutique projected findings are zero
        run: |
          node - <<'NODE'
          const r = require('./docs/GATE_FINDINGS.json');
          const boutique = (r.findings || []).filter(f => f.scope === 'boutique');
          if (boutique.length) {
            console.error(JSON.stringify(boutique, null, 2));
            throw new Error(`Boutique projected findings remain: ${boutique.length}`);
          }
          const badSources = (r.sources || []).filter(s => s.scope === 'boutique' && (s.status !== 'ok' || s.errorCount || s.warningCount || s.unprojectableCount || s.multiProjectedCount));
          if (badSources.length) {
            console.error(JSON.stringify(badSources, null, 2));
            throw new Error(`Boutique source debt remains: ${badSources.length}`);
          }
          console.log('Boutique GATE_FINDINGS = 0 warnings / 0 failures');
          NODE
      - name: Recheck canonical governance
        run: |
          npm run business-graph:ratchet-check
          npm run business-graph:disposition-check
          npm run business-graph:check
          npm run feature:classification:strict
          npm run feature:registry
          npm run feature:registry-doc
          npm run feature:360:check
          npm run quality:gate
          npm run gate:boutique-ownership:full
          git diff --check
      - name: Compact branch to one canonical commit over main
        run: |
          git fetch origin main
          git reset --mixed origin/main
          git add -A
          git diff --cached --check
          git config user.name "SamyrFateh"
          git config user.email "fatehsamyr@gmail.com"
          git commit -m "fix(governance): establish clean signal boundary"
          git push --force-with-lease origin HEAD:refs/heads/agent/clean-signal-boundary-20260816
