name: CSB Boutique residual diagnostics

on:
  push:
    branches:
      - agent/clean-signal-boundary-20260816

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Boutique feature registry
        run: node public/boutique/scripts/feature-registry-check.js || true
      - name: Boutique JS imports
        run: node public/boutique/scripts/check-js-imports.js || true
      - name: Boutique body classes
        run: node public/boutique/scripts/check-body-classes.js || true
      - name: Boutique breakpoints
        run: npm --prefix public/boutique run check:breakpoints || true
      - name: Locate stale body contracts
        run: |
          echo '--- ck-is-me ---'
          grep -R -n --exclude-dir=node_modules --exclude-dir=dist 'ck-is-me' public/boutique || true
          echo '--- k-ck-id-btns-row ---'
          grep -R -n --exclude-dir=node_modules --exclude-dir=dist 'k-ck-id-btns-row' public/boutique || true
          echo '--- k-order-body--recap ---'
          grep -R -n --exclude-dir=node_modules --exclude-dir=dist 'k-order-body--recap' public/boutique || true
