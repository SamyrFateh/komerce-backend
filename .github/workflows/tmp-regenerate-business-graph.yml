name: TEMP regenerate business graph

on:
  push:
    branches:
      - fix/shared-list-auto-close-on-complete

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-list-auto-close-on-complete
          fetch-depth: 0

      - name: Regenerate canonical business graph
        run: node scripts/business-graph-gen.js --dash-root public --boutique-root public/boutique

      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md
          git commit -m "chore(governance): regenerate business feature graph"
          git push origin HEAD:fix/shared-list-auto-close-on-complete
