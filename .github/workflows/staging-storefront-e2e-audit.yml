name: Staging storefront E2E audit

# Manuel uniquement pour l'instant (pas de push-to-main automatique) — le
# catalogue produit réel en staging est encore en construction (chantier
# séparé). Tant qu'il n'est pas prêt, ces specs échoueraient par manque de
# données (grille catalogue jamais hydratée), pas par régression réelle.
# Déclenchement : ouvrir une issue titrée exactement
# "[staging-op] storefront-e2e-audit", par le propriétaire du repo.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: komerce-staging-storefront-e2e-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Playwright storefront battery
    if: >-
      github.event_name == 'issues' && github.actor == github.repository_owner &&
      github.event.issue.title == '[staging-op] storefront-e2e-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_URL: https://komerce-backend-production.up.railway.app/boutique/
      KOMERCE_ENV: staging
      CI: '1'

    steps:
      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json

      - name: Install Boutique dependencies
        working-directory: public/boutique
        run: npm ci

      - name: Install Chromium
        working-directory: public/boutique
        run: npx playwright install --with-deps chromium

      - name: Verify staging target and record deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "Expected staging URL: $BASE_URL"
          curl --retry 2 --fail --silent --show-error \
            "https://komerce-backend-production.up.railway.app/health/version" \
            | tee staging-version.json
          printf "\nChecked-out SHA: %s\n" "$(git rev-parse HEAD)"

      - name: Calibrate live storefront selectors first (desktop and mobile)
        id: calibration
        working-directory: public/boutique
        shell: bash
        run: |
          set +e
          mkdir -p test-results/storefront-audit
          rc=0
          npx playwright test tests/e2e/calibration.spec.js \
            --project='Mobile Chrome' --workers=1 --retries=0 \
            --output=test-results/storefront-audit/calibration-mobile || rc=1
          npx playwright test tests/e2e/calibration.spec.js \
            --project='Desktop Chrome' --workers=1 --retries=0 \
            --output=test-results/storefront-audit/calibration-desktop || rc=1
          echo "calibration_exit=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo 'NO GO — storefront calibration failed, dependent functional tests are NOT_PROVEN.' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Check real catalog, exposure, search and render (no payments)
        id: audit
        if: steps.calibration.outcome == 'success'
        working-directory: public/boutique
        shell: bash
        run: |
          set +e
          rc=0
          SPECS="tests/e2e/catalog.spec.js \
            tests/e2e/catalog-market-exposure.spec.js \
            tests/e2e/search.spec.js \
            tests/e2e/navigation.spec.js \
            tests/e2e/render-integrity.spec.js"
          npx playwright test $SPECS --project='Mobile Chrome' --workers=1 \
            --retries=0 --output=test-results/storefront-audit/mobile || rc=1
          npx playwright test $SPECS --project='Desktop Chrome' --workers=1 \
            --retries=0 --output=test-results/storefront-audit/desktop || rc=1
          if [ "$rc" -eq 0 ]; then
            echo 'PASS — public storefront subset; this does NOT certify P1 approval or P2 checkout.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NO GO — storefront real browser functional failures. Inspect JUnit + traces.' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Upload storefront battery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-playwright-battery
          path: |
            staging-version.json
            public/boutique/test-results/storefront-audit/
            public/boutique/test-results/results.xml
            public/boutique/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment command issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CALIBRATION: ${{ steps.calibration.outcome }}
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Staging public Chromium: calibration=${CALIBRATION}, catalog=${OUTCOME}. FAIL / SKIP is NOT_PROVEN. Review artifact storefront-playwright-battery."
