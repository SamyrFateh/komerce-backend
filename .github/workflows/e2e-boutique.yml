name: E2E Boutique (Playwright)

on:
  pull_request:
    paths:
      - 'public/boutique/**'
      - 'bootstrap/security.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-boutique.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL cible distante'
        required: false
        default: 'https://komerce-backend-production.up.railway.app'

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/boutique
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            public/boutique/package-lock.json

      - name: Install backend deps required by CSP contract imports
        working-directory: .
        run: npm ci

      - name: Install Boutique deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove the checked-out PR tree locally
        if: github.event_name == 'pull_request'
        run: |
          npx playwright test \
            tests/e2e/csp-fronts.spec.js \
            tests/e2e/modal-geometry.spec.js \
            tests/e2e/modal-visual-regression.spec.js \
            tests/e2e/hero-geometry.spec.js \
            tests/e2e/modal-backtop-zindex.spec.js \
            --project='Chromium Local-Only'
          npx playwright test \
            tests/e2e/modal-mdm9-gallery-layout.spec.js \
            --project='Chromium MDM-9'

      - name: Run the explicit remote campaign
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: public/boutique/playwright-report/
          retention-days: 14
