name: E2E Boutique (Playwright)

on:
  pull_request:
    paths:
      - 'public/boutique/**'
      - 'bootstrap/security.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-boutique.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL cible (défaut: prod Railway)'
        required: false
        default: 'https://komerce-backend-production.up.railway.app'

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/boutique
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            public/boutique/package-lock.json

      - name: Install backend deps required by CSP contract imports
        working-directory: .
        run: npm ci

      - name: Install Boutique deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E (feature-first)
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://komerce-backend-production.up.railway.app' }}
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: public/boutique/playwright-report/
          retention-days: 14
