name: tmp-provider-review-fix
on:
  push:
    branches:
      - feat/market-delegation-provider-v2
permissions:
  contents: write
jobs:
  review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Apply reviewed provider composition
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p = Path(path)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'anchor missing in {path}: {old[:100]}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('bootstrap/api-routes.js', [
            ("routes/market-delegation-network.js, routes/market-delegation-catalog.js", "routes/market-delegation-network.js, routes/market-delegation-provider.js, routes/market-delegation-catalog.js"),
            ("  const marketDelegationNetworkRouter = require('../routes/market-delegation-network');\n  const marketDelegationCatalogRouter", "  const marketDelegationNetworkRouter = require('../routes/market-delegation-network');\n  const marketDelegationProviderRouter = require('../routes/market-delegation-provider');\n  const marketDelegationCatalogRouter"),
            ("  app.use('/api/market-delegation', marketDelegationNetworkRouter);\n  app.use('/api/market-delegation', marketDelegationCatalogRouter);", "  app.use('/api/market-delegation', marketDelegationNetworkRouter);\n  app.use('/api/market-delegation', marketDelegationProviderRouter);\n  app.use('/api/market-delegation', marketDelegationCatalogRouter);")
          ])

          patch('features/market-delegation.feature.js', [
            ('Migration 198 retire le défaut géographique Anjouan', 'Migration 200 retire le défaut géographique Anjouan'),
            ("      'LOT 2A rend le réseau local (relais) autonome par capabilities network.* ; suspension jamais suppression, pour préserver les FK entrantes (orders, parcels, scans, partners, recipients, shared_carts, users).',\n", "      'LOT 2A rend le réseau local (relais) autonome par capabilities network.* ; suspension jamais suppression, pour préserver les FK entrantes (orders, parcels, scans, partners, recipients, shared_carts, users).',\n      'LOT 2B rend les providers locaux autonomes par provider.manage ; création, modification, suspension/réactivation restent bornées au Market ID et auditables.',\n"),
            ("      'un relais reste rattaché à son marché d’origine ; toute tentative de lecture/écriture cross-market échoue en 404, sans confirmer l’existence de la ressource sur un autre marché',\n", "      'un relais reste rattaché à son marché d’origine ; toute tentative de lecture/écriture cross-market échoue en 404, sans confirmer l’existence de la ressource sur un autre marché',\n      'un provider reste rattaché à son marché d’origine ; provider.manage ne permet jamais une réassignation cross-market et les mutations passent par providers-services, lifecycle owner',\n"),
            ("      'providers/relais comme principaux locaux secondaires : jamais des assignments concurrents',", "      'providers/relais comme principaux locaux secondaires : jamais des assignments concurrents ; leur gestion locale reste déléguable sans transformer leur identité en user_role',"),
            ("      'migrations/200_market_delegation_relais_island_nullable.sql',\n", "      'migrations/200_market_delegation_relais_island_nullable.sql',\n      'migrations/201_market_network_promotion_agent_optional.sql',\n      'migrations/203_market_delegation_provider_manage_live.sql',\n"),
            ("      'services/market-delegation-network-service.js',\n", "      'services/market-delegation-network-service.js',\n      'services/market-delegation-provider-service.js',\n"),
            ("      'routes/market-delegation-network.js',\n", "      'routes/market-delegation-network.js',\n      'routes/market-delegation-provider.js',\n"),
            ("      'tests/unit/market-delegation-network-routes.test.js',\n", "      'tests/unit/market-delegation-network-routes.test.js',\n      'tests/unit/market-delegation-provider-service.test.js',\n      'tests/unit/market-delegation-provider-routes.test.js',\n"),
            ("      'relais: R',  // mutations via logistics/relais-mutation-service\n", "      'relais: R',  // mutations via logistics/relais-mutation-service\n      'providers: R',  // mutations via providers-services boundaries\n"),
            ('authedRoutesDetected: 15,', 'authedRoutesDetected: 20,'),
            ('totalRoutes: 15,', 'totalRoutes: 20,'),
            ('LOT 1A + LOT 2A + LOT 2C + LOT 4', 'LOT 1A + LOT 2A + LOT 2B + LOT 2C + LOT 4'),
            ('team.*/network.*/cash_control.*/catalog.expose/finance.read', 'team.*/network.*/provider.manage/cash_control.*/catalog.expose/finance.read'),
            ("      'POST /api/market-delegation/markets/:marketCode/network/relais/:relaisId/activate — network.update',\n", "      'POST /api/market-delegation/markets/:marketCode/network/relais/:relaisId/activate — network.update',\n      'GET /api/market-delegation/markets/:marketCode/network/providers — provider.manage',\n      'POST /api/market-delegation/markets/:marketCode/network/providers — provider.manage',\n      'PUT /api/market-delegation/markets/:marketCode/network/providers/:providerId — provider.manage',\n      'POST /api/market-delegation/markets/:marketCode/network/providers/:providerId/suspend — provider.manage',\n      'POST /api/market-delegation/markets/:marketCode/network/providers/:providerId/activate — provider.manage',\n"),
            ("      { fn: 'setRelaisActive', file: 'services/market-delegation-network-service.js' },\n", "      { fn: 'setRelaisActive', file: 'services/market-delegation-network-service.js' },\n      { fn: 'createProvider', file: 'services/market-delegation-provider-service.js' },\n      { fn: 'updateProvider', file: 'services/market-delegation-provider-service.js' },\n      { fn: 'setProviderStatus', file: 'services/market-delegation-provider-service.js' },\n"),
            ("'logistics', 'catalog']", "'logistics', 'catalog', 'providers-services']"),
            ("    { statement: 'les routes réseau refusent market_id/marketId venant du client comme preuve d’autorité, comme les routes équipe', test: 'tests/unit/market-delegation-network-routes.test.js' },\n", "    { statement: 'les routes réseau refusent market_id/marketId venant du client comme preuve d’autorité, comme les routes équipe', test: 'tests/unit/market-delegation-network-routes.test.js' },\n    { statement: 'un provider ne peut jamais être modifié par une membership d’un autre marché ; la réponse est 404 pour ne pas confirmer son existence', test: 'tests/unit/market-delegation-provider-service.test.js' },\n    { statement: 'suspendre un provider ne le supprime jamais ; il reste réactivable et son Market ID est immuable par cette boundary', test: 'tests/unit/market-delegation-provider-service.test.js' },\n")
          ])

          p = Path('features/providers-services.feature.js')
          s = p.read_text()
          s = s.replace("      'services/providers-service.js',\n", "      'services/providers-service.js',\n      'services/provider-status-mutation-service.js',\n", 1)
          s = s.replace("      'tests/unit/providers-service.test.js',\n", "      'tests/unit/providers-service.test.js',\n      'tests/unit/provider-status-mutation-service.test.js',\n", 1)
          p.write_text(s)

          patch('public/dashboards/canonical/js/market-team.js', [
            ("    'network.read': 'Lire le réseau local',\n", "    'network.read': 'Lire le réseau local',\n    'provider.manage': 'Gérer les prestataires locaux',\n")
          ])

          patch('features/market-autonomy.feature.js', [
            ("      'surface équipe pays intégrée : lecture, invitation, délégation et révocation de capabilities',", "      'surface équipe pays intégrée : lecture, invitation, délégation et révocation de capabilities, dont provider.manage lorsqu’il est LIVE',"),
            ("market-delegation — memberships, capabilities team.*, cash_control.policy.manage et acceptation d’invitation", "market-delegation — memberships, capabilities team.*, provider.manage, cash_control.policy.manage et acceptation d’invitation")
          ])

          p = Path('tests/unit/market-delegation-p0.test.js')
          s = p.read_text()
          anchor = "    expect(migration).toMatch(/migration-203/);\n    expect(migration).not.toMatch(/UPDATE users/i);\n"
          replacement = "    expect(migration).toMatch(/migration-203/);\n    expect(migration).toMatch(/SELECT NULL,[\\s\\S]*am\\.assignment_id/);\n    expect(migration).not.toMatch(/UPDATE users/i);\n"
          if anchor not in s:
              raise SystemExit('anchor missing in tests/unit/market-delegation-p0.test.js')
          p.write_text(s.replace(anchor, replacement, 1))
          PY
      - name: Validate reviewed provider lot and capture exact output
        run: |
          set +e
          npx jest --runInBand \
            tests/unit/providers-service.test.js \
            tests/unit/provider-status-mutation-service.test.js \
            tests/unit/market-delegation-provider-service.test.js \
            tests/unit/market-delegation-provider-routes.test.js \
            tests/unit/market-delegation-p0.test.js \
            tests/unit/market-delegation-team-ui.test.js \
            tests/unit/market-delegation-cash-control-routes.test.js \
            > /tmp/provider-tests.log 2>&1
          TEST_STATUS=$?

          node scripts/capability-registry-check.js > /tmp/provider-registry.log 2>&1
          REGISTRY_STATUS=$?

          node scripts/gen-security-360.js > /tmp/provider-security.log 2>&1
          SECURITY_STATUS=$?

          {
            echo "provider-review-validation"
            echo "tests_status=$TEST_STATUS"
            echo "registry_status=$REGISTRY_STATUS"
            echo "security_status=$SECURITY_STATUS"
            echo
            echo "=== JEST ==="
            cat /tmp/provider-tests.log
            echo
            echo "=== CAPABILITY REGISTRY ==="
            cat /tmp/provider-registry.log
            echo
            echo "=== SECURITY 360 ==="
            cat /tmp/provider-security.log
          } > tmp-provider-review-validation.log
          exit 0
      - name: Commit reviewed composition and validation report
        run: |
          rm .github/workflows/tmp-provider-review-fix.yml
          git config user.name provider-review-bot
          git config user.email provider-review-bot@users.noreply.github.com
          git add -A
          git commit -m "fix(provider): finaliser la revue autonomie provider.manage"
          git push origin HEAD:feat/market-delegation-provider-v2
