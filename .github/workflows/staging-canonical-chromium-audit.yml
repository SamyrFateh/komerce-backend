name: Chromium Canonical staging real navigation and markets
on:
  workflow_dispatch:
    inputs:
      roles:
        description: 'Admin only, Admin + Responsable pays baseline, or all roles'
        required: true
        type: choice
        default: all
        options: [admin, baseline, all]
      spec_filter:
        description: 'Optional Playwright file filter (e.g. live-screens-proof); empty runs every spec'
        required: false
        type: string
        default: ''
      proof_order_refs:
        description: 'Comma-separated certified order refs for live-screens-proof (empty = E2E-HUB-V1-9BF9BA04-{KOM-101,KOM-102,KOM-103,LOCAL})'
        required: false
        type: string
        default: ''
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: komerce-canonical-chromium-staging
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.actor == github.repository_owner &&
       (github.event.issue.title == '[staging-op] canonical-chromium-audit' ||
        github.event.issue.title == '[staging-op] canonical-chromium-audit-baseline' ||
        github.event.issue.title == '[staging-op] canonical-chromium-hub-director'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: 'true'
      E2E_STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      E2E_AUDIT_QUICK: ${{ github.event_name == 'issues' && github.event.issue.title == '[staging-op] canonical-chromium-audit-baseline' && '1' || '0' }}
      E2E_CHROMIUM_SPEC_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.spec_filter || (github.event.issue.title == '[staging-op] canonical-chromium-hub-director' && 'hub-director-readonly' || '') }}
      E2E_PROOF_ORDER_REFS: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_order_refs || '' }}
      E2E_AUDIT_ROLES: ${{ github.event_name == 'workflow_dispatch' && inputs.roles || (github.event.issue.title == '[staging-op] canonical-chromium-hub-director' && 'admin' || (github.event.issue.title == '[staging-op] canonical-chromium-audit-baseline' && 'baseline' || 'all')) }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_MARKET_OPERATOR_EMAIL: ${{ secrets.E2E_MARKET_OPERATOR_EMAIL }}
      E2E_MARKET_OPERATOR_PASSWORD: ${{ secrets.E2E_MARKET_OPERATOR_PASSWORD }}
      E2E_FINANCE_EMAIL: ${{ secrets.E2E_FINANCE_EMAIL }}
      E2E_FINANCE_PASSWORD: ${{ secrets.E2E_FINANCE_PASSWORD }}
      E2E_SOURCING_EMAIL: ${{ secrets.E2E_SOURCING_EMAIL }}
      E2E_SOURCING_PASSWORD: ${{ secrets.E2E_SOURCING_PASSWORD }}
      E2E_AGENT_HUB_EMAIL: ${{ secrets.E2E_AGENT_HUB_EMAIL }}
      E2E_AGENT_HUB_PASSWORD: ${{ secrets.E2E_AGENT_HUB_PASSWORD }}
      E2E_HUB_DIRECTOR_EMAIL: ${{ secrets.E2E_HUB_DIRECTOR_EMAIL }}
      E2E_HUB_DIRECTOR_PASSWORD: ${{ secrets.E2E_HUB_DIRECTOR_PASSWORD }}
      E2E_AGENT_RELAIS_EMAIL: ${{ secrets.E2E_AGENT_RELAIS_EMAIL }}
      E2E_AGENT_RELAIS_PASSWORD: ${{ secrets.E2E_AGENT_RELAIS_PASSWORD }}
      E2E_AGENT_TRANSITAIRE_EMAIL: ${{ secrets.E2E_AGENT_TRANSITAIRE_EMAIL }}
      E2E_AGENT_TRANSITAIRE_PASSWORD: ${{ secrets.E2E_AGENT_TRANSITAIRE_PASSWORD }}
    steps:
      # Test code comes from the dispatched ref; the deployed SHA to match is
      # always origin/main (on main both are identical).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify E2E identity secrets before heavy Chromium installation
        run: node scripts/recette/staging-chromium-credentials-preflight.js
      - name: Pin expected deployment SHA
        shell: bash
        run: echo "E2E_EXPECTED_DEPLOY_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
      - name: Verify staging serves the pinned SHA before installing Chromium
        run: node scripts/recette/staging-chromium-deployment-preflight.js
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit actual staging in read-only Chromium
        env:
          SPEC_FILTER: ${{ env.E2E_CHROMIUM_SPEC_FILTER }}
        # SPEC_FILTER is passed through env (no expression injection in the script).
        run: npx playwright test --config=playwright.staging-canonical.config.js $SPEC_FILTER
      - name: Build graphs and coverage matrix even on failure
        if: always()
        run: node scripts/recette/summarize-staging-chromium.js
      - name: Publish report to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f test-results/staging-chromium/rapport.md ]; then
            cat test-results/staging-chromium/rapport.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive sanitized Hub Director result (no screenshots or browser traces)
        if: always() && env.E2E_CHROMIUM_SPEC_FILTER == 'hub-director-readonly'
        uses: actions/upload-artifact@v4
        with:
          name: hub-director-readonly-${{ github.run_id }}
          path: test-results/staging-chromium/evidence/hub-director-readonly.json
          retention-days: 30
          if-no-files-found: error
      - name: Archive staging evidence (captures, evidence json, report; traces are disabled)
        if: always() && env.E2E_CHROMIUM_SPEC_FILTER != 'hub-director-readonly'
        uses: actions/upload-artifact@v4
        with:
          name: real-canonical-chromium-${{ github.run_id }}
          path: |
            test-results/staging-chromium/rapport.md
            test-results/staging-chromium/evidence/**
            test-results/staging-chromium/live-proof/**
            test-results/staging-chromium/raw/**/*.png
            test-results/staging-chromium/raw/**/error-context.md
            test-results/staging-chromium/playwright.json
          retention-days: 14
          if-no-files-found: warn
