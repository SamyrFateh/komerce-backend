name: ING6 production pilot

on:
  push:
    branches:
      - ops/ing6-pilot-production
    paths:
      - .github/workflows/ing6-pilot-production.yml
      - scripts/ops-ing6-pilot-promote.js
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/ing6-pilot-production.yml
      - scripts/ops-ing6-pilot-promote.js

permissions:
  contents: read

jobs:
  pilot:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'ops/ing6-pilot-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 1c5c37ab-557b-41b1-885a-8b3ead573795
      RAILWAY_SERVICE_ID: 48ee010d-a1c3-4c47-9028-c1aacf90e00f
      RAILWAY_ENVIRONMENT_ID: 7a0ce7dc-93a0-4bfa-88c9-088f70e8883a

    steps:
      - name: Checkout isolated operations branch
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify Railway credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo 'RAILWAY_TOKEN repository secret is missing.'
            exit 42
          fi
          railway --version

      - name: Capture safe Railway CLI help
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== railway status --help ==='
            railway status --help || true
            echo '=== railway service --help ==='
            railway service --help || true
            echo '=== railway variables --help ==='
            railway variables --help || true
            echo '=== railway environment --help ==='
            railway environment --help || true
            echo '=== railway link --help ==='
            railway link --help || true
          } > /tmp/railway-cli-help.txt 2>&1

      - name: Upload safe CLI help
        uses: actions/upload-artifact@v4
        with:
          name: railway-cli-help
          path: /tmp/railway-cli-help.txt
          if-no-files-found: error

      - name: Stop before any database write
        run: exit 1
