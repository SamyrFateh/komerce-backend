name: ING6 production pilot

on:
  push:
    branches:
      - ops/ing6-pilot-production
    paths:
      - .github/workflows/ing6-pilot-production.yml
      - scripts/ops-ing6-pilot-promote.js
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/ing6-pilot-production.yml
      - scripts/ops-ing6-pilot-promote.js

permissions:
  contents: read

jobs:
  pilot:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'ops/ing6-pilot-production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 1c5c37ab-557b-41b1-885a-8b3ead573795
      RAILWAY_SERVICE_ID: 48ee010d-a1c3-4c47-9028-c1aacf90e00f
      RAILWAY_ENVIRONMENT_ID: 7a0ce7dc-93a0-4bfa-88c9-088f70e8883a

    steps:
      - name: Checkout isolated operations branch
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify Railway credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo 'RAILWAY_TOKEN repository secret is missing.'
            exit 42
          fi
          railway --version

      - name: Inspect database endpoint names without secrets
        shell: bash
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            node - <<'NODE' | tee /tmp/railway-db-endpoints.txt
          const selected = Object.keys(process.env)
            .filter((k) => /(DATABASE|PGHOST|PGPORT|RAILWAY.*(TCP|PROXY))/i.test(k))
            .sort();

          console.log('VARIABLE_NAMES');
          for (const key of selected) console.log(key);
          console.log('ENDPOINT_CLASSES');

          for (const key of selected) {
            const value = process.env[key];
            if (!value) continue;
            let host = null;
            let port = null;
            try {
              if (value.includes('://')) {
                const parsed = new URL(value);
                host = parsed.hostname;
                port = parsed.port || null;
              } else if (/HOST$/i.test(key)) {
                host = value;
              } else if (/PORT$/i.test(key)) {
                port = value;
              }
            } catch (_) {}

            if (host) {
              const kind = host.endsWith('.railway.internal') ? 'private' : 'public-or-external';
              console.log(`${key}: host-kind=${kind}; port-present=${Boolean(port)}`);
            } else if (port) {
              console.log(`${key}: port-present=true`);
            }
          }
          NODE

      - name: Upload safe database endpoint diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: railway-db-endpoint-names
          path: /tmp/railway-db-endpoints.txt
          if-no-files-found: error

      - name: Stop before any database write
        run: exit 1
