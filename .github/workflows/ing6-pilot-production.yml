name: ING6 production pilot

on:
  push:
    branches:
      - ops/ing6-pilot-production
    paths:
      - .github/workflows/ing6-pilot-production.yml
      - scripts/ops-ing6-pilot-promote.js
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/ing6-pilot-production.yml
      - scripts/ops-ing6-pilot-promote.js

permissions:
  contents: read

jobs:
  pilot:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'ops/ing6-pilot-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 1c5c37ab-557b-41b1-885a-8b3ead573795
      RAILWAY_ENVIRONMENT_ID: 7a0ce7dc-93a0-4bfa-88c9-088f70e8883a
      RAILWAY_POSTGRES_SERVICE_ID: 3b4520db-f7ce-43b4-b37c-acf58ec1bdcb

    steps:
      - name: Checkout isolated operations branch
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify Railway credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo 'RAILWAY_TOKEN repository secret is missing.'
            exit 42
          fi
          railway --version

      - name: Inspect Postgres endpoint variable names without secrets
        shell: bash
        run: |
          set -euo pipefail
          railway variable list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_POSTGRES_SERVICE_ID" \
            --json > /tmp/postgres-vars.json

          node - <<'NODE' > /tmp/postgres-endpoints-safe.txt
          const fs = require('fs');
          const vars = JSON.parse(fs.readFileSync('/tmp/postgres-vars.json', 'utf8'));
          const entries = Object.entries(vars).sort(([a], [b]) => a.localeCompare(b));

          console.log('POSTGRES_VARIABLE_NAMES');
          for (const [key] of entries) {
            if (/(DATABASE|PG|POSTGRES|TCP|PROXY|HOST|PORT|PUBLIC)/i.test(key)) {
              console.log(key);
            }
          }

          console.log('ENDPOINT_CLASSES');
          for (const [key, raw] of entries) {
            if (!/(DATABASE|PGHOST|RAILWAY.*(TCP|PROXY|PUBLIC)|HOST|PORT)/i.test(key)) continue;
            const value = String(raw ?? '');
            if (!value) continue;
            let host = null;
            let port = null;
            try {
              if (value.includes('://')) {
                const parsed = new URL(value);
                host = parsed.hostname;
                port = parsed.port || null;
              } else if (/HOST|DOMAIN/i.test(key)) {
                host = value;
              } else if (/PORT/i.test(key)) {
                port = value;
              }
            } catch (_) {}

            if (host) {
              const kind = host.endsWith('.railway.internal') ? 'private' : 'public-or-external';
              console.log(`${key}: host-kind=${kind}; port-present=${Boolean(port)}`);
            } else if (port) {
              console.log(`${key}: port-present=true`);
            }
          }
          NODE

      - name: Upload safe Postgres endpoint diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: railway-postgres-endpoints-safe
          path: /tmp/postgres-endpoints-safe.txt
          if-no-files-found: error

      - name: Stop before any database write
        run: exit 1
