name: ING6 production pilot

on:
  push:
    branches:
      - ops/ing6-pilot-production
    paths:
      - .github/workflows/ing6-pilot-production.yml
      - scripts/ops-ing6-pilot-promote.js
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/ing6-pilot-production.yml
      - scripts/ops-ing6-pilot-promote.js

permissions:
  contents: read

jobs:
  pilot:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'ops/ing6-pilot-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 1c5c37ab-557b-41b1-885a-8b3ead573795
      RAILWAY_ENVIRONMENT_ID: 7a0ce7dc-93a0-4bfa-88c9-088f70e8883a

    steps:
      - name: Checkout isolated operations branch
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify Railway credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo 'RAILWAY_TOKEN repository secret is missing.'
            exit 42
          fi
          railway --version

      - name: Discover project services without secrets
        shell: bash
        run: |
          set -euo pipefail
          railway status \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --json > /tmp/railway-status.json

          node - <<'NODE' > /tmp/railway-services-safe.txt
          const fs = require('fs');
          const root = JSON.parse(fs.readFileSync('/tmp/railway-status.json', 'utf8'));
          const rows = [];
          const seen = new Set();

          function walk(value, path = []) {
            if (Array.isArray(value)) {
              value.forEach((item, index) => walk(item, path.concat(index)));
              return;
            }
            if (!value || typeof value !== 'object') return;

            const id = typeof value.id === 'string' ? value.id : null;
            const name = typeof value.name === 'string' ? value.name : null;
            const serviceId = typeof value.serviceId === 'string' ? value.serviceId : null;
            const serviceName = typeof value.serviceName === 'string' ? value.serviceName : null;
            const candidateId = serviceId || id;
            const candidateName = serviceName || name;
            const pathText = path.join('.');
            const looksService = /service|deployment|resource/i.test(pathText)
              || serviceId || serviceName
              || /postgres|database|komerce|backend/i.test(candidateName || '');

            if (looksService && candidateId && candidateName) {
              const key = `${candidateId}:${candidateName}`;
              if (!seen.has(key)) {
                seen.add(key);
                rows.push({ id: candidateId, name: candidateName, path: pathText });
              }
            }

            for (const [key, child] of Object.entries(value)) {
              walk(child, path.concat(key));
            }
          }

          walk(root);
          console.log('PROJECT_SERVICES');
          for (const row of rows) {
            console.log(`${row.name}\t${row.id}\t${row.path}`);
          }
          NODE

      - name: Upload safe service discovery
        uses: actions/upload-artifact@v4
        with:
          name: railway-services-safe
          path: /tmp/railway-services-safe.txt
          if-no-files-found: error

      - name: Stop before any database write
        run: exit 1
