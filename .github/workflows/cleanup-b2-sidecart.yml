name: Cleanup B2 Side Cart Formatting

on:
  push:
    branches:
      - refactor/boutique-debt-zero-b2-side-cart

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boutique-debt-zero-b2-side-cart
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: public/boutique/package-lock.json
      - run: npm --prefix public/boutique ci
      - name: Normalize transferred owner block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/boutique/css/boutique-desktop.css')
          s = p.read_text(encoding='utf-8')
          start_marker = '   SIDE CART DESKTOP — Layout Temu pur'
          end_marker = '/* ── GARDE DESKTOP : le panier plein écran'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          section = s[start:end]
          section = section.replace(
              '   convergence visuelle finales sont owned par side-cart-desktop-polish.css ;',
              '   convergence visuelle finales sont portées par side-cart-desktop-polish.css ;'
          )
          section = re.sub(r'\n[ \t]+\n', '\n', section)
          section = re.sub(r'\n{3,}', '\n\n', section)
          p.write_text(s[:start] + section + s[end:], encoding='utf-8')
          PY
          npm --prefix public/boutique run deploy:css
      - name: Reprove ownership and ratchets
        run: |
          npm --prefix public/boutique test -- --runInBand tests/unit/side-cart-css-ownership.test.js
          npm --prefix public/boutique run check:css-guard
          npm --prefix public/boutique run check:css-specificity-guard
      - name: Commit formatting cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boutique/css/boutique-desktop.css public/boutique/css/dist/desktop.css public/boutique/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(boutique): normalize side-cart owner after transfer"
          git push origin HEAD:refactor/boutique-debt-zero-b2-side-cart

# one-shot cleanup harness; removed before PR
