name: Debt Zero body classes close v2

on:
  push:
    branches:
      - ci/debt-zero-body-classes

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: chore/debt-zero-body-classes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm --prefix public/boutique ci

      - name: Fix body-class gate semantics and remove dead CSS state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gate = Path('public/boutique/scripts/check-body-classes.js')
          src = gate.read_text(encoding='utf-8')

          src = src.replace(
              "  'k-view-group',\n]);",
              "  'k-view-group',\n  'k-view-komerce',\n]);",
              1,
          )

          old_comment = """  // Deux formes : document.body.classList.X et (rarement) body.classList.X\n  // On cherche les deux.\n  const bodyRe = /(?:document\\.body|(?<![a-zA-Z0-9_$])body)\\.classList\\.(add|remove|toggle|contains)\\s*\\(([^)]+)\\)/g;"""
          new_comment = """  // Uniquement les propriétaires explicites du vrai <body>.\n  // Ne jamais matcher une variable locale nommée `body` (ex. const body = dom.orderBody),\n  // sinon une mutation d'un composant est faussement classée comme état global.\n  const bodyRe = /(?:document\\.body|dom\\.body)\\.classList\\.(add|remove|toggle|contains)\\s*\\(([^)]+)\\)/g;"""
          if old_comment not in src:
              raise SystemExit('body regex anchor missing')
          src = src.replace(old_comment, new_comment, 1)

          marker = "  // ────────────────────────────────────────────────────────────────\n  // VÉRIFICATIONS"
          if marker not in src:
              raise SystemExit('verification marker missing')
          src = src.replace(
              marker,
              "  const hasDynamicViewAdd = dynamicOps.some(op =>\n"
              "    op.op === 'add' && /k-view-/.test(op.rawExpr || '')\n"
              "  );\n\n" + marker,
              1,
          )

          old_b2 = "if (hasRemove && !hasAdd && !hasToggle && !HTML_INIT_CLASSES.has(cls)) {"
          new_b2 = "if (hasRemove && !hasAdd && !hasToggle && !HTML_INIT_CLASSES.has(cls) && !(isViewClass && hasDynamicViewAdd)) {"
          if old_b2 not in src:
              raise SystemExit('B-2 anchor missing')
          src = src.replace(old_b2, new_b2, 1)
          gate.write_text(src, encoding='utf-8')

          css = Path('public/boutique/css/cart.css')
          csrc = css.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n/\* « Numéro changé \? · Ce n\'est pas vous \? » — une seule ligne \*/\n'
              r'\.k-ck-id-btns-row\s*\{.*?\n\}\n'
              r'\.k-ck-id-sep\s*\{.*?\n\}\n\n'
              r'/\* §3 doctrine : body\.ck-is-me posé par JS — CSS gère la visibilité \*/\n'
              r'body\.ck-is-me \.k-ck-id-btns-row \{ display: flex; \}\n',
              re.S,
          )
          csrc, count = pattern.subn('\n', csrc, count=1)
          if count != 1:
              raise SystemExit(f'legacy ck-is-me block count={count}')
          if 'body.ck-is-me' in csrc or '.k-ck-id-btns-row' in csrc:
              raise SystemExit('legacy ck-is-me selectors remain')
          css.write_text(csrc, encoding='utf-8')

          tests = Path('public/boutique/tests/gates/gates-detect.test.js')
          tsrc = tests.read_text(encoding='utf-8')
          section = re.compile(
              r"describe\('gate check:body-classes', \(\) => \{.*?\n\}\);\n\n"
              r"// ══════════════════════════════════════════════════════════════════════\n"
              r"// 5\. check:css-dist-only",
              re.S,
          )
          replacement = r'''describe('gate check:body-classes', () => {
            const TARGET = path.join(ROOT, 'js', 'anti-fouc.js');

            test('état nominal → zéro warning body-class', () => {
              const r = runGate('check-body-classes.js');
              const out = r.stdout + r.stderr;
              expect(r.code).toBe(0);
              expect(out).toMatch(/Toutes les classes body sont correctement appairées/);
              expect(out).not.toMatch(/\[B-2\]|\[B-3\]|Avertissements/);
            });

            test('une variable locale nommée body ne devient jamais document.body', () => {
              backup(TARGET);
              fs.appendFileSync(TARGET, `
          {
            const body = document.createElement('div');
            body.classList.remove('k-local-component-state');
          }
          `);
              const r = runGate('check-body-classes.js');
              const out = r.stdout + r.stderr;
              expect(r.code).toBe(0);
              expect(out).not.toMatch(/k-local-component-state/);
            });

            test('un vrai document.body add sans cleanup reste bloquant B-1', () => {
              backup(TARGET);
              fs.appendFileSync(TARGET, "\ndocument.body.classList.add('k-body-gate-detect');\n");
              const r = runGate('check-body-classes.js');
              const out = r.stdout + r.stderr;
              expect(r.code).toBe(1);
              expect(out).toMatch(/\[B-1\].*k-body-gate-detect|k-body-gate-detect.*B-1/s);
            });
          });

          // ══════════════════════════════════════════════════════════════════════
          // 5. check:css-dist-only'''
          tsrc, count = section.subn(lambda _: replacement, tsrc, count=1)
          if count != 1:
              raise SystemExit(f'body-class gate test section count={count}')
          tests.write_text(tsrc, encoding='utf-8')
          PY

      - name: Prove body-class gate regression tests
        run: npm --prefix public/boutique run gate:detect -- tests/gates/gates-detect.test.js -t "gate check:body-classes"

      - name: Prove body-class debt is zero
        run: |
          node public/boutique/scripts/check-body-classes.js | tee /tmp/body-classes.txt
          grep -q "Toutes les classes body sont correctement appairées" /tmp/body-classes.txt
          ! grep -Eq '\[B-1\]|\[B-2\]|\[B-3\]|Avertissements' /tmp/body-classes.txt

      - name: Prove Boutique source gates
        run: |
          node public/boutique/scripts/check-important.js --strict
          node public/boutique/scripts/check-breakpoints.js --strict
          node public/boutique/scripts/check-css-vars.js --strict
          node public/boutique/scripts/check-zindex-contract.js --strict
          node public/boutique/scripts/check-sticky-integrity.js --strict
          node public/boutique/scripts/audit-boutique-arch.js
          npm --prefix public/boutique run audit:registry
          npm --prefix public/boutique run feature:guard:strict

      - name: Refresh only proven body-class Gate Findings source
        run: |
          cp docs/GATE_FINDINGS.json /tmp/gate-findings-baseline.json
          set +e
          node scripts/gen-gate-findings.js
          generator_exit=$?
          set -e
          cp docs/GATE_FINDINGS.json /tmp/gate-findings-candidate.json
          cp /tmp/gate-findings-baseline.json docs/GATE_FINDINGS.json
          node - <<'NODE'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync('/tmp/gate-findings-baseline.json', 'utf8'));
          const candidate = JSON.parse(fs.readFileSync('/tmp/gate-findings-candidate.json', 'utf8'));
          const bodyGate = 'check:body-classes';
          const candidateBodySource = candidate.sources.find((s) => s.gate === bodyGate);
          const candidateBodyFindings = candidate.findings.filter((f) => f.gate === bodyGate);
          const baselineNonBody = baseline.findings.filter((f) => f.gate !== bodyGate);
          const candidateNonBody = candidate.findings.filter((f) => f.gate !== bodyGate);
          const failedCandidateSources = candidate.sources.filter((s) => s.status === 'failed').map((s) => s.gate);

          if (!candidateBodySource || candidateBodySource.status !== 'ok' || candidateBodySource.exitCode !== 0 || candidateBodySource.warningCount !== 0 || candidateBodySource.errorCount !== 0) {
            throw new Error(`body source not clean: ${JSON.stringify(candidateBodySource)}`);
          }
          if (candidateBodyFindings.length !== 0) throw new Error(`body findings remain: ${candidateBodyFindings.length}`);
          if (JSON.stringify(candidateNonBody) !== JSON.stringify(baselineNonBody)) {
            throw new Error('non-body findings changed; partial refresh refused');
          }
          if (failedCandidateSources.length !== 1 || failedCandidateSources[0] !== 'check:css-guard') {
            throw new Error(`unexpected full-generator failure set: ${failedCandidateSources.join(',')}`);
          }

          const bodyIndex = baseline.sources.findIndex((s) => s.gate === bodyGate);
          if (bodyIndex < 0) throw new Error('baseline body source missing');
          baseline.sources[bodyIndex] = candidateBodySource;
          baseline.findings = baselineNonBody;
          baseline.generatedAt = candidate.generatedAt;

          if (baseline.contract?.attributableSources !== 18) throw new Error('baseline attribution contract regressed');
          if (baseline.findings.length !== 30) throw new Error(`expected 30 remaining findings, got ${baseline.findings.length}`);
          if (baseline.findings.some((f) => f.gate === bodyGate)) throw new Error('body finding survived partial refresh');

          fs.writeFileSync('docs/GATE_FINDINGS.json', JSON.stringify(baseline, null, 2) + '\n');
          console.log(`full_generator_expected_exit=${process.env.GENERATOR_EXIT || 'nonzero-css-guard'}`);
          console.log(`preserved_attributable_sources=${baseline.contract.attributableSources}`);
          console.log(`remaining_findings=${baseline.findings.length} body_class_findings=0`);
          NODE
          test "$generator_exit" -ne 0

      - name: Refresh dependent projections
        run: |
          npm run business-graph:gen
          npm run feature:360:gen

      - name: Standard governance gates
        run: |
          node scripts/feature-registry-check.js
          node scripts/feature-guard.js --strict
          npm run business-graph:check
          npm run feature:360:check
          node scripts/code-quality-gate.js --strict
          node scripts/contract-check.js
          npm run security:360:check
          git diff --check

      - name: Commit verified body-class closure
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(boutique): fermer la dette body classes"
          git push origin HEAD:chore/debt-zero-body-classes
