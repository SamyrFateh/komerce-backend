# ============================================================
# KOMERCE — GitHub Action : Analyse d'impact sur les PR
# Bloque automatiquement les PR à haut risque (score >= 70)
# ============================================================

name: '🛡️ Impact Check'

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: impact-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  impact-analysis:
    name: '🔍 Analyse d''impact'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history pour git diff

      - name: '🟢 Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: '🔍 Exécuter l''analyse d''impact'
        id: impact
        run: |
          node scripts/impact-check.js --diff=origin/${{ github.base_ref }} --ci --json > impact-result.json 2>&1 || true
          
          # Extraire le score et le niveau du JSON
          SCORE=$(cat impact-result.json | node -e "
            let data = '';
            process.stdin.on('data', d => data += d);
            process.stdin.on('end', () => {
              try {
                // Trouver le JSON dans la sortie (après la sortie console)
                const jsonMatch = data.match(/\{[\s\S]*\"score\"[\s\S]*\}/);
                if (jsonMatch) {
                  const json = JSON.parse(jsonMatch[0]);
                  console.log(json.score);
                } else {
                  console.log('0');
                }
              } catch { console.log('0'); }
            });
          ")
          
          LEVEL=$(cat impact-result.json | node -e "
            let data = '';
            process.stdin.on('data', d => data += d);
            process.stdin.on('end', () => {
              try {
                const jsonMatch = data.match(/\{[\s\S]*\"level\"[\s\S]*\}/);
                if (jsonMatch) {
                  const json = JSON.parse(jsonMatch[0]);
                  console.log(json.level);
                } else {
                  console.log('SAFE');
                }
              } catch { console.log('SAFE'); }
            });
          ")
          
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "📊 Score: $SCORE — Niveau: $LEVEL"

      - name: '💬 Commenter la PR'
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '';
            
            // Lire le rapport généré
            try {
              comment = fs.readFileSync('.impact-report.md', 'utf-8');
            } catch {
              comment = '## ℹ️ Analyse d\'impact\n\nAucun rapport généré — vérifiez les logs.';
            }
            
            // Chercher un commentaire existant pour le mettre à jour
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(c => 
              c.body.includes('Analyse d\'impact') && 
              c.body.includes('coffre-fort Komerce')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: '🚫 Bloquer si score BLOCK'
        if: steps.impact.outputs.level == 'BLOCK'
        run: |
          echo "::error::🔴 Score de risque ${{ steps.impact.outputs.score }}/100 — Merge bloqué !"
          echo ""
          echo "Ce changement présente un risque trop élevé pour être mergé automatiquement."
          echo "Veuillez :"
          echo "  1. Corriger les alertes de sécurité"
          echo "  2. Réduire la portée des changements"
          echo "  3. Demander une revue manuelle approfondie"
          exit 1

      - name: '⚠️ Avertir si score REVIEW'
        if: steps.impact.outputs.level == 'REVIEW'
        run: |
          echo "::warning::🟡 Score de risque ${{ steps.impact.outputs.score }}/100 — Revue manuelle requise"
          echo ""
          echo "Ce changement nécessite une revue approfondie avant merge."

      - name: '✅ Score SAFE'
        if: steps.impact.outputs.level == 'SAFE'
        run: |
          echo "::notice::🟢 Score de risque ${{ steps.impact.outputs.score }}/100 — Aucun risque majeur"
