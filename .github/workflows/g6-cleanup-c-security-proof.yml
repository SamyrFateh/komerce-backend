name: G6 class C — regenerate security proof with protected preflight
on:
  pull_request:
    paths:
      - '.github/workflows/g6-cleanup-c-security-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/g6-cleanup-po-engaged'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: test
      KOMERCE_DISABLE_CRONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate genuine Security 360 snapshot and baseline
        run: npm run security:360:save
      - name: Verify all mandatory preflight gates before pushing
        run: npm run pr:preflight
      - name: Print generated deterministic files as numbered lines for review
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const [key,p] of [['JSON','docs/SECURITY_360.json'],['MD','docs/SECURITY_360.md'],['BASE','scripts/.security-360-baseline.json']]){
            const lines=fs.readFileSync(p,'utf8').split('\n');
            for(let i=0;i<lines.length;i++) console.log('G6SEC'+key+'_'+i+':'+lines[i]);
          }
          NODE
