name: U0 remediation index once

on:
  push:
    branches:
      - fix/u0-debt-zero-radar-governance

permissions:
  contents: write

concurrency:
  group: u0-remediation-index-once
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/u0-debt-zero-radar-governance
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate canonical remediation index
        run: |
          npm run agent:remediation:gen
          node scripts/check-agent-remediation-contract.js
          node scripts/gen-agent-remediation-index.js --check

      - name: Persist index only
        run: |
          git restore --source=HEAD -- .github/workflows/u0-remediation-index-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AGENT_REMEDIATION_INDEX.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'AGENT_REMEDIATION_INDEX.json already fresh.'
            exit 0
          fi
          git commit --no-verify -m "chore(governance): refresh agent remediation index"
          git push origin HEAD:fix/u0-debt-zero-radar-governance
