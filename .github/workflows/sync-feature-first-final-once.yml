name: Sync Final Feature First Once

on:
  push:
    branches: [governance/enforce-feature-first]

permissions:
  contents: write
  statuses: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[feature-first-final]') }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      ADMIN_PASSWORD: ci-test-admin
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      QR_SECRET: ci-test-qr-secret
      AUTHKEY_API_KEY: ci-dummy
      PAYPAL_CLIENT_ID: ci-dummy
      PAYPAL_CLIENT_SECRET: ci-dummy
      PAYPAL_WEBHOOK_ID: ci-dummy
      META_WA_APP_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: governance/enforce-feature-first
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"feature-first-final-sync\",\"description\":\"Synchronizing final feature ownership\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm --prefix public/boutique ci
      - run: rm -f .github/workflows/sync-feature-first-final-once.yml
      - run: npm --prefix public/boutique run bundle:css
      - run: npm --prefix public/boutique test -- --runInBand tests/unit/modal-product-lot4-hybrid.test.js tests/unit/modal-v3-convergence-invariants.test.js
      - run: npm run arch:gen
      - run: npm run dashboards:360
      - run: npm run boutique:360
      - run: npm run business-graph:gen
      - run: npm run meta:graph
      - run: npm run feature:360:gen
      - run: npm run feature:360:check
      - run: npm run map:check
      - name: Commit final governed state
        id: commit
        run: |
          git config user.name "Komerce Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs(governance): sync final Feature First ownership [feature-first-final]"
          git push origin HEAD:governance/enforce-feature-first
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"feature-first-final-sync\",\"description\":\"Final ownership and maps passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
