name: Showcase catalog media audit

on:
  pull_request:
    paths:
      - 'scripts/showcase-catalog.js'
      - 'tests/unit/showcase-catalog.test.js'
      - 'db/seed-products-v2.json'
      - '.github/workflows/showcase-catalog-media-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Unit + current Cloudinary media health
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Showcase catalog unit tests
        run: npx jest tests/unit/showcase-catalog.test.js --runInBand

      - name: Diagnose first Cloudinary asset
        run: |
          node - <<'NODE'
          const products = require('./db/seed-products-v2.json');
          const url = products[0].image_url;

          async function inspect(label, headers = {}) {
            try {
              const response = await fetch(url, { method: 'GET', headers, redirect: 'follow' });
              const buffer = Buffer.from(await response.arrayBuffer());
              console.log(JSON.stringify({
                label,
                url,
                status: response.status,
                ok: response.ok,
                type: response.headers.get('content-type'),
                content_length: response.headers.get('content-length'),
                content_range: response.headers.get('content-range'),
                bytes_received: buffer.length,
                body_preview: buffer.toString('utf8', 0, Math.min(120, buffer.length)),
                magic: buffer.subarray(0, 16).toString('hex'),
              }, null, 2));
            } catch (error) {
              console.log(JSON.stringify({ label, url, error: error.message, cause: error.cause?.message }, null, 2));
            }
          }

          (async () => {
            await inspect('plain-get');
            await inspect('range-get', { Range: 'bytes=0-4095' });
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Measure replacement source pools
        run: |
          node - <<'NODE'
          async function getJson(url) {
            const response = await fetch(url, { headers: { 'User-Agent': 'KomerceShowcaseSourceAudit/1.0' } });
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            return response.json();
          }

          function imageUrls(items, field) {
            return items.flatMap((item) => field(item)).filter(Boolean);
          }

          (async () => {
            const dummy = await getJson('https://dummyjson.com/products?limit=0');
            const platzi = await getJson('https://api.escuelajs.co/api/v1/products?offset=0&limit=500');
            const dummyProducts = dummy.products || [];
            const platziProducts = Array.isArray(platzi) ? platzi : [];
            const dummyImages = imageUrls(dummyProducts, (p) => [p.thumbnail, ...(p.images || [])]);
            const platziImages = imageUrls(platziProducts, (p) => p.images || []);

            console.log(JSON.stringify({
              dummyjson: {
                products: dummyProducts.length,
                reported_total: dummy.total,
                image_refs: dummyImages.length,
                unique_images: new Set(dummyImages).size,
                categories: new Set(dummyProducts.map((p) => p.category)).size,
              },
              platzi: {
                products: platziProducts.length,
                image_refs: platziImages.length,
                unique_images: new Set(platziImages).size,
                categories: new Set(platziProducts.map((p) => p.category?.name).filter(Boolean)).size,
              },
              combined_products: dummyProducts.length + platziProducts.length,
            }, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      # Preuve réseau sans secret : on audite le seed historique de 467 produits
      # tel qu'il est servi aujourd'hui. Ce passage est volontairement non-strict
      # car l'objectif de cette étape est de mesurer la dette initiale (URLs
      # /image/fetch/, assets cassés, etc.). Le manifest V1 produit par `prepare`
      # devra, lui, passer `audit --network --strict` avant tout seed staging.
      - name: Audit current 467-product media pool
        run: |
          node scripts/showcase-catalog.js audit \
            --input db/seed-products-v2.json \
            --manifest /tmp/showcase-manifest-not-built.json \
            --target 467 \
            --network \
            --concurrency 12
