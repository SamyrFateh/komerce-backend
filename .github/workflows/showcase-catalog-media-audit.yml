name: Showcase catalog media audit

on:
  pull_request:
    paths:
      - 'scripts/showcase-catalog.js'
      - 'tests/unit/showcase-catalog.test.js'
      - 'db/seed-products-v2.json'
      - '.github/workflows/showcase-catalog-media-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: 500-product source + media proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Showcase catalog unit tests
        run: npx jest tests/unit/showcase-catalog.test.js --runInBand

      # Dette initiale explicitée : le cloud historique n'est plus une source.
      - name: Prove legacy Cloudinary is unavailable
        run: |
          node - <<'NODE'
          const products = require('./db/seed-products-v2.json');
          const url = products[0].image_url;
          (async () => {
            const response = await fetch(url, { redirect: 'follow' });
            console.log(JSON.stringify({
              url,
              status: response.status,
              ok: response.ok,
              type: response.headers.get('content-type'),
            }, null, 2));
            if (response.status !== 401) {
              console.log('Legacy cloud state changed; re-evaluate whether old media can be recovered.');
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      # Gate sans secret : 500 parents distincts ET hero réellement chargeable.
      - name: Build and network-verify 500-product source catalogue
        run: |
          node scripts/showcase-catalog.js source \
            --target 500 \
            --source-manifest /tmp/showcase-catalog-v1-source.json \
            --network \
            --strict \
            --concurrency 12

      - name: Source catalogue distribution
        run: |
          node - <<'NODE'
          const products = require('/tmp/showcase-catalog-v1-source.json');
          const bySource = {};
          const byCategory = {};
          let galleryRich = 0;
          for (const p of products) {
            const source = String(p.source || '').split(':')[0] || 'unknown';
            bySource[source] = (bySource[source] || 0) + 1;
            byCategory[p.category] = (byCategory[p.category] || 0) + 1;
            if ((p.images || []).length >= 2) galleryRich += 1;
          }
          console.log(JSON.stringify({
            products: products.length,
            unique_refs: new Set(products.map((p) => p.product_ref)).size,
            unique_heroes: new Set(products.map((p) => p.image_url)).size,
            gallery_rich_products: galleryRich,
            by_source: bySource,
            by_category: byCategory,
          }, null, 2));
          if (products.length !== 500) process.exitCode = 1;
          if (new Set(products.map((p) => p.image_url)).size !== 500) process.exitCode = 1;
          NODE

      - name: Upload source proof
        uses: actions/upload-artifact@v4
        with:
          name: showcase-catalog-v1-source
          path: /tmp/showcase-catalog-v1-source.json
          if-no-files-found: error
          retention-days: 7
