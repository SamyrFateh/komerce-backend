name: Temporary refresh market operator projections

on:
  push:
    branches:
      - feat/market-operator-manager-provisioning

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-contract-generation-only-market-operator
      META_WA_APP_SECRET: ci-contract-generation-only-market-operator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-operator-manager-provisioning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run contract:generate
      - run: npm run security:360
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contract/openapi.json docs/contract/DEBT.md docs/SECURITY_360.json docs/SECURITY_360.md
          git commit -m "chore(governance): refresh market operator projections"
          git push origin HEAD:feat/market-operator-manager-provisioning
