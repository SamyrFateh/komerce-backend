name: Order-wave branch preflight (temporary)
on:
  push:
    branches:
      - feat/staging-order-wave-reference
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-wave-branch-preflight
  cancel-in-progress: true

jobs:
  wave-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KOMERCE_ENV: staging
      KOMERCE_ORDER_WAVES_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Feature First owner projections
        run: |
          npm run agent:context -- --pack service --feature orders
          npm run agent:context -- --pack service --feature logistics
          npm run arch:impact -- services/order-checkout-service.js
          npm run arch:impact -- services/relais-mutation-service.js
      - name: Targeted unit tests
        run: npx jest --runInBand --no-coverage tests/unit/order-delivery-wave-service.test.js tests/unit/relais-short-code.test.js tests/unit/order-checkout-persistence.test.js tests/unit/pickup-collection-recorder.test.js tests/unit/order-checkout-service.test.js tests/unit/hub-operations.test.js tests/unit/hub-bag-box-ui-contract.test.js tests/unit/admin-operations-workspace-route.test.js
      - name: Canonical PR preflight
        run: npm run pr:preflight

  migration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: komerce_wave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d komerce_wave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/komerce_wave
      KOMERCE_ORDER_WAVE_PG_ISOLATED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Execute migration 426 twice and verify uniqueness against PostgreSQL 16
        run: npx jest --runInBand --no-coverage tests/integration/order-delivery-wave-migration-postgres.test.js
