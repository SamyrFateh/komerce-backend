name: Order-wave branch preflight (temporary)
on:
  push:
    branches:
      - feat/staging-order-wave-reference
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KOMERCE_ENV: staging
      KOMERCE_ORDER_WAVES_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Feature First owner projections
        run: |
          npm run agent:context -- --pack service --feature orders
          npm run agent:context -- --pack service --feature logistics
          npm run arch:impact -- services/order-checkout-service.js
          npm run arch:impact -- services/relais-mutation-service.js
      - name: Targeted unit tests
        run: npx jest --runInBand --no-coverage tests/unit/order-delivery-wave-service.test.js tests/unit/relais-short-code.test.js tests/unit/order-checkout-persistence.test.js tests/unit/pickup-collection-recorder.test.js
      - name: Canonical PR preflight
        run: npm run pr:preflight
