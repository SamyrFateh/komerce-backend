name: G6 P3 — restore E2E relay assignment after failed Chromium attempt
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  restore:
    if: >-
      github.repository == 'SamyrFateh/komerce-backend' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[staging-op] g6-p3-restore-relay'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
      KOMERCE_ENV: staging
      KOMERCE_TARGET_ENV: staging
      KOMERCE_DISABLE_CRONS: 'true'
      EXPECTED_RAILWAY_ENVIRONMENT: staging
      STAGING_BASE_URL: https://komerce-backend-production.up.railway.app
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      PGOPTIONS: ''
      E2E_AGENT_RELAIS_EMAIL: ${{ secrets.E2E_AGENT_RELAIS_EMAIL }}
      RELAY_MODE: restore
      RELAY_RESTORE_ID: 4c3ae087-0a64-4ce1-8015-0d2d08d415c0
      RELAY_APPLY: '1'
      RELAY_CONFIRMATION: REASSIGN-E2E-RELAY
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify staging target
        run: |
          node scripts/recette/resolve-staging-deploy-pin.js
          node scripts/recette/target-guard.js
      - name: Restore original dedicated E2E relay assignment
        run: node scripts/recette/staging-e2e-relay-reassign.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-p3-relay-restore-${{ github.run_id }}
          path: test-results/relay-reassign/report.json
          if-no-files-found: warn
