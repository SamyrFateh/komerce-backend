name: Lot 2B Boutique bootstrap proof

on:
  push:
    branches:
      - agent/lot2b-pr-enforcement-boutique

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            public/boutique/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install Boutique dependencies
        run: npm --prefix public/boutique ci

      - name: Audit generic JS quality
        run: node scripts/code-quality-gate.js --strict

      - name: Audit CSS source gates
        run: |
          node public/boutique/scripts/check-important.js --strict
          node public/boutique/scripts/check-breakpoints.js --strict
          node public/boutique/scripts/check-css-vars.js --strict
          node public/boutique/scripts/check-zindex-contract.js --strict
          node public/boutique/scripts/check-sticky-integrity.js --strict

      - name: Audit JS source gates
        run: |
          node public/boutique/scripts/check-js-imports.js
          node public/boutique/scripts/check-no-css-injection.js

      - name: Audit HTML and body-class gates
        run: |
          node public/boutique/scripts/check-html-balance.js
          node public/boutique/scripts/check-body-classes.js

      - name: Audit Boutique architecture
        run: node public/boutique/scripts/audit-boutique-arch.js

      - name: Audit sanitize doctrine in observation mode
        run: node scripts/arch-doctrine-sanitize-check.js --all public/boutique/js

      - name: Prove real Boutique related-test resolution
        run: node scripts/run-staged-related-tests.js --files "public/boutique/js/b-cart.js"

      - name: Prove zero mutation
        run: git diff --exit-code
