name: tmp showcase binary diagnostic

on:
  pull_request:
    branches:
      - tmp/showcase-binary-diagnostic-base

permissions:
  contents: read

jobs:
  inspect-atlases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Inspect committed showcase atlases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import hashlib

          paths = [
              Path('public/boutique/categories/komerce-showcase-v1-main.webp'),
              Path('public/boutique/categories/komerce-showcase-v1-mode.webp'),
          ]
          for p in paths:
              raw = p.read_bytes()
              print(f'=== {p} ===')
              print('bytes', len(raw))
              print('sha256', hashlib.sha256(raw).hexdigest())
              im = Image.open(p).convert('RGBA')
              print('size', im.size, 'mode', im.mode)
              alpha = im.getchannel('A')
              print('alpha_extrema', alpha.getextrema(), 'whole_bbox', alpha.getbbox())
              w,h = im.size
              assert (w,h) == (288,192), (w,h)
              cw,ch = w//3,h//2
              for row in range(2):
                  for col in range(3):
                      box=(col*cw,row*ch,(col+1)*cw,(row+1)*ch)
                      cell=im.crop(box)
                      a=cell.getchannel('A')
                      bbox=a.getbbox()
                      nonzero=sum(1 for v in a.getdata() if v)
                      opaque=sum(1 for v in a.getdata() if v >= 240)
                      rgb=cell.convert('RGB')
                      mean=tuple(round(v,1) for v in ImageStat.Stat(rgb, mask=a).mean) if bbox else None
                      print(f'cell {col},{row}: alpha={a.getextrema()} bbox={bbox} nonzero={nonzero} opaque={opaque} rgb_mean={mean}')
              print()
          PY
