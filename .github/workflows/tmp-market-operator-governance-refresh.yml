name: Temporary market operator governance refresh

on:
  push:
    branches:
      - feat/market-operator-country-dashboards

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-operator-country-dashboards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run business-graph:gen
      - run: node scripts/gen-feature-360.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BUSINESS_FEATURE_GRAPH.json docs/BUSINESS_FEATURE_GRAPH.md docs/O6_INVENTORY.md docs/FEATURE_360.json docs/FEATURE_360.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(governance): refresh country operator projections"
          git push origin HEAD:feat/market-operator-country-dashboards
