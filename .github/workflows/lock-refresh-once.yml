name: One-off npm lock refresh

on:
  push:
    branches:
      - fix/debt-paydown-npm-contract-security

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-paydown-npm-contract-security
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Refresh lock with npm security fix
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Prove qs is patched
        run: |
          node -e "const l=require('./package-lock.json'); const v=l.packages['node_modules/qs']?.version; console.log('qs='+v); if (!v || v === '6.15.3') process.exit(1)"
      - name: Commit generated lock and remove this one-off workflow
        run: |
          git config user.name "komerce-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/lock-refresh-once.yml
          git commit -m "fix(deps): refresh lock after npm audit"
          git push origin HEAD:fix/debt-paydown-npm-contract-security
