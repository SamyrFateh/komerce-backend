name: One-off npm lock refresh

on:
  push:
    branches:
      - fix/debt-paydown-npm-contract-security

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-paydown-npm-contract-security
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Pin patched qs outside Express 4 stale semver window
        run: |
          npm pkg set overrides.qs=6.16.0
          npm install --package-lock-only --ignore-scripts
      - name: Prove npm debt is zero
        run: |
          node -e "const l=require('./package-lock.json'); const v=l.packages['node_modules/qs']?.version; console.log('qs='+v); if (v !== '6.16.0') process.exit(1)"
          npm audit --audit-level=moderate
      - name: Commit generated dependency resolution and remove this one-off workflow
        run: |
          git config user.name "komerce-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/lock-refresh-once.yml
          git commit -m "fix(deps): force patched qs 6.16.0"
          git push origin HEAD:fix/debt-paydown-npm-contract-security
